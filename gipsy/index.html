<!DOCTYPE html><html lang="zh"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Gipsy Danger 危险流浪者 · 3D模型</title>
<style>*{margin:0;padding:0;overflow:hidden}body{background:#0a0a12}canvas{display:block;width:100vw;height:100vh}
#title{position:fixed;top:18px;left:50%;transform:translateX(-50%);color:#fff;font-size:20px;font-weight:900;z-index:10;letter-spacing:3px;pointer-events:none;text-align:center}
#title span{background:linear-gradient(135deg,#fc0,#f80);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#info{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.3);font-size:11px;pointer-events:none;z-index:10}
</style></head><body>
<div id="title">GIPSY DANGER<br><span>危险流浪者</span></div>
<div id="info">拖动旋转 · 滚轮缩放 · 右键平移</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

var scene=new THREE.Scene();
scene.background=new THREE.Color(0x0a0a12);
scene.fog=new THREE.Fog(0x0a0a12,15,50);

var cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.3,60);
cam.position.set(7,5.5,9);cam.lookAt(0,3.5,0);

var ren=new THREE.WebGLRenderer({antialias:true});
ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,2));
ren.shadowMap.enabled=true;ren.shadowMap.type=THREE.PCFSoftShadowMap;
ren.toneMapping=THREE.ACESFilmicToneMapping;ren.toneMappingExposure=1.2;
document.body.appendChild(ren.domElement);

var ctrl=new OrbitControls(cam,ren.domElement);
ctrl.target.set(0,3.5,0);ctrl.enableDamping=true;ctrl.dampingFactor=0.08;
ctrl.minDistance=3;ctrl.maxDistance=18;ctrl.maxPolarAngle=Math.PI*0.75;ctrl.update();

// LIGHTS
scene.add(new THREE.AmbientLight(0x334466,0.6));
var key=new THREE.DirectionalLight(0xffffff,1.5);key.position.set(8,10,6);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);key.shadow.camera.near=0.5;key.shadow.camera.far=40;
key.shadow.camera.left=-12;key.shadow.camera.right=12;key.shadow.camera.top=12;key.shadow.camera.bottom=-12;
scene.add(key);
scene.add(new THREE.DirectionalLight(0x4466ff,0.5)).position.set(-5,4,-4);
scene.add(new THREE.DirectionalLight(0xff8844,0.4)).position.set(0,3,7);
var rL=new THREE.PointLight(0xff6600,3,6);rL.position.set(0,3.2,1.3);scene.add(rL);
var vL=new THREE.PointLight(0x4488ff,2,4);vL.position.set(0,5.2,1.8);scene.add(vL);

// GROUND
var gf=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({color:0x111118,roughness:0.6,metalness:0.3}));
gf.rotation.x=-Math.PI/2;gf.receiveShadow=true;scene.add(gf);
scene.add(new THREE.GridHelper(20,20,0x333344,0x111122)).position.y=0.01;

// === MATERIALS ===
var mm={};
mm.blue=new THREE.MeshStandardMaterial({color:0x2a5a8c,roughness:0.28,metalness:0.72});
mm.dark=new THREE.MeshStandardMaterial({color:0x1a1a2e,roughness:0.35,metalness:0.65});
mm.silver=new THREE.MeshStandardMaterial({color:0x8a8a9a,roughness:0.22,metalness:0.82});
mm.gold=new THREE.MeshStandardMaterial({color:0xcc8800,roughness:0.18,metalness:0.9});
mm.black=new THREE.MeshStandardMaterial({color:0x080810,roughness:0.45,metalness:0.3});
mm.orange=new THREE.MeshStandardMaterial({color:0xff6600,emissive:0xff4400,emissiveIntensity:0.7,roughness:0.3,metalness:0.4});
mm.gBlue=new THREE.MeshStandardMaterial({color:0x4488ff,emissive:0x2266ff,emissiveIntensity:0.9,roughness:0.1,metalness:0.2});
mm.hydr=new THREE.MeshStandardMaterial({color:0x664422,roughness:0.35,metalness:0.55});
mm.blade=new THREE.MeshStandardMaterial({color:0xeeeeff,emissive:0x4466ff,emissiveIntensity:0.6,roughness:0.03,metalness:0.95});

var bot=new THREE.Group();

function B(w,h,d,mat,x,y,z,rx,ry,rz,p){p=p||bot;var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);if(rx)m.rotation.x=rx;if(ry)m.rotation.y=ry;if(rz)m.rotation.z=rz;m.castShadow=true;m.receiveShadow=true;p.add(m);return m}
function Y(rt,rb,h,S,mat,x,y,z,rx,rz,p){p=p||bot;var m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,S),mat);m.position.set(x,y,z);if(rx)m.rotation.x=rx;if(rz)m.rotation.z=rz;m.castShadow=true;m.receiveShadow=true;p.add(m);return m}

// === LEGS ===
function leg(sx){
  var L=new THREE.Group();
  Y(0.38,0.43,1.9,8,mm.blue,0,1.5,0,0,0,L); // thigh
  Y(0.32,0.37,0.45,8,mm.silver,0,0.4,0,0,0,L); // knee
  Y(0.3,0.35,1.7,8,mm.blue,0,-0.5,0,0,0,L); // shin
  B(0.38,0.28,0.65,mm.dark,0,-1.2,-0.5,0,0,0,L); // shin plate
  B(0.55,0.14,0.75,mm.dark,0,1.9,0.2,0,0,0,L); // thigh armor
  B(0.28,0.38,0.28,mm.silver,0,0.4,0.38,0,0,0,L); // knee guard
  B(0.52,0.28,1.05,mm.dark,0,-1.55,0.2,0,0,0,L); // foot
  B(0.58,0.18,0.4,mm.silver,0,-1.4,0.55,0,0,0,L); // toe
  // Piston lines on shin
  for(var i=0;i<3;i++)B(0.04,0.9,0.04,mm.gold,0.15,-0.3+i*0.05,0.25,0,0,0,L);
  L.position.set(sx*0.75,0,0);
  return L;
}

// === TORSO ===
var T=new THREE.Group();
// Main chest (V-shape via tapered boxes)
B(1.8,0.15,0.55,mm.blue,0,3.3,0,0,0,0,T); // top chest plate
B(1.6,0.4,0.55,mm.blue,0,2.8,0,0,0,0,T);
B(1.35,0.5,0.55,mm.blue,0,2.2,0,0,0,0,T);
B(1.15,0.5,0.5,mm.blue,0,1.6,0,0,0,0,T);
B(1.3,0.35,0.45,mm.blue,0,1.05,0,0,0,0,T);
// Back
B(1.7,1.8,0.45,mm.dark,0,2.3,-0.5,0,0,0,T);
// Reactor (orange circle)
Y(0.4,0.42,0.15,16,mm.orange,0,3.3,0.12,0,0,T);
B(0.55,0.55,0.06,mm.orange,0,3.3,0.22,0,0,0,T);
// Reactor frame
B(0.7,0.7,0.08,mm.silver,0,3.3,0.18,0,0,0,T);
// Abs
for(var i=0;i<4;i++)B(1.25,0.12,0.28,mm.dark,0,2.0-i*0.22,0.15,0,0,0,T);
// Shoulder mounts
[-1,1].forEach(function(s){
  B(0.55,0.4,0.55,mm.silver,s*1.15,2.8,0,0.2,0,0,T);
  Y(0.35,0.4,0.35,8,mm.blue,s*1.3,2.5,0,0,0,T);
});
// Side armor
[-1,1].forEach(function(s){B(0.18,1.6,0.4,mm.dark,s*0.9,2.1,0,0,0,0,T)});
// Hip plates
[-1,1].forEach(function(s){B(0.4,0.2,0.6,mm.blue,s*0.65,1.0,0.1,0,0,0,T)});
// Belt
B(1.5,0.18,0.5,mm.gold,0,0.95,0.1,0,0,0,T);

// === HEAD ===
var H=new THREE.Group();
B(0.72,0.82,0.68,mm.blue,0,0,0,0,0,0,H); // main head
B(0.58,0.14,0.16,mm.gBlue,0,0.15,0.38,0,0,0,H); // visor
B(0.62,0.42,0.12,mm.dark,0,-0.08,0.38,0,0,0,H); // face plate
B(0.52,0.28,0.32,mm.silver,0,-0.38,0.12,0,0,0,H); // jaw
B(0.62,0.09,0.52,mm.dark,0,0.48,0.1,0,0,0,H); // crown
[-1,1].forEach(function(s){B(0.1,0.28,0.16,mm.silver,s*0.4,0.1,0,0,0,0,H)}); // ears
Y(0.22,0.24,0.45,8,mm.silver,0,-0.62,0,0,0,H); // neck top
Y(0.18,0.14,0.32,8,mm.dark,0,-0.88,0,0,0,H); // neck bottom
H.position.set(0,3.85,0);

// === ARMS ===
function arm(sx){
  var A=new THREE.Group();
  Y(0.3,0.34,1.5,8,mm.blue,0,0.75,0,0,0,A); // upper arm
  Y(0.26,0.3,0.4,8,mm.silver,0,1.6,0,Math.PI/2,0,A); // shoulder
  Y(0.24,0.28,0.35,8,mm.silver,0,0.05,0,0,0,A); // elbow
  Y(0.24,0.27,1.3,8,mm.dark,0,-0.62,0,0,0,A); // forearm
  B(0.38,0.85,0.28,mm.blue,0,-0.65,0.12,0,0,0,A); // forearm guard
  if(sx>0){
    // SWORD ARM
    B(0.09,1.6,0.45,mm.silver,0,-1.55,0.22,0,0,0.06,A); // blade base
    B(0.07,1.35,0.18,mm.blade,0,-1.5,0.5,0,0,0.06,A); // energy blade
    B(0.15,0.3,0.25,mm.silver,0,-2.2,0.25,0,0,0,A); // blade tip housing
  }else{
    // FIST ARM
    B(0.38,0.38,0.38,mm.dark,0,-1.35,0,0,0,0,A);
    for(var i=0;i<3;i++)Y(0.045,0.045,0.22,6,mm.silver,0.18+i*0.08,-1.52,0,Math.PI/2,0,A);
  }
  A.position.set(sx*1.4,2.2,-0.55);A.rotation.z=sx*0.1;
  return A;
}

bot.add(leg(-1));bot.add(leg(1));
bot.add(T);bot.add(H);
bot.add(arm(-1));bot.add(arm(1));

// Hydraulic connectors
function con(x1,y1,z1,x2,y2,z2){
  var dx=x2-x1,dy=y2-y1,dz=z2-z1,len=Math.sqrt(dx*dx+dy*dy+dz*dz);
  var c=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,len,6),mm.hydr);
  c.position.set((x1+x2)/2,(y1+y2)/2,(z1+z2)/2);
  c.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),new THREE.Vector3(dx,dy,dz).normalize());
  c.castShadow=true;bot.add(c);
}
[-1,1].forEach(function(s){
  con(s*0.7,1.4,-0.2,s*0.5,1.4,0);
  con(s*1.2,2.2,-0.2,s*1.0,2.2,0);
  con(s*0.5,1.0,-0.3,s*0.5,1.0,0.3);
});

scene.add(bot);

// === RENDER LOOP ===
function anim(){
  requestAnimationFrame(anim);
  ctrl.update();
  ren.render(scene,cam);
}
anim();

window.addEventListener('resize',function(){
  cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();
  ren.setSize(innerWidth,innerHeight);
});
</script></body></html>
