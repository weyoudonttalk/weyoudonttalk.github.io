<!DOCTYPE html><html lang="zh"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Gipsy Danger 危险流浪者 · 3D模型</title>
<style>*{margin:0;padding:0;overflow:hidden}body{background:#0a0a12}canvas{display:block;width:100vw;height:100vh}
#info{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.35);font-size:12px;pointer-events:none;z-index:10;text-align:center}
#title{position:fixed;top:18px;left:50%;transform:translateX(-50%);color:#fff;font-size:24px;font-weight:900;z-index:10;letter-spacing:4px;pointer-events:none;text-align:center}
#title b{background:linear-gradient(135deg,#fc0,#f80);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:14px;display:block;margin-top:2px;letter-spacing:6px}
#stats{position:fixed;top:50%;left:16px;transform:translateY(-50%);color:rgba(255,255,255,.25);font-size:9px;line-height:1.8;pointer-events:none;z-index:10;display:none}
@media(min-width:768px){#stats{display:block}}
</style></head><body>
<div id="title">GIPSY <b>DANGER</b></div>
<div id="stats">MARK-3<br>260 FT / 79.25m<br>1,980 TONS<br>NUCLEAR REACTOR<br>I-19 PLASMACASTER<br>GD6 CHAIN SWORD</div>
<div id="info">🖱️ 拖动旋转 · 滚轮缩放 · 右键平移 · 手指滑动旋转</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
if(typeof THREE==='undefined')return setTimeout(arguments.callee,200);

var S=new THREE.Scene();S.background=new THREE.Color(0x080810);S.fog=new THREE.Fog(0x080810,25,70);
var C=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.3,60);C.position.set(6,9,13);
var R=new THREE.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);
R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.2;
document.body.appendChild(R.domElement);

var ctrl=new THREE.OrbitControls(C,R.domElement);ctrl.target.set(0,6,0);ctrl.enableDamping=true;
ctrl.dampingFactor=0.08;ctrl.minDistance=5;ctrl.maxDistance=25;ctrl.maxPolarAngle=Math.PI*0.7;ctrl.update();

// Lighting
S.add(new THREE.AmbientLight(0x334466,0.45));
var k1=new THREE.DirectionalLight(0xffffff,1.6);k1.position.set(10,14,8);k1.castShadow=true;
k1.shadow.mapSize.set(2048,2048);k1.shadow.camera.near=0.3;k1.shadow.camera.far=50;
k1.shadow.camera.left=-14;k1.shadow.camera.right=14;k1.shadow.camera.top=14;k1.shadow.camera.bottom=-14;S.add(k1);
S.add(new THREE.DirectionalLight(0x4466ff,0.4)).position.set(-6,5,-5);
S.add(new THREE.DirectionalLight(0xff8844,0.35)).position.set(0,4,8);
var ptR=new THREE.PointLight(0xff6600,3,8);ptR.position.set(0,4.8,0.9);S.add(ptR);
var ptV=new THREE.PointLight(0x4488ff,2,5);ptV.position.set(0,7.9,1.6);S.add(ptV);

// Ground + Grid
var fl=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({color:0x111118,roughness:0.55,metalness:0.35}));
fl.rotation.x=-Math.PI/2;fl.receiveShadow=true;S.add(fl);
S.add(new THREE.GridHelper(22,22,0x333344,0x111122)).position.y=0.005;

// === MATERIALS (Gipsy Danger accurate palette) ===
var B=new THREE.MeshStandardMaterial({color:0x1e4d8c,roughness:0.25,metalness:0.75}); // armor blue
var D=new THREE.MeshStandardMaterial({color:0x0a0a18,roughness:0.35,metalness:0.6}); // dark frame
var S2=new THREE.MeshStandardMaterial({color:0x8a8e9a,roughness:0.2,metalness:0.82}); // silver mech
var G=new THREE.MeshStandardMaterial({color:0xcc8800,roughness:0.18,metalness:0.9}); // gold/brass
var O=new THREE.MeshStandardMaterial({color:0xff6600,emissive:0xff4400,emissiveIntensity:0.7,roughness:0.3,metalness:0.4}); // reactor
var GL=new THREE.MeshStandardMaterial({color:0x4488ff,emissive:0x2266ff,emissiveIntensity:0.9,roughness:0.1,metalness:0.15}); // visor
var HY=new THREE.MeshStandardMaterial({color:0x554422,roughness:0.35,metalness:0.55}); // hydraulics
var BK=new THREE.MeshStandardMaterial({color:0x050510,roughness:0.4,metalness:0.3}); // black
var RD=new THREE.MeshStandardMaterial({color:0xcc2222,roughness:0.25,metalness:0.6}); // red accents
var BL2=new THREE.MeshStandardMaterial({color:0xeeeeff,emissive:0x4488ff,emissiveIntensity:0.55,roughness:0.03,metalness:0.95}); // sword blade

var bot=new THREE.Group();

function BX(w,h,d,mat,x,y,z,rx,ry,rz){var p=arguments[10]||bot;var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);if(rx)m.rotation.x=rx;if(ry)m.rotation.y=ry;if(rz)m.rotation.z=rz;m.castShadow=true;m.receiveShadow=true;p.add(m);return m}
function CY(rt,rb,h,sg,mat,x,y,z,rx,rz){var p=arguments[10]||bot;var m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,sg),mat);m.position.set(x,y,z);if(rx)m.rotation.x=rx;if(rz)m.rotation.z=rz;m.castShadow=true;m.receiveShadow=true;p.add(m);return m}

// =====================================================================
// GIPSY DANGER — total height 13 units (scaled to 79.25m reference)
// Proportions: Head:1.5, Torso:4.0, Upper arm:2.0, Forearm:2.0, Thigh:3.0, Shin:2.8, Foot:0.8
// =====================================================================

// === HEAD / CONN-POD (1.5 units) ===
var head=new THREE.Group();
// Main head block — wide & flat like Conn-Pod
BX(1.15,0.95,0.85,D,0,0,0,0,0,0,head); // dark shell
BX(0.95,0.75,0.65,B,0,0,0,0,0,0,head); // blue armor overlay
// Visor — horizontal slit (iconic!)
BX(0.75,0.12,0.18,GL,0,0.18,0.42,0,0,0,head);
// Cheek armor (angled plates on sides)
[-1,1].forEach(function(s){BX(0.15,0.45,0.35,S2,s*0.55,-0.05,0,0,0,s*0.15,head)});
// Crown / head top plate
BX(0.85,0.10,0.55,D,0,0.52,0.1,0,0,0,head);
// Jaw plate
BX(0.7,0.2,0.45,S2,0,-0.4,0.1,0,0,0,head);
// Side antenna housings
[-1,1].forEach(function(s){BX(0.12,0.3,0.18,S2,s*0.6,0.12,0,0.05,0,0,head)});
// Neck cylinders (Conn-Pod mount)
CY(0.28,0.3,0.6,8,S2,0,-0.7,0,0,0,head);
CY(0.22,0.18,0.35,8,D,0,-1.05,0,0,0,head);
head.position.set(0,10.6,0);

// === TORSO (4 units, h=3.0 to 7.0) ===
var torso=new THREE.Group();
// Back spine frame
BX(1.6,3.2,0.55,D,0,5.1,-0.7,0,0,0,torso);
// Torso main front plate — V-taper from broad shoulders to slim waist
BX(2.1,0.25,0.7,B,0,7.15,0,0,0,0,torso); // top chest
BX(1.95,0.4,0.7,B,0,6.7,0,0,0,0,torso);
BX(1.7,0.5,0.65,B,0,6.15,0,0,0,0,torso);
BX(1.45,0.55,0.6,B,0,5.5,0,0,0,0,torso);
BX(1.25,0.55,0.55,B,0,4.8,0,0,0,0,torso);
BX(1.15,0.5,0.5,B,0,4.15,0,0,0,0,torso);
// Belly
BX(1.1,0.55,0.45,B,0,3.5,0,0,0,0,torso);
// Belt/hip armor
BX(1.4,0.22,0.55,G,0,3.05,0.05,0,0,0,torso);
// === REACTOR (iconic circular turbine in chest) ===
CY(0.45,0.47,0.18,20,O,0,5.0,0.3,0,0,torso);
BX(0.6,0.6,0.08,G,0,5.0,0.36,0,0,0,torso); // brass frame ring
BX(0.5,0.5,0.04,O,0,5.0,0.42,0,0,0,torso); // inner glow
// Reactor vent lines radiating from center
for(var a2=0;a2<Math.PI*2;a2+=Math.PI/3){
  var ex=Math.cos(a2)*0.55,ey=Math.sin(a2)*0.55;
  BX(0.06,0.02,0.08,D,ex,5.0,ey,0,a2,0,torso);
}
// Chest plates framing reactor
BX(1.4,0.15,0.65,B,0,5.7,0.08,0,0,0,torso);
BX(1.3,0.15,0.6,B,0,4.3,0.08,0,0,0,torso);
// Ab plates (3 visible segments)
for(var i=0;i<3;i++)BX(1.1,0.1,0.35,D,0,4.8-i*0.28,0.22,0,0,0,torso);
// Side torso armor
[-1,1].forEach(function(s){BX(0.22,2.0,0.45,D,s*1.0,5.0,0,0,0,0,torso)});
// Shoulder mounts (large ball joints)
[-1,1].forEach(function(s){CY(0.5,0.55,0.5,10,S2,s*1.2,7.2,0,0,0,torso)});
// Shoulder pauldrons (broad armor plates)
[-1,1].forEach(function(s){
  BX(0.75,0.35,0.7,B,s*1.45,7.5,0,0.2,0,0,torso);
  BX(0.55,0.45,0.55,S2,s*1.6,7.2,0,0,0,0,torso);
});
// Collar armor (around neck)
BX(1.8,0.18,0.8,G,0,7.55,0.05,0,0,0,torso);
BX(1.6,0.22,0.65,B,0,7.35,0.15,0,0,0,torso);
// Hip plates
[-1,1].forEach(function(s){BX(0.45,0.25,0.55,B,s*0.8,3.3,0.15,0,0,0,torso)});
// Groin plate
BX(0.9,0.3,0.3,B,0,2.85,0.3,0,0,0,torso);
// Rear vents / exhaust
BX(1.2,0.25,0.3,D,0,6.5,-0.75,0,0,0,torso);
BX(1.0,0.25,0.3,D,0,5.0,-0.75,0,0,0,torso);
// Gold trim lines
BX(1.9,0.03,0.72,G,0,6.9,0.06,0,0,0,torso);
BX(1.3,0.03,0.62,G,0,4.5,0.2,0,0,0,torso);

torso.position.set(0,3.0,0);

// === LEGS (thigh 3.0 + shin 2.8 + foot 0.8) ===
function leg(sx){
  var L=new THREE.Group();
  // Hip joint block
  BX(0.5,0.4,0.5,D,0,2.8,0,0,0,0,L);
  // Thigh — thick cylinder
  CY(0.42,0.48,2.6,10,B,0,1.4,0,0,0,L);
  // Thigh front armor plate
  BX(0.5,1.8,0.35,D,0,1.2,0.32,0,0,0,L);
  // Thigh side armor
  [-1,1].forEach(function(ss){BX(0.18,1.6,0.45,B,ss*0.5,1.3,0,0,0,0,L)});
  // Knee (large complex joint)
  CY(0.38,0.42,0.45,10,S2,0,0.05,0,0,0,L);
  BX(0.35,0.35,0.35,D,0,0.05,0,0,0,0,L);
  // Knee guard plate
  BX(0.55,0.2,0.45,B,0,-0.05,0.28,0,0,0,L);
  // Gyro-stabilizer ring on knee
  CY(0.35,0.35,0.15,12,G,0,0.05,0.35,0,0,L);
  // Shin
  CY(0.32,0.38,2.4,10,B,0,-1.4,0,0,0,L);
  // Shin front plate
  BX(0.4,1.7,0.3,D,0,-1.3,0.28,0,0,0,L);
  // Shin side armor ridges
  [-1,1].forEach(function(ss){BX(0.12,1.5,0.35,B,ss*0.4,-1.4,0,0,0,0,L)});
  // Ankle joint
  CY(0.28,0.32,0.35,8,S2,0,-2.65,0,0,0,L);
  // Cooling vent housing (iconic ankle detail!)
  [-1,1].forEach(function(ss){BX(0.3,0.25,0.35,D,ss*0.3,-2.75,0,0,0,0,L)});
  // Foot
  BX(0.6,0.25,1.1,D,0,-2.95,0.3,0,0,0,L);
  BX(0.55,0.2,0.5,S2,0,-2.8,0.55,0,0,0,L); // toe
  // Foot side guards
  [-1,1].forEach(function(ss){BX(0.15,0.15,0.6,B,ss*0.35,-2.9,0.2,0,0,0,L)});
  L.position.set(sx*0.85,0,0);
  return L;
}

// === ARMS (upper 2.0 + forearm 2.0) ===
function arm(sx){
  var A=new THREE.Group();
  // Upper arm
  CY(0.35,0.4,1.8,10,B,0,0.9,0,0,0,A);
  // Upper arm armor plate
  BX(0.45,1.2,0.3,D,0,0.8,0.3,0,0,0,A);
  // Shoulder joint block
  BX(0.45,0.4,0.45,S2,0,1.95,0,0,0,0,A);
  // Elbow complex
  CY(0.3,0.35,0.38,10,S2,0,0.05,0,0,0,A);
  BX(0.3,0.3,0.3,D,0,0.05,0,0,0,0,A);
  // Elbow guard
  BX(0.35,0.18,0.35,B,0,0.05,0.2,0,0,0,A);
  // Forearm
  CY(0.28,0.33,1.8,10,B,0,-0.95,0,0,0,A);
  // Forearm armor
  BX(0.38,1.3,0.3,D,0,-0.9,0.22,0,0,0,A);
  // Forearm side ridges
  [-1,1].forEach(function(ss){BX(0.1,1.2,0.28,B,ss*0.35,-1.0,0,0,0,0,A)});
  // Wrist joint
  CY(0.24,0.28,0.3,8,S2,0,-1.9,0,0,0,A);

  if(sx>0){
    // RIGHT ARM: I-19 Plasmacaster + Chain Sword
    // Plasmacaster barrel (right hand cannon)
    CY(0.16,0.2,0.8,10,S2,0,-2.35,0.3,Math.PI/2,0,A);
    CY(0.14,0.16,0.6,8,D,0,-2.4,0.65,Math.PI/2,0,A);
    // Chain sword (retracted position on forearm)
    BX(0.12,1.5,0.35,S2,0.2,-1.3,0.25,0,0,0.05,A);
    // Blade glow line
    BX(0.06,1.2,0.1,BL2,0.2,-1.2,0.45,0,0,0.05,A);
    // Sword hilt/guard
    BX(0.25,0.15,0.4,G,0.2,-2.0,0.3,0,0,0,A);
    // Fist
    BX(0.35,0.35,0.35,D,0,-2.15,0.15,0,0,0,A);
  }else{
    // LEFT ARM: Fist + elbow rocket
    // Elbow rocket housing
    CY(0.12,0.15,0.5,8,S2,0,0.05,0.35,Math.PI/2,0,A);
    BX(0.15,0.15,0.25,RD,0,0.05,0.5,0,0,0,A);
    // Fist
    BX(0.38,0.38,0.4,D,0,-2.1,0.1,0,0,0,A);
    // Knuckle guards
    for(var kk=0;kk<3;kk++)CY(0.04,0.04,0.18,6,S2,0.18+kk*0.1,-2.2,0.25,Math.PI/2,0,A);
  }
  A.position.set(sx*1.5,7.0,-0.5);
  A.rotation.z=sx*0.12;
  return A;
}

bot.add(leg(-1));bot.add(leg(1));
bot.add(torso);
bot.add(head);
bot.add(arm(-1));bot.add(arm(1));

// === HYDRAULIC CONNECTORS (visible cables/pistons) ===
function rod(x1,y1,z1,x2,y2,z2){
  var dx=x2-x1,dy=y2-y1,dz=z2-z1,len=Math.sqrt(dx*dx+dy*dy+dz*dz);
  var c=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,len,6),HY);
  c.position.set((x1+x2)/2,(y1+y2)/2,(z1+z2)/2);
  c.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),new THREE.Vector3(dx,dy,dz).normalize());
  c.castShadow=true;bot.add(c);
}
// Leg-to-torso pistons
[-1,1].forEach(function(s){rod(s*0.7,2.6,-0.1,s*0.55,3.1,0);rod(s*0.65,1.5,-0.15,s*0.5,1.8,0)});
// Arm-to-shoulder connectors
[-1,1].forEach(function(s){rod(s*1.2,7.2,-0.2,s*1.0,7.2,0)});
// Torso side cables
[-1,1].forEach(function(s){rod(s*0.8,6.0,-0.45,s*0.7,6.0,0.1);rod(s*0.7,4.5,-0.4,s*0.6,4.5,0.1)});
// Neck to torso
rod(-0.3,9.0,-0.3,0.3,9.0,-0.3);rod(-0.25,8.5,-0.35,0.25,8.5,-0.35);

// === SCENE DECORATION (city base / hangar floor) ===
// Floor spotlight effects
for(var fs=0;fs<4;fs++){
  var a3=fs*Math.PI/2;
  var sp=new THREE.PointLight(0x334466,0.3,6);
  sp.position.set(Math.cos(a3)*5,0.05,Math.sin(a3)*5);S.add(sp);
}

S.add(bot);

// === ANIMATION ===
var clock=new THREE.Clock();
function anim(){
  requestAnimationFrame(anim);
  var t=clock.getElapsedTime();
  // Subtle breathing/idle motion
  bot.children.forEach(function(ch){
    if(ch.position&&Math.abs(ch.position.y)<0.1){} // skip
  });
  // Reactor pulse
  ptR.intensity=3+Math.sin(t*2)*0.5;
  // Visor pulse
  ptV.intensity=2+Math.sin(t*1.8+1)*0.4;
  ctrl.update();
  R.render(S,C);
}
requestAnimationFrame(anim);
window.addEventListener('resize',function(){C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
})();
</script></body></html>
