<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>极限狂飙 Horizon · MIUI工作室</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;font-family:'PingFang SC',system-ui}
canvas#g{display:block;position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}

#hud{position:fixed;inset:0;z-index:10;pointer-events:none}
.spd{position:absolute;bottom:36px;right:24px;text-align:right}
.spd .n{font-size:60px;font-weight:900;color:#fff;line-height:1;text-shadow:0 0 35px rgba(0,200,255,.5)}
.spd .u{font-size:11px;color:rgba(255,255,255,.4);letter-spacing:2px}
.gear{position:absolute;bottom:115px;right:30px;font-size:14px;font-weight:900;color:#0cf}
.timer{position:absolute;top:16px;left:50%;transform:translateX(-50%);font-size:20px;font-weight:900;color:#ff0}
.hmsg{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:22px;color:#ff0;font-weight:900;text-shadow:0 0 30px rgba(255,255,0,.5);opacity:0;transition:opacity .3s;white-space:nowrap}
.hmsg.on{opacity:1}

.joy{position:fixed;bottom:40px;left:16px;z-index:10;width:90px;height:90px}
.joy .b{width:100%;height:100%;border-radius:50%;background:rgba(255,255,255,.04);border:2px solid rgba(255,255,255,.1)}
.joy .k{position:absolute;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.16);top:50%;left:50%;margin:-20px 0 0 -20px}
.acts{position:fixed;bottom:50px;right:14px;z-index:10;display:flex;flex-direction:column;gap:6px}
.acts button{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.12);color:#fff;font-size:16px;cursor:pointer}
.acts button:active{background:rgba(255,100,0,.25)}
.views{position:fixed;top:50%;right:10px;z-index:10;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px}
.views button{width:30px;height:30px;border-radius:6px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:11px;cursor:pointer}
.views button.on{background:rgba(255,100,0,.25);border-color:#f60}
.hint{position:fixed;bottom:4px;left:50%;transform:translateX(-50%);z-index:10;color:rgba(255,255,255,.1);font-size:8px;pointer-events:none}

.screen{position:fixed;inset:0;z-index:500;display:none;align-items:center;justify-content:center}
.screen.on{display:flex}

#poster{background:linear-gradient(160deg,#08080f,#100a15,#08080f);flex-direction:column}
#poster .pc{text-align:center;z-index:2}
#poster .pcar{font-size:110px;filter:drop-shadow(0 0 60px rgba(255,80,0,.25));animation:fl 3s ease-in-out infinite;margin-bottom:4px}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#poster h2{font-size:34px;font-weight:900;color:#fff}
#poster h2 span{background:linear-gradient(135deg,#f60,#f80);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#poster .ptag{font-size:11px;color:rgba(255,255,255,.3);letter-spacing:6px;margin:6px 0 20px}
#poster .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#poster .btns button{height:44px;padding:0 26px;border-radius:22px;border:none;font-size:14px;font-weight:700;cursor:pointer}
#poster .btns .play{background:linear-gradient(135deg,#f60,#f40);color:#fff}
#poster .btns .play:active{transform:scale(.94)}
#poster .btns .ghost{background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.12)}
#poster>canvas{position:absolute;inset:0}
</style>
</head>
<body>

<div id="hud" style="display:none">
  <div class="timer" id="ti">00:00.00</div>
  <div class="spd"><div class="n" id="sp">0</div><div class="u">KM/H</div></div>
  <div class="gear" id="gr">N</div>
  <div class="hmsg" id="hm"></div>
</div>
<div class="joy" id="j"><div class="b"></div><div class="k" id="jk"></div></div>
<div class="acts"><button id="bk">🛑</button><button id="ns">⚡</button></div>
<div class="views">
  <button class="on" id="v0">🚗</button>
  <button id="v1">🎥</button>
  <button id="v2">🦅</button>
  <button id="v3">🛰</button>
</div>
<div class="hint">W/S油门 A/D转向 空格手刹 Shift氮气 1-4视角 · 全地图自由驾驶</div>

<div id="poster" class="screen on">
  <canvas id="pb"></canvas>
  <div class="pc">
    <div class="pcar">🏎️</div>
    <h2>极限狂飙 <span>Horizon</span></h2>
    <div class="ptag">M I U I  ·  工 作 室</div>
    <div class="btns">
      <button class="play" id="go">🎮 进入世界</button>
    </div>
  </div>
</div>

<canvas id="g"></canvas>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
(function(){
  "use strict";
  if(typeof THREE==='undefined'){document.body.innerHTML='<div style="color:#fff;text-align:center;padding-top:40vh">Three.js加载失败，请检查网络后刷新</div>';return;}

  // POSTER
  (function(){
    const c=document.getElementById('pb'),x=c.getContext('2d');
    c.width=innerWidth;c.height=innerHeight;
    const ps=[];
    for(let i=0;i<40;i++)ps.push({x:Math.random()*c.width,y:Math.random()*c.height,r:.3+Math.random()*1.5,sp:.1+Math.random()*.35,o:.12+Math.random()*.2});
    (function A(){if(!document.getElementById('poster').classList.contains('on')){requestAnimationFrame(A);return}
      x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.y-=p.sp;if(p.y<0)p.y=c.height;x.fillStyle='rgba(255,100,0,'+p.o+')';x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fill()});requestAnimationFrame(A)})();
  })();

  // === THREE.JS ===
  const W=1200; // World size
  let scene,camera,renderer,car,carParts,roadSegs=[],buildings=[],trees=[];
  let px,py,pz=0,angle=0,speed=0,steer=0,nitro=100,ntOn=false,view=0,playing=false;
  let thr=0,st=0,br=0,jId=null,jX=0,jY=0;
  const keys={};

  function init(){
    scene=new THREE.Scene();
    scene.background=new THREE.Color(0x87ceeb);
    scene.fog=new THREE.Fog(0x87ceeb,200,700);

    camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.5,800);
    camera.position.set(0,10,0);

    renderer=new THREE.WebGLRenderer({canvas:document.getElementById('g'),antialias:true});
    renderer.setSize(innerWidth,innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    renderer.shadowMap.enabled=true;
    renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    renderer.toneMapping=THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure=1.3;
    renderer.domElement.tabIndex=0;
    renderer.domElement.addEventListener('click',function(){renderer.domElement.focus()});
    renderer.domElement.focus();

    // Sun
    scene.add(new THREE.AmbientLight(0x8899bb,0.6));
    const sun=new THREE.DirectionalLight(0xfff5e0,1.2);
    sun.position.set(200,300,150);sun.castShadow=true;
    sun.shadow.mapSize.set(2048,2048);
    sun.shadow.camera.near=1;sun.shadow.camera.far=800;
    sun.shadow.camera.left=-200;sun.shadow.camera.right=200;
    sun.shadow.camera.top=200;sun.shadow.camera.bottom=-200;
    scene.add(sun);

    // Ground plains
    const gm=new THREE.MeshStandardMaterial({color:0x4a8c2a,roughness:0.9});
    for(let x=-2;x<=2;x++)for(let z=-2;z<=2;z++){
      const g=new THREE.Mesh(new THREE.PlaneGeometry(300,300),gm);
      g.rotation.x=-Math.PI/2;g.position.set(x*300,-0.02,z*300);g.receiveShadow=true;scene.add(g);
    }

    buildWorld();
    buildCar();
    initInput();
    window.addEventListener('resize',function(){
      camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
      renderer.setSize(innerWidth,innerHeight);
    });
    requestAnimationFrame(loop);
  }

  // === OPEN WORLD ===
  function buildWorld(){
    const bm=new THREE.MeshStandardMaterial({color:0x8899aa,roughness:0.35});
    const bm2=new THREE.MeshStandardMaterial({color:0x667788,roughness:0.4});
    const roofMat=new THREE.MeshStandardMaterial({color:0x4a4a5a,roughness:0.5});
    const winMat=new THREE.MeshStandardMaterial({color:0x8899cc,roughness:0.1,metalness:0.5,transparent:true,opacity:0.3});
    const roadMat=new THREE.MeshStandardMaterial({color:0x3a3a3a,roughness:0.6});
    const sideMat=new THREE.MeshStandardMaterial({color:0x8a8a8a,roughness:0.5});

    // === CITY GRID (Downtown area) ===
    const cityX=0,cityZ=0;
    const blockSize=60,gap=40; // road + building block

    for(let bx=-3;bx<=3;bx++)for(let bz=-3;bz<=3;bz++){
      const cx=cityX+bx*gap,cz=cityZ+bz*gap;
      const h=20+Math.random()*80,w=15+Math.random()*25,d=15+Math.random()*25;
      const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),bm);
      b.position.set(cx,h/2,cz);b.castShadow=true;b.receiveShadow=true;
      scene.add(b);buildings.push(b);

      // Windows on front face
      for(let wy=3;wy<h-3;wy+=5)for(let wz=-d/2+3;wz<d/2-2;wz+=4){
        const win=new THREE.Mesh(new THREE.PlaneGeometry(1.5,2),winMat);
        win.position.set(cx+w/2+0.05,wy,cz+wz);
        win.rotation.y=Math.PI/2;scene.add(win);
      }
    }

    // === ROAD NETWORK (grid) ===
    function addRoad(x1,z1,x2,z2){
      const dx=x2-x1,dz=z2-z1,len=Math.sqrt(dx*dx+dz*dz),ang=Math.atan2(dz,dx);
      const r=new THREE.Mesh(new THREE.PlaneGeometry(len,14),roadMat);
      r.rotation.x=-Math.PI/2;r.rotation.z=ang;
      r.position.set((x1+x2)/2,0.01,(z1+z2)/2);r.receiveShadow=true;scene.add(r);
      // Lane markings
      for(let t=4;t<len-4;t+=8){
        const mx=x1+Math.cos(ang)*t,mz=z1+Math.sin(ang)*t;
        const ln=new THREE.Mesh(new THREE.PlaneGeometry(3,0.3),new THREE.MeshBasicMaterial({color:0xffff00}));
        ln.rotation.x=-Math.PI/2;ln.rotation.z=ang;ln.position.set(mx,0.03,mz);scene.add(ln);
      }
      // Sidewalks
      [-1,1].forEach(function(s){
        const sx1=x1+Math.cos(ang+s*Math.PI/2)*7.2,sz1=z1+Math.sin(ang+s*Math.PI/2)*7.2;
        const sx2=x2+Math.cos(ang+s*Math.PI/2)*7.2,sz2=z2+Math.sin(ang+s*Math.PI/2)*7.2;
        const slen=Math.sqrt((sx2-sx1)**2+(sz2-sz1)**2),sa=Math.atan2(sz2-sz1,sx2-sx1);
        const sw=new THREE.Mesh(new THREE.PlaneGeometry(slen,2),sideMat);
        sw.rotation.x=-Math.PI/2;sw.rotation.z=sa;sw.position.set((sx1+sx2)/2,0.03,(sz1+sz2)/2);scene.add(sw);
      });
      roadSegs.push({x1,z1,x2,z2});
    }

    // Grid roads (massive network)
    for(let i=-4;i<=3;i++){
      addRoad(i*gap+cityX,-300,i*gap+cityX,300);
      addRoad(-300,i*gap+cityZ,300,i*gap+cityZ);
    }

    // === HIGHWAY (outer ring) ===
    const hwR=350;
    const hwPts=[];
    for(let a=0;a<Math.PI*2;a+=0.1)hwPts.push({x:Math.cos(a)*hwR+cityX,z:Math.sin(a)*hwR+cityZ});
    const hwMat=new THREE.MeshStandardMaterial({color:0x4a4a4a,roughness:0.5});
    for(let i=0;i<hwPts.length-1;i++){
      const dx=hwPts[i+1].x-hwPts[i].x,dz=hwPts[i+1].z-hwPts[i].z;
      const len=Math.sqrt(dx*dx+dz*dz),ang=Math.atan2(dz,dx);
      const r=new THREE.Mesh(new THREE.PlaneGeometry(len,16),hwMat);
      r.rotation.x=-Math.PI/2;r.rotation.z=ang;
      r.position.set((hwPts[i].x+hwPts[i+1].x)/2,0.02,(hwPts[i].z+hwPts[i+1].z)/2);
      r.receiveShadow=true;scene.add(r);
      roadSegs.push({x1:hwPts[i].x,z1:hwPts[i].z,x2:hwPts[i+1].x,z2:hwPts[i+1].z});
    }

    // === SUBURBAN HOUSES ===
    for(let i=0;i<120;i++){
      const a=Math.random()*Math.PI*2,d=100+Math.random()*300;
      const hx=Math.cos(a)*d+cityX,hz=Math.sin(a)*d+cityZ;
      const nr=roadSegs.some(function(r){
        // Check if too close to any road
        const cx2=(r.x1+r.x2)/2,cz2=(r.z1+r.z2)/2;
        return Math.hypot(hx-cx2,hz-cz2)<25;
      });
      if(nr)continue;
      const hh=6+Math.random()*14,hw=6+Math.random()*10,hd=6+Math.random()*10;
      const hs=new THREE.Mesh(new THREE.BoxGeometry(hw,hh,hd),bm2);
      hs.position.set(hx,hh/2,hz);hs.castShadow=true;hs.receiveShadow=true;scene.add(hs);
      // Roof
      const rf=new THREE.Mesh(new THREE.ConeGeometry(Math.max(hw,hd)*0.75,4,4),roofMat);
      rf.position.set(hx,hh+1.5,hz);rf.rotation.y=Math.PI/4;rf.castShadow=true;scene.add(rf);
    }

    // === TREES everywhere ===
    const trMat=new THREE.MeshStandardMaterial({color:0x5a3a1a});
    const lfMat=new THREE.MeshStandardMaterial({color:0x2d5a1e,roughness:0.7});
    for(let i=0;i<600;i++){
      const tx=(Math.random()-0.5)*1000,tz=(Math.random()-0.5)*1000;
      const nr=roadSegs.some(function(r){var cx=(r.x1+r.x2)/2,cz=(r.z1+r.z2)/2;return Math.hypot(tx-cx,tz-cz)<15;});
      if(nr)continue;
      const tr=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.35,3+Math.random()*6,6),trMat);
      tr.position.set(tx,1.5+Math.random()*3,tz);tr.castShadow=true;scene.add(tr);
      const lf=new THREE.Mesh(new THREE.SphereGeometry(1.2+Math.random()*3,6,4),lfMat);
      lf.position.set(tx,3.5+Math.random()*6,tz);lf.castShadow=true;scene.add(lf);
      trees.push({x:tx,z:tz});
    }

    // === LAMPS along roads ===
    const lampP=new THREE.MeshStandardMaterial({color:0x333344,metalness:0.7});
    const lampH=new THREE.MeshStandardMaterial({color:0xffffcc,emissive:0xffffaa,emissiveIntensity:0.4});
    // Place lamps on main roads
    for(let i=-4;i<=3;i++){
      for(let z=-280;z<280;z+=40){
        const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.2,8,6),lampP);
        pole.position.set(i*gap+8,z,4);pole.castShadow=true;scene.add(pole);
        const head=new THREE.Mesh(new THREE.SphereGeometry(0.4,4,4),lampH);
        head.position.set(i*gap+8,z,8.5);scene.add(head);
      }
    }
  }

  // === REALISTIC SPORTS CAR ===
  function buildCar(){
    car=new THREE.Group();
    // Materials
    const paint=new THREE.MeshStandardMaterial({color:0xff2200,roughness:0.1,metalness:0.8});
    const dark=new THREE.MeshStandardMaterial({color:0x111118,roughness:0.2,metalness:0.5});
    const glass=new THREE.MeshStandardMaterial({color:0x112244,roughness:0.03,transparent:true,opacity:0.55});
    const chrome=new THREE.MeshStandardMaterial({color:0xdddddd,roughness:0.05,metalness:0.95});
    const carbon=new THREE.MeshStandardMaterial({color:0x1a1a1a,roughness:0.3,metalness:0.5});
    const redL=new THREE.MeshStandardMaterial({color:0xff0000,emissive:0xff0000,emissiveIntensity:1});
    const whM=new THREE.MeshStandardMaterial({color:0x111111,roughness:0.7});

    // CAR BODY - now built along X axis (forward = +X in model space, will be rotated to match movement)
    // Lower body (main shell)
    const lb=new THREE.Mesh(new THREE.BoxGeometry(2.1,0.4,4.8),paint);
    lb.position.set(0,0.38,0);lb.castShadow=true;car.add(lb);

    // Upper body
    const ub=new THREE.Mesh(new THREE.BoxGeometry(1.95,0.3,3.2),paint);
    ub.position.set(0,0.68,0.1);ub.castShadow=true;car.add(ub);

    // Front nose (tapered)
    const nose=new THREE.Mesh(new THREE.BoxGeometry(1.55,0.22,0.65),paint);
    nose.position.set(0,0.42,-2.5);car.add(nose);

    // Front splitter
    const splitter=new THREE.Mesh(new THREE.BoxGeometry(2.25,0.07,0.4),carbon);
    splitter.position.set(0,0.14,-2.45);car.add(splitter);

    // Front grille
    const grille=new THREE.Mesh(new THREE.BoxGeometry(1.4,0.22,0.08),dark);
    grille.position.set(0,0.35,-2.6);car.add(grille);

    // Hood
    const hood=new THREE.Mesh(new THREE.BoxGeometry(1.85,0.05,1.7),paint);
    hood.position.set(0,0.82,-1.1);car.add(hood);

    // Hood vents
    [-1,1].forEach(function(s){
      const hv=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.02,0.6),dark);
      hv.position.set(s*0.5,0.85,-1.3);car.add(hv);
    });

    // Front fenders (curved - using cylinders)
    [-1,1].forEach(function(s){
      const ff=new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.3,0.9,8),paint);
      ff.rotation.z=Math.PI/2;ff.position.set(s*1.05,0.5,-1.3);car.add(ff);
    });

    // Rear fenders
    [-1,1].forEach(function(s){
      const rf=new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.32,1.0,8),paint);
      rf.rotation.z=Math.PI/2;rf.position.set(s*1.08,0.55,1.4);car.add(rf);
    });

    // Cabin / Greenhouse
    const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.32,1.8),glass);
    cabin.position.set(0,0.98,-0.15);car.add(cabin);

    // Windshield (angled)
    const ws=new THREE.Mesh(new THREE.BoxGeometry(1.65,0.012,0.9),glass);
    ws.position.set(0,0.98,-1.45);ws.rotation.x=0.5;car.add(ws);

    // Rear window
    const rw=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.012,0.65),glass);
    rw.position.set(0,0.98,0.7);rw.rotation.x=-0.4;car.add(rw);

    // Roof
    const roof=new THREE.Mesh(new THREE.BoxGeometry(1.45,0.05,0.85),paint);
    roof.position.set(0,1.15,-0.15);car.add(roof);

    // A-pillars
    [-1,1].forEach(function(s){
      const ap=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.35,0.06),dark);
      ap.position.set(s*0.75,1.05,-1.2);car.add(ap);
    });

    // C-pillars
    [-1,1].forEach(function(s){
      const cp=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.3,0.06),dark);
      cp.position.set(s*0.72,1.02,0.5);car.add(cp);
    });

    // Rear deck / trunk
    const trunk=new THREE.Mesh(new THREE.BoxGeometry(1.9,0.05,1.0),paint);
    trunk.position.set(0,0.82,1.3);car.add(trunk);

    // Rear diffuser
    const diff=new THREE.Mesh(new THREE.BoxGeometry(2.05,0.1,0.5),carbon);
    diff.position.set(0,0.26,2.45);car.add(diff);
    for(let i=0;i<4;i++){
      const fin=new THREE.Mesh(new THREE.BoxGeometry(0.04,0.1,0.45),carbon);
      fin.position.set(-0.65+i*0.43,0.2,2.4);car.add(fin);
    }

    // Exhaust tips (quad)
    [-1,1].forEach(function(s){
      [-1,1].forEach(function(s2){
        const e=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.06,0.2,8),chrome);
        e.rotation.x=Math.PI/2;e.position.set(s*0.45,0.42,2.6+s2*0.1);car.add(e);
      });
    });

    // Rear spoiler
    const spL=new THREE.Mesh(new THREE.BoxGeometry(0.07,0.2,0.07),carbon);
    spL.position.set(-1.0,0.92,2.3);car.add(spL);
    const spR=new THREE.Mesh(new THREE.BoxGeometry(0.07,0.2,0.07),carbon);
    spR.position.set(1.0,0.92,2.3);car.add(spR);
    const wing=new THREE.Mesh(new THREE.BoxGeometry(2.35,0.05,0.28),carbon);
    wing.position.set(0,1.08,2.3);car.add(wing);

    // Headlights (sharp LED style)
    [-1,1].forEach(function(s){
      const hl=new THREE.Mesh(new THREE.BoxGeometry(0.35,0.08,0.18),new THREE.MeshStandardMaterial({color:0xfffff0,emissive:0xffeecc,emissiveIntensity:1.2}));
      hl.position.set(s*0.55,0.45,-2.55);car.add(hl);
      // DRL strip
      const drl=new THREE.Mesh(new THREE.BoxGeometry(0.02,0.03,0.2),new THREE.MeshBasicMaterial({color:0xffffff}));
      drl.position.set(s*0.72,0.38,-2.5);car.add(drl);
    });

    // Taillights (full-width LED)
    const tl=new THREE.Mesh(new THREE.BoxGeometry(1.7,0.06,0.08),redL);
    tl.position.set(0,0.52,2.55);car.add(tl);

    // Side skirts
    [-1,1].forEach(function(s){
      const sk=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.1,3.0),carbon);
      sk.position.set(s*1.08,0.24,0);car.add(sk);
    });

    // Side mirrors
    [-1,1].forEach(function(s){
      const mb=new THREE.Mesh(new THREE.BoxGeometry(0.07,0.05,0.07),paint);
      mb.position.set(s*1.02,0.92,-1.75);car.add(mb);
      const mr=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.07,0.1),paint);
      mr.position.set(s*1.12,0.92,-1.75);car.add(mr);
    });

    // Door handles
    [-1,1].forEach(function(s){
      const dh=new THREE.Mesh(new THREE.BoxGeometry(0.03,0.03,0.15),chrome);
      dh.position.set(s*1.06,0.72,-0.3);car.add(dh);
    });

    // Fuel cap
    const fc=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,0.02,8),chrome);
    fc.rotation.x=Math.PI/2;fc.position.set(1.06,0.7,0.9);car.add(fc);

    // Ferrari-style badge
    const badge=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.02,0.2),chrome);
    badge.position.set(0,0.52,-2.57);car.add(badge);

    // === WHEELS (5-spoke alloys) ===
    carParts=[];
    const whGeo=new THREE.CylinderGeometry(0.46,0.46,0.45,20);
    const rimGeo=new THREE.CylinderGeometry(0.32,0.32,0.46,8);
    const hubGeo=new THREE.CylinderGeometry(0.12,0.12,0.47,8);

    [[-1.1,-1.55],[1.1,-1.55],[-1.1,1.55],[1.1,1.55]].forEach(function(wp){
      const wg=new THREE.Group();
      // Tire
      const wh=new THREE.Mesh(whGeo,whM);
      wh.rotation.z=Math.PI/2;wh.name='wh';wg.add(wh);
      // Brake disc
      const disc=new THREE.Mesh(new THREE.CylinderGeometry(0.26,0.26,0.43,12),new THREE.MeshStandardMaterial({color:0x999999,metalness:0.9,roughness:0.15}));
      disc.rotation.z=Math.PI/2;wg.add(disc);
      // Rim with spokes
      const rimG=new THREE.Group();
      const rim=new THREE.Mesh(rimGeo,chrome);
      rim.rotation.z=Math.PI/2;rim.name='rim';rimG.add(rim);
      for(let i=0;i<5;i++){
        const a=i*Math.PI*2/5;
        const spk=new THREE.Mesh(new THREE.BoxGeometry(0.035,0.42,0.1),chrome);
        spk.position.set(Math.cos(a)*0.2,0,Math.sin(a)*0.2);spk.rotation.z=a;rimG.add(spk);
      }
      wg.add(rimG);
      // Center hub
      const hub=new THREE.Mesh(hubGeo,chrome);
      hub.rotation.z=Math.PI/2;wg.add(hub);
      // Caliper
      const cal=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.2,0.12),new THREE.MeshStandardMaterial({color:0xffcc00,roughness:0.2,metalness:0.7}));
      cal.position.set(0,0.3,0);wg.add(cal);
      wg.position.set(wp[0],0.46,wp[1]);
      wg.name='wheel';
      car.add(wg);
    });

    // Collect all rotatable parts
    car.traverse(function(ch){
      if(ch.name==='wh'||ch.name==='rim')carParts.push(ch);
    });

    scene.add(car);
  }

  // === INPUT ===
  function initInput(){
    document.addEventListener('keydown',function(e){
      var k=e.key.toLowerCase();
      keys[k]=true;
      if(k===' '){e.preventDefault();br=1;}
      if(k==='shift'&&nitro>0)ntOn=true;
      if(k==='1')setView(0);if(k==='2')setView(1);if(k==='3')setView(2);if(k==='4')setView(3);
    });
    document.addEventListener('keyup',function(e){
      var k=e.key.toLowerCase();
      keys[k]=false;
      if(k===' ')br=0;
      if(k==='shift')ntOn=false;
    });

    // Joystick
    var jEl=document.getElementById('j'),jk=document.getElementById('jk');
    jEl.addEventListener('touchstart',function(e){
      e.preventDefault();e.stopPropagation();
      jId=e.touches[0].identifier;
      var r=jEl.getBoundingClientRect();
      jX=r.left+r.width/2;jY=r.top+r.height/2;thr=0.8;
    },{passive:false});
    jEl.addEventListener('touchmove',function(e){
      e.preventDefault();e.stopPropagation();
      for(var i=0;i<e.touches.length;i++)if(e.touches[i].identifier===jId){
        var dx=e.touches[i].clientX-jX,dy=e.touches[i].clientY-jY;
        var d=Math.min(40,Math.hypot(dx,dy))/40,a=Math.atan2(dy,dx);
        st=-Math.cos(a)*d;thr=Math.max(0,-dy/40);
        jk.style.transform='translate('+Math.cos(a)*d*34+'px,'+Math.sin(a)*d*34+'px)';break;
      }
    },{passive:false});
    jEl.addEventListener('touchend',function(e){
      e.preventDefault();jId=null;thr=0;st=0;jk.style.transform='translate(0,0)';
    },{passive:false});
    jEl.addEventListener('touchcancel',function(){jId=null;thr=0;st=0;jk.style.transform='translate(0,0)';});

    document.getElementById('bk').addEventListener('touchstart',function(e){e.preventDefault();br=1;});
    document.getElementById('bk').addEventListener('touchend',function(){br=0;});
    document.getElementById('ns').addEventListener('touchstart',function(e){e.preventDefault();if(nitro>0)ntOn=true;});
    document.getElementById('ns').addEventListener('touchend',function(){ntOn=false;});
  }

  function setView(v){
    view=v;
    ['v0','v1','v2','v3'].forEach(function(id,i){
      var b=document.getElementById(id);if(b)b.classList.toggle('on',i===v);
    });
  }

  // === START ===
  function startGame(){
    document.getElementById('poster').classList.remove('on');
    document.getElementById('hud').style.display='block';
    px=0;pz=0;angle=0;speed=0;steer=0;nitro=100;keys={};thr=0;st=0;br=0;ntOn=false;
    playing=true;
    renderer.domElement.focus();
  }

  document.getElementById('go').addEventListener('click',startGame);

  // === UPDATE ===
  const DRAG=0.988,ENG=450,BRK=580,NB=320,SPD=330,CURVE=3;

  function update(dt){
    if(!playing)return;
    if(dt>0.15)dt=0.15;

    // Read input
    if(keys['w']||keys['arrowup'])thr=1;else if(keys['s']||keys['arrowdown'])thr=-0.5;else if(!jId)thr=0;
    if(keys['a']||keys['arrowleft'])st=-1;else if(keys['d']||keys['arrowright'])st=1;else if(!jId)st=0;

    steer+=(st*0.6-steer)*Math.min(dt*CURVE,1);

    var force=0;
    if(thr>0&&speed<SPD)force=ENG*thr;else if(thr<0)force=ENG*thr*0.3;

    var brake=br*BRK;
    if(Math.abs(speed)<0.05&&thr===0&&br===0)speed=0;

    if(ntOn&&nitro>0){force+=NB;nitro-=30*dt;if(nitro<=0){nitro=0;ntOn=false;}}
    else if(!ntOn&&nitro<100)nitro+=10*dt;

    speed+=force*dt;speed-=brake*dt;speed*=DRAG;
    speed=Math.max(-25,Math.min(SPD,speed));

    var sf=Math.min(Math.abs(speed)/95,1);
    angle+=steer*sf*dt*3.3;
    px+=Math.cos(angle)*speed*dt;
    pz-=Math.sin(angle)*speed*dt;

    // Stay within world bounds
    px=Math.max(-W/2+10,Math.min(W/2-10,px));
    pz=Math.max(-W/2+10,Math.min(W/2-10,pz));

    // Gear display
    var g='N';
    if(speed<-0.5)g='R';
    else if(speed<45)g='1';else if(speed<95)g='2';else if(speed<155)g='3';
    else if(speed<220)g='4';else if(speed<280)g='5';else if(speed>0)g='6';

    // Camera
    if(view===0){
      // Chase
      var tx=px-Math.cos(angle)*10,tz=pz+Math.sin(angle)*10;
      camera.position.lerp(new THREE.Vector3(tx,6,tz),7*dt);
      camera.lookAt(px,1.2,pz);
    }else if(view===1){
      // Cockpit
      camera.position.set(px+Math.cos(angle)*1.3,1.35,pz-Math.sin(angle)*1.3);
      camera.quaternion.setFromEuler(new THREE.Euler(-0.08,angle+Math.PI,0,'YXZ'));
    }else if(view===2){
      // Chase far
      var tx2=px-Math.cos(angle)*20,tz2=pz+Math.sin(angle)*20;
      camera.position.lerp(new THREE.Vector3(tx2,12,tz2),5*dt);
      camera.lookAt(px,0.5,pz);
    }else{
      // Satellite
      camera.position.lerp(new THREE.Vector3(px,80,pz+2),4*dt);
      camera.lookAt(px,0,pz);
    }

    // Car position & rotation - FIX: rotate car 90° so its forward matches movement
    car.position.set(px,0,pz);
    car.rotation.y=angle+Math.PI/2;

    // Spin wheels
    var wr=speed*dt*2.5;
    for(var i=0;i<carParts.length;i++)carParts[i].rotation.z+=wr;

    // HUD
    document.getElementById('sp').textContent=Math.abs(Math.floor(speed*3.2));
    document.getElementById('gr').textContent=g;
  }

  // === LOOP ===
  var lt=0;
  function loop(t){
    requestAnimationFrame(loop);
    var dt=(t-lt)/1000;lt=t;
    if(dt>0&&dt<5)update(dt);
    renderer.render(scene,camera);
  }

  init();
})();
</script>
</body>
</html>
