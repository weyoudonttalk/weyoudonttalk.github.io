<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>极限狂飙 Horizon · MIUI工作室</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui}
#g{display:block;position:fixed;top:0;left:0;width:100%;height:100%}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;display:none}
.spd{position:absolute;bottom:32px;right:20px;text-align:right}
.spd b{font-size:48px;font-weight:900;color:#fff;text-shadow:0 0 24px rgba(0,200,255,.35);display:block}
.spd i{font-size:9px;color:rgba(255,255,255,.25);letter-spacing:2px}
.gear{position:absolute;bottom:95px;right:26px;font-size:11px;font-weight:900;color:#0cf}
#poster{position:fixed;inset:0;z-index:500;background:linear-gradient(160deg,#08080f,#100a15,#08080f);display:flex;align-items:center;justify-content:center;flex-direction:column}
#poster .e{font-size:90px;animation:fl 3s infinite;margin-bottom:4px}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
#poster h2{font-size:28px;font-weight:900;color:#fff}
#poster h2 span{background:linear-gradient(135deg,#f60,#f80);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#poster .t{font-size:9px;color:rgba(255,255,255,.2);letter-spacing:5px;margin:4px 0 20px}
#poster button{height:46px;padding:0 32px;border-radius:23px;border:none;font-size:15px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#f60,#f40);color:#fff}
#poster button:active{transform:scale(.95)}
#stuck{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:20;padding:8px 20px;border-radius:20px;background:rgba(255,40,0,.15);border:1px solid rgba(255,80,0,.3);color:#f80;font-size:12px;cursor:pointer;display:none}
#stuck:active{background:rgba(255,40,0,.3)}
</style></head><body>

<div id="hud"><div class="spd"><b id="sp">0</b><i>KM/H</i></div><div class="gear" id="gr">N</div></div>
<div id="poster"><div class="e">🏎️</div><h2>极限狂飙 <span>Horizon</span></h2><div class="t">MIUI工作室</div><button id="go">🎮 开始驾驶</button></div>
<button id="stuck" onclick="popOut()">🗺 卡住了？点我救援</button>
<canvas id="g"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
// 极限狂飙 — 测试通过版：转向灵敏 + 碰撞不困 + 卡住有救援
(function(){
if(typeof THREE==='undefined')return setTimeout(arguments.callee,100);

var S,C,R,car,carW=[],carS=[],bld=[];
var px=50,pz=50,ang=0,spd=0,str=0,nt=100,ntO=false,vw=0,play=false;
var thr=0,sIn=0,br=0,ks={};
var ENG=600,BRK=600,NB=400,MXS=360,CRV=5;

function init(){
  S=new THREE.Scene();S.background=new THREE.Color(0x87ceeb);S.fog=new THREE.Fog(0x87ceeb,200,750);
  C=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,0.5,900);C.position.set(50,8,42);
  R=new THREE.WebGLRenderer({canvas:document.getElementById('g'),antialias:true});
  R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,2));
  R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
  R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.3;
  R.domElement.tabIndex=0;

  S.add(new THREE.AmbientLight(0x8899bb,0.6));
  var sun=new THREE.DirectionalLight(0xfff5e0,1.2);sun.position.set(200,300,150);sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.near=1;sun.shadow.camera.far=800;
  sun.shadow.camera.left=-200;sun.shadow.camera.right=200;sun.shadow.camera.top=200;sun.shadow.camera.bottom=-200;S.add(sun);
  S.add(new THREE.HemisphereLight(0x88aacc,0x443322,0.4));

  // Ground
  var gm=new THREE.MeshStandardMaterial({color:0x4a8c2a,roughness:0.9});
  for(var x=-2;x<=2;x++)for(var z=-2;z<=2;z++){
    var g4=new THREE.Mesh(new THREE.PlaneGeometry(300,300),gm);g4.rotation.x=-Math.PI/2;
    g4.position.set(x*300,-0.02,z*300);g4.receiveShadow=true;S.add(g4);
  }

  buildWorld();
  buildCar();

  // Start
  document.getElementById('go').onclick=function(){
    document.getElementById('poster').style.display='none';
    document.getElementById('hud').style.display='block';
    px=50;pz=50;ang=Math.PI/4;spd=0;str=0;sIn=0;nt=100;ks={};thr=0;br=0;ntO=false;
    // Spawn in safe position: check and adjust if inside building
    var tries=0;
    while(colliding(px,pz)&&tries<50){px+=Math.cos(Math.random()*Math.PI*2)*5;pz+=Math.sin(Math.random()*Math.PI*2)*5;tries++}
    play=true;R.domElement.focus();
  };

  // Keyboard (simple, tested)
  document.addEventListener('keydown',function(e){
    var k=e.key.toLowerCase();ks[k]=true;
    if(k===' '){e.preventDefault();br=1}if(k==='shift'&&nt>0)ntO=true;
  });
  document.addEventListener('keyup',function(e){
    var k=e.key.toLowerCase();ks[k]=false;
    if(k===' ')br=0;if(k==='shift')ntO=false;
  });

  // View switching
  document.addEventListener('keydown',function(e){
    if(e.key==='1'){vw=0;console.log('view:',0)}
    if(e.key==='2'){vw=1;console.log('view:',1)}
    if(e.key==='3'){vw=2;console.log('view:',2)}
    if(e.key==='4'){vw=3;console.log('view:',3)}
  });

  window.addEventListener('resize',function(){
    C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);
  });
  requestAnimationFrame(loop);
}

// Rescue function
window.popOut=function(){
  px=50;pz=50;ang=Math.PI/4;spd=0;nt=100;
  var tries=0;while(colliding(px,pz)&&tries<50){px+=Math.random()*10-5;pz+=Math.random()*10-5;tries++}
  document.getElementById('stuck').style.display='none';
};

function colliding(x,z){
  for(var i=0;i<bld.length;i++){
    var b=bld[i];if(Math.abs(x-b.x)<b.hw+1.6&&Math.abs(z-b.z)<b.hd+2.5)return true;
  }
  return false;
}

// === WORLD ===
function buildWorld(){
  var bm=new THREE.MeshStandardMaterial({color:0x8899aa,roughness:0.35});
  var roadM=new THREE.MeshStandardMaterial({color:0x3a3a3a,roughness:0.6});
  var trM=new THREE.MeshStandardMaterial({color:0x5a3a1a});
  var lfM=new THREE.MeshStandardMaterial({color:0x2d5a1e,roughness:0.7});
  bld=[];

  // Buildings
  for(var bx=-4;bx<=4;bx++)for(var bz=-4;bz<=4;bz++){
    var cx=bx*40,cz=bz*40;
    if(Math.hypot(cx-50,cz-50)<25)continue;
    var h=15+Math.random()*55,w=10+Math.random()*16,d=10+Math.random()*16;
    var b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),bm);
    b.position.set(cx,h/2,cz);b.castShadow=true;b.receiveShadow=true;S.add(b);
    bld.push({x:cx,z:cz,hw:w/2,hd:d/2});
  }

  // Roads
  for(var i=-5;i<=5;i++){
    rd2(i*40,-300,i*40,300,roadM);
    rd2(-300,i*40,300,i*40,roadM);
  }

  // Trees
  for(var i=0;i<400;i++){
    var tx=(Math.random()-0.5)*600,tz=(Math.random()-0.5)*600;
    if(Math.abs(tx%40)<8||Math.abs(tz%40)<8)continue;
    var nr=false;for(var j=0;j<bld.length;j++){if(Math.abs(tx-bld[j].x)<bld[j].hw+4&&Math.abs(tz-bld[j].z)<bld[j].hd+4)nr=true}
    if(nr)continue;
    var tr=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.35,4+Math.random()*5,6),trM);tr.position.set(tx,2,tz);tr.castShadow=true;S.add(tr);
    var lf=new THREE.Mesh(new THREE.SphereGeometry(1.2+Math.random()*2,6,4),lfM);lf.position.set(tx,4+Math.random()*4,tz);lf.castShadow=true;S.add(lf);
  }
}

function rd2(x1,z1,x2,z2,mat){
  var dx=x2-x1,dz=z2-z1,len=Math.sqrt(dx*dx+dz*dz),ag=Math.atan2(dz,dx);
  var r=new THREE.Mesh(new THREE.PlaneGeometry(len,10),mat);
  r.rotation.x=-Math.PI/2;r.rotation.z=ag;r.position.set((x1+x2)/2,0.01,(z1+z2)/2);r.receiveShadow=true;S.add(r);
  for(var t=3;t<len-3;t+=7){
    var mx=x1+Math.cos(ag)*t,mz=z1+Math.sin(ag)*t;
    var ln=new THREE.Mesh(new THREE.PlaneGeometry(2.5,0.25),new THREE.MeshBasicMaterial({color:0xffcc00}));
    ln.rotation.x=-Math.PI/2;ln.rotation.z=ag;ln.position.set(mx,0.025,mz);S.add(ln);
  }
}

// === CAR ===
function buildCar(){
  car=new THREE.Group();
  var pt=new THREE.MeshStandardMaterial({color:0xdd1100,roughness:0.08,metalness:0.82});
  var gs=new THREE.MeshStandardMaterial({color:0x112244,roughness:0.02,transparent:true,opacity:0.55});
  var dk=new THREE.MeshStandardMaterial({color:0x111118,roughness:0.2,metalness:0.4});
  var ch=new THREE.MeshStandardMaterial({color:0xddddee,roughness:0.03,metalness:0.96});
  var cb=new THREE.MeshStandardMaterial({color:0x1a1a1a,roughness:0.3,metalness:0.45});
  var rl=new THREE.MeshStandardMaterial({color:0xff0000,emissive:0xff0000,emissiveIntensity:1});
  var wh=new THREE.MeshStandardMaterial({color:0x111111,roughness:0.7});
  var bg=new THREE.MeshStandardMaterial({color:0xfffff0,emissive:0xffeecc,emissiveIntensity:1.2});

  function M2(geo,mat,x,y,z,rx,ry,rz){
    var m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);
    if(rx)m.rotation.x=rx;if(ry)m.rotation.y=ry;if(rz)m.rotation.z=rz;
    m.castShadow=true;m.receiveShadow=true;car.add(m);return m;
  }

  var shape=new THREE.Shape();
  shape.moveTo(-2.3,0.2);shape.bezierCurveTo(-2.1,0.36,-1.9,0.54,-1.7,0.57);shape.bezierCurveTo(-1.4,0.62,-0.9,0.72,-0.5,0.74);
  shape.bezierCurveTo(-0.05,0.92,0.15,1.10,0.28,1.12);shape.bezierCurveTo(0.55,1.14,0.85,1.08,1.05,1.00);
  shape.bezierCurveTo(1.35,0.88,1.65,0.70,1.85,0.58);shape.bezierCurveTo(2.05,0.48,2.25,0.38,2.45,0.28);
  shape.lineTo(2.45,0.2);shape.lineTo(-2.3,0.2);shape.closePath();
  M2(new THREE.ExtrudeGeometry(shape,{depth:2.15,bevelEnabled:true,bevelThickness:0.12,bevelSize:0.10,bevelSegments:4}),pt,0,0,-1.075);

  var cg=new THREE.Shape();
  cg.moveTo(-0.65,0.86);cg.bezierCurveTo(-0.15,1.04,0.15,1.14,0.45,1.12);cg.bezierCurveTo(0.75,1.08,1.05,0.94,1.20,0.80);
  cg.lineTo(1.15,0.68);cg.bezierCurveTo(0.95,0.82,0.55,0.90,0.25,0.92);cg.bezierCurveTo(-0.15,0.90,-0.55,0.84,-0.65,0.72);cg.closePath();
  M2(new THREE.ExtrudeGeometry(cg,{depth:1.55,bevelEnabled:true,bevelThickness:0.05,bevelSize:0.05,bevelSegments:3}),gs,0.04,0.04,-0.775);

  M2(new THREE.BoxGeometry(2.25,0.07,0.38),cb,-2.25,0.10,0);
  M2(new THREE.BoxGeometry(1.60,0.22,0.07),dk,-2.32,0.52,0);
  [-1,1].forEach(function(s){M2(new THREE.BoxGeometry(0.30,0.09,0.20),bg,-2.30,0.54,s*0.58)});
  M2(new THREE.BoxGeometry(2.10,0.09,0.42),cb,2.40,0.16,0);
  M2(new THREE.BoxGeometry(0.07,1.70,0.07),rl,2.45,0,0.48);
  [-1,1].forEach(function(s){M2(new THREE.BoxGeometry(0.07,0.18,0.07),cb,2.36,s*0.95,0.92)});
  M2(new THREE.BoxGeometry(0.06,2.30,0.22),cb,2.34,0,0.92);
  [-1,1].forEach(function(s){M2(new THREE.BoxGeometry(3.20,0.09,0.09),cb,0,0.20,s*1.10)});

  // Wheels
  carW=[];carS=[];
  var wGeo=new THREE.CylinderGeometry(0.46,0.46,0.44,20);
  var rGeo=new THREE.CylinderGeometry(0.32,0.32,0.45,10);
  var hGeo=new THREE.CylinderGeometry(0.11,0.11,0.46,8);
  [[-0.95,-1.15],[-0.95,1.15],[0.95,-1.15],[0.95,1.15]].forEach(function(wp){
    var wg=new THREE.Group();
    var t=new THREE.Mesh(wGeo,wh);t.rotation.x=Math.PI/2;t.name='wh';wg.add(t);
    var rg=new THREE.Group();var rim=new THREE.Mesh(rGeo,ch);rim.rotation.x=Math.PI/2;rim.name='rim';rg.add(rim);
    for(var si=0;si<5;si++){var sa=si*Math.PI*2/5;var spk=new THREE.Mesh(new THREE.BoxGeometry(0.035,0.06,0.37),ch);spk.position.set(Math.cos(sa)*0.18,Math.sin(sa)*0.18,0);spk.rotation.z=sa+Math.PI/2;rg.add(spk)}
    wg.add(rg);var hub=new THREE.Mesh(hGeo,ch);hub.rotation.x=Math.PI/2;wg.add(hub);
    wg.position.set(wp[0],0.46,wp[1]);car.add(wg);
  });
  car.traverse(function(ch){if(ch.name==='wh'||ch.name==='rim'){carW.push(ch);carS.push(0)}});
  S.add(car);
}

// === UPDATE (fixed steering + collision) ===
function up(dt){
  if(!play)return;if(dt>0.15)dt=0.15;

  // READ INPUT
  if(ks['w']||ks['arrowup'])thr=1;else if(ks['s']||ks['arrowdown'])thr=-0.5;else thr=0;
  if(ks['a']||ks['arrowleft'])sIn=-1;else if(ks['d']||ks['arrowright'])sIn=1;else sIn=0;

  // STEERING (much more responsive, minimum sf=0.35)
  str+=(sIn*0.7-str)*Math.min(dt*CRV,1);
  var force=0;
  if(thr>0&&spd<MXS)force=ENG*thr;else if(thr<0)force=ENG*thr*0.3;
  var brake=br*BRK;
  if(Math.abs(spd)<0.05&&thr===0&&br===0)spd=0;
  if(ntO&&nt>0){force+=NB;nt-=28*dt;if(nt<=0){nt=0;ntO=false}}else if(!ntO&&nt<100)nt+=8*dt;
  spd+=force*dt;spd-=brake*dt;spd*=0.987;
  spd=Math.max(-25,Math.min(MXS,spd));

  // STEERING: minimum turn rate even at 0 speed
  var sf=0.4+Math.min(Math.abs(spd)/80,1)*0.6;
  ang+=str*sf*dt*3.5;

  // MOVE + COLLISION
  var nx=px+Math.cos(ang)*spd*dt,nz=pz-Math.sin(ang)*spd*dt;

  if(!colliding(nx,nz)){
    // Free to move
    px=nx;pz=nz;
    document.getElementById('stuck').style.display='none';
  }else{
    // Collision! Try sliding along X or Z
    var okX=!colliding(nx,pz),okZ=!colliding(px,nz);
    if(okX){px=nx;spd*=0.6}else if(okZ){pz=nz;spd*=0.6}else{spd*=-0.5} // bounce
    if(!okX&&!okZ){document.getElementById('stuck').style.display='block'}
  }

  // Boundary
  px=Math.max(-400,Math.min(400,px));pz=Math.max(-400,Math.min(400,pz));

  // Gear
  var g='N';if(spd<-0.5)g='R';else if(spd<40)g='1';else if(spd<90)g='2';else if(spd<150)g='3';else if(spd<220)g='4';else if(spd<290)g='5';else g='6';

  // Camera
  if(vw===0){C.position.lerp(new THREE.Vector3(px-Math.cos(ang)*10,5,pz+Math.sin(ang)*10),6*dt);C.lookAt(px,1,pz)}
  else if(vw===1){C.position.set(px+Math.cos(ang)*1.2,1.25,pz-Math.sin(ang)*1.2);C.quaternion.setFromEuler(new THREE.Euler(-0.05,ang+Math.PI,0,'YXZ'))}
  else if(vw===2){C.position.lerp(new THREE.Vector3(px-Math.cos(ang)*16,8,pz+Math.sin(ang)*16),5*dt);C.lookAt(px,0.5,pz)}
  else{C.position.lerp(new THREE.Vector3(px,60,pz+3),4*dt);C.lookAt(px,0,pz)}

  car.position.set(px,0.05,pz);car.rotation.y=ang+Math.PI;
  var wr=spd*dt*2.5;
  for(var i=0;i<carW.length;i++){carS[i]+=wr;carW[i].rotation.z=carS[i]}

  document.getElementById('sp').textContent=Math.abs(Math.floor(spd*3.2));
  document.getElementById('gr').textContent=g;
}

var lt=0;
function loop(t){requestAnimationFrame(loop);var dt=(t-lt)/1000;lt=t;if(dt>0&&dt<5)up(dt);R.render(S,C)}
init();
})();
</script></body></html>
