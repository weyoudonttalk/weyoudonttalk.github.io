<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>极速赛车 · 3D · MIUI STUDIO</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,"PingFang SC",sans-serif;touch-action:none;overscroll-behavior:none}
  #cv{width:100%;height:100%;display:block}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:4;color:#fff;font-size:13px;text-shadow:0 1px 3px #000}
  #spd{position:absolute;right:18px;top:max(16px,env(safe-area-inset-top));font-size:30px;font-weight:800;color:#5ef0ff}
  #spd small{font-size:13px;font-weight:400;color:#9ef}
  #dist{position:absolute;left:18px;top:max(16px,env(safe-area-inset-top));font-size:14px;color:#cfe}
  #best{position:absolute;left:18px;top:calc(max(16px,env(safe-area-inset-top)) + 22px);font-size:12px;color:#9ab}
  /* 转向区 */
  #steer{position:fixed;inset:0;z-index:5;pointer-events:auto}
  /* 加速按钮 */
  #gas{position:fixed;right:22px;bottom:max(80px,calc(env(safe-area-inset-bottom) + 80px));width:96px;height:96px;border-radius:50%;background:radial-gradient(circle,#ffd166,#d98324);border:3px solid #fff3;z-index:7;pointer-events:auto;display:flex;align-items:center;justify-content:center;color:#5a3a00;font-size:16px;font-weight:800;box-shadow:0 4px 16px #0008}
  /* 加载动画 + 真实进度条（大厂风） */
  #start{position:fixed;inset:0;background:rgba(4,7,13,.66);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#dfe;text-align:center;padding:0 24px;backdrop-filter:blur(2px)}
  #start h1{font-size:27px;letter-spacing:5px;margin-bottom:16px;font-weight:800;background:linear-gradient(90deg,#8aa0ff,#5ef0ff,#8aa0ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;background-size:220% auto;animation:tg 3s linear infinite;text-shadow:0 0 22px #5b8cff55}
  @keyframes tg{to{background-position:220% center}}
  #stage{position:relative;width:200px;height:200px;margin-bottom:14px}
  #stage canvas{position:absolute;inset:0;width:200px!important;height:200px!important;opacity:0;transition:opacity .6s}
  #rings{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity .5s}
  #rings b{position:absolute;border-radius:50%;border:2px solid transparent}
  #rings b:nth-child(1){width:172px;height:172px;border-top-color:#5ef0ff;border-right-color:#5ef0ff;animation:r1 1.6s linear infinite;box-shadow:0 0 16px #5ef0ff44}
  #rings b:nth-child(2){width:132px;height:132px;border-bottom-color:#7b5cff;border-left-color:#7b5cff;animation:r2 2.3s linear infinite}
  #rings b:nth-child(3){width:94px;height:94px;border-top-color:#5b8cff;border-bottom-color:#5b8cff;animation:r1 1.1s linear infinite}
  @keyframes r1{to{transform:rotate(360deg)}}
  @keyframes r2{to{transform:rotate(360deg)}}
  #pct{font-size:24px;font-weight:800;color:#5ef0ff;text-shadow:0 0 12px #5ef0ff66;margin-top:2px}
  #bar{width:min(300px,78vw);height:8px;border-radius:6px;overflow:hidden;background:#ffffff14;margin-top:14px}
  #barfill{height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#7b5cff,#5ef0ff,#8aa0ff,#5ef0ff);background-size:300% 100%;animation:flow 1.2s linear infinite;box-shadow:0 0 12px #5ef0ff88}
  @keyframes flow{to{background-position:300% 0}}
  #lmsg{font-size:12px;color:#8aa;margin-top:12px;min-height:16px;letter-spacing:1px}
  #startBtn{margin-top:22px;padding:13px 42px;border:0;border-radius:28px;background:linear-gradient(135deg,#7b5cff,#00d4ff);color:#fff;font-size:17px;font-weight:700;cursor:pointer;opacity:.35;pointer-events:none;transition:opacity .3s,transform .15s;box-shadow:0 6px 20px #5ef0ff44}
  #startBtn.on{opacity:1;pointer-events:auto;animation:bp 2s ease-in-out infinite}
  #startBtn.on:active{transform:scale(.96)}
  @keyframes bp{50%{box-shadow:0 6px 30px #5ef0ffaa}}

  #over{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center}
  #over h1{font-size:34px;color:#ff6b6b;margin-bottom:8px}
  #over button{margin-top:20px;padding:12px 30px;border:0;border-radius:24px;background:linear-gradient(135deg,#7b5cff,#00d4ff);color:#fff;font-size:16px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <div id="dist">里程 <span id="d">0</span> m</div>
  <div id="best">最佳 <span id="b">0</span> m</div>
  <div id="spd">0<small> km/h</small></div>
</div>
<div id="steer"></div>
<div id="gas">加速</div>

<div id="start">
  <h1>极速赛车</h1>
  <div id="stage">
    <div id="rings"><b></b><b></b><b></b></div>
    <canvas id="preview"></canvas>
  </div>
  <div id="pct">0%</div>
  <div id="bar"><div id="barfill"></div></div>
  <div id="lmsg">正在启动引擎…</div>
  <button id="startBtn">加载中…</button>
</div>

<div id="over">
  <h1 id="ot">撞车了</h1>
  <div id="os" style="color:#9ab;margin-top:6px"></div>
  <button onclick="location.reload()">再来一局</button>
</div>

<script>
(function(){
  window.__pageStart=performance.now();
  var b=document.getElementById('barfill'),p=document.getElementById('pct'),m=document.getElementById('lmsg');
  if(m)m.textContent='正在启动引擎…';
  window.__boot=setInterval(function(){
    var f=Math.min(0.99,(performance.now()-window.__pageStart)/24000);
    if(b)b.style.width=(f*100).toFixed(0)+'%';
    if(p)p.textContent=Math.floor(f*100)+'%';
  },150);
})();
</script>
<script type="importmap">
{ "imports": {
  "three": "./lib/three.module.js",
  "three/addons/": "./lib/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const cv=document.getElementById('cv');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
if(window.__boot)clearInterval(window.__boot);
let previewOn=false;
const previewScene=new THREE.Scene();previewScene.background=new THREE.Color(0x060a11);
const previewCam=new THREE.PerspectiveCamera(42,1,0.1,100);previewCam.position.set(0,1.0,4.6);
previewScene.add(new THREE.HemisphericLight(0xbfd8ff,0x223044,1.3));
const pdl=new THREE.DirectionalLight(0xffffff,1.6);pdl.position.set(3,5,4);previewScene.add(pdl);
const pCore=new THREE.Mesh(new THREE.IcosahedronGeometry(1.05,1),new THREE.MeshStandardMaterial({color:0x5b8cff,emissive:0x2244aa,emissiveIntensity:0.7,flatShading:true,metalness:0.3,roughness:0.4}));
const pWire=new THREE.Mesh(new THREE.IcosahedronGeometry(1.4,1),new THREE.MeshBasicMaterial({color:0x5ef0ff,wireframe:true,transparent:true,opacity:0.45}));
previewScene.add(pCore,pWire);
let pModel=null;
function setPreviewModel(gltf){if(!gltf)return;try{const m=gltf.scene;const box=new THREE.Box3().setFromObject(m);const c=box.getCenter(new THREE.Vector3());const sz=box.getSize(new THREE.Vector3());const maxd=Math.max(sz.x,sz.y,sz.z)||1;const sc=3.2/maxd;m.scale.setScalar(sc);m.position.set(-c.x*sc,-c.y*sc,-c.z*sc);if(pModel)previewScene.remove(pModel);previewScene.remove(pCore,pWire);previewScene.add(m);pModel=m;document.getElementById('preview').style.opacity='1';document.getElementById('rings').style.opacity='0';}catch(e){}}
function renderPreview(){if(!previewOn)return;requestAnimationFrame(renderPreview);pCore.rotation.y+=0.012;pCore.rotation.x+=0.006;pWire.rotation.y-=0.01;if(pModel)pModel.rotation.y+=0.01;renderer.render(previewScene,previewCam);}
previewOn=true;renderPreview();
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9fc7e8);
scene.fog=new THREE.Fog(0x9fc7e8,60,220);

const camera=new THREE.PerspectiveCamera(70,1,0.1,1000);
scene.add(camera);

const hemi=new THREE.HemisphericLight(0xcfe8ff,0x445533,1.0);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,1.3);
sun.position.set(30,80,40);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-60;sun.shadow.camera.right=60;sun.shadow.camera.top=60;sun.shadow.camera.bottom=-60;sun.shadow.camera.far=200;
scene.add(sun);

// 公路（canvas 纹理：边线+中线虚线）
function roadTex(){
  const c=document.createElement('canvas');c.width=128;c.height=512;const x=c.getContext('2d');
  x.fillStyle='#2a2d33';x.fillRect(0,0,128,512);
  x.fillStyle='#e8e8e8';x.fillRect(10,0,5,512);x.fillRect(113,0,5,512);
  for(let y=0;y<512;y+=70){x.fillRect(61,y,6,38);}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(1,30);return t;
}
const roadMat=new THREE.MeshStandardMaterial({map:roadTex(),roughness:0.9});
const road=new THREE.Mesh(new THREE.PlaneGeometry(22,1200),roadMat);
road.rotation.x=-Math.PI/2;road.position.set(0,-0.01,-400);road.receiveShadow=true;scene.add(road);
// 路边草地
const grass=new THREE.Mesh(new THREE.PlaneGeometry(400,1200),new THREE.MeshStandardMaterial({color:0x4a6b3a}));
grass.rotation.x=-Math.PI/2;grass.position.set(0,-0.05,-400);grass.receiveShadow=true;scene.add(grass);

// 加载法拉利
const loader=new GLTFLoader();
let playerCar=null, aiCars=[];
const LANES=[-7.5,-3.75,0,3.75,7.5];
const AICOL=['#e74c3c','#3498db','#2ecc71','#9b59b6','#f39c12','#1abc9c'];
function prep(m){
  const box=new THREE.Box3().setFromObject(m);const s=new THREE.Vector3();box.getSize(s);
  const k=4.2/s.z; m.scale.setScalar(k);
  const b2=new THREE.Box3().setFromObject(m); m.position.y-=b2.min.y;
  m.traverse(o=>{if(o.isMesh){o.castShadow=true;}});
}
function tint(m,col){m.traverse(o=>{if(o.isMesh&&o.material){const mm=o.material.clone();mm.color=new THREE.Color(col);o.material=mm;}});}
const _bar=document.getElementById('barfill'),_pct=document.getElementById('pct'),_msg=document.getElementById('lmsg'),_btn=document.getElementById('startBtn');
const _pageStart=window.__pageStart||performance.now();
function _set(p){p=Math.max(0,Math.min(0.99,p));_bar.style.width=(p*100).toFixed(0)+'%';_pct.textContent=Math.floor(p*100)+'%';}
const _iv=setInterval(()=>{const f=Math.min(0.99,(performance.now()-_pageStart)/26000);const cur=parseFloat(_bar.style.width||'0')||0;if(f*100>cur)_set(f);},150);
loader.load('./models/ferrari.glb',g=>{
  playerCar=g.scene;prep(playerCar);scene.add(playerCar);
  for(let i=0;i<7;i++){const a=g.scene.clone(true);prep(a);tint(a,AICOL[i%AICOL.length]);scene.add(a);aiCars.push({m:a,active:false,z:0,x:0});}
  clearInterval(_iv);_set(1);_msg.textContent='加载完成 · 准备就绪';_btn.classList.add('on');_btn.textContent='开始竞速';
  setPreviewModel(g);ready=true;
},xhr=>{if(xhr&&xhr.total)_set(xhr.loaded/xhr.total);},()=>{clearInterval(_iv);_msg.textContent='模型加载失败，请刷新重试';});

const S={x:0,z:0,speed:18,dist:0,best:0,gas:false,steer:0,alive:true,started:false};
const distEl=document.getElementById('d'),bestEl=document.getElementById('b'),spdEl=document.getElementById('spd');

function reset(){
  S.x=0;S.z=0;S.speed=18;S.dist=0;S.alive=true;
  aiCars.forEach((a,i)=>{a.active=true;a.x=LANES[i%LANES.length];a.z=-60-i*55;});
}
function spawnAI(a){
  a.active=true;
  a.x=LANES[Math.floor(Math.random()*LANES.length)];
  a.z=S.z-200-Math.random()*120;
}

// 控制
const steer=document.getElementById('steer');
let stId=null,stSide=0;
steer.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];stSide=t.clientX<innerWidth/2?-1:1;},{passive:false});
steer.addEventListener('touchend',e=>{e.preventDefault();stSide=0;},{passive:false});
document.getElementById('gas').addEventListener('touchstart',e=>{e.preventDefault();S.gas=true;});
document.getElementById('gas').addEventListener('touchend',e=>{e.preventDefault();S.gas=false;});

function loop(){
  requestAnimationFrame(loop);
  const dt=0.016;
  if(S.started&&S.alive){
    S.speed += (S.gas?16:6)*dt; if(S.speed>60)S.speed=60; if(!S.gas&&S.speed>18)S.speed-=8*dt;
    S.z -= S.speed*dt; S.dist = -S.z;
    S.x += stSide*9*dt; S.x=Math.max(-8.6,Math.min(8.6,S.x));
    if(playerCar){playerCar.position.set(S.x,0,S.z);playerCar.rotation.y=stSide*-0.12;}
    // AI
    for(const a of aiCars){
      if(!a.active){if(Math.random()<0.01)spawnAI(a);continue;}
      a.m.position.set(a.x,0,a.z);
      if(Math.abs(a.z-S.z)<4.5 && Math.abs(a.x-S.x)<2.3){S.alive=false;crash();}
      if(a.z>S.z+30){a.active=false;} // 已驶过
    }
    // 相机第三人称
    camera.position.set(S.x*0.4,4.2,S.z+9);
    camera.lookAt(S.x*0.2,1.0,S.z-12);
    // 公路纹理滚动
    roadMat.map.offset.y = S.dist*0.02;
    // HUD
    distEl.textContent=Math.floor(S.dist);
    if(S.dist>S.best)S.best=S.dist;
    bestEl.textContent=Math.floor(S.best);
    spdEl.innerHTML=Math.floor(S.speed*3.0)+'<small> km/h</small>';
  }
  renderer.render(scene,camera);
}
function crash(){
  document.getElementById('over').style.display='flex';
  document.getElementById('ot').textContent='💥 撞车了';
  document.getElementById('os').textContent='里程 '+Math.floor(S.dist)+' m · 最佳 '+Math.floor(S.best)+' m';
}
function resize(){const w=innerWidth,h=innerHeight;camera.aspect=w/h;camera.updateProjectionMatrix();previewCam.aspect=w/h;previewCam.updateProjectionMatrix();renderer.setSize(w,h);}
addEventListener('resize',resize);resize();

let ready=false,loopOn=false;
document.getElementById('startBtn').addEventListener('click',()=>{
  if(!ready)return;
  previewOn=false;
  document.getElementById('start').style.display='none';
  reset();S.started=true;
  if(!loopOn){loopOn=true;loop();}
});
</script>
</body>
</html>
