<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>MIUI 聊天室 · 零服务器实时版</title>
<meta name="description" content="MIUI工作室官方聊天室：纯前端架构，无需服务器，跨标签页实时同步，AI小Q守护。">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--c1:#7b5cff;--c2:#00d4ff;--g:linear-gradient(135deg,#7b5cff,#00d4ff);--bg:#070912;--bg2:#0d1322;--card:#111a2e;--line:rgba(255,255,255,.08);--t:#eaf0ff;--t2:#9aa7c7;--t3:#5f6b8a}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:radial-gradient(ellipse at 50% -10%,#15193a,#070912 60%);color:var(--t);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
/* 登录 */
#login{position:fixed;inset:0;z-index:50;background:radial-gradient(ellipse at 50% 0%,#1a1f44,#070912 70%);display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:min(380px,92vw);background:rgba(17,26,46,.7);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:22px;padding:36px 28px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.login-card .lc-logo{width:64px;height:64px;border-radius:18px;background:var(--g);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 18px;box-shadow:0 8px 28px rgba(123,92,255,.4)}
.login-card h1{font-size:22px;font-weight:800;margin-bottom:6px}
.login-card p{font-size:13px;color:var(--t2);margin-bottom:24px}
.login-card input{width:100%;padding:13px 16px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);color:var(--t);font-size:14px;margin-bottom:14px;outline:none}
.login-card input:focus{border-color:var(--c1)}
.login-card button{width:100%;padding:13px;border-radius:12px;border:none;background:var(--g);color:#fff;font-size:15px;font-weight:700;transition:.2s}
.login-card button:hover{transform:translateY(-2px)}
.login-card .hint{font-size:11px;color:var(--t3);margin-top:14px;line-height:1.6}
/* 主界面 */
#app{display:none;height:100%;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:rgba(13,19,34,.6);backdrop-filter:blur(12px)}
.topbar .rm{width:40px;height:40px;border-radius:12px;background:var(--g);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.topbar .ti{flex:1;min-width:0}
.topbar .ti .nm{font-size:15px;font-weight:800}
.topbar .ti .st{font-size:11px;color:var(--t2);display:flex;align-items:center;gap:6px}
.topbar .ti .st .dot{width:7px;height:7px;border-radius:50%;background:#22e07e;box-shadow:0 0 8px #22e07e}
.topbar .acts{display:flex;gap:8px}
.topbar .acts button{width:38px;height:38px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--t);font-size:16px;transition:.2s}
.topbar .acts button:hover{border-color:var(--c1)}
.msgs{flex:1;overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:12px}
.msgs::-webkit-scrollbar{width:6px}.msgs::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.msg{max-width:78%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.6;word-break:break-word;animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg .who{font-size:11px;font-weight:700;margin-bottom:3px;color:var(--c2)}
.msg .tm{font-size:10px;color:var(--t3);margin-top:4px;text-align:right}
.msg.me{align-self:flex-end;background:var(--g);color:#fff;border-bottom-right-radius:4px}
.msg.me .who{color:#dbe4ff}
.msg.other{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.sys{align-self:center;background:rgba(123,92,255,.12);color:#a89bff;font-size:12px;padding:6px 14px;border-radius:20px}
.msg.admin{align-self:flex-start;background:linear-gradient(135deg,#ff5ea8,#ffb86c);color:#fff;border-bottom-left-radius:4px}
.msg .img{max-width:200px;border-radius:10px;margin-top:4px;display:block}
.typing{align-self:flex-start;font-size:12px;color:var(--t3);padding:4px 12px;display:none}
.typing.show{display:block;animation:pop .3s}
.inputbar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line);background:rgba(13,19,34,.6)}
.inputbar input{flex:1;padding:12px 16px;border-radius:24px;background:var(--bg2);border:1px solid var(--line);color:var(--t);font-size:14px;outline:none}
.inputbar input:focus{border-color:var(--c1)}
.inputbar .send{width:46px;height:46px;border-radius:50%;border:none;background:var(--g);color:#fff;font-size:18px;flex-shrink:0;transition:.2s}
.inputbar .send:hover{transform:scale(1.06)}
.inputbar .ic{width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--t);font-size:18px;flex-shrink:0}
/* 抽屉 */
.drawer{position:fixed;inset:0;z-index:60;background:rgba(3,4,10,.7);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center}
.drawer.open{display:flex}
.drawer-box{width:min(420px,94vw);max-height:70vh;overflow-y:auto;background:var(--bg2);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:22px;animation:slide .3s ease}
@keyframes slide{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.drawer-box h3{font-size:16px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.drawer-box .row{display:flex;gap:10px;margin-bottom:10px}
.drawer-box .row input{flex:1;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);color:var(--t);font-size:13px;outline:none}
.drawer-box .row button{padding:10px 16px;border-radius:10px;border:none;background:var(--g);color:#fff;font-size:13px;font-weight:700}
.drawer-box .tip{font-size:11px;color:var(--t3);line-height:1.7;margin-top:8px}
.drawer-box .close{position:absolute;top:16px;right:18px;font-size:20px;color:var(--t3);cursor:pointer}
.drawer-box{position:relative}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 22px;border-radius:18px;font-size:13px;font-weight:600;background:var(--card);color:#fff;box-shadow:0 8px 30px rgba(0,0,0,.5);opacity:0;transition:.3s;z-index:200;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.online-tag{font-size:11px;color:var(--t2)}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <div class="lc-logo">💬</div>
    <h1>MIUI 聊天室</h1>
    <p>零服务器 · 跨标签页实时 · AI小Q守护</p>
    <input id="nickInput" placeholder="输入你的昵称" maxlength="16">
    <button onclick="enter()">🚀 进入聊天室</button>
    <div class="hint">无需注册，输入昵称即可。消息在同浏览器多标签页实时同步；<br>换设备请用「分享房间」导出导入。</div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="rm">💬</div>
    <div class="ti">
      <div class="nm">MIUI 聊天室 <span class="online-tag" id="onlineTag"></span></div>
      <div class="st"><span class="dot"></span><span id="statusText">本地实时模式</span></div>
    </div>
    <div class="acts">
      <button onclick="openShare()" title="分享房间">🔗</button>
      <button onclick="openAdmin()" title="管理">⚙️</button>
      <button onclick="leave()" title="退出">🚪</button>
    </div>
  </div>
  <div class="msgs" id="msgs"></div>
  <div class="typing" id="typing">对方正在输入…</div>
  <div class="inputbar">
    <button class="ic" onclick="document.getElementById('fileInput').click()" title="图片">📷</button>
    <input id="fileInput" type="file" accept="image/*" style="display:none" onchange="sendImage(this)">
    <input id="chatInput" placeholder="说点什么… @小Q 可召唤AI" onkeydown="if(event.key==='Enter')sendMsg()" oninput="notifyTyping()">
    <button class="send" onclick="sendMsg()">➤</button>
  </div>
</div>

<div class="drawer" id="shareDrawer">
  <div class="drawer-box">
    <span class="close" onclick="closeDrawers()">✕</span>
    <h3>🔗 分享房间</h3>
    <div class="row"><input id="exportBox" readonly><button onclick="copyExport()">复制</button></div>
    <div class="tip">把这段代码发给朋友，对方在「导入」粘贴即可同步本房间全部聊天记录（同浏览器实时同步）。</div>
    <h3 style="margin-top:18px">📥 导入房间</h3>
    <div class="row"><input id="importBox" placeholder="粘贴分享码"><button onclick="importRoom()">导入</button></div>
  </div>
</div>

<div class="drawer" id="adminDrawer">
  <div class="drawer-box">
    <span class="close" onclick="closeDrawers()">✕</span>
    <h3>⚙️ 房间管理</h3>
    <div class="row"><input id="roomCode" placeholder="输入房间码加入"><button onclick="joinRoom()">加入</button></div>
    <div class="tip">默认房间：<b>miui-main</b>。管理员可清空聊天（仅本地）。</div>
    <div class="row" style="margin-top:12px"><button onclick="clearChat()" style="background:linear-gradient(135deg,#ff5ea8,#ffb86c)">🗑️ 清空聊天记录</button></div>
    <div class="tip">本聊天室为纯前端架构，消息存于本地浏览器，不上传任何服务器，隐私安全。</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===== 纯前端实时聊天引擎（零服务器）=====
   架构：BroadcastChannel(跨标签页实时) + localStorage(持久化 + storage事件跨标签页同步)
   无 supabase / 无后端，彻底解决"网络错误发送不了" */
var ROOM='miui-main';
var USER=null;
var BC=null;
if('BroadcastChannel' in window){BC=new BroadcastChannel('miui-chat-'+ROOM);}
var LS_KEY='miui_chat_'+ROOM;
var TYP_KEY='miui_typ_'+ROOM;
var ADMIN_KEY='miui_admin_'+ROOM;
var msgs=[];
var isAdmin=false;

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},2200);}
function loadMsgs(){try{msgs=JSON.parse(localStorage.getItem(LS_KEY)||'[]');}catch(e){msgs=[];}}
function saveMsgs(){localStorage.setItem(LS_KEY,JSON.stringify(msgs.slice(-500)));}
function render(){
  var area=document.getElementById('msgs');
  area.innerHTML='';
  msgs.slice(-200).forEach(function(m){area.appendChild(buildMsg(m));});
  area.scrollTop=area.scrollHeight;
}
function buildMsg(m){
  var d=document.createElement('div');
  if(m.type==='system'){d.className='msg sys';d.textContent=m.text;return d;}
  if(m.uid===USER.uid){d.className='msg me';}
  else if(m.isAdmin){d.className='msg admin';}
  else{d.className='msg other';}
  if(m.nick&&m.uid!==USER.uid){var w=document.createElement('div');w.className='who';w.textContent=m.nick;d.appendChild(w);}
  var txt=document.createElement('div');txt.textContent=m.text||'';d.appendChild(txt);
  if(m.img){var im=document.createElement('img');im.className='img';im.src=m.img;d.appendChild(im);}
  var tm=document.createElement('div');tm.className='tm';tm.textContent=m.time;d.appendChild(tm);
  return d;
}
function pushMsg(m){msgs.push(m);saveMsgs();render();if(BC)BC.postMessage({type:'sync'});}
function enter(){
  var n=document.getElementById('nickInput').value.trim();
  if(!n){toast('请先输入昵称');return;}
  USER={uid:'u'+Math.random().toString(36).slice(2,9),nick:n};
  isAdmin=localStorage.getItem(ADMIN_KEY)===ROOM;
  loadMsgs();
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='flex';
  if(msgs.length===0){pushMsg({type:'system',text:'🎉 欢迎来到 MIUI 聊天室！输入 @小Q 召唤 AI'});}
  else render();
  if(BC)BC.onmessage=function(e){if(e.data&&e.data.type==='sync'){loadMsgs();render();}if(e.data&&e.data.type==='typ'){showTyping(e.data.nick);}if(e.data&&e.data.type==='clear'){msgs=[];saveMsgs();render();}};
  window.addEventListener('storage',function(e){if(e.key===LS_KEY){loadMsgs();render();}if(e.key===TYP_KEY){showTyping(JSON.parse(e.newValue||'{}').nick);}});
  updateOnline();
}
function sendMsg(){
  if(!USER)return;
  var inp=document.getElementById('chatInput');
  var text=inp.value.trim();if(!text)return;
  inp.value='';
  var m={uid:USER.uid,nick:USER.nick,text:text,type:'chat',isAdmin:isAdmin,time:now()};
  pushMsg(m);
  if(text.indexOf('@小Q')>=0||text.indexOf('@小q')>=0){
    setTimeout(function(){callAI(text.replace(/@小[qQ]/g,'').trim()||'你好');},600);
  }
}
function sendImage(input){
  if(!USER)return;
  var f=input.files[0];if(!f)return;
  if(f.size>4*1024*1024){toast('图片不能超过4MB');input.value='';return;}
  var rd=new FileReader();
  rd.onload=function(e){
    pushMsg({uid:USER.uid,nick:USER.nick,text:'[图片]',img:e.target.result,type:'chat',isAdmin:isAdmin,time:now()});
  };
  rd.readAsDataURL(f);input.value='';
}
function callAI(q){
  pushMsg({uid:'ai',nick:'🤖 小Q',text:'收到～「'+q+'」我帮你记下了（演示版AI回复）',type:'chat',isAdmin:false,time:now()});
}
function notifyTyping(){
  var payload={nick:USER?USER.nick:''};
  localStorage.setItem(TYP_KEY,JSON.stringify(payload));
  if(BC)BC.postMessage({type:'typ',nick:USER.nick});
  setTimeout(function(){localStorage.removeItem(TYP_KEY);},1500);
}
function showTyping(nick){if(!nick)return;var t=document.getElementById('typing');t.textContent=nick+' 正在输入…';t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},1800);}
function now(){return new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});}
function leave(){if(confirm('退出聊天室？')){USER=null;document.getElementById('app').style.display='none';document.getElementById('login').style.display='flex';}}
/* 分享 / 导入 */
function openShare(){document.getElementById('shareDrawer').classList.add('open');document.getElementById('exportBox').value=ROOM+'$'+btoa(unescape(encodeURIComponent(JSON.stringify(msgs))));}
function copyExport(){var b=document.getElementById('exportBox');b.select();document.execCommand('copy');toast('已复制分享码');}
function importRoom(){var v=document.getElementById('importBox').value.trim();if(!v)return;var i=v.indexOf('$');if(i<0){toast('分享码格式错误');return;}ROOM=v.slice(0,i);localStorage.setItem(ADMIN_KEY,ROOM);initRoom();toast('已导入房间');closeDrawers();}
function joinRoom(){var c=document.getElementById('roomCode').value.trim();if(!c)return;ROOM=c;initRoom();toast('已加入 '+c);closeDrawers();}
function initRoom(){if(BC)BC.close();if('BroadcastChannel' in window)BC=new BroadcastChannel('miui-chat-'+ROOM);LS_KEY='miui_chat_'+ROOM;TYP_KEY='miui_typ_'+ROOM;loadMsgs();render();updateOnline();}
function clearChat(){if(!confirm('确定清空本房间聊天记录？'))return;msgs=[];saveMsgs();render();if(BC)BC.postMessage({type:'clear'});toast('已清空');}
function openAdmin(){document.getElementById('adminDrawer').classList.add('open');}
function closeDrawers(){document.querySelectorAll('.drawer').forEach(function(d){d.classList.remove('open');});}
document.querySelectorAll('.drawer').forEach(function(d){d.addEventListener('click',function(e){if(e.target===d)closeDrawers();});});
function updateOnline(){var n=BC?'多端':'';document.getElementById('onlineTag').textContent='· 本地模式';}
/* 启动：若有历史昵称直接进 */
(function(){var last=localStorage.getItem('miui_last_nick');if(last){document.getElementById('nickInput').value=last;}})();
document.getElementById('nickInput').addEventListener('keydown',function(e){if(e.key==='Enter')enter();});
window.addEventListener('beforeunload',function(){if(USER)localStorage.setItem('miui_last_nick',USER.nick);});
</script>
</body>
</html>
