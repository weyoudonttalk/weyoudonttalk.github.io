<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIUI STUDIO 官方聊天室 - MIUI共同研发团队实时交流</title>
<meta name="description" content="MIUI STUDIO 官方聊天室，MIUI共同研发团队实时交流平台。加入我们，与团队在线聊天、分享灵感、参与游戏研发讨论。">
<meta name="keywords" content="MIUI,MIUI共同研发,MIUI STUDIO,聊天室,游戏研发,QQ轻应用,实时聊天">
<meta name="robots" content="index, follow">
<meta name="author" content="MIUI STUDIO">
<meta property="og:title" content="MIUI STUDIO 官方聊天室">
<meta property="og:description" content="MIUI共同研发团队实时交流平台，加入我们一起聊天。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://weyoudonttalk.github.io/miui-chat/">
<link rel="canonical" href="https://weyoudonttalk.github.io/miui-chat/">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "MIUI STUDIO",
  "url": "https://weyoudonttalk.github.io/miui-chat/",
  "description": "MIUI共同研发团队官方官网与实时聊天室"
}
</script>
<style>
  :root{
    --bg:#0a0e1a; --card:#131a2e; --line:#22304d;
    --txt:#e6ecff; --sub:#8a94b8; --acc:#4d7cff; --acc2:#22d3ee;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
  .wrap{max-width:820px;margin:0 auto;padding:24px 16px 60px}
  header{text-align:center;padding:32px 0 20px}
  header h1{font-size:28px;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
  header p{color:var(--sub);margin-top:8px;font-size:14px}
  .chat{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .msg-box{height:56vh;overflow-y:auto;padding:16px}
  .msg{display:flex;margin-bottom:14px;animation:pop .2s ease}
  .msg .ava{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0}
  .msg .body{margin-left:10px;max-width:78%}
  .msg .name{font-size:12px;color:var(--acc2);margin-bottom:3px}
  .msg .txt{background:#1b2440;padding:9px 13px;border-radius:4px 12px 12px 12px;font-size:15px;line-height:1.5;word-break:break-word}
  .msg.me{flex-direction:row-reverse}
  .msg.me .body{margin-left:0;margin-right:10px;display:flex;flex-direction:column;align-items:flex-end}
  .msg.me .txt{background:var(--acc);border-radius:12px 4px 12px 12px}
  .msg.me .name{color:#c3d3ff}
  .input-bar{display:flex;gap:10px;padding:12px;border-top:1px solid var(--line);background:#0f1526}
  .input-bar input{flex:1;background:#1b2440;border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--txt);font-size:15px;outline:none}
  .input-bar input:focus{border-color:var(--acc)}
  .input-bar button{background:linear-gradient(90deg,var(--acc),var(--acc2));border:none;border-radius:10px;padding:0 22px;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
  .input-bar button:active{opacity:.85}
  .status{text-align:center;font-size:12px;color:var(--sub);padding:8px 0}
  .status.on{color:#35d07f}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  footer{text-align:center;color:var(--sub);font-size:12px;margin-top:24px;line-height:1.8}
  footer a{color:var(--acc2)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>MIUI STUDIO 聊天室</h1>
    <p>MIUI共同研发团队 · 实时交流</p>
  </header>

  <div class="chat">
    <div class="status" id="status">连接中...</div>
    <div class="msg-box" id="box"></div>
    <div class="input-bar">
      <input id="nameInput" placeholder="你的昵称" maxlength="12">
      <input id="msgInput" placeholder="说点什么..." maxlength="300">
      <button id="send">发送</button>
    </div>
  </div>

  <footer>
    MIUI STUDIO 官方聊天室 · 一起搞游戏研发 🎮<br>
    <a href="https://weyoudonttalk.github.io/miui-studio/">返回官网首页</a>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://paovashswyzcunthhkvt.supabase.co";
  const SUPABASE_KEY = "sb_publishable_-yxNhPM-yJC5YX0TwgpKrQ_dsQ3N3LI";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const box = document.getElementById("box");
  const status = document.getElementById("status");
  const nameInput = document.getElementById("nameInput");
  const msgInput = document.getElementById("msgInput");
  const send = document.getElementById("send");

  // 记住昵称
  const savedName = localStorage.getItem("miui_nick");
  if (savedName) nameInput.value = savedName;

  function scrollBottom() { box.scrollTop = box.scrollHeight; }

  function renderMsg(m, isMe) {
    const div = document.createElement("div");
    div.className = "msg" + (isMe ? " me" : "");
    const initial = (m.username || "客").slice(0, 1);
    div.innerHTML =
      '<div class="ava">' + initial + '</div>' +
      '<div class="body">' +
        '<div class="name">' + (m.username || "游客") + '</div>' +
        '<div class="txt"></div>' +
      '</div>';
    div.querySelector(".txt").textContent = m.content;
    box.appendChild(div);
    scrollBottom();
  }

  // 拉取历史消息
  async function loadHistory() {
    const { data, error } = await supabase
      .from("messages")
      .select("*")
      .order("id", { ascending: false })
      .limit(50);
    if (error) { console.error(error); return; }
    const me = nameInput.value.trim();
    [...data].reverse().forEach(m => renderMsg(m, m.username === me));
  }

  async function init() {
    try {
      await loadHistory();
      status.textContent = "已连接 · 实时聊天中";
      status.className = "status on";
    } catch (e) {
      status.textContent = "连接失败，请刷新重试";
    }
    // 订阅实时消息
    supabase
      .channel("chat")
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" },
        (payload) => {
          const m = payload.new;
          const me = nameInput.value.trim();
          renderMsg(m, m.username === me);
        })
      .subscribe();
  }

  async function doSend() {
    const name = nameInput.value.trim() || "游客";
    const content = msgInput.value.trim();
    if (!content) return;
    localStorage.setItem("miui_nick", name);
    const { error } = await supabase
      .from("messages")
      .insert([{ username: name, content: content }]);
    if (error) { alert("发送失败：" + error.message); return; }
    msgInput.value = "";
  }

  send.addEventListener("click", doSend);
  msgInput.addEventListener("keydown", e => { if (e.key === "Enter") doSend(); });

  init();
</script>
</body>
</html>
