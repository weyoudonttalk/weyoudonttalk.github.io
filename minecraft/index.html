<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>我的世界 · 手机版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#87ceeb;touch-action:none;-webkit-user-select:none;user-select:none;font-family:'PingFang SC',system-ui,sans-serif}
canvas{display:block;position:fixed;top:0;left:0;z-index:0}
#cover{position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center}
#cover .card{background:#1a1a28;border-radius:24px;padding:36px 28px;text-align:center;color:#fff;width:85vw;max-width:320px}
#cover h2{font-size:24px;margin-bottom:8px}
#cover p{font-size:13px;color:#aaa;margin-bottom:24px;line-height:1.7}
#cover .big-btn{display:block;width:100%;padding:18px;border-radius:14px;border:none;background:linear-gradient(135deg,#ff6900,#ff4400);color:#fff;font-size:18px;font-weight:700;cursor:pointer}
#cover .big-btn:active{transform:scale(.96);opacity:.8}

#bar{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:6px}
#bar button{width:40px;height:40px;border-radius:10px;border:2px solid rgba(255,255,255,.2);background:rgba(0,0,0,.5);font-size:18px;cursor:pointer;color:#fff}
#bar button.on{border-color:#ff6900;background:rgba(255,105,0,.3);transform:scale(1.1)}
#bar button:active{transform:scale(.9)}

#joyWrap{position:fixed;bottom:80px;left:24px;z-index:10;width:110px;height:110px}
#joyWrap .base{width:100%;height:100%;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15)}
#joyWrap .knob{position:absolute;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.2);top:50%;left:50%;margin:-26px 0 0 -26px}

#btns{position:fixed;bottom:90px;right:16px;z-index:10;display:flex;flex-direction:column;gap:10px}
#btns button{width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.15);color:#fff;font-size:24px;cursor:pointer}
#btns button:active{background:rgba(255,105,0,.35);border-color:#ff6900}

#jumpBtn{position:fixed;bottom:200px;right:24px;z-index:10;width:60px;height:60px;border-radius:50%;background:rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.2);color:#fff;font-size:26px;cursor:pointer}
#jumpBtn:active{background:rgba(255,105,0,.35);border-color:#ff6900}

#tip{position:fixed;bottom:52px;left:50%;transform:translateX(-50%);z-index:10;color:rgba(255,255,255,.5);font-size:11px;pointer-events:none;text-align:center}
</style>
</head>
<body>

<div id="cover"><div class="card">
  <h2>⛏️ 我的世界</h2>
  <p>手机触屏版 · MIUI工作室<br>建造属于你的世界！</p>
  <button class="big-btn" id="startBtn">🎮 开始游戏</button>
</div></div>

<div id="bar">
  <button class="on" onclick="pick(0)">🟫</button>
  <button onclick="pick(1)">🟩</button>
  <button onclick="pick(2)">⬜</button>
  <button onclick="pick(3)">🟨</button>
  <button onclick="pick(4)">🪵</button>
  <button onclick="pick(5)">🍂</button>
</div>

<div id="joyWrap"><div class="base"></div><div class="knob"></div></div>

<div id="btns">
  <button id="placeBtn">🧱</button>
  <button id="mineBtn">⛏️</button>
</div>
<button id="jumpBtn">🦘</button>
<div id="tip">👆点方块挖掉 · 长按放方块 · 顶部切换材料 · 左下移动 · 滑动屏幕看四周 · 右下🦘跳跃</div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
// ====================================================
// 我的世界 · 手机版 — 纯触屏，无PointerLock
// ====================================================

// ----- SCENE -----
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,60,180);

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,300);
camera.position.set(0,15,0);
camera.quaternion.setFromEuler(new THREE.Euler(-.05,0,0,'YXZ'));

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

window.addEventListener('resize',function(){
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
});

// ----- LIGHT -----
scene.add(new THREE.AmbientLight(0x8899bb,.7));
const sun=new THREE.DirectionalLight(0xfff5e0,1.1);
sun.position.set(50,80,30);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.near=.5;sun.shadow.camera.far=200;
sun.shadow.camera.left=-60;sun.shadow.camera.right=60;
sun.shadow.camera.top=60;sun.shadow.camera.bottom=-60;
scene.add(sun);

// Ground
const gGeo=new THREE.PlaneGeometry(200,200);
const gMat=new THREE.MeshLambertMaterial({color:0x6b8e23});
const ground=new THREE.Mesh(gGeo,gMat);
ground.rotation.x=-Math.PI/2;ground.position.y=-.01;
ground.receiveShadow=true;scene.add(ground);

// ----- BLOCKS -----
const COLORS=[0x8b6914,0x567d46,0x808080,0xe8d5a3,0x8b6b4a,0x2d5a1e];
let pickIdx=0;
window.pick=function(n){
  pickIdx=n;
  document.querySelectorAll('#bar button').forEach(function(b,i){b.classList.toggle('on',i===n)});
};

const blockMats=COLORS.map(function(c){return new THREE.MeshLambertMaterial({color:c})});
const blockGeo=new THREE.BoxGeometry(1,1,1);
const blocks={}; // "x,y,z" -> mesh

function add(x,y,z,t){
  const k=x+','+y+','+z;if(blocks[k])return;
  const m=new THREE.Mesh(blockGeo,blockMats[t||0]);
  m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;
  m.userData={t:t||0,x:x,y:y,z:z};
  scene.add(m);blocks[k]=m;
}
function rem(x,y,z){const k=x+','+y+','+z;const m=blocks[k];if(m){scene.remove(m);delete blocks[k]}}
function get(x,y,z){return blocks[x+','+y+','+z]||null}

// ----- TERRAIN -----
const generated=new Set();
function genChunk(cx,cz){
  for(let x=cx-8;x<cx+8;x++)for(let z=cz-8;z<cz+8;z++){
    let h=10+Math.sin(x*.15)*4+Math.cos(z*.15)*4+Math.sin(x*.05+z*.07)*6+Math.cos(x*.08-z*.06)*5;
    h=Math.round(Math.max(3,Math.min(h,24)));
    for(let y=1;y<h-3;y++)add(x,y,z,2);
    for(let y=Math.max(1,h-3);y<h;y++)add(x,y,z,0);
    add(x,h,z,1);
    if(h<=5)for(let y=1;y<=h;y++)add(x,y,z,3);
    if(h>7&&Math.random()<.08&&x%5===0&&z%5===0){
      for(let ty=h+1;ty<=h+4;ty++)add(x,ty,z,4);
      for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++){
        if((Math.abs(dx)===2&&Math.abs(dz)===2)||(dx===0&&dz===0))continue;
        for(let dy=h+2;dy<=h+5;dy++)if(Math.random()<.7)add(x+dx,dy,z+dz,5);
      }
    }
  }
  generated.add(cx+','+cz);
}
function ensure(){
  const cx=Math.round(camera.position.x/16)*16;
  const cz=Math.round(camera.position.z/16)*16;
  if(!generated.has(cx+','+cz))genChunk(cx,cz);
}
genChunk(0,0);genChunk(16,0);genChunk(-16,0);genChunk(0,16);genChunk(0,-16);

// ----- RAYCASTER -----
const raycaster=new THREE.Raycaster();raycaster.far=8;
function ray(){
  const d=new THREE.Vector3(0,0,-1);d.applyQuaternion(camera.quaternion);
  raycaster.set(camera.position,d);
  const hs=raycaster.intersectObjects(Object.values(blocks));
  if(!hs.length)return null;
  const m=hs[0].object;const n=hs[0].face.normal.clone();
  n.x=Math.round(n.x);n.y=Math.round(n.y);n.z=Math.round(n.z);
  return{hit:m,px:m.position.x+n.x,py:m.position.y+n.y,pz:m.position.z+n.z};
}

// ----- INPUT -----
let moveX=0,moveZ=0,jumpFlag=false;
let yaw=0,pitch=-.05; // radians

// Joystick
const joyBase=document.getElementById('joyWrap');
const joyKnob=document.querySelector('#joyWrap .knob');
let joyTouch=null,joySX=0,joySY=0;
const joyR=40;

joyBase.addEventListener('touchstart',function(e){
  e.preventDefault();e.stopPropagation();
  const t=e.changedTouches[0];
  joyTouch=t.identifier;
  const r=joyBase.getBoundingClientRect();
  joySX=r.left+r.width/2;joySY=r.top+r.height/2;
},true);
joyBase.addEventListener('touchmove',function(e){
  e.preventDefault();e.stopPropagation();
  for(let i=0;i<e.touches.length;i++)if(e.touches[i].identifier===joyTouch){
    const dx=e.touches[i].clientX-joySX,dy=e.touches[i].clientY-joySY;
    const d=Math.min(joyR,Math.sqrt(dx*dx+dy*dy));
    const a=Math.atan2(dy,dx);
    const kx=Math.cos(a)*d/joyR,ky=Math.sin(a)*d/joyR;
    joyKnob.style.transform='translate('+kx*joyR+'px,'+ky*joyR+'px)';
    moveX=kx;moveZ=-ky;
  }
},true);
joyBase.addEventListener('touchend',function(e){e.preventDefault();joyTouch=null;moveX=0;moveZ=0;joyKnob.style.transform='translate(0,0)'},true);
joyBase.addEventListener('touchcancel',function(e){joyTouch=null;moveX=0;moveZ=0;joyKnob.style.transform='translate(0,0)'},true);

// Camera look (touch on rest of screen)
let lookTouch=null,lx=0,ly=0;
document.addEventListener('touchstart',function(e){
  for(let i=0;i<e.touches.length;i++){
    const t=e.touches[i];
    const el=document.elementFromPoint(t.clientX,t.clientY);
    if(el&&(el.closest('#joyWrap')||el.closest('#btns')||el.closest('#jumpBtn')||el.closest('#bar')||el.closest('#cover')))continue;
    lookTouch=t.identifier;lx=t.clientX;ly=t.clientY;break;
  }
},{passive:true});
document.addEventListener('touchmove',function(e){
  if(lookTouch===null)return;
  for(let i=0;i<e.touches.length;i++)if(e.touches[i].identifier===lookTouch){
    const dx=e.touches[i].clientX-lx,dy=e.touches[i].clientY-ly;
    yaw-=dx*.005;pitch-=dy*.005;
    pitch=Math.max(-1.1,Math.min(.7,pitch));
    lx=e.touches[i].clientX;ly=e.touches[i].clientY;
    camera.quaternion.setFromEuler(new THREE.Euler(pitch,yaw,0,'YXZ'));
  }
},{passive:true});
document.addEventListener('touchend',function(e){
  for(let i=0;i<e.touches.length;i++)if(e.touches[i].identifier===lookTouch)return;
  lookTouch=null;
});

// Action buttons
document.getElementById('placeBtn').addEventListener('touchstart',function(e){
  e.preventDefault();e.stopPropagation();
  const r=ray();if(!r)return;
  const px=Math.floor(camera.position.x),py=Math.floor(camera.position.y-1),pz=Math.floor(camera.position.z);
  if(!(r.px===px&&(r.py===py||r.py===py+1)&&r.pz===pz))add(r.px,r.py,r.pz,pickIdx);
  ensure();
});
document.getElementById('mineBtn').addEventListener('touchstart',function(e){
  e.preventDefault();e.stopPropagation();
  const r=ray();if(r)rem(r.hit.position.x,r.hit.position.y,r.hit.position.z);
});
document.getElementById('jumpBtn').addEventListener('touchstart',function(e){
  e.preventDefault();e.stopPropagation();jumpFlag=true;
});
document.getElementById('jumpBtn').addEventListener('touchend',function(e){jumpFlag=false});

// ----- MOVEMENT -----
let vy=0,canJump=true,onGround=false;
function update(dt){
  if(dt>.2)dt=.2;
  const spd=6;
  const f=new THREE.Vector3(0,0,1).applyQuaternion(camera.quaternion);f.y=0;f.normalize();
  const r=new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);r.y=0;r.normalize();
  const dx=(f.x*moveZ+r.x*moveX)*spd*dt;
  const dz=(f.z*moveZ+r.z*moveX)*spd*dt;
  onGround=camera.position.y<=1.05;
  if(!onGround)vy-=20*dt;else vy=0;
  if(jumpFlag&&onGround&&canJump){vy=8;canJump=false;onGround=false}
  if(!jumpFlag)canJump=true;
  const dy=vy*dt;
  const nx=camera.position.x+dx,nz=camera.position.z+dz,ny=camera.position.y+dy;
  let bx=false,bz=false,by=false;
  if(get(Math.floor(nx),Math.floor(camera.position.y),Math.floor(camera.position.z)))bx=true;
  if(get(Math.floor(camera.position.x),Math.floor(camera.position.y),Math.floor(nz)))bz=true;
  if(ny<1)by=true;
  if(get(Math.floor(camera.position.x),Math.floor(ny-1),Math.floor(camera.position.z)))by=true;
  if(!by)camera.position.y=ny;else{camera.position.y=Math.max(1,camera.position.y);vy=0}
  if(!bx)camera.position.x=nx;
  if(!bz)camera.position.z=nz;
  ensure();
}

// ----- GAME LOOP -----
let playing=false,lastTime=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!playing){renderer.render(scene,camera);return}
  const dt=(t-lastTime)/1000;lastTime=t;
  if(dt>0)update(dt);
  renderer.render(scene,camera);
}

// ----- START -----
document.getElementById('startBtn').addEventListener('click',function(){
  playing=true;lastTime=performance.now();
  document.getElementById('cover').style.display='none';
});

requestAnimationFrame(loop);
</script>
</body>
</html>
