<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title id="pageTitle">我的专属网站</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;background:linear-gradient(180deg,#0f0c29,#1a1640);min-height:100vh;color:#fff}
.topbar{position:fixed;top:0;left:0;right:0;z-index:99;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;background:rgba(15,12,41,.85);backdrop-filter:blur(20px)}
.topbar .title{font-size:15px;font-weight:700}
.topbar .actions{display:flex;gap:8px}
.topbar .actions button{padding:6px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:11px;cursor:pointer}
.topbar .actions button:active{background:rgba(255,255,255,.15)}
.container{max-width:500px;margin:0 auto;padding:70px 16px 30px}

/* Cover */
.cover{height:180px;background:linear-gradient(135deg,#ff6900,#ff6b6b,#667eea);border-radius:20px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:50px;position:relative}
.cover .av-wrap{position:absolute;bottom:-40px;display:flex;flex-direction:column;align-items:center}
.cover .av{width:80px;height:80px;border-radius:50%;border:4px solid #fff;display:flex;align-items:center;justify-content:center;font-size:40px;background:#1a1640}
.cover .av img{width:100%;height:100%;object-fit:cover;border-radius:50%}

.info{text-align:center;margin-bottom:20px}
.info .name{font-size:22px;font-weight:800}
.info .sign{font-size:13px;opacity:.6;margin-top:4px}
.info .email{font-size:11px;opacity:.4;margin-top:4px}

.share-bar{background:rgba(255,105,0,.08);border:1px solid rgba(255,105,0,.2);border-radius:14px;padding:14px;text-align:center;margin-bottom:16px}
.share-bar .share-url{font-size:12px;opacity:.6;word-break:break-all;margin-bottom:8px}
.share-bar button{padding:8px 20px;border-radius:10px;border:none;background:#ff6900;color:#fff;font-weight:600;cursor:pointer;font-size:13px}

.edit-panel{background:rgba(255,255,255,.04);border-radius:14px;padding:16px;margin-bottom:12px}
.edit-panel h3{font-size:12px;opacity:.5;margin-bottom:12px;text-transform:uppercase;letter-spacing:2px}
.edit-panel .row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer}
.edit-panel .row:last-child{border-bottom:none}
.edit-panel .row .icon{font-size:18px;width:28px}
.edit-panel .row .label{font-size:13px;flex:1}
.edit-panel .row .val{font-size:12px;opacity:.5;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:200}
.modal.show{display:flex}
.modal-box{background:#1a1640;border-radius:18px;padding:24px 20px;width:85vw;max-width:320px;text-align:center}
.modal-box h3{font-size:16px;margin-bottom:12px}
.modal-box input{width:100%;padding:12px;border-radius:10px;border:1.5px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#fff;font-size:14px;outline:none;margin-bottom:8px}
.modal-box input:focus{border-color:#ff6900}
.modal-box button{width:100%;padding:12px;border-radius:10px;border:none;background:#ff6900;color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:6px}
.modal-box button.cancel{background:transparent;border:1px solid rgba(255,255,255,.15);color:#aaa}

.av-grid{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:8px}
.av-item{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;border:2px solid transparent;background:rgba(255,255,255,.05)}
.av-item.sel{border-color:#ff6900;background:rgba(255,105,0,.15)}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:8px 20px;border-radius:14px;font-size:12px;font-weight:600;z-index:999;pointer-events:none;background:#ff6900;color:#fff;opacity:0;transition:.3s}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="topbar">
  <span class="title" id="wsTitle">我的专属网站</span>
  <div class="actions">
    <button id="editBtn" onclick="toggleEdit()">✏️ 编辑</button>
    <button id="loginBtn" onclick="goAuth()">🔐 登录</button>
  </div>
</div>

<div class="container">
  <div class="cover">
    <div class="av-wrap"><div class="av" id="av">🐧</div></div>
  </div>

  <div class="info">
    <div class="name" id="name">加载中...</div>
    <div class="sign" id="sign">这是我的专属网站~</div>
    <div class="email" id="email"></div>
  </div>

  <div class="share-bar" id="shareBar" style="display:none">
    <div class="share-url" id="shareUrl"></div>
    <button onclick="copyShare()">📋 复制链接分享给朋友</button>
  </div>

  <div class="edit-panel" id="editPanel" style="display:none">
    <h3>自定义你的网站</h3>
    <div class="row" onclick="editAv()"><span class="icon">🖼️</span><span class="label">头像</span><span class="val" id="avVal">🐧</span></div>
    <div class="row" onclick="editNick()"><span class="icon">✏️</span><span class="label">昵称</span><span class="val" id="nickVal">-</span></div>
    <div class="row" onclick="editSign()"><span class="icon">📝</span><span class="label">签名</span><span class="val" id="signVal">-</span></div>
    <div class="row" onclick="editPw()"><span class="icon">🔑</span><span class="label">修改密码</span></div>
  </div>
</div>

<!-- MODALS -->
<div class="modal" id="avModal"><div class="modal-box"><h3>选择头像</h3>
  <div class="av-grid" id="avGrid"></div>
  <input type="file" id="avFile" accept="image/*" style="display:none" onchange="uploadAv(this)">
  <button onclick="document.getElementById('avFile').click()">📸 从相册上传</button>
  <button onclick="saveAv()">✅ 保存</button>
  <button class="cancel" onclick="closeM('avModal')">取消</button>
</div></div>

<div class="modal" id="nickModal"><div class="modal-box"><h3>修改昵称</h3>
  <input type="text" id="nickInput" maxlength="16"><button onclick="saveNick()">保存</button><button class="cancel" onclick="closeM('nickModal')">取消</button>
</div></div>

<div class="modal" id="signModal"><div class="modal-box"><h3>修改签名</h3>
  <input type="text" id="signInput" maxlength="30"><button onclick="saveSign()">保存</button><button class="cancel" onclick="closeM('signModal')">取消</button>
</div></div>

<div class="modal" id="pwModal"><div class="modal-box"><h3>修改密码</h3>
  <input type="password" id="oldPw" placeholder="旧密码"><input type="password" id="newPw" placeholder="新密码"><input type="password" id="newPw2" placeholder="确认密码"><button onclick="savePw()">保存</button><button class="cancel" onclick="closeM('pwModal')">取消</button>
</div></div>

<div class="toast" id="toastEl"></div>

<script>
const API='https://jsonblob.com/api/jsonBlob/019fa387-ce7a-7764-81c0-fbf7b93e931b';
const AVATARS='🐧🐱🐶🐰🐼🐨🦊🐯🐸🐵🐙🦄🐲🐳🦋🐝🐞🐌🐢🐍🦖🦕🐠🦈🐅🐆🦓🐘🐪🦒🦘🐃🐏🐑🦙🐕🐩🐈🐓🦃🦜🦩🕊️🐇🦔🦇🐺🐗🐴🐒🦍🦧🐉🌟💎🔥🌈❄️🎩👑🤖👻🎃👾🚀💡🎮🎵🎸';
let user=null,isOwner=false,avSel='',avUpload='';

(function init(){
  const s=localStorage.getItem('miui_u');
  const p=new URLSearchParams(location.search);
  const userParam=p.get('user');
  if(s){try{user=JSON.parse(s);isOwner=(!userParam||userParam===user.email);loadPage(user.email)}catch(e){}}
  if(userParam&&!isOwner)loadPage(userParam);
  if(!userParam&&!s)showLoginPrompt();
})();

async function loadPage(email){
  try{
    const r=await fetch(API+'?t='+Date.now());const d=await r.json();const accounts=d.accounts||[];
    const acc=accounts.find(a=>a.email===email);
    if(!acc){if(isOwner)showLoginPrompt();else{show404(email)};return}
    renderPage(acc);
  }catch(e){if(isOwner){showPageForLocal()}else{show404(email)}}
}

function renderPage(acc){
  document.getElementById('wsTitle').textContent=(isOwner?'我的':acc.nick||email.split('@')[0]+'的')+'专属网站';
  document.getElementById('pageTitle').textContent=acc.nick||acc.email.split('@')[0]+'的主页';
  const av=acc.avatar||'🐧';
  if(acc.avatar&&!acc.avatar.startsWith('data:'))document.getElementById('av').textContent=av;
  else{document.getElementById('av').innerHTML='<img src="'+(acc.avatar||'🐧')+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%">'}
  document.getElementById('name').textContent=acc.nick||acc.email.split('@')[0];
  document.getElementById('sign').textContent=acc.sign||'这是我的专属网站~';
  document.getElementById('email').textContent=acc.email;
  const shareUrl='https://weyoudonttalk.github.io/workspace/?user='+encodeURIComponent(acc.email);
  document.getElementById('shareUrl').textContent=shareUrl;
  document.getElementById('shareBar').style.display=isOwner?'block':'none';
  document.getElementById('editBtn').style.display=isOwner?'inline':'none';
  document.getElementById('loginBtn').style.display=isOwner?'none':'inline';
  document.getElementById('avVal').textContent=acc.avatar||'🐧';
  document.getElementById('nickVal').textContent=acc.nick||'-';
  document.getElementById('signVal').textContent=acc.sign||'-';
}

function showPageForLocal(){
  document.getElementById('name').textContent=user.nick||user.email.split('@')[0];
  document.getElementById('sign').textContent=user.sign||'这是我的专属网站~';
  document.getElementById('email').textContent=user.email;
  document.getElementById('av').textContent=user.avatar||'🐧';
  const shareUrl='https://weyoudonttalk.github.io/workspace/?user='+encodeURIComponent(user.email);
  document.getElementById('shareUrl').textContent=shareUrl;
  document.getElementById('shareBar').style.display='block';
  document.getElementById('editBtn').style.display='inline';
  document.getElementById('loginBtn').style.display='none';
}

function showLoginPrompt(){
  document.getElementById('name').textContent='未登录';
  document.getElementById('sign').textContent='登录后领取你的专属网站';
  document.getElementById('email').textContent='';
  document.getElementById('av').textContent='🔐';
  document.getElementById('editBtn').style.display='none';
  document.getElementById('loginBtn').style.display='inline';
  document.getElementById('loginBtn').textContent='🔐 登录领取';
  document.getElementById('shareBar').style.display='none';
}

function show404(email){
  document.getElementById('name').textContent='用户不存在';
  document.getElementById('sign').textContent=email+' 尚未注册MIUI';
  document.getElementById('email').textContent='';
  document.getElementById('av').textContent='😕';
  document.getElementById('editBtn').style.display='none';
  document.getElementById('loginBtn').style.display='inline';
  document.getElementById('shareBar').style.display='none';
}

function toggleEdit(){
  const p=document.getElementById('editPanel');
  p.style.display=p.style.display==='none'?'block':'none';
}

function goAuth(){location.href='https://weyoudonttalk.github.io/auth/?redirect='+encodeURIComponent(location.href)}

function copyShare(){
  const url=document.getElementById('shareUrl').textContent;
  const ta=document.createElement('textarea');ta.value=url;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
  toast('✅ 链接已复制！发给朋友看你的主页')
}

// ====== EDIT ======
function editAv(){
  const grid=document.getElementById('avGrid');let html='';
  if(user.avatar)html+='<div class="av-item'+(avSel==='__CUR__'?' sel':'')+'" onclick="pickAv(\'__CUR__\',this)">'+user.avatar+'</div>';
  for(let i=0;i<AVATARS.length;i++)html+='<div class="av-item'+(AVATARS[i]===avSel?' sel':'')+'" onclick="pickAv(\''+AVATARS[i]+'\',this)">'+AVATARS[i]+'</div>';
  grid.innerHTML=html;avSel='';avUpload='';openM('avModal');
}
function pickAv(av,el){avSel=av;avUpload='';document.querySelectorAll('.av-item').forEach(e=>e.classList.remove('sel'));el.classList.add('sel')}
function uploadAv(input){const f=input.files[0];if(!f)return;const rdr=new FileReader();rdr.onload=function(e){avUpload=e.target.result;avSel='';document.querySelectorAll('.av-item').forEach(el=>el.classList.remove('sel'))};rdr.readAsDataURL(f);input.value=''}
async function saveAv(){if(!avSel&&!avUpload){toast('请选择头像');return}if(avUpload)user.avatar=avUpload;else if(avSel!=='__CUR__')user.avatar=avSel;await saveUser();closeM('avModal');refreshAll();toast('✅ 头像已更新')}

function editNick(){document.getElementById('nickInput').value=user.nick||'';openM('nickModal')}
async function saveNick(){const v=document.getElementById('nickInput').value.trim();if(!v){toast('昵称不能为空');return}user.nick=v;await saveUser();closeM('nickModal');refreshAll();toast('✅ 昵称已更新')}

function editSign(){document.getElementById('signInput').value=user.sign||'';openM('signModal')}
async function saveSign(){user.sign=document.getElementById('signInput').value.trim();await saveUser();closeM('signModal');refreshAll();toast('✅ 签名已更新')}

function editPw(){document.getElementById('oldPw').value='';document.getElementById('newPw').value='';document.getElementById('newPw2').value='';openM('pwModal')}
async function savePw(){
  const o=document.getElementById('oldPw').value,n=document.getElementById('newPw').value,n2=document.getElementById('newPw2').value;
  if(!o||!n||!n2){toast('请填写完整');return}
  if(o!==user.password){toast('旧密码错误');return}
  if(n.length<6){toast('新密码至少6位');return}
  if(n!==n2){toast('两次密码不一致');return}
  user.password=n;await saveUser();closeM('pwModal');toast('✅ 密码已修改')
}

async function saveUser(){
  if(!user)return;
  try{const r=await fetch(API+'?t='+Date.now());const d=await r.json();const accounts=d.accounts||[];const idx=accounts.findIndex(a=>a.email===user.email);if(idx>=0)accounts[idx]=user;await fetch(API,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({accounts,room:'miui_auth'})});localStorage.setItem('miui_u',JSON.stringify(user))}catch(e){}
}

function refreshAll(){
  document.getElementById('name').textContent=user.nick||user.email.split('@')[0];
  document.getElementById('sign').textContent=user.sign||'这是我的专属网站~';
  document.getElementById('av').textContent=user.avatar||'🐧';
  document.getElementById('avVal').textContent=user.avatar||'🐧';
  document.getElementById('nickVal').textContent=user.nick||'-';
  document.getElementById('signVal').textContent=user.sign||'-';
}

function openM(id){document.getElementById(id).classList.add('show')}
function closeM(id){document.getElementById(id).classList.remove('show')}

var tt;function toast(m){const t=document.getElementById('toastEl');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2000)}
</script>
</body>
</html>
