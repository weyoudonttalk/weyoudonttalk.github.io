<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>📸 表情包工坊</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:linear-gradient(135deg,#ffecd2,#fcb69f);min-height:100vh;padding:20px;color:#333}
h1{text-align:center;font-size:24px;margin-bottom:20px}
.editor{max-width:500px;margin:0 auto;background:#fff;border-radius:20px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.1)}
.editor textarea,.editor input{width:100%;padding:14px;border-radius:12px;border:2px solid #eee;font-size:15px;outline:none;resize:none;margin-bottom:10px}
.editor textarea{height:80px}
.editor label{font-size:12px;font-weight:700;color:#888;display:block;margin-bottom:4px}
.editor textarea:focus,.editor input:focus{border-color:#fcb69f}
.colors{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.color{width:32px;height:32px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.color.selected{border-color:#333}
.preview{width:100%;min-height:200px;background:#f9f9f9;border-radius:14px;display:flex;align-items:center;justify-content:center;margin:12px 0;padding:20px;text-align:center;font-weight:900;word-break:break-word;position:relative;overflow:hidden}
.preview.drag-over{border:3px dashed #fcb69f}
.btns{display:flex;gap:8px}
.btns button{flex:1;padding:12px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;color:#fff}
.btn-save{background:#fcb69f}.btn-clear{background:#ccc}
.meme-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.meme-tpl{padding:8px 14px;border-radius:20px;border:2px solid #eee;background:#fff;font-size:13px;cursor:pointer;font-weight:600}
.meme-tpl:active{background:#fcb69f;color:#fff;border-color:#fcb69f}
</style></head>
<body>
<h1>📸 表情包工坊</h1>
<div class="editor">
<label>🎨 快速模板</label>
<div class="meme-list">
<div class="meme-tpl" onclick="setMeme('我太难了','生活不易')">我太难了</div>
<div class="meme-tpl" onclick="setMeme('真香','人类的本质')">真香</div>
<div class="meme-tpl" onclick="setMeme('你不对劲','🤨')">你不对劲</div>
<div class="meme-tpl" onclick="setMeme('不愧是我','😎')">不愧是我</div>
<div class="meme-tpl" onclick="setMeme('就这？','🙄')">就这？</div>
<div class="meme-tpl" onclick="setMeme('格局打开','🧠')">格局打开</div>
</div>
<label>📝 顶部文字</label><input type="text" id="topText" placeholder="上面写什么..." maxlength="30">
<label>📝 底部文字</label><input type="text" id="bottomText" placeholder="下面写什么..." maxlength="30">
<label>🎨 背景颜色</label>
<div class="colors">
<div class="color selected" style="background:#fff" onclick="pickBg('#fff',this)"></div>
<div class="color" style="background:#ff6b6b" onclick="pickBg('#ff6b6b',this)"></div>
<div class="color" style="background:#ffd93d" onclick="pickBg('#ffd93d',this)"></div>
<div class="color" style="background:#6bcb77" onclick="pickBg('#6bcb77',this)"></div>
<div class="color" style="background:#4d96ff" onclick="pickBg('#4d96ff',this)"></div>
<div class="color" style="background:#333" onclick="pickBg('#333',this)"></div>
</div>
<div class="preview" id="preview" style="background:#fff;font-size:28px;line-height:1.4;color:#333"><span>输入文字</span><br><span>制作表情包</span></div>
<div class="btns"><button class="btn-save" onclick="save()">💾 保存图片</button><button class="btn-clear" onclick="clearMeme()">🗑️ 清空</button></div>
</div>
<script>
let bgColor='#fff';
function pickBg(c,el){bgColor=c;document.querySelectorAll('.color').forEach(e=>e.classList.remove('selected'));el.classList.add('selected');update()}
function update(){
  const p=document.getElementById('preview');
  p.style.background=bgColor;
  p.style.color=bgColor==='#333'?'#fff':'#333';
  const t=document.getElementById('topText').value||'上面写什么';
  const b=document.getElementById('bottomText').value||'下面写什么';
  p.innerHTML='<span>'+t+'</span><br><span>'+b+'</span>';
}
document.getElementById('topText').addEventListener('input',update);
document.getElementById('bottomText').addEventListener('input',update);
function setMeme(t,b){document.getElementById('topText').value=t;document.getElementById('bottomText').value=b;update()}
function clearMeme(){document.getElementById('topText').value='';document.getElementById('bottomText').value='';update()}
function save(){
  const p=document.getElementById('preview');
  html2canvas(p).then(c=>{const a=document.createElement('a');a.download='meme.png';a.href=c.toDataURL();a.click()}).catch(()=>alert('请用手机截图保存~'));
}
</script>
<script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</body></html>
