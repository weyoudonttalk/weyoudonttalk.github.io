<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MIUI STUDIO OS · 网页模拟系统</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif}
  body{background:#000;color:#fff;user-select:none}
  /* ===== 开机动画 ===== */
  #boot{position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s}
  #boot.gone{opacity:0;pointer-events:none}
  #boot canvas{position:absolute;inset:0}
  .brand{position:relative;z-index:2;text-align:center}
  .brand .logo{font-size:13px;letter-spacing:8px;color:#bbb;opacity:.8}
  .brand .name{font-size:40px;font-weight:800;margin-top:6px;background:linear-gradient(120deg,#ff6900,#ff2d55,#7b5cff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px}
  .brand .sub{font-size:11px;color:#777;margin-top:8px;letter-spacing:3px}
  .bootbar{position:relative;z-index:2;margin-top:34px;width:180px;height:3px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
  .bootbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff6900,#ff2d55);animation:bb 3.4s ease forwards}
  @keyframes bb{to{width:100%}}
  .boottip{position:relative;z-index:2;margin-top:14px;font-size:11px;color:#666;letter-spacing:2px}
  /* ===== 锁屏 ===== */
  #lock{position:fixed;inset:0;z-index:9000;background:radial-gradient(circle at 50% 30%,#1a1f3a,#05060d);display:none;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
  #lock.show{display:flex}
  #lock .lt{font-size:64px;font-weight:200;letter-spacing:2px;text-shadow:0 0 30px rgba(120,150,255,.4)}
  #lock .ld{font-size:14px;color:#8a93b8;margin-top:4px}
  #lock .hint{position:absolute;bottom:60px;font-size:12px;color:#5a648c;animation:pb 2s ease-in-out infinite}
  @keyframes pb{0%,100%{opacity:.4;transform:translateY(0)}50%{opacity:1;transform:translateY(-6px)}}
  /* ===== 桌面 ===== */
  #desk{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;background-size:cover;background-position:center}
  #desk.show{display:flex}
  .statusbar{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:13px;font-weight:600;backdrop-filter:blur(10px);background:rgba(0,0,0,.25);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
  .statusbar .right{display:flex;gap:10px;align-items:center}
  .grid{flex:1;display:grid;grid-template-columns:repeat(auto-fill,72px);gap:18px 14px;align-content:start;padding:22px;overflow-y:auto}
  .app{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;width:72px}
  .app .ic{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 6px 16px rgba(0,0,0,.35);transition:transform .12s}
  .app:active .ic{transform:scale(.9)}
  .app .nm{font-size:11px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);text-align:center;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dock{height:84px;display:flex;align-items:center;justify-content:center;gap:18px;background:rgba(255,255,255,.08);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.12)}
  .dock .app .ic{width:50px;height:50px}
  /* ===== 窗口 ===== */
  .win{position:fixed;z-index:500;width:min(92vw,420px);height:min(80vh,560px);background:rgba(20,22,34,.96);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;overflow:hidden;backdrop-filter:blur(8px)}
  .win .bar{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:rgba(255,255,255,.06);cursor:move;font-size:14px;font-weight:600}
  .win .bar .x{width:26px;height:26px;border-radius:50%;background:#ff453a;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;color:#fff}
  .win .body{flex:1;overflow-y:auto;padding:14px}
  /* 应用内通用 */
  .btn{display:inline-block;padding:9px 16px;border-radius:20px;background:linear-gradient(135deg,#ff6900,#ff2d55);color:#fff;font-size:13px;font-weight:600;border:0;cursor:pointer}
  .btn.ghost{background:rgba(255,255,255,.1)}
  .card{background:rgba(255,255,255,.05);border-radius:12px;padding:12px;margin-bottom:10px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .prog{height:6px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden;margin-top:8px}
  .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff6900,#ff2d55);transition:width .2s}
  .tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .tab{padding:6px 12px;border-radius:16px;background:rgba(255,255,255,.08);font-size:12px;cursor:pointer}
  .tab.on{background:linear-gradient(135deg,#ff6900,#ff2d55);color:#fff}
  iframe.f{width:100%;height:100%;border:0;background:#000}
  .storeapp{display:flex;gap:12px;align-items:center;padding:12px;background:rgba(255,255,255,.05);border-radius:12px;margin-bottom:10px}
  .storeapp .si{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
  .storeapp .info{flex:1}
  .storeapp .info b{font-size:14px}
  .storeapp .info p{font-size:11px;color:#9aa3c0;margin-top:2px}
  .storeapp .sz{font-size:11px;color:#777;margin-top:2px}
  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:99999;background:rgba(0,0,0,.85);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:80vw;text-align:center}
  .toast.show{opacity:1}
  .term{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#7CFFB2;background:#05070d;height:100%;padding:10px;overflow-y:auto;white-space:pre-wrap}
  .term input{background:transparent;border:0;color:#7CFFB2;font-family:inherit;font-size:12px;outline:none;width:70%}
  .vidgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .vidgrid .v{aspect-ratio:16/10;background:#000;border-radius:10px;overflow:hidden;position:relative;cursor:pointer}
  .vidgrid .v img{width:100%;height:100%;object-fit:cover;opacity:.8}
  .vidgrid .v span{position:absolute;left:6px;bottom:6px;font-size:11px;background:rgba(0,0,0,.6);padding:2px 6px;border-radius:6px}
  /* 启动器 */
  #launcher{position:fixed;inset:0;z-index:800;background:rgba(0,0,0,.92);display:none;flex-direction:column;padding:20px}
  #launcher.show{display:flex}
  #launcher .search{width:100%;padding:12px 16px;border-radius:24px;background:rgba(255,255,255,.1);border:0;color:#fff;font-size:14px;margin-bottom:16px;outline:none}
  #launcher .lgrid{display:grid;grid-template-columns:repeat(auto-fill,72px);gap:18px 14px;overflow-y:auto}
</style>
</head>
<body>

<!-- 开机动画 -->
<div id="boot">
  <canvas id="bcv"></canvas>
  <div class="brand">
    <div class="logo">MIUI STUDIO</div>
    <div class="name">HYPER OS</div>
    <div class="sub">WEB SIMULATOR · V1.0</div>
  </div>
  <div class="bootbar"><i></i></div>
  <div class="boottip" id="boottip">正在启动内核…</div>
</div>

<!-- 锁屏 -->
<div id="lock">
  <div class="lt" id="lockTime">09:41</div>
  <div class="ld" id="lockDate">星期一 11月11日</div>
  <div class="hint">点击任意处解锁 ▲</div>
</div>

<!-- 桌面 -->
<div id="desk">
  <div class="statusbar">
    <div id="sbTime">09:41</div>
    <div class="right"><span id="sbNet">5G</span><span id="sbBat">🔋 88%</span></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="dock" id="dock"></div>
</div>

<!-- 启动器(全部应用) -->
<div id="launcher">
  <input class="search" id="lsearch" placeholder="搜索应用…">
  <div class="lgrid" id="lgrid"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ 工具 ============ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
function fmt(n){if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(2)+' MB';}

/* ============ 开机动画 canvas 粒子 ============ */
(function(){
  const cv=$('#bcv'),ctx=cv.getContext('2d');
  function rs(){cv.width=innerWidth;cv.height=innerHeight;}
  rs();addEventListener('resize',rs);
  let ps=[];const N=90;
  for(let i=0;i<N;i++)ps.push({x:Math.random()*cv.width,y:Math.random()*cv.height,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()*2+1});
  const tips=['正在启动内核…','加载驱动…','初始化桌面…','校准触控…','准备就绪'];
  let ti=0;const tt=setInterval(()=>{ti=(ti+1)%tips.length;$('#boottip').textContent=tips[ti];},700);
  let raf;
  function loop(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.fillStyle='rgba(255,105,0,.9)';
    for(const p of ps){
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0||p.x>cv.width)p.vx*=-1;
      if(p.y<0||p.y>cv.height)p.vy*=-1;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
    }
    // 中心连线
    ctx.strokeStyle='rgba(255,45,85,.15)';
    for(let i=0;i<ps.length;i+=7){ctx.beginPath();ctx.moveTo(cv.width/2,cv.height/2);ctx.lineTo(ps[i].x,ps[i].y);ctx.stroke();}
    raf=requestAnimationFrame(loop);
  }
  loop();
  // 4秒后进入锁屏
  setTimeout(()=>{
    cancelAnimationFrame(raf);clearInterval(tt);
    $('#boot').classList.add('gone');
    setTimeout(()=>{$('#boot').style.display='none';$('#lock').classList.add('show');},600);
  },4200);
})();

/* ============ 锁屏时间 ============ */
function updLock(){
  const d=new Date();const hh=String(d.getHours()).padStart(2,'0'),mm=String(d.getMinutes()).padStart(2,'0');
  $('#lockTime').textContent=hh+':'+mm;
  const wd=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];
  $('#lockDate').textContent=wd+' '+(d.getMonth()+1)+'月'+d.getDate()+'日';
}
updLock();setInterval(updLock,10000);
$('#lock').addEventListener('click',()=>{
  $('#lock').classList.remove('show');
  $('#desk').classList.add('show');
  renderDesktop();
});

/* ============ 应用定义 ============ */
const STORE_APPS=[
  {id:'bili',name:'哔哩哔哩',ic:'📺',c:'#fb7299',size:8.2*1048576,url:'https://weyoudonttalk.github.io/miui-studio/assets/bgm-3strikes.mp3',desc:'在线视频·弹幕社区'},
  {id:'douyin',name:'抖音',ic:'🎵',c:'#000',size:12.4*1048576,url:'https://weyoudonttalk.github.io/miui-studio/assets/tech-glitch.png',desc:'短视频·记录生活'},
  {id:'kuaishou',name:'快手轻量版',ic:'🟠',c:'#ff6600',size:5.1*1048576,url:'https://weyoudonttalk.github.io/miui-studio/assets/tech-soldier.png',desc:'极速版·省流量'},
  {id:'music',name:'音乐播放器',ic:'🎧',c:'#7b5cff',size:3.0*1048576,url:'https://weyoudonttalk.github.io/miui-studio/assets/bgm-3strikes.mp3',desc:'本地音乐·沉浸听歌'},
  {id:'delta',name:'三角洲行动',ic:'🔫',c:'#2e7d32',size:46.0*1048576,url:'https://weyoudonttalk.github.io/miui-studio/assets/tech-soldier.png',desc:'战术射击·端游同款'},
  {id:'browser',name:'极速浏览器',ic:'🌐',c:'#1976d2',size:4.6*1048576,url:'https://weyoudonttalk.github.io/miui-studio/assets/tech-glitch.png',desc:'轻量上网'},
];

const APPS=[
  {id:'store',name:'应用商店',ic:'🛒',c:'#ff6900',dock:true,open:openStore},
  {id:'video',name:'视频',ic:'🎬',c:'#fb7299',dock:true,open:openVideo},
  {id:'files',name:'文件管理',ic:'📁',c:'#ffc107',open:openFiles},
  {id:'music',name:'音乐',ic:'🎧',c:'#7b5cff',open:openMusic},
  {id:'browser',name:'浏览器',ic:'🌐',c:'#1976d2',dock:true,open:openBrowser},
  {id:'settings',name:'设置',ic:'⚙️',c:'#9e9e9e',open:openSettings},
  {id:'terminal',name:'终端',ic:'💻',c:'#00c853',open:openTerminal},
  {id:'about',name:'关于本机',ic:'ℹ️',c:'#607d8b',open:openAbout},
];

/* ============ 存储(IndexedDB 模拟) ============ */
const DBP={db:null,open(){return new Promise((res,rej)=>{const r=indexedDB.open('miui_os',1);r.onupgradeneeded=e=>{e.target.result.createObjectStore('files',{keyPath:'id'});};r.onsuccess=e=>{this.db=e.target.result;res();};r.onerror=e=>rej(e);});},
  async used(){return await new Promise((res)=>{const t=this.db.transaction('files','readonly').objectStore('files').getAll();t.onsuccess=()=>{let s=0;t.result.forEach(f=>s+=f.size||0);res(s);};t.onerror=()=>res(0);});},
  async add(f){return await new Promise((res,rej)=>{const t=this.db.transaction('files','readwrite').objectStore('files').put(f);t.onsuccess=()=>res();t.onerror=()=>rej();});},
  async all(){return await new Promise((res)=>{const t=this.db.transaction('files','readonly').objectStore('files').getAll();t.onsuccess=()=>res(t.result||[]);t.onerror=()=>res([]);});},
  async del(id){return await new Promise((res)=>{const t=this.db.transaction('files','readwrite').objectStore('files').delete(id);t.onsuccess=()=>res();t.onerror=()=>res();});}
};
const TOTAL=64*1048576; // 模拟 64MB 存储
(async()=>{try{await DBP.open();}catch(e){console.warn('IDB fail',e);}})();

/* ============ 桌面渲染 ============ */
function renderDesktop(){
  const grid=$('#grid'),dock=$('#dock');
  grid.innerHTML='';dock.innerHTML='';
  APPS.forEach(a=>{
    const el=appEl(a);
    if(a.dock)dock.appendChild(el);else grid.appendChild(el);
  });
  // 已安装的商店App也出现在桌面
  DBP.all().then(fs=>{
    fs.filter(f=>f.fromStore).forEach(f=>{
      const meta=STORE_APPS.find(s=>s.id===f.id);if(!meta)return;
      const a={id:'inst_'+f.id,name:meta.name,ic:meta.ic,c:meta.c,open:()=>launchInstalled(meta)};
      grid.appendChild(appEl(a));
    });
  });
  updateStatus();
}
function appEl(a){
  const d=document.createElement('div');d.className='app';
  d.innerHTML=`<div class="ic" style="background:${a.c}">${a.ic}</div><div class="nm">${a.name}</div>`;
  d.onclick=()=>a.open&&a.open();
  return d;
}
function updateStatus(){
  const d=new Date();$('#sbTime').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

/* ============ 窗口管理 ============ */
let z=500;
function openWin(title,icon,bodyHTML,opts={}){
  const w=document.createElement('div');w.className='win';
  w.style.left=((innerWidth-w.offsetWidth)/2+(Math.random()*40-20))+'px';
  w.style.top=((innerHeight-w.offsetHeight)/2+(Math.random()*40-20))+'px';
  w.style.zIndex=++z;
  w.innerHTML=`<div class="bar"><span>${icon} ${title}</span><div class="x">✕</div></div><div class="body"></div>`;
  w.querySelector('.body').innerHTML=bodyHTML;
  w.querySelector('.x').onclick=()=>w.remove();
  // 拖拽
  const bar=w.querySelector('.bar');let dx,dy,drag=false;
  bar.addEventListener('mousedown',e=>{drag=true;dx=e.clientX-w.offsetLeft;dy=e.clientY-w.offsetTop;w.style.zIndex=++z;});
  bar.addEventListener('touchstart',e=>{const t=e.touches[0];drag=true;dx=t.clientX-w.offsetLeft;dy=t.clientY-w.offsetTop;},{passive:true});
  addEventListener('mousemove',e=>{if(drag){w.style.left=(e.clientX-dx)+'px';w.style.top=(e.clientY-dy)+'px';}});
  addEventListener('touchmove',e=>{if(drag){const t=e.touches[0];w.style.left=(t.clientX-dx)+'px';w.style.top=(t.clientY-dy)+'px';}},{passive:true});
  addEventListener('mouseup',()=>drag=false);addEventListener('touchend',()=>drag=false);
  document.body.appendChild(w);
  return w;
}

/* ============ 应用商店 ============ */
function openStore(){
  const body=STORE_APPS.map(a=>`<div class="storeapp">
    <div class="si" style="background:${a.c}">${a.ic}</div>
    <div class="info"><b>${a.name}</b><p>${a.desc}</p><div class="sz">${fmt(a.size)}</div></div>
    <button class="btn" data-id="${a.id}">安装</button>
  </div>`).join('');
  const w=openWin('应用商店','🛒',`<div id="storeList">${body}</div><p style="color:#888;font-size:11px;margin-top:8px">提示：安装会从本机/官网拉取文件包，真实占用浏览器存储空间（IndexedDB）。</p>`);
  w.querySelectorAll('[data-id]').forEach(b=>{
    b.onclick=async()=>{
      const a=STORE_APPS.find(x=>x.id===b.dataset.id);
      b.textContent='安装中…';b.disabled=true;
      const prog=document.createElement('div');prog.className='prog';prog.innerHTML='<i></i>';b.parentElement.appendChild(prog);
      const bar=prog.querySelector('i');
      for(let p=0;p<=100;p+=8){bar.style.width=p+'%';await new Promise(r=>setTimeout(r,40));}
      // 真实下载到设备
      try{
        const resp=await fetch(a.url);const blob=await resp.blob();
        const url=URL.createObjectURL(blob);
        const aEl=document.createElement('a');aEl.href=url;aEl.download=a.name+'.bin';document.body.appendChild(aEl);aEl.click();aEl.remove();
      }catch(e){/* 跨域可能被拦, 不影响模拟存储 */}
      await DBP.add({id:a.id,name:a.name,size:a.size,fromStore:true,installedAt:Date.now()});
      b.textContent='已安装';b.classList.add('ghost');
      toast('已安装：'+a.name+'（占 '+fmt(a.size)+'）');
      renderDesktop();
    };
  });
}

/* ============ 视频(在线B站/抖音/快手 + 本地) ============ */
function openVideo(){
  const w=openWin('视频','🎬',`
    <div class="tabs">
      <div class="tab on" data-t="bili">哔哩哔哩</div>
      <div class="tab" data-t="douyin">抖音</div>
      <div class="tab" data-t="kuaishou">快手轻量版</div>
      <div class="tab" data-t="local">本地播放</div>
    </div>
    <div id="vidBox" style="height:calc(100% - 50px)"></div>
  `);
  const box=$('#vidBox',w);
  function load(t){
    if(t==='bili'){
      box.innerHTML=`<div style="padding:10px 0">输入 BV 号观看：<input id="bvid" placeholder="如 BV1xx411c7mD" style="padding:8px;border-radius:8px;border:0;background:rgba(255,255,255,.1);color:#fff;width:60%;margin-left:6px"><button class="btn" id="bgo">播放</button></div><div id="bplayer" style="height:calc(100% - 50px)"></div>`;
      $('#bgo',w).onclick=()=>{const v=$('#bvid',w).value.trim();if(!v)return;const pid=v.replace(/^BV/,'');
        $('#bplayer',w).innerHTML=`<iframe class="f" src="https://player.bilibili.com/player.html?bvid=${v}&autoplay=0&high_quality=1" allowfullscreen></iframe>`;};
    }else if(t==='douyin'){
      box.innerHTML=`<iframe class="f" src="https://www.douyin.com/" sandbox="allow-scripts allow-same-origin allow-forms"></iframe><p style="color:#aaa;font-size:11px;padding:6px">如无法内嵌，可 <a href="https://www.douyin.com/" target="_blank" style="color:#ff2d55">点此在新标签打开抖音</a></p>`;
    }else if(t==='kuaishou'){
      box.innerHTML=`<iframe class="f" src="https://www.kuaishou.com/light" sandbox="allow-scripts allow-same-origin allow-forms"></iframe><p style="color:#aaa;font-size:11px;padding:6px">快手轻量版 · 如无法内嵌可 <a href="https://www.kuaishou.com/light" target="_blank" style="color:#ff6900">新标签打开</a></p>`;
    }else{
      box.innerHTML=`<video class="f" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" controls autoplay style="object-fit:contain"></video>`;
    }
  }
  load('bili');
  w.querySelectorAll('.tab').forEach(tb=>tb.onclick=()=>{w.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));tb.classList.add('on');load(tb.dataset.t);});
}

/* ============ 文件管理 ============ */
async function openFiles(){
  const used=await DBP.used();
  const files=await DBP.all();
  const list=files.map(f=>`<div class="row card"><span>📄 ${f.name}</span><span style="color:#9aa3c0">${fmt(f.size)} <button class="btn ghost" data-del="${f.id}" style="padding:4px 8px;font-size:11px">删</button></span></div>`).join('')||'<p style="color:#888">暂无文件</p>';
  const w=openWin('文件管理','📁',`
    <div class="card"><div class="row"><b>存储</b><span style="color:#9aa3c0">${fmt(used)} / ${fmt(TOTAL)}</span></div>
    <div class="prog"><i style="width:${(used/TOTAL*100).toFixed(1)}%"></i></div></div>
    ${list}
  `);
  w.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{await DBP.del(b.dataset.del);toast('已删除');openFiles();renderDesktop();});
}

/* ============ 终端 ============ */
function openTerminal(){
  const w=openWin('终端','💻',`<div class="term" id="term"><div>MIUI-OS web shell. 输入 help 查看命令。</div><div id="out"></div><div><span>guest@hyperos:~$</span> <input id="cin" autofocus></div></div>`);
  const out=$('#out',w),cin=$('#cin',w);
  const cmds={help:'可用: help, ls, neofetch, clear, date, echo <text>',ls:'Desktop  Downloads  Music  Videos  System',neofetch:'MIUI STUDIO OS V1.0 (web)\nKernel: web-kernel 1.0\nShell: wsh\nUptime: '+Math.floor(performance.now()/1000)+'s',date:new Date().toString(),echo:(a)=>a};
  cin.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const v=cin.value;cin.value='';
    out.innerHTML+=`<div>guest@hyperos:~$ ${v}</div>`;
    const [c,...args]=v.split(' ');
    if(c==='clear'){out.innerHTML='';return;}
    if(cmds[c]){out.innerHTML+='<div>'+(typeof cmds[c]==='function'?cmds[c](args.join(' ')):cmds[c])+'</div>';}
    else if(c)out.innerHTML+='<div style="color:#ff6b6b">command not found: '+c+'</div>';
    out.parentElement.scrollTop=out.parentElement.scrollHeight;
  });
}

/* ============ 启动器(全应用) ============ */
function openLauncher(){const l=$('#launcher');l.classList.add('show');renderLauncher('');$('#lsearch').oninput=e=>renderLauncher(e.target.value);}
function renderLauncher(q){
  const all=[...APPS];
  const grid=$('#lgrid');grid.innerHTML='';
  all.filter(a=>!q||a.name.includes(q)).forEach(a=>{const el=appEl(a);el.onclick=()=>{l.classList.remove('show');a.open&&a.open();};grid.appendChild(el);});
}
// 桌面空白处双击打开启动器
$('#desk').addEventListener('dblclick',openLauncher);
// 状态栏点击也能开启动器
$('.statusbar').addEventListener('click',openLauncher);

/* ============ 已安装商店App启动 ============ */
function launchInstalled(meta){
  if(meta.id==='bili')return openVideo();
  if(meta.id==='douyin'){const w=openWin(meta.name,meta.ic,`<iframe class="f" src="https://www.douyin.com/"></iframe>`);return;}
  if(meta.id==='kuaishou'){const w=openWin(meta.name,meta.ic,`<iframe class="f" src="https://www.kuaishou.com/light"></iframe>`);return;}
  if(meta.id==='music')return openMusic();
  if(meta.id==='browser')return openBrowser();
  if(meta.id==='delta'){openWin('三角洲行动','🔫',`<div style="text-align:center;padding:30px"><div style="font-size:60px">🔫</div><h3>三角洲行动</h3><p style="color:#9aa3c0;margin:10px 0">演示版：真机请到应用商店/模拟器下载完整游戏。</p><button class="btn" onclick="window.open('https://www.bluestacks.com/','_blank')">获取安卓模拟器</button></div>`);return;}
  toast('打开：'+meta.name);
}
