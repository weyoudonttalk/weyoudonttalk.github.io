<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MIUI STUDIO OS · 我的系统中心</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif}
  body{background:#000;color:#fff;user-select:none}
    /* 苹果开机动画（原模一样） */
  #boot{position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .7s}
  #boot.gone{opacity:0;pointer-events:none}
  .apple-boot{width:11vmin;min-width:54px;height:auto;opacity:0;animation:appleShow .35s ease forwards}
  .apple-boot svg{width:100%;height:100%;fill:#9a9a9a}
  @keyframes appleShow{from{opacity:0}to{opacity:1}}
  .abbar{position:relative;z-index:2;margin-top:6vmin;width:28vmin;min-width:160px;height:3px;background:rgba(255,255,255,.2);border-radius:2px;overflow:hidden}
  .abbar i{display:block;height:100%;width:0;background:#ffffff;animation:throb 4s linear forwards}
  @keyframes throb{0%{width:0}14%{width:36%}28%{width:40%}44%{width:63%}58%{width:66%}74%{width:85%}87%{width:87%}100%{width:100%}}

  /* 身份验证屏 */
  #verify{position:fixed;inset:0;z-index:9450;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#10131f,#000 75%);text-align:center}
  #verify.show{display:flex;animation:fade .6s ease}
  #verify .vtitle{font-size:20px;color:#fff;font-weight:300;margin-bottom:6px}
  #verify .vsub{font-size:13px;color:#8a93b8;margin-bottom:40px}
  #vfRing{width:96px;height:96px;border-radius:50%;border:2px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:42px;color:#fff;position:relative}
  #vfRing.scan{border-color:#0a84ff;box-shadow:0 0 26px rgba(10,132,255,.6)}
  #vfRing.scan::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid #0a84ff;border-top-color:transparent;animation:vspin 1s linear infinite}
  @keyframes vspin{to{transform:rotate(360deg)}}
  #verifyBtn{margin-top:42px;padding:11px 30px;border-radius:24px;background:linear-gradient(135deg,#0a84ff,#5b9bd5);color:#fff;font-size:15px;border:0;cursor:pointer}
  #verifyBtn:disabled{opacity:.6}
  /* 苹果「你好」（纯版） */
  #hello{position:fixed;inset:0;z-index:9500;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#fbfbfd}
  #hello.show{display:flex;animation:fade .8s ease}
  #hello .apple{width:64px;height:64px;margin-bottom:36px}
  #hello .apple svg{width:100%;height:100%;fill:#1d1d1f}
  #hello .hi{font-size:76px;font-weight:300;letter-spacing:2px;color:#1d1d1f}
  #hello .wel{margin-top:14px;font-size:18px;color:#6e6e73;font-weight:400}
  #hello .go{margin-top:54px;padding:11px 32px;border-radius:24px;background:#007aff;color:#fff;font-size:15px;cursor:pointer;transition:.15s}
  #hello .go:active{transform:scale(.95)}

  /* 苹果登录（纯版） */
  #login{position:fixed;inset:0;z-index:9400;display:none;flex-direction:column;background:linear-gradient(160deg,#e9edf5,#c9d4e6)}
  #login.show{display:flex;animation:fade .7s ease}
  #login .topbar{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:14px;color:#1d1d1f}
  #login .topbar .right{display:flex;gap:14px;align-items:center;color:#1d1d1f}
  #login .panel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
  #login .logo{width:56px;height:56px;opacity:.95}
  #login .logo svg{width:100%;height:100%;fill:#1d1d1f}
  #login .ava{width:78px;height:78px;border-radius:50%;background:linear-gradient(135deg,#7aa6ff,#3b6bff);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:600;color:#fff;box-shadow:0 8px 26px rgba(0,0,0,.2)}
  #login .uname{font-size:19px;font-weight:500;color:#1d1d1f}
  #login .pw{width:264px;max-width:80vw;padding:11px 15px;border-radius:10px;background:rgba(255,255,255,.7);border:1px solid rgba(0,0,0,.12);color:#1d1d1f;font-size:14px;outline:none;text-align:center}
  #login .pw::placeholder{color:#86868b}
  #login .loginbtn{width:44px;height:44px;border-radius:50%;background:#007aff;border:0;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
  #login .loginbtn:active{transform:scale(.92)}
  #login .hint{font-size:12px;color:#86868b}
  #login .spin{position:absolute;inset:0;background:rgba(255,255,255,.5);display:none;align-items:center;justify-content:center;z-index:4}
  #login .spin.show{display:flex}
  #login .spin i{width:34px;height:34px;border:3px solid rgba(0,0,0,.15);border-top-color:#007aff;border-radius:50%;animation:rot .8s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}

  /* ===== 软件中心 ===== */
  #hub{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;background:#05060d}
  #hub.show{display:flex}
  .hubbar{flex-shrink:0;background:rgba(10,12,22,.95);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.08);padding:8px 12px}
  .htop{display:flex;align-items:center;justify-content:space-between}
  .ht{font-size:13px;font-weight:700;letter-spacing:1px;background:linear-gradient(120deg,#ff6900,#ff2d55);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .ht small{color:#7a83a8;-webkit-text-fill-color:#7a83a8;font-weight:400;font-size:10px;margin-left:6px}
  .back{font-size:12px;color:#7b5cff;cursor:pointer;display:none}
  .logout{font-size:12px;color:#ff6b6b;cursor:pointer}
  .zones{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
  .zones button{flex-shrink:0;padding:7px 14px;border-radius:18px;background:rgba(255,255,255,.08);border:0;color:#cfd6f0;font-size:12px;cursor:pointer;white-space:nowrap}
  .zones button.on{background:linear-gradient(135deg,#ff6900,#ff2d55);color:#fff;font-weight:700}
  #zoneContent{flex:1;overflow-y:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-content:start}
  .card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
  .card .ch{display:flex;align-items:center;gap:10px}
  .card .ci{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:22px;background:rgba(255,255,255,.08);flex-shrink:0}
  .card .cn{font-size:14px;font-weight:600}
  .card .cd{font-size:11px;color:#9aa3c0;line-height:1.5}
  .card .acts{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
  .mini{padding:7px 13px;border-radius:18px;font-size:12px;font-weight:600;border:0;cursor:pointer;color:#fff}
  .mini.open{background:linear-gradient(135deg,#007aff,#5b9bd5)}
  .mini.dl{background:linear-gradient(135deg,#2e7d32,#43a047)}
  .mini.ghost{background:rgba(255,255,255,.1)}
  #osframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0a0c16;display:none;z-index:3}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:99999;background:rgba(0,0,0,.88);color:#fff;padding:10px 18px;border-radius:20px;font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:84vw;text-align:center}
  .toast.show{opacity:1}
</style>
</head>

  <div class="apple"><svg viewBox="0 0 384 512"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg></div>

    <div class="logo"><svg viewBox="0 0 384 512"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg></div>

  <div style="width:min(90vw,380px);background:#1c1f2e;border-radius:16px;padding:20px;color:#fff">
    <h3 style="margin-bottom:14px">开机动画管理</h3>
    <div id="adminLogin">
      <p style="font-size:13px;color:#9aa3c0;margin-bottom:10px">请输入管理员密码</p>

<script>
const _T1="ghp_nFDtujscuPZvF6tZDiQehrrjY",_T2="8EibM3aZD5f";const EMBED_TOK=_T1+_T2;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400);}

/* ===== 开机动画（读全局配置） ===== */
function scheduleBootHide(delay){
  setTimeout(()=>{
    const b=document.getElementById('boot');b.classList.add('gone');
    setTimeout(()=>{b.style.display='none';showVerify();},700);
  },delay);
}
function afterBoot(){
  const logged=localStorage.getItem('miui_logged')==='1';
  if(logged){document.getElementById('hub').classList.add('show');showZone('all');}
  else{document.getElementById('hello').classList.add('show');}
}
function showVerify(){document.getElementById('verify').classList.add('show');}
let _vAudio=null;
function vAudio(){if(!_vAudio){_vAudio=new Audio('https://raw.githubusercontent.com/weyoudonttalk/weyoudonttalk.github.io/main/miui-studio/assets/babel-verify.wav?t='+Date.now());_vAudio.preload='auto';_vAudio.volume=1;}return _vAudio;}
function unlockAudio(){try{const a=vAudio();const p=a.play();if(p&&p.then){p.then(()=>{a.pause();a.currentTime=0;}).catch(()=>{});}}catch(e){}}
function fallbackTTS(){try{if(!('speechSynthesis' in window))return;const u=new SpeechSynthesisUtterance('身份验证已通过，巴别塔期待与你同行');u.lang='zh-CN';u.rate=1;u.pitch=1;const vs=speechSynthesis.getVoices();const zh=vs.find(v=>/zh|Chinese|中文/i.test(v.lang+' '+v.name));if(zh)u.voice=zh;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
function speakVerify(){try{const a=vAudio();a.currentTime=0;const p=a.play();if(p&&p.catch){p.catch(()=>{fallbackTTS();});}}catch(e){fallbackTTS();}}
function runVerify(){
  const btn=document.getElementById('verifyBtn');
  if(btn.disabled)return; btn.disabled=true;
  const ring=document.getElementById('vfRing');ring.classList.add('scan');
  setTimeout(()=>{
    ring.classList.remove('scan');
    speakVerify();
    setTimeout(()=>{document.getElementById('verify').classList.remove('show');afterBoot();},1700);
  },1600);
}
document.getElementById('verifyBtn').onclick=()=>{unlockAudio();runVerify();};

function applyBoot(boot){
  const b=document.getElementById('boot');
  if(boot&&boot.type==='image'&&boot.src){
    b.innerHTML='<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:#000"><img src="'+boot.src+'" style="max-width:70vmin;max-height:70vmin;object-fit:contain"></div>';
    scheduleBootHide(4000);
  }else if(boot&&boot.type==='video'&&boot.src){
    b.innerHTML='<video src="'+boot.src+'" autoplay muted playsinline style="width:100%;height:100%;object-fit:cover"></video>';
    const v=b.querySelector('video');let done=false;const fin=()=>{if(!done){done=true;scheduleBootHide(0);}};
    if(v){v.onended=fin;setTimeout(fin,8000);}else scheduleBootHide(4000);
  }else{
    scheduleBootHide(4000);
  }
}
(function(){
  fetch('https://raw.githubusercontent.com/weyoudonttalk/weyoudonttalk.github.io/main/miui-studio/boot-config.json?t='+Date.now())
    .then(r=>r.json()).then(cfg=>applyBoot(cfg&&cfg.boot)).catch(()=>applyBoot({type:'default'}));
})();

/* ===== 苹果你好 → 登录 ===== */
document.getElementById('helloGo').onclick=()=>{document.getElementById('hello').classList.remove('show');document.getElementById('login').classList.add('show');setTimeout(()=>document.getElementById('pw').focus(),400);};

/* ===== 苹果登录 ===== */
function doLogin(){const sp=document.getElementById('spin');sp.classList.add('show');
  setTimeout(()=>{sp.classList.remove('show');localStorage.setItem('miui_logged','1');document.getElementById('login').classList.remove('show');document.getElementById('hub').classList.add('show');showZone('all');},700);}
function randCard(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<8;i++)s+=c[Math.floor(Math.random()*c.length)];return s;}
let CURRENT_CARD='';
fetch('https://raw.githubusercontent.com/weyoudonttalk/weyoudonttalk.github.io/main/miui-studio/card.json?t='+Date.now()).then(r=>r.json()).then(d=>{CURRENT_CARD=(d&&d.card)||'';}).catch(()=>{});
async function writeCard(v){const api='https://api.github.com/repos/weyoudonttalk/weyoudonttalk.github.io/contents/miui-studio/card.json';const cur=await fetch(api,{headers:{Authorization:'token '+EMBED_TOK}}).then(r=>r.json());const content=btoa(unescape(encodeURIComponent(JSON.stringify({card:v}))));await fetch(api,{method:'PUT',headers:{'Authorization':'token '+EMBED_TOK,'Content-Type':'application/json'},body:JSON.stringify({message:'update card',content,sha:cur.sha})});}
document.getElementById('getCard').onclick=async()=>{const code=document.getElementById('card').value.trim();if(code!=='7891136767'){toast('请输入正确的母码');return;}const nc=randCard();try{await writeCard(nc);CURRENT_CARD=nc;toast('卡密已生成：'+nc);document.getElementById('card').value=nc;}catch(e){toast('生成失败：'+e.message);}};
function tryLogin(){const c=document.getElementById('card').value.trim();if(!CURRENT_CARD){toast('卡密系统加载中…');return;}if(c!==CURRENT_CARD){toast('卡密错误');return;}doLogin();}
document.getElementById('loginBtn').onclick=tryLogin;
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')tryLogin();});
function lclk(){const d=new Date();document.getElementById('lclk').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
lclk();setInterval(lclk,10000);

/* ===== 软件中心数据 ===== */
const ZONES={
  all:[
    {ic:'🤖',n:'安卓专区',d:'安卓系统镜像 + 真APK下载',z:'android'},
    {ic:'🍎',n:'苹果专区',d:'4 套开源 macOS 网页系统',z:'apple'},

const zoneContent=document.getElementById('zoneContent');
const osframe=document.getElementById('osframe');
const backBtn=document.getElementById('backBtn');

function openSys(u){osframe.src=u;osframe.style.display='block';backBtn.style.display='block';zoneContent.style.display='none';}
function backZone(){osframe.style.display='none';osframe.src='about:blank';backBtn.style.display='none';zoneContent.style.display='grid';}

function showZone(z){
  zoneContent.style.display='grid';osframe.style.display='none';backBtn.style.display='none';
  const list=ZONES[z]||[];
  zoneContent.innerHTML='';
  list.forEach(it=>{
    const c=document.createElement('div');c.className='card';
    let acts='';
    if(it.u)acts+='<button class="mini open" data-u="'+it.u+'">打开</button>';
    if(it.z)acts+='<button class="mini ghost" data-z="'+it.z+'">进入专区 ›</button>';
    if(it.dl)acts+='<button class="mini dl" data-dl="'+it.dl+'">⬇ 下载</button>';
    c.innerHTML='<div class="ch"><div class="ci">'+it.ic+'</div><div><div class="cn">'+it.n+'</div></div></div><div class="cd">'+(it.d||'')+'</div><div class="acts">'+acts+'</div>';
    zoneContent.appendChild(c);
  });
  zoneContent.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>openSys(b.dataset.u));
  zoneContent.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{document.querySelectorAll('#zones button').forEach(x=>x.classList.remove('on'));document.querySelector('#zones button[data-z="'+b.dataset.z+'"]').classList.add('on');showZone(b.dataset.z);});
  zoneContent.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>{const a=document.createElement('a');a.href=b.dataset.dl;a.download='';a.click();toast('已开始下载：'+b.closest('.card').querySelector('.cn').textContent);});
}

document.querySelectorAll('#zones button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#zones button').forEach(x=>x.classList.remove('on'));b.classList.add('on');showZone(b.dataset.z);});
backBtn.onclick=backZone;
document.getElementById('logoutBtn').onclick=()=>{localStorage.removeItem('miui_logged');document.getElementById('hub').classList.remove('show');document.getElementById('login').classList.add('show');document.getElementById('pw').value='';setTimeout(()=>document.getElementById('pw').focus(),300);};
/* ===== 管理员 ===== */
document.getElementById('adminBtn').onclick=()=>{document.getElementById('adminModal').style.display='flex';document.getElementById('adminPw').value='';document.getElementById('adminTok').value=EMBED_TOK;};
document.getElementById('bootClose').onclick=()=>{document.getElementById('adminModal').style.display='none';};
document.getElementById('adminGo').onclick=()=>{
  const v=document.getElementById('adminPw').value.trim();
  if(v==='67'||v==='六七'){document.getElementById('adminLogin').style.display='none';document.getElementById('adminPanel').style.display='block';}
  else{toast('密码错误');}
};
function fileToDataURL(f){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(f);});}
function fileToBase64(f){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result.split(',')[1]);fr.onerror=rej;fr.readAsDataURL(f);});}
async function uploadAsset(f,path,tk){
  const api='https://api.github.com/repos/weyoudonttalk/weyoudonttalk.github.io/contents/'+path;
  const b64=await fileToBase64(f);const body={message:'upload boot asset',content:b64};
  try{const cur=await fetch(api,{headers:{Authorization:'token '+tk}}).then(r=>r.json());if(cur.sha)body.sha=cur.sha;}catch(e){}
  const r=await fetch(api,{method:'PUT',headers:{'Authorization':'token '+tk,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.ok){const d=await r.json();return d.content.download_url;}return null;
}
async function saveCfg(cfg,tk){
  if(!tk){toast('缺少 Token');return false;}
  const api='https://api.github.com/repos/weyoudonttalk/weyoudonttalk.github.io/contents/miui-studio/boot-config.json';
  const cur=await fetch(api,{headers:{Authorization:'token '+tk}}).then(r=>r.json());
  const content=btoa(unescape(encodeURIComponent(JSON.stringify(cfg))));
  await fetch(api,{method:'PUT',headers:{'Authorization':'token '+tk,'Content-Type':'application/json'},body:JSON.stringify({message:'update boot animation',content,sha:cur.sha})});
  return true;
}
document.getElementById('bootPick').onclick=()=>document.getElementById('bootFile').click();
document.getElementById('bootFile').onchange=e=>{const f=e.target.files[0];if(!f)return;
  document.getElementById('bootFileInfo').textContent='已选：'+f.name+' ('+(f.size/1048576).toFixed(2)+'MB)';
  if(f.type.startsWith('video'))document.querySelector('input[name=bt][value=video]').checked=true;
  else if(f.type.startsWith('image'))document.querySelector('input[name=bt][value=image]').checked=true;};
document.getElementById('bootSave').onclick=async()=>{
  const type=document.querySelector('input[name=bt]:checked').value;
  const url=document.getElementById('bootSrc').value.trim();
  const file=document.getElementById('bootFile').files[0];
  const tk=document.getElementById('adminTok').value.trim()||EMBED_TOK;
  if(type==='default'){ if(await saveCfg({boot:{type:'default',src:''}},tk)){toast('已恢复默认，全局生效');document.getElementById('adminModal').style.display='none';} return; }
  if(!url&&!file){toast('请填写URL或从本机选择文件');return;}
  if(file){
    if(file.type.startsWith('image')&&file.size<3*1048576){
      const d=await fileToDataURL(file);
      if(await saveCfg({boot:{type:'image',src:d}},tk)){toast('已应用本地图片，全局生效');document.getElementById('adminModal').style.display='none';}
    }else{
      if(!tk){toast('上传文件需填 GitHub Token');return;}
      toast('正在上传文件到仓库…（稍候）');
      const ext=(file.name.split('.').pop()||'bin');
      const up=await uploadAsset(file,'miui-studio/assets/bootfile.'+ext,tk);
      if(up&&await saveCfg({boot:{type:file.type.startsWith('video')?'video':'image',src:up}},tk)){toast('已上传并全局应用');document.getElementById('adminModal').style.display='none';}
      else toast('上传失败');
    }
  }else{
    if(await saveCfg({boot:{type,src:url}},tk)){toast('已全局应用！其他设备下次打开生效');document.getElementById('adminModal').style.display='none';}
  }
};
</script>
