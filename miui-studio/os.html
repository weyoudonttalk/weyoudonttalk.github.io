<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MIUI STUDIO OS · 开源系统中心</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif}
  body{background:#000;color:#fff;user-select:none}
  /* ===== 开机动画 ===== */
  #boot{position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .7s}
  #boot.gone{opacity:0;pointer-events:none}
  #boot canvas{position:absolute;inset:0}
  .blogo{position:relative;z-index:2;text-align:center}
  .blogo .mi{font-size:13px;letter-spacing:10px;color:#ccc;opacity:.85}
  .blogo .nm{font-size:46px;font-weight:800;margin-top:4px;background:linear-gradient(120deg,#ff6900,#ff2d55,#7b5cff,#00d4ff);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:3px;animation:hue 4s linear infinite;text-shadow:0 0 40px rgba(255,105,0,.3)}
  @keyframes hue{0%{background-position:0% 50%}100%{background-position:300% 50%}}
  .blogo .sub{font-size:11px;color:#777;margin-top:10px;letter-spacing:4px}
  .bbar{position:relative;z-index:2;margin-top:40px;width:200px;height:3px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
  .bbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff6900,#ff2d55);animation:bb 4s ease forwards}
  @keyframes bb{to{width:100%}}
  .btip{position:relative;z-index:2;margin-top:16px;font-size:11px;color:#666;letter-spacing:2px}
  /* ===== 锁屏 ===== */
  #lock{position:fixed;inset:0;z-index:9000;background:radial-gradient(circle at 50% 28%,#1a1f3a,#05060d);display:none;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
  #lock.show{display:flex}
  #lock .lt{font-size:72px;font-weight:200;letter-spacing:2px;text-shadow:0 0 40px rgba(120,150,255,.4)}
  #lock .ld{font-size:15px;color:#8a93b8;margin-top:4px}
  #lock .hint{position:absolute;bottom:90px;display:flex;flex-direction:column;align-items:center;gap:8px;color:#7a83a8;font-size:12px;animation:pb 1.8s ease-in-out infinite}
  #lock .hint .arr{font-size:26px}
  @keyframes pb{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-10px);opacity:1}}
  /* ===== OS 中心 ===== */
  #hub{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;background:#05060d}
  #hub.show{display:flex}
  .hubbar{flex-shrink:0;background:rgba(10,12,22,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.08);padding:8px 12px}
  .ht{font-size:13px;font-weight:700;letter-spacing:1px;background:linear-gradient(120deg,#ff6900,#ff2d55);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .ht small{color:#7a83a8;-webkit-text-fill-color:#7a83a8;font-weight:400;font-size:10px;margin-left:6px}
  .tabs{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
  .tabs button{flex-shrink:0;padding:7px 14px;border-radius:18px;background:rgba(255,255,255,.08);border:0;color:#cfd6f0;font-size:12px;cursor:pointer;white-space:nowrap}
  .tabs button.on{background:linear-gradient(135deg,#ff6900,#ff2d55);color:#fff;font-weight:700}
  .src{margin-top:6px;font-size:10px;color:#6b7390}
  .src a{color:#7b5cff;text-decoration:none;margin-right:10px}
  #osframe{width:100%;flex:1;border:0;background:#0a0c16}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:99999;background:rgba(0,0,0,.88);color:#fff;padding:10px 18px;border-radius:20px;font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:84vw;text-align:center}
  .toast.show{opacity:1}
</style>
</head>
<body>

<!-- 开机动画 -->
<div id="boot">
  <canvas id="bcv"></canvas>
  <div class="blogo">
    <div class="mi">MIUI STUDIO</div>
    <div class="nm">HYPER OS</div>
    <div class="sub">OPEN-SOURCE HUB</div>
  </div>
  <div class="bbar"><i></i></div>
  <div class="btip" id="btip">正在启动内核…</div>
</div>

<!-- 锁屏 -->
<div id="lock">
  <div class="lt" id="lockTime">09:41</div>
  <div class="ld" id="lockDate">星期一 11月11日</div>
  <div class="hint"><div class="arr">⌃</div><div>上滑解锁</div></div>
</div>

<!-- OS 中心 -->
<div id="hub">
  <div class="hubbar">
    <div class="ht">MIUI STUDIO OS <small>国产开源 OS 合集 · 9 个真实网页系统(国内为主)</small></div>
    <div class="tabs" id="tabs">
      <button data-u="https://runnova.github.io/NovaOS/" data-s="https://github.com/runnova/NovaOS" class="on">NovaOS</button>
      <button data-u="https://haris16-code.github.io/BJH-OS/" data-s="https://github.com/Haris16-code/BJH-OS">BJH OS</button>
      <button data-u="https://tjy-gitnub.github.io/win12/desktop.html" data-s="https://github.com/tjy-gitnub/win12">Win12·谭景元</button>
      <button data-u="https://yoyopan1115.github.io/FluentOS-On-Web/" data-s="https://github.com/yoyopan1115/FluentOS-On-Web">FluentOS</button>
      <button data-u="https://550w.szyd.fun" data-s="https://550w.szyd.fun">550W OS</button>
      <button data-u="https://chenxing-dev.github.io" data-s="https://github.com/chenxing-dev">陈刑OS</button>
      <button data-u="https://iosandroidweb.vercel.app" data-s="https://github.com/chukjosh/IOS-and-Android-on-the-Web">iOS·安卓</button>
      <button data-u="https://dustinbrett.com/" data-s="https://github.com/DustinBrett/daedalOS">daedalOS</button>
      <button data-u="https://puter.com" data-s="https://github.com/HeyPuter/puter">Puter</button>
    </div>
    <div class="src" id="srclink"><a href="https://github.com/runnova/NovaOS" target="_blank">⭐ 当前系统源码</a><a href="https://weyoudonttalk.github.io/miui-studio/" target="_blank">← 返回官网</a></div>
  </div>
  <iframe id="osframe" src="https://runnova.github.io/NovaOS/" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-presentation allow-modals"></iframe>
</div>

<div class="toast" id="toast"></div>

<script>
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600);}

/* ===== 开机动画 ===== */
(function(){
  const cv=document.getElementById('bcv'),ctx=cv.getContext('2d');
  function rs(){cv.width=innerWidth;cv.height=innerHeight;}rs();addEventListener('resize',rs);
  const N=120,ps=[];
  for(let i=0;i<N;i++)ps.push({x:Math.random()*cv.width,y:Math.random()*cv.height,a:Math.random()*6.28,sp:.2+Math.random()*.6,r:Math.random()*2+1});
  const tips=['正在启动内核…','加载驱动…','初始化桌面…','校准触控…','准备就绪'];let ti=0;
  const tt=setInterval(()=>{document.getElementById('btip').textContent=tips[ti=(ti+1)%tips.length];},800);
  let raf,t0=performance.now();
  function loop(){
    const el=(performance.now()-t0)/1000;ctx.clearRect(0,0,cv.width,cv.height);
    const cx=cv.width/2,cy=cv.height/2-40,pull=Math.min(1,el/2.6);
    for(const p of ps){const tx=cx+Math.cos(p.a)*180*(1-pull),ty=cy+Math.sin(p.a)*180*(1-pull);
      p.x+=(tx-p.x)*.06;p.y+=(ty-p.y)*.06;p.a+=p.sp*.02;
      const g=el>2.4?1:el/2.4;
      ctx.beginPath();ctx.fillStyle='rgba(255,'+Math.floor(105*g+80)+','+Math.floor(60*g+100)+','+(.5+.5*g)+')';ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();}
    if(el>1.2){ctx.strokeStyle='rgba(255,105,0,'+(el>2.4?0:.4*(1-(el-1.2)/1.2))+')';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,90*(1-pull*.3),0,7);ctx.stroke();}
    if(el>2.2){const sx=(el-2.2)/2*cv.width;ctx.fillStyle='rgba(255,255,255,.06)';ctx.fillRect(sx,0,60,cv.height);}
    raf=requestAnimationFrame(loop);
  }
  loop();
  setTimeout(()=>{cancelAnimationFrame(raf);clearInterval(tt);document.getElementById('boot').classList.add('gone');
    setTimeout(()=>{document.getElementById('boot').style.display='none';document.getElementById('lock').classList.add('show');},700);},4300);
})();

/* ===== 上滑解锁 ===== */
function updLock(){const d=new Date(),hh=String(d.getHours()).padStart(2,'0'),mm=String(d.getMinutes()).padStart(2,'0');
  document.getElementById('lockTime').textContent=hh+':'+mm;
  const wd=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];
  document.getElementById('lockDate').textContent=wd+' '+(d.getMonth()+1)+'月'+d.getDate()+'日';}
updLock();setInterval(updLock,10000);
(function(){
  const lock=document.getElementById('lock');let sy=null,move=false;
  function start(y){sy=y;move=true;}
  function end(dy){if(move&&dy<-70){lock.classList.remove('show');document.getElementById('hub').classList.add('show');}move=false;sy=null;}
  lock.addEventListener('touchstart',e=>start(e.touches[0].clientY),{passive:true});
  lock.addEventListener('touchmove',e=>{if(sy!==null){const dy=e.touches[0].clientY-sy;if(dy<-70){lock.style.transform='translateY('+Math.max(dy,-120)+'px)';lock.style.opacity=String(1+dy/300);}}},{passive:true});
  lock.addEventListener('touchend',e=>{const dy=sy!==null?(e.changedTouches[0].clientY-sy):0;lock.style.transform='';lock.style.opacity='';end(dy);});
  lock.addEventListener('mousedown',e=>start(e.clientY));
  addEventListener('mousemove',e=>{if(sy!==null){const dy=e.clientY-sy;if(dy<-70)lock.style.transform='translateY('+Math.max(dy,-120)+'px)';}});
  addEventListener('mouseup',e=>{const dy=sy!==null?(e.clientY-sy):0;lock.style.transform='';end(dy);});
})();

/* ===== 切换 OS ===== */
const tabs=document.getElementById('tabs'),frame=document.getElementById('osframe'),srclink=document.getElementById('srclink');
tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{
  tabs.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  frame.src=b.dataset.u;
  srclink.innerHTML='<a href="'+b.dataset.s+'" target="_blank">⭐ 当前系统源码</a><a href="https://weyoudonttalk.github.io/miui-studio/" target="_blank">← 返回官网</a>';
  toast('正在加载：'+b.textContent);
});
</script>
</body>
</html>
