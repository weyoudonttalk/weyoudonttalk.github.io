<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MIUI STUDIO OS · 我的系统中心</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif}
  body{background:#000;color:#fff;user-select:none}
  /* ===== 开机动画 ===== */
  #boot{position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .7s}
  #boot.gone{opacity:0;pointer-events:none}
  #boot canvas{position:absolute;inset:0}
  .blogo{position:relative;z-index:2;text-align:center}
  .blogo .mi{font-size:13px;letter-spacing:10px;color:#ddd;opacity:.9}
  .blogo .nm{font-size:46px;font-weight:800;margin-top:4px;background:linear-gradient(120deg,#ff6900,#ff2d55,#7b5cff,#00d4ff);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:3px;animation:hue 4s linear infinite;text-shadow:0 0 40px rgba(255,105,0,.3)}
  @keyframes hue{0%{background-position:0% 50%}100%{background-position:300% 50%}}
  .blogo .sub{font-size:11px;color:#888;margin-top:10px;letter-spacing:4px}
  .bbar{position:relative;z-index:2;margin-top:40px;width:200px;height:3px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
  .bbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff6900,#ff2d55);animation:bb 4s ease forwards}
  @keyframes bb{to{width:100%}}
  .btip{position:relative;z-index:2;margin-top:16px;font-size:11px;color:#666;letter-spacing:2px}

  /* ===== 苹果「你好」欢迎屏 ===== */
  #hello{position:fixed;inset:0;z-index:9500;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#1c1c1e,#000 75%);text-align:center}
  #hello.show{display:flex;animation:fade .8s ease}
  #hello .apple{width:64px;height:64px;margin-bottom:30px;opacity:.92}
  #hello .apple svg{width:100%;height:100%;fill:#fff}
  #hello .hi{font-size:64px;font-weight:300;letter-spacing:1px;background:linear-gradient(120deg,#fff,#b9c6ff,#ffd9ec);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  #hello .wel{margin-top:14px;font-size:17px;color:#c7c7cc;font-weight:300}
  #hello .go{margin-top:46px;padding:11px 30px;border-radius:24px;background:rgba(255,255,255,.1);color:#fff;font-size:15px;cursor:pointer;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);transition:.15s}
  #hello .go:active{transform:scale(.95);background:rgba(255,255,255,.2)}

  /* ===== 苹果登录（一比一 macOS） ===== */
  #login{position:fixed;inset:0;z-index:9400;display:none;flex-direction:column;
    background:
      radial-gradient(circle at 22% 18%, rgba(120,150,255,.55), transparent 45%),
      radial-gradient(circle at 80% 75%, rgba(255,120,200,.45), transparent 45%),
      linear-gradient(160deg,#1b2a5e,#0a1330 55%,#1a0f2e);
    overflow:hidden}
  #login.show{display:flex;animation:fade .7s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  #login .topbar{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:14px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}
  #login .topbar .right{display:flex;gap:14px;align-items:center;opacity:.9}
  #login .panel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
  #login .logo{width:56px;height:56px;opacity:.96}
  #login .logo svg{width:100%;height:100%;fill:#fff}
  #login .ava{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,#5b9bd5,#2e5cff);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:600;color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.4)}
  #login .uname{font-size:18px;font-weight:500;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}
  #login .pw{width:260px;max-width:80vw;padding:10px 14px;border-radius:9px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:14px;outline:none;text-align:center;backdrop-filter:blur(8px)}
  #login .pw::placeholder{color:rgba(255,255,255,.6)}
  #login .loginbtn{width:42px;height:42px;border-radius:50%;background:#007aff;border:0;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;box-shadow:0 4px 14px rgba(0,122,255,.5)}
  #login .loginbtn:active{transform:scale(.92)}
  #login .hint{font-size:12px;color:rgba(255,255,255,.7);margin-top:4px}
  #login .spin{position:absolute;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:2}
  #login .spin.show{display:flex}
  #login .spin i{width:34px;height:34px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:rot .8s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}

  /* ===== OS 中心 ===== */
  #hub{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;background:#05060d}
  #hub.show{display:flex}
  .hubbar{flex-shrink:0;background:rgba(10,12,22,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.08);padding:8px 12px}
  .ht{font-size:13px;font-weight:700;letter-spacing:1px;background:linear-gradient(120deg,#ff6900,#ff2d55);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .ht small{color:#7a83a8;-webkit-text-fill-color:#7a83a8;font-weight:400;font-size:10px;margin-left:6px}
  .tabs{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
  .tabs button{flex-shrink:0;padding:7px 14px;border-radius:18px;background:rgba(255,255,255,.08);border:0;color:#cfd6f0;font-size:12px;cursor:pointer;white-space:nowrap}
  .tabs button.on{background:linear-gradient(135deg,#ff6900,#ff2d55);color:#fff;font-weight:700}
  .src{margin-top:6px;font-size:10px;color:#6b7390}
  .src a{color:#7b5cff;text-decoration:none;margin-right:10px}
  #osframe{width:100%;flex:1;border:0;background:#0a0c16}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:99999;background:rgba(0,0,0,.88);color:#fff;padding:10px 18px;border-radius:20px;font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:84vw;text-align:center}
  .toast.show{opacity:1}
</style>
</head>
<body>

<!-- 开机动画 -->
<div id="boot">
  <canvas id="bcv"></canvas>
  <div class="blogo">
    <div class="mi">MIUI STUDIO</div>
    <div class="nm">带你创想未来</div>
    <div class="sub">MY SYSTEM HUB</div>
  </div>
  <div class="bbar"><i></i></div>
  <div class="btip" id="btip">正在启动内核…</div>
</div>

<!-- 苹果「你好」欢迎屏 -->
<div id="hello">
  <div class="apple"><svg viewBox="0 0 384 512"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg></div>
  <div class="hi">你好</div>
  <div class="wel">欢迎使用 MIUI 工作室系统</div>
  <div class="go" id="helloGo">继续</div>
</div>

<!-- 苹果登录（一比一 macOS） -->
<div id="login">
  <div class="topbar">
    <span style="font-weight:600">MIUI</span>
    <div class="right"><span>📶</span><span>🔋</span><span id="lclk">9:41</span></div>
  </div>
  <div class="panel">
    <div class="logo"><svg viewBox="0 0 384 512"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg></div>
    <div class="ava">M</div>
    <div class="uname">MIUI</div>
    <input class="pw" id="pw" type="password" placeholder="输入密码以登录" autocomplete="off">
    <button class="loginbtn" id="loginBtn">→</button>
    <div class="hint">密码留空也可登录（本地模拟）</div>
  </div>
  <div class="spin" id="spin"><i></i></div>
</div>

<!-- OS 中心 -->
<div id="hub">
  <div class="hubbar">
    <div class="ht">MIUI STUDIO OS <small>我的系统中心 · 内置多套桌面环境</small></div>
    <div class="tabs" id="tabs">
      <button data-u="https://runnova.github.io/NovaOS/" class="on">NovaOS</button>
      <button data-u="https://haris16-code.github.io/BJH-OS/">BJH OS</button>
      <button data-u="https://tjy-gitnub.github.io/win12/desktop.html">Win12</button>
      <button data-u="https://yoyopan1115.github.io/FluentOS-On-Web/">FluentOS</button>
      <button data-u="https://550w.szyd.fun">550W OS</button>
      <button data-u="https://chenxing-dev.github.io">陈刑OS</button>
      <button data-u="https://iosandroidweb.vercel.app">iOS·安卓</button>
      <button data-u="https://dustinbrett.com/">daedalOS</button>
      <button data-u="https://puter.com">Puter</button>
      <button data-u="https://www.android-x86.org/">安卓模拟器·x86</button>
      <button data-u="https://blissos.org/">Bliss OS</button>
      <button data-u="https://waydro.id/">Waydroid</button>
      <button data-u="https://mengobs.github.io/Webintosh">🍎 Webintosh</button>
      <button data-u="https://mhmdmhd6.github.io/Mac-OS-Desktop/">🍎 Mac 桌面</button>
      <button data-u="https://senzo13.github.io/macos-sequoia-web/">🍎 Sequoia</button>
      <button data-u="https://mengobs.github.io/Webintosh-Desktop">🍎 Webintosh 桌面</button>
    </div>
    <div class="src" id="srclink"><a href="https://weyoudonttalk.github.io/miui-studio/" target="_blank">← 返回官网</a></div>
  </div>
  <iframe id="osframe" src="https://runnova.github.io/NovaOS/" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-presentation allow-modals"></iframe>
</div>

<div class="toast" id="toast"></div>

<script>
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400);}

/* ===== 开机动画：粒子汇聚 ===== */
(function(){
  const cv=document.getElementById('bcv'),ctx=cv.getContext('2d');
  function rs(){cv.width=innerWidth;cv.height=innerHeight;}rs();addEventListener('resize',rs);
  const N=120,ps=[];
  for(let i=0;i<N;i++)ps.push({x:Math.random()*cv.width,y:Math.random()*cv.height,a:Math.random()*6.28,sp:.2+Math.random()*.6,r:Math.random()*2+1});
  const tips=['正在启动内核…','加载驱动…','初始化桌面…','校准触控…','准备就绪'];let ti=0;
  const tt=setInterval(()=>{document.getElementById('btip').textContent=tips[ti=(ti+1)%tips.length];},800);
  let raf,t0=performance.now();
  function loop(){
    const el=(performance.now()-t0)/1000;ctx.clearRect(0,0,cv.width,cv.height);
    const cx=cv.width/2,cy=cv.height/2-40,pull=Math.min(1,el/2.6);
    for(const p of ps){const tx=cx+Math.cos(p.a)*180*(1-pull),ty=cy+Math.sin(p.a)*180*(1-pull);
      p.x+=(tx-p.x)*.06;p.y+=(ty-p.y)*.06;p.a+=p.sp*.02;
      const g=el>2.4?1:el/2.4;
      ctx.beginPath();ctx.fillStyle='rgba(255,'+Math.floor(105*g+80)+','+Math.floor(60*g+100)+','+(.5+.5*g)+')';ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();}
    if(el>1.2){ctx.strokeStyle='rgba(255,105,0,'+(el>2.4?0:.4*(1-(el-1.2)/1.2))+')';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,90*(1-pull*.3),0,7);ctx.stroke();}
    if(el>2.2){const sx=(el-2.2)/2*cv.width;ctx.fillStyle='rgba(255,255,255,.06)';ctx.fillRect(sx,0,60,cv.height);}
    raf=requestAnimationFrame(loop);
  }
  loop();
  setTimeout(()=>{cancelAnimationFrame(raf);clearInterval(tt);document.getElementById('boot').classList.add('gone');
    setTimeout(()=>{document.getElementById('boot').style.display='none';document.getElementById('hello').classList.add('show');},700);},4300);
})();

/* ===== 苹果「你好」→ 登录 ===== */
document.getElementById('helloGo').onclick=()=>{
  document.getElementById('hello').classList.remove('show');
  document.getElementById('login').classList.add('show');
  setTimeout(()=>document.getElementById('pw').focus(),400);
};

/* ===== 苹果登录 ===== */
function doLogin(){
  const sp=document.getElementById('spin');sp.classList.add('show');
  setTimeout(()=>{
    sp.classList.remove('show');
    document.getElementById('login').classList.remove('show');
    document.getElementById('hub').classList.add('show');
  },700);
}
document.getElementById('loginBtn').onclick=doLogin;
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
function lclk(){const d=new Date();document.getElementById('lclk').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
lclk();setInterval(lclk,10000);

/* ===== 切换 OS ===== */
const tabs=document.getElementById('tabs'),frame=document.getElementById('osframe'),srclink=document.getElementById('srclink');
tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{
  tabs.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  frame.src=b.dataset.u;
  srclink.innerHTML='<a href="https://weyoudonttalk.github.io/miui-studio/" target="_blank">← 返回官网</a>';
  toast('正在加载：'+b.textContent.replace('🍎 ',''));
});
</script>
</body>
</html>
