<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>API 中心 · MIUI 工作室</title>
<meta name="description" content="MIUI 工作室免费 API 中心：国内可访问免密钥接口，文案/美图/天气/翻译/二维码，多源兜底。" />
<link rel="stylesheet" href="style.css" />
<style>
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px}
  .card{min-height:180px;display:flex;flex-direction:column}
  .card .body{flex:1;font-size:14px;color:var(--sub);line-height:1.6;word-break:break-word;overflow:auto;margin:6px 0}
  .card .body img{max-width:100%;border-radius:10px;display:block;margin:0 auto;max-height:200px;object-fit:cover}
  .card .body .big{font-size:17px;color:var(--txt);font-style:italic}
  .card .foot{display:flex;gap:8px;margin-top:auto;align-items:center;flex-wrap:wrap}
  .mini{background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:7px 14px;border-radius:20px;font-size:12.5px;cursor:pointer;transition:.2s}
  .mini:hover{border-color:var(--qq);color:var(--qq)}
  .inp{background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:8px 11px;border-radius:9px;font-size:13px;flex:1;min-width:120px;outline:none}
  .inp:focus{border-color:var(--qq)}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--qq);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .tag{position:absolute;top:12px;right:14px;font-size:10px;color:var(--sub);opacity:.7}
  .src{font-size:10px;color:var(--ok);margin-left:6px}
  .bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0 26px}
</style>
</head>
<body>
<nav>
  <div class="brand"><div class="logo">M</div>MIUI 工作室</div>
  <button class="menu-btn" onclick="document.querySelector('.navlinks').classList.toggle('open')">☰</button>
  <div class="navlinks">
    <a href="index.html">首页</a>
    <a href="ai-chat.html">AI 助手</a>
    <a href="api-hub.html" class="active">API 中心</a>
    <a href="create.html">创作工坊</a>
    <a href="tools.html">工具箱</a>
    <a href="about.html">关于</a>
    <a href="ai-chat.html" class="btn primary" style="padding:8px 18px">进入对话</a>
  </div>
</nav>

<section class="wrap">
  <div class="sec-h"><div class="ey">FREE API HUB</div><h2>免费 API 中心</h2>
    <p>全部国内可访问、免密钥。每张卡片多源兜底——单接口挂了自动切下一个，互不影响。</p></div>
  <div class="bar">
    <button class="btn primary" onclick="refreshAll()">🚀 全部刷新</button>
    <button class="btn ghost" onclick="location.reload()">重置</button>
  </div>
  <div class="grid" id="grid"></div>
</section>

<footer>
  <div>官方 QQ 群：1070470498</div>
  <div style="margin-top:8px">接口来自公开免费服务，若全部源均不可用多为网络波动，稍后重试即可。</div>
</footer>

<script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// 通用：从对象里尽量取出一句话
function pickText(d){
  if(typeof d==='string')return d;
  return d?.hitokoto||d?.data?.text||d?.data?.content||d?.data?.content||d?.data||d?.text||d?.content||d?.msg||d?.sentence||d?.text||JSON.stringify(d);
}

// 文本类卡片：依次尝试多个源
const TEXT_CARDS=[
  {id:'hitokoto',title:'一言',tag:'Hitokoto',
   sources:[
     {url:'https://v1.hitokoto.cn/',pick:d=>d.hitokoto+'　—— '+(d.from||'')},
     {url:'https://60s.viki.moe/v2/hitokoto',pick:d=>pickText(d?.data||d)},
   ]},
  {id:'du',title:'毒鸡汤',tag:'vvhan',
   sources:[
     {url:'https://api.vvhan.com/api/du',pick:d=>pickText(d)},
     {url:'https://60s.viki.moe/v2/dad-joke',pick:d=>pickText(d?.data||d)},
   ]},
  {id:'caihongpi',title:'彩虹屁',tag:'vvhan',
   sources:[
     {url:'https://api.vvhan.com/api/caihongpi',pick:d=>pickText(d)},
     {url:'https://60s.viki.moe/v2/duanzi',pick:d=>pickText(d?.data||d)},
   ]},
  {id:'tiangou',title:'舔狗日记',tag:'vvhan',
   sources:[
     {url:'https://api.vvhan.com/api/tiangou',pick:d=>pickText(d)},
     {url:'https://60s.viki.moe/v2/kfc',pick:d=>pickText(d?.data||d)},
   ]},
  {id:'answer',title:'答案之书',tag:'60s',
   sources:[
     {url:'https://60s.viki.moe/v2/answer',pick:d=>pickText(d?.data||d)},
     {url:'https://v1.hitokoto.cn/?c=k',pick:d=>pickText(d)},
   ]},
  {id:'quote',title:'英文名言',tag:'Quotable',
   sources:[
     {url:'https://api.quotable.io/random',pick:d=>'"'+d.content+'" — '+d.author},
   ]},
];

// 图片类卡片：依次尝试多个直链
const IMG_CARDS=[
  {id:'bing',title:'必应每日壁纸',tag:'Bing',urls:[
     'https://api.vvhan.com/api/bing','https://api.dujin.org/bing/bing.php','https://bing.img.run/uh.php']},
  {id:'dog',title:'随机狗狗',tag:'vvhan',urls:['https://api.vvhan.com/api/dog','https://api.vvhan.com/api/cat']},
  {id:'cat',title:'随机猫咪',tag:'vvhan',urls:['https://api.vvhan.com/api/cat','https://api.vvhan.com/api/dog']},
  {id:'girl',title:'随机美图',tag:'vvhan',urls:['https://api.vvhan.com/api/girl','https://api.vvhan.com/api/acg','https://picsum.photos/400/280']},
];

// 特殊卡片
const SPECIAL=[
  {id:'weather',title:'天气查询',tag:'国内',
   body:`<input class="inp" id="w_in" placeholder="城市，如 北京" value="北京"><div id="w_out" style="margin-top:10px"></div>`,
   load:async()=>{
     const city=(document.getElementById('w_in').value.trim()||'北京');
     const srcs=[
       {u:`https://wthrcdn.etouch.cn/weather_mini?city=${encodeURIComponent(city)}`,f:d=>{const f=d.data.forecast[0];return `${d.data.city} ${d.data.wendu}℃ ${f.type} ${f.low}/${f.high}`;}},
       {u:`https://www.tianqiapi.com/api/?version=v1&city=${encodeURIComponent(city)}`,f:d=>{const f=d.data[0];return `${f.city} ${f.tem}℃ ${f.wea}`;}},
     ];
     for(const s of srcs){try{const r=await fetch(s.u);const d=await r.json();document.getElementById('w_out').innerHTML=s.f(d);return;}catch(e){}}
     document.getElementById('w_out').innerHTML='<span style="color:var(--err)">⚠ 天气源暂不可用</span>';
   }},
  {id:'ip',title:'IP 归属地',tag:'vvhan',
   load:async(b)=>{
     const srcs=[
       {u:'https://api.vvhan.com/api/ip',f:d=>`IP：${d.ip||''}　${d.info?.addr||d.address||''}`},
       {u:'https://ipapi.co/json/',f:d=>`IP：${d.ip}　${d.city||''} ${d.country_name||''}`},
     ];
     for(const s of srcs){try{const r=await fetch(s.u);const d=await r.json();b.innerHTML=s.f(d);return;}catch(e){}}
     b.innerHTML='<span style="color:var(--err)">⚠ IP 源暂不可用</span>';
   }},
  {id:'qr',title:'二维码生成',tag:'QR Server',
   body:`<input class="inp" id="qr_in" placeholder="输入文字或链接" value="https://weyoudonttalk.github.io/miui-studio/"><div id="qr_out" style="margin-top:10px;text-align:center"></div>`,
   load:async()=>{
     const v=document.getElementById('qr_in').value.trim()||'MIUI STUDIO';
     const u='https://api.qrserver.com/v1/create-qr-code/?size=180x180&data='+encodeURIComponent(v);
     document.getElementById('qr_out').innerHTML=`<img src="${u}" onerror="this.parentNode.innerHTML='生成失败(网络)'">`;
   }},
  {id:'trans',title:'实时翻译',tag:'MyMemory',
   body:`<input class="inp" id="t_in" placeholder="要翻译的文字" value="你好，世界"><select id="t_to" class="inp" style="max-width:120px"><option value="en">中→英</option><option value="ja">中→日</option><option value="ko">中→韩</option><option value="fr">中→法</option></select><div id="t_out" style="margin-top:10px;color:var(--txt)"></div>`,
   load:async()=>{
     const q=document.getElementById('t_in').value.trim();const to=document.getElementById('t_to').value;
     const from=to==='en'?'zh-CN':'zh-CN';
     try{const r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(q)}&langpair=${from}|${to}`);const d=await r.json();
       document.getElementById('t_out').textContent=d.responseData?d.responseData.translatedText:'翻译失败';}
     catch(e){document.getElementById('t_out').textContent='⚠ 翻译源不可用';}
   }},
];

const grid=document.getElementById('grid');
function addCard(c){
  const el=document.createElement('div');el.className='card';
  el.innerHTML=`<span class="tag">${esc(c.tag)}</span><h3>${esc(c.title)}</h3>
    <div class="body" id="body_${c.id}">${c.body||'<span class="spin"></span> 加载中…'}</div>
    <div class="foot"><button class="mini" onclick="runCard('${c.id}')">↻ 刷新</button></div>`;
  grid.appendChild(el);
}
[...TEXT_CARDS,...IMG_CARDS,...SPECIAL].forEach(addCard);

async function runText(c){
  const b=document.getElementById('body_'+c.id);
  for(const s of c.sources){
    try{const r=await fetch(s.url);const d=await r.json();const t=s.pick(d);
      b.innerHTML=`<div class="big">${esc(t)}</div>`;return;}
    catch(e){}
  }
  b.innerHTML='<span style="color:var(--err)">⚠ 该卡片接口暂不可用，稍后重试</span>';
}
async function runImg(c){
  const b=document.getElementById('body_'+c.id);
  let html='';
  c.urls.forEach((u,i)=>{html+=`<img src="${u}" style="display:${i===0?'block':'none'}" onerror="this.style.display='none';const n=this.nextElementSibling;if(n)n.style.display='block';">`;});
  b.innerHTML=html+'<span style="color:var(--err);display:none">⚠ 图片源暂不可用</span>';
  // 全部失败兜底
  setTimeout(()=>{if(!b.querySelector('img[style*="block"]'))b.querySelector('span').style.display='block';},4000);
}
async function runCard(id){
  const tc=TEXT_CARDS.find(x=>x.id===id),ic=IMG_CARDS.find(x=>x.id===id),sc=SPECIAL.find(x=>x.id===id);
  const b=document.getElementById('body_'+id);
  if(tc)return runText(tc);
  if(ic)return runImg(ic);
  if(sc){if(!sc.body)b.innerHTML='<span class="spin"></span> 加载中…';try{await sc.load(b);}catch(e){b.innerHTML='<span style="color:var(--err)">⚠ 加载失败</span>';}}
}
async function refreshAll(){for(const c of [...TEXT_CARDS,...IMG_CARDS,...SPECIAL])runCard(c.id);}
window.addEventListener('load',()=>setTimeout(refreshAll,250));
</script>
</body>
</html>
