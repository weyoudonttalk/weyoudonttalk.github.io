<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>工具箱 · MIUI 工作室</title>
<meta name="description" content="MIUI 工作室实用工具箱：Base64、时间戳、SHA 哈希、URL 编解码、字数统计，纯前端本地运算。" />
<link rel="stylesheet" href="style.css" />
<style>
  .toolbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
  .tool{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
  .tool h3{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .tool textarea,.tool input{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px;font-size:14px;outline:none;font-family:inherit;resize:vertical}
  .tool textarea:focus,.tool input:focus{border-color:var(--qq)}
  .tool .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .mini{background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:7px 14px;border-radius:20px;font-size:12.5px;cursor:pointer;transition:.2s}
  .mini:hover{border-color:var(--qq);color:var(--qq)}
  .out{margin-top:10px;font-size:13px;color:var(--sub);word-break:break-all;min-height:18px}
  .out b{color:var(--qq)}
</style>
</head>
<body>

  <div class="brand"><div class="logo">M</div>MIUI 工作室</div>

    <a href="api-hub.html">API 中心</a>

<section class="wrap">
  <div class="sec-h"><div class="ey">TOOLBOX</div><h2>实用工具箱</h2><p>全部纯前端本地运算，不联网、不传数据，墙内 100% 可用</p></div>
  <div class="toolbox">
    <!-- Base64 -->
    <div class="tool">
      <h3>🔤 Base64 编解码</h3>
      <textarea id="b64_in" rows="3" placeholder="输入文本"></textarea>
      <div class="row"><button class="mini" onclick="b64('en')">编码 →</button><button class="mini" onclick="b64('de')">← 解码</button><button class="mini" onclick="copy('b64_out')">复制</button></div>
      <div class="out" id="b64_out"></div>
    </div>
    <!-- 时间戳 -->
    <div class="tool">
      <h3>⏱️ 时间戳转换</h3>
      <input id="ts_in" placeholder="时间戳(秒/毫秒) 或 留空取当前" />
      <div class="row"><button class="mini" onclick="tsConv()">转换</button><button class="mini" onclick="copy('ts_out')">复制</button></div>
      <div class="out" id="ts_out"></div>
    </div>
    <!-- SHA -->
    <div class="tool">
      <h3>🔐 SHA 哈希</h3>
      <textarea id="sha_in" rows="3" placeholder="输入文本，本地计算哈希"></textarea>
      <div class="row"><button class="mini" onclick="sha('SHA-256')">SHA-256</button><button class="mini" onclick="sha('SHA-1')">SHA-1</button><button class="mini" onclick="copy('sha_out')">复制</button></div>
      <div class="out" id="sha_out"></div>
    </div>
    <!-- URL -->
    <div class="tool">
      <h3>🔗 URL 编解码</h3>
      <textarea id="url_in" rows="3" placeholder="输入 URL 或编码串"></textarea>
      <div class="row"><button class="mini" onclick="urlc('en')">编码 →</button><button class="mini" onclick="urlc('de')">← 解码</button><button class="mini" onclick="copy('url_out')">复制</button></div>
      <div class="out" id="url_out"></div>
    </div>
    <!-- 字数 -->
    <div class="tool">
      <h3>📝 字数统计</h3>
      <textarea id="wc_in" rows="3" placeholder="粘贴一段文字"></textarea>
      <div class="row"><button class="mini" onclick="wc()">统计</button></div>
      <div class="out" id="wc_out"></div>
    </div>
    <!-- 大小写 -->
    <div class="tool">
      <h3>🔡 大小写转换</h3>
      <textarea id="cs_in" rows="3" placeholder="输入英文"></textarea>
      <div class="row"><button class="mini" onclick="cs('up')">大写</button><button class="mini" onclick="cs('low')">小写</button><button class="mini" onclick="copy('cs_out')">复制</button></div>
      <div class="out" id="cs_out"></div>
    </div>
  </div>
</section>

<footer>
  <div>官方 QQ 群：1070470498</div>
  <div style="margin-top:8px">工具箱全部在浏览器本地运行，数据不会上传。</div>
</footer>

<script>
function copy(id){const t=document.getElementById(id).textContent;if(!t)return;navigator.clipboard.writeText(t).then(()=>toast('已复制'));}
function toast(m){const d=document.createElement('div');d.textContent=m;d.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1c2440;border:1px solid var(--line);padding:10px 20px;border-radius:30px;font-size:13px;z-index:99';document.body.appendChild(d);setTimeout(()=>d.remove(),1600);}
function b64(m){const v=document.getElementById('b64_in').value;try{document.getElementById('b64_out').innerHTML=m==='en'?'<b>'+btoa(unescape(encodeURIComponent(v)))+'</b>':'<b>'+decodeURIComponent(escape(atob(v)))+'</b>';}catch(e){document.getElementById('b64_out').textContent='⚠ '+e.message;}}
function tsConv(){const v=document.getElementById('ts_in').value.trim();let out='';if(!v){const n=Date.now();out=`当前\n秒:${Math.floor(n/1000)}\n毫秒:${n}`;}else if(/^\d{10,13}$/.test(v)){const ms=v.length===10?+v*1000:+v;out=new Date(ms).toLocaleString('zh-CN');}else{const t=Date.parse(v);out=t?Math.floor(t/1000):'无法解析';}document.getElementById('ts_out').innerHTML='<b>'+out.replace(/\n/g,'</b><br><b>')+'</b>';}
async function sha(algo){const v=document.getElementById('sha_in').value;const buf=await crypto.subtle.digest(algo,new TextEncoder().encode(v));document.getElementById('sha_out').innerHTML='<b>'+[...new Uint8Array(buf)].map(x=>x.toString(16).padStart(2,'0')).join('')+'</b>';}
function urlc(m){const v=document.getElementById('url_in').value;try{document.getElementById('url_out').innerHTML='<b>'+(m==='en'?encodeURIComponent(v):decodeURIComponent(v))+'</b>';}catch(e){document.getElementById('url_out').textContent='⚠ '+e.message;}}
function wc(){const v=document.getElementById('wc_in').value;const cn=(v.match(/[一-龥]/g)||[]).length;const en=(v.match(/[a-zA-Z]+/g)||[]).join('').length;const chars=v.replace(/\s/g,'').length;document.getElementById('wc_out').innerHTML=`<b>字符(去空白):${chars}</b> ｜ 汉字:${cn} ｜ 英文:${en} ｜ 词数(空格分):${(v.trim().match(/\S+/g)||[]).length}`;}
function cs(m){const v=document.getElementById('cs_in').value;const r=m==='up'?v.toUpperCase():v.toLowerCase();document.getElementById('cs_out').innerHTML='<b>'+r+'</b>';}
</script>
</body>
</html>
