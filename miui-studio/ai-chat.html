<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 助手 · 多引擎 · MIUI 工作室</title>
<meta name="description" content="MIUI 工作室多引擎免费 AI 聚合聊天页，内置多个免密钥/免费大模型接口。" />
<style>
  :root{
    --qq:#12B7F5; --qq-d:#0a8fd0; --bg:#0a0e1a; --bg2:#10162a;
    --card:rgba(255,255,255,.05); --line:rgba(255,255,255,.1);
    --txt:#e8edf7; --sub:#8b97b3; --ok:#3ddc84; --err:#ff6b6b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(1000px 500px at 80% -10%,rgba(18,183,245,.18),transparent),
               radial-gradient(800px 500px at 0% 100%,rgba(120,80,255,.14),transparent),var(--bg);
    color:var(--txt);display:flex;flex-direction:column;height:100vh;overflow:hidden}
  header{padding:12px 16px;border-bottom:1px solid var(--line);background:rgba(10,14,26,.6);backdrop-filter:blur(10px);flex-shrink:0}
  .top1{display:flex;align-items:center;gap:12px}
  .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--qq),#7850ff);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;box-shadow:0 0 16px rgba(18,183,245,.5)}
  .hinfo h1{font-size:16px}.hinfo .st{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
  .dot-live{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .hactions{margin-left:auto;display:flex;gap:8px}
  .hbtn{background:var(--card);border:1px solid var(--line);color:var(--sub);padding:6px 13px;border-radius:20px;font-size:12.5px;cursor:pointer;transition:.2s}
  .hbtn:hover{color:var(--txt);border-color:var(--qq)}
  /* 引擎栏 */
  .eng{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
  .eng select,.eng input{background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:7px 10px;border-radius:9px;font-size:13px;outline:none;font-family:inherit}
  .eng select:focus,.eng input:focus{border-color:var(--qq)}
  .eng input.key{width:200px}
  .eng .tag{font-size:11px;color:var(--sub)}
  .eng .tag b{color:var(--ok)}
  #log{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:15px}
  #log::-webkit-scrollbar{width:8px}#log::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px}
  .msg{display:flex;gap:10px;max-width:82%;animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .msg .mav{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
  .msg.ai .mav{background:linear-gradient(135deg,var(--qq),#7850ff);color:#fff}
  .msg.me{align-self:flex-end;flex-direction:row-reverse}
  .msg.me .mav{background:linear-gradient(135deg,#ff8a3d,#ff5d73);color:#fff}
  .bubble{padding:11px 15px;border-radius:16px;font-size:14.5px;line-height:1.65;word-break:break-word;white-space:pre-wrap}
  .msg.ai .bubble{background:var(--card);border:1px solid var(--line);border-top-left-radius:4px}
  .msg.me .bubble{background:linear-gradient(135deg,var(--qq),var(--qq-d));color:#fff;border-top-right-radius:4px}
  .typing{display:flex;gap:4px;padding:14px 16px}.typing span{width:7px;height:7px;border-radius:50%;background:var(--sub);animation:bl 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
  @keyframes bl{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
  .composer{flex-shrink:0;padding:13px 16px;border-top:1px solid var(--line);background:rgba(10,14,26,.6);display:flex;gap:10px;align-items:flex-end}
  textarea#in{flex:1;resize:none;max-height:120px;min-height:46px;background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:14px;padding:12px 14px;font-size:14.5px;outline:none;font-family:inherit;line-height:1.5}
  textarea#in:focus{border-color:var(--qq)}
  #send{background:linear-gradient(135deg,var(--qq),var(--qq-d));border:none;color:#fff;padding:0 22px;height:46px;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;transition:.2s;flex-shrink:0}
  #send:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(18,183,245,.4)}
  #send:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
  .hint{text-align:center;color:var(--sub);font-size:11.5px;padding:5px 0 0}
  a{color:var(--qq);text-decoration:none}
</style>
</head>
<body>
<header>
  <div class="top1">
    <div class="av">Q</div>
    <div class="hinfo">
      <h1>小Q · 多引擎 AI</h1>
      <div class="st"><span class="dot-live"></span><span id="modelname">就绪</span></div>
    </div>
    <div class="hactions">
      <button class="hbtn" onclick="goHome()">← 官网</button>
      <button class="hbtn" onclick="clearChat()">清空</button>
    </div>
  </div>
  <div class="eng">
    <span class="tag">引擎：</span>
    <select id="eng" onchange="onEngChange()"></select>
    <select id="model"></select>
    <input class="key" id="apikey" placeholder="免费 key（免密引擎留空）" oninput="saveKey()">
    <span class="tag" id="engtag"></span>
  </div>
</header>

<div id="log">
  <div class="msg ai"><div class="mav">Q</div><div class="bubble">👋 我是 MIUI 工作室 AI 小Q。上面切换不同免费引擎，挑一个能聊的就行～</div></div>
</div>

<div class="composer">
  <textarea id="in" placeholder="输入消息，Enter 发送，Shift+Enter 换行" onkeydown="onKey(event)"></textarea>
  <button id="send" onclick="send()">发送</button>
</div>
<div class="hint">多个免费大模型聚合 · 免密引擎直接聊 · 需 key 的填自己的免费额度 · 群 1070470498</div>

<script>
const SYS="你是 MIUI 工作室的官方 AI 助手小Q，语气活泼亲切、简洁直接，像朋友聊天。用简体中文回答，避免长篇大论。";

// ===== 多个免费 AI API 引擎 =====
const ENGINES={
  ovh:{name:'OVH Mistral（免密）',free:true,url:'https://oai.endpoints.kepler.ai.cloud.ovh.net/v1/chat/completions',
    models:['Mistral-Small-3.2-24B-Instruct-2506','gpt-oss-20b','Qwen3-32B'],hdr:()=>({}),fix:(b)=>b},
  pollinations:{name:'Pollinations（免密）',free:true,url:'https://text.pollinations.ai/openai',
    models:['openai','mistral','llama','gpt','claude','gemini'],hdr:()=>({}),fix:(b)=>b},
  groq:{name:'Groq（填免费key）',free:false,url:'https://api.groq.com/openai/v1/chat/completions',
    models:['llama3-8b-8192','mixtral-8x7b-32768','gemma2-9b-it'],hdr:(k)=>({'Authorization':'Bearer '+k}),fix:(b)=>b},
  openrouter:{name:'OpenRouter（填免费key）',free:false,url:'https://openrouter.ai/api/v1/chat/completions',
    models:['google/gemma-2-9b-it:free','meta-llama/llama-3.1-8b-instruct:free','microsoft/phi-3-mini-128k-instruct:free'],hdr:(k)=>({'Authorization':'Bearer '+k}),fix:(b)=>b},
  deepseek:{name:'DeepSeek（填免费key）',free:false,url:'https://api.deepseek.com/chat/completions',
    models:['deepseek-chat'],hdr:(k)=>({'Authorization':'Bearer '+k}),fix:(b)=>b},
};

const log=document.getElementById('log'),sendBtn=document.getElementById('send'),input=document.getElementById('in');
const engSel=document.getElementById('eng'),modelSel=document.getElementById('model'),keyIn=document.getElementById('apikey');
const DEFAULT_ENG='pollinations';
let busy=false,curEngine=DEFAULT_ENG,curModel='';

// 初始化引擎下拉
Object.keys(ENGINES).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=ENGINES[k].name;engSel.appendChild(o);});
// 迁移：旧版默认 ovh 易限流，自动切到 pollinations
let stored=localStorage.eng;
if(stored==='ovh')stored=DEFAULT_ENG;
if(stored&&ENGINES[stored])engSel.value=stored; else engSel.value=DEFAULT_ENG;
loadKey();onEngChange();

function goHome(){location.href='index.html';}
function escapeHtml(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function scroll(){log.scrollTop=log.scrollHeight;}
function onKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}

function onEngChange(){
  curEngine=engSel.value;localStorage.eng=curEngine;
  const e=ENGINES[curEngine];
  modelSel.innerHTML='';e.models.forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=m;modelSel.appendChild(o);});
  keyIn.style.display=e.free?'none':'inline-block';
  keyIn.placeholder=e.free?'免密引擎无需key':'填你的 '+e.name.split('（')[0]+' 免费key';
  document.getElementById('engtag').innerHTML=e.free?'<b>无需 key</b>':'需要 key';
  curModel=e.models[0];
}
function saveKey(){localStorage['key_'+curEngine]=keyIn.value.trim();}
function loadKey(){if(localStorage.eng&&ENGINES[localStorage.eng]){keyIn.value=localStorage['key_'+localStorage.eng]||'';}}

function addMsg(role,text){const m=document.createElement('div');m.className='msg '+role;const av=role==='me'?'你':'Q';m.innerHTML=`<div class="mav">${av}</div><div class="bubble">${escapeHtml(text)}</div>`;log.appendChild(m);scroll();return m;}
function addTyping(){const m=document.createElement('div');m.className='msg ai';m.id='typing';m.innerHTML=`<div class="mav">Q</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;log.appendChild(m);scroll();return m;}
function clearChat(){log.innerHTML='';addMsg('ai','已清空，换个引擎继续聊～');}

async function callEngine(text){
  const e=ENGINES[curEngine];curModel=modelSel.value;
  const key=keyIn.value.trim();
  if(!e.free&&!key)throw new Error('该引擎需要免费 key');
  const msgs=[{role:'system',content:SYS},{role:'user',content:text}];
  const body=e.fix({model:curModel,messages:msgs,temperature:0.7,max_tokens:800});
  const r=await fetch(e.url,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},e.hdr(key)),body:JSON.stringify(body)});
  if(!r.ok)throw new Error('HTTP '+r.status+(e.free?'':'（检查key）'));
  const d=await r.json();
  let c=d.choices?.[0]?.message?.content;
  if(!c&&d.choices?.[0]?.message?.reasoning)c=d.choices[0].message.reasoning;
  if(!c&&d.generated_text)c=d.generated_text;            // HF 兜底
  if(!c&&typeof d==='string')c=d;                          // 纯文本兜底
  if(!c)c=d.error?.message||'空返回';
  return c.replace(/<think>[\s\S]*?<\/think>/g,'');
}

async function send(){
  const text=input.value.trim();if(!text||busy)return;
  input.value='';input.style.height='46px';addMsg('me',text);
  busy=true;sendBtn.disabled=true;const t=addTyping();
  document.getElementById('modelname').textContent=curEngine+' · '+curModel;
  try{
    const ans=await callEngine(text);t.remove();addMsg('ai',ans);
  }catch(err){
    t.remove();
    addMsg('ai','⚠️ 这个引擎挂了：'+escapeHtml(err.message||err)+'\n换个引擎试试，或者群 1070470498 找我。');
  }finally{busy=false;sendBtn.disabled=false;input.focus();}
}
input.addEventListener('input',()=>{input.style.height='46px';input.style.height=Math.min(input.scrollHeight,120)+'px';});

// 启动轻量探测：成功显示就绪，失败也不报“离线”，发送时再连
(async()=>{
  try{
    await callEngine('你好');
    document.getElementById('modelname').textContent=curEngine+' · '+curModel+' 已就绪';
  }catch(e){
    document.getElementById('modelname').textContent='就绪 · 发送时自动连接';
  }
})();
</script>
</body>
</html>
