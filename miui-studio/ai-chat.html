<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 助手 · MIUI 工作室</title>
<meta name="description" content="MIUI 工作室 AI 助手：国内大模型（智谱/DeepSeek/硅基流动/通义）多引擎聚合，填免费 key 即聊。" />
<link rel="stylesheet" href="style.css" />
<style>
  html,body{height:100%}
  body{display:flex;flex-direction:column;height:100vh;overflow:hidden}
  .chatwrap{flex:1;display:flex;flex-direction:column;min-height:0}
  header.chat{padding:11px 16px;border-bottom:1px solid var(--line);background:rgba(7,10,20,.7);backdrop-filter:blur(10px);flex-shrink:0}
  .top1{display:flex;align-items:center;gap:12px}
  .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--qq),var(--pur));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;box-shadow:0 0 16px rgba(18,183,245,.5)}
  .hinfo h1{font-size:16px}.hinfo .st{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
  .dot-live{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .hactions{margin-left:auto;display:flex;gap:8px}
  .hbtn{background:var(--card);border:1px solid var(--line);color:var(--sub);padding:6px 13px;border-radius:20px;font-size:12.5px;cursor:pointer}
  .hbtn:hover{color:var(--txt);border-color:var(--qq)}
  .eng{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
  .eng select,.eng input{background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:7px 10px;border-radius:9px;font-size:13px;outline:none}
  .eng select:focus,.eng input:focus{border-color:var(--qq)}
  .eng input.key{width:220px}
  .eng .tag{font-size:11px;color:var(--sub)}
  .eng .tag b{color:var(--ok)}
  .tip{background:rgba(18,183,245,.08);border:1px solid rgba(18,183,245,.3);border-radius:12px;padding:10px 14px;margin:10px 16px 0;font-size:12.5px;color:var(--sub);line-height:1.6}
  .tip a{color:var(--qq)}
  #log{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:14px;min-height:0}
  #log::-webkit-scrollbar{width:8px}#log::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px}
  .msg{display:flex;gap:10px;max-width:82%;animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .msg .mav{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
  .msg.ai .mav{background:linear-gradient(135deg,var(--qq),var(--pur));color:#fff}
  .msg.me{align-self:flex-end;flex-direction:row-reverse}
  .msg.me .mav{background:linear-gradient(135deg,#ff8a3d,#ff5d73);color:#fff}
  .bubble{padding:11px 15px;border-radius:16px;font-size:14.5px;line-height:1.65;word-break:break-word;white-space:pre-wrap}
  .msg.ai .bubble{background:var(--card);border:1px solid var(--line);border-top-left-radius:4px}
  .msg.me .bubble{background:linear-gradient(135deg,var(--qq),var(--qq-d));color:#fff;border-top-right-radius:4px}
  .msg.ai .bubble .src{display:block;margin-top:6px;font-size:11px;color:var(--sub)}
  .typing{display:flex;gap:4px;padding:14px 16px}.typing span{width:7px;height:7px;border-radius:50%;background:var(--sub);animation:bl 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
  @keyframes bl{0%,60%,100%{opacity:.3}30%{opacity:1;transform:translateY(-4px)}}
  .composer{flex-shrink:0;padding:12px 16px;border-top:1px solid var(--line);background:rgba(7,10,20,.7);display:flex;gap:10px;align-items:flex-end}
  textarea#in{flex:1;resize:none;max-height:120px;min-height:46px;background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:14px;padding:12px 14px;font-size:14.5px;outline:none;line-height:1.5}
  textarea#in:focus{border-color:var(--qq)}
  #send{background:linear-gradient(135deg,var(--qq),var(--qq-d));border:none;color:#fff;padding:0 22px;height:46px;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;flex-shrink:0}
  #send:disabled{opacity:.5;cursor:not-allowed}
  .hint{text-align:center;color:var(--sub);font-size:11.5px;padding:5px 0 0}
  a{color:var(--qq);text-decoration:none}
</style>
</head>
<body>
<header class="chat">
  <div class="top1">
    <div class="av">Q</div>
    <div class="hinfo"><h1>小Q · 多引擎 AI</h1>
      <div class="st"><span class="dot-live"></span><span id="modelname">就绪 · 发送自动选引擎</span></div></div>
    <div class="hactions">
      <button class="hbtn" onclick="goHome()">← 官网</button>
      <button class="hbtn" onclick="clearChat()">清空</button>
    </div>
  </div>
  <div class="eng">
    <span class="tag">优先引擎：</span>
    <select id="eng" onchange="onEngChange()"></select>
    <select id="model"></select>
    <input class="key" id="apikey" placeholder="填对应平台免费 key" oninput="saveKey()">
    <span class="tag" id="engtag"></span>
  </div>
</header>

<div class="tip" id="tip">
  💡 <b>国内大模型需填免费 key（30 秒申请）</b>：推荐
  <a href="https://open.bigmodel.cn/" target="_blank">智谱 GLM-4-Flash</a>（注册→控制台复制 API Key，免费）→
  上方选「智谱」粘贴即可聊。其他可选
  <a href="https://platform.deepseek.com/" target="_blank">DeepSeek</a>、
  <a href="https://cloud.siliconflow.cn/" target="_blank">硅基流动</a>、
  <a href="https://dashscope.console.aliyun.com/" target="_blank">通义千问</a>。
  填过会存在本地，下次免填。
</div>

<div class="chatwrap">
  <div id="log">
    <div class="msg ai"><div class="mav">Q</div><div class="bubble">👋 我是 MIUI 工作室 AI 小Q。选个国内引擎、粘贴免费 key，发消息我就自动挑能用的模型回你～</div></div>
  </div>
  <div class="composer">
    <textarea id="in" placeholder="输入消息，Enter 发送，Shift+Enter 换行" onkeydown="onKey(event)"></textarea>
    <button id="send" onclick="send()">发送</button>
  </div>
  <div class="hint">多免费大模型自动降级 · 国内引擎需免费 key · 群 1070470498</div>
</div>

<script>
const SYS="你是 MIUI 工作室的官方 AI 助手小Q，语气活泼亲切、简洁直接，像朋友聊天。用简体中文回答，避免长篇大论。";

// ===== 引擎（国内为主，免密国外标"需代理"）=====
const ENGINES={
  zhipu:{name:'智谱 GLM-4-Flash（免费key）',free:false,url:'https://open.bigmodel.cn/api/paas/v4/chat/completions',
    models:['glm-4-flash','glm-4-plus'],hdr:k=>({'Authorization':'Bearer '+k}),fix:b=>b},
  deepseek:{name:'DeepSeek（免费key）',free:false,url:'https://api.deepseek.com/chat/completions',
    models:['deepseek-chat'],hdr:k=>({'Authorization':'Bearer '+k}),fix:b=>b},
  siliconflow:{name:'硅基流动 SiliconFlow（免费key）',free:false,url:'https://api.siliconflow.cn/v1/chat/completions',
    models:['Qwen/Qwen2.5-7B-Instruct','deepseek-ai/DeepSeek-V3','Qwen/Qwen2.5-14B-Instruct'],hdr:k=>({'Authorization':'Bearer '+k}),fix:b=>b},
  qwen:{name:'通义千问（免费key）',free:false,url:'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions',
    models:['qwen-plus','qwen-turbo','qwen-max'],hdr:k=>({'Authorization':'Bearer '+k}),fix:b=>b},
  moonshot:{name:'Kimi Moonshot（免费key）',free:false,url:'https://api.moonshot.cn/v1/chat/completions',
    models:['moonshot-v1-8k'],hdr:k=>({'Authorization':'Bearer '+k}),fix:b=>b},
  pollinations:{name:'Pollinations（免密·需代理）',free:true,url:'https://text.pollinations.ai/openai',
    models:['openai','mistral','llama'],hdr:()=>({}),fix:b=>b},
  ovh:{name:'OVH Mistral（免密·需代理）',free:true,url:'https://oai.endpoints.kepler.ai.cloud.ovh.net/v1/chat/completions',
    models:['Mistral-Small-3.2-24B-Instruct-2506'],hdr:()=>({}),fix:b=>b},
};
// 国内引擎（有 key 即自动尝试）优先顺序
const CN_CHAIN=['zhipu','deepseek','siliconflow','qwen','moonshot'];

const log=document.getElementById('log'),sendBtn=document.getElementById('send'),input=document.getElementById('in');
const engSel=document.getElementById('eng'),modelSel=document.getElementById('model'),keyIn=document.getElementById('apikey');
const DEFAULT_ENG='zhipu';
let busy=false,curEngine=DEFAULT_ENG,curModel='';

Object.keys(ENGINES).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=ENGINES[k].name;engSel.appendChild(o);});
let stored=localStorage.eng; engSel.value=(stored&&ENGINES[stored])?stored:DEFAULT_ENG;
loadKey();onEngChange();

function goHome(){location.href='index.html';}
function escapeHtml(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function scroll(){log.scrollTop=log.scrollHeight;}
function onKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}

function onEngChange(){
  curEngine=engSel.value;localStorage.eng=curEngine;
  const e=ENGINES[curEngine];
  modelSel.innerHTML='';e.models.forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=m;modelSel.appendChild(o);});
  keyIn.style.display=e.free?'none':'inline-block';
  keyIn.placeholder='填 '+e.name.split('（')[0]+' 的免费 key';
  document.getElementById('engtag').innerHTML=e.free?'<b>无需 key</b>':'需要 key';
  curModel=e.models[0];
}
function saveKey(){localStorage['key_'+curEngine]=keyIn.value.trim();}
function loadKey(){if(localStorage.eng&&ENGINES[localStorage.eng]){keyIn.value=localStorage['key_'+localStorage.eng]||'';}}

function addMsg(role,text,src){const m=document.createElement('div');m.className='msg '+role;const av=role==='me'?'你':'Q';
  m.innerHTML=`<div class="mav">${av}</div><div class="bubble">${escapeHtml(text)}${src?`<span class="src">via ${escapeHtml(src)}</span>`:''}</div>`;
  log.appendChild(m);scroll();return m;}
function addTyping(){const m=document.createElement('div');m.className='msg ai';m.id='typing';m.innerHTML=`<div class="mav">Q</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;log.appendChild(m);scroll();return m;}
function clearChat(){log.innerHTML='';addMsg('ai','已清空，继续聊～');}

async function callEngine(ek, model, text){
  const e=ENGINES[ek];
  const key=localStorage['key_'+ek]||'';
  if(!e.free&&!key)throw new Error('该引擎需要免费 key');
  const body=e.fix({model,messages:[{role:'system',content:SYS},{role:'user',content:text}],temperature:0.7,max_tokens:800});
  const r=await fetch(e.url,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},e.hdr(key)),body:JSON.stringify(body)});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const d=await r.json();
  let c=d.choices?.[0]?.message?.content;
  if(!c&&d.choices?.[0]?.message?.reasoning)c=d.choices[0].message.reasoning;
  if(!c&&typeof d==='string')c=d;
  if(!c)c=d.error?.message||'空返回';
  return c.replace(/<think>[\s\S]*?<\/think>/g,'');
}

function buildCandidates(){
  const list=[];const sel=engSel.value;
  if(ENGINES[sel].free||(localStorage['key_'+sel]||'').trim())list.push(sel);
  CN_CHAIN.forEach(e=>{if(!list.includes(e)&&(localStorage['key_'+e]||'').trim())list.push(e);});
  // 免密国外引擎（需代理）放最后
  ['pollinations','ovh'].forEach(e=>{if(ENGINES[e].free&&!list.includes(e))list.push(e);});
  return list;
}

async function send(){
  const text=input.value.trim();if(!text||busy)return;
  input.value='';input.style.height='46px';addMsg('me',text);
  busy=true;sendBtn.disabled=true;const t=addTyping();
  document.getElementById('modelname').textContent='正在选择可用引擎…';
  const cands=buildCandidates();
  let ans=null,used=null,lastErr=null;
  if(cands.length===0){
    t.remove();
    addMsg('ai','⚠️ 还没有任何可用引擎。请在上方选一个国内引擎（推荐智谱），去对应平台申请免费 key 粘贴进来，就能聊了。\n申请入口见上方提示框。');
    busy=false;sendBtn.disabled=false;input.focus();return;
  }
  for(const ek of cands){
    try{const mk=ENGINES[ek].models[0];ans=await callEngine(ek,mk,text);used=ek;break;}
    catch(err){lastErr=err;continue;}
  }
  t.remove();
  if(ans){const label=ENGINES[used].name.split('（')[0];addMsg('ai',ans,label);document.getElementById('modelname').textContent='已用：'+label;}
  else{addMsg('ai','⚠️ 试了一圈都没连上（'+(lastErr?escapeHtml(lastErr.message):'未知')+'）。\n检查 key 是否正确，或换个引擎；群 1070470498 也能帮你。');document.getElementById('modelname').textContent='全部引擎暂不可用';}
  busy=false;sendBtn.disabled=false;input.focus();
}
input.addEventListener('input',()=>{input.style.height='46px';input.style.height=Math.min(input.scrollHeight,120)+'px';});
</script>
</body>
</html>
