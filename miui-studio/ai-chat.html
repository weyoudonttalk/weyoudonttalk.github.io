<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 助手 · MIUI 工作室</title>
<meta name="description" content="MIUI 工作室官方 AI 助手，由免密钥大模型驱动，即开即聊。" />
<style>
  :root{
    --qq:#12B7F5; --qq-d:#0a8fd0; --bg:#0a0e1a; --bg2:#10162a;
    --card:rgba(255,255,255,.05); --line:rgba(255,255,255,.1);
    --txt:#e8edf7; --sub:#8b97b3; --ok:#3ddc84; --err:#ff6b6b; --me:#12B7F5;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(1000px 500px at 80% -10%,rgba(18,183,245,.18),transparent),
               radial-gradient(800px 500px at 0% 100%,rgba(120,80,255,.14),transparent),var(--bg);
    color:var(--txt);display:flex;flex-direction:column;height:100vh;overflow:hidden
  }
  header{
    padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;
    background:rgba(10,14,26,.6);backdrop-filter:blur(10px);flex-shrink:0
  }
  .av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--qq),#7850ff);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;box-shadow:0 0 16px rgba(18,183,245,.5)}
  .hinfo h1{font-size:17px}
  .hinfo .st{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
  .dot-live{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .hactions{margin-left:auto;display:flex;gap:8px}
  .hbtn{background:var(--card);border:1px solid var(--line);color:var(--sub);padding:7px 14px;border-radius:20px;font-size:13px;cursor:pointer;transition:.2s}
  .hbtn:hover{color:var(--txt);border-color:var(--qq)}
  #log{flex:1;overflow-y:auto;padding:22px 16px;display:flex;flex-direction:column;gap:16px}
  #log::-webkit-scrollbar{width:8px}
  #log::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px}
  .msg{display:flex;gap:10px;max-width:80%;animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .msg .mav{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
  .msg.ai .mav{background:linear-gradient(135deg,var(--qq),#7850ff)}
  .msg.me{align-self:flex-end;flex-direction:row-reverse}
  .msg.me .mav{background:linear-gradient(135deg,#ff8a3d,#ff5d73);color:#fff}
  .bubble{padding:11px 15px;border-radius:16px;font-size:14.5px;line-height:1.65;word-break:break-word;white-space:pre-wrap}
  .msg.ai .bubble{background:var(--card);border:1px solid var(--line);border-top-left-radius:4px}
  .msg.me .bubble{background:linear-gradient(135deg,var(--me),var(--qq-d));color:#fff;border-top-right-radius:4px}
  .typing{display:flex;gap:4px;padding:14px 16px}
  .typing span{width:7px;height:7px;border-radius:50%;background:var(--sub);animation:bl 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
  @keyframes bl{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
  .composer{flex-shrink:0;padding:14px 16px;border-top:1px solid var(--line);background:rgba(10,14,26,.6);display:flex;gap:10px;align-items:flex-end}
  textarea#in{
    flex:1;resize:none;max-height:120px;min-height:46px;background:var(--bg2);border:1px solid var(--line);
    color:var(--txt);border-radius:14px;padding:12px 14px;font-size:14.5px;outline:none;font-family:inherit;line-height:1.5
  }
  textarea#in:focus{border-color:var(--qq)}
  #send{background:linear-gradient(135deg,var(--qq),var(--qq-d));border:none;color:#fff;padding:0 22px;height:46px;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;transition:.2s;flex-shrink:0}
  #send:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(18,183,245,.4)}
  #send:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
  .hint{text-align:center;color:var(--sub);font-size:12px;padding:6px 0 0}
  a{color:var(--qq);text-decoration:none}
</style>
</head>
<body>
<header>
  <div class="av">Q</div>
  <div class="hinfo">
    <h1>小Q · AI 助手</h1>
    <div class="st"><span class="dot-live"></span><span id="modelname">连接中…</span></div>
  </div>
  <div class="hactions">
    <button class="hbtn" onclick="goHome()">← 返回官网</button>
    <button class="hbtn" onclick="clearChat()">清空对话</button>
  </div>
</header>

<div id="log">
  <div class="msg ai">
    <div class="mav">Q</div>
    <div class="bubble">👋 嗨！我是 MIUI 工作室的 AI 助手小Q。有什么想聊的、想问的，直接发我就行～</div>
  </div>
</div>

<div class="composer">
  <textarea id="in" placeholder="输入消息，Enter 发送，Shift+Enter 换行" onkeydown="onKey(event)"></textarea>
  <button id="send" onclick="send()">发送</button>
</div>
<div class="hint">由免费大模型驱动 · 无需登录 · 官方 QQ 群 1070470498</div>

<script>
const API="https://oai.endpoints.kepler.ai.cloud.ovh.net/v1/chat/completions";
const MODELS=["Mistral-Small-3.2-24B-Instruct-2506","gpt-oss-20b","Qwen3-32B"];
const SYS="你是 MIUI 工作室的官方 AI 助手小Q，语气活泼亲切、简洁直接，像朋友聊天。回答用简体中文，避免长篇大论。";
let busy=false, curModel="";

const log=document.getElementById('log');
const sendBtn=document.getElementById('send');
const input=document.getElementById('in');

function goHome(){location.href="index.html";}
function escapeHtml(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function scroll(){log.scrollTop=log.scrollHeight;}
function onKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}
function clearChat(){log.innerHTML='';addMsg('ai','已清空，我们重新开始吧～');}

function addMsg(role,text){
  const m=document.createElement('div');m.className='msg '+role;
  const av=role==='me'?'你':'Q';
  m.innerHTML=`<div class="mav">${av}</div><div class="bubble">${escapeHtml(text)}</div>`;
  log.appendChild(m);scroll();return m;
}
function addTyping(){
  const m=document.createElement('div');m.className='msg ai';m.id='typing';
  m.innerHTML=`<div class="mav">Q</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  log.appendChild(m);scroll();return m;
}

async function callAI(messages){
  let lastErr=null;
  for(const model of MODELS){
    curModel=model;
    try{
      const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model,temperature:0.7,max_tokens:800,messages})});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const d=await r.json();
      let c=d.choices?.[0]?.message?.content;
      if(!c&&d.choices?.[0]?.message?.reasoning)c=d.choices[0].message.reasoning;
      if(!c)c=d.error?.message;
      if(c)return {text:c.replace(/<think>[\s\S]*?<\/think>/g,''),model};
    }catch(e){lastErr=e;continue;}
  }
  throw lastErr||new Error('所有模型均不可用');
}

async function send(){
  const text=input.value.trim();if(!text||busy)return;
  input.value='';input.style.height='46px';
  addMsg('me',text);
  busy=true;sendBtn.disabled=true;
  const t=addTyping();
  const messages=[{role:'system',content:SYS},{role:'user',content:text}];
  try{
    const {text:ans,model}=await callAI(messages);
    document.getElementById('modelname').textContent='模型：'+model;
    t.remove();addMsg('ai',ans);
  }catch(e){
    t.remove();
    addMsg('ai','⚠️ 暂时连不上模型了（'+escapeHtml(e.message||e)+'）。稍等几秒再试，或者去 QQ 群 1070470498 找我～');
  }finally{busy=false;sendBtn.disabled=false;input.focus();}
}

// 自适应高度
input.addEventListener('input',()=>{input.style.height='46px';input.style.height=Math.min(input.scrollHeight,120)+'px';});

// 启动探测可用模型
(async()=>{
  try{
    const {model}=await callAI([{role:'system',content:SYS},{role:'user',content:'ping'}]);
    document.getElementById('modelname').textContent='模型：'+model;
  }catch(e){
    document.getElementById('modelname').textContent='当前离线，可重试';
  }
})();
</script>
</body>
</html>
