<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>MIUI TRACKER · 工作室追踪器</title>
<meta name="description" content="MIUI工作室官方追踪器：像素风全球地图，追踪25人团队与AI小Q信号，活动日志、任务情报、上报目击。">
<style>
/* =================================================================
   MIUI TRACKER — 像素风复古追踪器
   完整复刻 Spidey Tracker 交互结构：
   欢迎引导 → 设置 → 创始人寄语 → 初始化地图 → 主界面
   ================================================================= */
:root{
  --bg:#0a0a12; --bg2:#101020; --bg3:#151528; --panel:#181830; --panel2:#1d1d38;
  --line:#28284a; --line2:#333360;
  --orange:#ff6a00; --orange2:#ff8c3a; --amber:#ffb020;
  --cyan:#00c8ff; --green:#2bd97c; --yellow:#ffd23f; --red:#ff3b5c;
  --blue:#4a7dff;
  --txt:#eef0f6; --dim:#9a9ab8; --faint:#5c5c82;
  --pix:4px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Courier New','Lucida Console','PingFang SC','Microsoft YaHei',monospace;
  background:var(--bg); color:var(--txt); overflow:hidden;
  height:100vh; width:100vw; position:fixed; inset:0;
  user-select:none; -webkit-user-select:none;
  image-rendering:pixelated;
}
button{font-family:inherit}
#app{position:relative;width:100%;height:100%}

/* 像素扫描线 + 暗角 */
.scanlines{position:fixed;inset:0;pointer-events:none;z-index:900;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);opacity:.45}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:901;
  background:radial-gradient(120% 100% at 50% 42%,transparent 55%,rgba(0,0,0,.6) 100%)}
.crt{position:fixed;inset:0;pointer-events:none;z-index:902;
  background:linear-gradient(180deg,rgba(255,255,255,.03),transparent 50%,rgba(0,0,0,.05))}

/* =================================================================
   覆盖层（引导 / 设置 / 创始人寄语 / 初始化）
   ================================================================= */
.overlay{position:absolute;inset:0;z-index:800;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1000px 620px at 50% 34%,#191228,#08080f);transition:opacity .45s}
.overlay.hide{opacity:0;pointer-events:none}
.overlay .inner{text-align:center;padding:30px;max-width:640px;width:100%}

/* 欢迎屏 */
#welcome .logo{width:92px;height:92px;margin:0 auto 22px;background:linear-gradient(135deg,var(--orange),var(--amber));
  display:grid;place-items:center;font-size:44px;box-shadow:0 0 0 4px #000,0 0 46px rgba(255,106,0,.6)}
#welcome h1{font-size:30px;letter-spacing:5px;color:#fff;text-shadow:0 0 22px rgba(0,200,255,.65);margin-bottom:8px}
#welcome .sub{font-size:12px;color:var(--cyan);letter-spacing:3px;margin-bottom:22px}
#welcome .hint{font-size:13px;color:var(--dim);line-height:2;margin-bottom:30px}
#welcome .hint b{color:var(--amber)}
.mbtn{display:block;width:100%;max-width:420px;margin:10px auto;padding:16px 20px;cursor:pointer;
  border:2px solid var(--line2);background:var(--bg2);color:var(--txt);font-size:13px;letter-spacing:2px;
  transition:.18s;position:relative}
.mbtn.primary{background:linear-gradient(135deg,var(--orange),var(--amber));border-color:transparent;color:#fff;
  font-weight:700;box-shadow:0 6px 24px rgba(255,106,0,.35)}
.mbtn:hover{border-color:var(--orange);transform:translateY(-2px)}
.mbtn.primary:hover{box-shadow:0 10px 32px rgba(255,106,0,.5)}
.mbtn .arrow{position:absolute;right:16px;top:50%;transform:translateY(-50%)}

/* 设置屏 */
#settings h2{font-size:20px;letter-spacing:3px;color:#fff;margin-bottom:6px}
#settings .sub{font-size:11px;color:var(--dim);letter-spacing:2px;margin-bottom:26px}
.setgroup{text-align:left;margin-bottom:20px}
.setgroup .gl{font-size:11px;color:var(--cyan);letter-spacing:2px;margin-bottom:10px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;
  border:1px solid var(--line);background:var(--bg2);padding:13px 16px;margin-bottom:8px;cursor:pointer}
.setrow .lb{font-size:13px;letter-spacing:1px}
.setrow .lb small{display:block;font-size:10px;color:var(--faint);margin-top:3px;letter-spacing:0}
.switch{width:46px;height:24px;border-radius:12px;background:#23233c;position:relative;flex:none;transition:.2s;border:1px solid var(--line2)}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#666;transition:.2s}
.setrow.on .switch{background:var(--orange);border-color:var(--orange)}
.setrow.on .switch::after{left:24px;background:#fff}

/* 创始人寄语（伪视频） */
#ceo .videobox{width:100%;max-width:480px;margin:0 auto;aspect-ratio:16/10;background:#050508;position:relative;
  border:2px solid var(--line2);overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.6)}
#ceo .avatar{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#ceo .pixface{width:150px;height:150px;image-rendering:pixelated;display:grid;
  grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(12,1fr);gap:0;
  background:transparent;box-shadow:0 0 40px rgba(0,200,255,.15)}
#ceo .videobox .wave{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:3px;align-items:flex-end;height:26px}
#ceo .videobox .wave i{width:4px;background:var(--cyan);animation:wave .5s infinite ease-in-out;display:block}
#ceo .videobox .wave i:nth-child(1){height:8px;animation-delay:0s}
#ceo .videobox .wave i:nth-child(2){height:18px;animation-delay:.1s}
#ceo .videobox .wave i:nth-child(3){height:26px;animation-delay:.2s}
#ceo .videobox .wave i:nth-child(4){height:14px;animation-delay:.3s}
#ceo .videobox .wave i:nth-child(5){height:22px;animation-delay:.15s}
#ceo .videobox .wave i:nth-child(6){height:10px;animation-delay:.25s}
#ceo .videobox .wave i:nth-child(7){height:20px;animation-delay:.05s}
@keyframes wave{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
#ceo .caption{max-width:480px;margin:14px auto 0;font-size:13px;color:var(--dim);line-height:1.9;min-height:100px;text-align:left}
#ceo .caption .cursor{display:inline-block;width:8px;height:14px;background:var(--orange);vertical-align:-2px;animation:blink 1s steps(1) infinite}
#ceo .ctrl{display:flex;gap:10px;justify-content:center;margin-top:10px}
.minibtn{padding:10px 22px;border:2px solid var(--line2);background:var(--bg2);color:var(--txt);
  font-size:11px;letter-spacing:2px;cursor:pointer}
.minibtn:hover{border-color:var(--cyan);color:var(--cyan)}

/* 初始化 */
#init .barwrap{width:100%;max-width:420px;margin:20px auto;height:22px;border:2px solid var(--line2);
  background:var(--bg2);position:relative;overflow:hidden}
#init .bar{height:100%;background:linear-gradient(90deg,var(--orange),var(--amber));width:0;transition:width .1s}
#init .pct{font-size:14px;color:var(--cyan);letter-spacing:2px;margin-top:12px}
#init .log{font-size:11px;color:var(--faint);letter-spacing:1px;margin-top:16px;line-height:2}
#init h2{font-size:18px;letter-spacing:4px;color:#fff;margin-bottom:6px}

@keyframes blink{50%{opacity:0}}

/* =================================================================
   主界面
   ================================================================= */
.topbar{position:absolute;top:0;left:0;right:0;z-index:300;display:flex;align-items:center;
  justify-content:space-between;padding:11px 14px;
  background:linear-gradient(180deg,rgba(10,10,18,.96),rgba(10,10,18,0))}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.brand .logo{width:36px;height:36px;background:linear-gradient(135deg,var(--orange),var(--amber));
  display:grid;place-items:center;font-size:17px;box-shadow:0 0 0 2px #000,0 0 16px rgba(255,106,0,.5)}
.brand .tt h1{font-size:14px;letter-spacing:2px;font-weight:800;color:#fff;text-shadow:0 0 10px rgba(0,200,255,.5)}
.brand .tt small{font-size:9px;color:var(--cyan);letter-spacing:2px}
.topbtns{display:flex;gap:7px;align-items:center}
.tbtn{min-width:36px;height:36px;padding:0 10px;border:1px solid var(--line2);background:var(--bg2);color:var(--dim);
  display:grid;place-items:center;cursor:pointer;font-size:15px;transition:.15s;position:relative;letter-spacing:1px;font-family:inherit}
.tbtn:hover,.tbtn.on{border-color:var(--orange);color:var(--orange)}
.tbtn.lbl{font-size:10px;gap:4px;display:flex;align-items:center}
.tbtn .dot{position:absolute;top:5px;right:5px;width:5px;height:5px;background:var(--red);display:none}
.tbtn .dot.show{display:block;animation:blink 1s infinite}

#mapwrap{position:absolute;inset:0;z-index:10;cursor:grab;touch-action:none;overflow:hidden}
#mapwrap.grab{cursor:grabbing}
#map{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);image-rendering:pixelated}

/* 滤镜 */
.filters{position:absolute;top:70px;left:14px;z-index:150;display:flex;flex-direction:column;gap:6px}
.filter{display:flex;align-items:center;gap:10px;background:rgba(10,10,20,.8);border:1px solid var(--line);
  padding:8px 12px;cursor:pointer;font-size:11px;letter-spacing:1px;color:var(--dim);backdrop-filter:blur(4px);transition:.15s}
.filter .sw{width:30px;height:16px;border-radius:10px;background:#222;position:relative;transition:.2s;flex:none}
.filter .sw::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#555;transition:.2s}
.filter.on{color:var(--txt);border-color:var(--line2)}
.filter.c.on .sw{background:var(--orange)} .filter.c.on .sw::after{left:16px;background:#fff}
.filter.r.on .sw{background:var(--yellow)} .filter.r.on .sw::after{left:16px;background:#fff}
.filter.e.on .sw{background:var(--red)} .filter.e.on .sw::after{left:16px;background:#fff}

/* 图例 */
.legend{position:absolute;bottom:14px;left:14px;z-index:150;display:flex;gap:14px;flex-wrap:wrap;
  background:rgba(10,10,20,.8);border:1px solid var(--line);padding:8px 13px;backdrop-filter:blur(4px)}
.legend span{font-size:10px;color:var(--dim);letter-spacing:1px}
.legend i{display:inline-block;width:8px;height:8px;margin-right:5px;vertical-align:middle}
.legend .c i{background:var(--orange);box-shadow:0 0 8px var(--orange)}
.legend .r i{background:var(--yellow);box-shadow:0 0 8px var(--yellow)}
.legend .e i{background:var(--red);box-shadow:0 0 8px var(--red)}

/* =================================================================
   活动日志（右侧滑出）—— 官方核心
   ================================================================= */
.activity{position:absolute;top:0;right:0;bottom:0;width:min(380px,92vw);z-index:500;
  background:var(--bg2);border-left:1px solid var(--line2);transform:translateX(105%);
  transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.5)}
.activity.open{transform:translateX(0)}
.activity .head{display:flex;align-items:center;justify-content:space-between;padding:15px 17px;border-bottom:1px solid var(--line)}
.activity .head h2{font-size:13px;letter-spacing:3px;color:var(--cyan);text-shadow:0 0 10px rgba(0,200,255,.4)}
.activity .head .x{width:30px;height:30px;border:1px solid var(--line2);background:none;color:var(--dim);cursor:pointer;font-size:16px;display:grid;place-items:center}
.activity .head .x:hover{color:var(--red);border-color:var(--red)}
.activity .subhead{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.achip{font-size:9px;letter-spacing:1px;padding:4px 10px;border:1px solid var(--line2);color:var(--dim);cursor:pointer}
.achip.on{color:#fff}
.achip.cc.on{background:var(--orange);border-color:var(--orange)}
.achip.cr.on{background:var(--yellow);border-color:var(--yellow);color:#000}
.achip.ce.on{background:var(--red);border-color:var(--red)}
.activity .list{flex:1;overflow-y:auto;padding:6px 0;-webkit-overflow-scrolling:touch}
.activity .list::-webkit-scrollbar{width:4px}
.activity .list::-webkit-scrollbar-thumb{background:var(--line2)}
.entry{display:flex;gap:12px;padding:13px 16px;cursor:pointer;border-left:3px solid transparent;transition:.15s;border-bottom:1px solid rgba(40,40,74,.4)}
.entry:hover{background:var(--bg3)}
.entry.act{border-left-color:var(--orange);background:var(--bg3)}
.entry .badge{flex:none;width:9px;height:9px;margin-top:4px;background:var(--orange);box-shadow:0 0 8px var(--orange)}
.entry.r .badge{background:var(--yellow);box-shadow:0 0 8px var(--yellow)}
.entry.e .badge{background:var(--red);box-shadow:0 0 8px var(--red)}
.entry .meta{flex:1;min-width:0}
.entry .tag{font-size:8px;letter-spacing:1px;color:var(--cyan);margin-bottom:3px}
.entry.r .tag{color:var(--yellow)}
.entry.e .tag{color:var(--red)}
.entry .title{font-size:12px;line-height:1.45;color:var(--txt)}
.entry .date{font-size:9px;color:var(--faint);margin-top:3px;letter-spacing:1px}
.activity .foot{padding:12px;border-top:1px solid var(--line)}
.activity .foot .mbtn{max-width:none;padding:12px;font-size:11px;margin:0}

/* =================================================================
   任务情报（Web Watch 仿制）—— 右侧滑出
   ================================================================= */
.webwatch{position:absolute;top:0;right:0;bottom:0;width:min(400px,94vw);z-index:510;
  background:var(--bg2);border-left:1px solid var(--line2);transform:translateX(105%);
  transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.5)}
.webwatch.open{transform:translateX(0)}
.webwatch .head{display:flex;align-items:center;justify-content:space-between;padding:15px 17px;border-bottom:1px solid var(--line)}
.webwatch .head h2{font-size:13px;letter-spacing:3px;color:var(--red);text-shadow:0 0 10px rgba(255,59,92,.4)}
.webwatch .head .x{width:30px;height:30px;border:1px solid var(--line2);background:none;color:var(--dim);cursor:pointer;font-size:16px;display:grid;place-items:center}
.webwatch .head .x:hover{color:var(--red);border-color:var(--red)}
.webwatch .list{flex:1;overflow-y:auto;padding:12px 14px}
.ww{display:flex;gap:12px;border:1px solid var(--line);background:var(--panel);padding:14px;margin-bottom:10px;cursor:pointer;transition:.15s}
.ww:hover{border-color:var(--red)}
.ww .icon{flex:none;width:42px;height:42px;background:var(--bg3);border:1px solid var(--line2);display:grid;place-items:center;font-size:20px;image-rendering:pixelated}
.ww .info{flex:1}
.ww .info h3{font-size:13px;margin-bottom:3px;letter-spacing:1px}
.ww .info .status{font-size:9px;letter-spacing:1px;color:var(--red);margin-bottom:5px}
.ww .info p{font-size:11px;color:var(--dim);line-height:1.6}

/* =================================================================
   信号详情弹窗（底部卡片）
   ================================================================= */
#sigModal{position:absolute;inset:0;z-index:600;display:none;align-items:flex-end;justify-content:center;padding:0 14px 16px}
#sigModal.show{display:flex}
#sigModal .m{background:var(--panel2);border:1px solid var(--line2);border-top:3px solid var(--orange);
  width:min(420px,100%);padding:18px;box-shadow:0 8px 44px rgba(0,0,0,.65);animation:rise .25s}
@keyframes rise{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
#sigModal .m .x{float:right;color:var(--dim);cursor:pointer;font-size:20px;line-height:1}
#sigModal .m .x:hover{color:var(--red)}
#sigModal .m .tag{font-size:9px;letter-spacing:2px;color:var(--cyan);margin-bottom:4px}
#sigModal .m h3{font-size:16px;margin-bottom:4px;letter-spacing:1px}
#sigModal .m .sub{font-size:10px;color:var(--faint);letter-spacing:1px;margin-bottom:12px}
#sigModal .m p{font-size:13px;color:var(--dim);line-height:1.8}

/* =================================================================
   上报表单
   ================================================================= */
#reportModal{position:absolute;inset:0;z-index:620;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(4,4,10,.85)}
#reportModal.show{display:flex}
#reportModal .box{background:var(--panel);border:2px solid var(--line2);width:min(430px,100%);padding:22px;position:relative;box-shadow:0 12px 50px rgba(0,0,0,.6)}
#reportModal .x{position:absolute;top:10px;right:14px;color:var(--dim);cursor:pointer;font-size:22px}
#reportModal .x:hover{color:var(--red)}
#reportModal h3{font-size:15px;letter-spacing:2px;margin-bottom:4px}
#reportModal .sub{font-size:11px;color:var(--dim);margin-bottom:18px;letter-spacing:1px}
.field{margin-bottom:13px}
.field label{display:block;font-size:10px;color:var(--dim);letter-spacing:1px;margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;background:var(--bg3);border:1px solid var(--line2);color:var(--txt);
  padding:11px 13px;font-size:13px;outline:none;font-family:inherit}
.field input:focus,.field textarea:focus{border-color:var(--orange)}
.field textarea{resize:vertical;min-height:70px}
.submit{width:100%;padding:13px;background:linear-gradient(135deg,var(--orange),var(--amber));border:none;color:#fff;
  font-size:14px;letter-spacing:2px;cursor:pointer;font-family:inherit}
.submit:hover{filter:brightness(1.1)}
</style>
</head>
<body>
<div id="app">
  <div class="scanlines"></div>
  <div class="vignette"></div>
  <div class="crt"></div>

  <!-- ================= 主界面 ================= -->
  <div id="mapwrap">
    <canvas id="map" width="1600" height="680"></canvas>
    <div class="filters" id="filters"></div>
    <div class="legend">
      <span class="c"><i></i>已确认</span>
      <span class="r"><i></i>传闻</span>
      <span class="e"><i></i>事件</span>
    </div>
  </div>

  <div class="topbar">
    <div class="brand" onclick="resetView()">
      <div class="logo">M</div>
      <div class="tt"><h1>MIUI TRACKER</h1><small>工作室追踪器 · 全球信号</small></div>
    </div>
    <div class="topbtns">
      <button class="tbtn" id="soundBtn" onclick="toggleSound()">🔊</button>
      <button class="tbtn lbl" onclick="openActivity()">📜 活动日志</button>
      <button class="tbtn lbl" onclick="openWebWatch()">🕸️ 任务情报</button>
      <button class="tbtn lbl" onclick="openReport()">📡 上报</button>
      <a class="tbtn" href="index.html" style="text-decoration:none">✕</a>
    </div>
  </div>

  <!-- 活动日志 -->
  <div class="activity" id="activity">
    <div class="head"><h2>📜 活动日志</h2><button class="x" onclick="closeActivity()">✕</button></div>
    <div class="subhead" id="activityFilter"></div>
    <div class="list" id="activityList"></div>
    <div class="foot"><button class="mbtn primary" onclick="focusLatest()">回到最新信号 ⌖</button></div>
  </div>

  <!-- 任务情报 -->
  <div class="webwatch" id="webwatch">
    <div class="head"><h2>🕸️ 任务情报</h2><button class="x" onclick="closeWebWatch()">✕</button></div>
    <div class="list" id="wwList"></div>
  </div>

  <!-- 信号详情 -->
  <div id="sigModal" onclick="if(event.target===this)closeSig()">
    <div class="m">
      <span class="x" onclick="closeSig()">✕</span>
      <div class="tag" id="sigTag"></div>
      <h3 id="sigTitle"></h3>
      <div class="sub" id="sigSub"></div>
      <p id="sigBody"></p>
    </div>
  </div>

  <!-- 上报 -->
  <div id="reportModal" onclick="if(event.target===this)closeReport()">
    <div class="box">
      <span class="x" onclick="closeReport()">✕</span>
      <h3>📡 上报信号</h3>
      <div class="sub">发现成员 / 小Q / 产品动态？上报后就会出现在地图上</div>
      <div class="field"><label>信号类型</label>
        <select id="rType">
          <option value="rumored">传闻信号（成员活跃）</option>
          <option value="confirmed">已确认信号</option>
        </select>
      </div>
      <div class="field"><label>城市</label><input id="rCity" placeholder="例如：成都"></div>
      <div class="field"><label>描述</label><textarea id="rDesc" placeholder="描述你看到的情况…"></textarea></div>
      <button class="submit" onclick="submitReport()">提交情报</button>
    </div>
  </div>

  <!-- ================= 覆盖层 ================= -->

  <!-- 欢迎 -->
  <div class="overlay" id="welcome">
    <div class="inner">
      <div class="logo">M</div>
      <h1>MIUI TRACKER</h1>
      <div class="sub">工作室追踪器 · 全球信号</div>
      <div class="hint">
        与地图互动，查看 <b>MIUI工作室 25 人团队</b> 与 <b>AI 小Q</b> 在全球的信号。<br>
        追踪已确认动态、传闻情报与里程碑事件。
      </div>
      <button class="mbtn primary" onclick="goSettings()">选择设置并开始追踪 <span class="arrow">▶</span></button>
      <button class="mbtn" onclick="goCeo()">观看创始人寄语 <span class="arrow">▶</span></button>

/* =================================================================
   二、音效系统（Web Audio — 8-bit 复古音效）
   ================================================================= */
let AC=null, soundOn=true;
function audio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function beep(freq,dur,type='square',vol=.08){
  if(!soundOn) return;
  const ac=audio(); if(!ac) return;
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.value=vol;
  g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime+dur);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime+dur);
}
function sfxClick(){ beep(880,.06,'square',.06); }
function sfxOpen(){ beep(440,.08,'square',.06); beep(660,.08,'square',.06); }
function sfxPing(){ beep(1200,.05,'square',.05); beep(1600,.08,'square',.05); }

/* =================================================================
   三、地图渲染
   ================================================================= */
const canvas=document.getElementById('map');
const ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
const off=document.createElement('canvas'); off.width=W; off.height=H;
const octx=off.getContext('2d');

function px(lon){return (lon+180)/360*W;}
function py(lat){return (90-lat)/180*H;}

function drawBase(){
  const cell=4;
  octx.fillStyle='#06060d'; octx.fillRect(0,0,W,H);
  for(let y=0;y<H;y+=cell){
    for(let x=0;x<W;x+=cell){
      const lon=x/W*360-180, lat=90-y/H*180;
      if(isLand(lon,lat)){
        const v=(Math.sin(x*.55+y*.4)*8+46)|0;
        octx.fillStyle=`rgb(${v},${v+6},${v+2})`;
        octx.fillRect(x,y,cell,cell);
      }
    }
  }
  octx.strokeStyle='rgba(0,200,255,.07)';
  for(let x=0;x<=W;x+=cell*6){octx.beginPath();octx.moveTo(x,0);octx.lineTo(x,H);octx.stroke();}
  for(let y=0;y<=H;y+=cell*6){octx.beginPath();octx.moveTo(0,y);octx.lineTo(W,y);octx.stroke();}
  octx.strokeStyle='#28284a'; octx.lineWidth=2; octx.strokeRect(0,0,W,H);
}

const COLORS={confirmed:'#ff8c3a',rumored:'#ffd23f',event:'#ff3b5c'};
let reports=JSON.parse(localStorage.getItem('miui_reports2')||'[]');
function allSignals(){return SIGNALS.concat(reports.map(r=>({t:r.t,city:r.city,lat:r.lat,lon:r.lon,title:'上报·'+r.city,sub:'玩家上报信号',desc:r.desc,date:new Date().toISOString().slice(0,10)})));}

let scale=1,offX=0,offY=0,dragging=false,lastX=0,lastY=0,moved=false,tick=0;
let focusTarget=null;

function render(){
  tick+=0.03;
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(W/2+offX,H/2+offY);
  ctx.scale(scale,scale);
  ctx.translate(-W/2,-H/2);
  ctx.drawImage(off,0,0);
  // 雷达扫描
  const sw=(tick*34)%W;
  const g=ctx.createLinearGradient(sw-70,0,sw+70,0);
  g.addColorStop(0,'rgba(0,200,255,0)'); g.addColorStop(.5,'rgba(0,200,255,.10)'); g.addColorStop(1,'rgba(0,200,255,0)');
  ctx.fillStyle=g; ctx.fillRect(sw-70,0,140,H);
  // 信号点
  allSignals().forEach((s,i)=>{
    if(!filters[s.t])return;
    const x=px(s.lon),y=py(s.lat);
    const col=COLORS[s.t];
    const blink=.45+.55*Math.sin(tick*3+i*1.7);
    const isFocus=focusTarget&&focusTarget.lon===s.lon&&focusTarget.lat===s.lat;
    ctx.save();
    ctx.shadowColor=col; ctx.shadowBlur=isFocus?24:12;
    if(isFocus){
      ctx.strokeStyle=col; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(x,y,14+Math.sin(tick*5)*3,0,Math.PI*2); ctx.stroke();
    }
    ctx.fillStyle=col; ctx.globalAlpha=.5+.5*blink;
    const sz=s.t==='event'?8:7;
    ctx.fillRect(x-sz/2,y-sz/2,sz,sz);
    ctx.globalAlpha=1;
    if(blink>.82){ctx.fillStyle='#fff';ctx.fillRect(x-1,y-1,2,2);}
    ctx.restore();
  });
  ctx.restore();
  requestAnimationFrame(render);
}

/* =================================================================
   四、交互：拖拽 / 缩放 / 点击
   ================================================================= */
const wrap=document.getElementById('mapwrap');
wrap.addEventListener('pointerdown',e=>{dragging=true;moved=false;lastX=e.clientX;lastY=e.clientY;wrap.classList.add('grab');});
window.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const dx=e.clientX-lastX,dy=e.clientY-lastY;
  offX+=dx;offY+=dy;lastX=e.clientX;lastY=e.clientY;
  if(Math.abs(dx)+Math.abs(dy)>2)moved=true;
});
window.addEventListener('pointerup',()=>{dragging=false;wrap.classList.remove('grab');});
wrap.addEventListener('click',e=>{
  if(moved){moved=false;return;}
  const r=canvas.getBoundingClientRect();
  const mx=((e.clientX-r.left)-W/2-offX)/scale+W/2;
  const my=((e.clientY-r.top)-H/2-offY)/scale+H/2;
  let best=null,bd=30/scale;
  allSignals().forEach(s=>{
    if(!filters[s.t])return;
    const d=Math.hypot(px(s.lon)-mx,py(s.lat)-my);
    if(d<bd){bd=d;best=s;}
  });
  if(best){sfxPing();openSig(best);}
});
wrap.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.12:.89);},{passive:false});
let pinch=0;
wrap.addEventListener('touchstart',e=>{if(e.touches.length===2)pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);},{passive:true});
wrap.addEventListener('touchmove',e=>{
  if(e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(pinch){zoomAt((e.touches[0].clientX+e.touches[1].clientX)/2,(e.touches[0].clientY+e.touches[1].clientY)/2,d/pinch);}
    pinch=d;
  }
},{passive:true});
function zoomAt(cx,cy,f){scale*=f;scale=Math.max(.6,Math.min(4.5,scale));}
function resetView(){scale=1;offX=0;offY=0;focusTarget=null;sfxOpen();}
function focusSignal(s){
  const x=px(s.lon),y=py(s.lat);
  offX=-(x-W/2)*1; offY=-(y-H/2)*1; scale=2.2;
  focusTarget=s; sfxRadar();
  setTimeout(()=>{focusTarget=null;},2600);
}

  const city=document.getElementById('rCity').value.trim();
  const desc=document.getElementById('rDesc').value.trim();
  if(!city||!desc){alert('请填写城市和描述');return;}
  let lat=0,lon=0;
  try{
    const u=`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(city+',中国')}`;
    const r=await fetch(u),d=await r.json();
    if(d&&d[0]){lat=parseFloat(d[0].lat);lon=parseFloat(d[0].lon);}
  }catch(e){}
  reports.push({t,city,lat,lon,desc});
  localStorage.setItem('miui_reports2',JSON.stringify(reports));
  document.getElementById('rCity').value='';document.getElementById('rDesc').value='';
  closeReport();sfxConfirm();renderActivity();
}

/* =================================================================
   九、设置
   ================================================================= */
function toggleSet(el,k){el.classList.toggle('on');filters[k]=el.classList.contains('on');sfxClick();}
function toggleSoundSet(){const el=document.getElementById('soundSet');el.classList.toggle('on');soundOn=el.classList.contains('on');syncSoundBtn();sfxClick();}
function syncSoundBtn(){document.getElementById('soundBtn').textContent=soundOn?'🔊':'🔇';}
function toggleSound(){soundOn=!soundOn;syncSoundBtn();const el=document.getElementById('soundSet');if(el)el.classList.toggle('on',soundOn);if(soundOn)beep(880,.06,'square',.06);}

/* =================================================================
   十、引导流程
   ================================================================= */
function show(id){['welcome','settings','ceo','init'].forEach(n=>document.getElementById(n).classList.add('hide'));document.getElementById(id).classList.remove('hide');}
function goSettings(){sfxClick();show('settings');}
function goCeo(){sfxOpen();show('ceo');startCeo();}

/* 创始人寄语：打字机 */
let ceoTimer=null,ceoIdx=0,ceoChar=0,muted=false;
function startCeo(){
  clearInterval(ceoTimer);
  document.getElementById('ceoWave').style.display='flex';
  if(!muted){beep(440,.5,'sawtooth',.02);}
  ceoIdx=0;ceoChar=0;
  const cap=document.getElementById('ceoCaption');
  cap.innerHTML='';
  ceoTimer=setInterval(()=>{
    if(ceoIdx>=CEO_LINES.length){clearInterval(ceoTimer);return;}
    const line=CEO_LINES[ceoIdx];
    if(ceoChar<=line.length){
      cap.innerHTML=CEO_LINES.slice(0,ceoIdx).map(l=>l+'<br>').join('')+line.slice(0,ceoChar)+'<span class="cursor"></span>';
      ceoChar++;
    }else{
      ceoIdx++; ceoChar=0;
    }
  },55);
}
function toggleMute(){muted=!muted;document.getElementById('muteBtn').textContent=muted?'🔇 已静音':'🔊 静音';document.getElementById('ceoWave').style.display=muted?'none':'flex';}
function skipCeo(){clearInterval(ceoTimer);document.getElementById('ceoCaption').innerHTML=CEO_LINES.join('<br>');goInit();}

/* 初始化动画 */
function goInit(){
  clearInterval(ceoTimer);
  show('init');
  const bar=document.getElementById('initBar'),pct=document.getElementById('initPct'),lg=document.getElementById('initLog');
  let p=0; const steps=INIT_LOG.length;
  const timer=setInterval(()=>{
    p+=2+Math.random()*3;
    if(p>=100){p=100;clearInterval(timer);}
    bar.style.width=p+'%';
    pct.textContent=Math.floor(p)+'%';
    const stepIdx=Math.min(steps-1,Math.floor(p/100*steps));
    lg.textContent=INIT_LOG[stepIdx];
    if(p%20<3)beep(200+p*8,.04,'square',.03);
    if(p>=100){setTimeout(()=>{document.getElementById('init').classList.add('hide');sfxConfirm();},500);}
  },60);
}

/* 像素头像（创始人） */
function drawFace(){
  const face=document.getElementById('pixface');
  const map={'H':'#2a1a10','S':'#f5c08c','E':'#1a1a2e','M':'#e09a6a','O':'#ff6a00','C':'#ffffff','.':'transparent'};
  const rows=[
    '..HHHHHHHH..',
    '.HHHHHHHHHH.',
    'HHSSSSSSSSHH',
    'HSSSSSSSSSSH',
    'HSSEESSEESSH',
    'HSSEESSEESSH',
    'HSSSSSSSSSSH',
    '.HSSSSSSSSH.',
    '..HSMMMMSH..',
    '...HSSSSH...',
    '....OCCO....',
    '....OOOO....'
  ];
  face.innerHTML='';
  rows.forEach(row=>{
    for(const ch of row){
      const d=document.createElement('div');
      d.style.background=map[ch]||'transparent';
      face.appendChild(d);
    }
  });
}

/* =================================================================
   十一、启动
   ================================================================= */
drawBase();
drawFace();
renderFilters();
renderActivity();
renderWebWatch();
render();
syncSoundBtn();
</script>
