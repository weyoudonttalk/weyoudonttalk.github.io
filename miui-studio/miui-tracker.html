<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>MIUI 追踪器 · 全网信号追踪系统</title>
<meta name="description" content="MIUI工作室追踪器 v3.1，创始人寄语 + 全网信号追踪，雷达扫描、实时定位。">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<style>
:root{
  --cy:#22d3ee;--cy2:#38bdf8;--p:#8b5cf6;--ok:#34d399;--warn:#facc15;
  --bg:#030607;--panel:rgba(10,16,20,.72);--line:rgba(34,211,238,.25);
  --t:#d9f6ff;--t2:#7fb6c4;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',monospace;background:var(--bg);color:var(--t);overflow:hidden;-webkit-font-smoothing:antialiased}

/* ===== 开场动画 ===== */
#intro{position:fixed;inset:0;z-index:9999;background:#020304;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:opacity .6s}
#intro.hide{opacity:0;pointer-events:none}
#thread{position:absolute;top:0;left:50%;width:2px;height:0;background:linear-gradient(#9be8ff,#4dd0e1);box-shadow:0 0 8px var(--cy);animation:drop 1.1s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes drop{to{height:50%}}
#pixq{position:absolute;top:50%;left:50%;transform:translate(-50%,-100%) rotate(180deg);font-size:54px;animation:swing 1.1s ease-out forwards;opacity:0;filter:drop-shadow(0 0 14px var(--cy))}
@keyframes swing{from{opacity:0;transform:translate(-50%,-140%) rotate(180deg)}to{opacity:1;transform:translate(-50%,-100%) rotate(180deg)}}
#intro .tip{position:absolute;bottom:20%;font-size:13px;letter-spacing:4px;color:var(--cy);animation:blink 1.4s infinite}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
#intro .brand{position:absolute;top:13%;font-size:12px;letter-spacing:6px;color:var(--t2)}
#intro .brand b{color:var(--cy)}

/* ===== 创始人寄语 ===== */
#ceo{position:fixed;inset:0;z-index:9998;background:radial-gradient(120% 100% at 50% 0%,#0a1620,#020304 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;transition:opacity .5s}
#ceo.hide{opacity:0;pointer-events:none}
.ceo-avatar{position:relative;width:150px;height:150px;margin-bottom:22px}
.ceo-avatar .ring{position:absolute;inset:-14px;border-radius:50%;border:2px solid rgba(34,211,238,.4);animation:spin 6s linear infinite}
.ceo-avatar .ring::after{content:'';position:absolute;top:-3px;left:50%;width:8px;height:8px;border-radius:50%;background:var(--cy);box-shadow:0 0 12px var(--cy)}
@keyframes spin{to{transform:rotate(360deg)}}
.ceo-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid rgba(34,211,238,.5);box-shadow:0 0 34px rgba(34,211,238,.35);animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.ceo-wave{display:flex;gap:4px;align-items:flex-end;height:28px;margin-bottom:16px}
.ceo-wave i{width:4px;border-radius:2px;background:var(--cy);animation:wave .55s infinite ease-in-out;display:block}
.ceo-wave i:nth-child(1){height:10px}.ceo-wave i:nth-child(2){height:22px;animation-delay:.1s}
.ceo-wave i:nth-child(3){height:28px;animation-delay:.2s}.ceo-wave i:nth-child(4){height:16px;animation-delay:.3s}
.ceo-wave i:nth-child(5){height:24px;animation-delay:.15s}.ceo-wave i:nth-child(6){height:12px;animation-delay:.25s}
.ceo-wave i:nth-child(7){height:20px;animation-delay:.05s}
@keyframes wave{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1)}}
.ceo-name{font-size:13px;letter-spacing:3px;color:var(--cy);font-weight:700;margin-bottom:20px}
.ceo-caption{min-height:120px;max-width:600px;text-align:center;font-size:16px;line-height:2;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.9)}
.ceo-caption .cursor{display:inline-block;width:2px;height:1.1em;background:var(--cy);vertical-align:-2px;margin-left:2px;animation:blink .8s infinite}
.ceo-ctrl{display:flex;gap:12px;margin-top:26px}
.ceo-ctrl button{padding:9px 20px;border-radius:22px;border:1px solid var(--line);background:var(--panel);color:var(--cy);font-size:13px;cursor:pointer;letter-spacing:1px;backdrop-filter:blur(8px);transition:.2s}
.ceo-ctrl button:hover{background:rgba(34,211,238,.15)}
.ceo-ctrl button.primary{background:linear-gradient(135deg,#22d3ee,#38bdf8);color:#02181d;font-weight:700;border:none}

/* ===== 地图容器 ===== */
#map{position:absolute;inset:0;z-index:1;background:#0a1216}
.leaflet-container{background:#0a1216!important;font-family:inherit}

/* ===== HUD ===== */
#hud{position:absolute;inset:0;z-index:2;pointer-events:none}
#hud canvas{position:absolute;inset:0;width:100%;height:100%}
#scanline{position:absolute;inset:0;z-index:3;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(34,211,238,.06) 0 2px,transparent 2px 4px);opacity:.5}

/* 顶部栏 */
#topbar{position:absolute;top:0;left:0;right:0;z-index:5;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:auto;background:linear-gradient(180deg,rgba(2,8,10,.9),rgba(2,8,10,.55),transparent)}
#topbar .logo{font-weight:800;font-size:15px;letter-spacing:2px;display:flex;align-items:center;gap:8px}
#topbar .logo .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:blink 1.2s infinite}
#topbar .status{font-size:11px;color:var(--t2);letter-spacing:1px}
#topbar .status b{color:var(--cy)}
#topbar .btns{display:flex;gap:8px;flex-wrap:wrap}
#topbar .btns button{pointer-events:auto;padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--cy);font-size:12px;cursor:pointer;letter-spacing:1px;transition:.2s;backdrop-filter:blur(8px)}
#topbar .btns button:hover{background:rgba(34,211,238,.15)}
#topbar .btns button.off{color:var(--t2);border-color:rgba(127,182,196,.3)}

/* 终端日志 */
#log{position:absolute;left:14px;bottom:14px;z-index:5;width:min(340px,calc(100vw - 28px));max-height:200px;overflow:hidden;pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(10px);font-size:11px;line-height:1.7;padding:12px 14px}
#log .lt{font-size:10px;letter-spacing:2px;color:var(--cy);margin-bottom:6px;font-weight:700}
#log .l{color:#9fe8c8;white-space:pre-wrap;word-break:break-all}
#log .l.dim{color:var(--t2)}
#log .l.ok{color:var(--ok)}
#log .l.warn{color:var(--warn)}

/* 统计 */
#stats{position:absolute;right:14px;bottom:14px;z-index:5;pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(10px);padding:12px 14px;font-size:12px;line-height:1.9;text-align:right}
#stats .n{color:var(--cy);font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
#stats .k{color:var(--t2);font-size:10px;letter-spacing:1px}

@media (max-width:600px){
  #log{max-height:140px;font-size:10px}
  #stats{right:10px;bottom:10px;padding:9px 11px}
  #stats .n{font-size:16px}
  .ceo-avatar{width:120px;height:120px}
  .ceo-caption{font-size:14px;min-height:100px}
}
</style>
</head>
<body>
<audio id="bgmAudio" src="bgm.mp3" loop preload="auto"></audio>
<audio id="ceoAudio" src="https://qqai.gtimg.com/media/audios/20de3548c4ce073693aadd691ea1f9a8fa41a5ec232802d5b6bccb6f73df8943_1788167580697.wav" preload="auto"></audio>

<!-- 开场 -->
<div id="intro">
  <div class="brand">MIUI <b>TRACKER</b> · 全网信号追踪系统</div>
  <div id="thread"></div>
  <div id="pixq">🐧</div>
  <div class="tip">点 击 唤 醒 小 Q</div>
</div>

<!-- 创始人寄语 -->
<div id="ceo" class="hide">
  <div class="ceo-avatar">
    <div class="ring"></div>
    <img src="https://bot-resource-1251316161.cos.ap-guangzhou.tencentcos.cn/xiaoq_resave/eb9fe581e983203b505e56cd3bfae394dfaecb5b" alt="创始人">
  </div>
  <div class="ceo-wave" id="ceoWave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="ceo-name">MIUI 工作室 · 创始人寄语</div>
  <div class="ceo-caption" id="ceoCaption"></div>
  <div class="ceo-ctrl">
    <button id="muteBtn">🔊 静音</button>
    <button id="skipBtn">跳过 ⏭</button>
  </div>
</div>

<!-- 顶部栏 -->
<div id="topbar" class="hide">
  <div class="logo"><span class="dot"></span>MIUI 追踪器 <span style="color:var(--t2);font-size:10px">v3.1</span></div>
  <div class="status">雷达 <b>ONLINE</b> · 卫星 <b>已连接</b></div>
  <div class="btns">
    <button id="btnBgm">🔊 BGM</button>
    <button id="btnCeo">🎙 寄语</button>
    <button id="btnSrc">📄 源码</button>
  </div>
</div>

<div id="map"></div>
<div id="scanline"></div>
<div id="hud"><canvas id="hudcv"></canvas></div>

<div id="log">
  <div class="lt">SYSTEM CONSOLE</div>
  <div class="l dim">&gt; MIUI TRACKER v3.1 initializing...</div>
</div>
<div id="stats">
  <div><span class="n" id="nSig">0</span><span class="k"> 信号点</span></div>
  <div><span class="n" id="nCity">0</span><span class="k"> 城市</span></div>
  <div><span class="n" id="nZoom">5</span><span class="k"> 缩放</span></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
/* ================= 信号点 ================= */
var CITIES=[
  {n:'北京',c:[116.40,39.90],s:98}, {n:'上海',c:[121.47,31.23],s:95},
  {n:'广州',c:[113.26,23.13],s:91}, {n:'深圳',c:[114.06,22.55],s:93},
  {n:'成都',c:[104.07,30.57],s:88}, {n:'武汉',c:[114.31,30.52],s:85},
  {n:'西安',c:[108.94,34.34],s:82}, {n:'杭州',c:[120.15,30.28],s:87},
  {n:'南京',c:[118.78,32.06],s:84}, {n:'重庆',c:[106.55,29.56],s:86},
  {n:'长沙',c:[112.94,28.23],s:80}, {n:'郑州',c:[113.62,34.75],s:78},
  {n:'青岛',c:[120.38,36.07],s:76}, {n:'昆明',c:[102.83,24.88],s:74},
  {n:'乌鲁木齐',c:[87.62,43.83],s:70}, {n:'拉萨',c:[91.14,29.65],s:68},
  {n:'哈尔滨',c:[126.63,45.75],s:72}, {n:'沈阳',c:[123.43,41.80],s:73}
];

/* ================= 创始人寄语 ================= */
var CEO_LINES=[
  '大家好，我是 MIUI 工作室的创始人。',
  '欢迎来到我们的追踪器。',
  '在这里，你可以实时看到 25 人团队和 AI 小Q 的全球信号。',
  '地图上的每一个光点，都是我们真实走过的足迹。',
  '从 2023 年那个小小的 QQ 频道开始……',
  '到今天的旗舰官网、AI 助手、还有你正在看的追踪器。',
  '感谢每一位小伙伴的一路陪伴。',
  '现在，开始追踪吧！'
];
var ceoTimer=null, ceoIdx=0, ceoChar=0, ceoMuted=false;
var capEl=document.getElementById('ceoCaption');
var waveEl=document.getElementById('ceoWave');

/* 语音：播放预生成的真实人声 */
var ceoAudio=document.getElementById('ceoAudio');
var ceoFinished=false;
var voicePlaying=false;

function startCeo(){
  clearInterval(ceoTimer);
  ceoFinished=false;
  voicePlaying=false;
  ceoIdx=0;
  capEl.innerHTML='';
  waveEl.style.display='flex';
  if(ceoAudio && !ceoMuted){
    ceoAudio.currentTime=0;
    ceoAudio.play().then(function(){voicePlaying=true;}).catch(function(){voicePlaying=false;});
    ceoAudio.onended=function(){voicePlaying=false;finishCeo();};
  }
  typeLine();
}
function typeLine(){
  if(ceoIdx>=CEO_LINES.length){
    if(!voicePlaying)setTimeout(finishCeo,700);
    return;
  }
  var line=CEO_LINES[ceoIdx];
  ceoChar=0;
  clearInterval(ceoTimer);
  ceoTimer=setInterval(function(){
    if(ceoChar<=line.length){
      capEl.innerHTML=CEO_LINES.slice(0,ceoIdx).map(function(l){return l+'<br>'}).join('')+line.slice(0,ceoChar)+'<span class="cursor"></span>';
      ceoChar++;
    }else{
      clearInterval(ceoTimer);
      ceoIdx++;
      setTimeout(typeLine,160);
    }
  },75);
}
function finishCeo(){
  if(ceoFinished)return;
  ceoFinished=true;
  clearInterval(ceoTimer);
  capEl.innerHTML=CEO_LINES.join('<br>');
  setTimeout(goMap,600);
}
function toggleCeoMute(){
  ceoMuted=!ceoMuted;
  document.getElementById('muteBtn').textContent=ceoMuted?'🔇 已静音':'🔊 静音';
  if(ceoMuted){waveEl.style.display='none';if(ceoAudio)ceoAudio.pause();}
  else{waveEl.style.display='flex';if(ceoAudio)ceoAudio.play().catch(function(){});}
}
function skipCeo(){
  clearInterval(ceoTimer);
  if(ceoAudio)ceoAudio.pause();
  finishCeo();
}

/* ================= 地图 ================= */
var map=L.map('map',{zoomControl:false,attributionControl:false,preferCanvas:true}).setView([34.5,104.5],5);
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:18}).addTo(map);

function sigIcon(s){
  var hue=s>92?'#34d399':s>82?'#22d3ee':'#facc15';
  return L.divIcon({className:'',html:'<div style="position:relative;width:16px;height:16px">'+
    '<span style="position:absolute;inset:0;border-radius:50%;background:'+hue+';opacity:.35;animation:pulse 2s infinite"></span>'+
    '<span style="position:absolute;left:5px;top:5px;width:6px;height:6px;border-radius:50%;background:'+hue+';box-shadow:0 0 8px '+hue+'"></span></div>',
    iconSize:[16,16],iconAnchor:[8,8]});
}
var markers=L.markerClusterGroup({maxClusterRadius:50,showCoverageOnHover:false,
  iconCreateFunction:function(c){
    var n=c.getChildCount();
    return L.divIcon({html:'<div style="width:34px;height:34px;border-radius:50%;background:rgba(34,211,238,.12);border:2px solid #22d3ee;box-shadow:0 0 16px rgba(34,211,238,.5);display:flex;align-items:center;justify-content:center;color:#aef3ff;font-weight:800;font-size:13px">'+n+'</div>',iconSize:[34,34],iconAnchor:[17,17]});
  }});
CITIES.forEach(function(city){
  var m=L.marker([city.c[1],city.c[0]],{icon:sigIcon(city.s)});
  m.bindPopup('<b style="color:#22d3ee">'+city.n+'</b><br><span style="font-size:11px;color:#9fe8c8">信号强度 '+city.s+'%</span>');
  markers.addLayer(m);
});
map.addLayer(markers);
document.getElementById('nSig').textContent=CITIES.length;
document.getElementById('nCity').textContent=CITIES.length;
map.on('zoomend',function(){document.getElementById('nZoom').textContent=map.getZoom()});

/* ================= 终端日志 ================= */
var LOGS=[
  ['> LOADING MAP TILES...','dim'],['OK','ok'],
  ['> RADAR SYSTEM...','dim'],['ONLINE','ok'],
  ['> CONNECTING TO SATELLITE...','dim'],['OK','ok'],
  ['> '+CITIES.length+' SIGNALS DETECTED','dim'],
  ['> CALIBRATING COORDINATES...','dim'],['DONE','ok'],
  ['> TRACKING READY. WELCOME, AGENT.','warn']
];
var logEl=document.getElementById('log'),logIdx=0;
function typeLog(){
  if(logIdx>=LOGS.length)return;
  var item=LOGS[logIdx++];
  var d=document.createElement('div');d.className='l '+item[1];d.textContent=item[0];
  logEl.appendChild(d);
  logEl.scrollTop=logEl.scrollHeight;
  setTimeout(typeLog,item[1]==='dim'?420:260);
}

/* ================= BGM：真实史诗音乐 ================= */
var bgmOn=true;
function startBGM(){
  var a=document.getElementById('bgmAudio');
  if(!a)return;
  a.volume=0.55;
  if(bgmOn)a.play().catch(function(){});
}

/* ================= HUD 雷达 ================= */
var cv=document.getElementById('hudcv'),ctx=cv.getContext('2d');
function sizeCV(){cv.width=cv.clientWidth;cv.height=cv.clientHeight}
sizeCV();window.addEventListener('resize',sizeCV);
var ang=0;
function drawHUD(){
  var w=cv.width,h=cv.height;
  ctx.clearRect(0,0,w,h);
  var cx=w/2,cy=h/2,R=Math.min(w,h)*0.42;
  ctx.strokeStyle='rgba(34,211,238,.35)';ctx.lineWidth=1;
  for(var i=1;i<=4;i++){ctx.beginPath();ctx.arc(cx,cy,R*i/4,0,Math.PI*2);ctx.stroke()}
  ctx.beginPath();ctx.moveTo(cx-R,cy);ctx.lineTo(cx+R,cy);ctx.moveTo(cx,cy-R);ctx.lineTo(cx,cy+R);ctx.stroke();
  if(ctx.createConicGradient){
    var grad=ctx.createConicGradient(ang,cx,cy);
    grad.addColorStop(0,'rgba(34,211,238,.35)');grad.addColorStop(0.15,'rgba(34,211,238,0)');
    ctx.fillStyle=grad;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,ang,ang+0.7);ctx.closePath();ctx.fill();
  }
  var lx=cx+Math.cos(ang)*R,ly=cy+Math.sin(ang)*R;
  ctx.strokeStyle='rgba(34,211,238,.8)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(lx,ly);ctx.stroke();
  ctx.fillStyle='rgba(127,182,196,.6)';ctx.font='10px monospace';
  var ticks=['030','060','090','120','150','180','210','240','270','300','330','000'];
  for(var t=0;t<12;t++){
    var a=t*Math.PI/6,ex=cx+Math.cos(a)*(R+14),ey=cy+Math.sin(a)*(R+14);
    ctx.fillText(ticks[t],ex-12,ey+4);
  }
  ang+=0.008;
  requestAnimationFrame(drawHUD);
}

/* ================= 流程 ================= */
function goMap(){
  document.getElementById('ceo').classList.add('hide');
  document.getElementById('topbar').classList.remove('hide');
  drawHUD();
  typeLog();
  if(bgmOn)startBGM();
}

var intro=document.getElementById('intro');
intro.addEventListener('click',function(){
  // 用户手势内：启动 BGM + 进入寄语
  startBGM();
  intro.classList.add('hide');
  var ceo=document.getElementById('ceo');
  ceo.classList.remove('hide');
  startCeo();
});

/* ================= 按钮 ================= */
document.getElementById('muteBtn').addEventListener('click',toggleCeoMute);
document.getElementById('skipBtn').addEventListener('click',skipCeo);
document.getElementById('btnBgm').addEventListener('click',function(){
  bgmOn=!bgmOn;
  this.classList.toggle('off',!bgmOn);
  this.textContent=bgmOn?'🔊 BGM':'🔇 BGM';
  var a=document.getElementById('bgmAudio');
  if(!a)return;
  if(bgmOn)a.play().catch(function(){});else a.pause();
});
document.getElementById('btnCeo').addEventListener('click',function(){
  var ceo=document.getElementById('ceo');
  ceo.classList.remove('hide');
  document.getElementById('topbar').classList.add('hide');
  startCeo();
});
document.getElementById('btnSrc').addEventListener('click',function(){
  var src='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
  var blob=new Blob([src],{type:'text/html'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='miui-tracker.html';
  document.body.appendChild(a);a.click();a.remove();
});
</script>
</body>
</html>
