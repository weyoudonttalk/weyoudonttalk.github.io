<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>MIUI 追踪器 · 全网信号追踪系统</title>
<meta name="description" content="MIUI工作室追踪器 v3.0，全网信号追踪系统，雷达扫描、实时定位、影视飓风风格解说。">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<style>
:root{
  --cy:#22d3ee;--cy2:#38bdf8;--p:#8b5cf6;--ok:#34d399;--warn:#facc15;
  --bg:#030607;--panel:rgba(10,16,20,.72);--line:rgba(34,211,238,.25);
  --t:#d9f6ff;--t2:#7fb6c4;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',monospace;background:var(--bg);color:var(--t);overflow:hidden;-webkit-font-smoothing:antialiased}

/* ===== 开场动画 ===== */
#intro{position:fixed;inset:0;z-index:9999;background:#020304;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:opacity .6s}
#intro.hide{opacity:0;pointer-events:none}
#thread{position:absolute;top:0;left:50%;width:2px;height:0;background:linear-gradient(#9be8ff,#4dd0e1);box-shadow:0 0 8px var(--cy);animation:drop 1.2s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes drop{to{height:52%}}
#pixq{position:absolute;top:52%;left:50%;transform:translate(-50%,-100%) rotate(180deg);font-size:56px;animation:swing 1.2s ease-out forwards;opacity:0;filter:drop-shadow(0 0 14px var(--cy))}
@keyframes swing{from{opacity:0;transform:translate(-50%,-140%) rotate(180deg)}to{opacity:1;transform:translate(-50%,-100%) rotate(180deg)}}
#intro .tip{position:absolute;bottom:18%;font-size:13px;letter-spacing:4px;color:var(--cy);animation:blink 1.4s infinite}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
#intro .brand{position:absolute;top:14%;font-size:12px;letter-spacing:6px;color:var(--t2)}
#intro .brand b{color:var(--cy)}
#intro.flip #pixq{animation:flip .5s ease forwards}
@keyframes flip{to{transform:translate(-50%,-100%) rotate(0deg)}}

/* ===== 地图容器 ===== */
#map{position:absolute;inset:0;z-index:1;background:#0a1216}
.leaflet-container{background:#0a1216!important;font-family:inherit}

/* ===== HUD 叠加层 ===== */
#hud{position:absolute;inset:0;z-index:2;pointer-events:none}
#hud canvas{position:absolute;inset:0;width:100%;height:100%}

/* 顶部状态条 */
#topbar{position:absolute;top:0;left:0;right:0;z-index:5;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:auto;
background:linear-gradient(180deg,rgba(2,8,10,.9),rgba(2,8,10,.55),transparent)}
#topbar .logo{font-weight:800;font-size:15px;letter-spacing:2px;display:flex;align-items:center;gap:8px}
#topbar .logo .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:blink 1.2s infinite}
#topbar .status{font-size:11px;color:var(--t2);letter-spacing:1px}
#topbar .status b{color:var(--cy)}
#topbar .btns{display:flex;gap:8px}
#topbar .btns button{pointer-events:auto;padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--cy);font-size:12px;cursor:pointer;letter-spacing:1px;transition:.2s;backdrop-filter:blur(8px)}
#topbar .btns button:hover{background:rgba(34,211,238,.15);box-shadow:0 0 14px rgba(34,211,238,.3)}
#topbar .btns button.off{color:var(--t2);border-color:rgba(127,182,196,.3)}

/* 左侧终端日志 */
#log{position:absolute;left:14px;bottom:14px;z-index:5;width:min(340px,calc(100vw - 28px));max-height:220px;overflow:hidden;pointer-events:auto;
background:var(--panel);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(10px);font-size:11px;line-height:1.7;padding:12px 14px}
#log .lt{font-size:10px;letter-spacing:2px;color:var(--cy);margin-bottom:6px;font-weight:700}
#log .l{color:#9fe8c8;white-space:pre-wrap;word-break:break-all}
#log .l.dim{color:var(--t2)}
#log .l.ok{color:var(--ok)}
#log .l.warn{color:var(--warn)}

/* 右侧信号统计 */
#stats{position:absolute;right:14px;bottom:14px;z-index:5;pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(10px);padding:12px 14px;font-size:12px;line-height:1.9;text-align:right}
#stats .n{color:var(--cy);font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
#stats .k{color:var(--t2);font-size:10px;letter-spacing:1px}

/* 字幕 */
#subtitle{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);z-index:6;max-width:86vw;text-align:center;font-size:15px;line-height:1.8;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.9);transition:opacity .3s;pointer-events:none}
#subtitle .speaker{font-size:10px;letter-spacing:3px;color:var(--cy);margin-bottom:4px}

/* 雷达扫描线 */
#scanline{position:absolute;inset:0;z-index:3;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(34,211,238,.06) 0 2px,transparent 2px 4px);opacity:.5}

/* 手机适配 */
@media (max-width:600px){
  #log{max-height:150px;font-size:10px}
  #stats{right:10px;bottom:10px;padding:9px 11px}
  #stats .n{font-size:16px}
  #subtitle{bottom:76px;font-size:13px}
  #pixq{font-size:44px}
}
</style>
</head>
<body>

<!-- 开场 -->
<div id="intro">
  <div class="brand">MIUI <b>TRACKER</b> · 全网信号追踪系统</div>
  <div id="thread"></div>
  <div id="pixq">🐧</div>
  <div class="tip">点 击 唤 醒 小 Q</div>
</div>

<!-- 顶部栏 -->
<div id="topbar">
  <div class="logo"><span class="dot"></span>MIUI 追踪器 <span style="color:var(--t2);font-size:10px">v3.0</span></div>
  <div class="status">雷达 <b>ONLINE</b> · 卫星 <b>已连接</b></div>
  <div class="btns">
    <button id="btnBgm">🔊 BGM</button>
    <button id="btnVoice">🎙 解说</button>
    <button id="btnSrc">📄 源码</button>
  </div>
</div>

<div id="map"></div>
<div id="scanline"></div>
<div id="hud"><canvas id="hudcv"></canvas></div>
<div id="subtitle"></div>

<div id="log">
  <div class="lt">SYSTEM CONSOLE</div>
  <div class="l dim">&gt; MIUI TRACKER v3.0 initializing...</div>
</div>
<div id="stats">
  <div><span class="n" id="nSig">0</span><span class="k"> 信号点</span></div>
  <div><span class="n" id="nCity">0</span><span class="k"> 城市</span></div>
  <div><span class="n" id="nZoom">5</span><span class="k"> 缩放</span></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
/* ================= 信号点数据 ================= */
var CITIES=[
  {n:'北京',c:[116.40,39.90],s:98}, {n:'上海',c:[121.47,31.23],s:95},
  {n:'广州',c:[113.26,23.13],s:91}, {n:'深圳',c:[114.06,22.55],s:93},
  {n:'成都',c:[104.07,30.57],s:88}, {n:'武汉',c:[114.31,30.52],s:85},
  {n:'西安',c:[108.94,34.34],s:82}, {n:'杭州',c:[120.15,30.28],s:87},
  {n:'南京',c:[118.78,32.06],s:84}, {n:'重庆',c:[106.55,29.56],s:86},
  {n:'长沙',c:[112.94,28.23],s:80}, {n:'郑州',c:[113.62,34.75],s:78},
  {n:'青岛',c:[120.38,36.07],s:76}, {n:'昆明',c:[102.83,24.88],s:74},
  {n:'乌鲁木齐',c:[87.62,43.83],s:70}, {n:'拉萨',c:[91.14,29.65],s:68},
  {n:'哈尔滨',c:[126.63,45.75],s:72}, {n:'沈阳',c:[123.43,41.80],s:73}
];

/* ================= 地图 ================= */
var map=L.map('map',{zoomControl:false,attributionControl:false,preferCanvas:true})
  .setView([34.5,104.5],5);
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
  subdomains:'abcd',maxZoom:18
}).addTo(map);

/* 信号点 + 聚类 */
function sigIcon(s){
  var hue = s>92?'#34d399': s>82?'#22d3ee':'#facc15';
  return L.divIcon({className:'',html:'<div style="position:relative;width:16px;height:16px">'+
    '<span style="position:absolute;inset:0;border-radius:50%;background:'+hue+';opacity:.35;animation:pulse 2s infinite"></span>'+
    '<span style="position:absolute;left:5px;top:5px;width:6px;height:6px;border-radius:50%;background:'+hue+';box-shadow:0 0 8px '+hue+'"></span></div>',
    iconSize:[16,16],iconAnchor:[8,8]});
}
var markers=L.markerClusterGroup({maxClusterRadius:50,showCoverageOnHover:false,
  iconCreateFunction:function(c){
    var n=c.getChildCount();
    return L.divIcon({html:'<div style="width:34px;height:34px;border-radius:50%;background:rgba(34,211,238,.12);border:2px solid #22d3ee;box-shadow:0 0 16px rgba(34,211,238,.5);display:flex;align-items:center;justify-content:center;color:#aef3ff;font-weight:800;font-size:13px">'+n+'</div>',
      iconSize:[34,34],iconAnchor:[17,17]});
  }});
CITIES.forEach(function(city){
  var m=L.marker([city.c[1],city.c[0]],{icon:sigIcon(city.s)});
  m.bindPopup('<b style="color:#22d3ee">'+city.n+'</b><br><span style="font-size:11px;color:#9fe8c8">信号强度 '+city.s+'%</span>');
  markers.addLayer(m);
});
map.addLayer(markers);
document.getElementById('nSig').textContent=CITIES.length;
document.getElementById('nCity').textContent=CITIES.length;
map.on('zoomend',function(){document.getElementById('nZoom').textContent=map.getZoom()});

/* ================= 终端日志打字机 ================= */
var LOGS=[
  ['> LOADING MAP TILES...','dim'],['OK','ok'],
  ['> RADAR SYSTEM...','dim'],['ONLINE','ok'],
  ['> CONNECTING TO SATELLITE...','dim'],['OK','ok'],
  ['> '+(CITIES.length)+' SIGNALS DETECTED','dim'],
  ['> CALIBRATING COORDINATES...','dim'],['DONE','ok'],
  ['> TRACKING READY. WELCOME, AGENT.','warn']
];
var logEl=document.getElementById('log'),logIdx=0;
function typeLog(){
  if(logIdx>=LOGS.length)return;
  var item=LOGS[logIdx++];
  var d=document.createElement('div');d.className='l '+item[1];d.textContent=item[0];
  logEl.appendChild(d);
  logEl.scrollTop=logEl.scrollHeight;
  setTimeout(typeLog, item[1]==='dim'?420:260);
}

/* ================= 影视飓风解说（TTS + 字幕） ================= */
var LINES=[
  '各位好，这里是 MIUI 工作室。',
  '现在，让我们把视野，拉向整个中国。',
  '雷达已经上线，信号正在回传。',
  '每一颗光点，都是一次连接。每一个坐标，都有人在等你。',
  '接下来，开始追踪。'
];
var voiceOn=true,lineIdx=0,subEl=document.getElementById('subtitle');
function sayLine(){
  if(lineIdx>=LINES.length)return;
  var t=LINES[lineIdx];
  subEl.innerHTML='<div class="speaker">🎙 影视飓风 · 现场解说</div>'+t;
  subEl.style.opacity=1;
  if(voiceOn && 'speechSynthesis' in window){
    var u=new SpeechSynthesisUtterance(t);
    u.lang='zh-CN';u.rate=1.02;u.pitch=1;
    var v=speechSynthesis.getVoices().filter(function(x){return /zh|cmn|chinese/i.test(x.lang)})[0];
    if(v)u.voice=v;
    u.onend=function(){setTimeout(function(){subEl.style.opacity=0;lineIdx++;sayLine()},300)};
    speechSynthesis.speak(u);
  }else{
    setTimeout(function(){subEl.style.opacity=0;lineIdx++;sayLine()},2600);
  }
}

/* ================= BGM：Web Audio 原创史诗配乐 ================= */
var audioCtx=null,bgmTimer=null,bgmOn=true;
function startBGM(){
  if(audioCtx)return;
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  var master=audioCtx.createGain();master.gain.value=0.5;master.connect(audioCtx.destination);
  var chords=[
    [110,164.81,220,261.63,329.63],
    [87.31,130.81,174.61,220,261.63],
    [130.81,196,261.63,329.63,392],
    [98,146.83,196,246.94,293.66]
  ];
  var ci=0;
  function playChord(){
    var ch=chords[ci%4];
    ch.forEach(function(f){
      var o=audioCtx.createOscillator();o.type='sawtooth';o.frequency.value=f;
      var g=audioCtx.createGain();
      g.gain.setValueAtTime(0,audioCtx.currentTime);
      g.gain.linearRampToValueAtTime(0.055,audioCtx.currentTime+0.35);
      g.gain.linearRampToValueAtTime(0.001,audioCtx.currentTime+2.0);
      var lp=audioCtx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;
      o.connect(lp);lp.connect(g);g.connect(master);o.start();o.stop(audioCtx.currentTime+2.1);
    });
    var b=audioCtx.createOscillator();b.type='sine';b.frequency.value=ch[0];
    var bg=audioCtx.createGain();
    bg.gain.setValueAtTime(0.13,audioCtx.currentTime);
    bg.gain.linearRampToValueAtTime(0.001,audioCtx.currentTime+2.0);
    b.connect(bg);bg.connect(master);b.start();b.stop(audioCtx.currentTime+2.1);
    ci++;
  }
  function kick(){
    var o=audioCtx.createOscillator();o.type='sine';
    o.frequency.setValueAtTime(130,audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(42,audioCtx.currentTime+0.16);
    var g=audioCtx.createGain();
    g.gain.setValueAtTime(0.55,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.22);
    o.connect(g);g.connect(master);o.start();o.stop(audioCtx.currentTime+0.22);
  }
  function snare(){
    var buf=audioCtx.createBuffer(1,audioCtx.sampleRate*0.08,audioCtx.sampleRate);
    var d=buf.getChannelData(0);
    for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
    var s=audioCtx.createBufferSource();s.buffer=buf;
    var g=audioCtx.createGain();g.gain.value=0.13;
    var hp=audioCtx.createBiquadFilter();hp.type='highpass';hp.frequency.value=1800;
    s.connect(hp);hp.connect(g);g.connect(master);s.start();
  }
  var beat=0;
  playChord();
  bgmTimer=setInterval(function(){
    beat++;
    kick();
    if(beat%2===0)snare();
    if(beat%4===0)playChord();
  },480);
}

/* ================= HUD 雷达扫描 ================= */
var cv=document.getElementById('hudcv'),ctx=cv.getContext('2d');
function sizeCV(){cv.width=cv.clientWidth;cv.height=cv.clientHeight}
sizeCV();window.addEventListener('resize',sizeCV);
var ang=0;
function drawHUD(){
  var w=cv.width,h=cv.height;
  ctx.clearRect(0,0,w,h);
  var cx=w/2,cy=h/2,R=Math.min(w,h)*0.42;
  // 雷达圆环
  ctx.strokeStyle='rgba(34,211,238,.35)';ctx.lineWidth=1;
  for(var i=1;i<=4;i++){ctx.beginPath();ctx.arc(cx,cy,R*i/4,0,Math.PI*2);ctx.stroke()}
  // 十字线
  ctx.beginPath();ctx.moveTo(cx-R,cy);ctx.lineTo(cx+R,cy);ctx.moveTo(cx,cy-R);ctx.lineTo(cx,cy+R);ctx.stroke();
  // 扫描扇区
  var grad=ctx.createConicGradient?ctx.createConicGradient(ang,cx,cy):null;
  if(grad){grad.addColorStop(0,'rgba(34,211,238,.35)');grad.addColorStop(0.15,'rgba(34,211,238,0)');
    ctx.fillStyle=grad;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,ang,ang+0.7);ctx.closePath();ctx.fill();}
  // 扫描线
  var lx=cx+Math.cos(ang)*R,ly=cy+Math.sin(ang)*R;
  ctx.strokeStyle='rgba(34,211,238,.8)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(lx,ly);ctx.stroke();
  // 刻度
  ctx.fillStyle='rgba(127,182,196,.6)';ctx.font='10px monospace';
  var ticks=['030','060','090','120','150','180','210','240','270','300','330','000'];
  for(var t=0;t<12;t++){
    var a=t*Math.PI/6,ex=cx+Math.cos(a)*(R+14),ey=cy+Math.sin(a)*(R+14);
    ctx.fillText(ticks[t],ex-12,ey+4);
  }
  ang+=0.008;
  requestAnimationFrame(drawHUD);
}

/* ================= 启动流程 ================= */
var intro=document.getElementById('intro');
intro.addEventListener('click',function(){
  intro.classList.add('flip');
  setTimeout(function(){
    intro.classList.add('hide');
    drawHUD();
    typeLog();
    setTimeout(function(){
      if(bgmOn)startBGM();
      sayLine();
    },900);
  },450);
});

/* ================= 按钮 ================= */
document.getElementById('btnBgm').addEventListener('click',function(){
  bgmOn=!bgmOn;
  this.classList.toggle('off',!bgmOn);
  this.textContent=bgmOn?'🔊 BGM':'🔇 BGM';
  if(bgmOn){if(!audioCtx)startBGM();else audioCtx.resume()}
  else if(audioCtx)audioCtx.suspend();
});
document.getElementById('btnVoice').addEventListener('click',function(){
  voiceOn=!voiceOn;
  this.classList.toggle('off',!voiceOn);
  this.textContent=voiceOn?'🎙 解说':'🔕 解说';
  if(!voiceOn)speechSynthesis.cancel();
});
document.getElementById('btnSrc').addEventListener('click',function(){
  var src='<!DOCTYPE html>\n'+(document.documentElement.outerHTML);
  var blob=new Blob([src],{type:'text/html'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='miui-tracker.html';
  document.body.appendChild(a);a.click();a.remove();
});

/* 预加载语音 */
if('speechSynthesis' in window)speechSynthesis.getVoices();
</script>
</body>
</html>
