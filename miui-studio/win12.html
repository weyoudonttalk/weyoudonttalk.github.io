<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Windows 12 · 我的桌面</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,'PingFang SC',sans-serif;user-select:none}
  body{background:radial-gradient(circle at 30% 20%,#1b2a4a,#0a0f1e 70%);color:#fff}
  /* 壁纸光晕 */
  body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 80% 90%,rgba(0,120,255,.25),transparent 40%),radial-gradient(circle at 10% 80%,rgba(120,0,255,.2),transparent 40%);pointer-events:none}
  /* 桌面图标 */
  .desk{position:fixed;inset:0 0 56px 0;padding:22px;display:grid;grid-template-columns:repeat(auto-fill,96px);grid-auto-rows:96px;gap:10px;align-content:start;overflow-y:auto}
  .icon{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:8px;cursor:pointer;padding:8px 4px;transition:.12s}
  .icon:active{background:rgba(255,255,255,.12)}
  .icon .g{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;background:rgba(255,255,255,.1);box-shadow:0 4px 12px rgba(0,0,0,.3)}
  .icon .t{font-size:12px;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.7);max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .icon.delta .g{background:linear-gradient(135deg,#2e7d32,#1b5e20);box-shadow:0 0 18px rgba(46,125,50,.6)}
  /* 任务栏 */
  .taskbar{position:fixed;left:0;right:0;bottom:0;height:56px;background:rgba(20,24,38,.7);backdrop-filter:blur(24px);border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;padding:0 14px;gap:10px;z-index:50}
  .start{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#0078d4,#5b9bd5);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px}
  .tray{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:13px}
  .tray .wifi,.tray .bat{opacity:.9}
  /* 开始菜单 */
  .startmenu{position:fixed;left:14px;bottom:64px;width:340px;max-width:90vw;background:rgba(20,24,38,.92);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;z-index:60;display:none;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .startmenu.show{display:block;animation:sp .2s ease}
  @keyframes sp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .sm-search{width:100%;padding:10px 14px;border-radius:20px;background:rgba(255,255,255,.1);border:0;color:#fff;outline:none;margin-bottom:14px;font-size:13px}
  .sm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .sm-grid .app{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}
  .sm-grid .app .g{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;background:rgba(255,255,255,.1)}
  .sm-grid .app .t{font-size:11px}
  /* 窗口 */
  .win{position:fixed;z-index:80;width:min(92vw,440px);background:rgba(28,32,48,.96);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.1);display:none;flex-direction:column;overflow:hidden;backdrop-filter:blur(10px);left:50%;top:42%;transform:translate(-50%,-50%)}
  .win.show{display:flex;animation:sp .2s ease}
  .win .bar{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:rgba(255,255,255,.06);font-size:13px;font-weight:600}
  .win .bar .x{width:24px;height:24px;border-radius:50%;background:#ff453a;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:13px}
  .win .body{padding:18px}
  .btn{display:inline-block;padding:9px 16px;border-radius:20px;background:linear-gradient(135deg,#0078d4,#5b9bd5);color:#fff;font-size:13px;font-weight:600;border:0;cursor:pointer;margin-right:8px}
  .btn.green{background:linear-gradient(135deg,#2e7d32,#43a047)}
  .toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:999;background:rgba(0,0,0,.88);padding:10px 18px;border-radius:20px;font-size:12px;opacity:0;transition:.3s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
  <div class="desk" id="desk"></div>

  <div class="taskbar">
    <div class="start" id="startBtn">⊞</div>
    <div class="tray"><span class="wifi">📶</span><span class="bat">🔋 88%</span><span id="clk">09:41</span></div>
  </div>

  <div class="startmenu" id="sm">
    <input class="sm-search" placeholder="搜索应用…">
    <div class="sm-grid" id="smGrid"></div>
  </div>

  <!-- 三角洲窗口 -->
  <div class="win" id="deltaWin">
    <div class="bar"><span>🔫 三角洲行动</span><div class="x" onclick="closeW('deltaWin')">✕</div></div>
    <div class="body">
      <div style="text-align:center;padding:10px 0">
        <div style="font-size:54px">🔫</div>
        <h3 style="margin:8px 0">三角洲行动</h3>
        <p style="color:#9aa3c0;font-size:12px">战术射击 · 端游/手游同款</p>
        <p style="color:#9aa3c0;font-size:12px;margin-top:6px">网页端为演示入口，完整游戏请用安卓模拟器下载。</p>
        <div style="margin-top:14px">
          <button class="btn green" onclick="window.open('https://www.bluestacks.com/','_blank')">⬇ 下载（安卓模拟器）</button>
          <button class="btn" onclick="window.open('https://www.deltaforce.com/','_blank')">🌐 官网</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
function openW(id){document.getElementById(id).classList.add('show');}
function closeW(id){document.getElementById(id).classList.remove('show');}

const APPS=[
  {id:'delta',name:'三角洲行动',g:'🔫',cls:'delta',fn:()=>openW('deltaWin')},
  {id:'edge',name:'浏览器',g:'🌐',fn:()=>window.open('https://www.bing.com','_blank')},
  {id:'pc',name:'此电脑',g:'💻',fn:()=>toast('此电脑（演示）')},
  {id:'file',name:'文件',g:'📁',fn:()=>toast('文件资源管理器（演示）')},
  {id:'store',name:'应用商店',g:'🛒',fn:()=>toast('应用商店（演示）')},
  {id:'set',name:'设置',g:'⚙️',fn:()=>toast('设置（演示）')},
  {id:'music',name:'音乐',g:'🎵',fn:()=>toast('音乐（演示）')},
  {id:'game',name:'游戏',g:'🎮',fn:()=>toast('游戏（演示）')},
];

// 桌面图标
const desk=document.getElementById('desk');
APPS.forEach(a=>{
  const el=document.createElement('div');el.className='icon'+(a.cls?(' '+a.cls):'');
  el.innerHTML=`<div class="g">${a.g}</div><div class="t">${a.name}</div>`;
  el.onclick=()=>a.fn();
  desk.appendChild(el);
});
// 开始菜单
const smGrid=document.getElementById('smGrid');
APPS.forEach(a=>{
  const el=document.createElement('div');el.className='app';
  el.innerHTML=`<div class="g">${a.g}</div><div class="t">${a.name}</div>`;
  el.onclick=()=>{document.getElementById('sm').classList.remove('show');a.fn();};
  smGrid.appendChild(el);
});
document.getElementById('startBtn').onclick=()=>document.getElementById('sm').classList.toggle('show');
document.addEventListener('click',e=>{if(!e.target.closest('.startmenu')&&!e.target.closest('#startBtn'))document.getElementById('sm').classList.remove('show');});
// 时钟
function clk(){const d=new Date();document.getElementById('clk').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
clk();setInterval(clk,10000);
</script>
</body>
</html>
