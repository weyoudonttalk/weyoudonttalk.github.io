<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>代码专区 · 免Key AI写代码 · MIUI 工作室</title>
<meta name="description" content="MIUI 工作室代码专区：免Key AI写代码，支持 HTML/JS/Python/C++/Java 等，高亮+复制+在线运行。" />
<style>
  :root{--bg:#f4f5f9;--card:#ffffff;--line:#e7e9f2;--t:#1d2130;--t2:#6b7280;--main:#6c5ce7;--main2:#00b3d6;--user:#6c5ce7;--ok:#16a34a}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--t);line-height:1.65;overflow:hidden}
  nav{display:flex;align-items:center;justify-content:space-between;padding:13px clamp(16px,4vw,40px);background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);position:fixed;top:0;left:0;right:0;z-index:100}
  nav .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;color:var(--t)}
  nav .logo .ic{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--main),var(--main2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px}
  nav .nl{display:flex;gap:4px;align-items:center}
  nav .nl a{padding:8px 13px;border-radius:11px;color:var(--t2);font-size:13px;transition:.2s;text-decoration:none}
  nav .nl a:hover,nav .nl a.on{color:var(--main);background:rgba(108,92,231,.08)}
  nav .nl .cta{margin-left:6px;padding:9px 16px;border-radius:20px;background:linear-gradient(135deg,var(--main),var(--main2));color:#fff;font-weight:700}
  #burger{display:none;width:42px;height:42px;border-radius:11px;background:#fff;border:1px solid var(--line);color:var(--t);font-size:18px;cursor:pointer}
  @media(max-width:920px){nav .nl{display:none}#burger{display:flex;align-items:center;justify-content:center}}
  .wrap{height:100%;display:flex;flex-direction:column;padding-top:62px}
  header.bar{padding:13px clamp(16px,4vw,40px);border-bottom:1px solid var(--line);background:#fff;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header.bar .av{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--main),var(--main2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px}
  header.bar h1{font-size:17px;font-weight:800;color:var(--t)}
  header.bar .st{font-size:12px;color:var(--t2);display:flex;align-items:center;gap:7px}
  .lv{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px rgba(22,163,74,.5)}
  header.bar .spacer{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap}
  .pill{background:#fff;border:1px solid var(--line);color:var(--t2);padding:7px 14px;border-radius:20px;font-size:12.5px;cursor:pointer;transition:.2s}
  .pill:hover{color:var(--main);border-color:var(--main)}
  .pill.key{background:linear-gradient(135deg,var(--main),var(--main2));color:#fff;border:none;font-weight:700}
  .langs{display:flex;gap:9px;flex-wrap:wrap;align-items:center;padding:11px clamp(16px,4vw,40px);border-bottom:1px solid var(--line);background:rgba(255,255,255,.6)}
  .langs .tag{font-size:12px;color:var(--t2)}
  .langs button{background:#fff;border:1px solid var(--line);color:var(--t2);padding:7px 14px;border-radius:18px;font-size:12.5px;cursor:pointer;transition:.2s;font-family:inherit}
  .langs button:hover{border-color:var(--main)}
  .langs button.on{background:var(--main);color:#fff;border-color:var(--main)}
  .warnbar{margin:12px clamp(16px,4vw,40px) 0;padding:12px 44px 12px 16px;position:relative;border-radius:12px;background:#fff8e6;border:1px solid #f0d99a;font-size:12.5px;color:#8a6d1a;line-height:1.6}
  .warnbar b{color:#b8860b}
  .warnbar .x{position:absolute;top:8px;right:10px;width:24px;height:24px;border-radius:8px;border:none;background:transparent;color:#b8860b;font-size:18px;cursor:pointer;line-height:1}
  .warnbar .x:hover{background:rgba(184,134,11,.12)}
  #log{flex:1;overflow-y:auto;padding:20px clamp(16px,4vw,40px);display:flex;flex-direction:column;gap:16px;min-height:0;max-width:1040px;width:100%;margin:0 auto}
  #log::-webkit-scrollbar{width:9px}#log::-webkit-scrollbar-thumb{background:rgba(0,0,0,.14);border-radius:9px}
  .msg{display:flex;gap:12px;max-width:92%;animation:fa .3s ease}
  @keyframes fa{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .msg.me{align-self:flex-end;flex-direction:row-reverse}
  .msg .mav{width:34px;height:34px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
  .msg.ai .mav{background:linear-gradient(135deg,var(--main),var(--main2));color:#fff}
  .msg.me .mav{background:linear-gradient(135deg,#ff8a3d,#ff5d73);color:#fff}
  .bubble{padding:13px 17px;border-radius:16px;font-size:14.8px;line-height:1.7;word-break:break-word;white-space:pre-wrap}
  .msg.ai .bubble{background:#fff;border:1px solid var(--line);border-top-left-radius:5px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .msg.me .bubble{background:var(--user);color:#fff;border-top-right-radius:5px}
  .bubble h2,.bubble h3,.bubble h4{margin:10px 0 6px;color:inherit}
  .bubble ul{margin:6px 0 6px 20px}.bubble li{margin:3px 0}
  .bubble b{color:inherit}
  pre.cb{position:relative;background:#0f1422;border-radius:11px;padding:14px 14px 12px;margin:10px 0;overflow:auto;font-size:13px;line-height:1.5}
  pre.cb code{font-family:'SFMono-Regular',Consolas,monospace;color:#cfe3ff;white-space:pre}
  .cpy{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#cfe3ff;padding:4px 11px;border-radius:14px;font-size:11px;cursor:pointer}
  code.ic{background:rgba(108,92,231,.1);color:#5b4bd6;padding:1px 6px;border-radius:6px;font-family:monospace;font-size:13px}
  .run{display:inline-block;margin:6px 0 2px;background:var(--main2);color:#fff;font-weight:700;padding:5px 14px;border-radius:14px;font-size:12px;cursor:pointer;border:none}
  .typing{display:flex;gap:4px;padding:14px 16px}.typing span{width:7px;height:7px;border-radius:50%;background:var(--main);animation:bl 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
  @keyframes bl{0%,60%,100%{opacity:.3}30%{opacity:1;transform:translateY(-4px)}}
  .composer{flex-shrink:0;padding:14px clamp(16px,4vw,40px) 18px;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;gap:12px;align-items:flex-end}
  textarea#in{flex:1;resize:none;max-height:140px;min-height:50px;background:#fff;border:1px solid var(--line);color:var(--t);border-radius:16px;padding:14px 16px;font-size:15px;outline:none;line-height:1.55;font-family:inherit}
  textarea#in:focus{border-color:var(--main);box-shadow:0 0 0 3px rgba(108,92,231,.12)}
  #send{background:linear-gradient(135deg,var(--main),var(--main2));border:none;color:#fff;padding:0 26px;height:50px;border-radius:16px;font-size:15px;font-weight:800;cursor:pointer;flex-shrink:0}
  #send:disabled{opacity:.5}
  .hint{text-align:center;color:var(--t2);font-size:11.5px;padding:6px 0 0}
  .mask{position:fixed;inset:0;background:rgba(20,22,34,.45);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
  .mask.open{display:flex}
  .modal{background:#fff;border:1px solid var(--line);border-radius:20px;max-width:560px;width:100%;max-height:86vh;overflow:auto;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.15)}
  .modal h3{font-size:19px;margin-bottom:6px;color:var(--t)}.modal .sub{color:var(--t2);font-size:13px;margin-bottom:14px}
  .modal .row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .modal .row b{font-size:13.5px;flex:1;color:var(--t)}.modal .row span{font-size:11px;color:var(--t2);flex:1}
  .modal .go{background:#fff;border:1px solid var(--line);color:var(--main);padding:7px 13px;border-radius:18px;font-size:12px;cursor:pointer;white-space:nowrap;text-decoration:none}
  .modal textarea{width:100%;background:#f8f9fc;border:1px solid var(--line);color:var(--t);border-radius:11px;padding:11px;font-size:13px;outline:none;resize:vertical;font-family:monospace}
  .modal .acts{display:flex;gap:10px;margin-top:12px}
  .closex{float:right;cursor:pointer;color:var(--t2);font-size:24px}
</style>
</head>
<body>
<nav>
  <div class="logo" onclick="location.href='index.html'"><div class="ic">M</div>MIUI 工作室</div>

  <div class="nl">
    <a href="index.html">首页</a>

<div id="mMenu" style="display:none;position:fixed;inset:0;z-index:99;background:rgba(244,245,249,.97);flex-direction:column;align-items:center;justify-content:center;gap:6px">
  <a href="chat.html" style="font-size:18px;font-weight:700;padding:12px 0;color:#1d2130;text-decoration:none" onclick="mMenu()">💬 聊天专区</a>

<div class="wrap">
  <header class="bar">
    <div class="av">Q</div>
    <div><h1>💻 代码专区（免Key）</h1>
      <div class="st"><span class="lv"></span><span id="mn">免密模式 · 打开即写</span></div></div>
    <div class="spacer">
      <button class="pill key" onclick="openKeyModal()">🔑 升级模型</button>
      <button class="pill" onclick="clearChat()">清空</button>
    </div>
  </header>

  <div class="langs" id="langs"><span class="tag">语言：</span></div>

  <div id="log"></div>

  <div class="composer">
    <textarea id="in" placeholder="描述你要的代码，例如：用Python写个批量重命名文件的脚本" onkeydown="onKey(event)"></textarea>
    <button id="send" onclick="send()">生成</button>
  </div>
  <div class="hint">免Key即写 · 升级填智谱/DeepSeek等免费key更稳 · 群 1070470498</div>
</div>

<div class="mask" id="keyMask" onclick="if(event.target===this)closeKeyModal()">
  <div class="modal">
    <span class="closex" onclick="closeKeyModal()">×</span>
    <h3>🔑 升级模型（可选）</h3>
    <div class="sub">免密引擎（Pollinations等）已能写代码。想要更稳更强，填个免费 key：推荐智谱 GLM（手机号注册免身份证）或 DeepSeek/硅基流动。</div>
    <div id="keyRows"></div>
    <div style="margin-top:14px;font-size:13px;color:var(--t)">批量导入（每行 <code style="color:var(--main)">引擎ID:KEY</code>）：</div>
    <textarea id="batchKeys" rows="4" placeholder="zhipu:你的智谱key&#10;deepseek:你的deepseek key"></textarea>
    <div class="acts">
      <button style="background:linear-gradient(135deg,var(--main),var(--main2));color:#fff;border:none;padding:9px 20px;font-size:14px;cursor:pointer;border-radius:11px;font-weight:700" onclick="importKeys()">⚡ 一键导入</button>
      <button style="background:#fff;color:var(--t);border:1px solid var(--line);padding:9px 20px;font-size:14px;cursor:pointer;border-radius:11px" onclick="closeKeyModal()">关闭</button>
    </div>
    <div id="keyMsg" style="margin-top:10px;font-size:13px;color:var(--ok)"></div>
  </div>
</div>

<script src="e.js"></script>
<script>
const LANGS=['Python','JavaScript','HTML','CSS','Java','C++','Go','Rust','SQL','Shell'];
let curLang='Python';
const log=document.getElementById('log'),sendBtn=document.getElementById('send'),input=document.getElementById('in');
let busy=false;
// 语言按钮
const langsBox=document.getElementById('langs');
LANGS.forEach((l,i)=>{const b=document.createElement('button');b.textContent=l;b.className=i===0?'on':'';b.onclick=()=>{curLang=l;document.querySelectorAll('#langs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');};langsBox.appendChild(b);});
function goHome(){location.href='index.html';}
function mMenu(){const m=document.getElementById('mMenu');m.style.display=m.style.display==='flex'?'none':'flex';}
// 公告条（可关闭，记忆）
function renderWarn(){
  if(localStorage.codeWarnClosed==='1')return;
  const w=document.createElement('div');w.className='warnbar';
  w.innerHTML='⚠️ <b>合规声明：</b>本专区可写各类代码（含教学性安全/逆向/脚本示例），但<b>绝不输出可直接用于非法侵害他人（如勒索、入侵、破坏）的成品武器化代码</b>。涉及危险主题时，AI 会先讲清风险、给防御视角或教学示意，并提醒：<b>代码只用于学习、授权测试与防护，非法用途后果自负。</b><span class="x" onclick="closeWarn()">×</span>';
  log.parentNode.insertBefore(w,log);
}
function closeWarn(){localStorage.codeWarnClosed='1';const w=document.querySelector('.warnbar');if(w)w.remove();}
function addMsg(role,text,html){
  const m=document.createElement('div');m.className='msg '+role;const av=role==='me'?'你':'Q';
  const body=role==='me'?QA.md(text):html;
  m.innerHTML=`<div class="mav">${av}</div><div class="bubble">${body}</div>`;
  log.appendChild(m);log.scrollTop=log.scrollHeight;
  if(role==='ai')attachRun(m);
  return m;
}
function clearChat(){log.innerHTML='';addMsg('ai','💻 代码专区已就绪，<b>免Key 即写</b>！选好语言，描述需求就能出代码，支持一键复制、HTML/JS 还能直接「运行」。\\n\\n试试：「用'+curLang+'写个贪吃蛇」「写个爬虫抓天气」「做个会动的按钮」。\\n\\n⚠️ 危险/双用途主题会从教学+防御角度讲并提醒合法使用，不产出可直接作恶的成品代码。');renderWarn();}
function buildSys(){return `你是 MIUI 工作室的代码助手小Q，用户要 ${curLang} 代码。
规则：
1) 优先给完整可运行代码，用 \\\`\\\`\\\`lang 代码块\\\`\\\`\\\` 包裹，关键行加中文注释，简短说明怎么跑。
2) 涉及双用途/危险主题（勒索、病毒、入侵、提权、破坏性脚本、未授权扫描等）：先明确声明"仅用于教学/授权安全测试，禁止非法使用"，从防御或原理示意角度讲，不输出可直接部署伤害他人的成品武器化代码；把风险与法律责任说清楚。
3) 用简体中文，口语直接，别端着。`;}
function attachRun(msg){msg.querySelectorAll('pre.cb').forEach(pre=>{const code=pre.querySelector('code').innerText;const lang=pre.dataset.lang||'';
  if(lang==='html'||lang==='javascript'||lang==='js'){const b=document.createElement('button');b.className='run';b.textContent='▶ 运行';b.onclick=()=>{const w=window.open('','_blank');w.document.write('<!DOCTYPE html><meta charset=utf-8><title>运行</title><style>body{font-family:sans-serif;padding:16px}</style>'+code);};pre.appendChild(b);}});}
async function send(){
  const text=input.value.trim();if(!text||busy)return;
  input.value='';input.style.height='50px';
  addMsg('me',text); // 用户消息原样显示（已修复不显示bug）
  busy=true;sendBtn.disabled=true;
  const t=document.createElement('div');t.className='msg ai';t.innerHTML=`<div class="mav">Q</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;log.appendChild(t);log.scrollTop=log.scrollHeight;
  const sys=buildSys();let res=null;
  try{res=await QA.ask(sys,text+'\\n（用'+curLang+'写）');}catch(e){res=null;}
  t.remove();
  if(res&&res.text){addMsg('ai',QA.md(res.text));document.getElementById('mn').textContent='已用：'+QA.ENGINES[res.eng].name.split('（')[0];}
  else{addMsg('ai','⚠️ 免密引擎连不上（你网络可能挡了国外站）。点右上「🔑 升级模型」填个智谱免费 key（手机号注册、免身份证）即可墙内直连稳写。');document.getElementById('mn').textContent='全部引擎不可用';}
  busy=false;sendBtn.disabled=false;input.focus();
}
function onKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}
input.addEventListener('input',()=>{input.style.height='50px';input.style.height=Math.min(input.scrollHeight,140)+'px';});
function openKeyModal(){const rows=document.getElementById('keyRows');rows.innerHTML='';['zhipu','deepseek','siliconflow','qwen','moonshot','cups','chatanywhere'].forEach(k=>{const e=QA.ENGINES[k];const r=document.createElement('div');r.className='row';r.innerHTML=`<b>${e.name.split('（')[0]}</b><span>ID: ${k}</span>${e.apply?`<a class="go" href="${e.apply}" target="_blank">去拿key →</a>`:''}`;rows.appendChild(r);});document.getElementById('keyMsg').textContent='';document.getElementById('keyMask').classList.add('open');}
function closeKeyModal(){document.getElementById('keyMask').classList.remove('open');}
function importKeys(){const raw=document.getElementById('batchKeys').value.trim();if(!raw){document.getElementById('keyMsg').textContent='请输入内容';document.getElementById('keyMsg').style.color='#dc2626';return;}let ok=0,fail=0;raw.split('\\n').forEach(line=>{const i=line.indexOf(':');if(i<1)return;const id=line.slice(0,i).trim();const key=line.slice(i+1).trim();if(QA.ENGINES[id]&&key){localStorage['key_'+id]=key;ok++;}else if(key)fail++;});const m=document.getElementById('keyMsg');m.style.color='#16a34a';m.textContent=`✅ 导入 ${ok} 个${fail?`，${fail} 个未知ID忽略`:''}。`;}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeKeyModal();});
clearChat();
</script>
</body>
</html>
