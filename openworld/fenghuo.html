<!DOCTYPE html><html lang="zh"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>烽火地带 · 直升机开场</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#111;touch-action:none;font-family:sans-serif}
#c{display:block;width:100%;height:100%}
#skip{position:fixed;bottom:20px;right:16px;z-index:99;color:rgba(255,255,255,.3);font-size:11px;padding:6px 14px;border:1px solid rgba(255,255,255,.1);border-radius:4px;cursor:pointer;pointer-events:auto}#skip:active{color:#f60}
</style></head><body>
<canvas id="c"></canvas>
<div id="skip" onclick="window._skip=true;this.style.display='none'">跳过</div>
<script>
(function(){
var C=document.getElementById('c'),ctx=C.getContext('2d');
var W=innerWidth,H=innerHeight,START=0,NOW=0;
C.width=W;C.height=H;
window.addEventListener('resize',function(){W=C.width=innerWidth;H=C.height=innerHeight});
window._skip=false;

// ========== HELPERS ==========
function clamp(v,a,b){return v<a?a:v>b?b:v}
function lerp(a,b,t){return a+(b-a)*t}
function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2}

// ========== PARTICLES ==========
var P=[];
function emit(x,y,vx,vy,life,col,sz){
 P.push({x:x,y:y,vx:vx||0,vy:vy||0,life:life||1,ml:life||1,col:col||'#fff',sz:sz||1});
}
function blast(x,y,big){
 var n=big?80:30;
 for(var i=0;i<n;i++){
  var a=Math.random()*Math.PI*2,sp=20+Math.random()*(big?200:80);
  emit(x,y,Math.cos(a)*sp,Math.sin(a)*sp,.5+Math.random()*(big?3:1),['#f20','#f40','#f60','#f80','#fa0','#fc0','#fd4','#fff','#320','#210'][i%10],1+Math.random()*(big?4:2));
 }
}

// ========== DRAW: HELICOPTER ==========
function drawHeli(x,y,sz,rotorA){
 ctx.save();ctx.translate(x,y);ctx.scale(sz,sz);
 // shadow
 ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(0,6,18,2.5,0,0,Math.PI*2);ctx.fill();
 // body - draw manually with lines (NO roundRect)
 ctx.fillStyle='#3a3a3a';
 ctx.beginPath();
 ctx.arc(-12,0,7,Math.PI*.5,Math.PI*1.5,false);
 ctx.lineTo(18,-5);ctx.lineTo(18,5);
 ctx.arc(-12,0,7,Math.PI*1.5,Math.PI*.5,false);
 ctx.closePath();ctx.fill();
 ctx.strokeStyle='#555';ctx.lineWidth=1;ctx.stroke();
 // nose
 ctx.fillStyle='#444';ctx.beginPath();ctx.moveTo(-19,-2);ctx.lineTo(-25,0);ctx.lineTo(-19,2);ctx.closePath();ctx.fill();
 // cockpit
 ctx.fillStyle='rgba(0,160,255,.45)';ctx.beginPath();ctx.ellipse(-15,0,5,2.5,-0.1,0,Math.PI*2);ctx.fill();
 // tail boom
 ctx.fillStyle='#3a3a3a';ctx.fillRect(16,-1,25,2);
 // tail fin
 ctx.fillStyle='#333';ctx.beginPath();ctx.moveTo(41,-1);ctx.lineTo(45,-8);ctx.lineTo(47,-1);ctx.closePath();ctx.fill();
 // tail rotor
 ctx.fillStyle='#777';ctx.save();ctx.translate(44,0);ctx.rotate(rotorA*3);ctx.fillRect(-3,-.15,6,.3);ctx.restore();
 // main rotor mast
 ctx.fillStyle='#555';ctx.fillRect(-1,-5,2,3);
 // main rotor
 ctx.fillStyle='rgba(200,200,200,.8)';ctx.save();ctx.translate(0,-6);
 for(var i=0;i<4;i++){ctx.rotate(Math.PI/2);ctx.fillRect(-18,-.3,36,.6)}ctx.restore();
 // rotor hub
 ctx.fillStyle='#444';ctx.beginPath();ctx.arc(0,-6,2.5,0,Math.PI*2);ctx.fill();
 // skids
 ctx.fillStyle='#444';ctx.fillRect(-10,3,1.5,6);ctx.fillRect(10,3,1.5,6);
 ctx.fillStyle='#555';ctx.fillRect(-13,9,28,.8);
 ctx.restore();
}

// ========== DRAW: DAM ==========
function drawDam(x,y,broken){
 ctx.save();ctx.translate(x,y);
 var dw=200,dh=H*.5;
 // Main wall
 var grd=ctx.createLinearGradient(0,-dh,0,0);
 grd.addColorStop(0,'#778899');grd.addColorStop(.5,'#667788');grd.addColorStop(1,'#556677');
 ctx.fillStyle=grd;
 ctx.beginPath();ctx.moveTo(-dw/2,-dh);ctx.lineTo(dw/2,-dh);ctx.lineTo(dw/2,0);ctx.lineTo(-dw/2,0);ctx.closePath();ctx.fill();
 ctx.strokeStyle='#889';ctx.lineWidth=1.5;ctx.stroke();
 // Gate
 ctx.fillStyle='#333';
 ctx.beginPath();ctx.moveTo(-28,-dh*.65);ctx.lineTo(28,-dh*.65);ctx.lineTo(28,0);ctx.lineTo(-28,0);ctx.closePath();ctx.fill();
 ctx.strokeStyle='#555';ctx.stroke();
 // Gate lines
 ctx.strokeStyle='#444';ctx.beginPath();ctx.moveTo(-28,-dh*.35);ctx.lineTo(28,-dh*.35);ctx.stroke();
 ctx.beginPath();ctx.moveTo(-28,-dh*.5);ctx.lineTo(28,-dh*.5);ctx.stroke();
 // Water on top (reservoir)
 ctx.fillStyle='rgba(20,60,100,.45)';ctx.fillRect(-dw/2-15,-dh-25,dw+30,25);
 // Control tower
 ctx.fillStyle='#556';ctx.fillRect(-12,-dh-22,24,22);
 ctx.fillStyle='rgba(0,140,255,.25)';ctx.fillRect(-8,-dh-18,16,8);
 
 if(broken){
  // gate destroyed
  ctx.fillStyle='#222';ctx.beginPath();ctx.moveTo(-32,-dh*.65);ctx.lineTo(32,-dh*.65);ctx.lineTo(28,-dh*.1);ctx.lineTo(-28,-dh*.1);ctx.closePath();ctx.fill();
  // cracks
  ctx.strokeStyle='rgba(0,0,0,.6)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-25,-dh*.6);ctx.lineTo(-45,-dh*.4);ctx.moveTo(25,-dh*.6);ctx.lineTo(40,-dh*.3);ctx.stroke();
  // rubble
  ctx.fillStyle='#333';ctx.fillRect(-20,-20,40,12);
 }
 ctx.restore();
}

// ========== DRAW: SPACE BASE ==========
function drawBase(x,y,broken){
 ctx.save();ctx.translate(x,y);
 var th=180;
 // Ground platform
 ctx.fillStyle='#333';ctx.fillRect(-70,0,140,10);
 // Stripes
 for(var i=0;i<18;i++){ctx.fillStyle=i%2?'#fa0':'#333';ctx.fillRect(-70+i*8,0,8,10)}
 // Tower
 ctx.fillStyle='#667';ctx.fillRect(-10,-th,20,th);
 ctx.strokeStyle='#889';ctx.lineWidth=1;ctx.strokeRect(-10,-th,20,th);
 // Crossbars
 for(var j=0;j<7;j++){var y2=-th+(j+1)*th/8;ctx.strokeStyle='#889';ctx.beginPath();ctx.moveTo(-10,y2);ctx.lineTo(10,y2);ctx.stroke()}
 // Top platform
 ctx.fillStyle='#556';ctx.fillRect(-15,-th-8,30,10);ctx.strokeStyle='#889';ctx.strokeRect(-15,-th-8,30,10);
 // Antenna
 ctx.fillStyle='#f00';ctx.beginPath();ctx.moveTo(0,-th-28);ctx.lineTo(-3,-th-8);ctx.lineTo(3,-th-8);ctx.closePath();ctx.fill();
 if(!broken){ctx.fillStyle='rgba(255,0,0,.5)';ctx.beginPath();ctx.arc(0,-th-28,4,0,Math.PI*2);ctx.fill()}
 // Rocket on tower
 if(!broken){
  ctx.fillStyle='#ccc';ctx.beginPath();ctx.moveTo(-5,-th+8);ctx.lineTo(5,-th+8);ctx.lineTo(5,0);ctx.lineTo(-5,0);ctx.closePath();ctx.fill();
  ctx.fillStyle='#d20';ctx.beginPath();ctx.moveTo(0,-th-3);ctx.lineTo(-5,-th+8);ctx.lineTo(5,-th+8);ctx.closePath();ctx.fill();
  // fins
  ctx.fillStyle='#d20';ctx.beginPath();ctx.moveTo(-5,-3);ctx.lineTo(-13,4);ctx.lineTo(-5,4);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(5,-3);ctx.lineTo(13,4);ctx.lineTo(5,4);ctx.closePath();ctx.fill();
 }
 // Bridge
 ctx.fillStyle='#555';ctx.fillRect(-120,-3,120,8);
 ctx.strokeStyle='#666';ctx.strokeRect(-120,-3,120,8);
 ctx.restore();
}

// ========== DRAW: MOUNTAINS ==========
function drawMnts(t){
 ctx.fillStyle='#151a25';
 ctx.beginPath();ctx.moveTo(0,H*.55);
 for(var x=0;x<=W;x+=5){ctx.lineTo(x,H*.52-Math.sin(x*.003+t*.01)*35-Math.sin(x*.006+t*.008)*25)}
 ctx.lineTo(W,H*.62);ctx.lineTo(0,H*.62);ctx.closePath();ctx.fill();
 ctx.fillStyle='#1a2030';
 ctx.beginPath();ctx.moveTo(0,H*.58);
 for(var x=0;x<=W;x+=5){ctx.lineTo(x,H*.55-Math.sin(x*.004+t*.012)*40-Math.cos(x*.003+t*.01)*28)}
 ctx.lineTo(W,H*.65);ctx.lineTo(0,H*.65);ctx.closePath();ctx.fill();
}

// ========== MAIN LOOP ==========
var lastT=0,totalT=0;
var damBoom=false,rocketBoom=false,shake=0;

function loop(now){
 requestAnimationFrame(loop);
 if(!lastT){lastT=now;START=now;return}
 if(window._skip)return;
 var dt=Math.min(.15,(now-lastT)/1000);lastT=now;
 if(dt<.001)dt=.016;
 totalT=(now-START)/1000;

 if(shake>0){shake*=Math.pow(.9,dt*60)}else shake=0;
 var sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;

 // == ENTIRE SCENE on ONE canvas - simple and reliable ==
 ctx.clearRect(0,0,W,H);

 // ===== SKY =====
 var sky=ctx.createLinearGradient(0,0,0,H);
 if(totalT<5){
  sky.addColorStop(0,'#002');sky.addColorStop(.5,'#012');sky.addColorStop(1,'#023');
 }else{
  sky.addColorStop(0,'#081524');sky.addColorStop(.3,'#102238');sky.addColorStop(.6,'#182d48');sky.addColorStop(1,'#203852');
 }
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

 // Stars
 for(var s=0;s<60;s++){
  var sx2=(s*137+50)%W,sy2=(s*89+30)%(H*.4);
  ctx.fillStyle='rgba(255,255,255,'+(.2+.3*Math.sin(totalT+s))+.2+')';
  ctx.beginPath();ctx.arc(sx2,sy2,.5+Math.random()*.4,0,Math.PI*2);ctx.fill();
 }

 // Moon
 var mx=W*.78,my=H*.1;
 ctx.fillStyle='rgba(255,245,235,.85)';ctx.beginPath();ctx.arc(mx,my,25,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#081524';ctx.beginPath();ctx.arc(mx+8,my-4,20,0,Math.PI*2);ctx.fill();

 // Mountains
 drawMnts(totalT);

 // Ground
 ctx.fillStyle='#0f150a';ctx.fillRect(0,H*.56,W,H*.44);

 // ===== SCENE LOGIC =====
 var phase='';
 if(totalT<4)phase='FADEIN';
 else if(totalT<14)phase='APPROACH';
 else if(totalT<22)phase='DAMVIEW';
 else if(totalT<24)phase='DAMHIT';
 else if(totalT<30)phase='AFTERMATH';
 else if(totalT<36)phase='TRANS';
 else if(totalT<44)phase='BASEREVEAL';
 else if(totalT<46)phase='ROCKETHIT';
 else if(totalT<52)phase='AFTERMATH2';
 else if(totalT<60)phase='FINALFLY';
 else phase='OUTRO';

 var heliX=0,heliY=0,heliSz=.6;

 switch(phase){
  case 'FADEIN':
   ctx.fillStyle='rgba(0,0,0,'+(1-totalT/3)+')';ctx.fillRect(0,0,W,H);
   break;

  case 'APPROACH':
   var t=totalT-4;
   heliX=lerp(W+120,W*.62,ease(clamp(t/8,0,1)));
   heliY=lerp(H*.32,H*.34,ease(clamp(t/8,0,1)));
   heliSz=lerp(.4,.65,ease(clamp(t/8,0,1)));
   drawHeli(heliX+sx,heliY+sy,heliSz,totalT*14);
   // Brief operator POV
   if(t>2.5&&t<5){
    ctx.fillStyle='rgba(0,0,0,'+(.2+.15*Math.sin(t*6))+.2+')';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(255,255,255,.06)';ctx.font='bold '+(W<400?16:24)+'px sans-serif';ctx.textAlign='center';
    ctx.fillText('烽火地带',W/2,H*.42);
    ctx.fillStyle='rgba(255,255,255,.04)';ctx.font=(W<400?10:13)+'px sans-serif';
    ctx.fillText('DELTA FORCE · HAWK OPS',W/2,H*.46);
   }
   drawDam(W*.58,H*.55,false);
   break;

  case 'DAMVIEW':
   var t2=totalT-14;
   var ang=t2*1.3;
   heliX=W*.58+Math.cos(ang)*180;
   heliY=H*.38+Math.sin(ang)*35;
   heliSz=.6;
   drawHeli(heliX+sx,heliY+sy,heliSz,totalT*14);
   drawDam(W*.58,H*.55,false);
   // searchlights
   ctx.fillStyle='rgba(255,255,180,.04)';ctx.beginPath();ctx.moveTo(W*.38,H*.5);ctx.lineTo(W*.55,H*.28);ctx.lineTo(W*.62,H*.3);ctx.closePath();ctx.fill();
   ctx.fillStyle='rgba(255,255,180,.03)';ctx.beginPath();ctx.moveTo(W*.72,H*.5);ctx.lineTo(W*.6,H*.25);ctx.lineTo(W*.68,H*.22);ctx.closePath();ctx.fill();
   if(t2>3&&t2<7){
    ctx.fillStyle='rgba(255,255,255,'+(.04+.03*Math.sin(t2*2))+.05+')';
    ctx.font='bold '+(W<400?15:22)+'px sans-serif';ctx.textAlign='center';
    ctx.fillText('零号大坝',W*.58,H*.65);
    ctx.font=(W<400?8:10)+'px sans-serif';ctx.fillText('ZERO DAM',W*.58,H*.67);
   }
   break;

  case 'DAMHIT':
   drawDam(W*.58,H*.55,true);
   if(!damBoom){damBoom=true;blast(W*.58,H*.32,true);blast(W*.61,H*.35,true);shake=60}
   // missiles
   ctx.fillStyle='#f40';ctx.beginPath();ctx.moveTo(W*.28,H*.22);ctx.lineTo(W*.38,H*.28);ctx.lineTo(W*.36,H*.25);ctx.closePath();ctx.fill();
   ctx.fillStyle='#fc0';ctx.beginPath();ctx.moveTo(W*.3,H*.23);ctx.lineTo(W*.4,H*.29);ctx.lineTo(W*.38,H*.26);ctx.closePath();ctx.fill();
   ctx.fillStyle='#f40';ctx.beginPath();ctx.moveTo(W*.22,H*.3);ctx.lineTo(W*.32,H*.34);ctx.lineTo(W*.3,H*.31);ctx.closePath();ctx.fill();
   ctx.fillStyle='rgba(255,180,100,'+(.3+.2*Math.sin(totalT*18))+.3+')';ctx.fillRect(0,0,W,H);
   break;

  case 'AFTERMATH':
   drawDam(W*.58,H*.55,true);
   drawHeli(W*.42+sx,H*.35+sy+Math.sin(totalT)*4,.45,totalT*11);
   if(totalT<28){
    ctx.fillStyle='rgba(255,150,50,'+((28-totalT)/4*.15)+')';
    ctx.font='bold '+(W<400?13:18)+'px sans-serif';ctx.textAlign='center';
    ctx.fillText('金库大门已被炸开',W*.58,H*.68);
   }
   break;

  case 'TRANS':
   var tf=clamp((totalT-30)/3,0,1);
   drawDam(W*.58,H*.55,true);
   ctx.fillStyle='rgba(0,0,0,'+tf+')';ctx.fillRect(0,0,W,H);
   break;

  case 'BASEREVEAL':
   var t3=totalT-36;
   drawBase(W*.5,H*.45,false);
   heliX=lerp(W+100,W*.32,ease(clamp(t3/6,0,1)));
   heliY=lerp(H*.3,H*.22,ease(clamp(t3/6,0,1)));
   drawHeli(heliX+sx,heliY+sy,.48,totalT*14);
   if(t3>2.5&&t3<5){
    ctx.fillStyle='rgba(255,255,255,'+(.03+.02*Math.sin(t3*3))+.04+')';
    ctx.font='bold '+(W<400?15:22)+'px sans-serif';ctx.textAlign='center';
    ctx.fillText('航天基地',W*.5,H*.68);
    ctx.font=(W<400?8:10)+'px sans-serif';ctx.fillText('SPACE BASE',W*.5,H*.7);
   }
   // industrial silhouette
   ctx.fillStyle='#111520';for(var b=0;b<12;b++){ctx.fillRect(W*.15+b*33,H*.62,-15,-(20+Math.abs(Math.sin(b*1.3))*80))}
   break;

  case 'ROCKETHIT':
   drawBase(W*.5,H*.45,true);
   if(!rocketBoom){rocketBoom=true;blast(W*.5,H*.25,true);shake=80}
   ctx.fillStyle='rgba(255,150,50,'+(.4+.3*Math.sin(totalT*14))+.4+')';ctx.fillRect(0,0,W,H);
   drawHeli(W*.38+sx,H*.28+sy+Math.sin(totalT)*6,.42,totalT*11);
   break;

  case 'AFTERMATH2':
   drawBase(W*.5,H*.45,true);
   // broken bridge - draw manually
   ctx.fillStyle='#555';ctx.fillRect(W*.3,-3+H*.45,60,8);ctx.strokeStyle='#666';ctx.strokeRect(W*.3,-3+H*.45,60,8);
   ctx.save();ctx.translate(W*.38,H*.45);ctx.rotate(.25);ctx.fillStyle='#444';ctx.fillRect(0,-3,40,8);ctx.restore();
   drawHeli(W*.58+sx,H*.32+sy+Math.cos(totalT*.7)*7,.5,totalT*13);
   ctx.fillStyle='rgba(255,150,50,'+(.25+.15*Math.sin(totalT*9))+.25+')';ctx.fillRect(0,0,W,H);
   break;

  case 'FINALFLY':
   drawBase(W*.5,H*.45,true);
   var t5=totalT-52;
   var hlX=W*.3+Math.sin(t5)*160,hlY=H*.38-t5*7;
   drawHeli(hlX+sx,hlY+sy,.55+t5/30,totalT*16);
   if(t5>3.5&&t5<6.5){
    ctx.fillStyle='rgba(255,255,255,.07)';ctx.font='bold '+(W<400?15:24)+'px sans-serif';ctx.textAlign='center';
    ctx.fillText('烽火地带 · 即将部署',W/2,H*.42);
    ctx.font=(W<400?10:13)+'px sans-serif';ctx.fillText('准备空降',W/2,H*.46);
   }
   if(t5>6.5){ctx.fillStyle='rgba(0,0,0,'+((t5-6.5)/2)+')';ctx.fillRect(0,0,W,H)}
   break;

  case 'OUTRO':
   ctx.fillStyle='rgba(0,0,0,'+clamp((totalT-60)/2,.5,1)+')';ctx.fillRect(0,0,W,H);
   break;
 }

 // ===== PARTICLES =====
 for(var i=P.length-1;i>=0;i--){
  var p=P[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
  if(p.life<=0){P.splice(i,1);continue}
  p.vy+=50*dt;
  var a=clamp(p.life/p.ml,0,1);
  ctx.fillStyle='rgba(255,255,255,0)'; // default
  try{var c=p.col;if(c[0]==='#'){var r=parseInt(c.substr(1,2),16),g=parseInt(c.substr(3,2),16),b=parseInt(c.substr(5,2),16);ctx.fillStyle='rgba('+r+','+g+','+b+','+a+')'}else{ctx.fillStyle=c}}catch(e){ctx.fillStyle='rgba(255,100,0,'+a+')'}
  ctx.beginPath();ctx.arc(p.x,p.y,p.sz*a,0,Math.PI*2);ctx.fill();
 }

 // ===== HUD =====
 ctx.fillStyle='rgba(255,255,255,.25)';ctx.font='10px sans-serif';ctx.textAlign='right';
 var mT=Math.floor(totalT),min=Math.floor(mT/60),sec=mT%60;
 ctx.fillText((min<10?'0'+min:min)+':'+(sec<10?'0'+sec:sec)+' / 01:08',W-12,16);
 ctx.textAlign='left';
 var nmap='';
 if(phase==='DAMVIEW'||phase==='DAMHIT'||phase==='AFTERMATH')nmap='零号大坝';
 if(phase==='BASEREVEAL'||phase==='ROCKETHIT'||phase==='AFTERMATH2'||phase==='FINALFLY')nmap='航天基地';
 ctx.fillText(nmap,12,16);
}
requestAnimationFrame(loop);
})();</script></body></html>
