(function(){

// =====================================================

var rwBot=new THREE.Mesh(new THREE.PlaneGeometry(.3,6),new THREE.MeshBasicMaterial({color:0x1a1a1a}));
rwBot.position.set(2,-.5,0);rwBot.rotation.y=-Math.PI/2;cabin.add(rwBot);
var rwFront=new THREE.Mesh(new THREE.PlaneGeometry(.3,2.5),new THREE.MeshBasicMaterial({color:0x222222}));
rwFront.position.set(2,.35,2.8);rwFront.rotation.y=-Math.PI/2;cabin.add(rwFront);
var rwBack=new THREE.Mesh(new THREE.PlaneGeometry(.3,2.5),new THREE.MeshBasicMaterial({color:0x222222}));

 var fr=new THREE.Mesh(new THREE.BoxGeometry(.08,h,.08),new THREE.MeshBasicMaterial({color:0x333333}));

}
// Left window frames

addFrame(-2,1.7,-1,.08,2.5);addFrame(-2,1.7,1,.08,2.5);
addFrame(-2,.5,-2,.08,.6);addFrame(-2,.5,2,.08,.6);
addFrame(-2,1.7,-2,.08,.6);addFrame(-2,1.7,2,.08,.6);
addFrame(-2,-.8,-2,.08,.6);addFrame(-2,-.8,2,.08,.6);

hbR1=new THREE.Mesh(new THREE.BoxGeometry(.08,.08,4),new THREE.MeshBasicMaterial({color:0x333333}));
hbR1.position.set(2,.5,1);cabin.add(hbR1);
// Front window frames
addFrame(0,.5,3,4,.08);addFrame(0,1.7,3,4,.08);

addFrame(-1,1.7,3,.08,.6);addFrame(1,1.7,3,.08,.6);

// Glass panes (semi-transparent)
var glassMat=new THREE.MeshBasicMaterial({color:0x223344,transparent:true,opacity:.15});

gLeft.position.set(-1.99,.5,-1);gLeft.rotation.y=Math.PI/2;cabin.add(gLeft);
gLeft=new THREE.Mesh(new THREE.PlaneGeometry(.1,2.3),glassMat);
gLeft.position.set(-1.99,.5,1);gLeft.rotation.y=Math.PI/2;cabin.add(gLeft);
var gRight=new THREE.Mesh(new THREE.PlaneGeometry(.1,2.3),glassMat);
gRight.position.set(1.99,.5,-1);gRight.rotation.y=-Math.PI/2;cabin.add(gRight);
gRight=new THREE.Mesh(new THREE.PlaneGeometry(.1,2.3),glassMat);
gRight.position.set(1.99,.5,1);gRight.rotation.y=-Math.PI/2;cabin.add(gRight);
var gFront=new THREE.Mesh(new THREE.PlaneGeometry(3.8,.6),glassMat);
gFront.position.set(0,.5,2.99);cabin.add(gFront);

// Ceiling bars
for(var i=0;i<4;i++){
 var cb=new THREE.Mesh(new THREE.BoxGeometry(3.8,.06,.06),new THREE.MeshBasicMaterial({color:0x2a2a2a}));
 cb.position.set(0,2.4,-2+i*1.5);cabin.add(cb);
}
// Central ceiling rail
var cr=new THREE.Mesh(new THREE.BoxGeometry(.06,.06,6),new THREE.MeshBasicMaterial({color:0x2a2a2a}));
cr.position.set(0,2.45,0);cabin.add(cr);

// ===== SEATS (4 operators) =====
var seatMat=new THREE.MeshBasicMaterial({color:0x1a1a18});
var frameMat=new THREE.MeshBasicMaterial({color:0x2a2a2a});
var helmets=[];
var ops=[];
for(var i=0;i<4;i++){
 var sx=-1.2+(i%2)*2.4,sz=(Math.floor(i/2))*2-1.5;
 // Seat base
 var sb=new THREE.Mesh(new THREE.BoxGeometry(.8,.15,.8),seatMat);
 sb.position.set(sx,-.7,sz);cabin.add(sb);
 // Seat back
 var sback=new THREE.Mesh(new THREE.BoxGeometry(.7,.8,.1),seatMat);
 sback.position.set(sx,-.2,sz+.35);cabin.add(sback);
 // Operative body
 var body=new THREE.Mesh(new THREE.BoxGeometry(.5,.6,.3),new THREE.MeshBasicMaterial({color:0x1a1a18}));
 body.position.set(sx,.2,sz+.1);cabin.add(body);
 // Head
 var head=new THREE.Mesh(new THREE.SphereGeometry(.22,8,6),new THREE.MeshBasicMaterial({color:0x2a2a25}));
 head.position.set(sx,.65,sz+.1);cabin.add(head);ops.push(head);
 // Helmet
 var helm=new THREE.Mesh(new THREE.SphereGeometry(.25,8,6,0,Math.PI*2,0,Math.PI*.6),new THREE.MeshBasicMaterial({color:0x1a1a1a}));
 helm.position.set(sx,.7,sz+.05);cabin.add(helm);helmets.push(helm);
 // NVG goggles
 var nvg=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,.08,8),new THREE.MeshBasicMaterial({color:0x003322}));
 nvg.position.set(sx-.04,.64,sz+.25);nvg.rotation.x=Math.PI/2;cabin.add(nvg);
 nvg=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,.08,8),new THREE.MeshBasicMaterial({color:0x003322}));
 nvg.position.set(sx+.04,.64,sz+.25);nvg.rotation.x=Math.PI/2;cabin.add(nvg);
 // Weapon
 var wpn=new THREE.Mesh(new THREE.BoxGeometry(.06,.05,.4),new THREE.MeshBasicMaterial({color:0x111111}));
 wpn.position.set(sx-.3,-.2,sz+.3);cabin.add(wpn);
 wpn=new THREE.Mesh(new THREE.BoxGeometry(.04,.04,.15),new THREE.MeshBasicMaterial({color:0x1a1a1a}));
 wpn.position.set(sx-.3,-.1,sz+.5);cabin.add(wpn);
}

// ===== RED CABIN LIGHT (overhead) =====
var cabinLight=new THREE.Mesh(new THREE.SphereGeometry(.15,6,6),new THREE.MeshBasicMaterial({color:0xff2200}));
cabinLight.position.set(0,2.3,0);cabin.add(cabinLight);
var clGlow=new THREE.Mesh(new THREE.SphereGeometry(.8,6,6),new THREE.MeshBasicMaterial({color:0xff2200,transparent:true,opacity:.08}));
clGlow.position.set(0,2.3,0);cabin.add(clGlow);

// ===== CABLE from ceiling (hanging) =====
var cable=new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,1.5,6),new THREE.MeshBasicMaterial({color:0x333333}));
cable.position.set(.5,1.6,1.5);cabin.add(cable);
// Cable end - headset/comm unit
var he=new THREE.Mesh(new THREE.BoxGeometry(.15,.1,.15),new THREE.MeshBasicMaterial({color:0x1a1a1a}));
he.position.set(.5,.85,1.5);cabin.add(he);

// Console / instrument panel (forward, just below front window)
var console2=new THREE.Mesh(new THREE.BoxGeometry(3,.3,.4),new THREE.MeshBasicMaterial({color:0x1a1a1a}));
console2.position.set(0,-.3,2.7);cabin.add(console2);
// Screen/display  
var scr=new THREE.Mesh(new THREE.PlaneGeometry(1.2,.25),new THREE.MeshBasicMaterial({color:0x002233}));
scr.position.set(0,-.1,2.9);cabin.add(scr);
// Buttons
for(var b=0;b<6;b++){
 var btn=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,.02,6),new THREE.MeshBasicMaterial({color:['#f00','#0f0','#ff0','#0ff','#f80','#fff'][b]}));
 btn.position.set(-1+b*.4,-.1,2.92);btn.rotation.x=Math.PI/2;cabin.add(btn);
}

// ===== OUTSIDE WORLD =====
// Ground
var terrain=new THREE.Mesh(new THREE.PlaneGeometry(800,800),new THREE.MeshBasicMaterial({color:0x1a3010}));
terrain.rotation.x=-Math.PI/2;terrain.position.y=-20;S.add(terrain);

// Road
for(var r2=0;r2<10;r2++){
 var rd=new THREE.Mesh(new THREE.PlaneGeometry(5,800),new THREE.MeshBasicMaterial({color:0x2a2a2a}));
 rd.rotation.x=-Math.PI/2;rd.rotation.z=(r2/10)*Math.PI*2;rd.position.y=-19.98;S.add(rd);
}

// Mountains
for(var m2=0;m2<40;m2++){
 var mx2=(Math.random()-.5)*700,mz2=(Math.random()-.5)*700;
 if(mx2*mx2+mz2*mz2<4000)continue;
 var mh=15+Math.random()*120;
 S.add(new THREE.Mesh(new THREE.ConeGeometry(20+Math.random()*80,mh,8,6),new THREE.MeshBasicMaterial({color:Math.random()<.5?0x2a2018:0x1a2818}))).position.set(mx2,-20+mh/2,mz2);
}

// Trees
for(var t3=0;t3<300;t3++){
 var tx3=(Math.random()-.5)*600,tz3=(Math.random()-.5)*600;
 if(tx3*tx3+tz3*tz3<2000)continue;
 S.add(new THREE.Mesh(new THREE.CylinderGeometry(.1,.15,3+Math.random()*4,6),new THREE.MeshBasicMaterial({color:0x3a2010}))).position.set(tx3,-18,tz3);
 S.add(new THREE.Mesh(new THREE.SphereGeometry(.8+Math.random()*1.5,5,4),new THREE.MeshBasicMaterial({color:0x1a3315}))).position.set(tx3,-14+Math.random()*2,tz3);
}

// ===== ZERO DAM (at z=-60) =====
var damGroup=new THREE.Group();
var damWall=new THREE.Mesh(new THREE.BoxGeometry(60,35,6),new THREE.MeshBasicMaterial({color:0x667788}));
damWall.position.set(0,-2,-60);damGroup.add(damWall);
// Gate
var damGate=new THREE.Mesh(new THREE.BoxGeometry(12,20,8),new THREE.MeshBasicMaterial({color:0x2a2a2a}));
damGate.position.set(0,-5,-62);damGroup.add(damGate);
// Gate detail lines
for(var dl=0;dl<5;dl++){
 var dln=new THREE.Mesh(new THREE.BoxGeometry(12,.2,.2),new THREE.MeshBasicMaterial({color:0x3a3a3a}));
 dln.position.set(0,-10+dl*4,-65);damGroup.add(dln);
}
// Control tower
var ct=new THREE.Mesh(new THREE.BoxGeometry(5,8,5),new THREE.MeshBasicMaterial({color:0x556666}));
ct.position.set(-25,3,-60);damGroup.add(ct);
// Water (reservoir behind dam)
var waterr=new THREE.Mesh(new THREE.PlaneGeometry(60,15),new THREE.MeshBasicMaterial({color:0x112244}));
waterr.rotation.x=-Math.PI/2;waterr.position.set(0,4,-58);damGroup.add(waterr);
// Ridge/wall on sides
var ridgeL=new THREE.Mesh(new THREE.BoxGeometry(8,35,20),new THREE.MeshBasicMaterial({color:0x556655}));
ridgeL.position.set(-34,-2,-58);damGroup.add(ridgeL);
var ridgeR=new THREE.Mesh(new THREE.BoxGeometry(8,35,20),new THREE.MeshBasicMaterial({color:0x556655}));
ridgeR.position.set(34,-2,-58);damGroup.add(ridgeR);
damGroup.userData={gate:damGate,intact:true};
S.add(damGroup);

// ===== SPACE BASE (at z=80) =====
var baseGroup=new THREE.Group();
// Platform
var pl=new THREE.Mesh(new THREE.BoxGeometry(30,1,30),new THREE.MeshBasicMaterial({color:0x3a3a3a}));
pl.position.set(0,-19,80);baseGroup.add(pl);
// Tower
var twr4=new THREE.Mesh(new THREE.BoxGeometry(4,35,4),new THREE.MeshBasicMaterial({color:0x556677}));
twr4.position.set(0,-2,80);baseGroup.add(twr4);
// Crossbars
for(var cb2=0;cb2<6;cb2++){
 var cross=new THREE.Mesh(new THREE.BoxGeometry(6,.2,.2),new THREE.MeshBasicMaterial({color:0x778899}));
 cross.position.set(0,-12+cb2*4,80);baseGroup.add(cross);
}
// Top platform
var topp=new THREE.Mesh(new THREE.BoxGeometry(8,1,8),new THREE.MeshBasicMaterial({color:0x445566}));
topp.position.set(0,5,80);baseGroup.add(topp);
// Antenna
var ant=new THREE.Mesh(new THREE.BoxGeometry(.2,6,.2),new THREE.MeshBasicMaterial({color:0xcc0000}));
ant.position.set(0,8,80);baseGroup.add(ant);
var antLight2=new THREE.Mesh(new THREE.SphereGeometry(.4,6,6),new THREE.MeshBasicMaterial({color:0xff0000}));
antLight2.position.set(0,11,80);baseGroup.add(antLight2);
// Rocket on tower
var rocket=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.5,15,10),new THREE.MeshBasicMaterial({color:0xcccccc}));
rocket.position.set(0,9,80);baseGroup.add(rocket);
var coneR=new THREE.Mesh(new THREE.ConeGeometry(1.3,3,10),new THREE.MeshBasicMaterial({color:0xcc2200}));
coneR.position.set(0,18,80);baseGroup.add(coneR);
// Fins
for(var fn=0;fn<3;fn++){
 var ang3=fn*Math.PI*2/3;
 var fin3=new THREE.Mesh(new THREE.BoxGeometry(.1,3.5,.8),new THREE.MeshBasicMaterial({color:0xcc2200}));
 fin3.position.set(Math.cos(ang3)*1.5,1.5,80+Math.sin(ang3)*1.5);fin3.rotation.z=ang3;baseGroup.add(fin3);
}
// Support arms
var armL=new THREE.Mesh(new THREE.BoxGeometry(.15,10,.15),new THREE.MeshBasicMaterial({color:0x667788}));
armL.position.set(-2.5,-10,80);armL.rotation.z=.3;baseGroup.add(armL);
var armR=new THREE.Mesh(new THREE.BoxGeometry(.15,10,.15),new THREE.MeshBasicMaterial({color:0x667788}));
armR.position.set(2.5,-10,80);armR.rotation.z=-.3;baseGroup.add(armR);
// Bridge
var bridge=new THREE.Mesh(new THREE.BoxGeometry(18,1,2),new THREE.MeshBasicMaterial({color:0x445555}));
bridge.position.set(16,-17,80);baseGroup.add(bridge);
var brRailL=new THREE.Mesh(new THREE.BoxGeometry(18,.15,.1),new THREE.MeshBasicMaterial({color:0x555555}));
brRailL.position.set(16,-16.2,81);baseGroup.add(brRailL);
var brRailR=new THREE.Mesh(new THREE.BoxGeometry(18,.15,.1),new THREE.MeshBasicMaterial({color:0x555555}));
brRailR.position.set(16,-16.2,79);baseGroup.add(brRailR);
// Hazard stripes on pad
for(var hs=0;hs<10;hs++){
 var stripe=new THREE.Mesh(new THREE.PlaneGeometry(.6,2),new THREE.MeshBasicMaterial({color:hs%2?0xffaa00:0x1a1a1a}));
 stripe.rotation.x=-Math.PI/2;stripe.position.set(-10+hs*2,-18.4,80);baseGroup.add(stripe);
}
baseGroup.userData={rocket:rocket,tower:twr4,bridge:bridge,intact:true};
S.add(baseGroup);

// ===== EXPLOSION PARTICLES =====
var P2=[];
function booom(x,y,z,big){
 var n=big?100:40;
 for(var i=0;i<n;i++){
  var a=Math.random()*Math.PI*2,sp=15+Math.random()*(big?160:60);
  var cm=Math.random();
  P2.push({
   x:x,y:y,z:z,
   vx:Math.cos(a)*sp,vy:(Math.random()-.3)*sp,vz:Math.sin(a)*sp,
   l:.5+Math.random()*(big?2.5:1),
   c:cm<.3?'#ff2200':cm<.5?'#ff6600':cm<.7?'#ffaa00':cm<.85?'#ffdd44':'#ffffff',
   s:.5+Math.random()*(big?3:1.5)
  });
 }
}

// ===== MISSILES =====
var missiles2=[];
var damMissiles=false,rocketBoom2=false;
var heliX=0,heliY=0,heliZ=50;

// Place cabin in scene
cabin.position.set(0,0,0);
S.add(cabin);

// ===== ANIMATION =====
var ST2=0,LT2=0,T2=0;
var operatorLookTime=[0,0,0,0];

function loop(now){
 requestAnimationFrame(loop);
 if(!LT2){LT2=now;ST2=now;R.render(S,C);return}
 if(_skip){R.render(S,C);return}
 var dt=Math.min(.15,(now-LT2)/1000);LT2=now;
 if(dt<.001)dt=.016;
 T2=(now-ST2)/1000;

 // ===== FLIGHT PATH =====
 if(T2<3){
  // Still climbing
  heliY=-5+T2*3;
  heliZ=50-T2*5;
 }else if(T2<10){
  // Flying toward dam
  heliY=4+Math.sin(T2*.5)*2;
  heliZ=35-(T2-3)*6;
 }else if(T2<16){
  // Circling dam
  heliZ=-55+Math.sin((T2-10)*.8)*10;
  heliY=5+Math.cos((T2-10)*.6)*3;
 }else if(T2<20){
  // Banking away from dam
  heliZ=-55-(T2-16)*10;
  heliY=5+(T2-16)*3;
 }else if(T2<26){
  // Transition - getting lower
  heliZ=-95+(T2-20)*15;
  heliY=12-(T2-20)*.5;
 }else if(T2<34){
  // Approaching space base
  heliZ=-35+(T2-26)*15;
  heliY=10+Math.sin(T2*.4)*3;
 }else if(T2<42){
  // Circling space base
  heliZ=85+Math.sin((T2-34)*.7)*10;
  heliY=10+Math.cos((T2-34)*.5)*3;
 }else if(T2<50){
  // Final flyover
  heliZ=85+(T2-42)*10;
  heliY=8+Math.sin(T2*.5)*2;
 }else{
  heliZ=165+(T2-50)*5;
  heliY=8;
 }

 // Cabin follows helicopter
 cabin.position.set(0,heliY,heliZ);
 // Slight turbulence
 cabin.rotation.x=Math.sin(T2*1.3)*.02;
 cabin.rotation.z=Math.sin(T2*.9)*.04;
 cabin.rotation.y=Math.sin(T2*.6)*.03;

 // Player camera inside cabin - look slightly left toward window
 var camX=0,camY=heliY+1.2,camZ=heliZ+.5;
 // Sway
 C.position.set(camX,camY,camZ);
 // Look out left window during dam scene
 if(T2>5&&T2<20){C.lookAt(-8,heliY+.5,heliZ-3)}
 else if(T2>28&&T2<46){C.lookAt(-8,heliY+.5,heliZ-3)}
 else{C.lookAt(0,heliY+.5,heliZ+10)}

 // ===== OPERATOR HEAD MOVEMENT =====
 ops.forEach(function(h,i){
  var tgt=operatorLookTime[i];
  tgt-=dt;if(tgt<0){tgt=3+Math.random()*5;operatorLookTime[i]=tgt}
  // Subtle head bob
  h.position.x+=Math.sin(T2*3+i)*.005;
  h.rotation.y=Math.sin(T2*2+i)*.15;
  h.rotation.x=Math.sin(T2*1.5+i)*.1;
 });

 // ===== DAM MISSILES (at T2 ~12s) =====
 if(T2>12&&!damMissiles){
  damMissiles=true;
  // Fire 2 missiles toward dam gate
  var sx3=heliX-20,sy3=heliY-5,sz3=heliZ-10;
  missiles2.push({x:sx3,y:sy3,z:sz3,tx:0,ty:-8,tz:-62,sp:100,l:0,ml:2,hit:false});
  missiles2.push({x:sx3+5,y:sy3,z:sz3,tx:2,ty:-6,tz:-61,sp:95,l:.3,ml:2,hit:false});
 }

 // ===== ROCKET EXPLOSION (at T2 ~36s) =====
 if(T2>36&&!rocketBoom2){
  rocketBoom2=true;
  booom(0,8,80,true);
  booom(3,12,82,true);
 }

 // ===== UPDATE MISSILES =====
 for(var i=missiles2.length-1;i>=0;i--){
  var ms2=missiles2[i];
  var dx=ms2.tx-ms2.x,dy=ms2.ty-ms2.y,dz=ms2.tz-ms2.z,dd=Math.sqrt(dx*dx+dy*dy+dz*dz);
  if(dd<3||ms2.l>ms2.ml){
   if(!ms2.hit){ms2.hit=true;booom(ms2.x,ms2.y,ms2.z,true)}
   missiles2.splice(i,1);
   continue;
  }
  ms2.x+=dx/dd*ms2.sp*dt;ms2.y+=dy/dd*ms2.sp*dt;ms2.z+=dz/dd*ms2.sp*dt;ms2.l+=dt;
  // Trail
  booom(ms2.x,ms2.y,ms2.z,false);
 }

 // ===== UPDATE PARTICLES =====
 for(var i=P2.length-1;i>=0;i--){
  var pp3=P2[i];pp3.x+=pp3.vx*dt;pp3.y+=pp3.vy*dt;pp3.z+=pp3.vz*dt;pp3.l-=dt;
  pp3.vy-=20*dt;
  if(pp3.l<=0){P2.splice(i,1);continue}
  try{
   var pm2=new THREE.Mesh(new THREE.SphereGeometry(pp3.s*.2,4,4),new THREE.MeshBasicMaterial({color:parseInt(pp3.c.replace('#',''),16),transparent:true,opacity:Math.min(1,pp3.l/2)}));
   pm2.position.set(pp3.x,pp3.y,pp3.z);S.add(pm2);
   setTimeout(function(){try{S.remove(pm2)}catch(e){}},100);
  }catch(e){}
 }

 // ===== MISSILE VISUALS =====
 missiles2.forEach(function(m2){
  try{
   var mt3=new THREE.Mesh(new THREE.SphereGeometry(.3,6,6),new THREE.MeshBasicMaterial({color:0xff8800}));
   mt3.position.set(m2.x,m2.y,m2.z);S.add(mt3);
   setTimeout(function(){try{S.remove(mt3)}catch(e){}},80);
  }catch(e){}
 });

 // ===== RED CABIN LIGHT PULSE =====
 cabinLight.material.color.setHSL(0,.9,.2+Math.sin(T2*2)*.15+.15);
 clGlow.material.opacity=.04+Math.sin(T2*1.5)*.03;

 // ===== OPERATOR DETAIL RESPONSES =====
 // During explosion scenes, operators react
 if(T2>12&&T2<25){
  // Dam explosion - operators look tense/stunned
  ops.forEach(function(h,i){h.rotation.y=(Math.sin(T2*4+i)+Math.random()*.3)*.3});
  // Cabin light flickers
  cabinLight.material.color.setHSL(0,.5,.1+Math.random()*.3);
  clGlow.material.opacity=.03+Math.random()*.06;
 }

 // ===== HUD TIMER =====
 INFO.innerHTML='<span style="font-size:10px;color:rgba(255,255,255,.4)">'+
  (Math.floor(T2/60)<10?'0'+Math.floor(T2/60):Math.floor(T2/60))+':'+
  (Math.floor(T2%60)<10?'0'+Math.floor(T2%60):Math.floor(T2%60))+' / 01:48</span>'+
  (T2>5&&T2<25?'<br><span style="font-size:10px;color:rgba(255,100,50,.5)">零号大坝</span>':'')+
  (T2>28&&T2<48?'<br><span style="font-size:10px;color:rgba(255,100,50,.5)">航天基地</span>':'');

 R.render(S,C);
}
requestAnimationFrame(loop);

window.addEventListener('resize',function(){C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
})();
}
</script></body></html>
