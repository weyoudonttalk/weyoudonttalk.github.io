<!DOCTYPE html><html lang="zh"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>三角洲行动 · 直升机编队开场</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none}#c{display:block;width:100%;height:100%}#skip{position:fixed;bottom:20px;right:16px;z-index:99;color:rgba(255,255,255,.15);font-size:11px;padding:6px 14px;border:1px solid rgba(255,255,255,.06);border-radius:4px;cursor:pointer}#skip:active{color:#f60}#info{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:12px;z-index:999;background:rgba(0,0,0,.8);padding:8px 18px;border-radius:6px;text-align:center;pointer-events:none}</style></head><body>
<canvas id="c"></canvas><div id="skip" onclick="_skip=true;this.style.display='none'">跳过</div><div id="info"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
var _skip=false;(function(){
var I=document.getElementById('info');
if(typeof THREE==='undefined'){I.textContent='引擎加载失败,请刷新';return}
I.textContent='THREE v'+THREE.REVISION;

var S=new THREE.Scene();S.background=new THREE.Color(0x0a1220);S.fog=new THREE.Fog(0x0a1525,50,500);
var C=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.5,500);C.position.set(0,30,60);C.lookAt(0,15,-20);
var R=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,1.5));
S.add(new THREE.AmbientLight(0x334466,.5));var dl2=new THREE.DirectionalLight(0x8899cc,.4);dl2.position.set(100,200,50);S.add(dl2);S.add(new THREE.DirectionalLight(0x446688,.3)).position.set(-50,30,-30);

// ==== BUILD HELICOPTER ====
function bH(){
 var g=new THREE.Group(),DB=new THREE.MeshBasicMaterial({color:0x1e1e1e}),LB=new THREE.MeshBasicMaterial({color:0x2a2a2a}),GR=new THREE.MeshBasicMaterial({color:0x666}),WH=new THREE.MeshBasicMaterial({color:0x888}),RD=new THREE.MeshBasicMaterial({color:0xc22}),GL=new THREE.MeshBasicMaterial({color:0x234,transparent:true,opacity:.25});
 var fu=new THREE.Mesh(new THREE.CylinderGeometry(2.5,2.8,14,16),DB);fu.rotation.x=Math.PI/2;g.add(fu);
 var ns=new THREE.Mesh(new THREE.SphereGeometry(2.5,10,6,0,6.28,0,1.57),DB);ns.position.set(0,-.5,7);ns.rotation.x=Math.PI/2;g.add(ns);
 var tb=new THREE.Mesh(new THREE.CylinderGeometry(.6,.8,20,8),DB);tb.rotation.x=Math.PI/2;tb.position.set(0,.3,-16);g.add(tb);
 g.add(new THREE.Mesh(new THREE.BoxGeometry(.15,3,2.5),DB)).position.set(0,2.2,-26);
 g.add(new THREE.Mesh(new THREE.BoxGeometry(4,.12,1.2),DB)).position.set(0,.4,-25);
 for(var s=-1;s<=1;s+=2){g.add(new THREE.Mesh(new THREE.CylinderGeometry(.8,.9,5,8),LB).rotation.x=Math.PI/2).position.set(s*1.5,2.8,0);g.add(new THREE.Mesh(new THREE.CylinderGeometry(.4,.5,1.5,6),new THREE.MeshBasicMaterial({color:0x111})).rotation.x=Math.PI/2).position.set(s*1.5,2.8,-4)}
 g.add(new THREE.Mesh(new THREE.CylinderGeometry(.15,.15,1.5,8),GR)).position.set(0,4,0);
 g.add(new THREE.Mesh(new THREE.CylinderGeometry(.4,.5,.6,8),GR)).position.set(0,4.4,0);
 var mr2=new THREE.Group();mr2.position.set(0,4.8,0);for(var i=0;i<4;i++){var a=i*1.5708;var bl=new THREE.Mesh(new THREE.BoxGeometry(.06,.03,12),WH);bl.position.set(Math.cos(a)*6,0,Math.sin(a)*6);bl.rotation.y=-a;mr2.add(bl)}g.add(mr2);
 var tr3=new THREE.Group();tr3.position.set(0,1.2,-27.5);for(var i=0;i<4;i++){var a2=i*1.5708;var tb2=new THREE.Mesh(new THREE.BoxGeometry(.015,.005,1.5),WH);tb2.position.set(Math.cos(a2)*.75,0,Math.sin(a2)*.75);tb2.rotation.y=-a2;tr3.add(tb2)}g.add(tr3);
 for(var s=-1;s<=1;s+=2){g.add(new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,2.5,6),GR)).position.set(s*2.2,-2.5,-1);g.add(new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,2.5,6),GR)).position.set(s*2.2,-2.5,5);var sh2=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,9,6),GR);sh2.rotation.z=1.5708;sh2.position.set(s*2.2,-3.8,2);g.add(sh2)}
 g.add(new THREE.Mesh(new THREE.BoxGeometry(3,.8,.1),GL)).position.set(0,.5,7.5);
 for(var s=-1;s<=1;s+=2){g.add(new THREE.Mesh(new THREE.BoxGeometry(.05,1,3),GL)).position.set(s*2.6,.8,4);g.add(new THREE.Mesh(new THREE.BoxGeometry(.6,.15,.5),GR)).position.set(s*2.8,-1,-2)}
 g.add(new THREE.Mesh(new THREE.SphereGeometry(.15,4,4),new THREE.MeshBasicMaterial({color:0xf00}))).position.set(-2.6,-.5,2);
 g.add(new THREE.Mesh(new THREE.SphereGeometry(.15,4,4),new THREE.MeshBasicMaterial({color:0x0f0}))).position.set(2.6,-.5,2);
 var bn=new THREE.Mesh(new THREE.SphereGeometry(.2,4,4),RD);bn.position.set(0,4.2,-3);g.add(bn);
 var bg2=new THREE.Mesh(new THREE.SphereGeometry(.8,6,6),new THREE.MeshBasicMaterial({color:0xf20,transparent:true,opacity:.12}));bg2.position.copy(bn.position);g.add(bg2);
 g.userData={mr:mr2,tr:tr3,bn:bn,bg:bg2};return g;
}

// ==== CABIN INTERIOR ====
function bCabin(){
 var g2=new THREE.Group(),DK=new THREE.MeshBasicMaterial({color:0x1a1a1a}),FR=new THREE.MeshBasicMaterial({color:0x333}),GL2=new THREE.MeshBasicMaterial({color:0x234,transparent:true,opacity:.15});
 var fl=new THREE.Mesh(new THREE.PlaneGeometry(4,7),DK);fl.rotation.x=-1.5708;g2.add(fl);
 var cl2=new THREE.Mesh(new THREE.PlaneGeometry(4,7),new THREE.MeshBasicMaterial({color:0x1c1c1c}));cl2.rotation.x=-1.5708;g2.add(cl2);
 var lwt=new THREE.Mesh(new THREE.PlaneGeometry(.3,7),DK);lwt.position.set(-2,1,-.5);lwt.rotation.y=1.5708;g2.add(lwt);
 var lwb=new THREE.Mesh(new THREE.PlaneGeometry(.3,7),DK);lwb.position.set(-2,-.8,-.5);lwb.rotation.y=1.5708;g2.add(lwb);
 var rwt=new THREE.Mesh(new THREE.PlaneGeometry(.3,7),DK);rwt.position.set(2,1,-.5);rwt.rotation.y=-1.5708;g2.add(rwt);
 var rwb=new THREE.Mesh(new THREE.PlaneGeometry(.3,7),DK);rwb.position.set(2,-.8,-.5);rwb.rotation.y=-1.5708;g2.add(rwb);
 var lw3=new THREE.Mesh(new THREE.PlaneGeometry(.02,2.5),GL2);lw3.position.set(-1.98,.4,-.5);lw3.rotation.y=1.5708;g2.add(lw3);
 var rw3=new THREE.Mesh(new THREE.PlaneGeometry(.02,2.5),GL2);rw3.position.set(1.98,.4,-.5);rw3.rotation.y=-1.5708;g2.add(rw3);
 for(var i=0;i<5;i++){g2.add(new THREE.Mesh(new THREE.BoxGeometry(3.6,.04,.04),FR)).position.set(0,1.3,-3+i*1.5)}
 var cll=new THREE.Mesh(new THREE.SphereGeometry(.15,6,6),new THREE.MeshBasicMaterial({color:0xf20}));cll.position.set(0,1.2,0);g2.add(cll);
 var clg=new THREE.Mesh(new THREE.SphereGeometry(.7,6,6),new THREE.MeshBasicMaterial({color:0xf20,transparent:true,opacity:.06}));clg.position.copy(cll.position);g2.add(clg);
 var ops=[];for(var i=0;i<4;i++){var sx=-1.2+(i%2)*2.4,sz=-2.5+(Math.floor(i/2))*1.6;g2.add(new THREE.Mesh(new THREE.BoxGeometry(.5,.6,.35),new THREE.MeshBasicMaterial({color:0x1a1a16}))).position.set(sx,.2,sz);var hd2=new THREE.Mesh(new THREE.SphereGeometry(.2,8,6),new THREE.MeshBasicMaterial({color:0x282820}));hd2.position.set(sx,.65,sz);g2.add(hd2);ops.push(hd2);g2.add(new THREE.Mesh(new THREE.SphereGeometry(.23,8,6,0,6.28,0,1.73),new THREE.MeshBasicMaterial({color:0x1a1a1a}))).position.set(sx,.68,sz+.04);var nv=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,.07,6),new THREE.MeshBasicMaterial({color:0x032}));nv.position.set(sx+.02,.63,sz+.22);nv.rotation.x=1.5708;g2.add(nv);g2.add(new THREE.Mesh(new THREE.BoxGeometry(.04,.03,.3),new THREE.MeshBasicMaterial({color:0x111}))).position.set(sx-.25,-.1,sz+.3)}
 g2.visible=false;g2.userData={cll:cll,clg:clg};return {group:g2,ops:ops};
}

// ==== CLOUDS ====
var clouds3=[];for(var c=0;c<25;c++){var cg3=new THREE.Group();for(var n=0;n<3+Math.floor(Math.random()*5);n++){cg3.add(new THREE.Mesh(new THREE.SphereGeometry(8+Math.random()*25,5,4),new THREE.MeshBasicMaterial({color:0xcde,transparent:true,opacity:.3+Math.random()*.3}))).position.set((Math.random()-.5)*60,(Math.random()-.5)*15,(Math.random()-.5)*25)}cg3.position.set((Math.random()-.5)*300,10+Math.random()*50,(Math.random()-.5)*300);cg3.userData={spd:.3+Math.random()*1.2};S.add(cg3);clouds3.push(cg3)}

// ==== GROUND ====
var terr3=new THREE.Mesh(new THREE.PlaneGeometry(700,700),new THREE.MeshBasicMaterial({color:0x0f1908}));terr3.rotation.x=-1.5708;terr3.position.y=-25;S.add(terr3);
for(var m3=0;m3<50;m3++){var mx=(Math.random()-.5)*600,mz=(Math.random()-.5)*600;var mh=15+Math.random()*80;S.add(new THREE.Mesh(new THREE.ConeGeometry(15+Math.random()*60,mh,6,4),new THREE.MeshBasicMaterial({color:Math.random()<.5?0x1a2015:0x201a15}))).position.set(mx,-25+mh/2,mz)}

// ==== STARS ====
var starPos=[];for(var st2=0;st2<200;st2++){starPos.push((Math.random()-.5)*500,20+Math.random()*150,(Math.random()-.5)*500)}
var starGeo2=new THREE.BufferGeometry();starGeo2.setAttribute('position',new THREE.Float32BufferAttribute(starPos,3));
var starPts=new THREE.Points(starGeo2,new THREE.PointsMaterial({color:0xffffff,size:.3,transparent:true,opacity:.6}));S.add(starPts);

// ==== MOON ====
var moon2=new THREE.Mesh(new THREE.SphereGeometry(8,16,16),new THREE.MeshBasicMaterial({color:0xfff8ee}));moon2.position.set(200,100,-100);S.add(moon2);

// ==== 3 HELICOPTERS + CABIN ====
var helis=[],cabinData=null;
for(var h=0;h<3;h++){var hl2=bH();hl2.position.set((h-1)*18,20,-30-h*5);hl2.rotation.y=.15;S.add(hl2);helis.push(hl2);if(h===1){cabinData=bCabin();cabinData.group.position.copy(hl2.position);S.add(cabinData.group);hl2.userData.cd=cabinData}}

// ==== ANIMATION ====
var ST3=0,LT3=0,T3=0,fpZ=-30;
function loop2(now){
 requestAnimationFrame(loop2);if(!LT3){LT3=now;ST3=now;R.render(S,C);return}
 if(_skip){R.render(S,C);return}var dt=Math.min(.15,(now-LT3)/1000);LT3=now;if(dt<.001)dt=.016;T3=(now-ST3)/1000;
 fpZ=-30+T3*12;
 for(var hi=0;hi<helis.length;hi++){var hl=helis[hi];hl.position.x=(hi-1)*18+Math.sin(T3*.4+hi)*3;hl.position.y=20+Math.sin(T3*.3+hi)*2;hl.position.z=fpZ+hi*5;hl.rotation.y=.15+Math.sin(T3*.2+hi)*.05;hl.rotation.x=Math.sin(T3*.25+hi)*.03;if(hl.userData.mr)hl.userData.mr.rotation.y+=dt*22;if(hl.userData.tr)hl.userData.tr.rotation.z+=dt*24;if(hl.userData.bn){hl.userData.bn.material.color.setHSL(0,.9,.3+Math.sin(T3*3+hi)*.2+.2);hl.userData.bg.material.opacity=.06+Math.sin(T3*2+hi)*.04}if(hi===1&&hl.userData.cd){hl.userData.cd.group.position.copy(hl.position);hl.userData.cd.group.rotation.copy(hl.rotation)}}
 // Clouds
 clouds3.forEach(function(c){c.position.x+=c.userData.spd*dt*.5;if(c.position.x>150)c.position.x=-150});
 starPts.material.opacity=.4+Math.sin(T3*.3)*.15+.15;
 // Camera
 var mh2=helis[1];
 if(T3<5){C.position.lerp(new THREE.Vector3(-35+T3/5*30,28-T3/5*3,fpZ+8),2*dt);C.lookAt(0,22,fpZ-5)}
 else if(T3<10){var t5=(T3-5)/5,cx=mh2.position.x+10*(1-t5),cy=mh2.position.y+4+2*(1-t5),cz=mh2.position.z+5*(1-t5);C.position.lerp(new THREE.Vector3(cx,cy,cz),3*dt);C.lookAt(mh2.position.x,mh2.position.y+1,mh2.position.z)}
 else if(T3<14){var t8=(T3-10)/4;var cx2=mh2.position.x+.5+Math.sin(T3*.5)*.3,cy2=mh2.position.y+.4,cz2=mh2.position.z-3*(1-t8)+.5;C.position.lerp(new THREE.Vector3(cx2,cy2,cz2),3*dt);C.lookAt(-.5+Math.sin(T3*.6)*.6,mh2.position.y+.3,mh2.position.z-1.5);if(t8>.3&&cabinData)cabinData.group.visible=true}
 else{C.position.set(mh2.position.x+.15+Math.sin(T3*1.5)*.04,mh2.position.y+.5+Math.sin(T3*1.2)*.03,mh2.position.z-1.2+Math.sin(T3*.8)*.03);C.lookAt(-.5+Math.sin(T3*.4)*.7,mh2.position.y+.3,mh2.position.z-2.5);if(cabinData)cabinData.group.visible=true}
 // Cabin lights
 if(cabinData&&cabinData.group.userData.cll){cabinData.group.userData.cll.material.color.setHSL(0,.9,.2+Math.sin(T3*2)*.1+.1);cabinData.group.userData.clg.material.opacity=.04+Math.sin(T3*1.5)*.03}
 if(cabinData){cabinData.ops.forEach(function(op,i){op.rotation.y=Math.sin(T3*2+i)*.12;op.position.x+=Math.sin(T3*3+i)*.002})}
 // Sky color
 var sr=10+Math.sin(T3*.05)*4,sg=18+Math.sin(T3*.06)*4,sb=32+Math.sin(T3*.04)*6;S.background.setRGB(sr/255,sg/255,sb/255);
 I.textContent=(Math.floor(T3/60)<10?'0'+Math.floor(T3/60):Math.floor(T3/60))+':'+(Math.floor(T3%60)<10?'0'+Math.floor(T3%60):Math.floor(T3%60))+' / 01:30 · '+(T3<5?'编队飞行':T3<10?'镜头推近':T3<14?'舱门视角':'舱内POV');
 R.render(S,C);
}
requestAnimationFrame(loop2);
window.addEventListener('resize',function(){C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
})();</script></body></html>
