<!DOCTYPE html><html lang="zh"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>钢铁风暴 · 战争史诗</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;font-family:'PingFang SC','Microsoft YaHei',sans-serif}
#bg,#fg,#ui{position:absolute;inset:0;display:block}
#skip{position:fixed;bottom:20px;right:16px;z-index:999;color:rgba(255,255,255,.2);font-size:10px;padding:5px 12px;border:1px solid rgba(255,255,255,.08);border-radius:3px;cursor:pointer;pointer-events:auto}#skip:active{color:#f60}
</style></head><body>
<canvas id="bg"></canvas><canvas id="fg"></canvas><canvas id="ui"></canvas>
<div id="skip" onclick="window._skip=true;this.style.display='none'">跳过</div>
<script>
(function(){
var BG=document.getElementById('bg'),FG=document.getElementById('fg'),UI=document.getElementById('ui');
var bC=BG.getContext('2d'),fC=FG.getContext('2d'),uC=UI.getContext('2d');
var W=innerWidth,H=innerHeight,T=0,startTime=0;
BG.width=FG.width=UI.width=W;BG.height=FG.height=UI.height=H;
window.addEventListener('resize',function(){W=BG.width=FG.width=UI.width=innerWidth;H=BG.height=FG.height=UI.height=innerHeight});

window._skip=false;
var DURATION=3660; // 61 minutes
var _section=0,_sectionTime=0;
var sections=[
 {start:0, end:10, name:'片头'},
 {start:10, end:720, name:'第一章·钢铁洪流'},
 {start:720, end:1440, name:'第二章·鹰击长空'},
 {start:1440, end:2160, name:'第三章·联合打击'},
 {start:2160, end:2880, name:'第四章·烈焰风暴'},
 {start:2880, end:3600, name:'第五章·终章'},
 {start:3600, end:3660, name:'字幕'},
];

// ================================== PARTICLE ENGINE ==================================
var particles=[];
function emit(x,y,vx,vy,life,color,size){if(color===undefined)return;particles.push({x:x,y:y,vx:vx||0,vy:vy||0,life:life||1,maxLife:life||1,color:color,size:size||1});}
function fireball(x,y,big){
 var s=big?80:30,l=big?2.5:1.2,sz=big?3:1.5;
 var colors=['#ff2200','#ff4400','#ff6600','#ff8800','#ffaa00','#ffcc00','#ffff44','#ffffff','#222222','#333333','#444444','#663300'];
 for(var i=0;i<s;i++){
  var a=Math.random()*Math.PI*2,sp=20+Math.random()*(big?160:80);
  var c=colors[Math.floor(Math.random()*colors.length)];
  emit(x,y,Math.cos(a)*sp,Math.sin(a)*sp,l*Math.random(),c,sz*Math.random());
 }
 if(big){for(var i=0;i<20;i++){emit(x,y,(Math.random()-.5)*300,(Math.random()-.5)*300,3+Math.random()*2,'rgba(100,100,100,.5)',2+Math.random()*4)}}
}

// ================================== CANVAS DRAW FUNCTIONS ==================================

// Draw tank (side view, facing left)
function drawTank(ctx,x,y,color,dir){
 ctx.save();ctx.translate(x,y);if(dir<0)ctx.scale(-1,1);
 // Tracks
 ctx.fillStyle='#222';ctx.beginPath();ctx.roundRect(-30,-10,60,20,4);ctx.fill();
 ctx.strokeStyle='#444';ctx.lineWidth=1.5;ctx.stroke();
 // Wheels
 for(var i=0;i<6;i++){ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.arc(-22+i*8,0,5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#333';ctx.lineWidth=1;ctx.stroke();ctx.fillStyle='#888';ctx.beginPath();ctx.arc(-22+i*8,0,2,0,Math.PI*2);ctx.fill()}
 // Hull
 ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(-20,-4);ctx.lineTo(25,-4);ctx.lineTo(25,6);ctx.lineTo(-20,6);ctx.closePath();ctx.fill();
 ctx.strokeStyle='#1a2a0a';ctx.lineWidth=1.5;ctx.stroke();
 // Turret
 ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(-8,-8);ctx.lineTo(10,-8);ctx.lineTo(10,-2);ctx.lineTo(-14,-2);ctx.closePath();ctx.fill();ctx.stroke();
 // Barrel
 ctx.fillStyle='#555';ctx.fillRect(-30,-6,20,3);
 ctx.fillStyle='#333';ctx.fillRect(-35,-7,5,5);
 // Commander cupola
 ctx.fillStyle='#2a3a1a';ctx.beginPath();ctx.arc(2,-8,3,0,Math.PI,false);ctx.fill();
 ctx.restore();
}

// Draw APC (side view)
function drawAPC(ctx,x,y,color,dir){
 ctx.save();ctx.translate(x,y);if(dir<0)ctx.scale(-1,1);
 // Wheels
 for(var i=0;i<8;i++){ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.arc(-25+i*7,3,4,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#333';ctx.lineWidth=.8;ctx.stroke()}
 // Hull
 ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(-26,-8,52,16,3);ctx.fill();
 ctx.strokeStyle='#1a2a0a';ctx.lineWidth=1.5;ctx.stroke();
 // Sloped armor
 ctx.fillStyle='rgba(255,255,255,.1)';ctx.beginPath();ctx.moveTo(-20,-8);ctx.lineTo(15,-8);ctx.lineTo(15,-3);ctx.lineTo(-20,-3);ctx.closePath();ctx.fill();
 // Windshield
 ctx.fillStyle='rgba(0,128,255,.3)';ctx.fillRect(10,-5,6,6);
 // Turret
 ctx.fillStyle='#2a2a2a';ctx.beginPath();ctx.arc(-5,-4,3,0,Math.PI*2);ctx.fill();
 ctx.restore();
}

// Draw fighter jet (top view, flying left-to-right with nose left)
function drawJet(ctx,x,y,dir){
 ctx.save();ctx.translate(x,y);if(dir<0)ctx.scale(1,-1);
 // Fuselage
 ctx.fillStyle='#ddd';ctx.beginPath();ctx.moveTo(30,0);ctx.lineTo(-10,-6);ctx.lineTo(-30,-3);ctx.lineTo(-30,3);ctx.lineTo(-10,6);ctx.closePath();ctx.fill();
 ctx.fillStyle='#eee';ctx.beginPath();ctx.moveTo(28,0);ctx.lineTo(-5,-3);ctx.lineTo(-5,3);ctx.closePath();ctx.fill();
 // Wings
 ctx.fillStyle='#bbb';ctx.beginPath();ctx.moveTo(5,3);ctx.lineTo(-5,18);ctx.lineTo(-12,18);ctx.lineTo(-5,3);ctx.closePath();ctx.fill();
 ctx.fillStyle='#bbb';ctx.beginPath();ctx.moveTo(5,-3);ctx.lineTo(-5,-18);ctx.lineTo(-12,-18);ctx.lineTo(-5,-3);ctx.closePath();ctx.fill();
 // Engines
 ctx.fillStyle='#555';ctx.fillRect(-32,-3,8,6);
 // Afterburner
 ctx.fillStyle='#ff6600';ctx.beginPath();ctx.moveTo(-30,-2);ctx.lineTo(-45,0);ctx.lineTo(-30,2);ctx.closePath();ctx.fill();
 ctx.fillStyle='#ffcc00';ctx.beginPath();ctx.moveTo(-30,-1);ctx.lineTo(-40,0);ctx.lineTo(-30,1);ctx.closePath();ctx.fill();
 // Red star insignia
 ctx.fillStyle='#cc0000';ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(11,-3);ctx.lineTo(14,-3);ctx.lineTo(12,-5);ctx.lineTo(13,-8);ctx.lineTo(10,-6);ctx.lineTo(7,-8);ctx.lineTo(8,-5);ctx.lineTo(6,-3);ctx.lineTo(9,-3);ctx.closePath();ctx.fill();
 // Cockpit
 ctx.fillStyle='#2266aa';ctx.beginPath();ctx.ellipse(15,0,5,2,0,0,Math.PI*2);ctx.fill();
 ctx.restore();
}

// Draw attack helicopter (side view)
function drawHeli(ctx,x,y,rotorAngle){
 ctx.save();ctx.translate(x,y);
 // Tail boom
 ctx.fillStyle='#3a5a28';ctx.fillRect(10,-1,25,3);
 // Tail fin
 ctx.fillStyle='#3a5a28';ctx.beginPath();ctx.moveTo(35,-1);ctx.lineTo(40,-10);ctx.lineTo(40,2);ctx.closePath();ctx.fill();
 // Tail rotor
 ctx.fillStyle='#888';ctx.save();ctx.translate(38,-2);ctx.rotate(rotorAngle);ctx.fillRect(-5,-.3,10,.6);ctx.restore();
 // Fuselage
 ctx.fillStyle='#3a5a28';ctx.beginPath();ctx.roundRect(-15,-5,28,10,3);ctx.fill();
 ctx.strokeStyle='#1a3a10';ctx.lineWidth=1;ctx.stroke();
 // Nose
 ctx.fillStyle='#3a5a28';ctx.beginPath();ctx.moveTo(-15,-3);ctx.lineTo(-22,0);ctx.lineTo(-15,3);ctx.closePath();ctx.fill();
 // Cockpit
 ctx.fillStyle='rgba(0,128,200,.4)';ctx.beginPath();ctx.moveTo(-12,-4);ctx.lineTo(-18,-1);ctx.lineTo(-12,2);ctx.closePath();ctx.fill();
 // Main rotor
 ctx.fillStyle='#999';ctx.save();ctx.translate(0,-6);ctx.rotate(rotorAngle);ctx.fillRect(-18,-.3,36,.6);ctx.restore();
 // Rotor hub
 ctx.fillStyle='#666';ctx.beginPath();ctx.arc(0,-6,2,0,Math.PI*2);ctx.fill();
 // Weapon pylons
 ctx.fillStyle='#333';ctx.fillRect(-5,4,2,3);
 ctx.fillStyle='#222';ctx.fillRect(-6,7,4,1);
 ctx.fillStyle='#333';ctx.fillRect(8,4,2,3);
 ctx.fillStyle='#222';ctx.fillRect(7,7,4,1);
 // Skids
 ctx.fillStyle='#555';ctx.fillRect(-10,4,1,10);
 ctx.fillRect(12,4,1,10);
 ctx.fillRect(-14,14,30,.8);
 ctx.restore();
}

// ================================== CLOUD GENERATOR ==================================
var clouds=[];
for(var i=0;i<20;i++){clouds.push({x:Math.random()*W,y:10+Math.random()*H*.4,r:30+Math.random()*60,spd:.2+Math.random()*.6,alpha:.1+Math.random()*.2})}

function drawSky(ctx,T){
 var grd=ctx.createLinearGradient(0,0,0,H);
 grd.addColorStop(0,'#0a1525');grd.addColorStop(.3,'#1a3050');grd.addColorStop(.6,'#2a5070');grd.addColorStop(.8,'#3a6080');grd.addColorStop(1,'#4a6a88');
 ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
 clouds.forEach(function(c){c.x-=c.spd;if(c.x<-100){c.x=W+100;c.y=10+Math.random()*H*.4}ctx.fillStyle='rgba(255,255,255,'+c.alpha+')';ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(c.x+c.r*.4,c.y+c.r*.1,c.r*.6,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(c.x-c.r*.5,c.y+c.r*.05,c.r*.5,0,Math.PI*2);ctx.fill()});
}

function drawTerrain(ctx,T,y0){
 var grd=ctx.createLinearGradient(0,y0,0,H);
 grd.addColorStop(0,'#3a5528');grd.addColorStop(.3,'#2a4018');grd.addColorStop(1,'#1a2a10');
 ctx.fillStyle=grd;ctx.fillRect(0,y0,W,H-y0);
 // Grass detail
 ctx.strokeStyle='rgba(70,100,50,.2)';
 for(var i=0;i<30;i++){var gx=(i*137+50)%W,gy=y0+10+(i*73)%(H-y0-20);ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(gx+Math.sin(i)*8,gy-8-Math.random()*6);ctx.stroke()}
 // Dirt road
 var roadY=y0+50+Math.sin(T*.05)*5;
 ctx.fillStyle='#333';ctx.fillRect(0,roadY,W,10);
 ctx.strokeStyle='rgba(255,255,255,.06)';ctx.setLineDash([15,10]);ctx.beginPath();ctx.moveTo(0,roadY+5);ctx.lineTo(W,roadY+5);ctx.stroke();ctx.setLineDash([]);
}

// ================================== HUD / UI ==================================
function drawHUD(ctx,T,sc){
 var m=Math.floor(T/60),s=Math.floor(T%60);
 ctx.fillStyle='rgba(255,255,255,.35)';ctx.font='10px "PingFang SC","Microsoft YaHei",sans-serif';
 ctx.textAlign='right';ctx.fillText((m<10?'0'+m:m)+':'+(s<10?'0'+s:s)+' / 61:00',W-14,18);
 ctx.textAlign='left';ctx.fillText(sc.name,W<400?'◉':'● '+sc.name,14,18);
}

// ================================== SCENE OBJECTS ==================================
var groundUnits=[],airUnits=[];

function spawnGroundAssets(count,types, yBase){
 groundUnits=[];airUnits=[];
 for(var i=0;i<count;i++){
  var type=types[Math.floor(Math.random()*types.length)];
  var unit={type:type,x:-50-Math.random()*200,y:yBase+Math.random()*20-Math.random()*15,spd:1.5+Math.random()*3,phase:Math.random()*Math.PI*2};
  switch(type){
   case'b':drawTank(ctx,unit.x,unit.y,'#4a5a2a',1);break;case'c':drawTank(ctx,unit.x,unit.y,'#554428',1);break;
   case'd':drawTank(ctx,unit.x,unit.y,'#3a5020',1);break;case'e':drawTank(ctx,unit.x,unit.y,'#4a4a20',1);break;
   case'f':drawAPC(ctx,unit.x,unit.y,'#445522',1);break;case'g':drawAPC(ctx,unit.x,unit.y,'#3a4a1a',1);break;
  }
  groundUnits.push(unit);
 }
}

function spawnAirAssets(jets,helis){
 for(var i=0;i<jets;i++){airUnits.push({type:'jet',x:W+Math.random()*200,y:30+Math.random()*H*.25,spd:6+Math.random()*8,phase:Math.random()*Math.PI*2,dir:-1})}
 for(var i=0;i<helis;i++){airUnits.push({type:'heli',x:W+Math.random()*150,y:40+Math.random()*H*.2,spd:2+Math.random()*3,phase:Math.random()*Math.PI*2,dir:-1,rotor:Math.random()*Math.PI*2})}
}

// ================================== TITLE OVERLAY ==================================
var titleAlpha=0,titleFade=0,titleText='',titleSub='';
function setTitle(text,sub){titleText=text;titleSub=sub;titleFade=1;titleAlpha=0}

// ================================== MAIN LOOP ==================================
var lastFrame=0, totalTime=0;
var missileCooldown=0, nextMissile=0;
var bigExplosionCooldown=0;
var sceneInitDone={};

function loop(now){
 requestAnimationFrame(loop);
 if(!lastFrame){lastFrame=now;startTime=now;return}
 var dt=Math.min(.2,(now-lastFrame)/1000);lastFrame=now;
 if(dt<.001)dt=.016;
 if(window._skip){return}

 totalTime=(now-startTime)/1000;
 T=totalTime;

 // Determine current section
 _section=0;
 for(var i=sections.length-1;i>=0;i--){if(T>=sections[i].start){_section=i;break}}
 var sc=sections[_section];_sectionTime=T-sc.start;

 // ===== SCENE MANAGEMENT =====
 var key='s'+_section;
 if(!sceneInitDone[key]){
  sceneInitDone[key]=true;groundUnits=[];airUnits=[];
  switch(_section){
   case 0:setTitle('钢铁风暴','STEEL STORM · 战争史诗');break;
   case 1:setTitle('第一章','钢铁洪流');spawnGroundAssets(15,['b','b','c','d','e','f','g','b','c','f'],H*.62);spawnAirAssets(2,1);break;
   case 2:setTitle('第二章','鹰击长空');spawnGroundAssets(8,['b','c','f','g'],H*.65);spawnAirAssets(6,3);break;
   case 3:setTitle('第三章','联合打击');spawnGroundAssets(12,['b','b','c','d','f','g','b','c'],H*.62);spawnAirAssets(5,4);break;
   case 4:setTitle('第四章','烈焰风暴');spawnGroundAssets(20,['b','b','c','d','e','f','g','b','c','b','f','g'],H*.62);spawnAirAssets(10,6);break;
   case 5:setTitle('','');break;
   case 6:setTitle('钢铁风暴','向所有英雄致敬 —— 小Q AI Studio 2026');break;
  }
 }

 // ===== UPDATE TITLE =====
 titleAlpha+=dt*1.5;if(titleAlpha>1)titleAlpha=1;
 if(_sectionTime>8)titleFade=Math.max(0,titleFade-dt);

 // ===== UPDATE UNITS =====
 groundUnits.forEach(function(u){
  u.x+=u.spd*dt;if(u.x>W+150)u.x=-150;
  u.y+=Math.sin(T*2+u.phase)*.3;
 });
 airUnits.forEach(function(u){u.x+=u.spd*dt*(u.dir||-1);u.y+=Math.sin(T*1.5+u.phase)*2;if(u.type==='heli')u.rotor+=dt*20;if(u.x<-200){u.x=W+200;u.y=30+Math.random()*H*.25}if(u.x>W+200){u.x=-200;u.y=30+Math.random()*H*.25}});

 // ===== MISSILE/EXPLOSION EVENTS =====
 missileCooldown-=dt;
 if(missileCooldown<=0){
  missileCooldown=2+Math.random()*4;
  // Launch missile from jet → ground tank
  var jets=airUnits.filter(function(u){return u.type==='jet'&&u.x>0&&u.x<W});
  if(jets.length>0&&groundUnits.length>0){
   var src=jets[Math.floor(Math.random()*jets.length)];
   var grnd=groundUnits.filter(function(u){return u.x>50&&u.x<W-50});
   if(grnd.length>0){
    var tgt=grnd[Math.floor(Math.random()*grnd.length)];
    fireball(tgt.x,tgt.y,false);
   }
  }
 }

 bigExplosionCooldown-=dt;
 if(bigExplosionCooldown<=0){
  bigExplosionCooldown=8+Math.random()*12;
  var bx=W*.2+Math.random()*W*.6,by=H*.45+Math.random()*H*.35;
  fireball(bx,by,true);
 }

 // ===== UPDATE PARTICLES =====
 for(var i=particles.length-1;i>=0;i--){
  var p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
  if(p.life<=0){particles.splice(i,1);continue}
  // simple gravity
  p.vy+=80*dt;
 }

 // ===== RENDER =====
 // Background
 bC.clearRect(0,0,W,H);drawSky(bC,T);drawTerrain(bC,T,H*.58);

 // Foreground - vehicles + explosions
 fC.clearRect(0,0,W,H);

 // Draw ground units
 groundUnits.forEach(function(u){
  switch(u.type){
   case'b':drawTank(fC,u.x,u.y,'#4a5a2a',1);break;case'c':drawTank(fC,u.x,u.y,'#554428',1);break;
   case'd':drawTank(fC,u.x,u.y,'#3a5020',1);break;case'e':drawTank(fC,u.x,u.y,'#4a4a20',1);break;
   case'f':drawAPC(fC,u.x,u.y,'#445522',1);break;case'g':drawAPC(fC,u.x,u.y,'#3a4a1a',1);break;
  }
 });

 // Draw air units
 airUnits.forEach(function(u){
  if(u.type==='jet'){drawJet(fC,u.x,u.y,u.dir||-1)}
  else if(u.type==='heli'){drawHeli(fC,u.x,u.y,u.rotor||0)}
 });

 // Draw particles
 particles.forEach(function(p){var a=Math.min(1,p.life/p.maxLife);fC.fillStyle=p.color.replace(')',','+a+')');if(p.color.startsWith('#')){var r=parseInt(p.color.substr(1,2),16),g=parseInt(p.color.substr(3,2),16),b2=parseInt(p.color.substr(5,2),16);fC.fillStyle='rgba('+r+','+g+','+b2+','+a+')'}fC.beginPath();fC.arc(p.x,p.y,p.size*a,0,Math.PI*2);fC.fill()});

 // Draw title
 uC.clearRect(0,0,W,H);
 if(titleFade>.01||_section===5||_section===0){
  var ta=titleAlpha*titleFade;
  uC.fillStyle='rgba(255,255,255,'+ta+')';
  uC.font='bold '+(W<400?28:48)+'px "PingFang SC","Microsoft YaHei",sans-serif';uC.textAlign='center';
  uC.shadowColor='rgba(255,100,0,'+(ta*.8)+')';uC.shadowBlur=30;
  uC.fillText(titleText,W/2,H*.35);
  uC.font='bold '+(W<400?14:20)+'px "PingFang SC","Microsoft YaHei",sans-serif';
  uC.fillText(titleSub,W/2,H*.35+50);
 }

 // Draw HUD
 uC.shadowBlur=0;
 drawHUD(uC,T,sc);

 // Fade to black at start
 if(T<3){var a2=1-T/3;uC.fillStyle='rgba(0,0,0,'+a2+')';uC.fillRect(0,0,W,H)}
}
requestAnimationFrame(loop);
})();</script></body></html>
