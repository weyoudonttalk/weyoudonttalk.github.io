<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>空地大战</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none}
#c{display:block;width:100%;height:100%}
#load{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:13px;z-index:99;background:rgba(0,0,0,.8);padding:8px 22px;border-radius:8px;text-align:center}
#skip{position:fixed;bottom:30px;right:20px;z-index:99;color:rgba(255,255,255,.3);font-size:11px;cursor:pointer;padding:6px 14px;border:1px solid rgba(255,255,255,.1);border-radius:4px;pointer-events:auto}#skip:active{color:#f60}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="load">⚡ 加载引擎…</div><div id="skip" onclick="window._skip=true;this.style.display='none'">跳过</div>

<script>
var L=document.getElementById('load');
var CDN_LIST=[
  'https://unpkg.com/three@0.160.0/build/three.min.js',
  'https://cdn.bootcdn.net/ajax/libs/three.js/0.160.0/three.min.js',
];
var cdnIdx=0;
function tryLoad(){
  if(cdnIdx>=CDN_LIST.length){
    L.innerHTML='⚠️ 网络连接失败<div><button onclick="location.reload()" style="margin-top:10px;background:#f60;color:#fff;border:none;padding:8px 24px;border-radius:14px;font-size:13px;cursor:pointer">🔄 重试</button></div>';
    return;
  }
  L.textContent='⚡ 加载引擎… ('+(cdnIdx+1)+'/2)';
  var s=document.createElement('script');s.src=CDN_LIST[cdnIdx];s.async=false;
  s.onload=function(){if(typeof THREE!=='undefined'){L.textContent='✅ 就绪';setTimeout(startApp,80)}else{cdnIdx++;tryLoad()}};
  s.onerror=function(){cdnIdx++;tryLoad()};
  document.head.appendChild(s);
  setTimeout(function(){cdnIdx++;tryLoad()},6000);
}

window._skip=false;

function startApp(){
try{
var S=new THREE.Scene();S.background=new THREE.Color(0x5a88bb);
var C=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,1,1000);C.position.set(60,35,80);C.lookAt(0,5,0);
var R=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,1.5));
S.add(new THREE.AmbientLight(0xffffff,1.4));
S.add(new THREE.DirectionalLight(0xfff8e8,0.7)).position.set(200,400,150);

// 地面
S.add(new THREE.Mesh(new THREE.PlaneGeometry(1500,1500),new THREE.MeshBasicMaterial({color:0x448844}))).rotation.x=-Math.PI/2;

// 山脉
for(var i=0;i<20;i++){var mx=(Math.random()-.5)*1000,mz=(Math.random()-.5)*1000;if(Math.hypot(mx,mz)<150)continue;var mh=30+Math.random()*180;S.add(new THREE.Mesh(new THREE.ConeGeometry(30+Math.random()*110,mh,10,6),new THREE.MeshBasicMaterial({color:Math.random()<.5?0x887766:0x778866}))).position.set(mx,mh/2,mz)}

// 建筑
for(var i=0;i<50;i++){var bx=(Math.random()-.5)*600,bz=(Math.random()-.5)*600;if(Math.hypot(bx,bz)<80)continue;S.add(new THREE.Mesh(new THREE.BoxGeometry(5+Math.random()*15,8+Math.random()*60,5+Math.random()*15),new THREE.MeshBasicMaterial({color:[0xaabbcc,0x8899aa][i%2]}))).position.set(bx,(8+Math.random()*60)/2,bz)}

// 树
for(var i=0;i<200;i++){var tX=(Math.random()-.5)*900,tZ=(Math.random()-.5)*900;if(Math.hypot(tX,tZ)<80)continue;S.add(new THREE.Mesh(new THREE.CylinderGeometry(.12,.2,3+Math.random()*5,6),new THREE.MeshBasicMaterial({color:0x5a3a1a}))).position.set(tX,1.5,tZ);S.add(new THREE.Mesh(new THREE.SphereGeometry(1+Math.random()*2,6,4),new THREE.MeshBasicMaterial({color:0x338822}))).position.set(tX,3.5+Math.random()*3,tZ)}

// 坦克
function mkTank(c){var g=new THREE.Group();var CM=new THREE.MeshBasicMaterial({color:c}),DK=new THREE.MeshBasicMaterial({color:0x111111});g.add(new THREE.Mesh(new THREE.BoxGeometry(5,1.5,8),CM));g.add(new THREE.Mesh(new THREE.BoxGeometry(5.5,.3,8.5),DK)).position.y=-.7;for(var s=-1;s<=1;s+=2){g.add(new THREE.Mesh(new THREE.BoxGeometry(.6,2.2,9),DK)).position.set(s*2.8,-.5,0);g.add(new THREE.Mesh(new THREE.CylinderGeometry(.7,.7,9,8),DK)).position.set(s*2.8,-1.6,0).rotation.x=Math.PI/2}var turret=new THREE.Group();turret.add(new THREE.Mesh(new THREE.CylinderGeometry(2,2.2,1.2,12),CM)).position.y=.6;var barrel=new THREE.Mesh(new THREE.CylinderGeometry(.15,.22,7,12),new THREE.MeshBasicMaterial({color:0x777777}));barrel.position.set(0,1.5,-3);barrel.rotation.x=-.2;turret.add(barrel);turret.position.set(0,.4,.5);g.add(turret);g.userData={turret:turret};return g}

// APC
function mkAPC(c){var g=new THREE.Group();var CM2=new THREE.MeshBasicMaterial({color:c}),DK2=new THREE.MeshBasicMaterial({color:0x1a1a1a});g.add(new THREE.Mesh(new THREE.BoxGeometry(4,2.5,7.5),CM2));for(var s=-1;s<=1;s+=2)for(var w=0;w<4;w++)g.add(new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,.3,10),DK2)).position.set(s*2.1,-1.8,-2.5+w*1.8);g.add(new THREE.Mesh(new THREE.BoxGeometry(3.8,.8,.2),new THREE.MeshBasicMaterial({color:0x335566,transparent:true,opacity:.6}))).position.set(0,.6,3.5);var t2=new THREE.Group();t2.add(new THREE.Mesh(new THREE.CylinderGeometry(.8,.9,.6,10),DK2));t2.add(new THREE.Mesh(new THREE.CylinderGeometry(.08,.1,2,8),DK2).rotation.x=-.15);t2.position.set(0,1.5,-.5);g.add(t2);g.userData={turret:t2};return g}

// 战斗机
function mkJet(){var g=new THREE.Group();var JR=new THREE.MeshBasicMaterial({color:0xdd2200}),JW=new THREE.MeshBasicMaterial({color:0xeeeedd});var pts=[];for(var i=0;i<=32;i++){var t=i/32,x=t*30-15,r;if(t<.05)r=.5;else if(t<.15)r=4;else r=4-.8*Math.sin((t-.15)/.85*Math.PI);pts.push(new THREE.Vector2(r,x))}g.add(new THREE.Mesh(new THREE.LatheGeometry(pts,32),JR));g.add(new THREE.Mesh(new THREE.BoxGeometry(3.5,.12,14),JW)).position.set(-1.5,-.05,0);g.add(new THREE.Mesh(new THREE.BoxGeometry(.15,2.2,2.5),JR)).position.set(-8,1.3,0);g.add(new THREE.Mesh(new THREE.BoxGeometry(1.3,.08,5),JW)).position.set(-13,0,0);g.add(new THREE.Mesh(new THREE.ConeGeometry(.9,5,8),new THREE.MeshBasicMaterial({color:0xffaa00}))).position.set(-18,0,0).rotation.z=Math.PI/2;return g}

// 直升机
function mkHeli(){var g=new THREE.Group();var HM=new THREE.MeshBasicMaterial({color:0x3d5530}),HL=new THREE.MeshBasicMaterial({color:0x999999});g.add(new THREE.Mesh(new THREE.BoxGeometry(3,2.5,12),HM));g.add(new THREE.Mesh(new THREE.BoxGeometry(1,.8,8),HM)).position.set(0,.3,9);g.add(new THREE.Mesh(new THREE.BoxGeometry(2.5,1.5,2.5),HM)).position.set(0,-.2,6);g.add(new THREE.Mesh(new THREE.BoxGeometry(2.8,1,.2),new THREE.MeshBasicMaterial({color:0x334455,transparent:true,opacity:.5}))).position.set(0,.5,5);var mr=new THREE.Group();mr.position.set(0,1.6,1);for(var i=0;i<5;i++){var a=i*Math.PI*2/5;var bl=new THREE.Mesh(new THREE.BoxGeometry(.06,.02,5),HL);bl.position.set(Math.cos(a)*2.2,0,Math.sin(a)*2.2);bl.rotation.z=a;mr.add(bl);var tp2=new THREE.Mesh(new THREE.BoxGeometry(.06,.02,.4),new THREE.MeshBasicMaterial({color:0xff0000}));tp2.position.set(Math.cos(a)*4.3,0,Math.sin(a)*4.3);tp2.rotation.z=a;mr.add(tp2)}g.add(mr);g.userData={mr:mr};return g}

// 放置
var tanks=[];for(var i=0;i<5;i++){var t=mkTank([0x556633,0x664422,0x445533,0x554433,0x635533][i]);t.position.set(-60+i*30,-.5,-40+Math.sin(i)*10);t.rotation.y=.3;S.add(t);tanks.push(t)}
var apcs=[];for(var i=0;i<3;i++){var a=mkAPC([0x445522,0x334422,0x445533][i]);a.position.set(-90+i*40,-.5,20);a.rotation.y=-.2;S.add(a);apcs.push(a)}
var heli=mkHeli();heli.position.set(50,25,-30);S.add(heli);heli.userData.alive=true;heli.userData.spin=0;heli.userData.fallV=0;
var jet=mkJet();jet.position.set(-100,50,80);jet.rotation.y=Math.PI/2-.3;S.add(jet);

// GLB容器（代码后备）
var gHeli=new THREE.Group();gHeli.position.set(70,30,-60);S.add(gHeli);gHeli.userData={alive:true,mr:null,spin:0,fallV:0};
var gBox=new THREE.Mesh(new THREE.BoxGeometry(6,4,12),new THREE.MeshBasicMaterial({color:0x668844}));gBox.position.y=2;gHeli.add(gBox);
var gMr=new THREE.Group();gMr.position.y=5;for(var i=0;i<4;i++){var aa=i*Math.PI/2;var bl2=new THREE.Mesh(new THREE.BoxGeometry(.06,.02,5),new THREE.MeshBasicMaterial({color:0x999999}));bl2.position.set(Math.cos(aa)*2,0,Math.sin(aa)*2);bl2.rotation.z=aa;gMr.add(bl2)}gHeli.add(gMr);gHeli.userData.mr=gMr;
var gF15=new THREE.Group();gF15.position.set(80,60,-100);S.add(gF15);
var gF15Box=new THREE.Mesh(new THREE.BoxGeometry(7,2,14),new THREE.MeshBasicMaterial({color:0x888899}));gF15Box.position.y=2;gF15.add(gF15Box);
var gF15Wing=new THREE.Mesh(new THREE.BoxGeometry(1,.1,10),new THREE.MeshBasicMaterial({color:0x666677}));gF15Wing.position.set(0,2,0);gF15.add(gF15Wing);

// 粒子
var P=[];
function sp(x,y,z,col,n,s){s=s||60;for(var i=0;i<n;i++)P.push({x:x,y:y,z:z,vx:(Math.random()-.5)*s,vy:Math.random()*s*.3-Math.random()*s*.5,vz:(Math.random()-.5)*s,l:.5+Math.random()*1.5,c:col,sz:1+Math.random()*3})}

// 导弹
var M=[];
var fired1=false,fired2=false;

L.style.opacity='0';setTimeout(function(){L.style.display='none'},400);

// 主循环
var T=0,pt2=performance.now(),lT=0;
(function tick(now){try{
  requestAnimationFrame(tick);
  if(window._skip){R.render(S,C);return}
  if(lT===0){lT=now;pt2=now;return}
  var dt=(now-pt2)/1000;pt2=now;if(dt<=0||dt>.2)dt=.016;T+=dt;

  // 坦克前进
  for(var i=0;i<tanks.length;i++){var t2=tanks[i];if(!t2||!t2.position)continue;t2.position.z+=3*dt;if(t2.position.z>80)t2.position.z=-80}
  // APC前进
  for(var i=0;i<apcs.length;i++){var a2=apcs[i];if(!a2||!a2.position)continue;a2.position.z+=2.5*dt;if(a2.position.z>80)a2.position.z=-80}

  // 直升机巡逻
  if(heli.userData.alive){if(heli.position){heli.position.z+=12*dt;heli.position.y=25+Math.sin(T*.4)*5;if(heli.position.z>100)heli.position.z=-100}if(heli.userData.mr)heli.userData.mr.rotation.y+=dt*15}

  // 战斗机巡逻
  if(jet.position){jet.position.z+=30*dt;jet.position.y=50+Math.sin(T*.5)*15;if(jet.position.z>150)jet.position.z=-100}

  // GLB直升机
  if(gHeli.userData.alive){if(gHeli.position){gHeli.position.z+=10*dt;gHeli.position.y=30+Math.sin(T*.35)*4;if(gHeli.position.z>100)gHeli.position.z=-100}if(gHeli.userData.mr)gHeli.userData.mr.rotation.y+=dt*16}

  // GLB F15
  if(gF15.position){gF15.position.z+=35*dt;gF15.position.y=60+Math.sin(T*.45)*20;if(gF15.position.z>150)gF15.position.z=-120}

  // 发射导弹1
  if(T>2.5&&!fired1&&jet.position&&heli.position){fired1=true;var d1=new THREE.Vector3().subVectors(heli.position,jet.position).normalize();M.push({x:jet.position.x,y:jet.position.y,z:jet.position.z,vx:d1.x*70,vy:d1.y*70,vz:d1.z*70,life:0,maxL:3,target:heli});sp(jet.position.x,jet.position.y,jet.position.z,'#ffaa00',15,30)}
  if(T>5&&!fired2&&jet.position&&gHeli.position){fired2=true;var d2=new THREE.Vector3().subVectors(gHeli.position,jet.position).normalize();M.push({x:jet.position.x,y:jet.position.y,z:jet.position.z,vx:d2.x*70,vy:d2.y*70,vz:d2.z*70,life:0,maxL:3,target:gHeli});sp(jet.position.x,jet.position.y,jet.position.z,'#ffcc00',15,30)}

  // 更新导弹
  for(var i=M.length-1;i>=0;i--){var m=M[i];if(m.x===undefined){M.splice(i,1);continue}
    m.x+=m.vx*dt;m.y+=m.vy*dt;m.z+=m.vz*dt;m.life+=dt;sp(m.x,m.y,m.z,'#ff8800',1,5);
    var tg=m.target;if(!tg||!tg.position){M.splice(i,1);continue}
    var dd=Math.sqrt((m.x-tg.position.x)*(m.x-tg.position.x)+(m.y-tg.position.y)*(m.y-tg.position.y)+(m.z-tg.position.z)*(m.z-tg.position.z));
    if(dd<10){
      if(tg===heli&&heli.userData.alive){heli.userData.alive=false;sp(tg.position.x,tg.position.y,tg.position.z,'#ff4400',60,140)}
      if(tg===gHeli&&gHeli.userData.alive){gHeli.userData.alive=false;sp(tg.position.x,tg.position.y,tg.position.z,'#ff6600',60,140)}
      M.splice(i,1);
    }
    if(m.life>m.maxL)M.splice(i,1);
  }

  // 直升机1坠毁
  if(!heli.userData.alive&&heli.position){heli.userData.spin+=dt*9;heli.userData.fallV+=dt*35;heli.rotation.z+=dt*7;heli.position.y-=heli.userData.fallV*dt;heli.position.x+=Math.sin(heli.userData.spin)*3*dt;sp(heli.position.x,heli.position.y,heli.position.z,'#555555',1,5);if(heli.position.y<1){heli.position.y=1;sp(heli.position.x,1,heli.position.z,'#ff4400',100,180);heli.visible=false;heli.userData.alive=null}}

  // 直升机2坠毁
  if(!gHeli.userData.alive&&gHeli.position){gHeli.userData.spin+=dt*8;gHeli.userData.fallV+=dt*32;gHeli.rotation.z+=dt*6;gHeli.position.y-=gHeli.userData.fallV*dt;gHeli.position.x-=Math.cos(gHeli.userData.spin)*3*dt;sp(gHeli.position.x,gHeli.position.y,gHeli.position.z,'#555555',1,5);if(gHeli.position.y<1){gHeli.position.y=1;sp(gHeli.position.x,1,gHeli.position.z,'#ff6600',100,180);gHeli.visible=false;gHeli.userData.alive=null}}

  // 更新粒子
  for(var i=P.length-1;i>=0;i--){var p=P[i];if(!p||p.x===undefined||p.l===undefined){P.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.l-=dt;if(p.l<=0)P.splice(i,1)}

  // 电影运镜
  if(C&&C.position){var cp;if(T<2){cp=new THREE.Vector3(40,25,60);C.position.lerp(cp,2*dt);C.lookAt(0,5,0)}else if(T<4&&jet.position&&heli.position){cp=new THREE.Vector3(jet.position.x-15,jet.position.y+10,jet.position.z+8);C.position.lerp(cp,3*dt);C.lookAt(heli.position)}else if(T<7&&heli.position&&heli.visible){cp=new THREE.Vector3(heli.position.x+15,heli.position.y+12,heli.position.z+15);C.position.lerp(cp,3*dt);C.lookAt(heli.position)}else if(T<11){var fx=gHeli.position?gHeli.position.x:0,fy=gHeli.position?gHeli.position.y:30,fz=gHeli.position?gHeli.position.z:0;cp=new THREE.Vector3(fx-10,fy+12,fz+10);C.position.lerp(cp,3*dt);C.lookAt(fx,fy,fz)}}

  // 渲染粒子和导弹
  P.forEach(function(p){if(!p||p.l<.01)return;try{var m2=new THREE.Mesh(new THREE.SphereGeometry(p.sz*.2,4,4),new THREE.MeshBasicMaterial({color:parseInt((p.c||'#ffffff').replace('#',''),16),transparent:true,opacity:Math.min(1,p.l)}));m2.position.set(p.x,p.y,p.z);S.add(m2);setTimeout(function(){try{S.remove(m2)}catch(e){}},80)}catch(e){}});
  M.forEach(function(m){if(!m||m.x===undefined)return;try{var m3=new THREE.Mesh(new THREE.CylinderGeometry(.12,.14,1,6),new THREE.MeshBasicMaterial({color:0xff8800}));m3.position.set(m.x,m.y,m.z);S.add(m3);setTimeout(function(){try{S.remove(m3)}catch(e){}},80)}catch(e){}});

  R.render(S,C);
}catch(e){console.warn('tick error:',e.message)}})(performance.now());

window.addEventListener('resize',function(){
  try{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)}catch(e){}
});

}catch(e){
  L.innerHTML='⚠️ 启动错误：<br>'+e.message+'<br><button onclick="location.reload()" style="margin-top:10px;background:#f60;color:#fff;border:none;padding:8px 24px;border-radius:14px;font-size:13px;cursor:pointer">🔄 刷新</button>';
  L.style.opacity='1';
}
}
tryLoad();
</script>
</body></html>
