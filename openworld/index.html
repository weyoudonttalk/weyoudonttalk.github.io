<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>空地大战</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none}
#c{display:block;width:100%;height:100%}
#info{position:fixed;top:10px;left:10px;color:#fff;font-size:11px;z-index:99;text-shadow:0 0 6px #000;line-height:1.6}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">加载中…</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script>
(function () {

var I=document.getElementById('info');
if(typeof THREE === 'undefined'){
 I.textContent='THREE.js 加载失败';
 return;
}
I.textContent='THREE v'+THREE.REVISION+' 已加载, 初始化…';

try {

var S=new THREE.Scene();
S.background=new THREE.Color(0x5a88bb);

var C=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,1,1000);
C.position.set(60,35,80);
C.lookAt(0,5,0);

var R=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
R.setSize(innerWidth,innerHeight);
R.setPixelRatio(Math.min(devicePixelRatio,1.5));

S.add(new THREE.AmbientLight(0xffffff,1.4));
var dl=new THREE.DirectionalLight(0xfff8e8,0.7);
dl.position.set(200,400,150);
S.add(dl);

// 地面
S.add(new THREE.Mesh(
 new THREE.PlaneGeometry(1500,1500),
 new THREE.MeshBasicMaterial({color:0x448844})
)).rotation.x=-Math.PI/2;

// 山脉
for(var i=0;i<20;i++){
 var mx=(Math.random()-.5)*1000,mz=(Math.random()-.5)*1000;
 if(mx*mx+mz*mz<22500)continue;
 var mh=30+Math.random()*180;
 S.add(new THREE.Mesh(
  new THREE.ConeGeometry(30+Math.random()*110,mh,10,6),
  new THREE.MeshBasicMaterial({color:Math.random()<.5?0x887766:0x778866})
 )).position.set(mx,mh/2,mz);
}

// 建筑
var bcs=[0xaabbcc,0x8899aa,0x667788,0xccddee];
for(var i=0;i<50;i++){
 var bx=(Math.random()-.5)*600,bz=(Math.random()-.5)*600;
 if(bx*bx+bz*bz<6400)continue;
 S.add(new THREE.Mesh(
  new THREE.BoxGeometry(5+Math.random()*15,8+Math.random()*60,5+Math.random()*15),
  new THREE.MeshBasicMaterial({color:bcs[i%4]})
 )).position.set(bx,(8+Math.random()*60)/2,bz);
}

// 树
for(var i=0;i<200;i++){
 var tX=(Math.random()-.5)*900,tZ=(Math.random()-.5)*900;
 if(tX*tX+tZ*tZ<6400)continue;
 S.add(new THREE.Mesh(
  new THREE.CylinderGeometry(.12,.2,3+Math.random()*5,6),
  new THREE.MeshBasicMaterial({color:0x5a3a1a})
 )).position.set(tX,1.5,tZ);
 S.add(new THREE.Mesh(
  new THREE.SphereGeometry(1+Math.random()*2,6,4),
  new THREE.MeshBasicMaterial({color:0x338822})
 )).position.set(tX,3.5+Math.random()*3,tZ);
}

// === 坦克 ===
function makeTank(c){
 var g=new THREE.Group();
 var CT=new THREE.MeshBasicMaterial({color:c});
 var DK=new THREE.MeshBasicMaterial({color:0x111111});
 var GR=new THREE.MeshBasicMaterial({color:0x777777});
 var h1=new THREE.Mesh(new THREE.BoxGeometry(5,1.5,8),CT);g.add(h1);
 for(var s=-1;s<=1;s+=2){
  var t1=new THREE.Mesh(new THREE.BoxGeometry(.6,2.2,9),DK);t1.position.set(s*2.8,-0.5,0);g.add(t1);
  var t2=new THREE.Mesh(new THREE.CylinderGeometry(.7,.7,9,8),DK);t2.position.set(s*2.8,-1.6,0);t2.rotation.x=Math.PI/2;g.add(t2);
 }
 var turret=new THREE.Group();
 var t3=new THREE.Mesh(new THREE.CylinderGeometry(2,2.2,1.2,12),CT);t3.position.y=0.6;turret.add(t3);
 var t4=new THREE.Mesh(new THREE.CylinderGeometry(.15,.22,7,12),GR);t4.position.set(0,1.5,-3);t4.rotation.x=-0.2;turret.add(t4);
 turret.position.set(0,0.4,0.5);g.add(turret);
 return g;
}

// === APC ===
function makeAPC(c){
 var g=new THREE.Group();
 var CT2=new THREE.MeshBasicMaterial({color:c});
 var DK2=new THREE.MeshBasicMaterial({color:0x1a1a1a});
 var a1=new THREE.Mesh(new THREE.BoxGeometry(4,2.5,7.5),CT2);g.add(a1);
 for(var s=-1;s<=1;s+=2){
  for(var w=0;w<4;w++){
   var a2=new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,.3,10),DK2);a2.position.set(s*2.1,-1.8,-2.5+w*1.8);g.add(a2);
  }
 }
 var a3=new THREE.Mesh(new THREE.BoxGeometry(3.8,.8,.2),new THREE.MeshBasicMaterial({color:0x335566,transparent:true,opacity:.6}));a3.position.set(0,0.6,3.5);g.add(a3);
 var t2=new THREE.Group();
 var a4=new THREE.Mesh(new THREE.CylinderGeometry(.8,.9,.6,10),DK2);t2.add(a4);
 var a5=new THREE.Mesh(new THREE.CylinderGeometry(.08,.1,2,8),DK2);a5.rotation.x=-0.15;t2.add(a5);
 t2.position.set(0,1.5,-0.5);g.add(t2);
 return g;
}

// === 战斗机 ===
function makeJet(){
 var g=new THREE.Group();
 var JR=new THREE.MeshBasicMaterial({color:0xdd2200});
 var JW=new THREE.MeshBasicMaterial({color:0xeeeedd});
 var JD=new THREE.MeshBasicMaterial({color:0x111122});
 var JA=new THREE.MeshBasicMaterial({color:0xffaa00});
 var j1=new THREE.Mesh(new THREE.ConeGeometry(1,5,8),JR);j1.position.set(25,0,0);j1.rotation.z=Math.PI/2;g.add(j1);
 var j2=new THREE.Mesh(new THREE.CylinderGeometry(1,3,10,16),JR);j2.position.set(17,0,0);j2.rotation.z=Math.PI/2;g.add(j2);
 var j3=new THREE.Mesh(new THREE.CylinderGeometry(3,3.5,12,16),JR);j3.position.set(6,0,0);j3.rotation.z=Math.PI/2;g.add(j3);
 var j4=new THREE.Mesh(new THREE.CylinderGeometry(3.5,2.5,10,16),JR);j4.position.set(-5,0,0);j4.rotation.z=Math.PI/2;g.add(j4);
 var j5=new THREE.Mesh(new THREE.CylinderGeometry(2.5,1.5,6,16),JR);j5.position.set(-13,0,0);j5.rotation.z=Math.PI/2;g.add(j5);
 var j6=new THREE.Mesh(new THREE.BoxGeometry(3,0.12,16),JW);j6.position.set(2,-0.1,0);g.add(j6);
 var j7=new THREE.Mesh(new THREE.BoxGeometry(0.15,2.5,3),JR);j7.position.set(-8,1.5,0);g.add(j7);
 var j8=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.08,6),JW);j8.position.set(-14,0,0);g.add(j8);
 var j9=new THREE.Mesh(new THREE.CylinderGeometry(1,1.2,3,12),JD);j9.position.set(-16.5,0,0);j9.rotation.z=Math.PI/2;g.add(j9);
 var j10=new THREE.Mesh(new THREE.ConeGeometry(.9,5,8),JA);j10.position.set(-19,0,0);j10.rotation.z=Math.PI/2;g.add(j10);
 return g;
}

// === 运输直升机 ===
function makeHeli(){
 var g=new THREE.Group();
 var HM=new THREE.MeshBasicMaterial({color:0x3d5530});
 var HD=new THREE.MeshBasicMaterial({color:0x1a2815});
 var HL=new THREE.MeshBasicMaterial({color:0x999999});
 var HR=new THREE.MeshBasicMaterial({color:0xff0000});
 var h1=new THREE.Mesh(new THREE.BoxGeometry(3,2.5,12),HM);g.add(h1);
 var h2=new THREE.Mesh(new THREE.BoxGeometry(3.2,0.3,12.2),HD);h2.position.y=-1.2;g.add(h2);
 var h3=new THREE.Mesh(new THREE.BoxGeometry(2.5,1.5,2.5),HM);h3.position.set(0,-0.2,6);g.add(h3);
 var h4=new THREE.Mesh(new THREE.BoxGeometry(1,0.8,9),HM);h4.position.set(0,0.3,9.5);g.add(h4);
 var h5=new THREE.Mesh(new THREE.BoxGeometry(2.8,1,0.2),new THREE.MeshBasicMaterial({color:0x445566,transparent:true,opacity:0.55}));h5.position.set(0,0.5,5.5);g.add(h5);
 var mr=new THREE.Group();mr.position.set(0,1.6,1);
 for(var i=0;i<5;i++){
  var a=i*Math.PI*2/5;
  var bl=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.02,5),HL);bl.position.set(Math.cos(a)*2.2,0,Math.sin(a)*2.2);bl.rotation.z=a;mr.add(bl);
  var tp=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.02,0.4),HR);tp.position.set(Math.cos(a)*4.3,0,Math.sin(a)*4.3);tp.rotation.z=a;mr.add(tp);
 }
 g.add(mr);
 g.userData={mr:mr,alive:true,spin:0,fallV:0};
 return g;
}

// 放置载具
var tanks=[];
for(var i=0;i<5;i++){
 var t=makeTank([0x556633,0x664422,0x445533,0x554433,0x635533][i]);
 t.position.set(-60+i*30,-0.5,-40+Math.sin(i)*10);
 t.rotation.y=0.3;
 S.add(t);
 tanks.push(t);
}

var apcs=[];
for(var i=0;i<3;i++){
 var a=makeAPC([0x445522,0x334422,0x445533][i]);
 a.position.set(-90+i*40,-0.5,20);
 a.rotation.y=-0.2;
 S.add(a);
 apcs.push(a);
}

var heli=makeHeli();
heli.position.set(50,25,-30);
S.add(heli);

var heli2=makeHeli();
heli2.position.set(70,30,-60);
S.add(heli2);
heli2.userData.alive=true;
heli2.userData.spin=0;
heli2.userData.fallV=0;

var jet=makeJet();
jet.position.set(-100,50,80);
jet.rotation.y=Math.PI/2-0.3;
S.add(jet);

I.innerHTML='<b>空地大战</b><br>坦克×5 APC×3 直升机×2 战斗机×1';

// 粒子
var P=[];
function sp(x,y,z,col,n,spd){
 spd=spd||60;
 for(var i=0;i<n;i++){
  P.push({
   x:x,y:y,z:z,
   vx:(Math.random()-0.5)*spd,
   vy:Math.random()*spd*0.3-Math.random()*spd*0.5,
   vz:(Math.random()-0.5)*spd,
   l:0.5+Math.random()*1.5,
   c:col,
   sz:1+Math.random()*3
  });
 }
}

// 导弹
var M=[];
var f1=false,f2=false;

// 主循环
var startT=0,lastT=0;

function loop(now){
 requestAnimationFrame(loop);
 if(!startT){startT=now;lastT=now;R.render(S,C);return}

 var dt=(now-lastT)/1000;
 lastT=now;
 if(dt<=0||dt>0.2)dt=0.016;
 var t=(now-startT)/1000;

 // 坦克
 for(var i=0;i<tanks.length;i++){var tk=tanks[i];if(!tk)continue;tk.position.z+=3*dt;if(tk.position.z>80)tk.position.z=-80}
 // APC
 for(var i=0;i<apcs.length;i++){var ap=apcs[i];if(!ap)continue;ap.position.z+=2.5*dt;if(ap.position.z>80)ap.position.z=-80}

 // 直升机1
 if(heli.userData.alive){
  heli.position.z+=12*dt;
  heli.position.y=25+Math.sin(t*0.4)*5;
  if(heli.position.z>100)heli.position.z=-100;
  if(heli.userData.mr)heli.userData.mr.rotation.y+=dt*15;
 }

 // 战斗机
 jet.position.z+=30*dt;
 jet.position.y=50+Math.sin(t*0.5)*15;
 if(jet.position.z>150)jet.position.z=-100;

 // 直升机2
 if(heli2.userData.alive){
  heli2.position.z+=10*dt;
  heli2.position.y=30+Math.sin(t*0.35)*4;
  if(heli2.position.z>100)heli2.position.z=-100;
  if(heli2.userData.mr)heli2.userData.mr.rotation.y+=dt*16;
 }

 // 导弹1
 if(t>2.5&&!f1){
  f1=true;
  sp(jet.position.x,jet.position.y,jet.position.z,'#ffaa00',15,30);
  var dx=heli.position.x-jet.position.x,dy=heli.position.y-jet.position.y,dz=heli.position.z-jet.position.z;
  var dl=Math.sqrt(dx*dx+dy*dy+dz*dz);
  M.push({x:jet.position.x,y:jet.position.y,z:jet.position.z,vx:dx/dl*70,vy:dy/dl*70,vz:dz/dl*70,life:0,maxL:3,tid:0});
 }

 // 导弹2
 if(t>5&&!f2){
  f2=true;
  sp(jet.position.x,jet.position.y,jet.position.z,'#ffcc00',15,30);
  var dx=heli2.position.x-jet.position.x,dy=heli2.position.y-jet.position.y,dz=heli2.position.z-jet.position.z;
  var dl=Math.sqrt(dx*dx+dy*dy+dz*dz);
  M.push({x:jet.position.x,y:jet.position.y,z:jet.position.z,vx:dx/dl*70,vy:dy/dl*70,vz:dz/dl*70,life:0,maxL:3,tid:1});
 }

 // 更新导弹
 for(var i=M.length-1;i>=0;i--){
  var m=M[i];
  m.x+=m.vx*dt;m.y+=m.vy*dt;m.z+=m.vz*dt;m.life+=dt;
  sp(m.x,m.y,m.z,'#ff8800',1,5);
  var tg=m.tid===0?heli:heli2;
  var ddd=Math.sqrt((m.x-tg.position.x)*(m.x-tg.position.x)+(m.y-tg.position.y)*(m.y-tg.position.y)+(m.z-tg.position.z)*(m.z-tg.position.z));
  if(ddd<10){
   tg.userData.alive=false;
   sp(tg.position.x,tg.position.y,tg.position.z,'#ff4400',60,140);
   M.splice(i,1);
   continue;
  }
  if(m.life>m.maxL){M.splice(i,1);continue}
 }

 // 直升机1坠毁
 if(!heli.userData.alive&&heli.visible!==false){
  heli.userData.spin+=dt*9;
  heli.userData.fallV+=dt*35;
  heli.rotation.z+=dt*7;
  heli.position.y-=heli.userData.fallV*dt;
  heli.position.x+=Math.sin(heli.userData.spin)*3*dt;
  sp(heli.position.x,heli.position.y,heli.position.z,'#555555',1,5);
  if(heli.position.y<1){
   heli.position.y=1;
   sp(heli.position.x,1,heli.position.z,'#ff4400',100,180);
   heli.visible=false;
  }
 }

 // 直升机2坠毁
 if(!heli2.userData.alive&&heli2.visible!==false){
  heli2.userData.spin+=dt*8;
  heli2.userData.fallV+=dt*32;
  heli2.rotation.z+=dt*6;
  heli2.position.y-=heli2.userData.fallV*dt;
  heli2.position.x-=Math.cos(heli2.userData.spin)*3*dt;
  sp(heli2.position.x,heli2.position.y,heli2.position.z,'#555555',1,5);
  if(heli2.position.y<1){
   heli2.position.y=1;
   sp(heli2.position.x,1,heli2.position.z,'#ff6600',100,180);
   heli2.visible=false;
  }
 }

 // 粒子渲染
 for(var i=P.length-1;i>=0;i--){
  var p=P[i];
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.l-=dt;
  if(p.l<=0){P.splice(i,1);continue}
  try{
   var pm=new THREE.Mesh(
    new THREE.SphereGeometry(p.sz*0.2,4,4),
    new THREE.MeshBasicMaterial({color:parseInt(p.c.replace('#',''),16),transparent:true,opacity:Math.min(1,p.l)})
   );
   pm.position.set(p.x,p.y,p.z);
   S.add(pm);
   setTimeout(function(){try{S.remove(pm)}catch(e){}},60);
  }catch(e){}
 }

 // 导弹渲染
 for(var i=M.length-1;i>=0;i--){
  var ms=M[i];
  if(!ms||isNaN(ms.x)){M.splice(i,1);continue}
  try{
   var mm=new THREE.Mesh(
    new THREE.SphereGeometry(0.3,6,6),
    new THREE.MeshBasicMaterial({color:0xff6600})
   );
   mm.position.set(ms.x,ms.y,ms.z);
   S.add(mm);
   setTimeout(function(){try{S.remove(mm)}catch(e){}},80);
  }catch(e){}
 }

 // 电影运镜
 if(t<2){
  C.position.set(40,25,60);
  C.lookAt(0,5,0);
 }else if(t<4){
  C.position.set(jet.position.x-15,jet.position.y+10,jet.position.z+8);
  C.lookAt(heli.position);
 }else if(t<7){
  C.position.set(heli.position.x+15,heli.position.y+12,heli.position.z+15);
  C.lookAt(heli.position);
 }else{
  C.position.set(heli2.position.x-10,heli2.position.y+12,heli2.position.z+10);
  C.lookAt(heli2.position);
 }

 R.render(S,C);
}

// 第一帧
R.render(S,C);
// 启动循环
requestAnimationFrame(loop);

window.addEventListener('resize',function(){
 C.aspect=innerWidth/innerHeight;
 C.updateProjectionMatrix();
 R.setSize(innerWidth,innerHeight);
});

} catch(e){
 I.textContent='错误: '+e.message;
}

})();
</script>
</body>
</html>
