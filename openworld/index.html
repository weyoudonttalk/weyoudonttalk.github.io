<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>钢铁风暴</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none}#c{display:block;width:100%;height:100%}#info{position:fixed;top:10px;left:10px;color:#fff;font-size:11px;z-index:99;text-shadow:0 0 6px #000;line-height:1.6}</style></head><body>
<canvas id="c"></canvas><div id="info">加载中…</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
(function(){
var I=document.getElementById('info');
if(typeof THREE==='undefined'){I.textContent='THREE加载失败,请刷新';return}
I.textContent='THREE v'+THREE.REVISION+' OK, 场景建造中…';

var S=new THREE.Scene();S.background=new THREE.Color(0x1a2f44);S.fog=new THREE.Fog(0x4a7899,150,600);
var C=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,1,800);
C.position.set(30,20,80);C.lookAt(0,8,0);
var R=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,1.5));
S.add(new THREE.AmbientLight(0x8899cc,1.0));
S.add(new THREE.DirectionalLight(0xfff0dd,0.8)).position.set(150,200,100);

// ===== GROUND =====
var gnd=new THREE.Mesh(new THREE.PlaneGeometry(1000,1000),new THREE.MeshBasicMaterial({color:0x336633}));
gnd.rotation.x=-Math.PI/2;S.add(gnd);

// Road
for(var i=0;i<15;i++){
 var rd=new THREE.Mesh(new THREE.PlaneGeometry(6,1000),new THREE.MeshBasicMaterial({color:0x333333}));
 rd.rotation.x=-Math.PI/2;rd.rotation.z=(i/15)*Math.PI*2;rd.position.y=0.02;S.add(rd);
}

// Mountains backdrop
for(var i=0;i<30;i++){
 var mx=(Math.random()-.5)*800,mz=(Math.random()-.5)*800;if(mx*mx+mz*mz<10000)continue;
 var mh=20+Math.random()*150;
 S.add(new THREE.Mesh(new THREE.ConeGeometry(25+Math.random()*100,mh,8,6),new THREE.MeshBasicMaterial({color:Math.random()<.5?0x664433:0x556644}))).position.set(mx,mh/2,mz);
}

// Buildings
for(var i=0;i<60;i++){
 var bx=(Math.random()-.5)*500,bz=(Math.random()-.5)*500;if(bx*bx+bz*bz<4000)continue;
 S.add(new THREE.Mesh(new THREE.BoxGeometry(4+Math.random()*12,6+Math.random()*50,4+Math.random()*12),new THREE.MeshBasicMaterial({color:[0x778899,0x667788,0x8899aa,0x998877][i%4]}))).position.set(bx,(6+Math.random()*50)/2,bz);
}

// Trees
for(var i=0;i<200;i++){
 var tx=(Math.random()-.5)*700,tz=(Math.random()-.5)*700;if(tx*tx+tz*tz<4000)continue;
 S.add(new THREE.Mesh(new THREE.CylinderGeometry(.1,.18,3+Math.random()*4,6),new THREE.MeshBasicMaterial({color:0x4a2a10}))).position.set(tx,1.5,tz);
 S.add(new THREE.Mesh(new THREE.SphereGeometry(1+Math.random()*2,5,4),new THREE.MeshBasicMaterial({color:0x226622}))).position.set(tx,4+Math.random()*3,tz);
}

// ===== DETAILED 3D TANK =====
function buildTank(color){
 var g=new THREE.Group();
 var C1=new THREE.MeshBasicMaterial({color:color});
 var DK=new THREE.MeshBasicMaterial({color:0x111111});
 var GR=new THREE.MeshBasicMaterial({color:0x666666});
 // Hull
 g.add(new THREE.Mesh(new THREE.BoxGeometry(4,1.2,7),C1));
 // Armor plates
 g.add(new THREE.Mesh(new THREE.BoxGeometry(4.4,.2,7.2),DK)).position.y=-.6;
 g.add(new THREE.Mesh(new THREE.BoxGeometry(2,.1,7),DK)).position.y=.55;
 // Tracks
 for(var s=-1;s<=1;s+=2){
  g.add(new THREE.Mesh(new THREE.BoxGeometry(.5,1.8,8),DK)).position.set(s*2.2,-.4,0);
  for(var w=0;w<5;w++){g.add(new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,8,8),DK)).position.set(s*2.2,-1.3,-3+w*1.5).rotation.x=Math.PI/2}
 }
 // Turret
 var turret=new THREE.Group();
 turret.add(new THREE.Mesh(new THREE.CylinderGeometry(1.6,1.8,.9,14),C1)).position.y=.55;
 turret.add(new THREE.Mesh(new THREE.CylinderGeometry(1.4,1.6,.5,14),DK)).position.y=.45;
 // Barrel
 var barrel=new THREE.Mesh(new THREE.CylinderGeometry(.12,.18,6,10),GR);
 barrel.position.set(0,1.2,-3);barrel.rotation.x=-.25;turret.add(barrel);
 // Barrel tip
 turret.add(new THREE.Mesh(new THREE.CylinderGeometry(.16,.2,.8,10),DK)).position.set(0,1.2,-5.8).rotation.x=-.25;
 turret.position.set(0,.3,1);g.add(turret);
 g.userData={turret:turret};
 return g;
}

// ===== DETAILED 3D APC =====
function buildAPC(color){
 var g=new THREE.Group();
 var C2=new THREE.MeshBasicMaterial({color:color});
 var DK2=new THREE.MeshBasicMaterial({color:0x111111});
 g.add(new THREE.Mesh(new THREE.BoxGeometry(3.5,2,7),C2));
 for(var s=-1;s<=1;s+=2)for(var w=0;w<4;w++){g.add(new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,.25,8),DK2)).position.set(s*1.8,-1.4,-2.3+w*1.6)}
 g.add(new THREE.Mesh(new THREE.BoxGeometry(3,.7,.15),new THREE.MeshBasicMaterial({color:0x334455,transparent:true,opacity:.6}))).position.set(0,.5,3.3);
 var t2=new THREE.Group();t2.add(new THREE.Mesh(new THREE.CylinderGeometry(.6,.7,.5,10),DK2));t2.position.set(0,1.3,-.8);g.add(t2);
 return g;
}

// ===== DETAILED 3D FIGHTER JET =====
function buildJet(){
 var g=new THREE.Group();
 var JR=new THREE.MeshBasicMaterial({color:0xdd2200});
 var JW2=new THREE.MeshBasicMaterial({color:0xddddcc});
 var JY=new THREE.MeshBasicMaterial({color:0xffaa00});
 var JD=new THREE.MeshBasicMaterial({color:0x111122});
 // Fuselage - built from cylinders
 g.add(new THREE.Mesh(new THREE.ConeGeometry(.8,4,10),JR)).position.set(3,0,0).rotation.z=Math.PI/2;
 g.add(new THREE.Mesh(new THREE.CylinderGeometry(.8,2.2,8,12),JR)).position.set(-2,0,0).rotation.z=Math.PI/2;
 g.add(new THREE.Mesh(new THREE.CylinderGeometry(2.2,2.8,10,12),JR)).position.set(-11,0,0).rotation.z=Math.PI/2;
 g.add(new THREE.Mesh(new THREE.CylinderGeometry(2.8,1.8,8,12),JR)).position.set(-20,0,0).rotation.z=Math.PI/2;
 g.add(new THREE.Mesh(new THREE.CylinderGeometry(1.8,1,5,12),JR)).position.set(-26,0,0).rotation.z=Math.PI/2;
 // Wings
 g.add(new THREE.Mesh(new THREE.BoxGeometry(2.5,.08,12),JW2)).position.set(-9,0,0);
 // Red wing edges
 g.add(new THREE.Mesh(new THREE.BoxGeometry(2.6,.09,.4),JR)).position.set(-9,0,5.6);
 g.add(new THREE.Mesh(new THREE.BoxGeometry(2.6,.09,.4),JR)).position.set(-9,0,-5.6);
 // Vertical stabilizer
 g.add(new THREE.Mesh(new THREE.BoxGeometry(.1,2,2.5),JR)).position.set(-24,1.3,0);
 // Horizontal stabilizers
 g.add(new THREE.Mesh(new THREE.BoxGeometry(1,.06,4.5),JW2)).position.set(-28,0,0);
 // Engine nozzle
 g.add(new THREE.Mesh(new THREE.CylinderGeometry(.8,1,2.5,10),JD)).position.set(-29,0,0).rotation.z=Math.PI/2;
 // Afterburner flame
 g.add(new THREE.Mesh(new THREE.ConeGeometry(.6,4,8),JY)).position.set(-31,0,0).rotation.z=Math.PI/2;
 // Missiles
 for(var s=-1;s<=1;s+=2){
  g.add(new THREE.Mesh(new THREE.CylinderGeometry(.06,.08,.6,6),JD)).position.set(-2,-.5,s*1.8);
  g.add(new THREE.Mesh(new THREE.CylinderGeometry(.08,.11,2.5,8),new THREE.MeshBasicMaterial({color:0xffcc00}))).position.set(-2,-.9,s*1.8);
  g.add(new THREE.Mesh(new THREE.ConeGeometry(.1,.3,6),JR)).position.set(-.2,-.9,s*1.8);
 }
 return g;
}

// ===== DETAILED 3D ATTACK HELICOPTER =====
function buildHeli(){
 var g=new THREE.Group();
 var HM=new THREE.MeshBasicMaterial({color:0x3d5528});
 var HD=new THREE.MeshBasicMaterial({color:0x162010});
 var HS=new THREE.MeshBasicMaterial({color:0x888888});
 var HR2=new THREE.MeshBasicMaterial({color:0xff0000});
 var HW=new THREE.MeshBasicMaterial({color:0x334455,transparent:true,opacity:.55});
 // Fuselage
 g.add(new THREE.Mesh(new THREE.BoxGeometry(2.2,1.8,10),HM));
 g.add(new THREE.Mesh(new THREE.BoxGeometry(2.3,.2,10.2),HD)).position.y=-.9;
 // Nose
 g.add(new THREE.Mesh(new THREE.BoxGeometry(1.8,1.2,2),HM)).position.set(0,-.1,5.5);
 // Tail boom
 g.add(new THREE.Mesh(new THREE.BoxGeometry(.8,.6,7),HM)).position.set(0,.2,8.5);
 // Tail fin
 g.add(new THREE.Mesh(new THREE.BoxGeometry(.06,2,1.5),HM)).position.set(0,1.4,11.5);
 // Cockpit glass
 g.add(new THREE.Mesh(new THREE.BoxGeometry(2,1,.1),HW)).position.set(0,.4,5.5);
 // Main rotor mast
 var mastPole=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,1,6),HS);
 mastPole.position.set(0,1.4,1);g.add(mastPole);
 // Main rotor
 var mr=new THREE.Group();mr.position.set(0,2,1);
 for(var i=0;i<5;i++){
  var a=i*Math.PI*2/5;
  var bl=new THREE.Mesh(new THREE.BoxGeometry(.04,.015,4.5),HS);
  bl.position.set(Math.cos(a)*2,0,Math.sin(a)*2);bl.rotation.z=a;mr.add(bl);
  var tp=new THREE.Mesh(new THREE.BoxGeometry(.04,.015,.35),HR2);
  tp.position.set(Math.cos(a)*3.8,0,Math.sin(a)*3.8);tp.rotation.z=a;mr.add(tp);
 }
 g.add(mr);
 // Tail rotor
 var tr=new THREE.Group();tr.position.set(0,.8,12);
 for(var i=0;i<4;i++){var a2=i*Math.PI/2;var tb2=new THREE.Mesh(new THREE.BoxGeometry(.02,.006,.6),HS);tb2.position.set(0,Math.cos(a2)*.25,Math.sin(a2)*.25);tb2.rotation.z=a2;tr.add(tb2)}
 tr.rotation.y=Math.PI/2;g.add(tr);
 // Weapon pylons
 for(var s=-1;s<=1;s+=2){
  g.add(new THREE.Mesh(new THREE.CylinderGeometry(.06,.08,1.2,6),HD)).position.set(s*1.2,-.6,1.5);
  g.add(new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,2,6),new THREE.MeshBasicMaterial({color:0xddbb00}))).position.set(s*1.2,-1.2,1.5);
 }
 g.userData={mr:mr,tr:tr};
 return g;
}

// ===== PLACE VEHICLES =====
I.textContent='放置部队…';

// Tank column (8 tanks)
var tanks=[];
for(var i=0;i<8;i++){
 var t=buildTank([0x4a5a2a,0x5a6a30,0x3a4a20,0x4a5a28,0x554428,0x4a5028,0x5a4a28,0x4a5528][i]);
 t.position.set(-30+i*18,-.5,-10+(i%2)*8);t.rotation.y=.2+i*.05;S.add(t);tanks.push(t);
}

// APC column (5 vehicles)
var apcs=[];
for(var i=0;i<5;i++){
 var a=buildAPC([0x445522,0x3a5020,0x4a5a25,0x3a4a20,0x4a5525][i]);
 a.position.set(-30+i*20,-.5,15+(i%2)*6);a.rotation.y=-.15;S.add(a);apcs.push(a);
}

// Fighter jets (4)
var jets=[];
for(var i=0;i<4;i++){
 var j=buildJet();j.position.set(-60+i*35,25+Math.sin(i)*20,-50-i*10);j.rotation.y=Math.PI/2-.2;S.add(j);jets.push(j);
}

// Attack helicopters (3)
var helis=[];
for(var i=0;i<3;i++){
 var h=buildHeli();h.position.set(30+i*40,18+(i%2)*5,-40-i*15);h.rotation.y=-.3;S.add(h);helis.push(h);
}

I.textContent='钢铁风暴 · 空地一体战';

// ===== PARTICLES =====
var P=[];
function sp(x,y,z,col,n,spd,life,size){
 spd=spd||40;life=life||1;size=size||1;
 for(var i=0;i<n;i++){P.push({x:x,y:y,z:z,vx:(Math.random()-.5)*spd,vy:Math.random()*spd*.4-Math.random()*spd*.5,vz:(Math.random()-.5)*spd,l:life,c:col,s:size})}
}
function bigExplosion(x,y,z){
 sp(x,y,z,'#ff4400',80,100,2.5,2.5);sp(x,y,z,'#ff8800',60,80,2,2);
 sp(x,y,z,'#ffcc00',40,60,2.5,1.5);sp(x,y,z,'#ffdd88',30,50,3,1);
 sp(x,y,z,'#333333',50,40,3,2);sp(x,y,z,'#555555',30,30,4,1.5);
}

// ===== MISSILES =====
var missiles=[];
var missileTimer=0;

// ===== ANIMATION =====
var startT=0,lastT=0,explosionT=0;

function loop(now){
 requestAnimationFrame(loop);
 if(!startT){startT=now;lastT=now;R.render(S,C);return}

 var dt=Math.min(.1,(now-lastT)/1000);lastT=now;
 if(dt<=0||dt>.1)dt=.016;
 var T=(now-startT)/1000;
 explosionT+=dt;

 // === TANK MOVEMENT ===
 tanks.forEach(function(t,i){if(!t||!t.position)return;
  t.position.z+=2.5*dt;
  if(t.position.z>60)t.position.z=-60;
  t.position.y=-.5+Math.sin(T*2+i)*.3;
 });

 // === APC MOVEMENT ===
 apcs.forEach(function(a,i){if(!a||!a.position)return;
  a.position.z+=2*dt;
  if(a.position.z>60)a.position.z=-60;
  a.position.y=-.5+Math.sin(T*2.5+i+.5)*.25;
 });

 // === JET FLIGHT ===
 jets.forEach(function(j,i){if(!j||!j.position)return;
  j.position.z+=15*dt;
  j.position.y=25+Math.sin(T*1+i*.8)*15;
  if(j.position.z>100){j.position.z=-80;j.position.x=-60+Math.random()*50}
  // Bank
  j.rotation.z=Math.sin(T+i)*.2;
 });

 // === HELI FLIGHT ===
 helis.forEach(function(h,i){if(!h||!h.position)return;
  h.position.z+=8*dt;
  h.position.y=18+Math.sin(T*.8+i*.7)*8;
  if(h.position.z>80)h.position.z=-60;
  // Rotor spin
  if(h.userData&&h.userData.mr)h.userData.mr.rotation.y+=dt*18;
  if(h.userData&&h.userData.tr)h.userData.tr.rotation.z+=dt*20;
 });

 // === MISSILE LAUNCH every 2 seconds ===
 if(explosionT>2){
  explosionT=0;
  // Random target
  if(helis.length>0&&tanks.length>0){
   var tgt=tanks[Math.floor(Math.random()*tanks.length)];
   var src=jets[Math.floor(Math.random()*jets.length)];
   if(tgt&&src&&tgt.position&&src.position){
    var dx=tgt.position.x-src.position.x,dy=tgt.position.y-src.position.y,dz=tgt.position.z-src.position.z;
    var d=Math.sqrt(dx*dx+dy*dy+dz*dz);
    missiles.push({x:src.position.x,y:src.position.y,z:src.position.z,vx:dx/d*70,vy:dy/d*70,vz:dz/d*70,life:0,maxL:3,target:tgt});
   }
  }
  // Also random air-to-air
  if(helis.length>1&&jets.length>1){
   var hT=helis[Math.floor(Math.random()*helis.length)];
   var jS=jets[Math.floor(Math.random()*jets.length)];
   if(hT&&jS&&hT.position&&jS.position){
    var dx2=hT.position.x-jS.position.x,dy2=hT.position.y-jS.position.y,dz2=hT.position.z-jS.position.z;
    var d2=Math.sqrt(dx2*dx2+dy2*dy2+dz2*dz2);
    missiles.push({x:jS.position.x,y:jS.position.y,z:jS.position.z,vx:dx2/d2*80,vy:dy2/d2*80,vz:dz2/d2*80,life:0,maxL:2.5,target:hT});
   }
  }
 }

 // === UPDATE MISSILES ===
 for(var i=missiles.length-1;i>=0;i--){
  var m=missiles[i];
  m.x+=m.vx*dt;m.y+=m.vy*dt;m.z+=m.vz*dt;m.life+=dt;
  sp(m.x,m.y,m.z,'#ffaa00',2,15,.8,.8);
  var tgt=m.target;
  if(tgt&&tgt.position){
   var dd=Math.sqrt((m.x-tgt.position.x)*(m.x-tgt.position.x)+(m.y-tgt.position.y)*(m.y-tgt.position.y)+(m.z-tgt.position.z)*(m.z-tgt.position.z));
   if(dd<8){bigExplosion(tgt.position.x,tgt.position.y,tgt.position.z);missiles.splice(i,1);continue}
  }
  if(m.life>m.maxL){missiles.splice(i,1);continue}
 }

 // === UPDATE PARTICLES ===
 for(var i=P.length-1;i>=0;i--){var p=P[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.l-=dt;if(p.l<=0){P.splice(i,1);continue}try{var pm=new THREE.Mesh(new THREE.SphereGeometry(p.s*.15,4,4),new THREE.MeshBasicMaterial({color:parseInt(p.c.replace('#',''),16),transparent:true,opacity:Math.min(1,p.l)}));pm.position.set(p.x,p.y,p.z);S.add(pm);setTimeout(function(){try{S.remove(pm)}catch(e){}},70)}catch(e){}}

 // === RENDER MISSILES ===
 for(var i=missiles.length-1;i>=0;i--){var ms=missiles[i];if(isNaN(ms.x))continue;try{var mm=new THREE.Mesh(new THREE.SphereGeometry(.25,6,6),new THREE.MeshBasicMaterial({color:0xff6600}));mm.position.set(ms.x,ms.y,ms.z);S.add(mm);setTimeout(function(){try{S.remove(mm)}catch(e){}},60);var trail=new THREE.Mesh(new THREE.SphereGeometry(.12,4,4),new THREE.MeshBasicMaterial({color:0xffaa00,transparent:true,opacity:.5}));trail.position.set(ms.x,ms.y,ms.z);S.add(trail);setTimeout(function(){try{S.remove(trail)}catch(e){}},100)}catch(e){}}

 // === CINEMATIC CAMERA - aggressive pans ===
 var t=T%15;
 if(t<3){C.position.lerp(new THREE.Vector3(10+Math.sin(T)*15,15,50),3*dt);C.lookAt(-20+Math.sin(T)*10,3,-20)}
 else if(t<6){C.position.lerp(new THREE.Vector3(jets[0]?jets[0].position.x+15:30,jets[0]?jets[0].position.y+8:35,jets[0]?jets[0].position.z+10:60),3*dt);C.lookAt(tanks[3]?tanks[3].position:new THREE.Vector3(-10,2,-10))}
 else if(t<9){C.position.lerp(new THREE.Vector3(-10,25,40+Math.sin(T)*15),3*dt);C.lookAt(helis[1]?helis[1].position:new THREE.Vector3(40,15,-20))}
 else if(t<12){C.position.lerp(new THREE.Vector3(tanks[0]?tanks[0].position.x+20:10,tanks[0]?tanks[0].position.y+12:15,tanks[0]?tanks[0].position.z+25:30),3*dt);C.lookAt(tanks[0]?tanks[0].position:new THREE.Vector3(-20,2,-20))}
 else{C.position.lerp(new THREE.Vector3(0,30,70),2*dt);C.lookAt(0,5,-10)}

 R.render(S,C);
}
R.render(S,C);
requestAnimationFrame(loop);

window.addEventListener('resize',function(){C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
})();
</script></body></html>
