<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>空战 · Aerial Combat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;font-family:'PingFang SC','Microsoft YaHei',sans-serif}
#c{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;z-index:10;pointer-events:none}
#load{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:13px;z-index:99;background:rgba(0,0,0,.7);padding:8px 22px;border-radius:8px;transition:opacity .4s}
#skip2{position:fixed;bottom:30px;right:20px;z-index:99;color:rgba(255,255,255,.25);font-size:11px;cursor:pointer;padding:6px 14px;border:1px solid rgba(255,255,255,.1);border-radius:4px;background:rgba(0,0,0,.3);pointer-events:auto}
#skip2:active{color:#f60;border-color:#f60}
#title{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;color:#fff;font-size:40px;font-weight:900;text-align:center;display:none;text-shadow:0 0 40px rgba(255,80,0,.8);pointer-events:none}
#title .sub{font-size:14px;font-weight:400;color:rgba(255,255,255,.5);margin-top:8px;letter-spacing:4px}
</style></head><body>
<canvas id="c"></canvas>
<div id="load">⚡ 加载引擎…</div>
<div id="skip2" onclick="skipAnim()">跳过</div>
<div id="title"><div>AERIAL COMBAT</div><div class="sub">空 战</div></div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const L=document.getElementById('load'),skip=document.getElementById('skip2'),titleEl=document.getElementById('title');
let animSkip=false,animDone=false;
window.skipAnim=()=>{animSkip=true;L.style.opacity='0';titleEl.style.display='none';skip.style.display='none'};

// ===== 场景 =====
const S=new THREE.Scene();
S.background=new THREE.Color(0x5a8cc8);
S.fog=new THREE.Fog(0x7eb8e0,200,900);

const cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,1,1000);
cam.position.set(50,40,80);cam.lookAt(0,15,0);

const R=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,2));
R.shadowMap.enabled=false;
R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.2;

S.add(new THREE.AmbientLight(0xccddff,1.2));
S.add(new THREE.DirectionalLight(0xfff8e8,1.0)).position.set(200,300,100);
S.add(new THREE.HemisphereLight(0x8899cc,0x554433,0.5));

// ===== 地面 =====
const gnd=new THREE.Mesh(new THREE.PlaneGeometry(1200,1200),new THREE.MeshBasicMaterial({color:0x448844}));
gnd.rotation.x=-Math.PI/2;gnd.position.y=-1;S.add(gnd);

// 道路
for(let r=0;r<6;r++){
  const rd=new THREE.Mesh(new THREE.PlaneGeometry(8,500),new THREE.MeshBasicMaterial({color:0x444444}));
  rd.rotation.x=-Math.PI/2;rd.rotation.z=(r/6)*Math.PI*2;rd.position.y=0.02;S.add(rd);
}

// 山
for(let m=0;m<30;m++){
  const mx=(Math.random()-.5)*1000,mz=(Math.random()-.5)*1000;
  if(Math.hypot(mx,mz)<150)continue;
  const mh=30+Math.random()*160;
  S.add(new THREE.Mesh(new THREE.ConeGeometry(40+Math.random()*120,mh,10,5),new THREE.MeshBasicMaterial({color:Math.random()<.5?0x887766:0x778866}))).position.set(mx,mh/2,mz);
}

// 建筑
const bCols=[0xaabbcc,0x8899aa,0x667788,0xccddee];
for(let b=0;b<150;b++){
  const bx=(Math.random()-.5)*700,bz=(Math.random()-.5)*700;
  if(Math.hypot(bx,bz)<80)continue;
  S.add(new THREE.Mesh(new THREE.BoxGeometry(6+Math.random()*20,8+Math.random()*80,6+Math.random()*20),new THREE.MeshBasicMaterial({color:bCols[b%4]}))).position.set(bx,(8+Math.random()*80)/2,bz);
}

// 树
for(let t=0;t<300;t++){
  const tx=(Math.random()-.5)*800,tz=(Math.random()-.5)*800;
  if(Math.hypot(tx,tz)<80)continue;
  S.add(new THREE.Mesh(new THREE.CylinderGeometry(.12,.2,3+Math.random()*5,6),new THREE.MeshBasicMaterial({color:0x5a3a1a}))).position.set(tx,1.5,tz);
  S.add(new THREE.Mesh(new THREE.SphereGeometry(1+Math.random()*2,6,4),new THREE.MeshBasicMaterial({color:0x338822}))).position.set(tx,4+Math.random()*3,tz);
}

// ===== 云 =====
const clouds=[];
for(let c=0;c<20;c++){
  const cg=new THREE.Group();
  for(let n=0;n<5;n++){
    const cl=new THREE.Mesh(new THREE.SphereGeometry(5+Math.random()*15,6,4),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.6}));
    cl.position.set((Math.random()-.5)*40,(Math.random()-.5)*5,(Math.random()-.5)*10);cg.add(cl);
  }
  cg.position.set((Math.random()-.5)*600,50+Math.random()*200,(Math.random()-.5)*600);
  cg.userData={speed:.5+Math.random()*2};S.add(cg);clouds.push(cg);
}

// ===== 粒子池 =====
const particles=[];
function spawnP(x,y,z,color,count,speed=60){
  for(let i=0;i<count;i++){
    particles.push({x,y,z,vx:(Math.random()-.5)*speed,vy:Math.random()*speed*.3-Math.random()*speed*.5,vz:(Math.random()-.5)*speed,life:.6+Math.random()*1.2,color,size:1+Math.random()*3});
  }
}

// ===== 代码建模: 战斗机(红色) =====
function buildFighterJet(){
  const g=new THREE.Group();
  const R2=new THREE.MeshBasicMaterial({color:0xff2200});
  const W2=new THREE.MeshBasicMaterial({color:0xeeeeee});
  const Y2=new THREE.MeshBasicMaterial({color:0xffcc00});
  const D2=new THREE.MeshBasicMaterial({color:0x111122});
  const C2=new THREE.MeshBasicMaterial({color:0x113355,transparent:true,opacity:.5});
  const pts=[];for(let i=0;i<=32;i++){const t=i/32,x=t*30-15;let r;if(t<.05)r=.5;else if(t<.15)r=.5+(t-.05)*3.5/.1;else if(t<.35)r=4.0;else if(t<.6)r=4.0-.6*Math.sin((t-.35)/.25*Math.PI);else r=3.4-.9*Math.sin((t-.6)/.4*Math.PI);pts.push(new THREE.Vector2(r,x))}
  g.add(new THREE.Mesh(new THREE.LatheGeometry(pts,32),R2));
  g.add(new THREE.Mesh(new THREE.BoxGeometry(1.2,.35,1.0),C2)).position.set(-3.5,0.6,0);
  g.add(new THREE.Mesh(new THREE.BoxGeometry(3.5,0.12,14),W2)).position.set(-1.5,-0.05,0);
  g.add(new THREE.Mesh(new THREE.BoxGeometry(0.15,2.2,2.5),R2)).position.set(-8,1.3,0);
  g.add(new THREE.Mesh(new THREE.BoxGeometry(1.3,0.08,5),W2)).position.set(-13,0,0);
  for(let s=-1;s<=1;s+=2){
    g.add(new THREE.Mesh(new THREE.CylinderGeometry(.07,.09,.5,8),D2)).position.set(1,-0.5,s*2.5);
    g.add(new THREE.Mesh(new THREE.CylinderGeometry(.1,.13,2.5,8),Y2)).position.set(1,-0.8,s*2.5);
  }
  const eng2=new THREE.Mesh(new THREE.CylinderGeometry(1.0,1.2,3,12),D2);eng2.position.set(-15,0,0);eng2.rotation.z=Math.PI/2;g.add(eng2);
  const ab2=new THREE.Mesh(new THREE.ConeGeometry(.8,5,8),new THREE.MeshBasicMaterial({color:0xff8800}));ab2.position.set(-18.5,0,0);ab2.rotation.z=Math.PI/2;g.add(ab2);g.userData.afterburner=ab2;
  return g;
}

// ===== 代码建模: 直升机(军绿) =====
function buildHelicopter(){
  const g=new THREE.Group();
  const HG2=new THREE.MeshBasicMaterial({color:0x3d5c28});
  const HGY=new THREE.MeshBasicMaterial({color:0x888888});
  const HR2=new THREE.MeshBasicMaterial({color:0xff0000});
  const HY2=new THREE.MeshBasicMaterial({color:0xddbb00});
  const pts=[];for(let i=0;i<=32;i++){const t=i/32,x=t*14-6;let r;if(t<.06)r=.5+t*2.5;else if(t<.16)r=2.0+(t-.06)*1.8/.1;else if(t<.35)r=3.5+Math.sin((t-.16)/.19*Math.PI)*1.0;else if(t<.62)r=3.5;else if(t<.78)r=3.5-(t-.62)*2.2/.16;else r=1.0-(t-.78)*.8/.22;pts.push(new THREE.Vector2(r,x))}
  g.add(new THREE.Mesh(new THREE.LatheGeometry(pts,36),HG2));
  g.add(new THREE.Mesh(new THREE.BoxGeometry(5,0.15,0.35),HY2)).position.set(7,0.35,0);
  g.add(new THREE.Mesh(new THREE.BoxGeometry(0.08,0.7,0.35),HG2)).position.set(7,0.5,0);
  const mr2=new THREE.Group();mr2.position.set(0,0.7,0);
  for(let b=0;b<4;b++){const an=b*Math.PI/2;const bl=new THREE.Mesh(new THREE.BoxGeometry(0.04,0.016,1.8),HGY);bl.position.set(Math.cos(an)*0.9,0,Math.sin(an)*0.9);bl.rotation.z=an;mr2.add(bl);const tp=new THREE.Mesh(new THREE.BoxGeometry(0.04,0.016,0.22),HR2);tp.position.set(Math.cos(an)*1.65,0,Math.sin(an)*1.65);tp.rotation.z=an;mr2.add(tp)}
  g.add(mr2);g.userData.mainRotor=mr2;
  const tr2=new THREE.Group();tr2.position.set(8,0.35,0.06);
  for(let b=0;b<4;b++){const an=b*Math.PI/2;const tb=new THREE.Mesh(new THREE.BoxGeometry(0.016,0.007,0.22),HGY);tb.position.set(0,Math.cos(an)*0.11,Math.sin(an)*0.11);tb.rotation.z=an;tr2.add(tb)}
  tr2.rotation.y=Math.PI/2;g.add(tr2);g.userData.tailRotor=tr2;
  return g;
}

// ===== 模型容器 =====
const heli1=new THREE.Group(),heli2=new THREE.Group(),fighter=new THREE.Group();
heli1.position.set(-30,20,-20);heli2.position.set(30,18,10);fighter.position.set(80,40,-60);
S.add(heli1);S.add(heli2);S.add(fighter);

// ===== 导弹系统 =====
let missiles=[];

// ===== 动画状态 =====
let heli1Hit=false,heli2Hit=false;
let heli1Spin=0,heli2Spin=0;
let heli1FallV=0,heli2FallV=0;
let phase=0,phaseTime=0;
let totalTime=0;
let modelsReady=false;
let fire1=false,fire2=false,missile1=false,missile2=false;

// ===== 暂存模型引用 =====
let mHeli1,mHeli2,mFighter;

// ===== 加载模型 =====
L.textContent='⚡ 下载模型…';

async function loadModels(){
  const loader=new GLTFLoader();
  const heliUrl='https://raw.githubusercontent.com/srcejon/sdrangel-3d-models/main/helicopter.glb';
  const f15Url='https://raw.githubusercontent.com/srcejon/sdrangel-3d-models/main/f15.glb';

  const pHeli=loader.loadAsync(heliUrl,px=>{L.textContent='🚁 直升机 '+Math.floor(px.loaded/px.total*100)+'%'}).catch(()=>null);
  const pF15=loader.loadAsync(f15Url,px=>{L.textContent='✈️ 战斗机 '+Math.floor(px.loaded/px.total*100)+'%'}).catch(()=>null);

  const results=await Promise.allSettled([pHeli,pF15]);
  return {
    heli:results[0].status==='fulfilled'&&results[0].value?results[0].value.scene:null,
    f15:results[1].status==='fulfilled'&&results[1].value?results[1].value.scene:null
  };
}

function toBasicMaterial(obj){
  obj.traverse(c=>{if(c.isMesh&&c.material){if(Array.isArray(c.material)){c.material=c.material.map(m=>new THREE.MeshBasicMaterial({color:m.color?m.color.getHex():0x888888}))}else{c.material=new THREE.MeshBasicMaterial({color:c.material.color?c.material.color.getHex():0x888888})}}});
}

function fitModel(model,targetSize){
  const box=new THREE.Box3().setFromObject(model);
  const size=box.getSize(new THREE.Vector3()).length();
  const scale=targetSize/size;
  model.scale.setScalar(scale);
  const center=box.getCenter(new THREE.Vector3());
  model.position.set(-center.x*scale,-center.y*scale,-center.z*scale);
}

// ===== 初始化(加载模型或fallback) =====
setTimeout(async()=>{
  L.textContent='⚡ 加载模型…';
  let models=null;
  try{
    models=await Promise.race([
      loadModels(),
      new Promise(r=>setTimeout(()=>r(null),8000))
    ]);
  }catch(e){models=null}

  if(models&&models.heli){
    toBasicMaterial(models.heli);fitModel(models.heli,12);
    mHeli1=models.heli.clone();heli1.add(mHeli1);
    mHeli2=models.heli.clone();heli2.add(mHeli2);
  }else{
    mHeli1=buildHelicopter();heli1.add(mHeli1);
    mHeli2=buildHelicopter();heli2.add(mHeli2);
  }

  if(models&&models.f15){
    toBasicMaterial(models.f15);fitModel(models.f15,18);
    mFighter=models.f15;fighter.add(mFighter);
    fighter.rotation.y=Math.PI;
  }else{
    mFighter=buildFighterJet();fighter.add(mFighter);
  }

  modelsReady=true;
  L.style.opacity='0';setTimeout(()=>L.style.display='none',500);
},500);

// 如果8秒模型还没准备好,强制开始
setTimeout(()=>{
  if(!modelsReady){
    mHeli1=buildHelicopter();heli1.add(mHeli1);
    mHeli2=buildHelicopter();heli2.add(mHeli2);
    mFighter=buildFighterJet();fighter.add(mFighter);
    modelsReady=true;
    L.style.opacity='0';setTimeout(()=>L.style.display='none',500);
  }
},9000);

// ===== 主循环 =====
let pt=performance.now();
function tick(now){
  requestAnimationFrame(tick);
  if(animSkip||animDone){R.render(S,cam);return}
  let dt=(now-pt)/1000;pt=now;
  if(dt<=0||dt>0.2)dt=0.016;
  if(!modelsReady){R.render(S,cam);return}
  totalTime+=dt;

  // 云动画
  clouds.forEach(c=>{c.position.x+=c.userData.speed*dt;if(c.position.x>350)c.position.x=-350});

  // ===== 直升机1巡逻 =====
  if(!heli1Hit){
    heli1.position.x=-30+Math.sin(totalTime*.3)*15;
    heli1.position.y=20+Math.sin(totalTime*.5)*3;
    heli1.position.z=-20+totalTime*8;
    if(heli1.position.z>250)heli1.position.z=-200;
    heli1.rotation.y=0.1;
  }

  // ===== 直升机2巡逻 =====
  if(!heli2Hit){
    heli2.position.x=30+Math.cos(totalTime*.4)*10;
    heli2.position.y=18+Math.sin(totalTime*.4)*2;
    heli2.position.z=10+totalTime*6;
    if(heli2.position.z>250)heli2.position.z=-200;
    heli2.rotation.y=-0.15;
  }

  // ===== F-15飞行 =====
  fighter.position.x=80-totalTime*15;
  fighter.position.y=38+Math.sin(totalTime*.3)*8;
  fighter.position.z=-60+totalTime*20;
  if(fighter.position.z>200)fighter.position.z=-150;
  if(fighter.position.x<-150)fighter.position.x=120;
  fighter.rotation.y=Math.PI+0.3;

  // ===== 阶段：F-15发射导弹攻击直升机1 =====
  if(totalTime>2.5&&!fire1&&!heli1Hit){
    fire1=true;
    missiles.push({
      pos:fighter.position.clone(),
      vel:new THREE.Vector3().subVectors(heli1.position,fighter.position).normalize().multiplyScalar(80),
      target:'heli1',
      life:0,
      maxLife:3
    });
    spawnP(fighter.position.x,fighter.position.y,fighter.position.z,'#ffaa00',10,20);
  }

  // ===== 阶段：F-15发射第二枚导弹攻击直升机2 =====
  if(totalTime>7&&!fire2&&!heli2Hit&&heli1Hit){
    fire2=true;
    missiles.push({
      pos:fighter.position.clone(),
      vel:new THREE.Vector3().subVectors(heli2.position,fighter.position).normalize().multiplyScalar(80),
      target:'heli2',
      life:0,
      maxLife:3
    });
    spawnP(fighter.position.x,fighter.position.y,fighter.position.z,'#ffaa00',10,20);
  }

  // ===== 更新导弹 =====
  for(let i=missiles.length-1;i>=0;i--){
    const ms=missiles[i];
    ms.life+=dt;
    ms.pos.x+=ms.vel.x*dt;ms.pos.y+=ms.vel.y*dt;ms.pos.z+=ms.vel.z*dt;
    spawnP(ms.pos.x,ms.pos.y,ms.pos.z,'#ff8800',1,8);

    // 检查命中
    const targetPos=ms.target==='heli1'?heli1.position:heli2.position;
    const dist=ms.pos.distanceTo(targetPos);
    if(dist<8){
      if(ms.target==='heli1'&&!heli1Hit){heli1Hit=true;spawnP(heli1.position.x,heli1.position.y,heli1.position.z,'#ff4400',40,100)}
      if(ms.target==='heli2'&&!heli2Hit){heli2Hit=true;spawnP(heli2.position.x,heli2.position.y,heli2.position.z,'#ff4400',40,100)}
      missiles.splice(i,1);
      continue;
    }
    if(ms.life>ms.maxLife){missiles.splice(i,1)}
  }

  // ===== 直升机1螺旋坠落 =====
  if(heli1Hit){
    heli1Spin+=dt*8;heli1FallV+=dt*30;
    heli1.rotation.z+=dt*6;
    heli1.position.y-=heli1FallV*dt;
    heli1.position.x+=Math.sin(heli1Spin)*2*dt;
    spawnP(heli1.position.x,heli1.position.y,heli1.position.z,'#444444',2,10);
    spawnP(heli1.position.x,heli1.position.y,heli1.position.z,'#ff6600',1,15);
    if(heli1.position.y<1){heli1.position.y=1;spawnP(heli1.position.x,1,heli1.position.z,'#ff4400',80,150);spawnP(heli1.position.x,1,heli1.position.z,'#ff8800',60,120);spawnP(heli1.position.x,2,heli1.position.z,'#333333',40,40);heli1Hit=false;heli1.visible=false}
  }

  // ===== 直升机2被击中坠毁 =====
  if(heli2Hit){
    heli2Spin+=dt*7;heli2FallV+=dt*28;
    heli2.rotation.z-=dt*5.5;
    heli2.position.y-=heli2FallV*dt;
    heli2.position.x-=Math.cos(heli2Spin)*1.5*dt;
    spawnP(heli2.position.x,heli2.position.y,heli2.position.z,'#444444',2,10);
    spawnP(heli2.position.x,heli2.position.y,heli2.position.z,'#ff6600',1,15);
    if(heli2.position.y<1){heli2.position.y=1;spawnP(heli2.position.x,1,heli2.position.z,'#ff4400',80,150);spawnP(heli2.position.x,1,heli2.position.z,'#ff8800',60,120);spawnP(heli2.position.x,2,heli2.position.z,'#333333',40,40);heli2Hit=false;heli2.visible=false}
  }

  // ===== 更新粒子 =====
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.life-=dt;
    if(p.life<=0)particles.splice(i,1);
  }

  // ===== 旋翼 =====
  if(mHeli1&&mHeli1.userData&&mHeli1.userData.mainRotor){mHeli1.userData.mainRotor.rotation.y+=dt*20;if(mHeli1.userData.tailRotor)mHeli1.userData.tailRotor.rotation.z+=dt*24}
  if(mHeli2&&mHeli2.userData&&mHeli2.userData.mainRotor){mHeli2.userData.mainRotor.rotation.y+=dt*20;if(mHeli2.userData.tailRotor)mHeli2.userData.tailRotor.rotation.z+=dt*24}
  if(mFighter&&mFighter.userData&&mFighter.userData.afterburner){mFighter.userData.afterburner.visible=Math.sin(totalTime*10)>0}

  // ===== 电影运镜 =====
  let cp;
  if(totalTime<2){
    cp=new THREE.Vector3(60,35,70);cam.position.lerp(cp,2*dt);cam.lookAt(0,12,10);
  }else if(totalTime<4){
    cp=new THREE.Vector3(fighter.position.x-20,fighter.position.y+8,fighter.position.z+10);
    cam.position.lerp(cp,3*dt);cam.lookAt(heli1.position);
  }else if(totalTime<6){
    cp=new THREE.Vector3(heli1.position.x+15,heli1.position.y+10,heli1.position.z+15);
    cam.position.lerp(cp,3*dt);cam.lookAt(heli1.position);
  }else if(totalTime<9){
    cp=new THREE.Vector3(fighter.position.x-15,fighter.position.y+12,fighter.position.z+8);
    cam.position.lerp(cp,3*dt);cam.lookAt(heli2.position);
  }else if(totalTime<12){
    cp=new THREE.Vector3(heli2.position.x+10,heli2.position.y+8,heli2.position.z+12);
    cam.position.lerp(cp,3*dt);cam.lookAt(heli2.position);
  }else if(totalTime<16){
    cp=new THREE.Vector3(40,50,60);cam.position.lerp(cp,2*dt);cam.lookAt(0,3,0);
  }else{
    if(!animDone){
      animDone=true;
      titleEl.style.display='block';
      skip.style.display='none';
    }
    cp=new THREE.Vector3(0,60,90);cam.position.lerp(cp,1.5*dt);cam.lookAt(0,2,0);
  }

  // ===== 渲染 =====
  R.render(S,cam);

  // 地面标记——直升机坠毁坑
  particles.forEach(p=>{
    if(p.y<0.3)return;
    // 用一个小球渲染
  });

  // 导弹可视化 - 在场景中添加临时网格
  missiles.forEach(ms=>{
    const tmp=new THREE.Mesh(new THREE.SphereGeometry(.4,6,6),new THREE.MeshBasicMaterial({color:0xffaa00}));
    tmp.position.copy(ms.pos);S.add(tmp);
    setTimeout(()=>S.remove(tmp),50);
  });

  // 粒子可视化
  particles.forEach(p=>{
    if(p.life<0.01)return;
    const tmp2=new THREE.Mesh(new THREE.SphereGeometry(p.size*.3,4,4),new THREE.MeshBasicMaterial({color:parseInt(p.color.replace('#',''),16)}));
    tmp2.position.set(p.x,p.y,p.z);S.add(tmp2);
    setTimeout(()=>S.remove(tmp2),50);
  });
}
requestAnimationFrame(tick);

window.addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
</script></body></html>
