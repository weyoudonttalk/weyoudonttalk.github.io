<!DOCTYPE html><html lang="zh"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>烈火苍穹 · 空地大战</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;font-family:'PingFang SC','Microsoft YaHei',sans-serif}

#stage{width:100%;height:100%;position:relative;overflow:hidden}
#stage canvas{position:absolute;top:0;left:0;width:100%;height:100%}
#stage .layer{position:absolute;inset:0;pointer-events:none}
#stage .vehicle{position:absolute;pointer-events:none}
#stage .hud{position:absolute;inset:0;pointer-events:none;z-index:90}

/* title cards */
.title-card{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;text-align:center;z-index:100;text-shadow:0 0 60px rgba(255,120,0,.8),0 0 120px rgba(255,60,0,.5)}
.title-card h1{font-size:clamp(24px,8vw,60px);font-weight:900;letter-spacing:4px;margin:0}
.title-card p{font-size:clamp(10px,3vw,16px);color:rgba(255,255,255,.5);letter-spacing:6px;margin-top:8px}

/* skip */
#skip{position:fixed;bottom:30px;right:20px;z-index:999;color:rgba(255,255,255,.3);font-size:11px;cursor:pointer;padding:6px 14px;border:1px solid rgba(255,255,255,.1);border-radius:4px;background:rgba(0,0,0,.3);pointer-events:auto}
#skip:active{color:#f60}

/* explosion */
@keyframes expl{0%{transform:scale(0);opacity:1}50%{opacity:1}100%{transform:scale(3);opacity:0}}
@keyframes flash{0%,100%{opacity:0}50%{opacity:.4}}
@keyframes smoke{0%{transform:translateY(0) scale(1);opacity:.6}100%{transform:translateY(-200px) scale(3);opacity:0}}
</style></head><body>
<div id="stage">
 <canvas id="sky"></canvas>
 <canvas id="ground"></canvas>
 <canvas id="fx"></canvas>
 <div class="layer" id="vehicles"></div>
 <div class="hud" id="hud"></div>
</div>
<div id="skip" onclick="window._skip=true;this.style.display='none'">跳过</div>

<script>
(function(){
var _skip=false,stage=document.getElementById('stage'),_v=document.getElementById('vehicles');
var _f=document.getElementById('fx'),_g=document.getElementById('ground'),_s=document.getElementById('sky');
var W=innerWidth,H=innerHeight;
var ctxS=_s.getContext('2d'),ctxG=_g.getContext('2d'),ctxF=_f.getContext('2d');
var T=0,startT=0;
_s.width=_f.width=_g.width=W;_s.height=_f.height=_g.height=H;

// resize
window.addEventListener('resize',function(){W=innerWidth;H=innerHeight;_s.width=_f.width=_g.width=W;_s.height=_f.height=_g.height=H});

// ======================== SCENE TIMELINE (900 seconds = 15 minutes) ========================
var scenes=[
 {start:0, end:30, name:'LOGOS', desc:'片头'},
 {start:30, end:120, name:'DAWN', desc:'黎明集结'},
 {start:120, end:300, name:'GROUND', desc:'地面装甲推进'},
 {start:300, end:480, name:'AIR', desc:'制空权争夺'},
 {start:480, end:660, name:'COMBINED', desc:'空地协同作战'}, 
 {start:660, end:810, name:'CLIMAX', desc:'最终决战'},
 {start:810, end:900, name:'CREDITS', desc:'终章'},
];

// ======================== PARTICLES ========================
var particles=[];
function spawn(x,y,color,count,spd,life,size){
 spd=spd||30;life=life||1;size=size||1;
 for(var i=0;i<count;i++){particles.push({x:x,y:y,vx:(Math.random()-.5)*spd,vy:-Math.random()*spd,l:life,c:color,s:size})}
}
function spawnExplosion(x,y,big){
 var c=big?'#ff4400':'#ff8800',n=big?80:30,l=big?2:1,s=big?2.5:1.5;
 spawn(x,y,c,n,80,l,s);spawn(x,y,'#ffaa00',n/2,60,l,s*.8);spawn(x,y,'#ffcc00',n/4,40,l*1.5,s*.5);
 if(big){spawn(x,y,'#222222',30,50,2.5,2);document.getElementById('stage').style.background=big?'rgba(255,200,100,.15)':'';setTimeout(function(){document.getElementById('stage').style.background=''},200)}
}

// ======================== VEHICLE CLASS ========================
function Vehicle(tag,emoji,x,y,speed,dir,spriteFn){
 this.tag=tag;this.emoji=emoji;this.x=x;this.y=y;this.speed=speed;this.dir=dir||1;
 this.el=null;this.alive=true;this.sprite=spriteFn;
 this.init=function(){var d=document.createElement('div');d.className='vehicle';d.innerHTML='<span style="font-size:40px;position:absolute;transform:translate(-50%,-50%)">'+this.emoji+'</span>';d.style.left=this.x+'px';d.style.top=this.y+'px';d.style.zIndex='10';_v.appendChild(d);this.el=d}
 this.update=function(dt){if(!this.alive||!this.el)return;this.x+=this.speed*this.dir*dt;if(this.el){this.el.style.left=this.x+'px';this.el.style.top=this.y+'px'}}
 this.remove=function(){if(this.el){_v.removeChild(this.el);this.el=null}}
}

// Spawn ground vehicle sprite (CSS tank/APC)
function spawnTankSprite(x,y,type){
 var d=document.createElement('div');d.className='vehicle';d.style.left=x+'px';d.style.top=y+'px';d.style.zIndex='10';
 if(type==='tank'){
  d.innerHTML='<div style="position:relative;width:70px;height:35px"><div style="position:absolute;bottom:6px;left:8px;width:50px;height:18px;background:linear-gradient(180deg,#4a5a2a,#2d3a18);border-radius:3px 3px 1px 1px;border:1px solid #1a2510"></div><div style="position:absolute;bottom:0;left:2px;width:14px;height:10px;background:#111;border-radius:50%;border:2px solid #333"></div><div style="position:absolute;bottom:0;left:20px;width:14px;height:10px;background:#111;border-radius:50%;border:2px solid #333"></div><div style="position:absolute;bottom:0;left:38px;width:14px;height:10px;background:#111;border-radius:50%;border:2px solid #333"></div><div style="position:absolute;bottom:0;left:54px;width:14px;height:10px;background:#111;border-radius:50%;border:2px solid #333"></div><div style="position:absolute;bottom:22px;left:22px;width:22px;height:16px;background:linear-gradient(180deg,#5a6a3a,#3a4a22);border-radius:6px 6px 2px 2px;border:1px solid #2a3a15"></div><div style="position:absolute;bottom:36px;left:28px;width:6px;height:20px;background:#333;border-radius:2px;transform:rotate(-5deg);transform-origin:bottom center"></div></div>';
 }else if(type==='apc'){
  d.innerHTML='<div style="position:relative;width:60px;height:30px"><div style="position:absolute;bottom:5px;left:6px;width:44px;height:20px;background:linear-gradient(180deg,#556633,#334422);border-radius:4px 4px 2px 2px"></div><div style="position:absolute;bottom:0;left:2px;width:10px;height:8px;background:#111;border-radius:50%"></div><div style="position:absolute;bottom:0;left:15px;width:10px;height:8px;background:#111;border-radius:50%"></div><div style="position:absolute;bottom:0;left:28px;width:10px;height:8px;background:#111;border-radius:50%"></div><div style="position:absolute;bottom:0;left:41px;width:10px;height:8px;background:#111;border-radius:50%"></div><div style="position:absolute;bottom:20px;left:20px;width:12px;height:10px;background:#445533;border-radius:50%"></div><div style="position:absolute;bottom:28px;left:22px;width:4px;height:8px;background:#333"></div></div>';
 }else if(type==='jet'){
  d.innerHTML='<div style="position:relative;width:80px;height:20px;transform:rotate(-10deg)"><div style="position:absolute;left:0;top:6px;width:65px;height:8px;background:linear-gradient(90deg,#ddd,#999);clip-path:polygon(0% 30%,90% 0%,100% 50%,90% 100%,0% 70%)"></div><div style="position:absolute;left:10px;top:2px;width:40px;height:16px;background:linear-gradient(90deg,#eee,#ccc);clip-path:polygon(0% 40%,85% 0%,100% 50%,85% 100%,0% 60%)"></div><div style="position:absolute;left:60px;top:6px;width:8px;height:6px;background:#ff4400;border-radius:0 2px 2px 0"></div></div>';
 }else if(type==='heli'){
  d.innerHTML='<div style="position:relative;width:60px;height:25px"><div style="position:absolute;bottom:2px;left:8px;width:40px;height:14px;background:linear-gradient(180deg,#5a7a3a,#3a5522);border-radius:4px 4px 2px 2px"></div><div style="position:absolute;bottom:12px;left:18px;width:20px;height:6px;background:#222"></div><div style="position:absolute;bottom:14px;left:24px;width:8px;height:14px;background:linear-gradient(180deg,#5a7a3a,#3a5522);border-radius:2px"></div><div style="position:absolute;top:0;left:16px;width:24px;height:3px;background:#888;border-radius:10px;transform-origin:12px 1.5px;animation:heliRotor .3s linear infinite"></div></div>';
  var st=document.createElement('style');st.textContent='@keyframes heliRotor{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}';document.head.appendChild(st);
 }
 _v.appendChild(d);return {el:d,x:x,y:y,alive:true};
}

// ======================== SKY RENDERING ========================
var stars=[],cloudsR=[];
for(var i=0;i<100;i++){stars.push({x:Math.random()*W,y:Math.random()*H*.6,r:.3+Math.random()*1.2,b:Math.random()})}
for(var i=0;i<20;i++){cloudsR.push({x:Math.random()*W,y:Math.random()*H*.7,r:30+Math.random()*80,spd:.2+Math.random()*.5})}

function drawSky(t,scene){
 var sn=scenes[scene];
 ctxS.clearRect(0,0,W,H);

 // Sky gradient based on scene
 var topC,botC;
 if(sn.name==='DAWN'||sn.name==='LOGOS'){
  topC='#0a0a1a';botC='#1a2a44';
 }else if(sn.name==='NIGHT'){
  topC='#050510';botC='#0a1525';
 }else{
  topC='#1a3a5c';botC='#5a88bb';
 }
 var grd=ctxS.createLinearGradient(0,0,0,H);
 grd.addColorStop(0,topC);grd.addColorStop(1,botC);
 ctxS.fillStyle=grd;ctxS.fillRect(0,0,W,H);

 // Stars (only in dawn/logos scenes)
 if(sn.name==='DAWN'||sn.name==='LOGOS'){
  stars.forEach(function(s){
   ctxS.fillStyle='rgba(255,255,255,'+(.3+s.b*.5*Math.sin(t*2+s.x)*.5+.5)+')';
   ctxS.beginPath();ctxS.arc(s.x,s.y,s.r,0,Math.PI*2);ctxS.fill();
  });
 }

 // Sun/moon
 if(sn.name!=='LOGOS'){
  var sunY=H*.3+Math.sin(t*.1)*20;
  var sunGr=ctxS.createRadialGradient(W*.7,sunY,0,W*.7,sunY,120);
  sunGr.addColorStop(0,'rgba(255,240,200,.8)');sunGr.addColorStop(.3,'rgba(255,200,100,.3)');sunGr.addColorStop(1,'rgba(255,150,50,0)');
  ctxS.fillStyle=sunGr;ctxS.beginPath();ctxS.arc(W*.7,sunY,120,0,Math.PI*2);ctxS.fill();
 }

 // Clouds
 cloudsR.forEach(function(c){
  c.x-=c.spd;if(c.x<-100)c.x=W+100;
  ctxS.fillStyle='rgba(255,255,255,'+(.15+.1*Math.sin(t+c.x*.01))+.1+')';
  ctxS.beginPath();ctxS.arc(c.x,c.y,c.r,0,Math.PI*2);ctxS.fill();
  ctxS.beginPath();ctxS.arc(c.x-c.r*.6,c.y+c.r*.1,c.r*.7,0,Math.PI*2);ctxS.fill();
 });
}

// ======================== GROUND RENDERING ========================
function drawGround(t,scene){
 ctxG.clearRect(0,0,W,H);
 var grH=H*.55;
 // ground
 var grd=ctxG.createLinearGradient(0,grH,0,H);
 grd.addColorStop(0,'#3a5a28');grd.addColorStop(.5,'#2a4a18');grd.addColorStop(1,'#1a3010');
 ctxG.fillStyle=grd;ctxG.fillRect(0,grH,W,H-grH);
 // road
 ctxG.fillStyle='#333';ctxG.fillRect(0,grH+50,W,16);
 ctxG.strokeStyle='rgba(255,255,255,.15)';ctxG.setLineDash([20,15]);ctxG.beginPath();
 ctxG.moveTo(0,grH+58);ctxG.lineTo(W,grH+58);ctxG.stroke();ctxG.setLineDash([]);
}

// ======================== FX RENDERING ========================
function drawFX(t){
 ctxF.clearRect(0,0,W,H);
 // particles
 for(var i=particles.length-1;i>=0;i--){
  var p=particles[i];p.x+=p.vx*0.016;p.y+=p.vy*0.016;p.l-=.016;
  if(p.l<=0){particles.splice(i,1);continue}
  var a=Math.min(1,p.l);ctxF.fillStyle=p.c.replace(')',','+a+')').replace('rgb','rgba');
  if(p.c.startsWith('#')){
   var hx=p.c;ctxF.fillStyle='rgba('+parseInt(hx.substr(1,2),16)+','+parseInt(hx.substr(3,2),16)+','+parseInt(hx.substr(5,2),16)+','+a+')';
  }
  ctxF.beginPath();ctxF.arc(p.x,p.y,p.s*a,0,Math.PI*2);ctxF.fill();
 }
}

// ======================== VEHICLE MANAGEMENT ========================
var groundVehicles=[],airVehicles=[],explosionTimers=[];

function clearAllVehicles(){
 groundVehicles.forEach(function(v){if(v.el)_v.removeChild(v.el)});
 airVehicles.forEach(function(v){if(v.el)_v.removeChild(v.el)});
 groundVehicles=[];airVehicles=[];
 // also clear leftover child divs
 var ch=_v.children;for(var i=ch.length-1;i>=0;i--){if(ch[i].className==='vehicle')_v.removeChild(ch[i])}
}

// ======================== SCENE 0: LOGOS (0-30s) ========================
function sceneLogos(t,ts){
 if(ts<1){drawTitle('烈火苍穹','Fire & Steel',ts/1)}else if(ts<3){drawTitle('','',1-(ts-1)/2)}
 if(ts>3&&ts<10){drawSubtitle('导演: 小Q AI Studio','',ts-3)}
 if(ts>10)drawSubtitle('','',1-(ts-10)/3);
}

// ======================== SCENE 1: DAWN (30-120s) ========================
function sceneDawn(t,ts){
 if(ts<2){
  drawSubtitle('第一章','黎明集结',ts/2);
 }else{drawSubtitle('','',1-(ts-2)/3)}

 if(ts>5&&groundVehicles.length===0){
  // spawn initial forces
  for(var i=0;i<5;i++){var s=spawnTankSprite(W*.1+i*160,H*.58,'tank');s.x=W*.1+i*160;s.y=H*.58;groundVehicles.push(s)}
  for(var i=0;i<3;i++){var s2=spawnTankSprite(W*.05+i*180,H*.58+40,'apc');s2.x=W*.05+i*180;s2.y=H*.58+40;groundVehicles.push(s2)}
 }

 // Move ground forces slowly
 groundVehicles.forEach(function(v,i){
  if(!v.alive)return;v.x+=.3;if(v.x>W+80)v.x=-80;v.el.style.left=v.x+'px';
  // terrain bounce
  v.el.style.top=(v.y+Math.sin(t*2+i)*3)+'px';
 });
}

// ======================== SCENE 2: GROUND ASSAULT (120-300s) ========================
var groundPhase2=false;
function sceneGround(t,ts){
 if(ts<2){drawSubtitle('第二章','装甲洪流',ts/2)}
 else if(ts<5){drawSubtitle('','',1)}

 if(ts>3&&!groundPhase2){
  groundPhase2=true;
  clearAllVehicles();
  // Massive ground force
  for(var i=0;i<8;i++){var s=spawnTankSprite(-80-i*60,H*.58-i*2,'tank');s.x=-80-i*60;s.y=H*.58-i*2;groundVehicles.push(s)}
  for(var i=0;i<5;i++){var s2=spawnTankSprite(-50-i*70,H*.58+40-i*2,'apc');s2.x=-50-i*70;s2.y=H*.58+40-i*2;groundVehicles.push(s2)}
  // Air support
  for(var i=0;i<3;i++){var j=spawnTankSprite(W*.3+i*200,H*.2+i*30,'jet');j.x=W*.3+i*200;j.y=H*.2+i*30;airVehicles.push(j)}
  for(var i=0;i<2;i++){var h=spawnTankSprite(W*.5+i*180,H*.3+i*20,'heli');h.x=W*.5+i*180;h.y=H*.3+i*20;airVehicles.push(h)}
 }

 // Move forces faster
 groundVehicles.forEach(function(v,i){if(v.alive){v.x+=.8;if(v.x>W+80)v.x=-80;v.el.style.left=v.x+'px';v.el.style.top=(v.y+Math.sin(t*1.5+i)*2)+'px'}});
 airVehicles.forEach(function(v,i){
  if(!v.alive)return;
  if(v.el.innerHTML.indexOf('jet')!==-1||JSON.stringify(v.el.innerHTML).indexOf('dddd')!==-1||v.el.innerHTML.indexOf('80px')!==-1){
   // jet
   v.x+=2;v.y=H*.2+Math.sin(t+i)*40;if(v.x>W+100){v.x=-100}
  }else{
   // heli
   v.x+=.6;v.y=H*.3+Math.cos(t*.8+i)*20;if(v.x>W+80){v.x=-80}
  }
  v.el.style.left=v.x+'px';v.el.style.top=v.y+'px';
 });

 // Explosions every 30 seconds
 if(Math.floor(ts)%30===0&&Math.floor(ts)>0&&!explosionTimers[Math.floor(ts)]){
  explosionTimers[Math.floor(ts)]=true;
  spawnExplosion(W*.4+Math.random()*W*.3,H*.5+Math.random()*H*.2,Math.random()>.5);
 }
}

// ======================== SCENE 3: AIR BATTLE (300-480s) ========================
var airPhase3=false;
function sceneAir(t,ts){
 if(ts<2){drawSubtitle('第三章','制空权',ts/2)}else if(ts<5){drawSubtitle('','',1)}
 if(ts>3&&!airPhase3){
  airPhase3=true;clearAllVehicles();
  for(var i=0;i<6;i++){var j=spawnTankSprite(-60-i*80,H*.15+i*25,'jet');j.x=-60-i*80;j.y=H*.15+i*25;airVehicles.push(j)}
  for(var i=0;i<4;i++){var h=spawnTankSprite(W+60+i*70,H*.25+i*30,'heli');h.x=W+60+i*70;h.y=H*.25+i*30;airVehicles.push(h)}
  for(var i=0;i<3;i++){var s=spawnTankSprite(W*.2+i*200,H*.58,'tank');s.x=W*.2+i*200;s.y=H*.58;groundVehicles.push(s)}
 }
 airVehicles.forEach(function(v,i){
  if(!v.alive)return;
  v.x+=1.5+Math.sin(t*.5+i)*.5;v.y+=Math.sin(t*.3+i*.7)*30;if(v.x>W+100)v.x=-100;if(v.x<-100)v.x=W+100;
  v.el.style.left=v.x+'px';v.el.style.top=v.y+'px';
 });
 groundVehicles.forEach(function(v,i){if(v.alive){v.x+=.4;if(v.x>W+80)v.x=-80;v.el.style.left=v.x+'px';v.el.style.top=(v.y+Math.sin(t+1)*2)+'px'}});

 if(Math.floor(ts)%15===0&&ts>0&&!explosionTimers['air'+Math.floor(ts)]){
  explosionTimers['air'+Math.floor(ts)]=true;
  spawnExplosion(W*.2+Math.random()*W*.6,H*.2+Math.random()*H*.3,true);
  // flash screen
  document.getElementById('stage').style.background='rgba(255,150,50,.08)';
  setTimeout(function(){document.getElementById('stage').style.background=''},150);
 }
}

// ======================== SCENE 4: COMBINED ARMS (480-660s) ========================
var combinedPhase4=false;
function sceneCombined(t,ts){
 if(ts<2){drawSubtitle('第四章','空地协同',ts/2)}else if(ts<5){drawSubtitle('','',1)}
 if(ts>3&&!combinedPhase4){combinedPhase4=true;clearAllVehicles();
  for(var i=0;i<6;i++){var s=spawnTankSprite(-80-i*50,H*.58-i*3,'tank');s.x=-80-i*50;s.y=H*.58-i*3;groundVehicles.push(s)}
  for(var i=0;i<4;i++){var s2=spawnTankSprite(-50-i*60,H*.58+40-i*2,'apc');s2.x=-50-i*60;s2.y=H*.58+40-i*2;groundVehicles.push(s2)}
  for(var i=0;i<4;i++){var j=spawnTankSprite(W*.1+i*220,H*.18+i*20,'jet');j.x=W*.1+i*220;j.y=H*.18+i*20;airVehicles.push(j)}
  for(var i=0;i<3;i++){var h=spawnTankSprite(W*.3+i*200,H*.28+i*15,'heli');h.x=W*.3+i*200;h.y=H*.28+i*15;airVehicles.push(h)}
 }
 // intense movement
 groundVehicles.forEach(function(v,i){if(v.alive){v.x+=1.2;if(v.x>W+80)v.x=-80;v.el.style.left=v.x+'px';v.el.style.top=(v.y+Math.sin(t*2+i)*3)+'px'}});
 airVehicles.forEach(function(v,i){if(!v.alive)return;v.x+=2+Math.sin(t+i)*.6;v.y+=Math.sin(t*.4+i*.5)*35;if(v.x>W+100)v.x=-100;if(v.x<-100)v.x=W+100;v.el.style.left=v.x+'px';v.el.style.top=v.y+'px'});

 if(Math.floor(ts)%10===0&&ts>0&&!explosionTimers['comb'+Math.floor(ts)]){
  explosionTimers['comb'+Math.floor(ts)]=true;
  var bx=W*.2+Math.random()*W*.6,by=H*.3+Math.random()*H*.4;
  spawnExplosion(bx,by,Math.random()>.4);
  document.getElementById('stage').style.background='rgba(255,180,60,'+(.05+Math.random()*.08)+')';
  setTimeout(function(){document.getElementById('stage').style.background=''},200);
 }
}

// ======================== SCENE 5: CLIMAX (660-810s) ========================
var climaxPhase5=false;
function sceneClimax(t,ts){
 if(ts<2){drawSubtitle('第五章','最终决战',ts/2)}else if(ts<5){drawSubtitle('','',1)}
 if(ts>3&&!climaxPhase5){climaxPhase5=true;clearAllVehicles();
  for(var i=0;i<10;i++){var s=spawnTankSprite(-80-i*45,H*.58-(i%3)*4,'tank');s.x=-80-i*45;s.y=H*.58-(i%3)*4;groundVehicles.push(s)}
  for(var i=0;i<6;i++){var s2=spawnTankSprite(-50-i*55,H*.58+40-(i%3)*3,'apc');s2.x=-50-i*55;s2.y=H*.58+40-(i%3)*3;groundVehicles.push(s2)}
  for(var i=0;i<8;i++){var j=spawnTankSprite(W*.05+i*120,H*.12+i*18,'jet');j.x=W*.05+i*120;j.y=H*.12+i*18;airVehicles.push(j)}
  for(var i=0;i<5;i++){var h=spawnTankSprite(W*.2+i*160,H*.22+i*14,'heli');h.x=W*.2+i*160;h.y=H*.22+i*14;airVehicles.push(h)}
 }

 groundVehicles.forEach(function(v,i){if(v.alive){v.x+=1.8;if(v.x>W+80)v.x=-80;v.el.style.left=v.x+'px';v.el.style.top=(v.y+Math.sin(t*3+i)*4)+'px'}});
 airVehicles.forEach(function(v,i){if(!v.alive)return;v.x+=3+Math.sin(t*.8+i)*.7;v.y+=Math.sin(t*.5+i*.6)*40;if(v.x>W+120)v.x=-120;if(v.x<-120)v.x=W+120;v.el.style.left=v.x+'px';v.el.style.top=v.y+'px'});

 // Constant explosions
 if(Math.floor(ts)%4===0&&!explosionTimers['clx'+Math.floor(ts)]){
  explosionTimers['clx'+Math.floor(ts)]=true;
  var bx=W*.15+Math.random()*W*.7,by=H*.25+Math.random()*H*.45;
  spawnExplosion(bx,by,true);
  document.getElementById('stage').style.background='rgba(255,200,80,'+(.08+Math.random()*.12)+')';
  setTimeout(function(){document.getElementById('stage').style.background=''},300);
  // occasional screen shake
  var oX=Math.random()*10-5,oY=Math.random()*10-5;
  document.getElementById('stage').style.transform='translate('+oX+'px,'+oY+'px)';
  setTimeout(function(){document.getElementById('stage').style.transform=''},100);
 }
}

// ======================== SCENE 6: CREDITS (810-900s) ========================
var creditsPhase6=false;
function sceneCredits(t,ts){
 if(!creditsPhase6){creditsPhase6=true;clearAllVehicles()}
 if(ts<3){drawTitle('','',ts/3)}else if(ts<20){drawCredits(ts)}else{drawTitle('烈火苍穹','感谢观看',(ts-20)/10)}
}

// ======================== TITLE/SUBTITLE HELPERS ========================
var titleDiv=null,subDiv=null;
function drawTitle(main,sub,a){
 if(!titleDiv){titleDiv=document.createElement('div');titleDiv.className='title-card';titleDiv.innerHTML='<h1></h1><p></p>';_v.appendChild(titleDiv)}
 titleDiv.style.opacity=a;titleDiv.querySelector('h1').textContent=main;titleDiv.querySelector('p').textContent=sub;
}
function drawSubtitle(main,sub,a){
 if(!subDiv){subDiv=document.createElement('div');subDiv.style.cssText='position:absolute;bottom:20%;left:50%;transform:translateX(-50%);color:#fff;font-size:clamp(14px,4vw,22px);font-weight:700;z-index:110;text-shadow:0 0 20px rgba(255,100,0,.6);text-align:center';subDiv.innerHTML='<div></div><div style="font-size:60%;opacity:.5;margin-top:4px"></div>';_v.appendChild(subDiv)}
 subDiv.style.opacity=a;subDiv.children[0].textContent=main;subDiv.children[1].textContent=sub;
}
function drawCredits(ts){
 if(subDiv)subDiv.style.opacity=0;
 if(!titleDiv){titleDiv=document.createElement('div');titleDiv.className='title-card';titleDiv.innerHTML='<h1></h1><p></p>';_v.appendChild(titleDiv)}
 titleDiv.style.opacity=1;
 titleDiv.querySelector('h1').style.fontSize='clamp(16px,5vw,36px)';
 var credits=[
  '','总导演: 小Q AI Studio','','视觉效果: Three.js/CSS','','音效设计: 粒子系统','','军事顾问: 三角洲行动','','特别鸣谢: 所有热爱军事的你','','','烈火苍穹 · 空地大战','© 2026 Q-Studio',
 ];
 var idx=Math.floor(ts/2);
 var txt=credits.slice(Math.max(0,idx-3),idx+3).join('<br>');
 titleDiv.querySelector('h1').innerHTML=txt;
 var fadeProgress=Math.min(1,ts/15);
 titleDiv.style.opacity=fadeProgress;
}

// ======================== MAIN LOOP ========================
var lastT=0,sceneIdx=0,sceneTime=0;
function clearTitle(){
 if(titleDiv){titleDiv.style.opacity=0}
 if(subDiv){subDiv.style.opacity=0}
}

function loop(now){
 requestAnimationFrame(loop);
 if(!startT){startT=now;lastT=now;return}
 var dt=(now-lastT)/1000;lastT=now;
 if(dt<=0||dt>1)dt=.016;
 if(_skip){drawFX(0);return}

 T=(now-startT)/1000;

 // Find current scene
 for(var i=scenes.length-1;i>=0;i--){if(T>=scenes[i].start){sceneIdx=i;break}}
 var sc=scenes[sceneIdx];sceneTime=T-sc.start;

 // Clear titles between scenes
 if(sceneIdx!==(sceneIdx||0))clearTitle();

 // Draw layers
 drawSky(T,sceneIdx);
 drawGround(T,sceneIdx);
 drawFX(T);

 // Scene logic
 switch(sc.name){
  case 'LOGOS':sceneLogos(T,sceneTime);break;
  case 'DAWN':sceneDawn(T,sceneTime);break;
  case 'GROUND':sceneGround(T,sceneTime);break;
  case 'AIR':sceneAir(T,sceneTime);break;
  case 'COMBINED':sceneCombined(T,sceneTime);break;
  case 'CLIMAX':sceneClimax(T,sceneTime);break;
  case 'CREDITS':sceneCredits(T,sceneTime);break;
 }

 // HUD timer
 var totalS=Math.floor(T);
 var m=Math.floor(totalS/60),s=totalS%60;
 document.getElementById('hud').innerHTML='<div style="position:absolute;top:10px;right:14px;color:rgba(255,255,255,.4);font-size:11px">'+
  (m<10?'0'+m:m)+':'+(s<10?'0'+s:s)+' / 15:00</div>'+
  '<div style="position:absolute;top:10px;left:14px;color:rgba(255,255,255,.3);font-size:10px">'+sc.desc+'</div>';

 if(T>900){return}
}
requestAnimationFrame(loop);

document.getElementById('stage').style.transformOrigin='center center';

})();
</script>
</body></html>
