<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>测试</title>
<style>*{margin:0;padding:0}body{background:#111;color:#fff;font-family:sans-serif;text-align:center;padding-top:60px}h2{margin:20px}#msg{font-size:13px;color:#aaa}</style></head><body>
<h2>THREE.js 加载测试</h2><div id="msg">下载中…</div>
<script>
var s=document.createElement("script");
s.src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js";
s.onload=function(){
  document.getElementById("msg").textContent="THREE.js 已加载";
  try{
    var dv=document.createElement("div");dv.style.width="100px";dv.style.height="100px";dv.style.background="red";dv.style.margin="20px auto";dv.textContent="红色方块";document.body.appendChild(dv);
    var r=new THREE.WebGLRenderer();dv.textContent="WebGL 支持!"+JSON.stringify(r.capabilities);
    document.getElementById("msg").textContent="✅ 全部正常! THREE.js v"+THREE.REVISION;
  }catch(e){
    document.getElementById("msg").textContent="❌ 渲染失败: "+e.message;
  }
};
s.onerror=function(){
  document.getElementById("msg").textContent="❌ CDN 下载失败";
};
document.head.appendChild(s);
setTimeout(function(){
  if(typeof THREE==="undefined")document.getElementById("msg").textContent="❌ 超时 - THREE未定义";
},8000);
</script></body></html>
