<!DOCTYPE html><html lang="zh"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>三角洲行动 · 自研3D引擎</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;font-family:'PingFang SC','Microsoft YaHei',sans-serif}
#c{display:block;width:100%;height:100%}
#blocker{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:999;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;cursor:pointer}
#blocker div{padding:32px 48px;border-radius:16px}
#blocker h2{font-size:clamp(20px,5vw,32px);margin-bottom:12px;font-weight:900;letter-spacing:1px}
#blocker p{font-size:14px;color:rgba(255,255,255,.5);margin-bottom:6px}
#blocker .key{display:inline-block;padding:4px 10px;border-radius:6px;background:rgba(255,255,255,.1);font-size:12px;margin:2px;color:#fff}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
.cs{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:20px;height:20px}
.cs::before,.cs::after{content:'';position:absolute;background:rgba(255,255,255,.7)}
.cs::before{top:8px;left:0;width:20px;height:1.5px}.cs::after{left:9px;top:0;width:1.5px;height:20px}
.amm{position:absolute;bottom:40px;right:30px;color:#fff;font-size:28px;font-weight:900;text-shadow:0 0 8px rgba(0,0,0,.6)}
.amm s{font-size:14px;opacity:.4;font-weight:400;text-decoration:none}
.hb{position:absolute;bottom:40px;left:30px;width:200px;height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.hb .f{height:100%;background:linear-gradient(90deg,#f44,#f80);transition:width .3s}
.hl2{position:absolute;bottom:52px;left:30px;color:#fff;font-size:12px;font-weight:700}
.hm{position:absolute;top:30px;left:50%;transform:translateX(-50%);color:#ff0;font-size:24px;font-weight:900;text-shadow:0 0 12px rgba(255,255,0,.6);opacity:0;transition:opacity .1s}
.inf{position:absolute;top:14px;left:16px;color:rgba(255,255,255,.3);font-size:10px}
.sc{position:absolute;top:14px;right:16px;color:#fff;font-size:16px;font-weight:700}
</style></head><body>
<canvas id="c"></canvas>
<div id="blocker"><div><h2>🔫 三角洲行动 · 自研3D引擎</h2><p>点击屏幕锁定鼠标 | <span class="key">WASD</span> 移动 <span class="key">空格</span> 跳跃 <span class="key">R</span> 换弹 <span class="key">Shift</span> 冲刺</p><p style="font-size:11px;opacity:.3;margin-top:12px">鼠标左键射击 · 击倒全部10个靶标获胜</p></div></div>
<div id="hud"><div class="cs"></div><div class="amm"><span id="ac">30</span><s>/30</s></div><div class="hl2">HP</div><div class="hb"><div class="f" id="hf" style="width:100%"></div></div><div class="hm" id="hm2">🎯</div><div class="inf" id="fps2">FPS: --</div><div class="sc" id="sd">靶标: 0/10</div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
(function(){
if(typeof THREE==='undefined'){document.getElementById('blocker').innerHTML='<div><h2>引擎加载失败</h2><p>请刷新页面重试</p></div>';return}

var S=new THREE.Scene();S.background=new THREE.Color(0x87ceeb);S.fog=new THREE.Fog(0xb0c8e0,200,600);
var C=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.3,600);C.position.set(0,3,0);
var R2=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});R2.setSize(innerWidth,innerHeight);R2.setPixelRatio(Math.min(devicePixelRatio,2));R2.shadowMap.enabled=true;R2.shadowMap.type=THREE.PCFSoftShadowMap;

// Lights
S.add(new THREE.AmbientLight(0x8899bb,.7));
var sun2=new THREE.DirectionalLight(0xfff8e8,1.0);sun2.position.set(80,120,40);sun2.castShadow=true;sun2.shadow.mapSize.width=2048;sun2.shadow.mapSize.height=2048;sun2.shadow.camera.near=1;sun2.shadow.camera.far=400;sun2.shadow.camera.left=-80;sun2.shadow.camera.right=80;sun2.shadow.camera.top=80;sun2.shadow.camera.bottom=-80;sun2.shadow.bias=-.0005;S.add(sun2);
S.add(new THREE.HemisphereLight(0x8899ff,0x443322,.4));

// Sky gradient sphere
var skyGeo3=new THREE.SphereGeometry(280,32,20);
var skyMat3=new THREE.ShaderMaterial({uniforms:{topColor:{value:new THREE.Color(0x4488cc)},bottomColor:{value:new THREE.Color(0xc8ddf0)},offset:{value:20},exponent:{value:.4}},vertexShader:'varying vec3 vWP;void main(){vec4 wp=modelMatrix*vec4(position,1.0);vWP=wp.xyz;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',fragmentShader:'uniform vec3 topColor;uniform vec3 bottomColor;uniform float offset;uniform float exponent;varying vec3 vWP;void main(){float h=normalize(vWP+offset).y;gl_FragColor=vec4(mix(bottomColor,topColor,max(pow(max(h,0.0),exponent),0.0)),1.0);}',side:THREE.BackSide});S.add(new THREE.Mesh(skyGeo3,skyMat3));

// === TERRAIN HEIGHT FUNCTION ===
function terrainH(x,z){return Math.sin(x*.02)*Math.cos(z*.025)*12+Math.sin(x*.035+1.5)*Math.sin(z*.03)*8+Math.cos(x*.015-z*.02)*6}

// Buildings collision list
var buildingBoxes=[];
function addBuildingCollision(x,z,rot,w,d,h){
 var bh=terrainH(x,z);
 buildingBoxes.push({x:x,z:z,bottom:bh,top:bh+h,hw:w/2,hd:d/2,rot:rot});
}

// Terrain mesh
var tSZ=400,tSG=120;
var tGeo=new THREE.PlaneGeometry(tSZ,tSZ,tSG,tSG);tGeo.rotateX(-Math.PI/2);
var htArr=[];for(var i=0;i<=tSG;i++)for(var j=0;j<=tSG;j++){var xx=(j/tSG-.5)*tSZ,zz=(i/tSG-.5)*tSZ;htArr.push(xx,terrainH(xx,zz),zz)}
tGeo.setAttribute('position',new THREE.Float32BufferAttribute(htArr,3));tGeo.computeVertexNormals();
var tM=new THREE.MeshStandardMaterial({color:0x6b8e4a,roughness:.9,metalness:.05});
var terrainMesh=new THREE.Mesh(tGeo,tM);terrainMesh.receiveShadow=true;S.add(terrainMesh);

// Road
function addRoad(x,z,angle,w){
 var rdGeo=new THREE.PlaneGeometry(w,tSZ,2,80);rdGeo.rotateX(-Math.PI/2);
 var rdArr=[];for(var i=0;i<=80;i++){var t=(i/80-.5)*tSZ;var rx=Math.cos(angle)*t,rz=Math.sin(angle)*t;var rh=terrainH(rx,rz)+.05;rdArr.push(rx-w/2*Math.sin(angle),rh,rz+w/2*Math.cos(angle),rx+w/2*Math.sin(angle),rh,rz-w/2*Math.cos(angle))}
 rdGeo.setAttribute('position',new THREE.Float32BufferAttribute(rdArr,3));rdGeo.computeVertexNormals();
 var rd2=new THREE.Mesh(rdGeo,new THREE.MeshStandardMaterial({color:0x555555,roughness:.95}));rd2.receiveShadow=true;S.add(rd2);
}
addRoad(-40,0,0,6);
for(var r=0;r<3;r++)addRoad(0,0,r*Math.PI/3,5);

// Trees
var tClr=[0x3a6b2a,0x2d5a1e,0x4a7a35,0x356028];
for(var tt=0;tt<200;tt++){
 var ttx=(Math.random()-.5)*380,ttz=(Math.random()-.5)*380;
 if(Math.abs(ttx)<25&&Math.abs(ttz)<25)continue;
 var tth=terrainH(ttx,ttz);if(tth<-2)continue;
 var tH2=1.5+Math.random()*2.5;
 var trk=new THREE.Mesh(new THREE.CylinderGeometry(.15,.22,tH2,6),new THREE.MeshStandardMaterial({color:0x6b4a30,roughness:.9}));trk.position.set(ttx,tth+tH2/2,ttz);trk.castShadow=true;trk.receiveShadow=true;S.add(trk);
 var lvs=new THREE.Mesh(new THREE.ConeGeometry(.6+Math.random()*.4,tH2*.7,7,4),new THREE.MeshStandardMaterial({color:tClr[Math.floor(Math.random()*4)],roughness:.85}));lvs.position.set(ttx,tth+tH2*.9,ttz);lvs.castShadow=true;lvs.receiveShadow=true;S.add(lvs);
}

// Buildings
var wallM=new THREE.MeshStandardMaterial({color:0x8899a5,roughness:.7,metalness:.2});
var roofM=new THREE.MeshStandardMaterial({color:0x556068,roughness:.5,metalness:.4});
var winM=new THREE.MeshStandardMaterial({color:0x335577,roughness:.3,metalness:.6});
function addBld(x,z,rot,w,d,h){
 var bh2=terrainH(x,z);
 var wl2=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),wallM);wl2.position.set(x,bh2+h/2,z);wl2.rotation.y=rot;wl2.castShadow=true;wl2.receiveShadow=true;S.add(wl2);
 var rf2=new THREE.Mesh(new THREE.BoxGeometry(w+.3,.3,d+.3),roofM);rf2.position.set(x,bh2+h+.15,z);rf2.rotation.y=rot;rf2.castShadow=true;S.add(rf2);
 var flrs=Math.floor(h/3.5);
 for(var f=0;f<flrs;f++)for(var s=-1;s<=1;s+=2){var wx=Math.cos(rot)*s*w/2.2,wz=-Math.sin(rot)*s*w/2.2;var wn=new THREE.Mesh(new THREE.BoxGeometry(.05,1.2,1.8),winM);wn.position.set(x+wx,bh2+2+f*3.5,z+wz);wn.rotation.y=rot;S.add(wn)}
 addBuildingCollision(x,z,rot,w,d,h);
}
addBld(-35,10,0,14,10,18);addBld(-18,15,.1,10,8,12);
addBld(-50,-5,.15,20,8,8);addBld(-55,22,-.1,8,6,10);
addBld(15,-30,.2,16,12,14);addBld(0,-35,-.1,20,10,10);
addBld(30,-25,.3,12,8,16);addBld(45,-15,-.2,18,10,12);
addBld(-40,-40,0,22,14,15);addBld(50,20,.1,10,8,8);

// Containers
var cntM=new THREE.MeshStandardMaterial({color:0xcc6644,roughness:.5,metalness:.6});
for(var ct=0;ct<15;ct++){var cX=-30+Math.random()*80,cZ=-50+Math.random()*80;var cH=terrainH(cX,cZ);var cnt=new THREE.Mesh(new THREE.BoxGeometry(2,2.5,6),cntM);cnt.position.set(cX,cH+1.25,cZ);cnt.rotation.y=Math.random()*Math.PI;cnt.castShadow=true;cnt.receiveShadow=true;S.add(cnt)}

// === COLLISION CHECK ===
function getGroundH(x,z){
 var h2=terrainH(x,z);
 for(var bi=0;bi<buildingBoxes.length;bi++){
  var bb=buildingBoxes[bi];
  var dx=x-bb.x,dz=z-bb.z;
  var lx=Math.cos(-bb.rot)*dx-Math.sin(-bb.rot)*dz;
  var lz=Math.sin(-bb.rot)*dx+Math.cos(-bb.rot)*dz;
  if(Math.abs(lx)<bb.hw+.4&&Math.abs(lz)<bb.hd+.4){h2=Math.max(h2,bb.top)}
 }
 return h2;
}

// === TARGETS ===
var targets=[],targetCount=10,score=0;
function mkTarget(ct2){
 var g=new THREE.Group();
 if(ct2==='red'){
  g.add(new THREE.Mesh(new THREE.SphereGeometry(.5,8,6),new THREE.MeshStandardMaterial({color:0xcc2222,roughness:.4}))).position.y=5.5;
  g.add(new THREE.Mesh(new THREE.CylinderGeometry(.4,.6,3.5,8),new THREE.MeshStandardMaterial({color:0xcc2222,roughness:.4}))).position.y=3.5;
  g.add(new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,2,6),new THREE.MeshStandardMaterial({color:0xcc2222,roughness:.4}))).position.set(.6,4.5,0).rotation.z=.3;
  g.add(new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,2,6),new THREE.MeshStandardMaterial({color:0xcc2222,roughness:.4}))).position.set(-.6,4.5,0).rotation.z=-.3;
 }else{
  g.add(new THREE.Mesh(new THREE.BoxGeometry(1.2,4,1.2),new THREE.MeshStandardMaterial({color:0x2244cc,roughness:.4}))).position.y=2;
  g.add(new THREE.Mesh(new THREE.SphereGeometry(.5,8,6),new THREE.MeshStandardMaterial({color:0x2244cc,roughness:.4}))).position.y=4.5;
 }
 g.add(new THREE.Mesh(new THREE.CylinderGeometry(.6,.8,.3,8),new THREE.MeshStandardMaterial({color:0x333,roughness:.8})));
 g.userData={hp:1,alive:true};g.castShadow=true;g.receiveShadow=true;return g;
}
for(var tg=0;tg<targetCount;tg++){
 var ttx2=-60+Math.random()*120,ttz2=-80+Math.random()*140;
 if(Math.abs(ttx2)<5&&Math.abs(ttz2)<5)ttx2+=15;
 var tth2=terrainH(ttx2,ttz2),to=mkTarget(tg%3===0?'blue':'red');
 to.position.set(ttx2,tth2,ttz2);if(tg%3===0)to.rotation.y=Math.random()*Math.PI*2;S.add(to);targets.push(to);
}

// Weapon
var wpnGrp=new THREE.Group();C.add(wpnGrp);wpnGrp.position.set(.3,-.35,-.6);
wpnGrp.add(new THREE.Mesh(new THREE.CylinderGeometry(.03,.04,1.2,8),new THREE.MeshStandardMaterial({color:0x222,roughness:.3,metalness:.8})).rotation.x=Math.PI/2).position.set(0,.05,-.6);
wpnGrp.add(new THREE.Mesh(new THREE.BoxGeometry(.12,.2,.5),new THREE.MeshStandardMaterial({color:0x333,roughness:.4,metalness:.7}))).position.set(0,-.05,0);
wpnGrp.add(new THREE.Mesh(new THREE.BoxGeometry(.08,.15,.4),new THREE.MeshStandardMaterial({color:0x2a2a2a,roughness:.5,metalness:.5}))).position.set(0,-.02,.3);
wpnGrp.add(new THREE.Mesh(new THREE.CylinderGeometry(.04,.05,.3,6),new THREE.MeshStandardMaterial({color:0x1a1a1a,roughness:.5,metalness:.4}))).position.set(0,-.2,.05);
wpnGrp.add(new THREE.Mesh(new THREE.BoxGeometry(.06,.25,.08),new THREE.MeshStandardMaterial({color:0x111,roughness:.6,metalness:.6}))).position.set(0,-.25,.15);
wpnGrp.visible=false;

// Muzzle flash
var mzL2=new THREE.PointLight(0xffaa00,0,8);mzL2.position.set(.3,-.08,-.8);C.add(mzL2);
var mzMesh2=new THREE.Mesh(new THREE.SphereGeometry(.06,4,4),new THREE.MeshBasicMaterial({color:0xffcc00,transparent:true,opacity:0}));mzMesh2.position.copy(mzL2.position);C.add(mzMesh2);

// Impact particles
var iParts=[];
function splat(pos){
 for(var i=0;i<12;i++){var a=Math.random()*6.28,s=2+Math.random()*8;iParts.push({x:pos.x,y:pos.y,z:pos.z,vx:Math.cos(a)*s,vy:Math.random()*s*.5,vz:Math.sin(a)*s,l:.3+Math.random()*.7,c:Math.random()<.5?0xffcc88:0xff9944,s2:.02+Math.random()*.04})}
}

// Player state
var pos=new THREE.Vector3(0,15,-10),vel=new THREE.Vector3();
var onGround=false,hp2=100;
var ammo2=30,maxAmmo2=30,reloading2=false,reloadT2=0;
var keys2={},sensi=.002;
var eul2=new THREE.Euler(0,0,0,'YXZ');
var rc=new THREE.Raycaster();rc.far=300;

// Controls
document.addEventListener('keydown',function(e){keys2[e.code]=true;if(e.code==='KeyR'&&ammo2<maxAmmo2&&!reloading2){reloading2=true;reloadT2=1.8}});
document.addEventListener('keyup',function(e){keys2[e.code]=false});
document.addEventListener('mousedown',function(e){if(e.button===0&&ammo2>0&&!reloading2&&document.pointerLockElement)shoot2()});
var blk=document.getElementById('blocker');
blk.addEventListener('click',function(){if(!document.pointerLockElement)document.body.requestPointerLock()});
document.addEventListener('pointerlockchange',function(){if(document.pointerLockElement){blk.style.display='none';wpnGrp.visible=true}else{blk.style.display='flex';wpnGrp.visible=false}});
document.addEventListener('mousemove',function(e){if(!document.pointerLockElement)return;eul2.setFromQuaternion(C.quaternion);eul2.y-=e.movementX*sensi;eul2.x-=e.movementY*sensi;eul2.x=Math.max(-1.4,Math.min(1.4,eul2.x));C.quaternion.setFromEuler(eul2)});

function shoot2(){
 ammo2--;document.getElementById('ac').textContent=ammo2;
 mzL2.intensity=2;mzMesh2.material.opacity=1;setTimeout(function(){mzL2.intensity=0;mzMesh2.material.opacity=0},60);
 wpnGrp.position.z=-.55;setTimeout(function(){wpnGrp.position.z=-.6},40);
 eul2.x-=.025;setTimeout(function(){eul2.x+=.02},50);
 rc.set(C.getWorldPosition(new THREE.Vector3()),C.getWorldDirection(new THREE.Vector3()).normalize());
 var hits=rc.intersectObjects(S.children,true);
 if(hits.length>0){splat(hits[0].point);var o=hits[0].object;while(o){var ti2=targets.indexOf(o);if(ti2>=0&&o.userData.alive){o.userData.alive=false;score++;document.getElementById('sd').textContent='靶标: '+score+'/'+targetCount;var hm3=document.getElementById('hm2');hm3.style.opacity='1';setTimeout(function(){hm3.style.opacity='0'},200);o.rotation.x=Math.PI/2+.3;o.position.y-=.5;o.children.forEach(function(c2){if(c2.material&&c2.material.color){c2.material.color.set(0x666);setTimeout(function(){c2.material.color.set(ti2%3===0?0x2244cc:0xcc2222)},200)}});break}o=o.parent}}
 if(ammo2<=0){reloading2=true;reloadT2=2}
}

// Game loop
var lastT2=0,startT2=0,totalT2=0,fpsArr2=[];

function gameLoop(now){
 requestAnimationFrame(gameLoop);
 if(!lastT2){lastT2=now;startT2=now;return}
 var dt=Math.min(.15,(now-lastT2)/1000);lastT2=now;if(dt<.001)dt=.016;totalT2+=dt;
 if(!document.pointerLockElement){R2.render(S,C);return}

 fpsArr2.push(1/dt);if(fpsArr2.length>30)fpsArr2.shift();
 if(fpsArr2.length===30){document.getElementById('fps2').textContent='FPS: '+Math.round(fpsArr2.reduce(function(a,b){return a+b})/30)+' | 自研3D引擎'}

 // Movement
 var spd2=keys2['ShiftLeft']?14:8;
 var mv=new THREE.Vector3();
 if(keys2['KeyW']){mv.add(C.getWorldDirection(new THREE.Vector3()).setY(0).normalize())}
 if(keys2['KeyS']){mv.add(C.getWorldDirection(new THREE.Vector3()).setY(0).normalize().multiplyScalar(-1))}
 if(keys2['KeyA']){mv.add(new THREE.Vector3().crossVectors(C.getWorldDirection(new THREE.Vector3()),new THREE.Vector3(0,1,0)).normalize().multiplyScalar(-1))}
 if(keys2['KeyD']){mv.add(new THREE.Vector3().crossVectors(C.getWorldDirection(new THREE.Vector3()),new THREE.Vector3(0,1,0)).normalize())}
 if(mv.length()>0)mv.normalize();
 pos.x+=mv.x*spd2*dt;pos.z+=mv.z*spd2*dt;

 // Gravity
 var gH=getGroundH(pos.x,pos.z);
 vel.y-=18*dt;pos.y+=vel.y*dt;
 if(pos.y<=gH+1.8){pos.y=gH+1.8;vel.y=0;onGround=true}else{onGround=false}
 if(keys2['Space']&&onGround){vel.y=9;onGround=false}

 // Reload
 if(reloading2){reloadT2-=dt;if(reloadT2<=0){reloading2=false;ammo2=maxAmmo2;document.getElementById('ac').textContent=ammo2}}

 C.position.copy(pos);
 // Weapon bob
 if(onGround&&mv.length()>0){wpnGrp.position.y=-.35+Math.sin(totalT2*12)*.015;wpnGrp.position.x=.3+Math.cos(totalT2*8)*.008}else{wpnGrp.position.y=-.35;wpnGrp.position.x=.3}
 if(mzL2.intensity>.01)mzL2.intensity*=.85;

 // Particles
 for(var i=iParts.length-1;i>=0;i--){var ip2=iParts[i];ip2.x+=ip2.vx*dt;ip2.y+=ip2.vy*dt;ip2.z+=ip2.vz*dt;ip2.l-=dt;ip2.vy-=8*dt;if(ip2.l<=0){iParts.splice(i,1);continue}}
 iParts.forEach(function(p){var g2=new THREE.SphereGeometry(p.s2,3,3);var m2=new THREE.Mesh(g2,new THREE.MeshBasicMaterial({color:p.c,transparent:true,opacity:Math.min(1,p.l*2)}));m2.position.set(p.x,p.y,p.z);S.add(m2);setTimeout(function(){S.remove(m2)},70)});

 // Win check
 if(score>=targetCount){document.getElementById('sd').textContent='🏆 全部击倒! 胜利! 刷新重玩';document.getElementById('sd').style.color='#ff0'}

 // Sky animation
 S.children.forEach(function(ch){if(ch.material&&ch.material.uniforms&&ch.material.uniforms.offset)ch.material.uniforms.offset.value=20+Math.sin(totalT2*.02)*5});

 R2.render(S,C);
}
requestAnimationFrame(gameLoop);
window.addEventListener('resize',function(){C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R2.setSize(innerWidth,innerHeight)});
})();</script></body></html>
