<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>烽火地带 · 全动画序列</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;font-family:'PingFang SC','Microsoft YaHei',sans-serif}
#c{display:block;width:100%;height:100%}
#hint{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.35);font-size:11px;z-index:99;letter-spacing:2px;transition:opacity .3s}
#hint i{font-style:normal;animation:blink 1s infinite}@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
</style></head><body>
<canvas id="c"></canvas>
<div id="hint"><i>▸</i> 点击屏幕进入</div>
<script>
var C=document.getElementById('c'),ctx=C.getContext('2d'),W,H;
var st=0,phase=0,entered=false; // 0=待机,1=启动,2=匹配,3=选干员,4=开场,5=下滑锁,6=撤离
var pStart=0,phaseDur=[3.5,3.0,4.0,4.5,2.5,4.0]; // 各阶段持续秒数

function R(){C.width=W=innerWidth*Math.min(devicePixelRatio,2);C.height=H=innerHeight*Math.min(devicePixelRatio,2);C.style.width=innerWidth+'px';C.style.height=innerHeight+'px'}R();window.addEventListener('resize',R);

// 全局粒子
var P=[],N=100;
for(var i=0;i<N;i++)P.push({x:0,y:0,vx:0,vy:0,l:0,d:.008+Math.random()*.02,s:1+Math.random()*3,h:25+Math.random()*15,a:1});

function spawn(x,y,t){return{x:x||W/2,y:y||H*.5,vx:(Math.random()-.5)*2,vy:-Math.random()*3-1,l:1,d:.005+Math.random()*.02,s:1+Math.random()*2.5,h:t==='ember'?20+Math.random()*15:t==='smoke'?200:35+Math.random()*10,a:1,type:t||'spark'}}

// 用种子重置所有粒子
function resetP(xs,ys,type){for(var i=0;i<N;i++){var sx=xs?xs+Math.random()*200-100:W/2,sy=ys?ys+Math.random()*60-30:H*.5;P[i]=spawn(sx,sy,type);P[i].l=Math.random()}}

// ========== 选择干员(点击切换) ==========
var selOp=0;
var ops=[{name:'骇爪',code:'HACKCLAW',role:'侦察',weapon:'Vector .45',color:'#00ccff',emoji:'🦅'},{name:'威龙',code:'WYVERN',role:'突击',weapon:'AK-47',color:'#ff4400',emoji:'🐉'},{name:'红狼',code:'REDWOLF',role:'突击',weapon:'M4A1',color:'#ff2200',emoji:'🐺'},{name:'深蓝',code:'DEEPBLUE',role:'工程',weapon:'M249',color:'#2266ff',emoji:'🛡️'},{name:'液氮',code:'CRYO',role:'工程',weapon:'MP5',color:'#88ccff',emoji:'❄️'},{name:'蜂医',code:'MEDIC',role:'支援',weapon:'P90',color:'#00ff88',emoji:'💉'},{name:'露娜',code:'LUNA',role:'侦察',weapon:'SR-25',color:'#ff88cc',emoji:'🌙'}];

// 全局时间
var gtStart=performance.now(),animT=0,gPhase=0,phaseT=0;

// 点击屏幕进入/切换
C.addEventListener('click',function(e){
  if(!entered){entered=true;gtStart=performance.now();gPhase=0;document.getElementById('hint').style.opacity='0';resetP(W/2,H*.5,'spark');return}
  // 在选干员阶段点击切换干员
  if(gPhase===3){var w3=Math.min(80,W*.13);var startX=W/2-(ops.length-1)*w3*.6;var cx=e.clientX;for(var i=0;i<ops.length;i++){var ox=startX+i*w3*1.2;if(cx>ox-w3/2&&cx<ox+w3/2){selOp=i;return}}}
  // 在下滑锁阶段点击解锁
  if(gPhase===5){
    var lx=W/2-120,rx=W/2+120,ly=H*.55,ry=H*.55+46;
    if(e.clientX>lx&&e.clientX<rx&&e.clientY>ly&&e.clientY<ry){redSliding=true}
  }
});

// 下滑锁滑动
var redSliding=false,redSlideX=0;
C.addEventListener('touchmove',function(e){if(gPhase===5&&redSliding){redSlideX=Math.max(0,Math.min(240,(e.touches[0].clientX-(W/2-120))));}});
C.addEventListener('touchend',function(){if(redSliding&&redSlideX>200){gPhase=6;pStart=performance.now();phaseT=0}redSliding=false;redSlideX=0});

C.addEventListener('mousemove',function(e){if(gPhase===5&&redSliding){redSlideX=Math.max(0,Math.min(240,(e.clientX-(W/2-120))))}});
C.addEventListener('mouseup',function(){if(redSliding&&redSlideX>200){gPhase=6;pStart=performance.now();phaseT=0}redSliding=false;redSlideX=0});

// ========== 主循环 ==========
function tick(now){
  requestAnimationFrame(tick);
  if(!entered){drawIdle(now);return}
  animT=(now-gtStart)/1000;
  // 计算当前阶段和阶段时间
  var acc=0;
  for(var i=0;i<phaseDur.length;i++){if(animT<acc+phaseDur[i]){gPhase=i;phaseT=animT-acc;break}acc+=phaseDur[i]}
  if(animT>=acc){gPhase=6;phaseT=animT-acc} // 最后阶段不重置

  ctx.save();ctx.clearRect(0,0,W,H);

  switch(gPhase){
    case 0:drawPhase0(phaseT);break;   // 启动动画
    case 1:drawPhase1(phaseT);break;   // 匹配动画
    case 2:drawPhase2(phaseT);break;   // 选干员动画
    case 3:drawPhase3(phaseT);break;   // 开场动画
    case 4:drawPhase4(phaseT);break;   // 下滑锁
    case 5:drawPhase5(phaseT);break;   // 撤离动画
  }

  drawGlobalParticles(gPhase,phaseT);
  // 底部阶段指示器
  drawPhaseIndicator(gPhase);
  ctx.restore();
}

// ========== 待机画面 ==========
function drawIdle(now){
  var bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#080e14');bg.addColorStop(1,'#0f1822');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // 远处的火光
  var fg=ctx.createRadialGradient(W/2,H*.55,0,W/2,H*.55,W*.7);fg.addColorStop(0,'rgba(255,100,20,.12)');fg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=fg;ctx.fillRect(0,H*.2,W,H*.8);
  // 地面
  ctx.fillStyle='#0d141c';ctx.fillRect(0,H*.55,W,H*.45);
  // 停机坪标记
  ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=2;ctx.strokeRect(W/2-80,H*.55-60,160,3);ctx.strokeRect(W/2-80,H*.55-60,3,60);
  ctx.fillStyle='rgba(255,255,255,.06)';ctx.font='bold 40px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.fillText('H',W/2,H*.55-15);
  // 直升机剪影
  ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(W/2-50,H*.45-15,100,25);ctx.fillRect(W/2-15,H*.45-30,30,15);
  // 标题
  ctx.fillStyle='rgba(255,255,255,.15)';ctx.font='18px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.fillText('烽火地带',W/2,H*.68);
  ctx.fillStyle='rgba(255,255,255,.08)';ctx.font='10px "PingFang SC","Microsoft YaHei",sans-serif';ctx.fillText('HAZARD OPERATIONS',W/2,H*.72);
  // 旋翼微转
  ctx.save();ctx.translate(W/2,H*.45-30);ctx.rotate(now*.002);
  for(var i=0;i<4;i++){ctx.save();ctx.rotate(i*Math.PI/2);ctx.strokeStyle='rgba(255,255,255,.05)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(50,0);ctx.stroke();ctx.restore()}
  ctx.restore();
}

// ==================== 阶段0: 启动动画 ====================
function drawPhase0(t){
  var bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0a0d14');bg.addColorStop(1,'#111822');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  // 扫描线
  var sy=(t*80)%H;ctx.fillStyle='rgba(255,255,255,.03)';ctx.fillRect(0,sy,W,2);

  // 中心三角Logo
  var cx=W/2,cy=H*.35,triSz=45+Math.sin(t*3)*3;
  ctx.save();ctx.translate(cx,cy);
  ctx.shadowColor='rgba(255,80,20,.6)';ctx.shadowBlur=30;
  var lg=ctx.createLinearGradient(0,-triSz,0,triSz);lg.addColorStop(0,'#ff6633');lg.addColorStop(.5,'#ff3300');lg.addColorStop(1,'#cc1100');
  ctx.fillStyle=lg;ctx.beginPath();ctx.moveTo(0,-triSz);ctx.lineTo(-triSz*.82,triSz*.58);ctx.lineTo(triSz*.82,triSz*.58);ctx.closePath();ctx.fill();ctx.shadowBlur=0;
  // 缺口
  ctx.fillStyle='#0a0d14';var isz=triSz*.52;ctx.beginPath();ctx.moveTo(0,-isz*.75+4);ctx.lineTo(-isz*.65,isz*.47);ctx.lineTo(isz*.65,isz*.47);ctx.closePath();ctx.fill();
  ctx.restore();

  // DELTA FORCE
  var a1=Math.min(1,t*2);
  ctx.fillStyle='rgba(255,255,255,'+(a1*.9)+')';ctx.font='bold 20px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.fillText('DELTA FORCE',W/2,cy+58);
  ctx.fillStyle='rgba(255,255,255,'+(a1*.5)+')';ctx.font='10px "PingFang SC","Microsoft YaHei",sans-serif';ctx.fillText('TENCENT GAMES',W/2,cy+72);

  // 进度条
  var pbw=W*.35,pbx=W/2-pbw/2,pby=H*.62,pg=Math.min(1,t/3.5);
  ctx.fillStyle='rgba(255,255,255,.06)';ctx.fillRect(pbx,pby,pbw,2);
  ctx.fillStyle='#ff4400';ctx.fillRect(pbx,pby,pbw*pg,2);
  ctx.fillStyle='rgba(255,255,255,.25)';ctx.font='9px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.fillText('INITIALIZING '+Math.floor(pg*100)+'%',W/2,pby+14);

  // 底部版本
  ctx.fillStyle='rgba(255,255,255,.12)';ctx.font='9px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='right';ctx.fillText('MIUI STUDIO v1.0',W-20,H-15);
}

// ==================== 阶段1: 匹配动画 ====================
function drawPhase1(t){
  var bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0c1018');bg.addColorStop(1,'#0f1822');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  // 中心旋转图标
  var cx=W/2,cy=H*.38,rad=30+Math.sin(t*2)*4;
  ctx.save();ctx.translate(cx,cy);ctx.rotate(t*3);
  ctx.strokeStyle='rgba(255,120,40,.7)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,rad,0,Math.PI*1.5);ctx.stroke();
  ctx.fillStyle='#ff6600';ctx.beginPath();ctx.arc(Math.cos(t*3)*rad,Math.sin(t*3)*rad,3,0,Math.PI*2);ctx.fill();
  ctx.restore();

  // "正在匹配"
  var pulse=1+Math.sin(t*4)*.05;
  ctx.save();ctx.translate(cx,cy+60);ctx.scale(pulse,pulse);
  ctx.fillStyle='rgba(255,255,255,.9)';ctx.font='bold 18px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.fillText('正在匹配…',0,0);
  ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='11px "PingFang SC","Microsoft YaHei",sans-serif';ctx.fillText('SEARCHING FOR SQUAD',0,20);
  ctx.restore();

  // 预计时间
  var est=Math.max(0,3-t)*3;
  ctx.fillStyle='rgba(255,255,255,.3)';ctx.font='10px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.fillText('预计 ~'+Math.floor(est)+'s',W/2,H*.52);

  // 玩家头像(静态)
  var avatars=[];
  for(var i=0;i<3;i++){var ax=W/2-30+i*30,ay=H*.58;ctx.strokeStyle='rgba(255,255,255,.1)';ctx.lineWidth=2;ctx.strokeRect(ax-12,ay-12,24,24);ctx.fillStyle='rgba(255,255,255,.05)';ctx.fillRect(ax-12,ay-12,24,24);ctx.fillStyle='rgba(255,255,255,.15)';ctx.font='14px sans-serif';ctx.textAlign='center';ctx.fillText('+',ax,ay+5)}
}

// ==================== 阶段2: 选干员 ====================
function drawPhase2(t){
  var bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0a0f16');bg.addColorStop(1,'#111822');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  // 顶部标题
  ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='bold 15px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.fillText('选择干员',W/2,H*.08);
  ctx.fillStyle='rgba(255,255,255,.3)';ctx.font='9px "PingFang SC","Microsoft YaHei",sans-serif';ctx.fillText('SELECT OPERATOR',W/2,H*.12);

  // 当前选中干员大卡片(上部居中)
  var op=ops[selOp],scx=W/2,scy=H*.35;
  var cardAlpha=Math.min(1,t*3);
  ctx.save();ctx.globalAlpha=cardAlpha;

  // 卡片背景
  ctx.fillStyle='rgba(20,25,35,.8)';ctx.strokeStyle=op.color;ctx.lineWidth=2;
  var cw=W*.5,ch=H*.32,cx3=scx-cw/2,cy3=scy-ch/2;
  ctx.fillRect(cx3,cy3,cw,ch);ctx.strokeRect(cx3,cy3,cw,ch);

  // 干员代号
  ctx.fillStyle=op.color;ctx.font='bold 22px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.fillText(op.emoji+' '+op.name,scx,scy-15);
  ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='10px "PingFang SC","Microsoft YaHei",sans-serif';ctx.fillText('代号: '+op.code,scx,scy+5);
  ctx.fillText('兵种: '+op.role,scx,scy+18);
  ctx.fillText('主武器: '+op.weapon,scx,scy+31);

  // 技能槽
  var skills=['战术道具','被动技能','主动技能','大招'];
  for(var i=0;i<4;i++){
    var sx3=scx-90+i*60;
    ctx.fillStyle=i===0?op.color:'rgba(255,255,255,.15)';ctx.fillRect(sx3-18,scy+45,36,36);
    ctx.fillStyle='rgba(255,255,255,.4)';ctx.font='7px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.fillText(skills[i],sx3,scy+92);
  }

  ctx.restore();

  // 底部干员头像栏
  var bw3=Math.min(55,W*.1),gap3=bw3*.2,startX3=W/2-ops.length*bw3*.55;
  var bottomY=H*.85;

  for(var i=0;i<ops.length;i++){
    var x3=startX3+i*(bw3+gap3),isSel=i===selOp;
    // 跳动进入
    var offset=Math.max(0,Math.min(1,(t-i*.08)*3));
    var y3=bottomY+(1-offset)*60;

    ctx.save();ctx.globalAlpha=offset;
    if(isSel){
      ctx.strokeStyle=ops[i].color;ctx.lineWidth=3;ctx.strokeRect(x3-3,y3-3,bw3+6,bw3+6);
      ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(x3-3,y3-3,bw3+6,bw3+6);
    }
    ctx.fillStyle='rgba(20,25,38,.7)';ctx.fillRect(x3,y3,bw3,bw3);
    // 图标
    ctx.fillStyle=ops[i].color;ctx.font=Math.floor(bw3*.4)+'px sans-serif';ctx.textAlign='center';ctx.fillText(ops[i].emoji,x3+bw3/2,y3+bw3*.65);
    // 名字
    ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='8px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.fillText(ops[i].name,x3+bw3/2,y3+bw3+12);
    ctx.restore();
  }

  // 倒计时
  var remain=Math.max(0,4-t);
  ctx.fillStyle='rgba(255,255,255,'+(.3+Math.abs(Math.sin(t*3))*.3)+')';ctx.font='bold 12px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.fillText('⏱ 即将开始 '+Math.ceil(remain)+'s',W/2,H*.93);

  // 聊天框(模拟)
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(10,H*.75,120,20);
  ctx.fillStyle='rgba(255,255,255,.3)';ctx.font='9px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='left';ctx.fillText('队伍: 准备出击',16,H*.75+14);
}

// ==================== 阶段3: 开场动画 ====================
function drawPhase3(t){
  var bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0a0e18');bg.addColorStop(.4,'#0f1520');bg.addColorStop(1,'#0d1218');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  // 地平线火光
  var fg2=ctx.createRadialGradient(W/2,H*.48,0,W/2,H*.48,W*.8);fg2.addColorStop(0,'rgba(255,100,30,.18)');fg2.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=fg2;ctx.fillRect(0,H*.15,W,H*.6);

  // 地面
  ctx.fillStyle='#0b1018';ctx.fillRect(0,H*.48,W,H*.52);

  // 远处建筑
  var blds=[{x:W*.55,y:H*.48,h:90,w:50},{x:W*.65,y:H*.48,h:60,w:40},{x:W*.15,y:H*.48,h:40,w:35}];
  blds.forEach(function(b){ctx.fillStyle='#111822';ctx.fillRect(b.x,b.y-b.h,b.w,b.h);ctx.fillStyle='rgba(255,200,100,.15)';ctx.fillRect(b.x+8,b.y-b.h+5,6,8)});

  // 直升机编队
  var hCount=3;
  for(var h=0;h<hCount;h++){
    var ht=Math.min(1,t*.5+h*.1);
    var hx=W*.2+h*W*.25;
    var hy=H*.15+Math.sin(t+h)*15-ht*50;
    var hs=.4+ht*.3;
    ctx.save();ctx.translate(hx,hy);ctx.scale(hs,hs);ctx.rotate(-0.15);

    // 简易直升机
    ctx.fillStyle='#1a2535';ctx.fillRect(-25,-6,50,12);
    ctx.fillStyle='#0d1520';ctx.fillRect(-10,-10,20,8);
    // 旋翼
    ctx.save();ctx.rotate(t*20+h);
    ctx.strokeStyle='rgba(200,220,240,.4)';ctx.lineWidth=1.5;
    for(var r=0;r<4;r++){ctx.save();ctx.rotate(r*Math.PI/2);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(35,0);ctx.stroke();ctx.restore()}
    ctx.restore();
    // 尾梁
    ctx.fillStyle='#1a2535';ctx.fillRect(22,-2,18,4);

    ctx.restore();
  }

  // 右下角准备空降信号
  var sa=Math.max(0,(t-2)*3);
  ctx.fillStyle='rgba(255,100,30,'+sa+')';ctx.font='bold 16px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.fillText('⚠ 准备空降',W*.7,H*.55);
  ctx.fillStyle='rgba(0,255,0,'+sa*.5+')';ctx.font='11px "PingFang SC","Microsoft YaHei",sans-serif';ctx.fillText('INSERTION INBOUND',W*.7,H*.58);

  // 干员剪影(左下)
  for(var s=0;s<3;s++){
    var isa=Math.max(0,(t-1.5+s*.3)*2);
    ctx.fillStyle='rgba(0,0,0,'+isa+')';ctx.fillRect(W*.1+s*40,H*.42-40,20,40);
    ctx.fillStyle='rgba(255,255,255,'+isa*.3+')';ctx.fillRect(W*.1+s*40+2,H*.42-38,16,20);
  }

  // 地图标记
  ctx.strokeStyle='rgba(255,100,30,.4)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(W*.55,H*.3,25+Math.sin(t)*3,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='rgba(255,50,0,.5)';ctx.font='12px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.fillText('DZ',W*.55,H*.3+4);
}

// ==================== 阶段4: 下滑锁动画 ====================
function drawPhase4(t){
  var bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0c1018');bg.addColorStop(1,'#0f1822');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  var cx=W/2,cy=H*.42;

  // 锁定图标
  var lockSz=28+Math.sin(t*3)*2;
  ctx.save();ctx.translate(cx,cy-30);
  ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=2;
  // 锁身
  ctx.fillStyle='rgba(255,255,255,.05)';ctx.fillRect(-lockSz/2,0,lockSz,lockSz*1.3);
  ctx.strokeRect(-lockSz/2,0,lockSz,lockSz*1.3);
  // 锁环
  ctx.beginPath();ctx.arc(0,-lockSz*.15,lockSz*.5,Math.PI,0);ctx.stroke();
  // 钥匙孔
  ctx.fillStyle='rgba(255,255,255,.2)';ctx.beginPath();ctx.arc(0,lockSz*.7,lockSz*.15,0,Math.PI);ctx.fill();
  ctx.restore();

  // "滑动解锁"
  ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='bold 16px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.fillText('滑动解锁出发',W/2,cy+30);
  ctx.fillStyle='rgba(255,255,255,.3)';ctx.font='10px "PingFang SC","Microsoft YaHei",sans-serif';ctx.fillText('SLIDE TO DEPLOY',W/2,cy+46);

  // 滑动条
  var sbx=W/2-120,sby=H*.55,sbw=240,sbh=46;
  ctx.fillStyle='rgba(255,255,255,.06)';ctx.fillRect(sbx,sby,sbw,sbh);
  ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=1;ctx.strokeRect(sbx,sby,sbw,sbh);

  // 当前滑动进度
  var progress=redSliding?redSlideX/sbw:0;
  var kg=ctx.createLinearGradient(sbx,0,sbx+sbw*progress,0);kg.addColorStop(0,'#ff4400');kg.addColorStop(1,'#ff8800');
  ctx.fillStyle=progress>.05?kg:'rgba(255,68,0,.3)';ctx.fillRect(sbx,sby,sbw*progress,sbh);

  // 滑动按钮
  var btnX=sbx+sbw*progress;
  if(btnX>sbx+sbw-16)btnX=sbx+sbw-16;
  if(btnX<sbx+8)btnX=sbx+8;
  ctx.fillStyle='#fff';ctx.fillRect(btnX-8,sby+4,16,sbh-8);
  ctx.fillStyle='#ff4400';ctx.beginPath();ctx.moveTo(btnX-4,sby+sbh/2-5);ctx.lineTo(btnX+5,sby+sbh/2);ctx.lineTo(btnX-4,sby+sbh/2+5);ctx.closePath();ctx.fill();

  // 提示文字
  var ha=1-Math.abs(Math.sin(t*2))*.4;
  ctx.fillStyle='rgba(255,255,255,'+(.4+ha*.3)+')';ctx.font='10px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.fillText('→ 向右滑动 →',W/2,sby+sbh+18);

  // 目标点信息
  ctx.fillStyle='rgba(255,255,255,.2)';ctx.font='9px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.fillText('目标: 零号大坝 · 机密模式',W/2,H*.75);
  ctx.fillText('小队: '+ops[selOp].name+' + 2名队友',W/2,H*.78);
}

// ==================== 阶段5: 撤离动画 ====================
function drawPhase5(t){
  var bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0c1018');bg.addColorStop(.5,'#1a1520');bg.addColorStop(1,'#0d1018');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  // 地面
  var gndY=H*.52;
  ctx.fillStyle='#0d141c';ctx.fillRect(0,gndY,W,H-gndY);

  // 绿色信号烟
  for(var sm=0;sm<3;sm++){
    var smx=W*.35+sm*W*.15,smy=gndY-10+Math.sin(t*2+sm)*8;
    var sga=Math.min(1,t*.5)*.6;
    ctx.save();ctx.globalAlpha=sga;
    ctx.fillStyle='rgba(0,200,50,.15)';ctx.beginPath();
    for(var j=0;j<20;j++){var sa3=j/19*Math.PI;var sr=20+Math.sin(t*3+j)*8;ctx.lineTo(smx+Math.cos(sa3)*sr,smy+Math.sin(sa3)*sr*.4);}
    ctx.closePath();ctx.fill();
    ctx.restore();
  }

  // 撤离直升机(右下)
  var ehx=W*.65+Math.sin(t)*2,ehy=gndY-80+Math.cos(t)*3;
  ctx.save();ctx.translate(ehx,ehy);ctx.scale(.55,.55);ctx.rotate(-0.12);
  // 机身
  ctx.fillStyle='#1a2535';ctx.fillRect(-30,-8,60,16);
  ctx.fillStyle='#0d1520';ctx.fillRect(-12,-14,24,10);
  // 旋翼
  ctx.save();ctx.rotate(t*18);
  ctx.strokeStyle='rgba(200,220,240,.4)';ctx.lineWidth=2;
  for(var r=0;r<4;r++){ctx.save();ctx.rotate(r*Math.PI/2);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(40,0);ctx.stroke();ctx.restore()}
  ctx.restore();
  ctx.fillStyle='#1a2535';ctx.fillRect(27,-4,20,6);
  ctx.restore();

  // 撤离标记(顶角)
  ctx.fillStyle='rgba(0,255,80,.8)';ctx.font='bold 14px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.fillText('✓ 撤离点已激活',W*.35,gndY-60);
  ctx.fillStyle='rgba(0,255,80,.3)';ctx.font='9px "PingFang SC","Microsoft YaHei",sans-serif';ctx.fillText('EXTRACTION ACTIVE',W*.35,gndY-48);

  // 倒计时条
  var extTime=Math.max(0,4-t);
  var ebw=W*.3,ebx=W*.35-ebw/2,eby=gndY-35;
  ctx.fillStyle='rgba(255,255,255,.06)';ctx.fillRect(ebx,eby,ebw,3);
  ctx.fillStyle='#00cc44';ctx.fillRect(ebx,eby,ebw*(extTime/4),3);
  ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='bold 20px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.fillText(Math.ceil(extTime),W*.35,eby-8);

  // 撤离成功字样(后半段)
  if(t>3){
    var sa2=Math.min(1,(t-3)*2);
    ctx.fillStyle='rgba(255,255,255,'+sa2+')';ctx.font='bold 28px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.fillText('撤离成功',W/2,H*.45);
    ctx.fillStyle='rgba(0,200,50,'+sa2*.6+')';ctx.font='12px "PingFang SC","Microsoft YaHei",sans-serif';ctx.fillText('EXTRACTION COMPLETE',W/2,H*.45+20);
  }

  // 小队成功剪影(左下)
  for(var s=0;s<3;s++){
    ctx.fillStyle='rgba(255,255,255,'+Math.min(1,t*.6)*.4+')';ctx.fillRect(W*.1+s*25,gndY-30,16,30);
    ctx.fillStyle='rgba(255,255,255,'+Math.min(1,t*.6)*.2+')';ctx.fillRect(W*.1+s*25+2,gndY-28,12,15);
  }

  // 飞机逐渐上升(如果t>2)
  if(t>2){
    var la=Math.min(1,(t-2)*1.5);
    ctx.fillStyle='rgba(0,0,0,'+la+')';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(255,255,255,'+(la*.8)+')';ctx.font='bold 12px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.fillText('返回准备大厅…',W/2,H*.7);
  }
}

// ========== 全局粒子 ==========
function drawGlobalParticles(phase,t){
  for(var i=0;i<P.length;i++){
    var p=P[i];
    if(t<.5||p.l<=0){var xSource,ySource,type='spark';
      if(phase===0){xSource=W*.4+Math.random()*W*.2;ySource=H*.35}
      else if(phase===1){xSource=W/2;ySource=H*.38}
      else if(phase===3){xSource=W*.2+Math.random()*W*.6;ySource=H*.45}
      else if(phase===4){xSource=W/2;ySource=H*.42}
      else if(phase===5){xSource=W*.35;ySource=H*.5}
      else{xSource=W/2;ySource=H*.4}
      p.x=xSource+Math.random()*100-50;p.y=ySource+Math.random()*30-15;
      p.vx=(Math.random()-.5)*2;p.vy=-Math.random()*3-.5;
      p.l=.5+Math.random()*.6;p.h=phase===5?120+Math.random()*30:20+Math.random()*15;
    }
    p.x+=p.vx;p.y+=p.vy;p.l-=p.d;
    var a2=(p.a||1)*p.l;if(a2<.01)continue;
    ctx.fillStyle='hsla('+p.h+',90%,'+(40+p.l*30)+'%,'+a2+')';
    ctx.fillRect(p.x,p.y,p.s*1.5,p.s*1.5);
  }
}

// ========== 底部阶段指示器 ==========
function drawPhaseIndicator(phase){
  var names=['启动','匹配','选人','空降','解锁','撤离'];
  var dots=6,dr=4,dx=W/2-(dots-1)*dr*3.5,dy=H-24;
  for(var i=0;i<dots;i++){
    ctx.fillStyle=i===phase?'rgba(255,120,30,.8)':'rgba(255,255,255,.15)';
    ctx.beginPath();ctx.arc(dx+i*dr*7,dy,(i===phase?dr+1:dr),0,Math.PI*2);ctx.fill();
  }
  ctx.fillStyle='rgba(255,255,255,.25)';ctx.font='9px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.fillText(names[phase],W/2,dy-12);
}

// 启动
requestAnimationFrame(tick);
</script></body></html>
