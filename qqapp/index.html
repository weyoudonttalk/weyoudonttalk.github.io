<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>QQ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:'PingFang SC','Helvetica Neue',system-ui,-apple-system,sans-serif;background:#f5f6f7;color:#333;-webkit-tap-highlight-color:transparent}

/* ===== LOGIN PAGE ===== */
.login-page{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,#12b7f5 0%,#0d8bcc 40%,#f5f6f7 40%);display:flex;align-items:center;justify-content:center;z-index:100;flex-direction:column}
.login-page[hidden]{display:none}
.login-card{width:88vw;max-width:360px;background:#fff;border-radius:16px;padding:30px 24px;box-shadow:0 8px 30px rgba(0,0,0,0.12);text-align:center}
.login-card .qq-logo{font-size:52px;margin-bottom:4px}
.login-card h2{font-size:20px;font-weight:700;color:#12b7f5;margin-bottom:4px}
.login-card .sub{font-size:11px;color:#999;margin-bottom:20px}
.login-card input{width:100%;padding:14px 16px;border-radius:10px;border:1.5px solid #e8e8e8;font-size:15px;outline:none;margin-bottom:10px;background:#fafafa}
.login-card input:focus{border-color:#12b7f5;background:#fff}
.login-card .login-btn{width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#12b7f5,#0d8bcc);color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:4px;box-shadow:0 4px 15px rgba(18,183,245,0.3)}
.login-card .login-btn:active{transform:scale(0.97)}
.login-card .switch{font-size:12px;color:#12b7f5;margin-top:14px;cursor:pointer}
#loginError{color:#ff4444;font-size:12px;margin-bottom:6px;display:none}

/* ===== MAIN APP ===== */
.app{height:100%;display:flex;flex-direction:column;background:#f5f6f7}
.app[hidden]{display:none}

/* Header */
.app-header{background:linear-gradient(135deg,#12b7f5,#0d8bcc);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;z-index:10;box-shadow:0 2px 8px rgba(18,183,245,0.3)}
.app-header .my-avatar{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.25);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.app-header .my-info{flex:1;min-width:0}
.app-header .my-nick{font-size:15px;font-weight:700}
.app-header .my-sign{font-size:10px;opacity:.75}
.app-header .header-actions{display:flex;gap:14px}
.app-header .header-actions span{font-size:18px;cursor:pointer}

/* Content area */
.app-content{flex:1;overflow:hidden;position:relative}

/* ===== PANELS ===== */
.panel{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;background:#f5f6f7;-webkit-overflow-scrolling:touch}
.panel[hidden]{display:none}

/* ===== MESSAGES PANEL ===== */
.msg-list{padding:4px 0}
.msg-item{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border-bottom:0.5px solid #f0f0f0;cursor:pointer;transition:.1s;position:relative}
.msg-item:active{background:#f5f5f5}
.msg-item .mi-avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.msg-item .mi-info{flex:1;min-width:0}
.msg-item .mi-name{font-size:15px;font-weight:600;color:#333}
.msg-item .mi-preview{font-size:12px;color:#999;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-item .mi-meta{text-align:right;flex-shrink:0}
.msg-item .mi-time{font-size:10px;color:#bbb}
.msg-item .mi-badge{display:inline-block;min-width:18px;height:18px;border-radius:9px;background:#ff4444;color:#fff;font-size:10px;line-height:18px;text-align:center;padding:0 5px;margin-top:4px}
.msg-item .mi-online{width:8px;height:8px;border-radius:50%;background:#0f8;position:absolute;bottom:14px;left:50px;border:2px solid #fff}

/* ===== CONTACTS PANEL ===== */
.contact-group{margin-bottom:4px}
.contact-group-title{padding:10px 16px;font-size:11px;color:#999;font-weight:600;background:#f5f6f7}
.contact-item{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#fff;border-bottom:0.5px solid #f0f0f0;cursor:pointer}
.contact-item:active{background:#f5f5f5}
.contact-item .ci-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.contact-item .ci-name{font-size:15px;color:#333}
.contact-item .ci-sign{font-size:11px;color:#999;margin-top:2px}
.add-contact-btn{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#fff;cursor:pointer;color:#12b7f5;font-weight:600;font-size:14px}
.add-contact-btn:active{background:#f5f5f5}

/* ===== DISCOVER PANEL ===== */
.discover-list{background:#fff}
.disc-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:0.5px solid #f0f0f0;cursor:pointer}
.disc-item:active{background:#f5f5f5}
.disc-item .di-icon{font-size:22px;width:36px;text-align:center}
.disc-item .di-name{font-size:14px;color:#333;flex:1}
.disc-item .di-arrow{color:#ccc;font-size:14px}

/* ===== CHAT PAGE ===== */
.chat-page{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;display:flex;flex-direction:column;background:#f0f0f2}
.chat-page[hidden]{display:none}
.chat-header{display:flex;align-items:center;padding:10px 14px;background:linear-gradient(135deg,#12b7f5,#0d8bcc);color:#fff;gap:10px;flex-shrink:0}
.chat-header .back{font-size:20px;cursor:pointer;width:28px;text-align:center}
.chat-header .ch-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:rgba(255,255,255,0.2)}
.chat-header .ch-info{flex:1;min-width:0}
.chat-header .ch-name{font-size:15px;font-weight:700}
.chat-header .ch-status{font-size:10px;opacity:.8}
.chat-header .ch-actions{display:flex;gap:12px;font-size:18px}
.chat-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.chat-input-area{display:flex;gap:8px;padding:10px 12px;background:#fafafa;border-top:1px solid #e5e5e5;align-items:center;flex-shrink:0}
.chat-input-area .tools-btn{width:32px;height:32px;border-radius:50%;border:none;background:#f0f0f2;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chat-input-area input{flex:1;padding:10px 14px;border-radius:20px;border:1px solid #e0e0e0;background:#fff;font-size:14px;outline:none}
.chat-input-area input:focus{border-color:#12b7f5}
.chat-input-area .send-btn{width:36px;height:36px;border-radius:50%;border:none;background:#12b7f5;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* Chat messages */
.chat-msg{max-width:72%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.5;word-break:break-word;position:relative;animation:cmIn .2s ease}
@keyframes cmIn{from{opacity:0;transform:translateY(6px)}}
.chat-msg.left{align-self:flex-start;background:#fff;color:#333;border-bottom-left-radius:4px}
.chat-msg.right{align-self:flex-end;background:#12b7f5;color:#fff;border-bottom-right-radius:4px}
.chat-msg.system{align-self:center;background:transparent;color:#aaa;font-size:11px;text-align:center;padding:4px 12px;max-width:90%}

/* Bottom nav */
.bottom-nav{display:flex;background:#fff;border-top:0.5px solid #e5e5e5;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 0 6px;font-size:10px;color:#999;cursor:pointer;transition:.2s;gap:3px}
.nav-item .nav-icon{font-size:20px}
.nav-item.active{color:#12b7f5}
.nav-item .nav-badge{position:relative}
.nav-item .nav-dot{position:absolute;top:-2px;right:-6px;width:8px;height:8px;border-radius:50%;background:#ff4444}

/* Add contact modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:200}
.modal-overlay[hidden]{display:none}
.modal-box{width:85vw;max-width:320px;background:#fff;border-radius:16px;padding:24px 20px;text-align:center}
.modal-box h3{font-size:16px;margin-bottom:16px}
.modal-box input{width:100%;padding:12px;border-radius:10px;border:1.5px solid #e0e0e0;font-size:14px;margin-bottom:10px;outline:none}
.modal-box input:focus{border-color:#12b7f5}
.modal-box button{width:100%;padding:12px;border-radius:10px;border:none;background:#12b7f5;color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:8px}
.modal-box button.cancel{background:#f0f0f0;color:#666}
.modal-box button:active{transform:scale(0.97)}

/* Toast */
.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);padding:8px 20px;border-radius:18px;font-size:12px;font-weight:600;z-index:9999;opacity:0;transition:.3s;pointer-events:none;background:rgba(0,0,0,0.85);color:#fff}
.toast.show{opacity:1}

/* Emoji panel */
.emoji-bar{display:flex;gap:4px;padding:4px 12px;overflow-x:auto;background:#fafafa;border-top:1px solid #f0f0f0}
.emoji-bar button{font-size:20px;border:none;background:transparent;cursor:pointer;padding:4px;border-radius:6px;flex-shrink:0}
.emoji-bar button:active{background:#e8e8e8}
</style>
</head>
<body>

<!-- ===== LOGIN PAGE ===== -->
<div class="login-page" id="loginPage">
  <div class="login-card">
    <div class="qq-logo">🐧</div>
    <h2 id="loginTitle">登录QQ</h2>
    <div class="sub" id="loginSub">输入手机号和密码</div>
    <p id="loginError"></p>
    <input type="tel" id="loginPhone" placeholder="QQ号 / 手机号" maxlength="20">
    <input type="password" id="loginPw" placeholder="密码" maxlength="30">
    <button class="login-btn" id="loginBtn" onclick="doLogin()">登 录</button>
    <div class="switch" id="loginSwitch" onclick="toggleLoginMode()">没有账号？立即注册</div>
  </div>
</div>

<!-- ===== MAIN APP ===== -->
<div class="app" id="appMain" hidden>
  <div class="app-header">
    <div class="my-avatar" id="myAvatar">🐧</div>
    <div class="my-info"><div class="my-nick" id="myNick"></div><div class="my-sign" id="mySign">在线</div></div>
    <div class="header-actions">
      <span onclick="doLogout()" title="退出">🔓</span>
    </div>
  </div>

  <div class="app-content">
    <!-- 消息 -->
    <div class="panel" id="panelMessages">
      <div class="msg-list" id="msgList"></div>
    </div>
    <!-- 联系人 -->
    <div class="panel" id="panelContacts" hidden>
      <div id="contactList"></div>
      <div class="add-contact-btn" onclick="showAddContact()">＋ 添加联系人</div>
    </div>
    <!-- 动态 -->
    <div class="panel" id="panelDiscover" hidden>
      <div class="discover-list">
        <div class="disc-item"><span class="di-icon">🖼️</span><span class="di-name">QQ空间</span><span class="di-arrow">›</span></div>
        <div class="disc-item"><span class="di-icon">🎮</span><span class="di-name">游戏中心</span><span class="di-arrow">›</span></div>
        <div class="disc-item"><span class="di-icon">🎵</span><span class="di-name">QQ音乐</span><span class="di-arrow">›</span></div>
        <div class="disc-item"><span class="di-icon">📺</span><span class="di-name">腾讯视频</span><span class="di-arrow">›</span></div>
        <div class="disc-item"><span class="di-icon">🛒</span><span class="di-name">QQ购物</span><span class="di-arrow">›</span></div>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item active" id="nav0" onclick="switchTab(0)"><span class="nav-icon">💬</span>消息</div>
    <div class="nav-item" id="nav1" onclick="switchTab(1)"><span class="nav-icon">👥</span>联系人</div>
    <div class="nav-item" id="nav2" onclick="switchTab(2)"><span class="nav-icon">🎯</span>动态</div>
  </div>
</div>

<!-- ===== CHAT PAGE ===== -->
<div class="chat-page" id="chatPage" hidden>
  <div class="chat-header">
    <span class="back" onclick="closeChat()">‹</span>
    <span class="ch-avatar" id="chAvatar">🐧</span>
    <div class="ch-info"><div class="ch-name" id="chName"></div><div class="ch-status" id="chStatus"></div></div>
    <div class="ch-actions"><span onclick="closeChat()">✕</span></div>
  </div>
  <div class="chat-msgs" id="chatMsgs">
    <div class="chat-msg system">开始聊天吧~</div>
  </div>
  <div class="emoji-bar" id="chatEmojiBar" style="display:none">
    <button onclick="insertChatEmoji('😊')">😊</button><button onclick="insertChatEmoji('😂')">😂</button><button onclick="insertChatEmoji('❤️')">❤️</button><button onclick="insertChatEmoji('👍')">👍</button><button onclick="insertChatEmoji('🔥')">🔥</button><button onclick="insertChatEmoji('🥺')">🥺</button><button onclick="insertChatEmoji('🤣')">🤣</button><button onclick="insertChatEmoji('🫡')">🫡</button><button onclick="insertChatEmoji('😭')">😭</button><button onclick="insertChatEmoji('🎉')">🎉</button><button onclick="insertChatEmoji('💀')">💀</button><button onclick="insertChatEmoji('🤔')">🤔</button>
  </div>
  <div class="chat-input-area">
    <button class="tools-btn" onclick="toggleChatEmoji()">😊</button>
    <input type="text" id="chatInput" placeholder="输入消息..." maxlength="500" onkeydown="if(event.key==='Enter')sendChatMsg()">
    <button class="send-btn" onclick="sendChatMsg()">➤</button>
  </div>
</div>

<!-- ===== ADD CONTACT MODAL ===== -->
<div class="modal-overlay" id="addContactModal" hidden onclick="if(event.target===this)hideAddContact()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <h3>＋ 添加联系人</h3>
    <input type="text" id="addContactId" placeholder="输入对方QQ号">
    <button onclick="doAddContact()">确认添加</button>
    <button class="cancel" onclick="hideAddContact()">取消</button>
  </div>
</div>

<div class="toast" id="toastEl"></div>

<script>
// ====== CONFIG ======
const ACCOUNTS_API='https://jsonblob.com/api/jsonBlob/019fa387-ce7a-7764-81c0-fbf7b93e931b';
const AI_URL='https://oai.endpoints.kepler.ai.cloud.ovh.net/v1/chat/completions';

// ====== STATE ======
let currentUser=null, isRegisterMode=false;
let currentTab=0, activeChatWith=null, chatPollTimer=null;
let lastChatMsgId=0, lastAICall=0;

// Built-in contacts (always available)
const BUILTIN_CONTACTS=[
  {id:'xiaoq',nick:'小Q',avatar:'🤖',sign:'QQ官方AI助手，@我聊天！',online:true,isAI:true},
  {id:'system',nick:'QQ团队',avatar:'🐧',sign:'系统通知',online:true,isSystem:true}
];

// ====== INIT ======
(function(){
  var s=localStorage.getItem('qqapp_user');
  if(s){try{var u=JSON.parse(s);currentUser=u;showApp()}catch(e){}}
})();

// ====== LOGIN ======
function toggleLoginMode(){
  isRegisterMode=!isRegisterMode;
  document.getElementById('loginTitle').textContent=isRegisterMode?'注册QQ':'登录QQ';
  document.getElementById('loginSub').textContent=isRegisterMode?'创建你的QQ账号':'输入手机号和密码';
  document.getElementById('loginBtn').textContent=isRegisterMode?'注 册':'登 录';
  document.getElementById('loginSwitch').textContent=isRegisterMode?'已有账号？立即登录':'没有账号？立即注册';
  document.getElementById('loginError').style.display='none';
}

async function doLogin(){
  var phone=document.getElementById('loginPhone').value.trim();
  var pw=document.getElementById('loginPw').value.trim();
  var err=document.getElementById('loginError');
  if(!phone||!pw){err.style.display='block';err.textContent='请填写完整';return}
  if(phone.length<3){err.style.display='block';err.textContent='QQ号至少3位';return}
  if(pw.length<3){err.style.display='block';err.textContent='密码至少3位';return}
  err.style.display='none';

  try{
    var r=await fetch(ACCOUNTS_API);
    var d=await r.json();
    var accounts=d.accounts||[];
    
    if(isRegisterMode){
      // Check if phone exists
      if(accounts.find(function(a){return a.phone===phone})){
        err.style.display='block';err.textContent='该QQ号已被注册';return;
      }
      var newAcc={phone:phone,password:pw,nick:'用户'+phone.slice(-4),sign:'这个人很懒，什么都没写~',avatar:'🐧',created:new Date().toISOString()};
      accounts.push(newAcc);
      await fetch(ACCOUNTS_API,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({accounts:accounts,room:'qqapp'})});
      currentUser=newAcc;
      localStorage.setItem('qqapp_user',JSON.stringify(newAcc));
      showApp();toast('✅ 注册成功！欢迎加入QQ');
    }else{
      var found=accounts.find(function(a){return a.phone===phone&&a.password===pw});
      if(!found){err.style.display='block';err.textContent='QQ号或密码错误';return}
      currentUser=found;
      localStorage.setItem('qqapp_user',JSON.stringify(found));
      showApp();toast('✅ 登录成功！');
    }
  }catch(e){err.style.display='block';err.textContent='网络错误，请重试'}
}

function doLogout(){
  if(!confirm('确定退出登录？'))return;
  currentUser=null;localStorage.removeItem('qqapp_user');
  document.getElementById('loginPage').hidden=false;document.getElementById('appMain').hidden=true;
  closeChat();
}
function showApp(){
  document.getElementById('loginPage').hidden=true;document.getElementById('appMain').hidden=false;
  document.getElementById('myNick').textContent=currentUser.nick;
  document.getElementById('myAvatar').textContent=currentUser.avatar||'🐧';
  switchTab(0);
}

// ====== TABS ======
function switchTab(n){
  currentTab=n;
  ['panelMessages','panelContacts','panelDiscover'].forEach(function(id,i){document.getElementById(id).hidden=(i!==n)});
  ['nav0','nav1','nav2'].forEach(function(id,i){document.getElementById(id).classList.toggle('active',i===n)});
  if(n===0)renderMsgList();
  if(n===1)renderContactList();
}

// ====== CONTACTS ======
function getMyContacts(){
  var s=localStorage.getItem('qqapp_contacts_'+currentUser.phone);
  return s?JSON.parse(s):[];
}
function saveMyContacts(contacts){
  localStorage.setItem('qqapp_contacts_'+currentUser.phone,JSON.stringify(contacts));
}
function getAllContacts(){
  return BUILTIN_CONTACTS.concat(getMyContacts());
}

function renderContactList(){
  var contacts=getAllContacts();
  var builtin=contacts.filter(function(c){return c.id==='xiaoq'||c.id==='system'});
  var custom=contacts.filter(function(c){return c.id!=='xiaoq'&&c.id!=='system'});
  
  var html='';
  html+='<div class="contact-group"><div class="contact-group-title">★ 特别关注</div>';
  builtin.forEach(function(c){html+=renderContactItem(c)});
  html+='</div>';
  
  if(custom.length>0){
    html+='<div class="contact-group"><div class="contact-group-title">👥 我的好友（'+custom.length+'人）</div>';
    custom.forEach(function(c){html+=renderContactItem(c)});
    html+='</div>';
  }
  
  document.getElementById('contactList').innerHTML=html;
}
function renderContactItem(c){
  var av=c.avatar||'👤';
  return '<div class="contact-item" onclick="openChat(\''+c.id+'\',\''+c.nick+'\',\''+av+'\','+(c.isAI||false)+','+(c.online||false)+')"><div class="ci-avatar">'+av+'</div><div class="ci-name">'+c.nick+(c.online?' <span style="font-size:8px;color:#0f8">●</span>':'')+'</div></div>';
}

function showAddContact(){document.getElementById('addContactModal').hidden=false}
function hideAddContact(){document.getElementById('addContactModal').hidden=true}

async function doAddContact(){
  var id=document.getElementById('addContactId').value.trim();
  if(!id){toast('请输入QQ号');return}
  if(id===currentUser.phone){toast('不能添加自己');return}
  var contacts=getMyContacts();
  if(contacts.find(function(c){return c.id===id})){toast('已在好友列表中');return}
  
  // Fetch account
  try{
    var r=await fetch(ACCOUNTS_API);var d=await r.json();
    var accounts=d.accounts||[];
    var found=accounts.find(function(a){return a.phone===id});
    if(!found){toast('该QQ号不存在');return}
    contacts.push({id:found.phone,nick:found.nick,avatar:found.avatar||'👤',sign:found.sign,online:true});
    saveMyContacts(contacts);
    hideAddContact();
    document.getElementById('addContactId').value='';
    renderContactList();
    renderMsgList();
    toast('✅ 已添加 '+found.nick);
  }catch(e){toast('网络错误');}
}

// ====== MSG LIST ======
function renderMsgList(){
  var contacts=getAllContacts();
  var html='';
  contacts.forEach(function(c){
    var lastMsg=getLastMsg(c.id);
    var preview=lastMsg?lastMsg.text:'点击开始聊天';
    var time=lastMsg?lastMsg.time:'';
    var av=c.avatar||'👤';
    html+='<div class="msg-item" onclick="openChat(\''+c.id+'\',\''+c.nick+'\',\''+av+'\','+(c.isAI||false)+','+(c.online||false)+')"><div class="mi-avatar">'+av+'</div><div class="mi-info"><div class="mi-name">'+c.nick+'</div><div class="mi-preview">'+preview+'</div></div><div class="mi-meta"><div class="mi-time">'+time+'</div></div>'+(c.online?'<div class="mi-online"></div>':'')+'</div>';
  });
  document.getElementById('msgList').innerHTML=html||'<div style="text-align:center;padding:60px 20px;color:#ccc;font-size:14px">暂无消息<br>去联系人添加好友吧~</div>';
}
function getLastMsg(contactId){
  var s=localStorage.getItem('qqapp_chat_'+currentUser.phone+'_'+contactId);
  if(!s)return null;
  try{var msgs=JSON.parse(s);return msgs[msgs.length-1]||null}catch(e){return null}
}

// ====== CHAT ======
function openChat(id,nick,avatar,isAI,online){
  activeChatWith={id:id,nick:nick,avatar:avatar,isAI:!!isAI,online:!!online};
  document.getElementById('chatPage').hidden=false;
  document.getElementById('chName').textContent=nick;
  document.getElementById('chAvatar').textContent=avatar;
  document.getElementById('chStatus').textContent=online?'在线':'离线';
  document.getElementById('chatMsgs').innerHTML='<div class="chat-msg system">你和 '+nick+' 的聊天</div>';
  document.getElementById('chatInput').value='';
  document.getElementById('chatInput').focus();
  loadChatHistory();
  startChatPolling();
}
function closeChat(){
  activeChatWith=null;
  if(chatPollTimer){clearInterval(chatPollTimer);chatPollTimer=null}
  lastChatMsgId=0;
  document.getElementById('chatPage').hidden=true;
  renderMsgList();
}
function loadChatHistory(){
  if(!activeChatWith)return;
  var key='qqapp_chat_'+currentUser.phone+'_'+activeChatWith.id;
  var s=localStorage.getItem(key);
  if(!s)return;
  try{var msgs=JSON.parse(s);msgs.forEach(function(m){renderChatMsg(m,false)});lastChatMsgId=msgs.length>0?msgs[msgs.length-1]._id||0:0}catch(e){}
}
function startChatPolling(){
  if(chatPollTimer)return;
  chatPollTimer=setInterval(function(){
    if(!activeChatWith)return;
    var key='qqapp_chat_'+currentUser.phone+'_'+activeChatWith.id;
    var s=localStorage.getItem(key);
    if(!s)return;
    try{var msgs=JSON.parse(s);var newMsgs=msgs.filter(function(m){return (m._id||0)>lastChatMsgId});
    newMsgs.forEach(function(m){renderChatMsg(m,true)});
    if(newMsgs.length>0)lastChatMsgId=newMsgs[newMsgs.length-1]._id||lastChatMsgId}catch(e){}
  },1500);
}
function renderChatMsg(m,animated){
  var isMe=(m.from===currentUser.phone);
  var cls=isMe?'right':'left';
  var el=document.createElement('div');
  el.className='chat-msg '+cls;
  el.textContent=m.text;
  if(!animated)el.style.animation='none';
  document.getElementById('chatMsgs').appendChild(el);
  document.getElementById('chatMsgs').scrollTop=document.getElementById('chatMsgs').scrollHeight;
}
function saveChatMsg(text,from,to){
  var key='qqapp_chat_'+from+'_'+to;
  var s=localStorage.getItem(key);var msgs=s?JSON.parse(s):[];
  var m={from:from,to:to,text:text,time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),_id:Date.now()};
  msgs.push(m);if(msgs.length>200)msgs=msgs.slice(-150);
  localStorage.setItem(key,JSON.stringify(msgs));
  
  // Also save to receiver's key (if real user, not AI)
  if(to!=='xiaoq'&&to!=='system'){
    var key2='qqapp_chat_'+to+'_'+from;
    var s2=localStorage.getItem(key2);var msgs2=s2?JSON.parse(s2):[];
    var m2=Object.assign({},m,{_id:m._id+1});
    msgs2.push(m2);if(msgs2.length>200)msgs2=msgs2.slice(-150);
    localStorage.setItem(key2,JSON.stringify(msgs2));
  }
}
function sendChatMsg(){
  if(!activeChatWith)return;
  var text=document.getElementById('chatInput').value.trim();
  if(!text)return;
  document.getElementById('chatInput').value='';
  
  saveChatMsg(text,currentUser.phone,activeChatWith.id);
  renderChatMsg({from:currentUser.phone,text:text},true);
  
  // AI response for 小Q
  if(activeChatWith.isAI){
    setTimeout(function(){callAI(text)},500+Math.random()*500);
  }
}
async function callAI(question){
  var msgsEl=document.getElementById('chatMsgs');
  var tid='ai_typing_'+Date.now();
  var thinking=document.createElement('div');thinking.className='chat-msg left';thinking.textContent='...';thinking.id=tid;
  msgsEl.appendChild(thinking);msgsEl.scrollTop=msgsEl.scrollHeight;
  
  var now=Date.now();
  if(now-lastAICall<20000){
    var w=Math.ceil((20000-(now-lastAICall))/1000);
    thinking.textContent='⏳ '+w+'秒后再问~';return;
  }
  try{
    lastAICall=Date.now();
    var resp=await fetch(AI_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'Meta-Llama-3_3-70B-Instruct',messages:[{role:'system',content:'你是小Q，QQ官方AI助手。活泼可爱直接简短，回复2-4句不超过120字。爱用emoji。用户通过QQ和你聊天，亲切自然。'},{role:'user',content:question}],max_tokens:200,temperature:0.85})});
    var t=document.getElementById(tid);if(t)t.remove();
    if(!resp.ok){saveAndRenderAI('AI有点忙 😅 等20秒再找我吧~');return}
    var data=await resp.json();var reply=data.choices&&data.choices[0]?data.choices[0].message.content.trim():'嗯...有点难 😅';
    saveAndRenderAI(reply);
  }catch(e){var t2=document.getElementById(tid);if(t2)t2.remove();saveAndRenderAI('网络不太好 😅 等下再试试~')}
}
function saveAndRenderAI(text){
  saveChatMsg(text,activeChatWith.id,currentUser.phone);
  renderChatMsg({from:activeChatWith.id,text:text},true);
}
function toggleChatEmoji(){
  var bar=document.getElementById('chatEmojiBar');
  bar.style.display=bar.style.display==='none'?'flex':'none';
}
function insertChatEmoji(emoji){
  var input=document.getElementById('chatInput');
  input.value+=emoji;input.focus();
}

// ====== TOAST ======
var tt;
function toast(m){
  var t=document.getElementById('toastEl');t.textContent=m;t.classList.add('show');
  clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show')},2000);
}
</script>
