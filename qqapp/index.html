<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>QQ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:'PingFang SC','Helvetica Neue',system-ui,-apple-system,sans-serif;background:#f5f6f7;color:#333;-webkit-tap-highlight-color:transparent}

.login-page{position:fixed;inset:0;background:linear-gradient(180deg,#12b7f5 0%,#0d8bcc 40%,#f5f6f7 40%);display:flex;align-items:center;justify-content:center;z-index:100;flex-direction:column}
.login-page[hidden]{display:none}
.login-card{width:88vw;max-width:360px;background:#fff;border-radius:16px;padding:30px 24px;box-shadow:0 8px 30px rgba(0,0,0,.12);text-align:center}
.login-card .qq-logo{font-size:52px;margin-bottom:4px}
.login-card h2{font-size:20px;font-weight:700;color:#12b7f5;margin-bottom:4px}
.login-card .sub{font-size:11px;color:#999;margin-bottom:20px}
.login-card input{width:100%;padding:14px 16px;border-radius:10px;border:1.5px solid #e8e8e8;font-size:15px;outline:none;margin-bottom:10px;background:#fafafa}
.login-card input:focus{border-color:#12b7f5}
.login-card .login-btn{width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#12b7f5,#0d8bcc);color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:4px}
.login-card .login-btn:active{transform:scale(.97)}
.login-card .switch{font-size:12px;color:#12b7f5;margin-top:14px;cursor:pointer}
#loginError{color:#f44;font-size:12px;margin-bottom:6px;display:none}

.app{height:100%;display:flex;flex-direction:column;background:#f5f6f7}
.app[hidden]{display:none}
.app-header{background:linear-gradient(135deg,#12b7f5,#0d8bcc);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.app-header .my-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;cursor:pointer;overflow:hidden}
.app-header .my-avatar img{width:100%;height:100%;object-fit:cover}
.app-header .my-info{flex:1;min-width:0;cursor:pointer}
.app-header .my-nick{font-size:15px;font-weight:700}
.app-header .my-sign{font-size:10px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-header .header-actions{display:flex;gap:14px}
.app-header .header-actions span{font-size:18px;cursor:pointer}

.app-content{flex:1;overflow:hidden;position:relative}
.panel{position:absolute;inset:0;overflow-y:auto;background:#f5f6f7;-webkit-overflow-scrolling:touch}
.panel[hidden]{display:none}

.msg-item{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border-bottom:.5px solid #f0f0f0;cursor:pointer;position:relative}
.msg-item:active{background:#f5f5f5}
.msg-item .mi-avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;overflow:hidden}
.msg-item .mi-avatar img{width:100%;height:100%;object-fit:cover}
.msg-item .mi-info{flex:1;min-width:0}
.msg-item .mi-name{font-size:15px;font-weight:600}
.msg-item .mi-preview{font-size:12px;color:#999;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-item .mi-meta{text-align:right}
.msg-item .mi-time{font-size:10px;color:#bbb}
.msg-item .mi-online{width:8px;height:8px;border-radius:50%;background:#0f8;position:absolute;bottom:14px;left:50px;border:2px solid #fff}

.contact-group-title{padding:10px 16px;font-size:11px;color:#999;font-weight:600;background:#f5f6f7}
.contact-item{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#fff;border-bottom:.5px solid #f0f0f0;cursor:pointer}
.contact-item:active{background:#f5f5f5}
.contact-item .ci-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden}
.contact-item .ci-avatar img{width:100%;height:100%;object-fit:cover}
.contact-item .ci-name{font-size:15px}
.add-contact-bar{display:flex;gap:8px;padding:10px 16px;background:#fff}
.add-contact-bar button{flex:1;padding:10px;border-radius:10px;border:1px solid #12b7f5;font-size:12px;font-weight:600;cursor:pointer;background:#fff;color:#12b7f5}
.add-contact-bar button:active{background:#f0f8ff}
.add-contact-bar button.primary{background:#12b7f5;color:#fff}

.discover-list{background:#fff}
.disc-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:.5px solid #f0f0f0;cursor:pointer}
.disc-item:active{background:#f5f5f5}
.disc-item .di-icon{font-size:22px;width:36px;text-align:center}
.disc-item .di-name{font-size:14px;flex:1}
.disc-item .di-arrow{color:#ccc}

/* CHAT */
.chat-page{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:#f0f0f2}
.chat-page[hidden]{display:none}
.chat-header{display:flex;align-items:center;padding:10px 14px;background:linear-gradient(135deg,#12b7f5,#0d8bcc);color:#fff;gap:10px;flex-shrink:0}
.chat-header .back{font-size:20px;cursor:pointer;width:28px;text-align:center}
.chat-header .ch-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:rgba(255,255,255,.2);overflow:hidden}
.chat-header .ch-avatar img{width:100%;height:100%;object-fit:cover}
.chat-header .ch-info{flex:1;min-width:0}
.chat-header .ch-name{font-size:15px;font-weight:700}
.chat-header .ch-status{font-size:10px;opacity:.8}
.chat-header .ch-actions{display:flex;gap:12px;font-size:18px}
.chat-msgs{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.chat-input-area{display:flex;gap:8px;padding:8px 10px;background:#fafafa;border-top:1px solid #e5e5e5;align-items:center;flex-shrink:0}
.chat-input-area button{width:32px;height:32px;border-radius:50%;border:none;background:#f0f0f2;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chat-input-area input{flex:1;padding:10px 14px;border-radius:20px;border:1px solid #e0e0e0;background:#fff;font-size:14px;outline:none}
.chat-input-area input:focus{border-color:#12b7f5}
.chat-input-area .send-btn{background:#12b7f5;color:#fff}
.chat-msg{max-width:72%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.5;word-break:break-word;animation:cmIn .2s ease}
@keyframes cmIn{from{opacity:0;transform:translateY(6px)}}
.chat-msg.left{align-self:flex-start;background:#fff;border-bottom-left-radius:4px}
.chat-msg.right{align-self:flex-end;background:#12b7f5;color:#fff;border-bottom-right-radius:4px}
.chat-msg.system{align-self:center;background:transparent;color:#aaa;font-size:11px;text-align:center;padding:4px 12px;max-width:90%}
.emoji-bar{display:flex;gap:4px;padding:4px 10px;overflow-x:auto;background:#fafafa;border-top:1px solid #f0f0f0}
.emoji-bar button{font-size:20px;border:none;background:transparent;cursor:pointer;padding:3px 4px;border-radius:6px;flex-shrink:0}
.emoji-bar button:active{background:#e8e8e8}

.bottom-nav{display:flex;background:#fff;border-top:.5px solid #e5e5e5;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 0 6px;font-size:10px;color:#999;cursor:pointer;gap:3px}
.nav-item .nav-icon{font-size:20px}
.nav-item.active{color:#12b7f5}

/* SETTINGS */
.settings-page{position:fixed;inset:0;background:#f5f6f7;z-index:60;display:flex;flex-direction:column;overflow-y:auto}
.settings-page[hidden]{display:none}
.set-header{display:flex;align-items:center;padding:12px 14px;background:linear-gradient(135deg,#12b7f5,#0d8bcc);color:#fff;gap:10px;flex-shrink:0}
.set-header .back{font-size:20px;cursor:pointer}
.set-header h3{font-size:16px;flex:1}
.si-profile{padding:24px 16px;background:#fff;text-align:center}
.si-avatar-big{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 10px;background:#f5f6f7;border:2px solid #e0e0e0;overflow:hidden;position:relative}
.si-avatar-big img{width:100%;height:100%;object-fit:cover}
.set-section{margin:12px 0}
.set-section-title{padding:8px 16px;font-size:11px;color:#999;font-weight:600}
.set-item{display:flex;align-items:center;padding:14px 16px;background:#fff;border-bottom:.5px solid #f0f0f0;cursor:pointer;gap:12px}
.set-item:active{background:#f5f5f5}
.set-item .si-icon{font-size:20px;width:28px;text-align:center}
.set-item .si-label{font-size:14px;flex:1}
.set-item .si-val{font-size:13px;color:#999;text-align:right;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.set-item .si-arrow{color:#ccc}
.set-input-item{padding:12px 16px;background:#fff}
.set-input-item label{display:block;font-size:11px;color:#999;margin-bottom:4px}
.set-input-item input,.set-input-item select{width:100%;padding:10px;border-radius:8px;border:1.5px solid #e0e0e0;font-size:14px;outline:none}
.set-input-item input:focus{border-color:#12b7f5}
.set-save-row{padding:16px}
.set-save-row button{width:100%;padding:14px;border-radius:12px;border:none;background:#12b7f5;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.av-grid{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0}
.av-item{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;border:2px solid transparent;background:#f5f6f7;overflow:hidden}
.av-item.selected{border-color:#12b7f5;background:#e0f4ff}
.av-item img{width:100%;height:100%;object-fit:cover}
.av-item.add-btn{font-size:28px;color:#12b7f5;border:2px dashed #12b7f5;background:#f0f8ff}

/* QR MODAL */
.qr-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:200}
.qr-modal[hidden]{display:none}
.qr-box{width:88vw;max-width:340px;background:#fff;border-radius:20px;padding:24px;text-align:center}
.qr-box h3{font-size:16px;margin-bottom:16px}
.qr-box .qr-img-wrap{width:200px;height:200px;margin:0 auto 12px;background:#f5f6f7;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.qr-box .qr-img-wrap img,.qr-box .qr-img-wrap canvas{width:100%;height:100%;object-fit:contain}
.qr-box .qr-uid{font-size:13px;color:#666;margin-bottom:12px}
.qr-box button{width:100%;padding:12px;border-radius:10px;border:none;background:#12b7f5;color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:6px}
.qr-box button.cancel{background:#f0f0f0;color:#666}
.qr-box input{width:100%;padding:12px;border-radius:10px;border:1.5px solid #e0e0e0;font-size:14px;margin-bottom:12px;outline:none;text-align:center}
.qr-box input:focus{border-color:#12b7f5}
.qr-box .qr-tabs{display:flex;margin-bottom:16px;border-radius:10px;overflow:hidden;border:1.5px solid #e0e0e0}
.qr-box .qr-tabs button{flex:1;padding:10px;border:none;background:#fafafa;font-size:13px;cursor:pointer;border-radius:0;color:#666;margin-bottom:0}
.qr-box .qr-tabs button.active{background:#12b7f5;color:#fff}
.qr-box .scan-cam{width:200px;height:200px;margin:0 auto 12px;background:#000;border-radius:8px;overflow:hidden;position:relative}
.qr-box .scan-cam video{width:100%;height:100%;object-fit:cover}
.qr-box .scan-status{font-size:12px;color:#999;margin-bottom:8px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:200}
.modal-overlay[hidden]{display:none}
.modal-box{width:85vw;max-width:320px;background:#fff;border-radius:16px;padding:24px 20px;text-align:center}
.modal-box h3{font-size:16px;margin-bottom:16px}
.modal-box input{width:100%;padding:12px;border-radius:10px;border:1.5px solid #e0e0e0;font-size:14px;margin-bottom:10px;outline:none}
.modal-box input:focus{border-color:#12b7f5}
.modal-box button{width:100%;padding:12px;border-radius:10px;border:none;background:#12b7f5;color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:8px}
.modal-box button.cancel{background:#f0f0f0;color:#666}
.modal-box button:active{transform:scale(.97)}

.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);padding:8px 20px;border-radius:18px;font-size:12px;font-weight:600;z-index:9999;opacity:0;transition:.3s;pointer-events:none;background:rgba(0,0,0,.85);color:#fff}
.toast.show{opacity:1}
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div class="login-page" id="loginPage">
  <div class="login-card">
    <div class="qq-logo">🐧</div>
    <h2 id="loginTitle">登录QQ</h2>
    <p class="sub" id="loginSub">输入手机号和密码</p>
    <p id="loginError"></p>
    <input type="tel" id="loginPhone" placeholder="QQ号" maxlength="20">
    <input type="password" id="loginPw" placeholder="密码" maxlength="30">
    <button class="login-btn" id="loginBtn" onclick="doLogin()">登 录</button>
    <div class="switch" id="loginSwitch" onclick="toggleLoginMode()">没有账号？立即注册</div>
  </div>
</div>

<!-- ===== MAIN APP ===== -->
<div class="app" id="appMain" hidden>
  <div class="app-header">
    <div class="my-avatar" id="myAvatarWrap" onclick="openSettings()">🐧</div>
    <div class="my-info" onclick="openSettings()">
      <div class="my-nick" id="myNick"></div><div class="my-sign" id="mySign">在线</div>
    </div>
    <div class="header-actions">
      <span onclick="openSettings()">⚙️</span>
      <span onclick="doLogout()">🔓</span>
    </div>
  </div>

  <div class="app-content">
    <div class="panel" id="panelMessages"><div class="msg-list" id="msgList"></div></div>
    <div class="panel" id="panelContacts" hidden>
      <div class="add-contact-bar">
        <button class="primary" onclick="showQRMyCode()">📷 我的二维码</button>
        <button onclick="showQRScan()">🔍 扫码添加</button>
      </div>
      <div id="contactList"></div>
      <div style="padding:16px"><button onclick="showAddContact()" style="width:100%;padding:12px;border-radius:12px;border:1px dashed #12b7f5;background:#fff;color:#12b7f5;font-size:14px;cursor:pointer">＋ 手动添加联系人</button></div>
    </div>
    <div class="panel" id="panelDiscover" hidden>
      <div class="discover-list">
        <div class="disc-item"><span class="di-icon">🖼️</span><span class="di-name">QQ空间</span><span class="di-arrow">›</span></div>
        <div class="disc-item"><span class="di-icon">🎮</span><span class="di-name">游戏中心</span><span class="di-arrow">›</span></div>
        <div class="disc-item"><span class="di-icon">🎵</span><span class="di-name">QQ音乐</span><span class="di-arrow">›</span></div>
        <div class="disc-item"><span class="di-icon">📺</span><span class="di-name">腾讯视频</span><span class="di-arrow">›</span></div>
        <div class="disc-item"><span class="di-icon">🛒</span><span class="di-name">QQ购物</span><span class="di-arrow">›</span></div>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item active" id="nav0" onclick="switchTab(0)"><span class="nav-icon">💬</span>消息</div>
    <div class="nav-item" id="nav1" onclick="switchTab(1)"><span class="nav-icon">👥</span>联系人</div>
    <div class="nav-item" id="nav2" onclick="switchTab(2)"><span class="nav-icon">🎯</span>动态</div>
  </div>
</div>

<!-- ===== CHAT ===== -->
<div class="chat-page" id="chatPage" hidden>
  <div class="chat-header">
    <span class="back" onclick="closeChat()">‹</span>
    <span class="ch-avatar" id="chAvatar">🐧</span>
    <div class="ch-info"><div class="ch-name" id="chName"></div><div class="ch-status" id="chStatus"></div></div>
    <div class="ch-actions"><span onclick="closeChat()">✕</span></div>
  </div>
  <div class="chat-msgs" id="chatMsgs"><div class="chat-msg system">开始聊天吧~</div></div>
  <div class="emoji-bar" id="chatEmojiBar" style="display:none">
    <button onclick="insertChatEmoji('😊')">😊</button><button onclick="insertChatEmoji('😂')">😂</button><button onclick="insertChatEmoji('❤️')">❤️</button><button onclick="insertChatEmoji('👍')">👍</button><button onclick="insertChatEmoji('🔥')">🔥</button><button onclick="insertChatEmoji('🥺')">🥺</button><button onclick="insertChatEmoji('🤣')">🤣</button><button onclick="insertChatEmoji('🫡')">🫡</button><button onclick="insertChatEmoji('😭')">😭</button><button onclick="insertChatEmoji('🎉')">🎉</button><button onclick="insertChatEmoji('💀')">💀</button><button onclick="insertChatEmoji('🤔')">🤔</button>
  </div>
  <div class="chat-input-area">
    <button onclick="toggleChatEmoji()">😊</button>
    <input type="text" id="chatInput" placeholder="输入消息..." maxlength="500" onkeydown="if(event.key==='Enter')sendChatMsg()">
    <button class="send-btn" onclick="sendChatMsg()">➤</button>
  </div>
</div>

<!-- ===== SETTINGS ===== -->
<div class="settings-page" id="settingsPage" hidden>
  <div class="set-header">
    <span class="back" onclick="closeSettings()">‹</span><h3>设置</h3>
  </div>
  <div class="si-profile">
    <div class="si-avatar-big" id="setAvatarBig">🐧</div>
    <div style="font-size:16px;font-weight:700;margin-bottom:4px" id="setNick"></div>
    <div style="font-size:11px;color:#999" id="setQQ"></div>
  </div>
  <div class="set-section">
    <div class="set-section-title">个人资料</div>
    <div class="set-item" onclick="toggleAvSelect()"><span class="si-icon">🖼️</span><span class="si-label">更换头像</span><span class="si-arrow">›</span></div>
    <div id="avSelectWrap" style="display:none;padding:12px 16px;background:#fff;border-top:.5px solid #f0f0f0">
      <p style="font-size:12px;color:#999;margin-bottom:8px">选择头像或上传照片：</p>
      <div class="av-grid" id="avGrid"></div>
      <input type="file" id="avFileInput" accept="image/*" style="display:none" onchange="handleAvUpload(this)">
      <button onclick="document.getElementById('avFileInput').click()" style="margin-top:10px;width:100%;padding:10px;border-radius:8px;border:1.5px dashed #12b7f5;background:#f0f8ff;color:#12b7f5;font-size:13px;font-weight:600;cursor:pointer">📸 从相册上传照片</button>
      <button onclick="saveAvatar()" style="margin-top:6px;width:100%;padding:10px;border-radius:8px;border:none;background:#12b7f5;color:#fff;font-size:13px;font-weight:600;cursor:pointer">✅ 保存头像</button>
    </div>
    <div class="set-item" onclick="showEditNick()"><span class="si-icon">✏️</span><span class="si-label">昵称</span><span class="si-val" id="setNickVal"></span><span class="si-arrow">›</span></div>
    <div class="set-item" onclick="showEditSign()"><span class="si-icon">📝</span><span class="si-label">个性签名</span><span class="si-val" id="setSignVal"></span><span class="si-arrow">›</span></div>
  </div>
  <div class="set-section">
    <div class="set-section-title">账号安全</div>
    <div class="set-item" onclick="showChangePw()"><span class="si-icon">🔐</span><span class="si-label">修改密码</span><span class="si-arrow">›</span></div>
    <div class="set-item"><span class="si-icon">📱</span><span class="si-label">绑定手机</span><span class="si-val" id="setPhoneVal"></span></div>
    <div class="set-item" onclick="showQRMyCode()"><span class="si-icon">📷</span><span class="si-label">我的二维码名片</span><span class="si-arrow">›</span></div>
  </div>
  <div id="editNickWrap" style="display:none;margin:0">
    <div class="set-input-item"><label>新昵称</label><input type="text" id="editNickInput" maxlength="16" placeholder="输入新昵称"></div>
    <div class="set-save-row"><button onclick="saveNick()">保存昵称</button></div>
  </div>
  <div id="editSignWrap" style="display:none;margin:0">
    <div class="set-input-item"><label>个性签名</label><input type="text" id="editSignInput" maxlength="30" placeholder="写一句个性签名"></div>
    <div class="set-save-row"><button onclick="saveSign()">保存签名</button></div>
  </div>
  <div id="changePwWrap" style="display:none;margin:0">
    <div class="set-input-item"><label>旧密码</label><input type="password" id="oldPwInput" placeholder="输入旧密码"></div>
    <div class="set-input-item"><label>新密码</label><input type="password" id="newPwInput" placeholder="输入新密码"></div>
    <div class="set-input-item"><label>确认新密码</label><input type="password" id="newPw2Input" placeholder="再次输入新密码"></div>
    <div class="set-save-row"><button onclick="savePw()">修改密码</button></div>
  </div>

// ====== QR CODE (Canvas-based) ======
function generateQRCanvas(data){
  var c=document.getElementById('qrCanvas');var x=c.getContext('2d');
  var size=200,cell=4,margin=4;
  x.fillStyle='#fff';x.fillRect(0,0,size,size);
  x.fillStyle='#000';
  // Simple QR-like pattern using data bytes
  var d=data+'';var bits=[];
  for(var i=0;i<d.length;i++){var b=d.charCodeAt(i);for(var j=7;j>=0;j--)bits.push((b>>j)&1)}
  // Draw as grid (simplified visual QR - actual encoding is complex, this creates a readable pattern)
  var rows=Math.ceil(Math.sqrt(bits.length));
  var startX=(size-rows*cell)/2,startY=(size-rows*cell)/2;
  for(var i=0;i<bits.length;i++){
    var r=Math.floor(i/rows),col=i%rows;
    if(bits[i])x.fillRect(startX+col*cell,startY+r*cell,cell,cell);
  }
  // Draw corner squares for QR look
  var cs=cell*3;
  function drawCorner(sx,sy){
    x.fillStyle='#000';x.fillRect(sx,sy,cs,cs);
    x.fillStyle='#fff';x.fillRect(sx+cell,sy+cell,cell,cell);
  }
  drawCorner(startX-4,startY-4);
  drawCorner(startX+rows*cell-cs-4,startY-4);
  drawCorner(startX-4,startY+rows*cell-cs-4);
  // Title
  x.fillStyle='#666';x.font='10px sans-serif';x.textAlign='center';
  x.fillText('QQ:'+data,size/2,size-6);
}

async function startScan(){
  var el=document.getElementById('scanVideo');var status=document.getElementById('scanStatus');
  status.textContent='📷 正在启动摄像头...';
  try{
    // Try BarcodeDetector first
    if('BarcodeDetector' in window){
      stopScan();
      scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      el.srcObject=scanStream;el.hidden=false;
      status.textContent='📷 对准二维码';
      var detector=new BarcodeDetector({formats:['qr_code']});
      scanTimer=setInterval(async function(){
        try{var codes=await detector.detect(el);
          if(codes.length>0){
            status.textContent='✅ 识别成功！';
            var qq=codes[0].rawValue.replace(/^QQADD:/,'').trim();
            document.getElementById('scanQQInput').value=qq;
            stopScan();
            setTimeout(function(){scanAddFriend()},500);
          }
        }catch(e){}
      },300);
    }else{

      setTimeout(function(){status.textContent='📷 请手动输入QQ号'},2000);
    }

}

}

  try{var msgs=JSON.parse(s);msgs.forEach(function(m){renderChatMsg(m,false)});lastChatMsgId=msgs.length>0?msgs[msgs.length-1]._id||0:0}catch(e){}

function startChatPolling(){
  if(chatPollTimer)return;
  chatPollTimer=setInterval(function(){
    if(!activeChatWith)return;var key='qqappv3m_'+currentUser.phone+'_'+activeChatWith.id;var s=localStorage.getItem(key);if(!s)return;
    try{var msgs=JSON.parse(s);var newMs=msgs.filter(function(m){return (m._id||0)>lastChatMsgId});newMs.forEach(function(m){renderChatMsg(m,true)});if(newMs.length>0)lastChatMsgId=newMs[newMs.length-1]._id||lastChatMsgId}catch(e){}
  },1500);
}
function renderChatMsg(m,animated){
  var isMe=(m.from===currentUser.phone);var el=document.createElement('div');el.className='chat-msg '+(isMe?'right':'left');el.textContent=m.text;
  if(!animated)el.style.animation='none';document.getElementById('chatMsgs').appendChild(el);document.getElementById('chatMsgs').scrollTop=document.getElementById('chatMsgs').scrollHeight;
}
function saveChatMsg(text,from,to){
  var key='qqappv3m_'+from+'_'+to;var s=localStorage.getItem(key);var msgs=s?JSON.parse(s):[];
  var m={from:from,to:to,text:text,time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),_id:Date.now()};
  msgs.push(m);if(msgs.length>200)msgs=msgs.slice(-150);localStorage.setItem(key,JSON.stringify(msgs));
  if(to!=='xiaoq'&&to!=='system'){var key2='qqappv3m_'+to+'_'+from;var s2=localStorage.getItem(key2);var msgs2=s2?JSON.parse(s2):[];var m2=Object.assign({},m,{_id:m._id+1});msgs2.push(m2);if(msgs2.length>200)msgs2=msgs2.slice(-150);localStorage.setItem(key2,JSON.stringify(msgs2))}
}
function sendChatMsg(){
  if(!activeChatWith)return;var text=document.getElementById('chatInput').value.trim();if(!text)return;
  document.getElementById('chatInput').value='';saveChatMsg(text,currentUser.phone,activeChatWith.id);renderChatMsg({from:currentUser.phone,text:text},true);
  if(activeChatWith.isAI)setTimeout(function(){callAI(text,activeChatWith.id)},500+Math.random()*500);
}
async function callAI(question,aiId){
  var isSystemAI=(aiId==='system');
  var systemPrompt=isSystemAI?'你是QQ团队官方账号，处理用户安全/投诉/举报等事务。回复风格：正式、礼貌、专业、简洁。1-3句，不超过100字。开头用「尊敬的QQ用户，」':'你是小Q，QQ官方AI助手。活泼、可爱、直接、简短。回复2-4句，不超过120字。爱用emoji。就像跟朋友聊天一样自然。';
  var msgsEl=document.getElementById('chatMsgs');var tid='ai_typing_'+Date.now();var thinking=document.createElement('div');thinking.className='chat-msg left';thinking.textContent='...';thinking.id=tid;msgsEl.appendChild(thinking);msgsEl.scrollTop=msgsEl.scrollHeight;
  if(Date.now()-lastAICall<20000){var w=Math.ceil((20000-(Date.now()-lastAICall))/1000);thinking.textContent='⏳ '+w+'秒后再问~';return}
  try{lastAICall=Date.now();
    var resp=await fetch(AI_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'Meta-Llama-3_3-70B-Instruct',messages:[{role:'system',content:systemPrompt},{role:'user',content:question}],max_tokens:200,temperature:0.85})});
    var t=document.getElementById(tid);if(t)t.remove();
    if(!resp.ok){saveAndRenderAI('AI有点忙 😅 等20秒再找我吧~',aiId);return}
    var data=await resp.json();var reply=data.choices&&data.choices[0]?data.choices[0].message.content.trim():'嗯...有点难 😅';saveAndRenderAI(reply,aiId)
  }catch(e){var t2=document.getElementById(tid);if(t2)t2.remove();saveAndRenderAI('网络不太好 😅 等下再试试~',aiId)}
}
function saveAndRenderAI(text,aiId){var senderId=aiId||activeChatWith.id;saveChatMsg(text,senderId,currentUser.phone);renderChatMsg({from:senderId,text:text},true)}
function toggleChatEmoji(){var bar=document.getElementById('chatEmojiBar');bar.style.display=bar.style.display==='none'?'flex':'none'}
function insertChatEmoji(emoji){document.getElementById('chatInput').value+=emoji;document.getElementById('chatInput').focus()}

// ====== TOAST ======
var tt;function toast(m){var t=document.getElementById('toastEl');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show')},2000)}
</script>
