<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🔮 暗影地牢 3D · MIUI工作室</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:monospace;touch-action:none}
canvas{display:block}
#ui{position:fixed;top:16px;left:16px;z-index:10;pointer-events:none;color:#fff;font-size:12px;text-shadow:0 0 8px rgba(0,0,0,.8)}
#ui .hp-wrap{width:200px;height:18px;background:rgba(50,10,10,.7);border-radius:9px;overflow:hidden;margin:4px 0;border:1px solid rgba(255,100,100,.3)}
#ui .hp-fill{height:100%;background:linear-gradient(90deg,#ff2222,#ff6600);border-radius:8px;transition:width .4s}
#ui .xp-wrap{width:200px;height:8px;background:rgba(20,20,60,.7);border-radius:4px;overflow:hidden;margin:2px 0}
#ui .xp-fill{height:100%;background:linear-gradient(90deg,#4488ff,#aaccff);border-radius:3px}
#ui .val{color:#ffaa00;font-weight:700;font-size:15px}
#crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;pointer-events:none;color:rgba(255,255,255,.4);font-size:24px}
#msg{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);z-index:10;pointer-events:none;color:#ffaa00;font-size:22px;font-weight:900;text-align:center;text-shadow:0 0 20px rgba(255,170,0,.5);opacity:0;transition:opacity .3s}
#msg.on{opacity:1}
#minimap{position:fixed;bottom:16px;right:16px;z-index:10;pointer-events:none;width:100px;height:100px;background:rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.2);border-radius:8px}
#mobileJoy{display:none;position:fixed;bottom:30px;left:20px;z-index:10;width:100px;height:100px;border-radius:50%;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05)}
#mobileAtk{display:none;position:fixed;bottom:40px;right:30px;z-index:10;width:60px;height:60px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(255,50,50,.2);color:#fff;font-size:26px;text-align:center;line-height:56px}
@media(max-width:768px){#mobileJoy,#mobileAtk{display:block}}
#overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center}
#overlay .box{background:#111122;border:2px solid #333;border-radius:20px;padding:36px 28px;text-align:center;color:#fff;max-width:340px;width:85vw}
#overlay h2{font-size:22px;margin-bottom:8px;color:#ffaa00}
#overlay p{font-size:12px;color:#888;margin-bottom:20px;line-height:1.7}
#overlay button{display:block;width:100%;padding:15px;border-radius:12px;border:none;margin-bottom:8px;font-size:15px;font-weight:700;cursor:pointer;background:#ff6600;color:#fff}
#overlay button.ghost{background:transparent;border:2px solid #444;color:#aaa}
</style>
</head>
<body>
<div id="ui">
  <div class="val" id="lv">Level 1</div>
  <div>HP</div>
  <div class="hp-wrap"><div class="hp-fill" id="hpFill" style="width:100%"></div></div>
  <div>EXP</div>
  <div class="xp-wrap"><div class="xp-fill" id="xpFill" style="width:0%"></div></div>
  <div style="margin-top:4px">Wave <span id="wv">1</span> | Kills <span id="ki">0</span></div>
  <div>Score <span id="sc">0</span></div>
</div>
<div id="crosshair">＋</div>
<div id="msg"></div>
<canvas id="minimap" width="100" height="100"></canvas>
<div id="mobileJoy"></div><div id="mobileAtk">⚔️</div>
<div id="overlay"><div class="box">
  <h2>🔮 暗影地牢 3D</h2>
  <p>MIUI工作室出品<br>WASD移动 · 鼠标瞄准 · 左键攻击<br>消灭敌人 · 升级变强</p>
  <button onclick="startGame()" id="startBtn">🎮 开始游戏</button>
</div></div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>

<script type="module">
import * as THREE from 'three';

// ===== SCENE =====
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0a0a1a);
scene.fog=new THREE.FogExp2(0x0a0a1a,0.0008);

const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.3,200);
camera.position.set(0,1.6,0);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.2;
document.body.appendChild(renderer.domElement);

// ===== LIGHTS =====
const ambient=new THREE.AmbientLight(0x223344,0.6);
scene.add(ambient);

const torchLight=new THREE.PointLight(0xff8844,2,15,1.5);
torchLight.position.set(0,2,0);
torchLight.castShadow=true;
torchLight.shadow.mapSize.set(256,256);
scene.add(torchLight);

// ===== DUNGEON =====
const floorGeo=new THREE.PlaneGeometry(60,60);
const floorMat=new THREE.MeshStandardMaterial({color:0x1a1a2e,roughness:0.9,metalness:0.1});
const floor=new THREE.Mesh(floorGeo,floorMat);
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);

// Floor grid
const gridMat=new THREE.MeshBasicMaterial({color:0x222244});
for(let x=-29;x<=29;x+=2){const g=new THREE.Mesh(new THREE.PlaneGeometry(0.05,60),gridMat);g.rotation.x=-Math.PI/2;g.position.set(x,0.01,0);scene.add(g)}
for(let z=-29;z<=29;z+=2){const g=new THREE.Mesh(new THREE.PlaneGeometry(60,0.05),gridMat);g.rotation.x=-Math.PI/2;g.position.set(0,0.01,z);scene.add(g)}

// Walls
const wallMat=new THREE.MeshStandardMaterial({color:0x2a2a3e,roughness:0.7});
function makeWall(x,y,z,w,h,d){
  const geo=new THREE.BoxGeometry(w,h,d);
  const m=new THREE.Mesh(geo,wallMat);
  m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);
}
// Outer walls
for(let i=-29;i<=29;i+=2){makeWall(i,1.5,-29,2,3,0.3);makeWall(i,1.5,29,2,3,0.3)}
for(let i=-29;i<=29;i+=2){makeWall(-29,1.5,i,0.3,3,2);makeWall(29,1.5,i,0.3,3,2)}

// Pillars
const pillarGeo=new THREE.CylinderGeometry(0.4,0.5,3,8);
const pillarMat=new THREE.MeshStandardMaterial({color:0x3a3a4e,roughness:0.6});
for(let x=-20;x<=20;x+=10)for(let z=-20;z<=20;z+=10){
  if(Math.random()>0.5)continue;
  const p=new THREE.Mesh(pillarGeo,pillarMat);p.position.set(x,1.5,z);p.castShadow=true;p.receiveShadow=true;scene.add(p);
  // Torch on top
  const torchGeo=new THREE.SphereGeometry(0.2,8,8);
  const torchMat2=new THREE.MeshStandardMaterial({color:0xff6600,emissive:0xff4400,emissiveIntensity:2});
  const t=new THREE.Mesh(torchGeo,torchMat2);t.position.set(x,3.1,z);scene.add(t);
  const tl=new THREE.PointLight(0xff8844,1.5,8,2);tl.position.copy(t.position);tl.castShadow=true;scene.add(tl);
}

// ===== PLAYER =====
const playerGroup=new THREE.Group();
const bodyGeo=new THREE.CapsuleGeometry(0.3,0.6,4,8);
const bodyMat=new THREE.MeshStandardMaterial({color:0xffaa00,roughness:0.3,metalness:0.2});
const body=new THREE.Mesh(bodyGeo,bodyMat);body.position.y=1;body.castShadow=true;playerGroup.add(body);
const headGeo=new THREE.SphereGeometry(0.28,8,8);
const headMat=new THREE.MeshStandardMaterial({color:0xffcc44,roughness:0.3});
const head=new THREE.Mesh(headGeo,headMat);head.position.y=1.7;playerGroup.add(head);
// Eyes
const eyeGeo=new THREE.SphereGeometry(0.06,6,6);
const eyeMat=new THREE.MeshStandardMaterial({color:0x000,emissive:0x222,emissiveIntensity:0.5});
const leftEye=new THREE.Mesh(eyeGeo,eyeMat);leftEye.position.set(-0.1,1.76,0.26);playerGroup.add(leftEye);
const rightEye=new THREE.Mesh(eyeGeo,eyeMat);rightEye.position.set(0.1,1.76,0.26);playerGroup.add(rightEye);
// Weapon
const weaponGroup=new THREE.Group();weaponGroup.position.set(0.3,1.3,0.3);
const staffGeo=new THREE.CylinderGeometry(0.04,0.06,1,6);
const staffMat=new THREE.MeshStandardMaterial({color:0x886644});
const staff=new THREE.Mesh(staffGeo,staffMat);staff.position.y=0.5;weaponGroup.add(staff);
const orbGeo=new THREE.SphereGeometry(0.12,8,8);
const orbMat=new THREE.MeshStandardMaterial({color:0xffcc00,emissive:0xff8800,emissiveIntensity:2});
const orb=new THREE.Mesh(orbGeo,orbMat);orb.position.y=1.05;weaponGroup.add(orb);
playerGroup.add(weaponGroup);
scene.add(playerGroup);

let playerHp=100,playerMaxHp=100,playerXp=0,playerXpn=60,playerDmg=25;
let playerSpeed=8,level=1,wave=1,kills=0,score=0;
let playerInvincible=0;
let mouseDown=false;
let yaw=0,pitch=0;
let moveX=0,moveZ=0,jumpHeld=false;
let gameRunning=false;

// ===== ENEMIES =====
const enemies=[];
const enemyTypes=[
  {name:'史莱姆',color:0x44cc44,r:0.4,hp:40,sp:3,sc:10,xp:8,geo:new THREE.SphereGeometry(0.4,8,6)},
  {name:'骷髅',color:0xcccccc,r:0.5,hp:55,sp:3.5,sc:20,xp:15,geo:new THREE.CapsuleGeometry(0.3,0.5,4,6)},
  {name:'蝙蝠',color:0x8844ff,r:0.3,hp:25,sp:5,sc:15,xp:10,geo:new THREE.SphereGeometry(0.3,6,6)},
  {name:'法师',color:0x4488ff,r:0.45,hp:45,sp:2.5,sc:30,xp:20,geo:new THREE.CapsuleGeometry(0.28,0.5,4,6)},
  {name:'魔像',color:0x886644,r:0.7,hp:140,sp:2,sc:50,xp:35,geo:new THREE.BoxGeometry(0.6,0.9,0.6)},
  {name:'恶魔',color:0xff4422,r:0.5,hp:70,sp:3.8,sc:40,xp:28,geo:new THREE.CapsuleGeometry(0.32,0.6,4,6)},
];
const bullets=[],particles=[];

function spawnEnemy(){
  if(enemies.length>15+wave*2)return;
  const t=enemyTypes[Math.min(wave-1,enemyTypes.length-1)];
  const type=enemyTypes[Math.floor(Math.random()*Math.min(wave,enemyTypes.length))];
  const a=Math.random()*Math.PI*2,d=20+Math.random()*8;
  const ex=playerGroup.position.x+Math.cos(a)*d;
  const ez=playerGroup.position.z+Math.sin(a)*d;
  const mat=new THREE.MeshStandardMaterial({color:type.color,roughness:0.5});
  const m=new THREE.Mesh(type.geo,mat);
  m.position.set(ex,type.r,ez);m.castShadow=true;scene.add(m);
  const hp=type.hp*(1+wave*0.15);
  enemies.push({mesh:m,hp, maxHp:hp,dmg:type.hp*0.2+wave,sp:type.sp,sc:type.sc,xp:type.xp,name:type.name,r:type.r,stun:0,shootTimer:Math.random()*60,type:type.name});
}
function spawnParticles(pos,color,count){
  for(let i=0;i<count;i++){
    const geo=new THREE.SphereGeometry(0.04,4,4);
    const mat=new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.8});
    const p=new THREE.Mesh(geo,mat);p.position.copy(pos);
    p.userData={vel:new THREE.Vector3((Math.random()-.5)*3,(Math.random()-.5)*3+1,(Math.random()-.5)*3),life:20+Math.random()*20};
    scene.add(p);particles.push(p);
  }
}

// ===== FLOOR MARKERS (enemy spawn indicators) =====
const markers=[];
for(let i=0;i<30;i++){
  const geo=new THREE.RingGeometry(0.8,1,32);
  const mat=new THREE.MeshBasicMaterial({color:0xff0000,side:THREE.DoubleSide,transparent:true,opacity:0.15});
  const r=new THREE.Mesh(geo,mat);r.rotation.x=-Math.PI/2;
  r.position.set((Math.random()-.5)*40,0.02,(Math.random()-.5)*40);
  scene.add(r);markers.push(r);
}

// ===== INPUT =====
const keys={};
document.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(e.key===' '){e.preventDefault();jumpHeld=true}
});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.key===' ')jumpHeld=false});
document.addEventListener('mousemove',e=>{
  if(!gameRunning)return;
  yaw-=e.movementX*0.002;
  pitch-=e.movementY*0.002;
  pitch=Math.max(-1.2,Math.min(0.6,pitch));
});
document.addEventListener('mousedown',e=>{if(e.button===0)mouseDown=true});
document.addEventListener('mouseup',e=>{if(e.button===0)mouseDown=false});
document.addEventListener('contextmenu',e=>e.preventDefault());

// Mobile
const joyEl=document.getElementById('mobileJoy');
let joyActive=false,joyId=null,joyCX=0,joyCY=0,joyDX=0,joyDY=0;
let lookActive=false,lookId=null,lx=0,ly=0;
joyEl.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];joyId=t.identifier;const r=joyEl.getBoundingClientRect();joyCX=r.left+r.width/2;joyCY=r.top+r.height/2;joyActive=true});
joyEl.addEventListener('touchmove',e=>{e.preventDefault();for(let i=0;i<e.touches.length;i++)if(e.touches[i].identifier===joyId){const dx=e.touches[i].clientX-joyCX,dy=e.touches[i].clientY-joyCY;const d=Math.min(40,Math.hypot(dx,dy))/40;const a=Math.atan2(dy,dx);joyDX=Math.cos(a)*d;joyDY=Math.sin(a)*d;break}});
joyEl.addEventListener('touchend',()=>{joyActive=false;joyDX=0;joyDY=0});
document.addEventListener('touchstart',e=>{
  for(let i=0;i<e.touches.length;i++){const el=document.elementFromPoint(e.touches[i].clientX,e.touches[i].clientY);if(el&&(el.closest('#mobileJoy')||el.closest('#mobileAtk')))continue;lookId=e.touches[i].identifier;lx=e.touches[i].clientX;ly=e.touches[i].clientY;lookActive=true;break}
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!lookActive)return;
  for(let i=0;i<e.touches.length;i++)if(e.touches[i].identifier===lookId){const dx=e.touches[i].clientX-lx,dy=e.touches[i].clientY-ly;yaw-=dx*0.005;pitch-=dy*0.005;pitch=Math.max(-1.2,Math.min(0.6,pitch));lx=e.touches[i].clientX;ly=e.touches[i].clientY;break}
},{passive:true});
document.addEventListener('touchend',()=>{lookActive=false});
document.getElementById('mobileAtk').addEventListener('touchstart',e=>{e.preventDefault();mouseDown=true});
document.getElementById('mobileAtk').addEventListener('touchend',()=>{mouseDown=false});

// Pointer lock
renderer.domElement.addEventListener('click',()=>{if(gameRunning)renderer.domElement.requestPointerLock()});
document.addEventListener('pointerlockchange',()=>{});

// ===== ATTACK =====
let atkCd=0;
function playerAttack(){
  if(atkCd>0)return;
  atkCd=Math.max(3,18);
  const dir=new THREE.Vector3(0,0,-1);
  dir.applyQuaternion(camera.quaternion);
  // Create projectile
  const geo=new THREE.SphereGeometry(0.08,6,6);
  const mat=new THREE.MeshBasicMaterial({color:0xffcc00});
  const b=new THREE.Mesh(geo,mat);
  b.position.copy(camera.position).add(dir.clone().multiplyScalar(0.6));
  b.userData={vel:dir.clone().multiplyScalar(20),life:60,dmg:playerDmg};
  scene.add(b);bullets.push(b);
  // Weapon flash
  orb.material.emissiveIntensity=4;
  setTimeout(()=>{orb.material.emissiveIntensity=2},100);
}

function damageEnemy(enemy,val,idx){
  enemy.hp-=val;
  spawnParticles(enemy.mesh.position,enemy.mesh.material.color.getHex(),4);
  if(enemy.hp<=0){
    spawnParticles(enemy.mesh.position,enemy.mesh.material.color.getHex(),20);
    score+=enemy.sc;kills++;playerHp=Math.min(playerMaxHp,playerHp+5);
    playerXp+=enemy.xp;
    scene.remove(enemy.mesh);
    enemies.splice(idx,1);
  }
}
function damagePlayer(val){
  if(playerInvincible>0)return;
  playerHp-=val;playerInvincible=15;
  // Flash red
  body.material.color.set(0xff0000);
  setTimeout(()=>{body.material.color.set(0xffaa00)},150);
  if(playerHp<=0){playerHp=0;die()}
}

function die(){
  gameRunning=false;
  document.exitPointerLock();
  document.getElementById('overlay').style.display='flex';
  document.querySelector('#overlay h2').textContent='💀 你倒下了';
  document.querySelector('#overlay p').textContent='Wave '+wave+' · Score '+score+' · Kills '+kills;
  const btn=document.querySelector('#overlay button');btn.textContent='🔄 重新开始';btn.onclick=startGame;
}

function levelUp(){
  level++;
  playerHp=playerMaxHp;playerMaxHp+=20;
  playerDmg+=8;
  spawnParticles(playerGroup.position,0xffcc00,30);
  msg('🎉 Level Up! '+level,2000);
}

// ===== GAME LOOP =====
let spawnTimer=0,waveTimer=0;
const clock=new THREE.Clock();

function update(dt){
  if(!gameRunning)return;
  if(dt>0.2)dt=0.2;
  if(playerInvincible>0)playerInvincible--;
  if(atkCd>0)atkCd--;

  // Movement
  let mx=0,mz=0;
  if(keys['w']||keys['arrowup'])mz=-1;
  if(keys['s']||keys['arrowdown'])mz=1;
  if(keys['a']||keys['arrowleft'])mx=-1;
  if(keys['d']||keys['arrowright'])mx=1;
  if(joyActive){mx=joyDX;mz=-joyDY}
  if(mx||mz){const l=Math.hypot(mx,mz);mx/=l;mz/=l}

  // Camera rotation
  const euler=new THREE.Euler(pitch,yaw,0,'YXZ');
  camera.quaternion.setFromEuler(euler);

  // Move forward direction
  const forward=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);forward.y=0;forward.normalize();
  const right=new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);right.y=0;right.normalize();
  const vel=forward.clone().multiplyScalar(mz*playerSpeed*dt).add(right.clone().multiplyScalar(mx*playerSpeed*dt));

  const newX=playerGroup.position.x+vel.x,newZ=playerGroup.position.z+vel.z;
  // Boundary
  if(Math.abs(newX)<28)playerGroup.position.x=newX;
  if(Math.abs(newZ)<28)playerGroup.position.z=newZ;

  // Update camera + torch
  camera.position.copy(playerGroup.position).add(new THREE.Vector3(0,1.6,0));
  torchLight.position.copy(camera.position).add(new THREE.Vector3(0,0.3,0));

  // Attack
  if(mouseDown)playerAttack();

  // Wave management
  waveTimer++;
  const maxEnemies=8+wave*3;
  if(enemies.length<maxEnemies){
    spawnTimer++;
    if(spawnTimer>Math.max(10,35-wave)){spawnTimer=0;spawnEnemy()}
  }
  if(waveTimer>600&&enemies.length===0){waveTimer=0;spawnTimer=0;wave++;msg('⚔️ Wave '+wave+'!',1500)}

  // XP
  if(playerXp>=playerXpn){playerXp-=playerXpn;playerXpn+=40;levelUp()}

  // Update enemies
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(e.stun>0){e.stun--;continue}
    const dx=playerGroup.position.x-e.mesh.position.x;
    const dz=playerGroup.position.z-e.mesh.position.z;
    const dist=Math.hypot(dx,dz)||1;
    e.mesh.position.x+=dx/dist*e.sp*dt;
    e.mesh.position.z+=dz/dist*e.sp*dt;
    e.mesh.position.y=e.r;
    if(dist<e.r+0.5&&playerInvincible<=0)damagePlayer(e.dmg*dt);
    // Wizard shoot
    if(e.type==='法师'){e.shootTimer--;if(e.shootTimer<=0){e.shootTimer=90;const a=Math.atan2(dz,dx);const bGeo=new THREE.SphereGeometry(0.06,4,4);const bMat=new THREE.MeshBasicMaterial({color:0x4488ff});const b=new THREE.Mesh(bGeo,bMat);b.position.copy(e.mesh.position);b.userData={vel:new THREE.Vector3(Math.cos(a)*6,0,Math.sin(a)*6),life:80,dmg:e.dmg*0.5,enemy:true};scene.add(b);bullets.push(b)}}
    // Enemy bob animation
    e.mesh.position.y=e.r+Math.sin(Date.now()*0.005+e.mesh.position.x)*0.1;
  }

  // Update bullets
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.position.add(b.userData.vel.clone().multiplyScalar(dt));
    b.userData.life--;
    if(b.userData.life<=0||Math.abs(b.position.x)>35||Math.abs(b.position.z)>35){scene.remove(b);bullets.splice(i,1);continue}
    if(b.userData.enemy){
      if(b.position.distanceTo(playerGroup.position)<0.6){damagePlayer(b.userData.dmg);scene.remove(b);bullets.splice(i,1)}
    }else{
      let hit=false;
      for(let j=enemies.length-1;j>=0;j--){
        if(b.position.distanceTo(enemies[j].mesh.position)<enemies[j].r+0.2){damageEnemy(enemies[j],b.userData.dmg,j);hit=true;break}
      }
      if(hit){scene.remove(b);bullets.splice(i,1)}
    }
  }

  // Update particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.position.add(p.userData.vel.clone().multiplyScalar(dt));p.userData.vel.y-=2*dt;p.userData.life--;
    if(p.userData.life<=0){scene.remove(p);particles.splice(i,1)}
  }

  // HUD
  document.getElementById('hpFill').style.width=Math.max(0,Math.min(100,playerHp/playerMaxHp*100))+'%';
  document.getElementById('xpFill').style.width=Math.max(0,Math.min(100,playerXp/playerXpn*100))+'%';
  document.getElementById('lv').textContent='Level '+level;
  document.getElementById('wv').textContent=wave;
  document.getElementById('ki').textContent=kills;
  document.getElementById('sc').textContent=score;

  // Minimap
  const mm=document.getElementById('minimap');
  const mctx=mm.getContext('2d');
  mctx.fillStyle='rgba(0,0,0,.7)';mctx.fillRect(0,0,100,100);
  mctx.fillStyle='#ffaa00';mctx.fillRect(50-2,50-2,4,4);
  enemies.forEach(e=>{
    const ex=50+(e.mesh.position.x-playerGroup.position.x)*2.5;
    const ez=50+(e.mesh.position.z-playerGroup.position.z)*2.5;
    mctx.fillStyle='#'+e.mesh.material.color.getHexString();
    mctx.fillRect(ex-1,ez-1,3,3);
  });

  // Rotate markers
  markers.forEach(m=>{m.rotation.z+=0.01});
}

function render(){renderer.render(scene,camera)}

function loop(t){
  requestAnimationFrame(loop);
  const dt=clock.getDelta();
  update(dt);
  render();
}

// ===== START =====
function startGame(){
  playerHp=100;playerMaxHp=100;playerXp=0;playerXpn=60;playerDmg=25;
  level=1;wave=1;kills=0;score=0;playerSpeed=8;
  playerInvincible=0;atkCd=0;spawnTimer=0;waveTimer=0;
  yaw=0;pitch=0;

  // Clear enemies
  enemies.forEach(e=>scene.remove(e.mesh));enemies.length=0;
  bullets.forEach(b=>scene.remove(b));bullets.length=0;
  particles.forEach(p=>scene.remove(p));particles.length=0;

  playerGroup.position.set(0,0,0);
  camera.position.set(0,1.6,0);

  // Spawn initial
  for(let i=0;i<5;i++)spawnEnemy();

  gameRunning=true;
  document.getElementById('overlay').style.display='none';
  renderer.domElement.requestPointerLock();
  msg('🗡️ 消灭所有敌人！',2000);
}

function msg(text,duration){
  const el=document.getElementById('msg');el.textContent=text;el.classList.add('on');
  setTimeout(()=>el.classList.remove('on'),duration);
}

// ===== INIT =====
window.addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});

// Prevent scroll on mobile
document.addEventListener('touchmove',e=>{if(e.target===renderer.domElement)e.preventDefault()},{passive:false});

// Start loop
requestAnimationFrame(loop);

window.startGame=startGame;
</script>
</body>
