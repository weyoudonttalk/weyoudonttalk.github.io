<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🔮 暗影地牢 · MIUI工作室</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a14;overflow:hidden;display:flex;align-items:center;justify-content:center;height:100vh;font-family:monospace}
canvas{display:block;border:2px solid #1a1a30;border-radius:8px}
#ui{position:fixed;top:0;left:0;right:0;pointer-events:none;z-index:10;padding:12px 16px;color:#fff;font-size:13px;display:flex;justify-content:space-between;align-items:flex-start}
#ui .left{text-align:left}
#ui .right{text-align:right}
#ui .hp-bar{width:160px;height:14px;background:#331111;border-radius:7px;overflow:hidden;margin:4px 0}
#ui .hp-fill{height:100%;background:linear-gradient(90deg,#ff3333,#ff6633);border-radius:7px;transition:width .3s}
#ui .xp-bar{width:160px;height:8px;background:#111133;border-radius:4px;overflow:hidden;margin:2px 0}
#ui .xp-fill{height:100%;background:linear-gradient(90deg,#3388ff,#88bbff);border-radius:4px;transition:width .3s}
#ui .boss-bar{width:200px;height:10px;background:#331111;border-radius:5px;overflow:hidden;margin-top:4px;display:none}
#ui .boss-fill{height:100%;background:linear-gradient(90deg,#ff0000,#ff4400);border-radius:5px}
#ui .label{font-size:10px;opacity:.7;letter-spacing:1px}
#ui .value{font-size:16px;font-weight:700;color:#ffaa00}
#msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;pointer-events:none;color:#ffaa00;font-size:24px;font-weight:900;text-align:center;text-shadow:0 0 20px rgba(255,170,0,.5);opacity:0;transition:opacity .3s}
#msg.show{opacity:1}
#pauseBg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:30}
#pauseBg.show{display:flex}
#pauseBg .box{background:#12122a;border:2px solid #333;border-radius:16px;padding:32px 28px;text-align:center;color:#fff}
#pauseBg h2{font-size:22px;margin-bottom:16px;color:#ffaa00}
#pauseBg button{display:block;width:100%;padding:14px;border-radius:10px;border:none;margin-bottom:8px;font-size:15px;font-weight:700;cursor:pointer;background:#ff6600;color:#fff}
#pauseBg button:hover{background:#ff8800}
#pauseBg button.ghost{background:transparent;border:2px solid #444;color:#aaa}
.mobile{display:none;position:fixed;bottom:20px;left:0;right:0;z-index:10;pointer-events:none}
.mobile .joy{position:absolute;bottom:20px;left:20px;width:100px;height:100px;border-radius:50%;border:2px solid rgba(255,255,255,.2);pointer-events:auto}
.mobile .btns{position:absolute;bottom:30px;right:20px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}
.mobile .btns button{width:50px;height:50px;border-radius:50%;border:2px solid rgba(255,255,255,.2);background:rgba(0,0,0,.4);color:#fff;font-size:20px}
@media(max-width:768px){.mobile{display:block}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div class="left">
    <div class="value" id="level">Level 1</div>
    <div class="label">HP</div>
    <div class="hp-bar"><div class="hp-fill" id="hpFill" style="width:100%"></div></div>
    <div class="label">EXP</div>
    <div class="xp-bar"><div class="xp-fill" id="xpFill" style="width:0%"></div></div>
    <div class="value" id="score" style="font-size:12px;color:#fff">Score: 0</div>
  </div>
  <div class="right">
    <div class="value" id="wave">Wave 1</div>
    <div class="label">击杀</div>
    <div class="value" id="kills" style="font-size:14px;color:#fff">0</div>
    <div class="boss-bar" id="bossBar"><div class="boss-fill" id="bossFill" style="width:100%"></div></div>
    <div class="label" id="bossLabel" style="display:none">👑 BOSS</div>
  </div>
</div>
<div id="msg"></div>
<div id="pauseBg"><div class="box"><h2 id="pauseTitle">⏸️ 暂停</h2><button id="pauseBtn1">继续游戏</button><button class="ghost" id="pauseBtn2">返回大厅</button></div></div>
<div class="mobile" id="mobileControls">
  <div class="joy" id="joy"></div>
  <div class="btns"><button id="atkBtn">⚔️</button></div>
</div>

<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const W=800,H=600;
canvas.width=W;canvas.height=H;

// ============ STATE ============
let gameState='playing'; // playing | paused | dead | levelup
let level=1,wave=1,score=0,kills=0;
let playerHp=100,playerMaxHp=100,playerXp=0,playerXpToNext=50;
let playerX=W/2,playerY=H/2,playerSpeed=4,playerR=16;
let playerDmg=25,playerAtkSpeed=12,atkCooldown=0;
let playerInvincible=0;
let enemies=[],bullets=[],particles=[],items=[];
let mouseX=W/2,mouseY=H/2,mouseDown=false;
let keys={w:false,a:false,s:false,d:false,ArrowUp:false,ArrowDown:false,ArrowLeft:false,ArrowRight:false};
let waveTimer=0,spawnTimer=0,bossActive=false,boss=null;
let gameTime=0;
let cameraX=0,cameraY=0;
let pendingUpgrades=[];
let upgradeChoices=[];

// Mobile
let joyActive=false,joyId=null,joyCX=0,joyCY=0,joyDX=0,joyDY=0;

// ============ UPGRADE SYSTEM ============
const UPGRADES=[
  {name:'生命+30',desc:'最大生命值永久增加30',apply:()=>{playerMaxHp+=30;playerHp+=30}},
  {name:'攻击+10',desc:'攻击力永久增加10',apply:()=>{playerDmg+=10}},
  {name:'攻速+2',desc:'攻击速度永久增加',apply:()=>{playerAtkSpeed+=2}},
  {name:'移速+1',desc:'移动速度永久增加1',apply:()=>{playerSpeed+=1}},
  {name:'吸血5%',desc:'击杀回复5%生命',apply:()=>{playerLifesteal=(playerLifesteal||0)+0.05}},
  {name:'护盾',desc:'获得20点临时护盾',apply:()=>{playerShield=(playerShield||0)+20}},
  {name:'暴击10%',desc:'10%几率造成双倍伤害',apply:()=>{playerCrit=(playerCrit||0)+0.1}},
  {name:'三连射',desc:'每次攻击发射3发子弹',apply:()=>{playerMultishot=(playerMultishot||1)+2}},
];
let playerLifesteal=0,playerShield=0,playerCrit=0,playerMultishot=1;

// ============ ENEMY TYPES ============
const ENEMIES={
  slime:{r:14,hp:30,dmg:8,speed:1.3,color:'#44cc44',score:10,xp:8,name:'史莱姆'},
  skeleton:{r:16,hp:50,dmg:12,speed:1.6,color:'#cccccc',score:20,xp:12,name:'骷髅兵'},
  bat:{r:12,hp:20,dmg:6,speed:2.2,color:'#8844cc',score:15,xp:10,name:'蝙蝠'},
  wizard:{r:16,hp:40,dmg:15,speed:1.2,color:'#6688ff',score:30,xp:18,name:'法师'},
  golem:{r:22,hp:100,dmg:20,speed:.8,color:'#886644',score:50,xp:30,name:'石魔像'},
};
const BOSSES=[
  {r:40,hp:400,dmg:25,speed:1.8,color:'#ff2200',name:'🔥 炎魔',atkType:'charge'},
  {r:36,hp:500,dmg:20,speed:1.4,color:'#ff44ff',name:'💜 暗影法师',atkType:'shoot'},
  {r:44,hp:600,dmg:30,speed:1.1,color:'#ff8800',name:'🧡 巨石领主',atkType:'spawn'},
];

// ============ SPAWN ============
function getWaveEnemyCount(){return 5+wave*3}
function getWaveTypes(){
  if(wave<=3)return ['slime'];
  if(wave<=6)return ['slime','skeleton','bat'];
  if(wave<=9)return ['skeleton','bat','wizard'];
  return ['skeleton','bat','wizard','golem'];
}

function spawnEnemy(){
  const types=getWaveTypes();
  const type=types[Math.floor(Math.random()*types.length)];
  const e=ENEMIES[type];
  let ex,ey;
  const side=Math.floor(Math.random()*4);
  if(side===0){ex=-30;ey=Math.random()*H}
  else if(side===1){ex=W+30;ey=Math.random()*H}
  else if(side===2){ex=Math.random()*W;ey=-30}
  else{ex=Math.random()*W;ey=H+30}
  enemies.push({x:ex,y:ey,r:e.r,hp:e.hp,maxHp:e.hp,dmg:e.dmg,speed:e.speed,color:e.color,type,score:e.score,xp:e.xp,name:e.name,targetX:0,targetY:0,stunTimer:0,shootTimer:Math.random()*60});
}

function spawnBoss(){
  const b=BOSSES[Math.min(level-1,BOSSES.length-1)];
  boss={x:W/2,y:-60,r:b.r,hp:b.hp,maxHp:b.hp,dmg:b.dmg,speed:b.speed,color:b.color,name:b.name,atkType:b.atkType,targetX:0,targetY:0,stunTimer:0,shootTimer:0};
  bossActive=true;
  document.getElementById('bossBar').style.display='block';
  document.getElementById('bossLabel').style.display='block';
  showMsg(b.name+' 出现了！',1500);
}

// ============ PARTICLES ============
function spawnParticles(x,y,color,count){
  for(let i=0;i<count;i++){
    const angle=Math.random()*Math.PI*2;
    const speed=1+Math.random()*3;
    particles.push({
      x,y,color,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,
      life:15+Math.random()*15,r:2+Math.random()*3
    });
  }
}
function spawnItem(x,y){
  if(Math.random()<.3){
    items.push({x,y,type:'hp',life:300,r:10,color:'#ff6666',value:15});
  }else if(Math.random()<.5){
    items.push({x,y,type:'xp',life:300,r:8,color:'#88bbff',value:1});
  }
}

// ============ PLAYER ATTACK ============
function playerAttack(){
  if(atkCooldown>0)return;
  atkCooldown=20-playerAtkSpeed;
  const angle=Math.atan2(mouseY-playerY,mouseX-playerX);
  for(let i=0;i<playerMultishot;i++){
    const spread=(i-(playerMultishot-1)/2)*.12;
    bullets.push({
      x:playerX,y:playerY,vx:Math.cos(angle+spread)*8,vy:Math.sin(angle+spread)*8,
      dmg:playerDmg,r:4,color:'#ffcc00',life:80
    });
  }
}

// ============ DAMAGE ============
function damagePlayer(dmg){
  if(playerInvincible>0)return;
  if(playerShield>0){
    if(playerShield>=dmg){playerShield-=dmg;return}
    dmg-=playerShield;playerShield=0;
  }
  playerHp-=dmg;
  playerInvincible=15;
  if(playerHp<=0){playerHp=0;die()}
}
function damageEnemy(enemy,dmg,i){
  enemy.hp-=dmg;
  enemy.stunTimer=8;
  spawnParticles(enemy.x,enemy.y,enemy.color,3);
  if(enemy.hp<=0){
    spawnParticles(enemy.x,enemy.y,enemy.color,12);
    if(enemy===boss){killBoss();return}
    spawnItem(enemy.x,enemy.y);
    score+=enemy.score;
    kills++;
    playerXp+=enemy.xp;
    if(playerLifesteal)playerHp=Math.min(playerMaxHp,playerHp+enemy.maxHp*playerLifesteal);
    enemies.splice(i,1);
  }
}
function killBoss(){
  spawnParticles(boss.x,boss.y,boss.color,30);
  for(let j=0;j<5;j++)spawnItem(boss.x+Math.random()*40-20,boss.y+Math.random()*40-20);
  score+=200;
  kills++;
  playerXp+=50;
  boss=null;bossActive=false;
  document.getElementById('bossBar').style.display='none';
  document.getElementById('bossLabel').style.display='none';
  levelUp();
}
function levelUp(){
  level++;
  wave=1;
  playerHp=playerMaxHp;
  playerShield=0;
  enemies=[];bullets=[];items=[];
  boss=null;bossActive=false;
  gameState='levelup';
  const choices=[];
  const pool=[...UPGRADES];
  for(let i=0;i<3;i++){
    const idx=Math.floor(Math.random()*pool.length);
    choices.push(pool.splice(idx,1)[0]);
  }
  upgradeChoices=choices;
  showLevelUpUI(choices);
}

function showLevelUpUI(choices){
  const bg=document.getElementById('pauseBg');
  bg.classList.add('show');
  document.getElementById('pauseTitle').textContent='🎉 Level Up! 选择升级';
  const p1=document.getElementById('pauseBtn1');
  const p2=document.getElementById('pauseBtn2');
  p1.textContent=choices[0]?.name||'';
  p2.textContent=choices[1]?.name||'';
  p2.className='ghost';
  // Add 3rd choice
  const p3=document.createElement('button');
  p3.className='ghost';p3.textContent=choices[2]?.name||'';p3.onclick=()=>{choices[2].apply();closeLevelUp()};
  p2.after(p3);
  p1.onclick=()=>{choices[0].apply();closeLevelUp()};
  p2.onclick=()=>{choices[1].apply();closeLevelUp()};
}

function closeLevelUp(){
  gameState='playing';
  document.getElementById('pauseBg').classList.remove('show');
  // Clean extra buttons
  const bg=document.getElementById('pauseBg');
  const btns=bg.querySelectorAll('button');
  if(btns.length>2)btns[2].remove();
}

function die(){
  gameState='dead';
  document.getElementById('pauseBg').classList.add('show');
  document.getElementById('pauseTitle').textContent='💀 你阵亡了';
  document.getElementById('pauseBtn1').textContent='重新开始';
  document.getElementById('pauseBtn1').onclick=restartGame;
  document.getElementById('pauseBtn2').textContent='返回菜单';
  document.getElementById('pauseBtn2').onclick=()=>{location.reload()};
}

function restartGame(){
  level=1;wave=1;score=0;kills=0;
  playerHp=100;playerMaxHp=100;playerXp=0;playerXpToNext=50;
  playerX=W/2;playerY=H/2;playerSpeed=4;
  playerDmg=25;playerAtkSpeed=12;playerShield=0;playerCrit=0;playerLifesteal=0;playerMultishot=1;
  enemies=[];bullets=[];particles=[];items=[];
  boss=null;bossActive=false;
  gameState='playing';
  document.getElementById('pauseBg').classList.remove('show');
}

// ============ UPDATE ============
function update(){
  if(gameState!=='playing')return;
  gameTime++;
  if(playerInvincible>0)playerInvincible--;
  if(atkCooldown>0)atkCooldown--;

  // Player movement
  let mx=0,my=0;
  if(keys.w||keys.ArrowUp)my=-1;
  if(keys.s||keys.ArrowDown)my=1;
  if(keys.a||keys.ArrowLeft)mx=-1;
  if(keys.d||keys.ArrowRight)mx=1;
  if(mx||my){const l=Math.sqrt(mx*mx+my*my);mx/=l;my/=l}
  if(joyActive){mx=joyDX;my=joyDY}
  playerX+=mx*playerSpeed;playerY+=my*playerSpeed;
  playerX=Math.max(playerR,Math.min(W-playerR,playerX));
  playerY=Math.max(playerR,Math.min(H-playerR,playerY));

  // Auto-attack with mouse held or mobile
  if(mouseDown){playerAttack()}

  // XP level up
  if(playerXp>=playerXpToNext){playerXp-=playerXpToNext;playerXpToNext+=25;levelUp()}

  // Wave management
  if(!bossActive){
    waveTimer++;
    if(enemies.length===0&&waveTimer>120){
      wave++;
      waveTimer=0;
      spawnTimer=0;
      if(wave%5===0)spawnBoss();
      else showMsg('Wave '+wave,1000);
    }
    if(!bossActive&&enemies.length<getWaveEnemyCount()+wave){
      spawnTimer++;
      if(spawnTimer>Math.max(20,50-wave)){
        spawnTimer=0;
        spawnEnemy();
      }
    }
  }

  // Enemies
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(e.stunTimer>0){e.stunTimer--;continue}
    const dx=playerX-e.x,dy=playerY-e.y;
    const dist=Math.sqrt(dx*dx+dy*dy)||1;
    e.x+=dx/dist*e.speed;
    e.y+=dy/dist*e.speed;
    e.x=Math.max(e.r,Math.min(W-e.r,e.x));
    e.y=Math.max(e.r,Math.min(H-e.r,e.y));
    if(dist<e.r+playerR&&playerInvincible<=0)damagePlayer(e.dmg);
    if(e.type==='wizard'){e.shootTimer--;if(e.shootTimer<=0){e.shootTimer=90;const a=Math.atan2(dy,dx);bullets.push({x:e.x,y:e.y,vx:Math.cos(a)*4,vy:Math.sin(a)*4,dmg:e.dmg,r:5,color:'#6688ff',life:120,isEnemy:true})}}
  }

  // Boss
  if(bossActive&&boss){
    const dx=playerX-boss.x,dy=playerY-boss.y;
    const dist=Math.sqrt(dx*dx+dy*dy)||1;
    boss.x+=dx/dist*boss.speed;
    boss.y+=dy/dist*boss.speed;
    if(dist<boss.r+playerR)damagePlayer(boss.dmg);
    if(boss.atkType==='shoot'){boss.shootTimer--;if(boss.shootTimer<=0){boss.shootTimer=40;for(let a=0;a<Math.PI*2;a+=Math.PI/4){bullets.push({x:boss.x,y:boss.y,vx:Math.cos(a)*3,vy:Math.sin(a)*3,dmg:boss.dmg*.5,r:6,color:boss.color,life:150,isEnemy:true})}}}
    if(boss.atkType==='spawn'&&Math.random()<.01)spawnEnemy();
    document.getElementById('bossFill').style.width=(boss.hp/boss.maxHp*100)+'%';
  }

  // Bullets
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx;b.y+=b.vy;b.life--;
    if(b.life<=0||b.x<-20||b.x>W+20||b.y<-20||b.y>H+20){bullets.splice(i,1);continue}
    if(b.isEnemy){
      if(Math.hypot(b.x-playerX,b.y-playerY)<playerR+5){damagePlayer(b.dmg);bullets.splice(i,1);continue}
    }else{
      for(let j=enemies.length-1;j>=0;j--){
        if(Math.hypot(b.x-enemies[j].x,b.y-enemies[j].y)<enemies[j].r+b.r){
          let dmg=b.dmg;
          if(playerCrit&&Math.random()<playerCrit)dmg*=2;
          damageEnemy(enemies[j],dmg,j);bullets.splice(i,1);break;
        }
      }
      if(bullets[i]&&bossActive&&boss&&Math.hypot(b.x-boss.x,b.y-boss.y)<boss.r+b.r){
        let dmg=b.dmg;if(playerCrit&&Math.random()<playerCrit)dmg*=2;
        boss.hp-=dmg;spawnParticles(b.x,b.y,boss.color,3);
        if(boss.hp<=0)killBoss();
        bullets.splice(i,1);
      }
    }
  }

  // Items
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];it.life--;
    if(it.life<=0){items.splice(i,1);continue}
    if(Math.hypot(it.x-playerX,it.y-playerY)<playerR+it.r+10){
      if(it.type==='hp'){playerHp=Math.min(playerMaxHp,playerHp+it.value);spawnParticles(it.x,it.y,'#ff6666',5)}
      if(it.type==='xp'){playerXp+=it.value;spawnParticles(it.x,it.y,'#88bbff',3)}
      items.splice(i,1);
    }
  }

  // Particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life--;
    if(p.life<=0)particles.splice(i,1);
  }

  // Update HUD
  document.getElementById('level').textContent='Level '+level;
  document.getElementById('wave').textContent='Wave '+wave;
  document.getElementById('score').textContent='Score: '+score;
  document.getElementById('kills').textContent=kills;
  document.getElementById('hpFill').style.width=(playerHp/playerMaxHp*100)+'%';
  document.getElementById('xpFill').style.width=(playerXp/playerXpToNext*100)+'%';
}

// ============ RENDER ============
function render(){
  ctx.clearRect(0,0,W,H);
  // Grid background
  ctx.strokeStyle='#111122';ctx.lineWidth=1;
  for(let x=0;x<W;x+=40)for(let y=0;y<H;y+=40){ctx.strokeRect(x,y,40,40)}


  // Items
  items.forEach(it=>{
    ctx.fillStyle=it.color;ctx.globalAlpha=.7+Math.sin(gameTime*.1+it.x)*.3;
    ctx.beginPath();ctx.arc(it.x,it.y,it.r,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  });

  // Enemies
  enemies.forEach(e=>{
    ctx.fillStyle=e.color;
    ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.stroke();
    // HP bar
    const bw=e.r*2;ctx.fillStyle='#333';ctx.fillRect(e.x-bw/2,e.y-e.r-10,bw,4);
    ctx.fillStyle='#ff3333';ctx.fillRect(e.x-bw/2,e.y-e.r-10,bw*(e.hp/e.maxHp),4);
    // Wizard hat
    if(e.type==='wizard'){ctx.fillStyle='#4466cc';ctx.beginPath();ctx.moveTo(e.x,e.y-e.r);ctx.lineTo(e.x-8,e.y-e.r-14);ctx.lineTo(e.x+8,e.y-e.r-14);ctx.fill()}
  });

  // Boss
  if(bossActive&&boss){
    ctx.fillStyle=boss.color;ctx.shadowColor=boss.color;ctx.shadowBlur=20;
    ctx.beginPath();ctx.arc(boss.x,boss.y,boss.r,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 14px monospace';ctx.textAlign='center';
    ctx.fillText(boss.name,boss.x,boss.y-boss.r-16);
  }

  // Player
  ctx.fillStyle=playerInvincible>0?'rgba(255,255,255,'+(playerInvincible%4<2?'.8':'.3')+')':'#ffaa00';
  ctx.beginPath();ctx.arc(playerX,playerY,playerR,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();
  // Shield
  if(playerShield>0){ctx.strokeStyle='rgba(100,200,255,.4)';ctx.lineWidth=4;ctx.beginPath();ctx.arc(playerX,playerY,playerR+6,0,Math.PI*2);ctx.stroke()}
  // Weapon direction
  const aimAngle=Math.atan2(mouseY-playerY,mouseX-playerX);
  ctx.strokeStyle='#fff';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(playerX+Math.cos(aimAngle)*playerR,playerY+Math.sin(aimAngle)*playerR);
  ctx.lineTo(playerX+Math.cos(aimAngle)*(playerR+14),playerY+Math.sin(aimAngle)*(playerR+14));
  ctx.stroke();
  ctx.fillStyle='#ffcc00';ctx.beginPath();ctx.arc(playerX+Math.cos(aimAngle)*(playerR+16),playerY+Math.sin(aimAngle)*(playerR+16),5,0,Math.PI*2);ctx.fill();

  // Crosshair
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(mouseX,mouseY,enemies.some(e=>Math.hypot(e.x-mouseX,e.y-mouseY)<e.r)||(boss&&Math.hypot(boss.x-mouseX,boss.y-mouseY)<boss.r)?10:6,0,Math.PI*2);ctx.stroke();

  // Bullets
  bullets.forEach(b=>{
    ctx.fillStyle=b.color;ctx.shadowColor=b.color;ctx.shadowBlur=6;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  });

  // Particles
  particles.forEach(p=>{
    ctx.fillStyle=p.color;ctx.globalAlpha=p.life/30;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  });
}

// ============ GAME LOOP ============
function gameLoop(){
  update();
  render();
  requestAnimationFrame(gameLoop);
}

// ============ INPUT ============
document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(keys.hasOwnProperty(k)){keys[k]=true;e.preventDefault()}
  if(e.key==='Escape'){if(gameState==='playing'){gameState='paused';showPause()}else if(gameState==='paused'){gameState='playing';document.getElementById('pauseBg').classList.remove('show')}}
  if(e.key===' '||e.key==='j')mouseDown=true;
});
document.addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();
  if(keys.hasOwnProperty(k)){keys[k]=false}
  if(e.key===' '||e.key==='j')mouseDown=false;
});
canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();mouseX=(e.clientX-r.left)*(W/r.width);mouseY=(e.clientY-r.top)*(H/r.height)});
canvas.addEventListener('mousedown',e=>{e.preventDefault();mouseDown=true});
canvas.addEventListener('mouseup',()=>{mouseDown=false});
canvas.addEventListener('mouseleave',()=>{mouseDown=false});

function showPause(){
  const bg=document.getElementById('pauseBg');
  bg.classList.add('show');
  document.getElementById('pauseTitle').textContent='⏸️ 暂停';
  document.getElementById('pauseBtn1').textContent='继续游戏';
  document.getElementById('pauseBtn1').onclick=()=>{gameState='playing';bg.classList.remove('show')};
  document.getElementById('pauseBtn2').textContent='重新开始';
  document.getElementById('pauseBtn2').onclick=()=>{bg.classList.remove('show');restartGame()};
  // Clean extra buttons
  const btns=bg.querySelectorAll('button');
  while(btns.length>2)btns[btns.length-1].remove();
}

// MOBILE CONTROLS
const joyEl=document.getElementById('joy');
joyEl.addEventListener('touchstart',e=>{
  e.preventDefault();const t=e.touches[0];joyId=t.identifier;
  const r=joyEl.getBoundingClientRect();joyCX=r.left+r.width/2;joyCY=r.top+r.height/2;joyActive=true;
});
joyEl.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(let i=0;i<e.touches.length;i++)if(e.touches[i].identifier===joyId){
    const dx=e.touches[i].clientX-joyCX,dy=e.touches[i].clientY-joyCY;
    const dist=Math.min(40,Math.sqrt(dx*dx+dy*dy))/40;
    const a=Math.atan2(dy,dx);joyDX=Math.cos(a)*dist;joyDY=Math.sin(a)*dist;
    break;
  }
});
joyEl.addEventListener('touchend',()=>{joyActive=false;joyDX=0;joyDY=0});
document.getElementById('atkBtn').addEventListener('touchstart',e=>{e.preventDefault();mouseDown=true;playerAttack()});
document.getElementById('atkBtn').addEventListener('touchend',()=>{mouseDown=false});

function showMsg(text,duration){
  const el=document.getElementById('msg');
  el.textContent=text;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),duration);
}

// ============ START ============
showMsg('🗡️ 消灭所有敌人！',2000);
spawnEnemy();spawnEnemy();
gameLoop();
</script>
