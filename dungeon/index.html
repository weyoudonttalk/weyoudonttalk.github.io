<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🔮 暗影地牢 · MIUI工作室</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:monospace}
canvas{display:block}
#ui{position:fixed;top:0;left:0;right:0;pointer-events:none;z-index:10;padding:14px 18px;color:#fff;font-size:13px;display:flex;justify-content:space-between}
#ui .left{text-align:left}
#ui .right{text-align:right}
.hp-bar{width:180px;height:16px;background:#330f0f;border-radius:8px;overflow:hidden;margin:4px 0;border:1px solid #441111}
.hp-fill{height:100%;background:linear-gradient(90deg,#ff2222,#ff5500);border-radius:7px;transition:width .4s}
.xp-bar{width:180px;height:10px;background:#0f0f33;border-radius:5px;overflow:hidden;margin:2px 0}
.xp-fill{height:100%;background:linear-gradient(90deg,#3388ff,#88bbff);border-radius:4px;transition:width .4s}
.boss-wrap{display:none;margin-top:4px}
.boss-wrap .boss-bar{width:220px;height:12px;background:#330f0f;border-radius:6px;overflow:hidden;border:1px solid #660000}
.boss-fill{height:100%;background:linear-gradient(90deg,#ff0000,#ff4400);border-radius:5px}
.label{font-size:10px;opacity:.6;letter-spacing:1px;text-transform:uppercase}
.value{font-size:15px;font-weight:700;color:#ffaa00}
#msg{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);z-index:20;pointer-events:none;color:#ffaa00;font-size:28px;font-weight:900;text-align:center;text-shadow:0 0 30px rgba(255,170,0,.5);opacity:0;transition:opacity .4s;white-space:nowrap}
#msg.show{opacity:1}
#damage{position:fixed;top:35%;left:50%;transform:translate(-50%,-50%);z-index:20;pointer-events:none;color:#ff3333;font-size:40px;font-weight:900;opacity:0;transition:opacity .1s;text-shadow:0 0 20px rgba(255,0,0,.7)}
#pauseBg{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:30}
#pauseBg.show{display:flex}
#pauseBg .box{background:#12122a;border:2px solid #333;border-radius:20px;padding:36px 30px;text-align:center;color:#fff;max-width:340px;width:85vw}
#pauseBg h2{font-size:24px;margin-bottom:18px;color:#ffaa00}
#pauseBg button{display:block;width:100%;padding:15px;border-radius:12px;border:none;margin-bottom:8px;font-size:15px;font-weight:700;cursor:pointer;background:#ff6600;color:#fff;transition:.2s}
#pauseBg button:hover{background:#ff8800}
#pauseBg button.ghost{background:transparent;border:2px solid #444;color:#aaa}
#pauseBg button.ghost:hover{border-color:#ff6600;color:#ff6600}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div class="left">
    <div class="value" id="level">Level 1</div>
    <div class="label">HP</div>
    <div class="hp-bar"><div class="hp-fill" id="hpFill" style="width:100%"></div></div>
    <div class="label">EXP</div>
    <div class="xp-bar"><div class="xp-fill" id="xpFill" style="width:0%"></div></div>
    <div style="color:#fff;font-size:10px;margin-top:2px">Score: <span id="score">0</span></div>
  </div>
  <div class="right">
    <div class="value" id="wave">Wave 1</div>
    <div class="label">Kills</div>
    <div style="color:#fff;font-size:16px" id="kills">0</div>
    <div class="boss-wrap" id="bossWrap">
      <div class="label">👑 BOSS</div>
      <div class="boss-bar"><div class="boss-fill" id="bossFill" style="width:100%"></div></div>
    </div>
  </div>
</div>
<div id="msg"></div><div id="damage"></div>
<div id="pauseBg"><div class="box">
  <h2 id="pauseTitle">⏸️ 暂停</h2>
  <div id="upgradeDesc" style="font-size:12px;color:#aaa;margin-bottom:12px;display:none"></div>
  <button id="pauseBtn1">继续游戏</button>
  <button class="ghost" id="pauseBtn2">返回</button>
</div></div>

<script>
const c=document.getElementById('game'),x=c.getContext('2d');
const W=1280,H=720;
c.width=W;c.height=H;

// ===== STATE =====
let gs='playing',lv=1,wv=1,sc=0,ki=0,gT=0;
let px=W/2,py=H/2,psp=5,pR=18,pHp=100,pMaxHp=100,pXp=0,pXpn=60;
let pDmg=30,pAtkSpd=14,atkCd=0,pInv=0,pShd=0,pCrit=0,pLs=0,pMulti=1,pBolt=0;
let en=[],bl=[],pt=[],it=[],mx=W/2,my=H/2,md=false;
let keys={};
let wt=0,st=0,bsA=false,bs=null;
let dmgFlash=0;

// ===== ENEMIES =====
const EN={
  slime:{r:16,hp:40,sp:1.4,c:'#44cc44',sc:10,xp:10,n:'史莱姆'},
  skele:{r:18,hp:60,sp:1.8,c:'#cccccc',sc:20,xp:15,n:'骷髅兵'},
  bat:{r:13,hp:25,sp:2.6,c:'#8844ff',sc:15,xp:12,n:'蝙蝠'},
  wiz:{r:17,hp:45,sp:1.3,c:'#4488ff',sc:30,xp:20,n:'法师'},
  golem:{r:24,hp:130,sp:0.9,c:'#886644',sc:50,xp:35,n:'石魔像'},
  ghost:{r:15,hp:35,sp:1.5,c:'#aaddff',sc:25,xp:18,n:'幽灵'},
  spider:{r:14,hp:28,sp:2.0,c:'#664488',sc:18,xp:13,n:'蜘蛛'},
  demon:{r:20,hp:80,sp:1.8,c:'#ff4422',sc:40,xp:28,n:'恶魔'},
  archer:{r:16,hp:40,sp:1.4,c:'#88aa44',sc:35,xp:22,n:'弓箭手'},
  bomb:{r:22,hp:90,sp:1.1,c:'#ff8800',sc:45,xp:30,n:'炸弹人'},
};
const BS=['slime','skele','bat','wiz','golem','ghost','spider','demon','archer','bomb'];

// ===== BOSS TYPES =====
const BOSS_TYPES=[
  {r:48,hp:600,sp:2.0,c:'#ff2200',n:'🔥 炎魔',atk:'charge'},
  {r:40,hp:700,sp:1.6,c:'#ff44ff',n:'💜 暗影法师',atk:'shoot'},
  {r:52,hp:900,sp:1.2,c:'#ff8800',n:'🧡 巨石领主',atk:'spawn'},
  {r:44,hp:800,sp:1.9,c:'#00ff88',n:'💚 毒龙',atk:'poison'},
  {r:50,hp:1100,sp:1.5,c:'#ffff00',n:'💛 雷霆之王',atk:'lightning'},
];

// ===== UPGRADES =====
const UPGRADES=[
  {n:'❤️ 生命+40',a:()=>{pMaxHp+=40;pHp+=40}},
  {n:'⚔️ 攻击+12',a:()=>{pDmg+=12}},
  {n:'⚡ 攻速+3',a:()=>{pAtkSpd+=3}},
  {n:'🏃 移速+1.5',a:()=>{psp+=1.5}},
  {n:'🩸 吸血8%',a:()=>{pLs+=0.08}},
  {n:'🛡️ 护盾+25',a:()=>{pShd+=25}},
  {n:'💥 暴击12%',a:()=>{pCrit+=0.12}},
  {n:'🔱 散射+2',a:()=>{pMulti+=2}},
  {n:'⚡ 连锁闪电',a:()=>{pBolt+=1}},
  {n:'💪 伤害+25%',a:()=>{pDmg=Math.floor(pDmg*1.25)}},
  {n:'🏹 弹速+50%',a:()=>{bl.forEach(b=>{b.vx*=1.5;b.vy*=1.5})}},
  {n:'🔥 燃烧子弹',a:()=>{pBurn=(pBurn||0)+1}},
];
let pBurn=0;

// ===== SPAWN =====
function waveTypes(){
  if(wv<=3)return ['slime'];
  if(wv<=6)return ['slime','skele','bat'];
  if(wv<=9)return ['skele','bat','wiz','spider'];
  if(wv<=12)return ['skele','bat','wiz','golem','ghost'];
  if(wv<=16)return ['bat','wiz','golem','ghost','demon','archer'];
  return BS;
}
function spEn(){
  const t=waveTypes(),ty=t[Math.floor(Math.random()*t.length)],e=EN[ty];
  let ex,ey;
  const s=Math.floor(Math.random()*4);
  if(s===0){ex=-40;ey=Math.random()*H}
  else if(s===1){ex=W+40;ey=Math.random()*H}
  else if(s===2){ex=Math.random()*W;ey=-40}
  else{ex=Math.random()*W;ey=H+40}
  const hp=e.hp*(1+wv*0.15);
  en.push({x:ex,y:ey,r:e.r,hp,maxHp:hp,dmg:e.hp*0.25+wv,sp:e.sp*(1+wv*0.03),c:e.c,ty,sc:e.sc,xp:e.xp,n:e.n,stun:0,sht:Math.random()*80});
}
function spBoss(){
  const b=BOSS_TYPES[Math.min(lv-1,BOSS_TYPES.length-1)];
  bs={x:W/2,y:-80,r:b.r,hp:b.hp,maxHp:b.hp,dmg:b.hp*0.04,sp:b.sp,c:b.c,n:b.n,atk:b.atk,sht:0};
  bsA=true;
  document.getElementById('bossWrap').style.display='block';
  msg(b.n+' 降临了！⚡',2000);
}

// ===== PARTICLES & ITEMS =====
function spPt(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=2+Math.random()*4;pt.push({x,y,c,vx:Math.cos(a)*s,vy:Math.sin(a)*s,lf:20+Math.random()*20,r:2+Math.random()*4})}}
function spIt(x,y){
  if(Math.random()<0.35)it.push({x,y,t:'hp',lf:350,r:12,c:'#ff5555',v:20});
  if(Math.random()<0.45)it.push({x,y,t:'xp',lf:350,r:9,c:'#88bbff',v:3+wv});
  if(Math.random()<0.08)it.push({x,y,t:'shield',lf:350,r:11,c:'#66ccff',v:15});
  if(Math.random()<0.05)it.push({x,y,t:'speed',lf:200,r:10,c:'#ffff44',v:1.5});
}

// ===== ATTACK =====
function pAtk(){
  if(atkCd>0)return;
  atkCd=Math.max(4,22-pAtkSpd);
  const a=Math.atan2(my-py,mx-px);
  for(let i=0;i<pMulti;i++){
    const sp=(i-(pMulti-1)/2)*.14;
    bl.push({x:px,y:py,vx:Math.cos(a+sp)*9,vy:Math.sin(a+sp)*9,dmg:pDmg,r:5,c:'#ffcc00',lf:90});
  }
}

// ===== DAMAGE =====
function dmgP(v){
  if(pInv>0)return;
  if(pShd>0){if(pShd>=v){pShd-=v;return}v-=pShd;pShd=0}
  pHp-=v;pInv=12;dmgFlash=8;
  document.getElementById('damage').textContent='-'+Math.floor(v);
  document.getElementById('damage').style.opacity='1';
  setTimeout(()=>document.getElementById('damage').style.opacity='0',200);
  if(pHp<=0){pHp=0;die()}
}
function dmgE(e,val,i){
  e.hp-=val;e.stun=6;
  spPt(e.x,e.y,e.c,3);
  if(e===bs){
    document.getElementById('bossFill').style.width=(e.hp/e.maxHp*100)+'%';
    if(e.hp<=0){killBoss();return}
    return;
  }
  if(e.hp<=0){
    spPt(e.x,e.y,e.c,14);
    spIt(e.x,e.y);
    sc+=e.sc;ki++;pXp+=e.xp;
    if(pLs)pHp=Math.min(pMaxHp,pHp+e.maxHp*pLs);
    en.splice(i,1);
  }
}
function killBoss(){
  spPt(bs.x,bs.y,bs.c,40);
  for(let j=0;j<8;j++)spIt(bs.x+(Math.random()-.5)*60,bs.y+(Math.random()-.5)*60);
  sc+=300;ki++;pXp+=80;
  bs=null;bsA=false;
  document.getElementById('bossWrap').style.display='none';
  levelUp();
}
function levelUp(){
  lv++;wv=1;pHp=pMaxHp;pShd=0;en=[];bl=[];it=[];bs=null;bsA=false;
  gs='levelup';
  const ch=[];const pool=[...UPGRADES];
  for(let i=0;i<3;i++){const idx=Math.floor(Math.random()*pool.length);ch.push(pool.splice(idx,1)[0])}
  showUpgradeUI(ch);
}
function showUpgradeUI(ch){
  const bg=document.getElementById('pauseBg');bg.classList.add('show');
  document.getElementById('pauseTitle').textContent='🎉 Level '+lv+' · 选择强化';
  document.getElementById('upgradeDesc').style.display='block';
  document.getElementById('upgradeDesc').textContent=ch.map((c,i)=>(i+1)+'. '+c.n).join('  ');
  const b1=document.getElementById('pauseBtn1'),b2=document.getElementById('pauseBtn2');
  b1.textContent='1. '+ch[0].n;b1.onclick=()=>{ch[0].a();closeUp()};
  b2.textContent='2. '+ch[1].n;b2.className='';b2.onclick=()=>{ch[1].a();closeUp()};
  const b3=document.createElement('button');b3.className='ghost';b3.textContent='3. '+ch[2].n;
  b3.onclick=()=>{ch[2].a();closeUp()};b2.after(b3);
}
function closeUp(){gs='playing';document.getElementById('pauseBg').classList.remove('show');const btns=document.querySelectorAll('#pauseBg button');for(let i=btns.length-1;i>=2;i--)btns[i].remove()}
function die(){
  gs='dead';
  const bg=document.getElementById('pauseBg');bg.classList.add('show');
  document.getElementById('pauseTitle').textContent='💀 你倒下了';
  document.getElementById('upgradeDesc').style.display='block';
  document.getElementById('upgradeDesc').textContent='Wave '+wv+' · Score '+sc+' · Kills '+ki;
  document.getElementById('pauseBtn1').textContent='🔄 重新开始';document.getElementById('pauseBtn1').onclick=restart;
  document.getElementById('pauseBtn2').textContent='🏠 回首页';document.getElementById('pauseBtn2').onclick=()=>{location.reload()};
  const btns=document.querySelectorAll('#pauseBg button');for(let i=btns.length-1;i>=2;i--)btns[i].remove();
}
function restart(){
  lv=1;wv=1;sc=0;ki=0;pHp=100;pMaxHp=100;pXp=0;pXpn=60;
  px=W/2;py=H/2;psp=5;pDmg=30;pAtkSpd=14;pShd=0;pCrit=0;pLs=0;pMulti=1;pBolt=0;pBurn=0;
  en=[];bl=[];pt=[];it=[];bs=null;bsA=false;
  gs='playing';
  document.getElementById('pauseBg').classList.remove('show');
  spEn();spEn();
}

// ===== UPDATE =====
function upd(){
  if(gs!=='playing')return;
  gT++;if(pInv>0)pInv--;if(atkCd>0)atkCd--;if(dmgFlash>0)dmgFlash--;
  let mxv=0,myv=0;
  if(keys['w']||keys['arrowup'])myv=-1;
  if(keys['s']||keys['arrowdown'])myv=1;
  if(keys['a']||keys['arrowleft'])mxv=-1;
  if(keys['d']||keys['arrowright'])mxv=1;
  if(mxv||myv){const l=Math.hypot(mxv,myv);mxv/=l;myv/=l}
  px+=mxv*psp;py+=myv*psp;
  px=Math.max(pR,Math.min(W-pR,px));py=Math.max(pR,Math.min(H-pR,py));
  if(md)pAtk();
  if(pXp>=pXpn){pXp-=pXpn;pXpn+=35;levelUp()}

  // Wave
  if(!bsA){
    wt++;
    if(en.length===0&&wt>100){wv++;wt=0;st=0;if(wv%5===0)spBoss();else msg('⚔️ Wave '+wv,1200)}
    if(!bsA&&en.length<8+wv*2){st++;if(st>Math.max(15,45-wv)){st=0;spEn()}}
  }

  // Enemies
  for(let i=en.length-1;i>=0;i--){
    const e=en[i];if(e.stun>0){e.stun--;continue}
    const dx=px-e.x,dy=py-e.y,dist=Math.hypot(dx,dy)||1;
    e.x+=dx/dist*e.sp;e.y+=dy/dist*e.sp;
    e.x=Math.max(e.r,Math.min(W-e.r,e.x));e.y=Math.max(e.r,Math.min(H-e.r,e.y));
    if(dist<e.r+pR&&pInv<=0)dmgP(e.dmg*0.3);
    if(e.ty==='wiz'){e.sht--;if(e.sht<=0){e.sht=90;const a=Math.atan2(dy,dx);bl.push({x:e.x,y:e.y,vx:Math.cos(a)*3.5,vy:Math.sin(a)*3.5,dmg:e.dmg*0.6,r:5,c:'#4488ff',lf:120,en:true})}}
    if(e.ty==='archer'){e.sht--;if(e.sht<=0){e.sht=120;const a=Math.atan2(dy,dx);bl.push({x:e.x,y:e.y,vx:Math.cos(a)*5,vy:Math.sin(a)*5,dmg:e.dmg*0.5,r:4,c:'#88aa44',lf:100,en:true})}}
    if(e.ty==='bomb'&&dist<40){spPt(e.x,e.y,'#ff8800',20);dmgP(e.dmg*1.5);en.splice(i,1);continue}
    if(e.ty==='demon'&&Math.random()<0.005){dmgP(e.dmg*0.4);spPt(px,py,'#ff4422',8)}
  }

  // Boss
  if(bsA&&bs){
    const dx=px-bs.x,dy=py-bs.y,dist=Math.hypot(dx,dy)||1;
    if(bs.atk==='charge'&&dist<200){bs.x+=dx/dist*bs.sp*1.8;bs.y+=dy/dist*bs.sp*1.8}
    else{bs.x+=dx/dist*bs.sp;bs.y+=dy/dist*bs.sp}
    if(dist<bs.r+pR&&pInv<=0)dmgP(bs.dmg);
    if(bs.atk==='shoot'){bs.sht--;if(bs.sht<=0){bs.sht=35;for(let a=0;a<Math.PI*2;a+=Math.PI/5){bl.push({x:bs.x,y:bs.y,vx:Math.cos(a)*3.5,vy:Math.sin(a)*3.5,dmg:bs.dmg*.4,r:6,c:bs.c,lf:180,en:true})}}}
    if(bs.atk==='spawn'&&Math.random()<0.012)spEn();
    if(bs.atk==='poison'&&gT%60===0){spPt(bs.x,bs.y,'#00ff88',15);if(Math.hypot(px-bs.x,py-bs.y)<250)dmgP(bs.dmg*0.3)}
    if(bs.atk==='lightning'&&gT%40===0){const a=Math.atan2(bs.y-py,bs.x-px);bl.push({x:bs.x,y:bs.y,vx:-Math.cos(a)*7,vy:-Math.sin(a)*7,dmg:bs.dmg*0.6,r:8,c:'#ffff00',lf:120,en:true})}
    document.getElementById('bossFill').style.width=(bs.hp/bs.maxHp*100)+'%';
  }

  // Bullets
  for(let i=bl.length-1;i>=0;i--){
    const b=bl[i];b.x+=b.vx;b.y+=b.vy;b.lf--;
    if(b.lf<=0||b.x<-40||b.x>W+40||b.y<-40||b.y>H+40){bl.splice(i,1);continue}
    if(b.en){
      if(Math.hypot(b.x-px,b.y-py)<pR+6){dmgP(b.dmg);bl.splice(i,1);continue}
    }else{
      let hit=false;
      for(let j=en.length-1;j>=0;j--){
        if(Math.hypot(b.x-en[j].x,b.y-en[j].y)<en[j].r+b.r){
          let d=b.dmg;if(pCrit&&Math.random()<pCrit)d*=2.5;
          dmgE(en[j],d,j);hit=true;break;
        }
      }
      if(hit){bl.splice(i,1);continue}
      if(bsA&&bs&&Math.hypot(b.x-bs.x,b.y-bs.y)<bs.r+b.r){
        let d=b.dmg;if(pCrit&&Math.random()<pCrit)d*=2.5;
        bs.hp-=d;spPt(b.x,b.y,bs.c,3);if(pBurn)bs.hp-=2;
        if(bs.hp<=0)killBoss();bl.splice(i,1);
      }
      // Chain lightning
      if(pBolt&&bl[i]&&hit){for(let j=Math.min(en.length-1,3);j>=0;j--){if(en[j])dmgE(en[j],b.dmg*0.3,j)}}
    }
  }

  // Items
  for(let i=it.length-1;i>=0;i--){
    const o=it[i];o.lf--;
    if(o.lf<=0){it.splice(i,1);continue}
    if(Math.hypot(o.x-px,o.y-py)<pR+o.r+10){
      if(o.t==='hp'){pHp=Math.min(pMaxHp,pHp+o.v);spPt(o.x,o.y,'#ff5555',6)}
      if(o.t==='xp'){pXp+=o.v;spPt(o.x,o.y,'#88bbff',4)}
      if(o.t==='shield'){pShd+=o.v;spPt(o.x,o.y,'#66ccff',8)}
      if(o.t==='speed'){psp+=o.v;spPt(o.x,o.y,'#ffff44',6);setTimeout(()=>{psp-=o.v},3000)}
      it.splice(i,1);
    }
  }
  for(let i=pt.length-1;i>=0;i--){const p=pt[i];p.x+=p.vx;p.y+=p.vy;p.lf--;if(p.lf<=0)pt.splice(i,1)}

  // HUD
  document.getElementById('level').textContent='Level '+lv;
  document.getElementById('wave').textContent='Wave '+wv;
  document.getElementById('score').textContent=sc;
  document.getElementById('kills').textContent=ki;
  document.getElementById('hpFill').style.width=Math.max(0,Math.min(100,pHp/pMaxHp*100))+'%';
  document.getElementById('xpFill').style.width=Math.max(0,Math.min(100,pXp/pXpn*100))+'%';
}

// ===== RENDER =====
function drawPlayer(){
  // Body
  x.fillStyle='#ffaa00';
  x.beginPath();x.arc(px,py,pR,0,Math.PI*2);x.fill();
  x.strokeStyle='#fff';x.lineWidth=3;x.stroke();
  // Eyes
  const a=Math.atan2(my-py,mx-px);
  const ex1=px+Math.cos(a-0.5)*8,ey1=py+Math.sin(a-0.5)*8;
  const ex2=px+Math.cos(a+0.5)*8,ey2=py+Math.sin(a+0.5)*8;
  x.fillStyle='#fff';x.beginPath();x.arc(ex1,ey1,3.5,0,Math.PI*2);x.fill();
  x.beginPath();x.arc(ex2,ey2,3.5,0,Math.PI*2);x.fill();
  x.fillStyle='#000';x.beginPath();x.arc(ex1,ey1,1.8,0,Math.PI*2);x.fill();
  x.beginPath();x.arc(ex2,ey2,1.8,0,Math.PI*2);x.fill();
  // Weapon
  const wx=px+Math.cos(a)*(pR+8),wy=py+Math.sin(a)*(pR+8);
  x.strokeStyle='#ddd';x.lineWidth=4;x.lineCap='round';
  x.beginPath();x.moveTo(wx,wy);x.lineTo(px+Math.cos(a)*(pR+20),py+Math.sin(a)*(pR+20));x.stroke();
  x.fillStyle='#ffcc00';x.beginPath();x.arc(px+Math.cos(a)*(pR+22),py+Math.sin(a)*(pR+22),6,0,Math.PI*2);x.fill();
  // Shield glow
  if(pShd>0){x.strokeStyle='rgba(100,220,255,'+(0.3+Math.sin(gT*0.1)*0.2)+')';x.lineWidth=5;x.beginPath();x.arc(px,py,pR+8,0,Math.PI*2);x.stroke()}
  if(pInv>0&&pInv%4<2){x.fillStyle='rgba(255,255,255,.3)';x.beginPath();x.arc(px,py,pR+3,0,Math.PI*2);x.fill()}
}
function render(){
  x.clearRect(0,0,W,H);
  // Dark floor
  x.fillStyle='#0a0a18';x.fillRect(0,0,W,H);
  // Grid
  x.strokeStyle='#111128';x.lineWidth=1;
  for(let i=0;i<W;i+=48)for(let j=0;j<H;j+=48){x.strokeRect(i,j,48,48)}
  // Torch light effect near player
  const grd=x.createRadialGradient(px,py,0,px,py,300);
  grd.addColorStop(0,'rgba(255,200,100,.06)');grd.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=grd;x.fillRect(0,0,W,H);

  // Items
  it.forEach(o=>{
    x.fillStyle=o.c;x.globalAlpha=.6+Math.sin(gT*.08+o.x)*.4;
    x.beginPath();x.arc(o.x,o.y,o.r,0,Math.PI*2);x.fill();
    x.fillStyle='#fff';x.font='10px monospace';x.textAlign='center';
    x.fillText(o.t==='hp'?'❤️':o.t==='xp'?'⭐':o.t==='shield'?'🛡️':'⚡',o.x,o.y+4);
    x.globalAlpha=1;
  });
  // Enemies
  en.forEach(e=>{
    x.fillStyle=e.c;x.beginPath();x.arc(e.x,e.y,e.r,0,Math.PI*2);x.fill();
    x.strokeStyle='#000';x.lineWidth=2.5;x.stroke();
    // HP bar
    const bw=e.r*2;
    x.fillStyle='rgba(0,0,0,.6)';x.fillRect(e.x-bw/2,e.y-e.r-14,bw,5);
    x.fillStyle='#ff3333';x.fillRect(e.x-bw/2,e.y-e.r-14,bw*(e.hp/e.maxHp),5);
    // Type indicator
    if(e.ty==='wiz'){x.fillStyle='#4466cc';x.beginPath();x.moveTo(e.x,e.y-e.r);x.lineTo(e.x-9,e.y-e.r-16);x.lineTo(e.x+9,e.y-e.r-16);x.fill()}
    if(e.ty==='archer'){const a2=Math.atan2(py-e.y,px-e.x);x.strokeStyle='#88aa44';x.lineWidth=2;x.beginPath();x.moveTo(e.x,e.y);x.lineTo(e.x+Math.cos(a2)*20,e.y+Math.sin(a2)*20);x.stroke()}
    if(e.ty==='demon'){x.fillStyle='#ff4422';x.beginPath();x.moveTo(e.x-12,e.y-e.r-5);x.lineTo(e.x,e.y-e.r-18);x.lineTo(e.x+12,e.y-e.r-5);x.fill()}
    if(e.ty==='bomb'){x.strokeStyle='#ff8800';x.lineWidth=2;x.beginPath();x.arc(e.x,e.y,e.r+3,0,Math.PI*2);x.setLineDash([3,3]);x.stroke();x.setLineDash([])}
  });
  // Boss
  if(bsA&&bs){
    x.fillStyle=bs.c;x.shadowColor=bs.c;x.shadowBlur=24;
    x.beginPath();x.arc(bs.x,bs.y,bs.r,0,Math.PI*2);x.fill();
    x.shadowBlur=0;x.strokeStyle='#fff';x.lineWidth=4;x.stroke();
    x.fillStyle='#fff';x.font='bold 15px monospace';x.textAlign='center';
    x.fillText(bs.n,bs.x,bs.y-bs.r-18);
    // Boss aura
    x.strokeStyle=bs.c.replace(')','').replace('rgb','rgba')+',0.25)';
    x.lineWidth=3;x.beginPath();x.arc(bs.x,bs.y,bs.r+12+(Math.sin(gT*.05)*4),0,Math.PI*2);x.stroke();
  }
  // Player
  drawPlayer();
  // Crosshair
  x.strokeStyle='rgba(255,255,255,.4)';x.lineWidth=1.5;
  const onEn=en.some(e=>Math.hypot(e.x-mx,e.y-my)<e.r+5)||(bs&&Math.hypot(bs.x-mx,bs.y-my)<bs.r+5);
  x.beginPath();x.arc(mx,my,onEn?12:7,0,Math.PI*2);x.stroke();
  if(onEn){x.strokeStyle='#ff4400';x.beginPath();x.arc(mx,my,14,0,Math.PI*2);x.stroke()}
  // Bullets
  bl.forEach(b=>{
    const glow=x.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r*3);
    glow.addColorStop(0,b.c);glow.addColorStop(1,'transparent');
    x.fillStyle=glow;x.beginPath();x.arc(b.x,b.y,b.r*3,0,Math.PI*2);x.fill();
    x.fillStyle='#fff';x.beginPath();x.arc(b.x,b.y,b.r*0.6,0,Math.PI*2);x.fill();
  });
  // Particles
  pt.forEach(p=>{x.fillStyle=p.c;x.globalAlpha=p.lf/40;x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fill();x.globalAlpha=1});
  // Damage flash
  if(dmgFlash>0&&dmgFlash%2===0){x.fillStyle='rgba(255,0,0,.15)';x.fillRect(0,0,W,H)}
}

// ===== LOOP =====
function loop(){upd();render();requestAnimationFrame(loop)}

// ===== INPUT =====
document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='w'||k==='a'||k==='s'||k==='d')keys[k]=true;
  if(e.key.startsWith('Arrow'))keys[e.key.toLowerCase()]=true;
  if(e.key==='Escape'){
    if(gs==='playing'){gs='paused';
      const bg=document.getElementById('pauseBg');bg.classList.add('show');
      document.getElementById('pauseTitle').textContent='⏸️ 暂停';
      document.getElementById('pauseBtn1').textContent='继续游戏';document.getElementById('pauseBtn1').onclick=()=>{gs='playing';bg.classList.remove('show')};
      document.getElementById('pauseBtn2').textContent='重新开始';document.getElementById('pauseBtn2').onclick=()=>{bg.classList.remove('show');restart()};
      document.getElementById('upgradeDesc').style.display='none';
      const btns=bg.querySelectorAll('button');for(let i=btns.length-1;i>=2;i--)btns[i].remove();
    }else if(gs==='paused'){gs='playing';document.getElementById('pauseBg').classList.remove('show')}
  }
  e.preventDefault();
});
document.addEventListener('keyup',e=>{const k=e.key.toLowerCase();keys[k]=false;keys[e.key.toLowerCase()]=false});
c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect();mx=(e.clientX-r.left)*(W/r.width);my=(e.clientY-r.top)*(H/r.height)});
c.addEventListener('mousedown',e=>{e.preventDefault();md=true});
c.addEventListener('mouseup',()=>md=false);
c.addEventListener('mouseleave',()=>md=false);
c.addEventListener('touchmove',e=>{e.preventDefault();const r=c.getBoundingClientRect();mx=(e.touches[0].clientX-r.left)*(W/r.width);my=(e.touches[0].clientY-r.top)*(H/r.height)});
c.addEventListener('touchstart',e=>{e.preventDefault();md=true;const r=c.getBoundingClientRect();mx=(e.touches[0].clientX-r.left)*(W/r.width);my=(e.touches[0].clientY-r.top)*(H/r.height)});
c.addEventListener('touchend',()=>md=false);

function msg(t,d){const el=document.getElementById('msg');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),d)}

// ===== START =====
spEn();spEn();spEn();
msg('🗡️ 消灭所有敌人！',2000);
loop();
</script>
