<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>📝 云笔记</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#f5f6f7;min-height:100vh;color:#333}
.header{padding:16px 20px;background:#fff;display:flex;align-items:center;gap:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);position:sticky;top:0;z-index:10}
.header h2{font-size:18px;flex:1}
.header button{padding:8px 16px;border-radius:8px;border:none;background:#4d96ff;color:#fff;font-weight:600;cursor:pointer;font-size:13px}
.notes{padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.note{background:#fff;border-radius:12px;padding:14px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.04);min-height:100px;display:flex;flex-direction:column;transition:.2s;position:relative}
.note:active{transform:scale(.97)}
.note .ntitle{font-size:14px;font-weight:700;margin-bottom:4px}
.note .ncontent{font-size:12px;color:#888;flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.note .ntime{font-size:9px;color:#bbb;margin-top:8px}
.note .ndelete{position:absolute;top:8px;right:8px;font-size:14px;opacity:0;transition:.2s;cursor:pointer}
.note:hover .ndelete{opacity:1}
.editor{position:fixed;inset:0;background:#fff;z-index:100;display:none;flex-direction:column}
.editor.show{display:flex}
.editor .ebar{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid #eee;gap:10px}
.editor .ebar .back{font-size:18px;cursor:pointer;color:#4d96ff}
.editor .ebar .ename{font-size:16px;font-weight:700;flex:1}
.editor .ebar button{padding:8px 16px;border-radius:8px;border:none;background:#4d96ff;color:#fff;font-weight:600;cursor:pointer}
.editor input,.editor textarea{flex:1;border:none;padding:16px;font-size:15px;font-family:system-ui,sans-serif;outline:none;resize:none}
.editor input{font-size:20px;font-weight:700;border-bottom:1px solid #f0f0f0}
.editor textarea{flex:1}
</style></head>
<body>
<div class="header"><h2>📝 云笔记</h2><button onclick="newNote()">＋ 新建</button></div>
<div class="notes" id="notesList"></div>
<div class="editor" id="editor">
<div class="ebar"><span class="back" onclick="closeEditor()">←</span><span class="ename">编辑笔记</span><button onclick="saveNote()">保存</button></div>
<input type="text" id="enTitle" placeholder="标题">
<textarea id="enContent" placeholder="写点什么..."></textarea>
</div>
<script>
let notes=JSON.parse(localStorage.getItem('cloud_notes')||'[]'),editingId=null;
function render(){
  document.getElementById('notesList').innerHTML=notes.map((n,i)=>'<div class="note" onclick="edit('+i+')"><span class="ndelete" onclick="event.stopPropagation();del('+i+')">🗑️</span><div class="ntitle">'+e(n.title||'无标题')+'</div><div class="ncontent">'+e(n.content||'')+'</div><div class="ntime">'+n.time+'</div></div>').join('')||'<div style="text-align:center;padding:60px;color:#ccc">点击 ＋ 新建笔记</div>';
}
function e(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function newNote(){editingId=null;document.getElementById('enTitle').value='';document.getElementById('enContent').value='';document.getElementById('editor').classList.add('show')}
function edit(i){editingId=i;const n=notes[i];document.getElementById('enTitle').value=n.title;document.getElementById('enContent').value=n.content;document.getElementById('editor').classList.add('show')}
function closeEditor(){document.getElementById('editor').classList.remove('show')}
function saveNote(){
  const t=document.getElementById('enTitle').value.trim();const c=document.getElementById('enContent').value.trim();
  if(!t&&!c)return;const nw={title:t||'无标题',content:c,time:new Date().toLocaleString('zh-CN')};
  if(editingId!==null)notes[editingId]=nw;else notes.unshift(nw);
  localStorage.setItem('cloud_notes',JSON.stringify(notes));render();closeEditor();
}
function del(i){if(confirm('删除这条笔记？')){notes.splice(i,1);localStorage.setItem('cloud_notes',JSON.stringify(notes));render()}}
render();
</script>

<div style="position:fixed;top:12px;right:16px;z-index:999;display:flex;gap:8px;align-items:center"><span id="ui2" style="font-size:10px;opacity:.8;display:none;color:#fff">👤 <span id="ue2"></span></span><button id="lb2" style="padding:5px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-size:10px;cursor:pointer" onclick="checkAuth()">🔐 登录</button></div>
<script>let loggedIn=false;(function(){const u=localStorage.getItem("miui_unified_user");if(u){try{const d=JSON.parse(u);if(d.verified){loggedIn=true;document.getElementById("lb2").style.display="none";document.getElementById("ui2").style.display="inline";document.getElementById("ue2").textContent=d.email}}catch(e){}}})();function checkAuth(){if(!loggedIn)location.href="https://weyoudonttalk.github.io/auth/?redirect="+encodeURIComponent(location.href)}</script>
</body></html>
