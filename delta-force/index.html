<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><title>大型搜打撤 · 三角洲</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none}#c{display:block;width:100%;height:100%}#over{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;cursor:pointer;flex-direction:column;font-family:sans-serif}#over h1{font-size:26px;margin-bottom:6px;font-weight:900}#over p{font-size:12px;color:rgba(255,255,255,.4);margin:2px 0}.k{display:inline-block;padding:3px 8px;border-radius:4px;background:rgba(255,255,255,.1);font-size:10px;margin:2px}#js{position:fixed;bottom:80px;left:30px;width:100px;height:100px;background:rgba(255,255,255,.04);border-radius:50%;border:2px solid rgba(255,255,255,.1);z-index:100}#js div{position:absolute;width:36px;height:36px;background:rgba(255,255,255,.14);border-radius:50%;top:32px;left:32px}#f{position:fixed;bottom:90px;right:30px;width:62px;height:62px;background:rgba(255,30,10,.1);border-radius:50%;border:2px solid rgba(255,60,30,.22);z-index:100;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:900}#r2{position:fixed;bottom:64px;right:106px;width:42px;height:42px;background:rgba(255,255,255,.04);border-radius:50%;border:1px solid rgba(255,255,255,.08);z-index:100;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}.h{position:fixed;inset:0;pointer-events:none;z-index:10;font-family:sans-serif}.cs{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:12px;height:12px;border:2px solid rgba(255,255,255,.3);border-radius:50%}.am{position:absolute;bottom:24px;right:16px;color:#fff;font-size:18px;font-weight:900}.hp{position:absolute;bottom:24px;left:16px;color:#f44;font-size:10px}.fp{position:absolute;top:6px;left:10px;color:rgba(255,255,255,.18);font-size:8px}.sc{position:absolute;top:6px;right:10px;color:#ff0;font-size:11px;font-weight:700}.mi{position:absolute;top:28px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.5);font-size:10px;text-align:center;width:200px}</style></head><body>
<canvas id="c"></canvas>
<div id="over"><h1>🔫 大型搜打撤</h1><p>三角洲行动 · 离线作战</p><p style="opacity:.2;font-size:9px">触屏摇杆+射击 • 击倒20敌人</p></div>
<div id="js"><div></div></div><div id="f">🔫</div><div id="r2">R</div>
<div class="h"><div class="cs"></div><div class="am" id="am">30</div><div class="hp" id="hp">HP100</div><div class="fp" id="fp">--</div><div class="sc" id="sc">0/20</div><div class="mi" id="mi"></div></div>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
(function(){
if(typeof BABYLON==="undefined"){document.getElementById("over").innerHTML="<h1>加载失败</h1>";return};
// ===== INIT =====
var E=new BABYLON.Engine(document.getElementById("c"),!0,{preserveDrawingBuffer:!0});
var S=new BABYLON.Scene(E);S.clearColor=new BABYLON.Color4(.53,.8,.94,1);S.fogMode=BABYLON.Scene.FOGMODE_LINEAR;S.fogStart=80;S.fogEnd=260;S.collisionsEnabled=!0;S.gravity=new BABYLON.Vector3(0,-9.81,0);
var C=new BABYLON.UniversalCamera("C",new BABYLON.Vector3(0,14,0),S);C.fov=1.2;C.minZ=.3;C.maxZ=400;C.speed=8;C.angularSensibility=2500;C.ellipsoid=new BABYLON.Vector3(.5,1.7,.5);C.checkCollisions=!0;C.applyGravity=!0;S.activeCamera=C;
var H=new BABYLON.HemisphericLight("H",new BABYLON.Vector3(.5,1,.3),S);H.intensity=.7;
var DL=new BABYLON.DirectionalLight("DL",new BABYLON.Vector3(-.5,-.7,-.3),S);DL.intensity=1;DL.diffuse=new BABYLON.Color3(1,.95,.82);
var SG=new BABYLON.ShadowGenerator(1024,DL);SG.useBlurExponentialShadowMap=!0;SG.blurKernel=32;

// ===== TERRAIN =====
function genH(){var d=[];for(var i=0;i<256;i++)for(var j=0;j<256;j++){var h=Math.sin(i*.015)*Math.cos(j*.01)*45+Math.sin(i*.03+1.3)*Math.sin(j*.025)*35+Math.cos(i*.012-j*.015)*25+100;d.push(Math.floor(Math.max(0,Math.min(255,h))))}return btoa(String.fromCharCode.apply(null,new Uint8Array(d)))}
var TN=BABYLON.MeshBuilder.CreateGroundFromHeightMap("TN","data:image/png;base64,"+genH(),{width:240,height:240,subdivisions:100,maxHeight:18,minHeight:-2},S);TN.position.y=-2;TN.checkCollisions=!0;TN.receiveShadows=!0;SG.addShadowCaster(TN);
function th(x,z){return TN.getHeightAtCoordinates(x,z)||-2}

// ===== MATERIAL HELPERS =====
function mat(r,g,b){var m=new BABYLON.StandardMaterial("m"+Math.random(),S);m.diffuseColor=new BABYLON.Color3(r,g,b);m.specularColor=new BABYLON.Color3(0,0,0);return m}
var wm=mat(.55,.62,.68),rm=mat(.35,.4,.43),wnm=mat(.15,.24,.38),dm=mat(.18,.2,.22),sm=mat(.58,.58,.58),bm=mat(.45,.5,.55);
var tnk=mat(.38,.26,.16),etm=mat(.82,.12,.12),ehm=mat(.78,.1,.1),elm=mat(.18,.18,.22),ctm=mat(.72,.34,.24),bgm=mat(.58,.48,.32),gnm=mat(.14,.14,.14);
var lf=[mat(.18,.42,.15),mat(.22,.48,.18),mat(.15,.38,.12)];

// ===== MESH BUILDERS =====
function bBox(n,w,h,d,mt,parent,px,py,pz,ry){var o=BABYLON.MeshBuilder.CreateBox(n,{width:w,height:h,depth:d},S);o.material=mt;o.checkCollisions=!0;o.receiveShadows=!0;SG.addShadowCaster(o);if(parent){o.parent=parent;o.position.set(px||0,py||0,pz||0);if(ry)o.rotation.y=ry}else{o.position.set(px||0,py||0,pz||0);if(ry)o.rotation.y=ry}return o}
function bCyl(n,r1,r2,h,mt,parent,px,py,pz,rx,rz){var o=BABYLON.MeshBuilder.CreateCylinder(n,{height:h,diameterTop:r2*2,diameterBottom:r1*2,tessellation:8},S);o.material=mt;o.checkCollisions=!0;o.receiveShadows=!0;SG.addShadowCaster(o);if(parent){o.parent=parent;o.position.set(px||0,py||0,pz||0);if(rx)o.rotation.x=rx;if(rz)o.rotation.z=rz}else{o.position.set(px||0,py||0,pz||0);if(rx)o.rotation.x=rx;if(rz)o.rotation.z=rz}return o}

// ===== BUILDINGS (hand-modeled, individually placed) =====
var blist=[];
function bld(x,z,ro,w,d,h,fl){
 var bh=th(x,z);
 var g=new BABYLON.TransformNode("bldg",S);g.position.set(x,bh,z);g.rotation.y=ro;
 blist.push({x:x,z:z,w:w,d:d,h:h,rot:ro,top:bh+h});
 bBox("bw",w,h,d,wm,g,0,h/2,0); // walls
 bBox("br",w+.3,.15,d+.3,rm,g,0,h+.08,0); // roof
 var fh=h/fl;
 for(var f=0;f<fl;f++){
  for(var s=-1;s<=1;s+=2)for(var wi=-1;wi<=1;wi+=2)bBox("w",.08,fh*.45,1.5,wnm,g,s*w*.35,fh*(f+.5),wi*d*.35); // windows
  bBox("fb",w+.1,.08,d+.1,bm,g,0,fh*(f+1),0); // floor bands
 }
 bBox("dr",1.5,fh*.6,.12,dm,g,0,fh*.3,d/2); // door
 for(var st=0;st<3;st++)bBox("st",.8,.08,.2-st*.05,sm,g,0,.02+st*.08,d/2+.2-st*.05); // steps
}

// ===== PLACE 16 BUILDINGS ACROSS THE MAP =====
bld(-35,10,0,14,10,18,5);bld(-18,15,.08,10,8,12,4);bld(-50,-5,.12,20,8,8,3);
bld(-55,22,-.05,8,6,10,3);bld(15,-30,.15,16,12,14,4);bld(0,-35,-.08,18,10,10,3);
bld(30,-25,.2,12,8,12,4);bld(45,-15,-.1,16,10,10,3);bld(-40,-40,0,22,14,16,5);
bld(50,20,.05,10,8,8,3);bld(-20,-60,.2,14,6,8,3);bld(60,40,-.08,12,10,12,4);
bld(-60,50,.15,16,8,10,3);bld(10,50,.03,10,12,8,3);bld(70,-50,.08,14,10,14,5);
bld(-70,-30,0,18,12,12,4);

// ===== TREES (70 trees, each trunk+3-5 branches+3 leaf layers) =====
for(var tt=0;tt<70;tt++){
 var tx=(Math.random()-.5)*210,tz=(Math.random()-.5)*210;
 if(Math.abs(tx)<22&&Math.abs(tz)<22)continue;
 var h2=th(tx,tz);if(h2<-1)continue;
 var tH=2+Math.random()*3.5;
 bCyl("tk",.12,.18,tH,tnk,null,tx,h2+tH/2,tz);
 for(var b=0;b<3+Math.floor(Math.random()*3);b++){
  var a=Math.random()*6.28,bl=.8+Math.random()*1.5;
  bCyl("tb",.04,.07,bl,new BABYLON.StandardMaterial("tb"+b,S),null,tx,h2+tH*.4+b*.25,tz,Math.cos(a)*.6,Math.sin(a)*.6);
 }
 for(var l2=0;l2<3;l2++){var r=1+Math.random()*.8;bBox("lf",r,r*.7,r,lf[l2],null,tx+Math.sin(l2)*.2,h2+tH*.4+l2*.8,tz+Math.cos(l2)*.2)}
}

// ===== CONTAINERS & SAND BAGS =====
for(var ct=0;ct<12;ct++){var cx=-35+Math.random()*90,cz=-50+Math.random()*80;bBox("ct",2.2,2.5,6,ctm,null,cx,th(cx,cz)+1.25,cz,Math.random()*6.28)}
for(var sb=0;sb<15;sb++){var sx=-40+Math.random()*100,sz=-60+Math.random()*90;bBox("bg",.5,.3,.8,bgm,null,sx,th(sx,sz)+.15,sz,Math.random()*6.28)}

// ===== ENEMIES (20 soldiers placed ON TERRAIN not in sky) =====
var enemies=[],kills=0,totalE=20;
function mkEnemy(x,z){
 var h=th(x,z);
 var g=new BABYLON.TransformNode("eny",S);g.position.set(x,h,z);
 // body
 bCyl("el",.07,.09,1.4,elm,g,-.18,-.6,0);bCyl("er",.07,.09,1.4,elm,g,.18,-.6,0);
 bBox("eb",.55,.75,.3,etm,g,0,.7,0);
 bBox("eh",.32,.32,.32,ehm,g,0,1.25,0);
 bCyl("ea",.04,.05,.8,mat(.7,.1,.1),g,-.35,.95,0,0,.3);bCyl("ea2",.04,.05,.8,mat(.7,.1,.1),g,.35,.95,0,0,-.3);
 return{node:g,alive:!0,x:x,z:z};
}
for(var e=0;e<totalE;e++){
 var ex=-60+Math.random()*130,ez=-70+Math.random()*120;
 if(Math.abs(ex)<5&&Math.abs(ez)<5){ex+=12;ez+=12}
 enemies.push(mkEnemy(ex,ez));
}

// ===== FPS GUN MODEL =====
var gun=new BABYLON.TransformNode("gun",S);gun.parent=C;gun.position.set(.22,-.28,-.48);
bCyl("gB",.022,.028,.9,gnm,gun,0,.02,-.38,Math.PI/2);bBox("gR",.09,.16,.35,gnm,gun,0,-.02,0);bBox("gS",.05,.1,.3,gnm,gun,0,0,.22);bCyl("gG",.025,.035,.22,gnm,gun,0,-.16,.03);bBox("gM",.035,.18,.05,mat(.07,.07,.07),gun,0,-.18,.08);
var mzL=new BABYLON.PointLight("mz",new BABYLON.Vector3(0,0,0),S);mzL.diffuse=new BABYLON.Color3(1,.5,.1);mzL.intensity=0;mzL.parent=gun;mzL.position.set(0,.01,-.9);

// ===== COLLISION: keep player above buildings =====
S.registerBeforeRender(function(){
 var h=th(C.position.x,C.position.z);
 for(var i=0;i<blist.length;i++){
  var bb=blist[i],dx=C.position.x-bb.x,dz=C.position.z-bb.z;
  var lx=Math.cos(-bb.rot)*dx-Math.sin(-bb.rot)*dz,lz=Math.sin(-bb.rot)*dx+Math.cos(-bb.rot)*dz;
  if(Math.abs(lx)<bb.w/2+.7&&Math.abs(lz)<bb.d/2+.7)h=Math.max(h,bb.top);
 }
 if(C.position.y<h+1.7)C.position.y=h+1.7;
});

// ===== CONTROLS =====
var mv2={x:0,z:0},jsA=!1,jsB={x:0,y:0};
var jsEl=document.getElementById("js"),jsK=jsEl.querySelector("div"),isM=/Android|iPhone|iPad/i.test(navigator.userAgent);
jsEl.addEventListener("pointerdown",function(e){jsA=!0;jsB={x:e.clientX,y:e.clientY};jsEl.setPointerCapture(e.pointerId);e.preventDefault()});
jsEl.addEventListener("pointermove",function(e){if(!jsA)return;var dx=e.clientX-jsB.x,dy=e.clientY-jsB.y,d=Math.sqrt(dx*dx+dy*dy);if(d>38){dx=dx/d*38;dy=dy/d*38}jsK.style.transform="translate("+dx+"px,"+dy+"px)";mv2.x=dx/38;mv2.z=dy/38;e.preventDefault()});
jsEl.addEventListener("pointerup",function(){jsA=!1;jsK.style.transform="translate(0,0)";mv2.x=0;mv2.z=0});
jsEl.addEventListener("pointerleave",function(){jsA=!1;jsK.style.transform="translate(0,0)";mv2.x=0;mv2.z=0});
var fA=!1,ammo=30,maxA=30,relT=0;
document.getElementById("f").addEventListener("pointerdown",function(e){fA=!0;e.preventDefault();e.stopPropagation()});
document.getElementById("f").addEventListener("pointerup",function(){fA=!1});
document.getElementById("f").addEventListener("pointerleave",function(){fA=!1});
document.getElementById("r2").addEventListener("pointerdown",function(e){if(ammo<maxA&&relT<=0){relT=1.5;ammo=0;document.getElementById("am").textContent="R.."}e.preventDefault();e.stopPropagation()});
var keys={};
document.addEventListener("keydown",function(e){keys[e.code]=!0;if(e.code==="KeyR"&&ammo<maxA&&relT<=0){relT=1.5;ammo=0;document.getElementById("am").textContent="R.."}});
document.addEventListener("keyup",function(e){keys[e.code]=!1});
document.addEventListener("click",function(){if(!isM)E.enterPointerlock()});
E.onPointerLockChange=function(){document.getElementById("over").style.display=E.isPointerLock?"none":"flex"};

// ===== SHOOT =====
function shoot(){
 if(ammo<=0||relT>0)return;ammo--;document.getElementById("am").textContent=ammo;
 mzL.intensity=12;setTimeout(function(){mzL.intensity=0},60);
 var ray=new BABYLON.Ray(C.position,C.getDirection(BABYLON.Axis.Z));
 // pick anything that is NOT a gun part
 var hit=S.pickWithRay(ray,function(m){return m.name.indexOf("g")!==0});
 if(!hit||!hit.pickedMesh)return;
 var s2=BABYLON.MeshBuilder.CreateSphere("hit_"+Date.now(),{diameter:.12},S);s2.position=hit.pickedPoint;setTimeout(function(){s2.dispose()},200);
 for(var e2=0;e2<enemies.length;e2++){
  var en=enemies[e2];if(!en.alive)continue;
  if(BABYLON.Vector3.Distance(hit.pickedPoint,en.node.position)<2.8){
   en.alive=!1;en.node.dispose();kills++;document.getElementById("sc").textContent=kills+"/"+totalE;
   if(kills>=totalE)document.getElementById("sc").textContent="🏆 任务完成";
  }
 }
 if(ammo<=0){relT=2;document.getElementById("am").textContent="R.."}
}

// ===== ENEMY AI: look at player when close =====
var aiTick=0;
S.registerBeforeRender(function(){
 aiTick++;
 for(var e=0;e<enemies.length;e++){var en=enemies[e];if(!en.alive)continue;var d=BABYLON.Vector3.Distance(C.position,en.node.position);if(d<28&&d>2)en.node.lookAt(C.position)}
});

// ===== MAIN LOOP =====
var lt=0,ft=0,fpsArr=[];
E.runRenderLoop(function(){
 var n=performance.now(),dt=Math.min(.15,(n-(lt||n))/1000);lt=n;if(dt<.001)dt=.016;
 fpsArr.push(1/dt);if(fpsArr.length>30)fpsArr.shift();if(fpsArr.length===30)document.getElementById("fp").textContent=Math.round(fpsArr.reduce(function(a,b){return a+b})/30)+" FPS";
 if(relT>0){relT-=dt;if(relT<=0){ammo=maxA;document.getElementById("am").textContent=ammo}}
 var mv=new BABYLON.Vector3(0,0,0);
 if(isM){mv.x=mv2.x;mv.z=mv2.z}else{var fwd=C.getDirection(BABYLON.Axis.Z);fwd.y=0;fwd.normalize();var rig=BABYLON.Vector3.Cross(fwd,BABYLON.Axis.Y);if(keys["KeyW"]){mv.x+=fwd.x;mv.z+=fwd.z}if(keys["KeyS"]){mv.x-=fwd.x;mv.z-=fwd.z}if(keys["KeyA"]){mv.x+=rig.x;mv.z+=rig.z}if(keys["KeyD"]){mv.x-=rig.x;mv.z-=rig.z}}
 var sp=keys["ShiftLeft"]?14:8;if(mv.length()>.01){mv.normalize().scaleInPlace(sp*dt);C.position.addInPlace(mv)}
 var hh=th(C.position.x,C.position.z);if(keys["Space"]&&Math.abs(hh+1.7-C.position.y)<.2)C.position.y+=.5;
 if(fA||keys["Mouse0"]){ft-=dt;if(ft<=0){ft=.12;shoot()}}else ft=0;
 if(mv.length()>.01&&Math.abs(hh+1.7-C.position.y)<.4){gun.position.y=-.28+Math.sin(n*.012)*.012;gun.position.x=.22+Math.cos(n*.009)*.006}else{gun.position.y=-.28;gun.position.x=.22}
 var alive=enemies.filter(function(e2){return e2.alive}).length;
 document.getElementById("mi").textContent=alive+" 敌人存活";
 S.render();
});
if(isM)document.getElementById("over").style.display="none";
window.addEventListener("resize",function(){E.resize()});
})();</script></body></html>
