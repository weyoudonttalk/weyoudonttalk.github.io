<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>三角洲行动 · MIUI STUDIO</title>
<!-- cache-bust v202611080107 COD4 -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#07090d;overflow:hidden;font-family:-apple-system,"PingFang SC",sans-serif;user-select:none}
  #wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
  canvas#c{background:#10141c;display:block;touch-action:none}
  #hud{position:absolute;top:10px;left:12px;color:#cfe;font-size:14px;text-shadow:0 1px 2px #000;line-height:1.6}
  #hud b{color:#ffd166}
  #tip{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:#9ab;font-size:12px;text-shadow:0 1px 2px #000}
  #over{position:absolute;inset:0;background:rgba(0,0,0,.8);display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;z-index:50}
  #over h1{font-size:28px;margin-bottom:8px}
  #over button{margin-top:16px;padding:10px 26px;border:0;border-radius:24px;background:linear-gradient(135deg,#ff5ea8,#7b5cff);color:#fff;font-size:16px;cursor:pointer}

  /* ====== 开始页：CODMW 全屏开屏 ====== */
  #start{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:#000}
  /* 视频铺满全屏（cover 技巧，16:9 不被裁切也填满） */
  #bgVideo{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:100vw;height:56.25vw;min-height:100vh;min-width:177.78vh;border:0;}
  #start .scrim{position:absolute;inset:0;background:
    linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.15) 38%,rgba(0,0,0,.65) 100%);}
  #start .content{position:relative;z-index:3;text-align:center;padding:20px}
  #start h1{font-size:clamp(30px,9vw,64px);font-weight:900;letter-spacing:6px;margin-bottom:6px;color:#fff;
    text-shadow:0 2px 24px #000,0 0 40px #ff6a3d55;animation:flick 5s infinite}
  @keyframes flick{0%,97%,100%{opacity:1}98%{opacity:.6}99%{opacity:.85}}
  #start .sub{color:#ffb98a;font-size:clamp(13px,3.4vw,17px);letter-spacing:3px;margin-bottom:26px;text-shadow:0 1px 6px #000}
  #enterBtn{position:relative;z-index:3;padding:14px 50px;border:1px solid #ff8a4d;border-radius:30px;font-size:19px;font-weight:800;letter-spacing:2px;color:#fff;
    background:rgba(255,106,61,.18);backdrop-filter:blur(4px);cursor:pointer;box-shadow:0 0 30px #ff6a3d44;transition:.2s}
  #enterBtn:active{transform:scale(.96);background:rgba(255,106,61,.4)}
  #start .credit{position:absolute;bottom:12px;left:0;right:0;z-index:3;text-align:center;color:#caa;font-size:11px;text-shadow:0 1px 4px #000}
  #start .credit a{color:#ff9a6a;text-decoration:none}
  #start .orig{position:absolute;top:12px;right:12px;z-index:3;font-size:11px;color:#ff9a6a;text-decoration:none;background:#0008;padding:4px 10px;border-radius:8px}
  /* 视频失败回退：全屏战术 HUD */
  #fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,#1a1208,#000 75%)}
  #fallback .rings{position:relative;width:min(60vw,260px);height:min(60vw,260px)}
  #fallback .rings b{position:absolute;border-radius:50%;border:2px solid transparent;left:50%;top:50%;transform:translate(-50%,-50%)}
  #fallback .rings b:nth-child(1){width:100%;height:100%;margin:-50% 0 0 -50%;border-top-color:#ff6a3d;border-right-color:#ff6a3d;animation:r1 1.6s linear infinite;box-shadow:0 0 24px #ff6a3d55}
  #fallback .rings b:nth-child(2){width:72%;height:72%;margin:-36% 0 0 -36%;border-bottom-color:#7b5cff;border-left-color:#7b5cff;animation:r2 2.3s linear infinite}
  #fallback .rings b:nth-child(3){width:46%;height:46%;margin:-23% 0 0 -23%;border-top-color:#5ef0ff;border-bottom-color:#5ef0ff;animation:r1 1.1s linear infinite}
  @keyframes r1{to{transform:translate(-50%,-50%) rotate(360deg)}}
  @keyframes r2{to{transform:translate(-50%,-50%) rotate(-360deg)}}
  #fallback .ft{position:absolute;bottom:18%;width:100%;text-align:center;color:#ff9a6a;font-size:clamp(14px,4vw,20px);letter-spacing:4px;text-shadow:0 0 12px #ff6a3d}
  #muteHint{position:absolute;bottom:40px;left:0;right:0;z-index:3;text-align:center;color:#9ab;font-size:11px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud"></div>
  <div id="tip">WASD 移动 · 鼠标瞄准 · 点击/空格射击 · 利用灰色掩体躲子弹 · 清完波次即胜利</div>
  <div id="over"><h1 id="ot"></h1><div id="os"></div><button onclick="restart()">再战一局</button></div>
</div>

<!-- 开始页（CODMW 全屏开屏） -->
<div id="start">
  <iframe id="bgVideo" src="https://player.bilibili.com/player.html?bvid=BV11s411s7Jd&page=1&high_quality=1&danmaku=0&autoplay=0&width=100%25&height=100%25" allowfullscreen="true" scrolling="no" frameborder="0" onerror="videoFail()"></iframe>
  <div id="fallback">
    <div class="rings"><b></b><b></b><b></b></div>
    <div class="ft">将军南下 · 捉虫行动中…</div>
  </div>
  <div class="scrim"></div>
  <a class="orig" href="https://www.bilibili.com/video/BV11s411s7Jd/" target="_blank" rel="noopener">原片↗</a>
  <div class="content">
    <h1>使命召唤 4</h1>
    <div class="sub">MODERN WARFARE · 将军南下 · 捉虫行动</div>
    <button id="enterBtn" onclick="startGame()">▶ 进入战场</button>
    <div id="muteHint">（B站嵌入默认静音·点「原片」可看带声版本）</div>
  </div>
  <div class="credit">开屏视频：B站 UP 主《使命召唤4全过场CG剪辑》· 仅供展示</div>
</div>

<script>
function videoFail(){ document.getElementById('bgVideo').style.display='none'; document.getElementById('fallback').style.display='flex'; }

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H;function resize(){W=cv.width=Math.min(innerWidth,900);H=cv.height=Math.min(innerHeight,640);}resize();addEventListener('resize',resize);
const keys={},mouse={x:W/2,y:H/2};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' ')shoot();});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;});
cv.addEventListener('mousedown',()=>shoot());
cv.addEventListener('touchstart',e=>{const t=e.touches[0],r=cv.getBoundingClientRect();mouse.x=t.clientX-r.left;mouse.y=t.clientY-r.top;shoot();},{passive:true});

let player,bullets,enemies,obstacles,wave,score,alive,lastShot,spawnTimer,started=false;
function restart(){
  player={x:W/2,y:H/2,r:14,hp:100,ang:0,speed:3};
  bullets=[];enemies=[];obstacles=[];score=0;alive=true;lastShot=0;spawnTimer=0;wave=0;
  for(let i=0;i<6;i++)obstacles.push({x:60+Math.random()*(W-120),y:60+Math.random()*(H-120),w:40+Math.random()*40,h:40+Math.random()*40});
  nextWave();
}
function nextWave(){wave++;const n=4+wave;for(let i=0;i<n;i++)spawnEnemy();}
function spawnEnemy(){
  let x,y;do{x=Math.random()*W;y=Math.random()*H;}while(Math.hypot(x-player.x,y-player.y)<200);
  enemies.push({x,y,r:13,hp:24,sp:1+Math.random()*1.3});
}
function shoot(){if(!alive||!started||performance.now()-lastShot<150)return;lastShot=performance.now();bullets.push({x:player.x,y:player.y,a:player.ang,sp:10,dmg:14});}
function hitObstacle(x,y){for(const o of obstacles)if(x>o.x&&x<o.x+o.w&&y>o.y&&y<o.y+o.h)return true;return false;}
function loop(){
  requestAnimationFrame(loop);
  if(!started||!alive)return;
  let dx=0,dy=0;
  if(keys['w']||keys['arrowup'])dy-=1;if(keys['s']||keys['arrowdown'])dy+=1;
  if(keys['a']||keys['arrowleft'])dx-=1;if(keys['d']||keys['arrowright'])dx+=1;
  if(dx||dy){const l=Math.hypot(dx,dy);const nx=player.x+dx/l*player.speed,ny=player.y+dy/l*player.speed;if(!hitObstacle(nx,ny)){player.x=nx;player.y=ny;}}
  player.x=Math.max(player.r,Math.min(W-player.r,player.x));player.y=Math.max(player.r,Math.min(H-player.r,player.y));
  player.ang=Math.atan2(mouse.y-player.y,mouse.x-player.x);
  for(const b of bullets){b.x+=Math.cos(b.a)*b.sp;b.y+=Math.sin(b.a)*b.sp;}
  bullets=bullets.filter(b=>b.x>=-10&&b.x<=W+10&&b.y>=-10&&b.y<=H+10);
  for(const e of enemies){const a=Math.atan2(player.y-e.y,player.x-e.x);e.x+=Math.cos(a)*e.sp;e.y+=Math.sin(a)*e.sp;
    if(Math.hypot(e.x-player.x,e.y-player.y)<e.r+player.r)player.hp-=0.35;}
  for(const b of bullets){for(const e of enemies){if(Math.hypot(b.x-e.x,b.y-e.y)<e.r){e.hp-=b.dmg;b.dead=true;}}}
  bullets=bullets.filter(b=>!b.dead);
  for(const e of enemies)if(e.hp<=0){e.dead=true;score+=10;}
  enemies=enemies.filter(e=>!e.dead);
  if(player.hp<=0){alive=false;over(false);}
  if(enemies.length===0){spawnTimer++;if(spawnTimer>40){spawnTimer=0;nextWave();}}
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#2a2f3a';for(const o of obstacles)ctx.fillRect(o.x,o.y,o.w,o.h);
  ctx.strokeStyle='rgba(255,255,255,.04)';for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  ctx.fillStyle='#ff5ea8';for(const e of enemies){ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill();}
  ctx.fillStyle='#ffd166';for(const b of bullets){ctx.beginPath();ctx.arc(b.x,b.y,3,0,7);ctx.fill();}
  ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.ang);
  ctx.fillStyle='#7b8cff';ctx.beginPath();ctx.arc(0,0,player.r,0,7);ctx.fill();ctx.fillStyle='#dfe4ff';ctx.fillRect(0,-3,player.r+10,6);ctx.restore();
  document.getElementById('hud').innerHTML='<b>HP '+Math.max(0,Math.ceil(player.hp))+'</b> &nbsp; 波次 <b>'+wave+'</b> &nbsp; 击杀 <b>'+score/10+'</b> &nbsp; 残敌 <b>'+enemies.length+'</b>';
}
function over(win){const o=document.getElementById('over');o.style.display='flex';document.getElementById('ot').textContent=win?'🎖 任务完成':'💀 阵亡';document.getElementById('os').textContent='击杀 '+score/10+' · 波次 '+wave;}
function startGame(){
  document.getElementById('start').style.display='none';
  started=true; restart(); loop();
}
loop();
</script>
</body>
</html>
