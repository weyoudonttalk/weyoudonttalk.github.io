<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>三角洲行动 · 手机版 3D · MIUI STUDIO</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,"PingFang SC",sans-serif;touch-action:none;overscroll-behavior:none}
  #cv{width:100%;height:100%;display:block}
  /* 准星 */
  #cross{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:26px;height:26px;pointer-events:none;z-index:5}
  #cross:before,#cross:after{content:"";position:absolute;background:#5ef0ff;box-shadow:0 0 4px #000}
  #cross:before{left:50%;top:0;width:2px;height:100%;transform:translateX(-50%)}
  #cross:after{top:50%;left:0;height:2px;width:100%;transform:translateY(-50%)}
  /* HUD */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:4;color:#dff;font-size:13px;text-shadow:0 1px 3px #000}
  #top{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;text-align:right;font-size:12px;color:#9fe}
  #bottom{position:absolute;left:14px;bottom:max(16px,env(safe-area-inset-bottom));width:46%}
  .bar{height:12px;border:1px solid #5ef0ff66;border-radius:7px;overflow:hidden;margin-bottom:5px;background:#0009}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,#ff5e5e,#ffb15e);width:100%;transition:width .15s}
  .bar.a>i{background:linear-gradient(90deg,#5ef0ff,#7b5cff)}
  #btxt{font-size:12px;color:#bfe}
  /* 虚拟摇杆 */
  #stick{position:fixed;left:0;bottom:0;width:45%;height:45%;z-index:6;pointer-events:auto}
  #stickBase{position:absolute;width:110px;height:110px;border:2px solid #5ef0ff55;border-radius:50%;left:30px;bottom:30px;display:none}
  #stickKnob{position:absolute;width:50px;height:50px;border-radius:50%;background:#5ef0ff33;border:2px solid #5ef0ff;left:30px;bottom:30px;display:none}
  /* 右侧视角区 */
  #look{position:fixed;right:0;bottom:0;width:55%;height:55%;z-index:6;pointer-events:auto}
  /* 按钮 */
  #fire{position:fixed;right:24px;bottom:max(90px,calc(env(safe-area-inset-bottom) + 90px));width:84px;height:84px;border-radius:50%;background:radial-gradient(circle,#ff5e5e,#b02a2a);border:3px solid #ffd1d1;z-index:7;pointer-events:auto;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:700;box-shadow:0 4px 14px #0008}
  #bag{position:fixed;right:22px;top:max(14px,env(safe-area-inset-top));width:52px;height:52px;border-radius:14px;background:#0d1626cc;border:1px solid #5ef0ff66;z-index:7;pointer-events:auto;display:flex;align-items:center;justify-content:center;font-size:22px;color:#5ef0ff}
  #pick{position:fixed;left:50%;bottom:34%;transform:translateX(-50%);background:#000b;border:1px solid #5ef0ff66;color:#cff;padding:8px 18px;border-radius:24px;font-size:14px;z-index:7;display:none;pointer-events:auto}
  #hit{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);color:#ff6b6b;font-size:24px;font-weight:800;opacity:0;transition:opacity .12s;z-index:5;text-shadow:0 2px 6px #000}
  /* 背包面板 */
  #bagPanel{position:fixed;inset:0;background:rgba(4,8,14,.9);z-index:20;display:none;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:8vh;color:#dfe}
  #bagPanel h2{font-size:22px;color:#5ef0ff;letter-spacing:3px;margin-bottom:4px}
  #bagPanel .sub{font-size:12px;color:#8ab;margin-bottom:18px}
  #grid{width:min(560px,92vw);display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .slot{background:#0d1626;border:1px solid #2a3a5a;border-radius:12px;padding:14px;text-align:center}
  .slot .ic{font-size:32px}.slot .nm{font-size:13px;margin-top:6px;color:#cde}.slot .ct{font-size:12px;color:#5ef0ff;margin-top:2px}
  .slot.e{opacity:.3}
  #bagPanel .close{margin-top:24px;padding:10px 30px;border:0;border-radius:24px;background:#1a2a44;color:#9cf;font-size:15px}
  /* 加载动画 + 真实进度条（大厂风） */
  #start{position:fixed;inset:0;background:rgba(4,7,13,.66);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#dfe;text-align:center;padding:0 24px;backdrop-filter:blur(2px)}
  #start h1{font-size:27px;letter-spacing:5px;margin-bottom:16px;font-weight:800;background:linear-gradient(90deg,#8aa0ff,#5ef0ff,#8aa0ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;background-size:220% auto;animation:tg 3s linear infinite;text-shadow:0 0 22px #5b8cff55}
  @keyframes tg{to{background-position:220% center}}
  #stage{position:relative;width:200px;height:200px;margin-bottom:14px}
  #stage canvas{position:absolute;inset:0;width:200px!important;height:200px!important;opacity:0;transition:opacity .6s}
  #rings{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity .5s}
  #rings b{position:absolute;border-radius:50%;border:2px solid transparent}
  #rings b:nth-child(1){width:172px;height:172px;border-top-color:#5ef0ff;border-right-color:#5ef0ff;animation:r1 1.6s linear infinite;box-shadow:0 0 16px #5ef0ff44}
  #rings b:nth-child(2){width:132px;height:132px;border-bottom-color:#7b5cff;border-left-color:#7b5cff;animation:r2 2.3s linear infinite}
  #rings b:nth-child(3){width:94px;height:94px;border-top-color:#5b8cff;border-bottom-color:#5b8cff;animation:r1 1.1s linear infinite}
  @keyframes r1{to{transform:rotate(360deg)}}
  @keyframes r2{to{transform:rotate(360deg)}}
  #pct{font-size:24px;font-weight:800;color:#5ef0ff;text-shadow:0 0 12px #5ef0ff66;margin-top:2px}
  #bar{width:min(300px,78vw);height:8px;border-radius:6px;overflow:hidden;background:#ffffff14;margin-top:14px}
  #barfill{height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#7b5cff,#5ef0ff,#8aa0ff,#5ef0ff);background-size:300% 100%;animation:flow 1.2s linear infinite;box-shadow:0 0 12px #5ef0ff88}
  @keyframes flow{to{background-position:300% 0}}
  #lmsg{font-size:12px;color:#8aa;margin-top:12px;min-height:16px;letter-spacing:1px}
  #startBtn{margin-top:22px;padding:13px 42px;border:0;border-radius:28px;background:linear-gradient(135deg,#7b5cff,#00d4ff);color:#fff;font-size:17px;font-weight:700;cursor:pointer;opacity:.35;pointer-events:none;transition:opacity .3s,transform .15s;box-shadow:0 6px 20px #5ef0ff44}
  #startBtn.on{opacity:1;pointer-events:auto;animation:bp 2s ease-in-out infinite}
  #startBtn.on:active{transform:scale(.96)}
  @keyframes bp{50%{box-shadow:0 6px 30px #5ef0ffaa}}

  #dead{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center}
  #dead h1{font-size:34px;color:#ff6b6b;margin-bottom:8px}
  #dead button{margin-top:20px;padding:12px 30px;border:0;border-radius:24px;background:linear-gradient(135deg,#7b5cff,#00d4ff);color:#fff;font-size:16px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="cross"></div>
<div id="hud">
  <div id="top">击杀 <span id="kills">0</span> · 残敌 <span id="enemyN">0</span></div>
  <div id="bottom">
    <div class="bar"><i id="hp"></i></div>
    <div class="bar a"><i id="am"></i></div>
    <div id="btxt"><span id="hpt">HP 100</span> · <span id="amt">弹药 30</span></div>
  </div>
</div>

<div id="stick"></div>
<div id="stickBase"></div><div id="stickKnob"></div>
<div id="look"></div>
<div id="fire">射击</div>
<div id="bag">🎒</div>
<div id="pick">点击拾取</div>
<div id="hit">命中！</div>

<div id="bagPanel">
  <h2>战 术 背 包</h2>
  <div class="sub">共 <span id="cap">0</span> 类物资</div>
  <div id="grid"></div>
  <button class="close" onclick="closeBag()">关闭</button>
</div>

<div id="start">
  <h1>三角洲行动</h1>
  <div id="stage">
    <div id="rings"><b></b><b></b><b></b></div>
    <canvas id="preview"></canvas>
  </div>
  <div id="pct">0%</div>
  <div id="bar"><div id="barfill"></div></div>
  <div id="lmsg">正在启动引擎…</div>
  <button id="startBtn">加载中…</button>
</div>

<div id="dead">
  <h1 id="deadT">阵亡</h1>
  <div id="deadS" style="color:#9ab;margin-top:6px"></div>
  <button onclick="location.reload()">重新部署</button>
</div>

<script>
(function(){
  window.__pageStart=performance.now();
  var b=document.getElementById('barfill'),p=document.getElementById('pct'),m=document.getElementById('lmsg');
  if(m)m.textContent='正在启动引擎…';
  window.__boot=setInterval(function(){
    var f=Math.min(0.99,(performance.now()-window.__pageStart)/24000);
    if(b)b.style.width=(f*100).toFixed(0)+'%';
    if(p)p.textContent=Math.floor(f*100)+'%';
  },150);
})();
</script>
<script type="importmap">
{ "imports": {
  "three": "./lib/three.module.js",
  "three/addons/": "./lib/addons/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { clone as skeClone } from 'three/addons/utils/SkeletonUtils.js';
if(window.__boot)clearInterval(window.__boot);
// 加载界面 3D 预览（复用主渲染器，不占额外 WebGL context）
let previewOn=false;
const previewScene=new THREE.Scene();previewScene.background=new THREE.Color(0x060a11);
const previewCam=new THREE.PerspectiveCamera(42,1,0.1,100);previewCam.position.set(0,1.1,4.4);
previewScene.add(new THREE.HemisphericLight(0xbfd8ff,0x223044,1.3));
const pdl=new THREE.DirectionalLight(0xffffff,1.6);pdl.position.set(3,5,4);previewScene.add(pdl);
const pCore=new THREE.Mesh(new THREE.IcosahedronGeometry(1.05,1),new THREE.MeshStandardMaterial({color:0x5b8cff,emissive:0x2244aa,emissiveIntensity:0.7,flatShading:true,metalness:0.3,roughness:0.4}));
const pWire=new THREE.Mesh(new THREE.IcosahedronGeometry(1.4,1),new THREE.MeshBasicMaterial({color:0x5ef0ff,wireframe:true,transparent:true,opacity:0.45}));
previewScene.add(pCore,pWire);
let pModel=null;
function setPreviewModel(gltf){
  if(!gltf)return;
  try{const m=gltf.scene;const box=new THREE.Box3().setFromObject(m);const c=box.getCenter(new THREE.Vector3());const sz=box.getSize(new THREE.Vector3());const maxd=Math.max(sz.x,sz.y,sz.z)||1;const sc=3.0/maxd;m.scale.setScalar(sc);m.position.set(-c.x*sc,-c.y*sc,-c.z*sc);if(pModel)previewScene.remove(pModel);previewScene.remove(pCore,pWire);previewScene.add(m);pModel=m;document.getElementById('preview').style.opacity='1';document.getElementById('rings').style.opacity='0';}catch(e){}
}
function renderPreview(){if(!previewOn)return;requestAnimationFrame(renderPreview);pCore.rotation.y+=0.012;pCore.rotation.x+=0.006;pWire.rotation.y-=0.01;if(pModel)pModel.rotation.y+=0.01;renderer.render(previewScene,previewCam);}
previewOn=true;renderPreview();

const cv=document.getElementById('cv');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x88ccee);
scene.fog=new THREE.Fog(0x88ccee,40,140);

const camera=new THREE.PerspectiveCamera(78,1,0.1,800);
camera.position.set(0,1.7,0);
scene.add(camera);

// 光照
const hemi=new THREE.HemisphericLight(0xbfe3ff,0x4a553f,1.0);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,1.4);
sun.position.set(40,80,20);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-120;sun.shadow.camera.right=120;sun.shadow.camera.top=120;sun.shadow.camera.bottom=-120;sun.shadow.camera.far=300;
scene.add(sun);

// 地面
const groundMat=new THREE.MeshStandardMaterial({color:0x4f6138,roughness:1});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(240,240),groundMat);
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

// 加载器 + 真实进度条（双保险：真实字节 + 时间兜底，绝不卡死）
const loader=new GLTFLoader();
const M={};let loaded=0,total=4;
const _files=[['Soldier.glb','soldier','士兵模型'],['rifle.glb','rifle','武器模型'],['house.glb','house','建筑模型'],['supply.glb','supply','物资模型']];
const _prog=new Array(total).fill(0);
const _bar=document.getElementById('barfill'),_pct=document.getElementById('pct'),_msg=document.getElementById('lmsg'),_btn=document.getElementById('startBtn');
const _pageStart=window.__pageStart||performance.now();
function _realP(){return _prog.reduce((a,b)=>a+b,0)/total;}
function _updateBar(){const f=Math.min(0.99,Math.max(_realP(),(performance.now()-_pageStart)/26000));_bar.style.width=(f*100).toFixed(0)+'%';_pct.textContent=Math.floor(f*100)+'%';}
const _iv=setInterval(_updateBar,150);
function done(i,g){M[_files[i][1]]=g;loaded++;_prog[i]=1;_updateBar();if(_files[i][1]==='soldier'&&g)setPreviewModel(g);if(loaded>=total)ready();}
_files.forEach(([f,k,name],i)=>{
  _msg.textContent='正在加载 '+name+' …';
  loader.load('./models/'+f,g=>done(i,g),
    xhr=>{if(xhr&&xhr.total){_prog[i]=xhr.loaded/xhr.total;_updateBar();}},
    ()=>done(i,null));
});
function ready(){clearInterval(_iv);_prog.fill(1);_updateBar();_pct.textContent='100%';_msg.textContent='加载完成 · 准备就绪';_btn.classList.add('on');_btn.textContent='进入战场';build();}

const P={hp:100,am:30,amMax:30,kills:0,alive:true,reloadAt:0,lastShot:0};
const enemies=[],loots=[],houses=[];
const bag={med:0,ammo:0,armor:0,food:0};
const bagMeta={med:{ic:'💊',nm:'医疗包'},ammo:{ic:'🔫',nm:'弹药包'},armor:{ic:'🛡️',nm:'护甲片'},food:{ic:'🍱',nm:'口粮'}};

function build(){
  // 房屋
  if(M.house)for(let i=0;i<6;i++){const h=M.house.scene.clone();const s=1.4;h.scale.set(s,s,s);h.position.set((Math.random()-0.5)*150,(0), (Math.random()-0.5)*150);h.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});scene.add(h);houses.push(h);}
  // 武器挂相机
  if(M.rifle){const w=M.rifle.scene;w.scale.set(8,8,8);w.position.set(0.32,-0.28,0.55);w.rotation.set(0,Math.PI,0);camera.add(w);window._w=w;}
  // 物资点
  for(let i=0;i<6;i++)spawnLoot((Math.random()-0.5)*120,(Math.random()-0.5)*120);
  // 敌人
  spawnWave(5);
  started=true;
  if(document.getElementById('start').style.display==='none' && !window.__loopStarted){window.__loopStarted=true;loop();}
}

function spawnLoot(x,z){
  if(!M.supply){loots.push({mesh:mkBox(x,z),type:randType()});return;}
  const m=M.supply.scene.clone();m.scale.set(2,2,2);m.position.set(x,0.6,z);m.traverse(o=>{if(o.isMesh)o.castShadow=true;});
  scene.add(m);loots.push({mesh:m,type:randType()});
}
function mkBox(x,z){const b=new THREE.Mesh(new THREE.BoxGeometry(0.8,0.6,0.8),new THREE.MeshStandardMaterial({color:0xffcc33,emissive:0x553300}));b.position.set(x,0.3,z);scene.add(b);return b;}
function randType(){const k=Object.keys(bagMeta);return k[Math.floor(Math.random()*k.length)];}

function spawnWave(n){
  for(let i=0;i<n;i++){
    let x,z;do{x=(Math.random()-0.5)*160;z=(Math.random()-0.5)*160;}while(Math.hypot(x-camera.position.x,z-camera.position.z)<35);
    if(!M.soldier){const d=new THREE.Mesh(new THREE.CapsuleGeometry(0.4,1.2,4,8),new THREE.MeshStandardMaterial({color:0xc0392b}));d.position.set(x,1,z);scene.add(d);enemies.push({root:d,mixer:null,hp:60,sp:1.6});continue;}
    const root=skeClone(M.soldier.scene);
    root.scale.set(0.9,0.9,0.9);
    root.position.set(x,0,z);root.traverse(o=>{if(o.isMesh)o.castShadow=true;});
    scene.add(root);
    const mixer=new THREE.AnimationMixer(root);
    const walk=M.soldier.animations.find(a=>a.name==='Walk')||M.soldier.animations[1];
    if(walk)mixer.clipAction(walk).play();
    enemies.push({root,mixer,hp:60,sp:1.6+Math.random()*0.6});
  }
  updateHUD();
}

// 射击
const ray=new THREE.Raycaster();
function shoot(){
  if(!P.alive||P.am<=0||performance.now()-P.lastShot<150)return;
  P.lastShot=performance.now();P.am--;updateHUD();
  if(window._w){window._w.position.z=0.45;setTimeout(()=>window._w.position.z=0.55,70);}
  ray.setFromCamera({x:0,y:0},camera);
  let best=1e9,hit=null;
  for(const e of enemies){const m=e.root;const hits=ray.intersectObject(m,true);if(hits.length&&hits[0].distance<best){best=hits[0].distance;hit=e;}}
  if(hit){hit.hp-=24;flashHit();if(hit.hp<=0){const p=hit.root.position.clone();scene.remove(hit.root);enemies.splice(enemies.indexOf(hit),1);P.kills++;if(Math.random()<0.6)spawnLoot(p.x,p.z);spawnWave(1);}}
  updateHUD();
}

// 触摸控制
let yaw=0,pitch=0;
const stick=document.getElementById('stick'),base=document.getElementById('stickBase'),knob=document.getElementById('stickKnob');
let stickId=null,sx=0,sy=0,mx=0,my=0;
stick.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];stickId=t.identifier;sx=t.clientX;sy=t.clientY;base.style.display=knob.style.display='block';base.style.left=knob.style.left=(t.clientX-55)+'px';base.style.bottom=knob.style.bottom=(innerHeight-t.clientY-55)+'px';},{passive:false});
stick.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===stickId){let dx=t.clientX-sx,dy=t.clientY-sy;const d=Math.hypot(dx,dy),max=45;if(d>max){dx*=max/d;dy*=max/d;}knob.style.left=(parseFloat(base.style.left)+55+dx-25)+'px';knob.style.bottom=(parseFloat(base.style.bottom)+55+dy-25)+'px';mx=dx/max;my=dy/max;}},{passive:false});
stick.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===stickId){stickId=null;mx=my=0;base.style.display=knob.style.display='none';}},{passive:false});

const look=document.getElementById('look');
let lookId=null,lx=0,ly=0;
look.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];lookId=t.identifier;lx=t.clientX;ly=t.clientY;},{passive:false});
look.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===lookId){const dx=(t.clientX-lx)*0.004,dy=(t.clientY-ly)*0.004;yaw-=dx;pitch=Math.max(-1.2,Math.min(1.2,pitch-dy));lx=t.clientX;ly=t.clientY;}},{passive:false});
look.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===lookId)lookId=null;},{passive:false});

document.getElementById('fire').addEventListener('touchstart',e=>{e.preventDefault();shoot();});
document.getElementById('bag').addEventListener('touchstart',e=>{e.preventDefault();openBag();});
document.getElementById('pick').addEventListener('touchstart',e=>{e.preventDefault();doPick();});

let nearLoot=null;
function doPick(){if(nearLoot){bag[nearLoot.type]++;scene.remove(nearLoot.mesh);loots.splice(loots.indexOf(nearLoot),1);nearLoot=null;renderBag();flashHit('#5ef0ff','+1');}}

// 背包
const bagPanel=document.getElementById('bagPanel'),grid=document.getElementById('grid'),capEl=document.getElementById('cap');
function openBag(){bagPanel.style.display='flex';renderBag();}
window.closeBag=()=>bagPanel.style.display='none';
function renderBag(){let n=0;grid.innerHTML='';for(const k in bagMeta){if(bag[k]>0){n++;const s=document.createElement('div');s.className='slot';s.innerHTML=`<div class="ic">${bagMeta[k].ic}</div><div class="nm">${bagMeta[k].nm}</div><div class="ct">x${bag[k]}</div>`;grid.appendChild(s);}}capEl.textContent=n;}

// HUD
const hpEl=document.getElementById('hp'),amEl=document.getElementById('am'),hpt=document.getElementById('hpt'),amt=document.getElementById('amt'),killsEl=document.getElementById('kills'),enemyN=document.getElementById('enemyN'),hitEl=document.getElementById('hit'),pickEl=document.getElementById('pick');
function updateHUD(){hpEl.style.width=Math.max(0,P.hp)+'%';amEl.style.width=(P.am/P.amMax*100)+'%';hpt.textContent='HP '+Math.ceil(P.hp);amt.textContent='弹药 '+P.am;killsEl.textContent=P.kills;enemyN.textContent=enemies.length;}
let hitT=0;function flashHit(c='#ff6b6b',t='命中！'){hitEl.style.color=c;hitEl.textContent=t;hitEl.style.opacity=1;hitT=performance.now()+250;}

// 主循环
let started=false,last=performance.now();
function loop(){
  requestAnimationFrame(loop);
  const now=performance.now(),dt=Math.min(0.05,(now-last)/1000);last=now;
  if(started&&P.alive){
    // 移动
    const fwd=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw));
    const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
    const move=new THREE.Vector3();
    move.addScaledVector(fwd,-my);move.addScaledVector(right,mx);
    if(move.length()>1)move.normalize();
    camera.position.addScaledVector(move,4.5*dt);
    camera.position.y=1.7;
    camera.position.x=Math.max(-118,Math.min(118,camera.position.x));
    camera.position.z=Math.max(-118,Math.min(118,camera.position.z));
    camera.rotation.set(pitch,yaw,0,'YXZ');
    // 敌人
    for(const e of enemies){const dx=camera.position.x-e.root.position.x,dz=camera.position.z-e.root.position.z;const l=Math.hypot(dx,dz);if(l>0.1){e.root.position.x+=dx/l*e.sp*dt;e.root.position.z+=dz/l*e.sp*dt;e.root.rotation.y=Math.atan2(dx,dz);}if(e.mixer)e.mixer.update(dt);if(l<2&&now-e._dmg>700){P.hp-=6;e._dmg=now;updateHUD();}}
    // 换弹
    if(P.reloadAt&&now>P.reloadAt){P.am=P.amMax;P.reloadAt=0;updateHUD();}
    // 物资
    nearLoot=null;let bd=2.4;for(const l of loots){l.mesh.rotation.y+=dt*1.5;const d=Math.hypot(camera.position.x-l.mesh.position.x,camera.position.z-l.mesh.position.z);if(d<bd){bd=d;nearLoot=l;}}
    pickEl.style.display=nearLoot?'block':'none';
    if(hitT&&now>hitT){hitEl.style.opacity=0;hitT=0;}
    if(P.hp<=0){P.alive=false;die(false);}
    if(enemies.length===0)die(true);
  }
  renderer.render(scene,camera);
}
function die(win){document.getElementById('dead').style.display='flex';document.getElementById('deadT').textContent=win?'🎖 任务完成':'💀 阵亡';document.getElementById('deadS').textContent='击杀 '+P.kills;}

function resize(){const w=innerWidth,h=innerHeight;camera.aspect=w/h;camera.updateProjectionMatrix();previewCam.aspect=w/h;previewCam.updateProjectionMatrix();renderer.setSize(w,h);}
addEventListener('resize',resize);resize();

window.__loopStarted=false;
document.getElementById('startBtn').addEventListener('click',()=>{
  if(!started)return;
  previewOn=false;
  document.getElementById('start').style.display='none';
  if(!window.__loopStarted){window.__loopStarted=true;loop();}
});
</script>
</body>
