<!DOCTYPE html><html lang="zh"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>直升机 · 飞行模拟</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#87ceeb;touch-action:none;font-family:system-ui}
#g{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;display:none}
#altBox{position:absolute;top:14px;right:14px;text-align:right}
#altBox span{font-size:22px;font-weight:900;color:#fff;display:block;text-shadow:0 0 12px rgba(0,0,0,.5)}
#altBox i{font-size:7px;color:rgba(255,255,255,.5)}
#spdBox{position:absolute;top:44px;right:14px;text-align:right}
#spdBox span{font-size:15px;font-weight:900;color:#fff;display:block}
#spdBox i{font-size:6px;color:rgba(255,255,255,.4)}
#lockUI{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:none}
#lockUI.on{display:block}
#lockUI div{width:50px;height:50px;border:3px solid rgba(255,60,0,.8);border-radius:50%;margin:0 auto;animation:lP 1s infinite}
@keyframes lP{0%,100%{border-color:rgba(255,60,0,.8)}50%{border-color:rgba(255,0,0,.2)}}
#lockUI p{text-align:center;color:#f40;font-size:9px;margin-top:3px}
#stickBox{position:absolute;bottom:36px;left:16px;width:88px;height:88px;pointer-events:auto;touch-action:none}
#stickBox .bg{width:100%;height:100%;border-radius:50%;background:rgba(255,255,255,.04);border:2px solid rgba(255,255,255,.12)}
#stickBox .kn{position:absolute;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.18);top:50%;left:50%;margin:-20px 0 0 -20px}
#btns{position:absolute;bottom:50px;right:14px;z-index:5;display:flex;flex-direction:column;gap:6px;pointer-events:auto}
#btns button{width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.18);color:#fff;font-size:16px;cursor:pointer;touch-action:manipulation}
#btns button:active{background:rgba(255,100,0,.3);border-color:#f60}
#msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:13px;z-index:99;background:rgba(0,0,0,.75);padding:8px 20px;border-radius:8px}
</style></head><body>

<canvas id="g"></canvas>
<div id="hud">
  <div id="altBox"><span id="av">0</span><i>M</i></div>
  <div id="spdBox"><span id="sv">0</span><i>KM/H</i></div>
  <div id="lockUI"><div></div><p>锁定中…</p></div>
</div>
<div id="stickBox"><div class="bg"></div><div class="kn" id="knob"></div></div>
<div id="btns">
  <button id="upBtn">⬆</button>
  <button id="downBtn">⬇</button>
  <button id="fireBtn">🎯</button>
</div>
<div id="msg">⚡ 加载引擎…</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(function(){
if(typeof THREE==='undefined'){document.getElementById('msg').textContent='⚠ THREE.js加载失败';return}

var M=document.getElementById('msg');
M.textContent='🏗 场景…';

// 场景
var S=new THREE.Scene();S.background=new THREE.Color(0x87ceeb);S.fog=new THREE.Fog(0x87ceeb,200,800);
var C=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,0.5,600);
C.position.set(10,6,6);C.lookAt(0,1.5,0);
var R=new THREE.WebGLRenderer({canvas:document.getElementById('g'),antialias:true});R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,2));

S.add(new THREE.AmbientLight(0xffffff,1.5));
S.add(new THREE.DirectionalLight(0xffffff,0.7)).position.set(100,200,80);

// 地面
S.add(new THREE.Mesh(new THREE.PlaneGeometry(600,600),new THREE.MeshBasicMaterial({color:0x338833}))).rotation.x=-Math.PI/2;

// 停机坪
var pcv=document.createElement('canvas');pcv.width=256;pcv.height=256;var pcx=pcv.getContext('2d');pcx.fillStyle='#333';pcx.fillRect(0,0,256,256);pcx.strokeStyle='#fff';pcx.lineWidth=12;pcx.strokeRect(18,18,220,220);pcx.fillStyle='#fff';pcx.font='bold 130px sans-serif';pcx.textAlign='center';pcx.fillText('H',128,172);
S.add(new THREE.Mesh(new THREE.PlaneGeometry(10,10),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(pcv),transparent:true}))).rotation.x=-Math.PI/2;

// 建筑
var bcol=[0x8899aa,0x667788,0x99aabb,0xccccdd];
for(var i=0;i<50;i++){var a=Math.random()*Math.PI*2,d=30+Math.random()*140,x=Math.cos(a)*d,z=Math.sin(a)*d;if(Math.hypot(x,z)<20)continue;var h=10+Math.random()*55;S.add(new THREE.Mesh(new THREE.BoxGeometry(5+Math.random()*14,h,5+Math.random()*14),new THREE.MeshBasicMaterial({color:bcol[i%4]}))).position.set(x,h/2,z)}

// 靶子
var targets=[];
for(var i=0;i<8;i++){var a=i/8*Math.PI*2,d=50+Math.random()*80;var t=new THREE.Mesh(new THREE.SphereGeometry(1.5,10,10),new THREE.MeshBasicMaterial({color:0xff0000}));t.position.set(Math.cos(a)*d,4,Math.sin(a)*d);S.add(t);targets.push({mesh:t,alive:true})}

// 飞行器组
var aircraft=new THREE.Group();
// 加载时放一个粉色圆柱占位（一眼可见）
var tmp=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.4,2,16),new THREE.MeshBasicMaterial({color:0xff00ff}));
tmp.position.y=1;aircraft.add(tmp);
S.add(aircraft);

// ==== GLB 加载 ====
// 用 fetch + 手动解析（不依赖 GLTFLoader UMD 异步）
(function loadGLB(){
  var url='https://raw.githubusercontent.com/srcejon/sdrangel-3d-models/main/helicopter.glb';
  M.textContent='⚡ 下载模型…';
  var xhr=new XMLHttpRequest();
  xhr.open('GET',url,true);
  xhr.responseType='arraybuffer';
  xhr.onprogress=function(e){if(e.lengthComputable){var p=Math.floor(e.loaded/e.total*100);M.textContent='⚡ 下载模型… '+p+'%'}};
  xhr.onload=function(){
    if(xhr.status!==200){M.textContent='⚠ 下载失败 code:'+xhr.status;return}
    M.textContent='🔧 解析模型…';
    var data=new Uint8Array(xhr.response);
    // 用 Three.js 内置的解压缩库（Draco）
    parseGLB(data);
  };
  xhr.onerror=function(){M.textContent='⚠ 网络错误'};
  xhr.send();
})();

function parseGLB(buf){
  // 直接用 GLTFLoader
  // Three.js 0.160 兼容的加载方式
  var loader=new THREE.GLTFLoader?null:null;
  // Try to use the built-in loader from the module
  // Since we're using the UMD build, THREE.GLTFLoader isn't available
  // We need to dynamically import or use fetch+makeGLTF
  
  // Fallback: use a simple inline parser for basic GLB
  // Actually, let's dynamically load the GLTFLoader from examples/js
  
  // Easiest: create a script tag for examples/js/loaders/GLTFLoader.js
  M.textContent='🔧 加载解析器…';
  var s2=document.createElement('script');
  s2.src='https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js';
  s2.onload=function(){
    if(!THREE.GLTFLoader){M.textContent='⚠ 解析器加载失败';return}
    M.textContent='🔧 解析模型…';
    var loader=new THREE.GLTFLoader();
    loader.parse(buf,'',function(gltf){
      while(aircraft.children.length)aircraft.remove(aircraft.children[0]);
      var model=gltf.scene;
      model.traverse(function(c){if(c.isMesh){if(c.material&&!c.material.isMeshBasicMaterial){var cl=c.material.color?c.material.color.getHex():0x888888;c.material=new THREE.MeshBasicMaterial({color:cl})}else if(!c.material){c.material=new THREE.MeshBasicMaterial({color:0x888888})}}});
      model.scale.setScalar(0.12);
      model.rotation.y=Math.PI;
      aircraft.add(model);
      M.textContent='🚁 就绪';
      document.getElementById('hud').style.display='block';
      setTimeout(function(){M.style.opacity='0';setTimeout(function(){M.style.display='none'},500)},400);
    },function(err){M.textContent='⚠ 解析失败:'+err.message});
  };
  s2.onerror=function(){M.textContent='⚠ GLTFLoader加载失败'};
  document.head.appendChild(s2);
}

// ===== 状态 =====
var hx=0,hy=2.0,hz=0,vy3=0,hs3=0,pitch3=0,yaw3=0,thr3=0,onGnd=true;
var view3=0,locked3=false,lkSt3=0,miss3=[];

// ===== 输入 =====
var keys={};
document.addEventListener('keydown',function(e){keys[e.key.toLowerCase()]=true;e.key===' '&&e.preventDefault()});
document.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false});

// 摇杆
var sId=null,sX=0,sY=0,sFwd=0,sSide=0,sLift=0;
var st=document.getElementById('stickBox'),kn=document.getElementById('knob');
st.addEventListener('touchstart',function(e){e.preventDefault();e.stopPropagation();sId=e.touches[0].identifier;var r=st.getBoundingClientRect();sX=r.left+r.width/2;sY=r.top+r.height/2},{passive:false});
st.addEventListener('touchmove',function(e){e.preventDefault();e.stopPropagation();for(var i=0;i<e.touches.length;i++)if(e.touches[i].identifier===sId){var dx=e.touches[i].clientX-sX,dy=e.touches[i].clientY-sY,dd=Math.min(38,Math.hypot(dx,dy))/38,ag=Math.atan2(dy,dx);sFwd=-dy/38;sSide=dx/38;kn.style.transform='translate('+(Math.cos(ag)*dd*34)+'px,'+(Math.sin(ag)*dd*34)+'px)';break}},{passive:false});
st.addEventListener('touchend',function(e){e.preventDefault();sId=null;sFwd=0;sSide=0;kn.style.transform='translate(0,0)'},{passive:false});

// 按钮
document.getElementById('upBtn').addEventListener('touchstart',function(e){e.preventDefault();sLift=1},{passive:false});
document.getElementById('upBtn').addEventListener('touchend',function(e){e.preventDefault();sLift=0},{passive:false});
document.getElementById('downBtn').addEventListener('touchstart',function(e){e.preventDefault();sLift=-0.3},{passive:false});
document.getElementById('downBtn').addEventListener('touchend',function(e){e.preventDefault();sLift=0},{passive:false});
document.getElementById('upBtn').addEventListener('mousedown',function(e){e.preventDefault();sLift=1});
document.getElementById('upBtn').addEventListener('mouseup',function(e){e.preventDefault();sLift=0});
document.getElementById('downBtn').addEventListener('mousedown',function(e){e.preventDefault();sLift=-0.3});
document.getElementById('downBtn').addEventListener('mouseup',function(e){e.preventDefault();sLift=0});
document.getElementById('fireBtn').addEventListener('touchstart',function(e){e.preventDefault();if(locked3)return;var cl=null,cd=Infinity;for(var i=0;i<targets.length;i++){if(!targets[i].alive)continue;var dd=Math.hypot(targets[i].mesh.position.x-hx,targets[i].mesh.position.z-hz);if(dd<cd){cd=dd;cl=targets[i]}}if(!cl||cd>130)return;locked3=true;lkSt3=performance.now();document.getElementById('lockUI').classList.add('on');setTimeout(function(){if(!locked3)return;var m=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.04,0.35,8),new THREE.MeshBasicMaterial({color:0xcccccc}));m.position.copy(aircraft.position);m.position.y+=0.3;S.add(m);miss3.push({mesh:m,target:cl,born:performance.now()});locked3=false;document.getElementById('lockUI').classList.remove('on')},1200)},{passive:false});

// ===== 滑动旋转视角 =====
var camYaw=0,camPitch=Math.PI/4; // 球坐标初始值
var camDist=12;
var rotId=null,rotX=0,rotY=0,rotDeltaX=0,rotDeltaY=0;

// 监听整个canvas的滑动（非摇杆区域的滑动用来转视角）
var canvasEl=document.getElementById('g');
var isStickTouch=false;

// 摇杆区域内标记
st.addEventListener('touchstart',function(e){isStickTouch=true},{passive:false});
st.addEventListener('touchend',function(e){isStickTouch=false},{passive:false});

canvasEl.addEventListener('touchstart',function(e){
  if(isStickTouch||e.touches.length>1)return;
  // 只处理透明区域（非按钮区域）的单指滑动
  if(e.target===canvasEl){
    rotId=e.touches[0].identifier;
    rotX=e.touches[0].clientX;rotY=e.touches[0].clientY;
  }
},{passive:false});

canvasEl.addEventListener('touchmove',function(e){
  if(rotId===null||isStickTouch)return;
  for(var i=0;i<e.touches.length;i++){
    if(e.touches[i].identifier===rotId){
      rotDeltaX=e.touches[i].clientX-rotX;
      rotDeltaY=e.touches[i].clientY-rotY;
      camYaw-=rotDeltaX*0.005;
      camPitch+=rotDeltaY*0.003;
      camPitch=Math.max(0.2,Math.min(1.5,camPitch));
      rotX=e.touches[i].clientX;rotY=e.touches[i].clientY;
      break;
    }
  }
},{passive:false});

canvasEl.addEventListener('touchend',function(e){
  rotId=null;rotDeltaX=0;rotDeltaY=0;
},{passive:false});

// 鼠标滚轮缩放（电脑）
canvasEl.addEventListener('wheel',function(e){
  e.preventDefault();
  camDist+=e.deltaY*0.01;
  camDist=Math.max(4,Math.min(40,camDist));
},{passive:false});

// ===== 主循环 =====
var pt=performance.now();
function tick(now){
  requestAnimationFrame(tick);
  var dt=(now-pt)/1000;pt=now;if(dt<=0||dt>0.3)dt=0.016;

  if(keys['w']||keys['arrowup'])sFwd=1;else if(keys['s']||keys['arrowdown'])sFwd=-1;else if(sId===null)sFwd*=0.88;
  if(keys['a']||keys['arrowleft'])sSide=-1;else if(keys['d']||keys['arrowright'])sSide=1;else if(sId===null)sSide*=0.88;
  if(keys['shift'])sLift=Math.min(1,sLift+0.03);else if(keys['control'])sLift=Math.max(-0.3,sLift-0.03);

  thr3+=(sLift-thr3)*Math.min(dt*3,1);
  if(onGnd)thr3=Math.max(0,thr3);
  vy3+=(thr3*14-9.8)*dt;vy3*=0.98;hy+=vy3*dt;
  if(hy<2.0){hy=2.0;vy3=0;onGnd=true}else onGnd=false;

  pitch3+=(sFwd*0.5-pitch3)*Math.min(dt*2.5,1);
  yaw3+=sSide*0.04;
  hs3+=(pitch3*10-hs3*0.6)*dt;hs3*=0.97;
  var cy=Math.cos(yaw3),sy=Math.sin(yaw3);
  hx+=cy*hs3*dt;hz+=sy*hs3*dt;
  hx=Math.max(-300,Math.min(300,hx));hz=Math.max(-300,Math.min(300,hz));hy=Math.max(2.0,Math.min(200,hy));

  for(var mi=miss3.length-1;mi>=0;mi--){
    var ms=miss3[mi],tx=ms.target.mesh.position.x-ms.mesh.position.x,tz=ms.target.mesh.position.z-ms.mesh.position.z,td=Math.sqrt(tx*tx+tz*tz);
    if(td<2.5){ms.target.alive=false;ms.target.mesh.visible=false;S.remove(ms.mesh);miss3.splice(mi,1);continue}
    ms.mesh.position.x+=tx/td*40*dt;ms.mesh.position.z+=tz/td*40*dt;ms.mesh.position.y+=0.3*dt;ms.mesh.lookAt(ms.target.mesh.position);
    if(now-ms.born>6000){S.remove(ms.mesh);miss3.splice(mi,1)}
  }
  if(locked3)document.getElementById('lockUI').classList.add('on');

  // 相机：用球坐标系，可以手动旋转
  var lx=hx+Math.cos(camYaw)*Math.cos(camPitch)*camDist;
  var ly=hy+Math.sin(camPitch)*camDist;
  var lz=hz+Math.sin(camYaw)*Math.cos(camPitch)*camDist;
  C.position.set(lx,ly,lz);
  C.lookAt(hx,hy,hz);

  aircraft.position.set(hx,hy,hz);aircraft.rotation.y=yaw3;aircraft.rotation.x=-pitch3*0.3;

  document.getElementById('av').textContent=Math.floor(hy*3);
  document.getElementById('sv').textContent=Math.abs(Math.floor(hs3*3.2));
  R.render(S,C);
}

// 预渲染循环（GLB加载完成前也能看到场景+粉色占位）
function bgLoop(){requestAnimationFrame(bgLoop);R.render(S,C)}
bgLoop();

// 模型加载完成后切换循环
var origTick=requestAnimationFrame;
var tickStarted=false;
var checkInterval=setInterval(function(){
  if(document.getElementById('hud').style.display==='block'&&!tickStarted){
    tickStarted=true;
    cancelAnimationFrame(bgLoop.caller);
    pt=performance.now();
    requestAnimationFrame(tick);
    clearInterval(checkInterval);
  }
},500);

window.addEventListener('resize',function(){C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});

})();
</script>
</body></html>
