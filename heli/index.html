<!DOCTYPE html><html lang="zh"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>黑鹰直升机 · 飞行模拟</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#87ceeb;font-family:system-ui;touch-action:none}
#g{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none}
#altBox{position:absolute;top:14px;right:14px;text-align:right}
#altBox b{font-size:30px;font-weight:900;color:#fff;display:block}
#altBox i{font-size:9px;color:rgba(255,255,255,.5)}
#spdBox{position:absolute;top:54px;right:14px;text-align:right}
#spdBox b{font-size:20px;font-weight:900;color:#fff;display:block}
#spdBox i{font-size:8px;color:rgba(255,255,255,.4)}
#lockUI{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:none}
#lockUI.on{display:block}
#lockUI div{width:60px;height:60px;border:3px solid rgba(255,60,0,.8);border-radius:50%;margin:0 auto;animation:lP 1s infinite}
@keyframes lP{0%,100%{border-color:rgba(255,60,0,.8)}50%{border-color:rgba(255,0,0,.2)}}
#lockUI p{text-align:center;color:#f40;font-size:10px;margin-top:4px}
#stickBox{position:absolute;bottom:36px;left:16px;width:88px;height:88px;pointer-events:auto;touch-action:none}
#stickBox .bg{width:100%;height:100%;border-radius:50%;background:rgba(255,255,255,.04);border:2px solid rgba(255,255,255,.12)}
#stickBox .kn{position:absolute;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.18);top:50%;left:50%;margin:-20px 0 0 -20px}
#btns{position:absolute;bottom:50px;right:14px;z-index:5;display:flex;flex-direction:column;gap:6px;pointer-events:auto}
#btns button{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.15);color:#fff;font-size:16px;cursor:pointer;touch-action:manipulation}
#btns button:active{background:rgba(255,100,0,.3);border-color:#f60}
#views{position:absolute;top:50%;right:6px;transform:translateY(-50%);display:flex;flex-direction:column;gap:3px;pointer-events:auto}
#views button{width:26px;height:26px;border-radius:5px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:9px;cursor:pointer}
#views button.sel{background:rgba(255,100,0,.25);border-color:#f60}
#msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:13px;z-index:99;background:rgba(0,0,0,.7);padding:8px 20px;border-radius:8px}
</style></head><body>

<canvas id="g"></canvas>

<div id="hud">
  <div id="altBox"><b id="altV">0</b><i>METERS</i></div>
  <div id="spdBox"><b id="spdV">0</b><i>KM/H</i></div>
  <div id="lockUI"><div></div><p>锁定中…</p></div>
</div>
<div id="stickBox"><div class="bg"></div><div class="kn" id="knob"></div></div>
<div id="btns">
  <button id="fireBtn">🎯</button>
</div>
<div id="views">
  <button class="sel" id="v0">☁️</button>
  <button id="v1">🎥</button>
  <button id="v2">🛰</button>
</div>
<div id="msg">⚡ 加载中…</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
// 极简版——不用任何辅助函数，所有 Three.js 调用都是原生的
(function(){
  if(typeof THREE==='undefined')return alert('THREE.JS 加载失败');

  var msg=document.getElementById('msg');
  msg.textContent='生成场景…';

  // 场景/相机/渲染器
  var scene=new THREE.Scene();
  scene.background=new THREE.Color(0x87ceeb);
  var camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,1,600);
  camera.position.set(20,15,20);camera.lookAt(0,2,0);

  var renderer=new THREE.WebGLRenderer({canvas:document.getElementById('g'),antialias:true});
  renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled=true;

  // 光照
  scene.add(new THREE.AmbientLight(0x8899bb,0.6));
  var sun=new THREE.DirectionalLight(0xfff5e0,1.4);sun.position.set(100,150,80);sun.castShadow=true;
  sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.far=500;
  sun.shadow.camera.left=-100;sun.shadow.camera.right=100;
  sun.shadow.camera.top=100;sun.shadow.camera.bottom=-100;
  scene.add(sun);

  // 地面——大绿色平面
  var groundGeo=new THREE.PlaneGeometry(600,600);
  var groundMat=new THREE.MeshStandardMaterial({color:0x338833,roughness:0.9});
  var ground=new THREE.Mesh(groundGeo,groundMat);
  ground.rotation.x=-Math.PI/2;ground.position.y=-0.1;ground.receiveShadow=true;scene.add(ground);

  // 几个红色靶子
  var targets=[];
  for(var i=0;i<8;i++){
    var a=(i/8)*Math.PI*2,d=40+Math.random()*60;
    var t=new THREE.Mesh(new THREE.BoxGeometry(2,2,2),new THREE.MeshStandardMaterial({color:0xff0000}));
    t.position.set(Math.cos(a)*d,1,Math.sin(a)*d);t.castShadow=true;scene.add(t);
    targets.push({mesh:t,x:t.position.x,z:t.position.z,dead:false});
  }

  // === 直升机——没用函数，直接 new THREE.Mesh() ===
  var heli=new THREE.Group();

  // 机身(Lathe曲面)
  var fuselagePts=[];
  for(var i=0;i<=24;i++){
    var t=i/24,x=t*7-2.5,r;
    if(t<0.08)r=0.08+t*0.35;else if(t<0.18)r=0.30+(t-0.08)*0.22/0.10;
    else if(t<0.38)r=0.48+Math.sin((t-0.18)/0.20*Math.PI)*0.15;
    else if(t<0.62)r=0.50;else if(t<0.80)r=0.50-(t-0.62)*0.28/0.18;
    else r=0.18-(t-0.80)*0.12/0.20;
    fuselagePts.push(new THREE.Vector2(r,x));
  }
  var fuselage=new THREE.Mesh(new THREE.LatheGeometry(fuselagePts,32),new THREE.MeshStandardMaterial({color:0x222233,roughness:0.25,metalness:0.6}));
  fuselage.castShadow=true;heli.add(fuselage);

  // 发动机罩
  var engineCover=new THREE.Mesh(new THREE.BoxGeometry(2.5,0.15,0.4),new THREE.MeshStandardMaterial({color:0x444455,roughness:0.2}));
  engineCover.position.set(0,0.45,0);engineCover.castShadow=true;heli.add(engineCover);

  // 尾梁
  var tailBoom=new THREE.Mesh(new THREE.BoxGeometry(3.2,0.08,0.1),new THREE.MeshStandardMaterial({color:0x444455,roughness:0.2}));
  tailBoom.position.set(2.8,0.25,0);tailBoom.castShadow=true;heli.add(tailBoom);

  // 垂尾
  var vertFin=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.45,0.2),new THREE.MeshStandardMaterial({color:0x444455,roughness:0.2}));
  vertFin.position.set(3.6,0.28,0);vertFin.castShadow=true;heli.add(vertFin);

  // 水平尾翼
  var horizFin=new THREE.Mesh(new THREE.BoxGeometry(1.0,0.03,0.18),new THREE.MeshStandardMaterial({color:0x444455,roughness:0.2}));
  horizFin.position.set(2.5,0.25,0);horizFin.castShadow=true;heli.add(horizFin);

  // 主旋翼组（独立旋转）
  var mainRotor=new THREE.Group();
  var hub=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.1,0.15,16),new THREE.MeshStandardMaterial({color:0x777788,metalness:0.7}));
  hub.position.y=0.08;mainRotor.add(hub);
  for(var b=0;b<4;b++){
    var a=b*Math.PI/2;
    var blade=new THREE.Mesh(new THREE.BoxGeometry(0.03,0.012,1.8),new THREE.MeshStandardMaterial({color:0x333344}));
    blade.position.set(Math.cos(a)*0.85,0.08,Math.sin(a)*0.85);
    blade.rotation.z=a;
    blade.castShadow=true;
    mainRotor.add(blade);
  }
  // 桨毂罩
  var hubCapPts=[];for(var i=0;i<=8;i++)hubCapPts.push(new THREE.Vector2(Math.sin(i/8*Math.PI)*0.12,i/8*0.2));
  var hubCap=new THREE.Mesh(new THREE.LatheGeometry(hubCapPts,16),new THREE.MeshStandardMaterial({color:0x555566}));
  hubCap.position.y=0.18;mainRotor.add(hubCap);

  mainRotor.position.set(0,0.55,0);
  heli.add(mainRotor);

  // 尾旋翼
  var tailRotor=new THREE.Group();
  for(var b=0;b<4;b++){
    var a=b*Math.PI/2;
    var tb=new THREE.Mesh(new THREE.BoxGeometry(0.015,0.006,0.22),new THREE.MeshStandardMaterial({color:0x333344}));
    tb.position.set(0,Math.cos(a)*0.1,Math.sin(a)*0.1);tb.rotation.z=a;tailRotor.add(tb);
  }
  tailRotor.position.set(3.7,0.22,0.05);
  tailRotor.rotation.y=Math.PI/2;
  heli.add(tailRotor);

  // 起落架——两根简单棍子
  var skidL=new THREE.Mesh(new THREE.BoxGeometry(0.03,0.35,0.03),new THREE.MeshStandardMaterial({color:0x777788}));
  skidL.position.set(0.3,-0.35,-0.45);heli.add(skidL);
  var skidR=new THREE.Mesh(new THREE.BoxGeometry(0.03,0.35,0.03),new THREE.MeshStandardMaterial({color:0x777788}));
  skidR.position.set(0.3,-0.35,0.45);heli.add(skidR);

  scene.add(heli);
  msg.textContent='🚁 就绪';
  setTimeout(function(){msg.style.opacity='0';setTimeout(function(){msg.style.display='none'},500)},800);

  // === 飞行状态 ===
  var hx=0,hy=2.0,hz=0,vy=0,hs=0,pitch=0,roll=0,yaw=0,thr=0,ongnd=true;
  var view=0,locked=false,lkStart=0,missiles=[];
  var keys={},sId=null,sX2=0,sY2=0,sThr=0,sFwd=0,sSide=0;

  // 键盘
  document.addEventListener('keydown',function(e){keys[e.key.toLowerCase()]=true;if(e.key===' ')e.preventDefault()});
  document.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false});

  // 摇杆
  var stEl=document.getElementById('stickBox'),knEl=document.getElementById('knob');
  stEl.addEventListener('touchstart',function(e){e.preventDefault();e.stopPropagation();sId=e.touches[0].identifier;var r=stEl.getBoundingClientRect();sX2=r.left+r.width/2;sY2=r.top+r.height/2},{passive:false});
  stEl.addEventListener('touchmove',function(e){e.preventDefault();e.stopPropagation();for(var i=0;i<e.touches.length;i++)if(e.touches[i].identifier===sId){var dx=e.touches[i].clientX-sX2,dy=e.touches[i].clientY-sY2,d=Math.min(38,Math.hypot(dx,dy))/38,ag=Math.atan2(dy,dx);sFwd=-dy/38;sSide=dx/38;sThr=Math.max(0,-dy/38+0.3);knEl.style.transform='translate('+Math.cos(ag)*d*34+'px,'+Math.sin(ag)*d*34+'px)';break}},{passive:false});
  stEl.addEventListener('touchend',function(e){e.preventDefault();sId=null;sFwd=0;sSide=0;sThr=0;knEl.style.transform='translate(0,0)'},{passive:false});

  // 导弹按钮
  document.getElementById('fireBtn').addEventListener('touchstart',function(e){e.preventDefault();if(locked)return;var cl=null,cd=Infinity;for(var i=0;i<targets.length;i++){if(targets[i].dead)continue;var dx=targets[i].x-hx,dz=targets[i].z-hz,d=Math.sqrt(dx*dx+dz*dz);if(d<cd){cd=d;cl=targets[i]}};if(!cl||cd>100)return;locked=true;lkStart=performance.now();document.getElementById('lockUI').classList.add('on');setTimeout(function(){if(!locked)return;var m=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.04,0.35,8),new THREE.MeshStandardMaterial({color:0xcccccc,emissive:0xff4400,emissiveIntensity:0.5}));m.position.copy(heli.position);m.position.y+=0.25;scene.add(m);missiles.push({mesh:m,target:cl,born:performance.now()});locked=false;document.getElementById('lockUI').classList.remove('on')},1200)},{passive:false});

  // 视角
  ['v0','v1','v2'].forEach(function(id,i){var btn=document.getElementById(id);btn.addEventListener('click',function(){view=i;for(var j=0;j<3;j++)document.getElementById('v'+j).classList.toggle('sel',j===i)});btn.addEventListener('touchstart',function(e){e.preventDefault();view=i;for(var j=0;j<3;j++)document.getElementById('v'+j).classList.toggle('sel',j===i)},{passive:false})});

  // === 主循环 ===
  var pt=performance.now();
  function loop(now){
    requestAnimationFrame(loop);
    var dt=(now-pt)/1000;pt=now;if(dt<=0||dt>0.3)dt=0.016;

    // 输入
    if(keys['w']||keys['arrowup'])sFwd=1;else if(keys['s']||keys['arrowdown'])sFwd=-1;else if(sId===null)sFwd*=0.88;
    if(keys['a']||keys['arrowleft'])sSide=-1;else if(keys['d']||keys['arrowright'])sSide=1;else if(sId===null)sSide*=0.88;
    if(keys['shift'])sThr=Math.min(1,sThr+0.03);else if(keys['control'])sThr=Math.max(-0.3,sThr-0.03);else if(sId===null)sThr*=0.92;
    if(keys['q'])yaw+=0.03;if(keys['e'])yaw-=0.03;

    thr+=(sThr-thr)*Math.min(dt*3,1);
    if(ongnd)thr=Math.max(0,thr);

    // 垂直飞行
    vy+=(thr*14-9.8)*dt;vy*=0.98;
    hy+=vy*dt;
    if(hy<2.0){hy=2.0;vy=0;ongnd=true}else ongnd=false;

    // 姿态
    pitch+=(sFwd*0.5-pitch)*Math.min(dt*2.5,1);
    roll+=(sSide*0.3-roll)*Math.min(dt*2.5,1);
    hs+=(pitch*9-hs*0.6)*dt;hs*=0.97;
    var cy=Math.cos(yaw),sy=Math.sin(yaw);
    hx+=cy*hs*dt+cy*roll*4*dt;hz+=sy*hs*dt+sy*roll*4*dt;
    hx=Math.max(-280,Math.min(280,hx));hz=Math.max(-280,Math.min(280,hz));hy=Math.max(2.0,Math.min(180,hy));

    // 导弹
    for(var mi=missiles.length-1;mi>=0;mi--){
      var ms=missiles[mi],tdx=ms.target.x-ms.mesh.position.x,tdz=ms.target.z-ms.mesh.position.z,td=Math.sqrt(tdx*tdx+tdz*tdz);
      if(td<2){ms.target.dead=true;ms.target.mesh.visible=false;scene.remove(ms.mesh);missiles.splice(mi,1);continue}
      ms.mesh.position.x+=tdx/td*35*dt;ms.mesh.position.z+=tdz/td*35*dt;ms.mesh.position.y+=0.3*dt;
      ms.mesh.lookAt(ms.target.mesh.position);
      if(now-ms.born>6000){scene.remove(ms.mesh);missiles.splice(mi,1)}
    }

    // 锁定动画
    if(locked){var e2=(now-lkStart)/1000;var el=document.getElementById('lockUI');var r2=el.querySelector('div');if(r2)r2.style.transform='scale('+(1+Math.sin(e2*10)*0.2)+')'}

    // 相机
    if(view===0){camera.position.lerp(new THREE.Vector3(hx-Math.cos(yaw)*12,hy+9,hz-Math.sin(yaw)*12),3*dt);camera.lookAt(hx,hy,hz)}
    else if(view===1){camera.position.set(hx+Math.cos(yaw)*1.3,hy+0.7,hz+Math.sin(yaw)*1.3);camera.quaternion.setFromEuler(new THREE.Euler(-0.05-pitch*0.2,yaw+Math.PI,0,'YXZ'))}
    else{camera.position.lerp(new THREE.Vector3(hx,hy+55,hz+2),2*dt);camera.lookAt(hx,hy,hz)}

    // 直升机transform
    heli.position.set(hx,hy,hz);heli.rotation.y=yaw;heli.rotation.z=roll;heli.rotation.x=-pitch*0.3;

    // 旋翼转
    mainRotor.rotation.y+=dt*12*(0.3+thr*0.7);
    tailRotor.rotation.z+=dt*16*(0.3+Math.abs(thr)*0.7);

    document.getElementById('altV').textContent=Math.floor(hy*3);
    document.getElementById('spdV').textContent=Math.abs(Math.floor(hs*3.2));

    renderer.render(scene,camera);
  }

  requestAnimationFrame(loop);

  window.addEventListener('resize',function(){
    camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });
})();
</script>
</body></html>
