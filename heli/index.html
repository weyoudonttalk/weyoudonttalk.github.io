<!DOCTYPE html><html lang="zh"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>飞行模拟 · 双模型机库</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#111;touch-action:none;font-family:system-ui}
#g{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;display:none}
#altBox{position:absolute;top:14px;right:14px;text-align:right}
#altBox span{font-size:24px;font-weight:900;color:#fff;display:block;text-shadow:0 0 12px rgba(0,0,0,.5)}
#altBox i{font-size:7px;color:rgba(255,255,255,.5)}
#spdBox{position:absolute;top:48px;right:14px;text-align:right}
#spdBox span{font-size:16px;font-weight:900;color:#fff;display:block}
#spdBox i{font-size:6px;color:rgba(255,255,255,.4)}
#lockUI{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:none}
#lockUI.on{display:block}
#lockUI div{width:50px;height:50px;border:3px solid rgba(255,60,0,.8);border-radius:50%;margin:0 auto;animation:lP 1s infinite}
@keyframes lP{0%,100%{border-color:rgba(255,60,0,.8)}50%{border-color:rgba(255,0,0,.2)}}
#lockUI p{text-align:center;color:#f40;font-size:9px;margin-top:3px}
#stickBox{position:absolute;bottom:36px;left:16px;width:88px;height:88px;pointer-events:auto;touch-action:none}
#stickBox .bg{width:100%;height:100%;border-radius:50%;background:rgba(255,255,255,.04);border:2px solid rgba(255,255,255,.12)}
#stickBox .kn{position:absolute;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.18);top:50%;left:50%;margin:-20px 0 0 -20px}
#btns{position:absolute;bottom:50px;right:14px;z-index:5;display:flex;flex-direction:column;gap:6px;pointer-events:auto}
#btns button{width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.18);color:#fff;font-size:16px;cursor:pointer;touch-action:manipulation}
#btns button:active{background:rgba(255,100,0,.3);border-color:#f60}
#views{position:absolute;top:50%;right:6px;transform:translateY(-50%);display:flex;flex-direction:column;gap:3px;pointer-events:auto}
#views button{width:26px;height:26px;border-radius:5px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:9px;cursor:pointer}
#views button.sel{background:rgba(255,100,0,.25);border-color:#f60}
#msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:13px;z-index:99;background:rgba(0,0,0,.75);padding:8px 20px;border-radius:8px}
/* 机库 */
#hangar{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#hangar h1{color:#fff;font-size:26px;font-weight:900;letter-spacing:2px}
#hangar h1 b{color:#fc0}
.pick{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.card{width:130px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.1);border-radius:14px;padding:14px 10px;text-align:center;cursor:pointer}
.card:active,.card.sel{background:rgba(255,150,0,.1);border-color:#f80}
.card .em{font-size:44px;display:block;margin-bottom:6px}
.card .nm{color:#fff;font-size:12px;font-weight:700}
.card .sz{color:rgba(255,255,255,.35);font-size:8px;margin-top:3px}
#launch{background:linear-gradient(135deg,#f60,#e40);color:#fff;border:none;padding:12px 36px;border-radius:22px;font-size:15px;font-weight:700;cursor:pointer}
#launch:active{transform:scale(.94)}
#prog{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.5);font-size:10px}
</style></head><body>
<canvas id="g"></canvas>
<div id="hud">
  <div id="altBox"><span id="av">0</span><i>M</i></div>
  <div id="spdBox"><span id="sv">0</span><i>KM/H</i></div>
  <div id="lockUI"><div></div><p>锁定中…</p></div>
</div>
<div id="stickBox"><div class="bg"></div><div class="kn" id="knob"></div></div>
<div id="btns">
  <button id="upBtn">⬆</button>
  <button id="downBtn">⬇</button>
  <button id="fireBtn">🎯</button>
</div>
<div id="views">
  <button class="sel" id="v0">☁️</button>
  <button id="v1">🎥</button>
  <button id="v2">🛰</button>
</div>
<div id="msg">⚡ 加载引擎…</div>
<div id="hangar">
  <h1>✈️ 机库 <b>HANGAR</b></h1>
  <div class="pick">
    <div class="card sel" onclick="pick(0)">
      <span class="em">🚁</span>
      <div class="nm">武装直升机</div>
      <div class="sz">CC-BY · 2.2MB</div>
    </div>
    <div class="card" onclick="pick(1)">
      <span class="em">✈️</span>
      <div class="nm">F-15 战斗机</div>
      <div class="sz">CC-BY · 451KB</div>
    </div>
  </div>
  <button id="launch" onclick="doLaunch()">🎮 出击</button>
</div>
<div id="prog"></div>

<script>
var _chosen=0;
window.pick=function(i){_chosen=i;document.querySelectorAll('.card').forEach(function(c,i2){c.classList.toggle('sel',i2===i)})};
</script>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// 全局引用
window._THREE=THREE;
window._GLTFLoader=GLTFLoader;

var msgEl=document.getElementById('msg');
var progEl=document.getElementById('prog');

// 场景
var scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,250,900);

var cam=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,0.5,600);
cam.position.set(15,8,15);cam.lookAt(0,1.5,0);

var renderer=new THREE.WebGLRenderer({canvas:document.getElementById('g'),antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));

// 光照
scene.add(new THREE.AmbientLight(0xffffff,1.2));
scene.add(new THREE.DirectionalLight(0xffffff,0.7)).position.set(100,200,80);

// 地面
var gnd=new THREE.Mesh(new THREE.PlaneGeometry(700,700),new THREE.MeshBasicMaterial({color:0x338833}));
gnd.rotation.x=-Math.PI/2;gnd.position.y=-0.05;scene.add(gnd);

// 停机坪
var padGeo=new THREE.PlaneGeometry(10,10);var padCanvas=document.createElement('canvas');padCanvas.width=256;padCanvas.height=256;
var pctx=padCanvas.getContext('2d');pctx.fillStyle='#444';pctx.fillRect(0,0,256,256);
pctx.strokeStyle='#fff';pctx.lineWidth=10;pctx.strokeRect(16,16,224,224);
pctx.fillStyle='#fff';pctx.font='bold 120px sans-serif';pctx.textAlign='center';pctx.fillText('H',128,170);
var padTex=new THREE.CanvasTexture(padCanvas);
var pad=new THREE.Mesh(padGeo,new THREE.MeshBasicMaterial({map:padTex,transparent:true}));
pad.rotation.x=-Math.PI/2;pad.position.y=0.01;scene.add(pad);

// 建筑
var cc=[0x8899aa,0x667788,0x99aabb,0xccccdd];
for(var i=0;i<60;i++){var a=Math.random()*Math.PI*2,d=30+Math.random()*150,x=Math.cos(a)*d,z=Math.sin(a)*d;if(Math.hypot(x,z)<20)continue;var h=10+Math.random()*60;scene.add(new THREE.Mesh(new THREE.BoxGeometry(5+Math.random()*15,h,5+Math.random()*15),new THREE.MeshBasicMaterial({color:cc[i%4]}))).position.set(x,h/2,z)}
// 靶子
var targets=[];
for(var i=0;i<10;i++){var a=i/10*Math.PI*2,d=50+Math.random()*90;var t=new THREE.Mesh(new THREE.SphereGeometry(1.5,10,10),new THREE.MeshBasicMaterial({color:0xff0000}));t.position.set(Math.cos(a)*d,4,Math.sin(a)*d);scene.add(t);targets.push({mesh:t,alive:true})}

// 飞行器组
var aircraft=new THREE.Group();
scene.add(aircraft);

// 状态
var hx=0,hy=2.0,hz=0,vy3=0,hs3=0,pitch3=0,yaw3=0,thr3=0,onGnd=true;
var view3=0,locked3=false,lkSt3=0,miss3=[];
var isHeli=true;

// 输入
var keys={};
document.addEventListener('keydown',function(e){keys[e.key.toLowerCase()]=true;e.key===' '&&e.preventDefault()});
document.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false});
var sId=null,sX=0,sY=0,sFwd=0,sSide=0,sLift=0;
var st=document.getElementById('stickBox'),kn=document.getElementById('knob');
st.addEventListener('touchstart',function(e){e.preventDefault();e.stopPropagation();sId=e.touches[0].identifier;var r=st.getBoundingClientRect();sX=r.left+r.width/2;sY=r.top+r.height/2},{passive:false});
st.addEventListener('touchmove',function(e){e.preventDefault();e.stopPropagation();for(var i=0;i<e.touches.length;i++)if(e.touches[i].identifier===sId){var dx=e.touches[i].clientX-sX,dy=e.touches[i].clientY-sY,dd=Math.min(38,Math.hypot(dx,dy))/38,ag=Math.atan2(dy,dx);sFwd=-dy/38;sSide=dx/38;kn.style.transform='translate('+(Math.cos(ag)*dd*34)+'px,'+(Math.sin(ag)*dd*34)+'px)';break}},{passive:false});
st.addEventListener('touchend',function(e){e.preventDefault();sId=null;sFwd=0;sSide=0;kn.style.transform='translate(0,0)'},{passive:false});
document.getElementById('upBtn').addEventListener('touchstart',function(e){e.preventDefault();sLift=1},{passive:false});
document.getElementById('upBtn').addEventListener('touchend',function(e){e.preventDefault();sLift=0},{passive:false});
document.getElementById('downBtn').addEventListener('touchstart',function(e){e.preventDefault();sLift=-0.3},{passive:false});
document.getElementById('downBtn').addEventListener('touchend',function(e){e.preventDefault();sLift=0},{passive:false});
document.getElementById('upBtn').addEventListener('mousedown',function(e){e.preventDefault();sLift=1});
document.getElementById('upBtn').addEventListener('mouseup',function(e){e.preventDefault();sLift=0});
document.getElementById('downBtn').addEventListener('mousedown',function(e){e.preventDefault();sLift=-0.3});
document.getElementById('downBtn').addEventListener('mouseup',function(e){e.preventDefault();sLift=0});
document.getElementById('fireBtn').addEventListener('touchstart',function(e){e.preventDefault();if(locked3)return;var cl=null,cd=Infinity;for(var i=0;i<targets.length;i++){if(!targets[i].alive)continue;var dd=Math.hypot(targets[i].mesh.position.x-hx,targets[i].mesh.position.z-hz);if(dd<cd){cd=dd;cl=targets[i]}}if(!cl||cd>130)return;locked3=true;lkSt3=performance.now();document.getElementById('lockUI').classList.add('on');setTimeout(function(){if(!locked3)return;var m=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.04,0.35,8),new THREE.MeshBasicMaterial({color:0xcccccc}));m.position.copy(aircraft.position);m.position.y+=0.3;scene.add(m);miss3.push({mesh:m,target:cl,born:performance.now()});locked3=false;document.getElementById('lockUI').classList.remove('on')},1200)},{passive:false});
['v0','v1','v2'].forEach(function(id,i){var b2=document.getElementById(id);b2.addEventListener('click',function(){view3=i;upV()});b2.addEventListener('touchstart',function(e){e.preventDefault();view3=i;upV()},{passive:false})});
function upV(){for(var i=0;i<3;i++)document.getElementById('v'+i).classList.toggle('sel',i===view3)}

// ===== 主循环 =====
var pt=performance.now();
function tick(now){
  requestAnimationFrame(tick);
  var dt=(now-pt)/1000;pt=now;if(dt<=0||dt>0.3)dt=0.016;
  if(keys['w']||keys['arrowup'])sFwd=1;else if(keys['s']||keys['arrowdown'])sFwd=-1;else if(sId===null)sFwd*=0.88;
  if(keys['a']||keys['arrowleft'])sSide=-1;else if(keys['d']||keys['arrowright'])sSide=1;else if(sId===null)sSide*=0.88;
  if(keys['shift'])sLift=Math.min(1,sLift+0.03);else if(keys['control'])sLift=Math.max(-0.3,sLift-0.03);
  thr3+=(sLift-thr3)*Math.min(dt*3,1);
  if(onGnd)thr3=Math.max(0,thr3);
  vy3+=(thr3*14-9.8)*dt;vy3*=0.98;hy+=vy3*dt;
  if(hy<2.0){hy=2.0;vy3=0;onGnd=true}else onGnd=false;
  pitch3+=(sFwd*0.5-pitch3)*Math.min(dt*2.5,1);
  yaw3+=sSide*(isHeli?0.04:0.06);
  hs3+=(pitch3*(isHeli?10:18)-hs3*0.6)*dt;hs3*=0.97;
  var cy=Math.cos(yaw3),sy=Math.sin(yaw3);
  hx+=cy*hs3*dt;hz+=sy*hs3*dt;
  hx=Math.max(-300,Math.min(300,hx));hz=Math.max(-300,Math.min(300,hz));hy=Math.max(2.0,Math.min(200,hy));
  for(var mi=miss3.length-1;mi>=0;mi--){
    var ms=miss3[mi],tx=ms.target.mesh.position.x-ms.mesh.position.x,tz=ms.target.mesh.position.z-ms.mesh.position.z,td=Math.sqrt(tx*tx+tz*tz);
    if(td<2.5){ms.target.alive=false;ms.target.mesh.visible=false;scene.remove(ms.mesh);miss3.splice(mi,1);continue}
    ms.mesh.position.x+=tx/td*40*dt;ms.mesh.position.z+=tz/td*40*dt;ms.mesh.position.y+=0.3*dt;ms.mesh.lookAt(ms.target.mesh.position);
    if(now-ms.born>6000){scene.remove(ms.mesh);miss3.splice(mi,1)}
  }
  if(locked3)document.getElementById('lockUI').classList.add('on');
  if(view3===0){cam.position.set(hx-Math.cos(yaw3)*10,hy+7,hz-Math.sin(yaw3)*10);cam.lookAt(hx,hy,hz)}
  else if(view3===1){cam.position.set(hx+Math.cos(yaw3)*1.2,hy+0.65,hz+Math.sin(yaw3)*1.2);cam.quaternion.setFromEuler(new THREE.Euler(-0.08-pitch3*0.2,yaw3+Math.PI,0,'YXZ'))}
  else{cam.position.set(hx,hy+55,hz+1);cam.lookAt(hx,hy,hz)}
  aircraft.position.set(hx,hy,hz);aircraft.rotation.y=yaw3;aircraft.rotation.x=-pitch3*0.3;
  document.getElementById('av').textContent=Math.floor(hy*3);
  document.getElementById('sv').textContent=Math.abs(Math.floor(hs3*3.2));
  renderer.render(scene,cam);
}

// 后台渲染（机库界面时也能看到场景）
function bgRender(){requestAnimationFrame(bgRender);renderer.render(scene,cam)}
bgRender();

// ===== 机库 → 出击 =====
window.doLaunch=function(){
  document.getElementById('hangar').style.display='none';
  document.getElementById('hud').style.display='block';
  msgEl.style.display='block';
  progEl.style.display='block';

  // 清空飞行器组
  while(aircraft.children.length>0)aircraft.remove(aircraft.children[0]);

  // 临时占位模型（立即可见的彩色方块）
  var placeholder=new THREE.Mesh(
    new THREE.BoxGeometry(1.5,0.8,3),
    new THREE.MeshBasicMaterial({color:0xff00ff})
  );
  aircraft.add(placeholder);
  aircraft.position.set(0,2,0);

  var urls=[
    'https://raw.githubusercontent.com/srcejon/sdrangel-3d-models/main/helicopter.glb',
    'https://raw.githubusercontent.com/srcejon/sdrangel-3d-models/main/f15.glb'
  ];

  isHeli=(_chosen===0);
  var url=urls[_chosen];
  msgEl.textContent='⚡ 下载模型… 0%';
  progEl.textContent=url.split('/').pop();

  var loader=new GLTFLoader();
  loader.load(url,
    function(gltf){
      aircraft.remove(placeholder);
      var model=gltf.scene;
      model.traverse(function(c){if(c.isMesh){c.material=toBasic(c.material)}});
      aircraft.add(model);
      msgEl.textContent='🚁 就绪';
      progEl.textContent='';
      setTimeout(function(){msgEl.style.opacity='0';setTimeout(function(){msgEl.style.display='none'},500)},600);
    },
    function(xhr){
      if(xhr.total){
        var pct=Math.floor(xhr.loaded/xhr.total*100);
        msgEl.textContent='⚡ 下载模型… '+pct+'%';
      }
    },
    function(err){
      msgEl.textContent='⚠️ 加载失败，使用占位模型';
      progEl.textContent='';
      setTimeout(function(){msgEl.style.opacity='0';setTimeout(function(){msgEl.style.display='none'},500)},600);
    }
  );

  // 开始飞行循环
  requestAnimationFrame(function(now){cancelAnimationFrame(bgRender);pt=now;requestAnimationFrame(tick)});
};

// 辅助：把PBR材质转Basic
function toBasic(mat){
  if(!mat||mat.isMeshBasicMaterial)return mat;
  var c=mat.color?mat.color.getHex():0x888888;
  return new THREE.MeshBasicMaterial({color:c});
}

msgEl.textContent='🚁 请选择机型';
setTimeout(function(){msgEl.style.opacity='0';setTimeout(function(){msgEl.style.display='none'},500)},1500);

window.addEventListener('resize',function(){cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
