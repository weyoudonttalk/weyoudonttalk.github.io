<!DOCTYPE html><html lang="zh"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>黑鹰直升机 · 飞行模拟 · MIUI STUDIO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#87ceeb;font-family:system-ui;touch-action:none}
#g{display:block;width:100%;height:100%}

#hud{position:fixed;inset:0;z-index:10;pointer-events:none}
#altBox{position:absolute;top:14px;right:14px;text-align:right}
#altBox b{font-size:36px;font-weight:900;color:#fff;text-shadow:0 0 20px rgba(0,0,0,.4);display:block}
#altBox i{font-size:9px;color:rgba(255,255,255,.5);font-style:normal}
#spdBox{position:absolute;top:60px;right:14px;text-align:right}
#spdBox b{font-size:24px;font-weight:900;color:#fff;text-shadow:0 0 12px rgba(0,0,0,.3);display:block}
#spdBox i{font-size:8px;color:rgba(255,255,255,.4);font-style:normal}

#lockUI{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:none}
#lockUI.on{display:block}
#lockUI div{width:80px;height:80px;border:3px solid rgba(255,60,0,.8);border-radius:50%;animation:lP 1s infinite}
@keyframes lP{0%,100%{border-color:rgba(255,60,0,.8)}50%{border-color:rgba(255,0,0,.2)}}
#lockUI p{text-align:center;color:#f40;font-size:11px;margin-top:4px;font-weight:700}

#stickBox{position:absolute;bottom:36px;left:16px;width:88px;height:88px;pointer-events:auto;touch-action:none}
#stickBox .bg{width:100%;height:100%;border-radius:50%;background:rgba(255,255,255,.04);border:2px solid rgba(255,255,255,.12)}
#stickBox .kn{position:absolute;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.18);top:50%;left:50%;margin:-20px 0 0 -20px}

#btns{position:absolute;bottom:50px;right:14px;display:flex;flex-direction:column;gap:6px;pointer-events:auto}
#btns button{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.15);color:#fff;font-size:16px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#btns button:active{background:rgba(255,100,0,.3);border-color:#f60}

#views{position:absolute;top:50%;right:6px;transform:translateY(-50%);display:flex;flex-direction:column;gap:3px;pointer-events:auto}
#views button{width:26px;height:26px;border-radius:5px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:9px;cursor:pointer;-webkit-tap-highlight-color:transparent}
#views button.sel{background:rgba(255,100,0,.25);border-color:#f60}

#cross{position:absolute;top:50%;left:50%;width:30px;height:30px;margin:-15px 0 0 -15px}
#cross::before,#cross::after{content:'';position:absolute;background:rgba(255,255,255,.2)}
#cross::before{width:100%;height:1px;top:50%}
#cross::after{height:100%;width:1px;left:50%}

#msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:14px;z-index:99;background:rgba(0,0,0,.65);padding:10px 22px;border-radius:8px;transition:opacity .3s}
</style></head><body>

<canvas id="g"></canvas>

<div id="hud">
  <div id="altBox"><b id="altV">0</b><i>METERS</i></div>
  <div id="spdBox"><b id="spdV">0</b><i>KM/H</i></div>
  <div id="lockUI"><div></div><p>锁定中…</p></div>
  <div id="cross"></div>
</div>

<div id="stickBox"><div class="bg"></div><div class="kn" id="knob"></div></div>

<div id="btns">
  <button id="fireBtn">🎯</button>
  <button id="landBtn">⬇</button>
</div>

<div id="views">
  <button class="sel" id="v0">☁</button>
  <button id="v1">🎥</button>
  <button id="v2">🛰</button>
</div>

<div id="msg">⚡ 加载引擎…</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(function waitThree(){
  if(typeof THREE==='undefined')return setTimeout(waitThree,120);
  startSim();
})();

function startSim(){
try{
document.getElementById('msg').textContent='🏗 构建场景…';

// ===== 场景 =====
var S=new THREE.Scene();
S.background=new THREE.Color(0x87ceeb);
S.fog=new THREE.Fog(0x87ceeb,200,800);

var C=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.5,1000);
C.position.set(15,10,20);C.lookAt(0,2,0);

var R=new THREE.WebGLRenderer({canvas:document.getElementById('g'),antialias:true});
R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,2));
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.2;
document.body.appendChild(R.domElement);

// 光照
S.add(new THREE.AmbientLight(0x8899bb,0.6));
var sun=new THREE.DirectionalLight(0xfff5e0,1.5);sun.position.set(200,300,150);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.near=1;sun.shadow.camera.far=800;
sun.shadow.camera.left=-200;sun.shadow.camera.right=200;sun.shadow.camera.top=200;sun.shadow.camera.bottom=-200;S.add(sun);
S.add(new THREE.HemisphereLight(0x88bbff,0x665544,0.5));

// 地面
var groundGeo=new THREE.PlaneGeometry(600,600,100,100);
var groundMat=new THREE.MeshStandardMaterial({color:0x4a8c2a,roughness:0.9});
var ground=new THREE.Mesh(groundGeo,groundMat);ground.rotation.x=-Math.PI/2;ground.position.y=-0.05;ground.receiveShadow=true;S.add(ground);

// 停机坪纹理
var cv=document.createElement('canvas');cv.width=512;cv.height=512;
var cx=cv.getContext('2d');cx.fillStyle='#4a4a4a';cx.fillRect(0,0,512,512);
cx.strokeStyle='#666';cx.lineWidth=4;cx.strokeRect(50,50,412,412);
cx.strokeStyle='#fff';cx.lineWidth=2;
cx.beginPath();cx.arc(256,256,150,0,Math.PI*2);cx.stroke();
cx.beginPath();cx.moveTo(256,106);cx.lineTo(256,406);cx.stroke();cx.beginPath();cx.moveTo(106,256);cx.lineTo(406,256);cx.stroke();
cx.fillStyle='#fff';cx.font='bold 28px sans-serif';cx.textAlign='center';cx.fillText('H',256,280);
var tTex=new THREE.CanvasTexture(cv);tTex.repeat.set(4,4);tTex.wrapS=tTex.wrapT=THREE.RepeatWrapping;
groundMat.map=tTex;groundMat.needsUpdate=true;

// 建筑群
var bM=new THREE.MeshStandardMaterial({color:0x8899aa,roughness:0.3});
for(var bi=0;bi<60;bi++){
  var bx=(Math.random()-0.5)*400,bz=(Math.random()-0.5)*400;
  if(Math.hypot(bx,bz)<40)continue;
  var bh=10+Math.random()*50,bw=6+Math.random()*14,bd=6+Math.random()*14;
  var b=new THREE.Mesh(new THREE.BoxGeometry(bw,bh,bd),bM);b.position.set(bx,bh/2,bz);b.castShadow=true;b.receiveShadow=true;S.add(b);
}
// 树
var tM=new THREE.MeshStandardMaterial({color:0x5a3a1a}),lM=new THREE.MeshStandardMaterial({color:0x2d5a1e,roughness:0.7});
for(var ti=0;ti<300;ti++){
  var tx=(Math.random()-0.5)*500,tz=(Math.random()-0.5)*500;
  if(Math.hypot(tx,tz)<35)continue;
  var tr=new THREE.Mesh(new THREE.CylinderGeometry(.15,.25,3+Math.random()*4,6),tM);tr.position.set(tx,1.5,tz);tr.castShadow=true;S.add(tr);
  var lf=new THREE.Mesh(new THREE.SphereGeometry(1+Math.random()*2,6,4),lM);lf.position.set(tx,3.5+Math.random()*3,tz);lf.castShadow=true;S.add(lf);
}

// ===== 直升机模型 =====
var heli=new THREE.Group();
var DK=new THREE.MeshStandardMaterial({color:0x1a1a22,roughness:0.3,metalness:0.6});
var GY2=new THREE.MeshStandardMaterial({color:0x3a3a44,roughness:0.25,metalness:0.55});
var SL3=new THREE.MeshStandardMaterial({color:0x7a7a88,roughness:0.18,metalness:0.7});
var GL3=new THREE.MeshStandardMaterial({color:0x334455,roughness:0.04,transparent:true,opacity:0.55});
var BL2=new THREE.MeshStandardMaterial({color:0x0a0a0a,roughness:0.4,metalness:0.3});
var OR3=new THREE.MeshStandardMaterial({color:0xff4400,emissive:0xff2200,emissiveIntensity:0.4});
var WH2=new THREE.MeshStandardMaterial({color:0xcccccc,roughness:0.25,metalness:0.4});

function CYL(rt,rb,h,m,x,y,z,rx,rz,p){p=p||heli;var g=new THREE.CylinderGeometry(rt,rb,h,24);var n=new THREE.Mesh(g,m);n.position.set(x,y,z);if(rx)n.rotation.x=rx;if(rz)n.rotation.z=rz;n.castShadow=true;n.receiveShadow=true;p.add(n);return n}
function BOX(w,h,d,m,x,y,z,rx,ry,rz,p){p=p||heli;var n=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);n.position.set(x,y,z);if(rx)n.rotation.x=rx;if(ry)n.rotation.y=ry;if(rz)n.rotation.z=rz;n.castShadow=true;n.receiveShadow=true;p.add(n);return n}

// 机身 Lathe
var fusePts=[];
for(var i=0;i<=20;i++){var t=i/20,x=t*8-3.5;var r;if(t<.06)r=.06+t*.45;else if(t<.15)r=.28+(t-.06)*.25/.09;else if(t<.35)r=.48+Math.sin((t-.15)/.2*Math.PI)*.18;else if(t<.6)r=.52;else if(t<.78)r=.52-(t-.6)*.3/.18;else r=.22-(t-.78)*.2/.22;fusePts.push(new THREE.Vector2(r,x))}
var fuse=new THREE.Mesh(new THREE.LatheGeometry(fusePts,36),DK);fuse.castShadow=true;fuse.receiveShadow=true;heli.add(fuse);

// 驾驶舱玻璃
BOX(0.25,0.25,0.02,GL3,-2.6,0.65,0.2,0,0,0);
BOX(0.25,0.25,0.02,GL3,-2.6,0.65,-0.2,0,0,0);
BOX(0.3,0.2,0.38,GL3,-2.5,0.62,0,0,0.3,0);

// 发动机罩
BOX(2.8,0.18,0.4,GY2,0,0.48,0,0,0,0);
[-1,1].forEach(function(s){BOX(0.3,0.15,0.2,DK,1.0,0.45,s*0.35,0,0,0)});

// 尾梁+垂尾
BOX(3.5,0.1,0.1,GY2,3.0,0.3,0,0,0,0);
BOX(0.05,0.6,0.25,GY2,3.8,0.3,0,0,0,0);
BOX(0.03,0.5,0.3,DK,4.0,0.25,0,0,0,0);
BOX(1.2,0.04,0.2,GY2,2.8,0.3,0,0,0,0);

// 主旋翼系统（可旋转组）
var mainRotor=new THREE.Group();
CYL(0.1,0.12,0.2,12,SL3,0,0.1,0,0,0,mainRotor);
for(var b=0;b<4;b++){
  var a=b*Math.PI/2;
  BOX(0.04,0.015,2.0,GY2,Math.cos(a)*0.9,0.1,Math.sin(a)*0.9,0,0,a,mainRotor);
  BOX(0.05,0.013,0.4,SL3,Math.cos(a)*1.7,0.1,Math.sin(a)*1.7,0,0,a,mainRotor);
}
var hubPts=[];for(var i=0;i<=8;i++)hubPts.push(new THREE.Vector2(Math.sin(i/8*Math.PI)*0.14,i/8*0.25));
mainRotor.add(new THREE.Mesh(new THREE.LatheGeometry(hubPts,16),GY2)).position.y=0.2;
mainRotor.position.set(0,0.6,0);
heli.add(mainRotor);

// 尾旋翼
var tailRotor=new THREE.Group();
for(var b=0;b<4;b++){var a=b*Math.PI/2;BOX(0.02,0.008,0.28,GY2,0,Math.cos(a)*0.12,Math.sin(a)*0.12,0,0,a,tailRotor)}
CYL(0.04,0.04,0.06,8,SL3,0,0,0,0,0,tailRotor);
tailRotor.position.set(4.0,0.25,0.15);
heli.add(tailRotor);

// 起落架
function skid(s){
  var g=new THREE.Group();
  CYL(0.03,0.03,0.35,8,SL3,0,0.3,0,0,0,g);
  CYL(0.04,0.04,0.8,8,SL3,0,0.05,s*0.15,0,Math.PI/2,g);
  g.position.set(0.3,-0.4,s*0.5);
  return g;
}
heli.add(skid(-1));heli.add(skid(1));

// 武器挂架
[-1,1].forEach(function(s){
  CYL(0.04,0.04,0.2,8,SL3,0.8,0.2,s*0.55,0,0);
  CYL(0.06,0.08,0.5,12,GY2,0.8,0.05,s*0.55,0,Math.PI/2);
  CYL(0.03,0.04,0.3,8,SL3,0.8,0.05,s*0.55,0,Math.PI/2);
});

S.add(heli);

// ===== 飞行状态 =====
var hx=0,hy=1.8,hz=0; // 直升机位置（初始在地面以上）
var hspd=0,vspd=0,hpitch=0,hroll=0,hyaw=0;
var throttle=0; // 0到1，控制主旋翼升力
var onGround=true;
var viewMode=0; // 0=上帝视角, 1=驾驶舱, 2=卫星
var locked=false,lockTimer=0;
var missiles=[],targets=[];

// 放置一些目标（红色立方体）
for(var ti=0;ti<8;ti++){
  var ta=(ti/8)*Math.PI*2,td=40+Math.random()*80;
  var tg=new THREE.Mesh(new THREE.BoxGeometry(2,2,2),new THREE.MeshStandardMaterial({color:0xff0000,emissive:0xff0000,emissiveIntensity:0.3}));
  tg.position.set(Math.cos(ta)*td,1,Math.sin(ta)*td);tg.castShadow=true;S.add(tg);
  targets.push({mesh:tg,x:tg.position.x,z:tg.position.z,alive:true});
}

// ===== 输入 =====
var keys={};
var stickId=null,stickX=0,stickY=0;
var stickThrottle=0,stickFwd=0,stickSide=0;

document.addEventListener('keydown',function(e){keys[e.key.toLowerCase()]=true;e.key===' '&&e.preventDefault()});
document.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false});

var stickEl=document.getElementById('stickBox'),knobEl=document.getElementById('knob');
stickEl.addEventListener('touchstart',function(e){e.preventDefault();e.stopPropagation();stickId=e.touches[0].identifier;var r=stickEl.getBoundingClientRect();stickX=r.left+r.width/2;stickY=r.top+r.height/2},{passive:false});
stickEl.addEventListener('touchmove',function(e){e.preventDefault();e.stopPropagation();for(var i=0;i<e.touches.length;i++)if(e.touches[i].identifier===stickId){var dx=e.touches[i].clientX-stickX,dy=e.touches[i].clientY-stickY;var d=Math.min(38,Math.hypot(dx,dy))/38,a=Math.atan2(dy,dx);stickFwd=-dy/38;stickSide=dx/38;stickThrottle=Math.max(0,-dy/38+0.3);knobEl.style.transform='translate('+Math.cos(a)*d*34+'px,'+Math.sin(a)*d*34+'px)';break}},{passive:false});
stickEl.addEventListener('touchend',function(e){e.preventDefault();stickId=null;stickFwd=0;stickSide=0;stickThrottle=0;knobEl.style.transform='translate(0,0)'},{passive:false});

// 武器按钮
document.getElementById('fireBtn').addEventListener('touchstart',function(e){e.preventDefault();lockOn()},{passive:false});
document.getElementById('fireBtn').addEventListener('mousedown',function(e){lockOn()});
document.getElementById('landBtn').addEventListener('touchstart',function(e){e.preventDefault();if(hy>2)throttle=Math.max(0,throttle-0.3)},{passive:false});
document.getElementById('landBtn').addEventListener('mousedown',function(){if(hy>2)throttle=Math.max(0,throttle-0.3)});

// 视角切换
['v0','v1','v2'].forEach(function(id,i){
  document.getElementById(id).addEventListener('click',function(){viewMode=i;updateViews()});
  document.getElementById(id).addEventListener('touchstart',function(e){e.preventDefault();viewMode=i;updateViews()},{passive:false});
});
function updateViews(){for(var i=0;i<3;i++)document.getElementById('v'+i).classList.toggle('sel',i===viewMode)}

// ===== 导弹系统 =====
function lockOn(){
  // 找到最近的目标
  var closest=null,closestDist=Infinity;
  targets.forEach(function(t){
    if(!t.alive)return;
    var dx=t.x-hx,dz=t.z-hz,dist=Math.sqrt(dx*dx+dz*dz);
    if(dist<closestDist){closestDist=dist;closest=t;}
  });
  if(closest&&closestDist<80){
    locked=true;lockTimer=0;
    document.getElementById('lockUI').classList.add('on');
    setTimeout(function(){
      if(locked){
        // 发射导弹
        var dx=closest.x-hx,dz=closest.z-hz;
        var missileObj=new THREE.Mesh(
          new THREE.CylinderGeometry(0.04,0.05,0.4,8),
          new THREE.MeshStandardMaterial({color:0xcccccc,emissive:0xff4400,emissiveIntensity:0.6})
        );
        missileObj.position.copy(heli.position);missileObj.position.y+=0.2;
        S.add(missileObj);
        missiles.push({mesh:missileObj,target:closest,speed:40,alive:true});
        locked=false;lockTimer=0;
        document.getElementById('lockUI').classList.remove('on');
      }
    },1500);
  }
}

// ===== 更新 =====
var prevT=0;
function update(dt){
  if(dt>0.2)dt=0.2;

  // 键盘/摇杆混合输入
  if(keys['w']||keys['arrowup'])stickFwd=1;
  else if(keys['s']||keys['arrowdown'])stickFwd=-1;
  else if(stickId===null)stickFwd*=0.9;

  if(keys['a']||keys['arrowleft'])stickSide=-1;
  else if(keys['d']||keys['arrowright'])stickSide=1;
  else if(stickId===null)stickSide*=0.9;

  if(keys['shift']){stickThrottle=Math.min(1,stickThrottle+0.02);}
  else if(keys['control']){stickThrottle=Math.max(0,stickThrottle-0.02);}
  else if(stickId===null)stickThrottle*=0.95;

  // 油门平滑
  throttle+=(stickThrottle-throttle)*Math.min(dt*3,1);
  throttle=onGround?Math.max(0,throttle):Math.max(-0.2,throttle);

  // 升力
  var lift=throttle*15; // 满油门时升力加速度约15m/s²
  // 重力
  var gravity=9.8;

  // 垂直速度
  vspd+=(lift-gravity)*dt;
  vspd*=0.98; // 空气阻力

  hy+=vspd*dt;
  if(hy<1.8){hy=1.8;vspd=0;onGround=true;}
  else onGround=false;

  // 水平移动（前倾/侧倾影响）
  hpitch+=(stickFwd*0.5-hpitch)*Math.min(dt*2,1);
  hroll+=(stickSide*0.3-hroll)*Math.min(dt*2,1);

  var fwdForce=hpitch*8; // 前倾产生前推力
  var sideForce=hroll*4; // 侧倾产生侧推力

  hspd+=(fwdForce-hspd*0.5)*dt;
  hspd*=0.97;

  // 偏航（A/D旋转）
  if(keys['q'])hyaw+=0.03;
  if(keys['e'])hyaw-=0.03;
  hyaw+=stickSide*(onGround?0:0.02);

  // 位置更新
  var cosY=Math.cos(hyaw),sinY=Math.sin(hyaw);
  hx+=cosY*hspd*dt+cosY*sideForce*dt;
  hz+=sinY*hspd*dt+sinY*sideForce*dt;

  // 边界
  hx=Math.max(-250,Math.min(250,hx));
  hz=Math.max(-250,Math.min(250,hz));
  hy=Math.max(1.8,Math.min(200,hy));

  // ===== 导弹更新 =====
  for(var mi=missiles.length-1;mi>=0;mi--){
    var ms=missiles[mi];
    if(!ms.alive)continue;
    var tdx=ms.target.x-ms.mesh.position.x,tdz=ms.target.z-ms.mesh.position.z;
    var tdist=Math.sqrt(tdx*tdx+tdz*tdz);
    if(tdist<2){
      ms.target.alive=false;ms.target.mesh.visible=false;
      // 爆炸粒子
      for(var p=0;p<10;p++){
        var fr=new THREE.Mesh(new THREE.SphereGeometry(0.15,4,4),new THREE.MeshBasicMaterial({color:0xff8800}));
        fr.position.copy(ms.target.mesh.position);S.add(fr);
        setTimeout(function(f){S.remove(f)}(fr),500);
      }
      S.remove(ms.mesh);missiles.splice(mi,1);continue;
    }
    ms.mesh.position.x+=tdx/tdist*ms.speed*dt;
    ms.mesh.position.z+=tdz/tdist*ms.speed*dt;
    ms.mesh.position.y+=0.3;
    ms.mesh.lookAt(ms.target.mesh.position);
    if(Date.now()-ms.born>5000){S.remove(ms.mesh);missiles.splice(mi,1)}
  }
  // 给导弹加born时间戳
  missiles.forEach(function(ms){ms.born=ms.born||Date.now()});

  // 锁定计时器
  if(locked){
    lockTimer+=dt;
    document.getElementById('lockUI').querySelector('div').style.transform='scale('+(1+Math.sin(lockTimer*8)*0.2)+')';
  }

  // ===== 相机 =====
  if(viewMode===0){
    // 上帝视角：45度上方跟随机身
    var tx=hx-Math.cos(hyaw)*12,tz=hz-Math.sin(hyaw)*12;
    C.position.lerp(new THREE.Vector3(tx,hy+8,tz),3*dt);
    C.lookAt(hx,hy,hz);
  }else if(viewMode===1){
    // 第一人称驾驶舱
    C.position.set(hx+Math.cos(hyaw)*1.5,hy+0.8,hz+Math.sin(hyaw)*1.5);
    C.quaternion.setFromEuler(new THREE.Euler(-0.05-hpitch*0.2,hyaw+Math.PI,0,'YXZ'));
    document.getElementById('cross').style.display='block';
  }else{
    // 卫星俯视
    C.position.lerp(new THREE.Vector3(hx,hy+60,hz+1),2*dt);
    C.lookAt(hx,hy,hz);
    document.getElementById('cross').style.display='none';
  }
  if(viewMode!==1)document.getElementById('cross').style.display='none';

  // ===== 直升机变换 =====
  heli.position.set(hx,hy,hz);
  heli.rotation.y=hyaw;
  heli.rotation.z=hroll;
  heli.rotation.x=-hpitch*0.3;

  // 旋翼旋转
  mainRotor.rotation.y+=dt*15*(0.4+throttle*0.6);
  tailRotor.rotation.z+=dt*18*(0.3+throttle*0.7);

  // HUD
  document.getElementById('altV').textContent=Math.floor(hy*3.2);
  document.getElementById('spdV').textContent=Math.abs(Math.floor(hspd*3.2));
}

// ===== 渲染循环 =====
function loop(t){
  requestAnimationFrame(loop);
  var dt=(t-prevT)/1000;prevT=t;
  if(dt>0&&dt<1)update(dt);
  R.render(S,C);
}

// 隐藏加载提示
document.getElementById('msg').style.opacity='0';
setTimeout(function(){var m=document.getElementById('msg');if(m)m.style.display='none'},500);

requestAnimationFrame(loop);
window.addEventListener('resize',function(){C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});

}catch(e){
  document.getElementById('msg').textContent='⚠️ 错误: '+e.message;
  document.getElementById('msg').style.opacity='1';
  setTimeout(function(){throw e},100);
}
}
</script></body></html>
