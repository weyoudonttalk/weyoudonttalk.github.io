<!DOCTYPE html><html lang="zh"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>武装直升机 · 飞行射击</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#87ceeb;touch-action:none;font-family:system-ui}
#g{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;display:none}
#altBox{position:absolute;top:14px;right:14px;text-align:right}
#altBox b{font-size:26px;font-weight:900;color:#fff;display:block}
#altBox i{font-size:8px;color:rgba(255,255,255,.5)}
#spdBox{position:absolute;top:50px;right:14px;text-align:right}
#spdBox b{font-size:18px;font-weight:900;color:#fff;display:block}
#spdBox i{font-size:7px;color:rgba(255,255,255,.4)}
#lockUI{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:none}
#lockUI.on{display:block}
#lockUI div{width:50px;height:50px;border:3px solid rgba(255,60,0,.8);border-radius:50%;margin:0 auto;animation:lP 1s infinite}
@keyframes lP{0%,100%{border-color:rgba(255,60,0,.8)}50%{border-color:rgba(255,0,0,.2)}}
#lockUI p{text-align:center;color:#f40;font-size:9px;margin-top:3px}
#stickBox{position:absolute;bottom:36px;left:16px;width:88px;height:88px;pointer-events:auto;touch-action:none}
#stickBox .bg{width:100%;height:100%;border-radius:50%;background:rgba(255,255,255,.04);border:2px solid rgba(255,255,255,.12)}
#stickBox .kn{position:absolute;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.18);top:50%;left:50%;margin:-20px 0 0 -20px}
#btns{position:absolute;bottom:50px;right:14px;display:flex;flex-direction:column;gap:6px;pointer-events:auto}
#btns button{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.15);color:#fff;font-size:16px;cursor:pointer;touch-action:manipulation}
#btns button:active{background:rgba(255,100,0,.3);border-color:#f60}
#views{position:absolute;top:50%;right:6px;transform:translateY(-50%);display:flex;flex-direction:column;gap:3px;pointer-events:auto}
#views button{width:26px;height:26px;border-radius:5px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:9px;cursor:pointer}
#views button.sel{background:rgba(255,100,0,.25);border-color:#f60}
#msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:13px;z-index:99;background:rgba(0,0,0,.7);padding:8px 20px;border-radius:8px}
</style></head><body>

<canvas id="g"></canvas>
<div id="hud">
  <div id="altBox"><b id="altV">0</b><i>METERS</i></div>
  <div id="spdBox"><b id="spdV">0</b><i>KM/H</i></div>
  <div id="lockUI"><div></div><p>锁定中…</p></div>
</div>
<div id="stickBox"><div class="bg"></div><div class="kn" id="knob"></div></div>
<div id="btns"><button id="fireBtn">🎯</button></div>
<div id="views">
  <button class="sel" id="v0">☁️</button>
  <button id="v1">🎥</button>
  <button id="v2">🛰</button>
</div>
<div id="msg">⚡ 加载模型… 0%</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const msgEl=document.getElementById('msg');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,200,800);

const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,1,600);
camera.position.set(25,15,25);camera.lookAt(0,3,0);

const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('g'),antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;

scene.add(new THREE.AmbientLight(0x8899bb,0.6));
const sun2=new THREE.DirectionalLight(0xfff5e0,1.5);
sun2.position.set(200,300,150);sun2.castShadow=true;
sun2.shadow.mapSize.set(1024,1024);
sun2.shadow.camera.far=800;
sun2.shadow.camera.left=-200;sun2.shadow.camera.right=200;
sun2.shadow.camera.top=200;sun2.shadow.camera.bottom=-200;
scene.add(sun2);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(800,800),new THREE.MeshStandardMaterial({color:0x4a8c2a,roughness:0.9}));
ground.rotation.x=-Math.PI/2;ground.position.y=-0.05;ground.receiveShadow=true;scene.add(ground);

const bM3=new THREE.MeshStandardMaterial({color:0x8899aa,roughness:0.3});
for(let i=0;i<50;i++){
  const bx=(Math.random()-0.5)*500,bz=(Math.random()-0.5)*500;
  if(Math.hypot(bx,bz)<50)continue;
  const bh=10+Math.random()*55;
  const b=new THREE.Mesh(new THREE.BoxGeometry(8+Math.random()*12,bh,8+Math.random()*12),bM3);
  b.position.set(bx,bh/2,bz);b.castShadow=true;b.receiveShadow=true;scene.add(b);
}
for(let i=0;i<200;i++){
  const tx=(Math.random()-0.5)*600,tz=(Math.random()-0.5)*600;
  if(Math.hypot(tx,tz)<40)continue;
  scene.add(new THREE.Mesh(new THREE.CylinderGeometry(.15,.25,4+Math.random()*4,6),new THREE.MeshStandardMaterial({color:0x5a3a1a}))).position.set(tx,2,tz);
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(1+Math.random()*2,6,4),new THREE.MeshStandardMaterial({color:0x2d5a1e}))).position.set(tx,4+Math.random()*4,tz);
}

const targets=[];
for(let i=0;i<8;i++){
  const a=(i/8)*Math.PI*2,d=50+Math.random()*70;
  const t=new THREE.Mesh(new THREE.BoxGeometry(2,2,2),new THREE.MeshStandardMaterial({color:0xff0000,emissive:0xff0000,emissiveIntensity:0.3}));
  t.position.set(Math.cos(a)*d,1,Math.sin(a)*d);scene.add(t);
  targets.push({mesh:t,alive:true});
}

let hx=0,hy=2.0,hz=0,vy3=0,hs3=0,pitch3=0,roll3=0,yaw3=0,thr3=0,onGround=true;
let view3=0,locked3=false,lkStart3=0,missiles3=[];
let keys3={},stickId3=null,stickX3=0,stickY3=0,sThrottle=0,sForward=0,sSide2=0;
let heliModel=null;

const loader=new GLTFLoader();
loader.load(
  'https://raw.githubusercontent.com/srcejon/sdrangel-3d-models/main/helicopter.glb',
  gltf=>{
    heliModel=gltf.scene;
    heliModel.scale.set(0.12,0.12,0.12);
    heliModel.rotation.y=Math.PI;
    heliModel.traverse(c=>{if(c.isMesh){c.castShadow=true;c.receiveShadow=true}});
    scene.add(heliModel);
    msgEl.textContent='🚁 就绪';
    document.getElementById('hud').style.display='block';
    setTimeout(()=>{msgEl.style.opacity='0';setTimeout(()=>msgEl.style.display='none',500)},600);
    requestAnimationFrame(tick);
  },
  xhr=>{msgEl.textContent=`⚡ 加载模型… ${Math.floor(xhr.loaded/xhr.total*100)}%`},
  err=>{msgEl.textContent='⚠️ 加载失败: '+err.message}
);

// 键盘
document.addEventListener('keydown',e=>{keys3[e.key.toLowerCase()]=true;e.key===' '&&e.preventDefault()});
document.addEventListener('keyup',e=>{keys3[e.key.toLowerCase()]=false});

// 摇杆
const stickEl2=document.getElementById('stickBox'),knobEl2=document.getElementById('knob');
stickEl2.addEventListener('touchstart',e=>{
  e.preventDefault();e.stopPropagation();
  stickId3=e.touches[0].identifier;
  const r=stickEl2.getBoundingClientRect();
  stickX3=r.left+r.width/2;stickY3=r.top+r.height/2;
},{passive:false});
stickEl2.addEventListener('touchmove',e=>{
  e.preventDefault();e.stopPropagation();
  for(let i=0;i<e.touches.length;i++){
    if(e.touches[i].identifier===stickId3){
      const dx=e.touches[i].clientX-stickX3,dy=e.touches[i].clientY-stickY3;
      const d=Math.min(38,Math.hypot(dx,dy))/38,ag=Math.atan2(dy,dx);
      sForward=-dy/38;sSide2=dx/38;sThrottle=Math.max(0,-dy/38+0.3);
      knobEl2.style.transform=`translate(${Math.cos(ag)*d*34}px,${Math.sin(ag)*d*34}px)`;
      break;
    }
  }
},{passive:false});
stickEl2.addEventListener('touchend',e=>{
  e.preventDefault();stickId3=null;sForward=0;sSide2=0;sThrottle=0;
  knobEl2.style.transform='translate(0,0)';
},{passive:false});

// 导弹
document.getElementById('fireBtn').addEventListener('touchstart',e=>{
  e.preventDefault();
  if(locked3||!heliModel)return;
  let cl=null,cd=Infinity;
  targets.forEach(t=>{if(!t.alive)return;const d=Math.hypot(t.mesh.position.x-hx,t.mesh.position.z-hz);if(d<cd){cd=d;cl=t}});
  if(!cl||cd>100)return;
  locked3=true;lkStart3=performance.now();
  document.getElementById('lockUI').classList.add('on');
  setTimeout(()=>{
    if(!locked3)return;
    const m=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.04,0.35,8),new THREE.MeshStandardMaterial({color:0xcccccc,emissive:0xff4400,emissiveIntensity:0.5}));
    m.position.copy(heliModel.position);m.position.y+=0.25;scene.add(m);
    missiles3.push({mesh:m,target:cl,born:performance.now()});
    locked3=false;document.getElementById('lockUI').classList.remove('on');
  },1200);
},{passive:false});

// 视角
['v0','v1','v2'].forEach((id,i)=>{
  const btn=document.getElementById(id);
  btn.addEventListener('click',()=>{view3=i;for(let j=0;j<3;j++)document.getElementById('v'+j).classList.toggle('sel',j===i)});
  btn.addEventListener('touchstart',e=>{e.preventDefault();view3=i;for(let j=0;j<3;j++)document.getElementById('v'+j).classList.toggle('sel',j===i)},{passive:false});
});

let prevTime3=performance.now();
function tick(now){
  requestAnimationFrame(tick);
  if(!heliModel){renderer.render(scene,camera);return}
  let dt=(now-prevTime3)/1000;prevTime3=now;
  if(dt<=0||dt>0.3)dt=0.016;

  if(keys3['w']||keys3['arrowup'])sForward=1;else if(keys3['s']||keys3['arrowdown'])sForward=-1;else if(stickId3===null)sForward*=0.88;
  if(keys3['a']||keys3['arrowleft'])sSide2=-1;else if(keys3['d']||keys3['arrowright'])sSide2=1;else if(stickId3===null)sSide2*=0.88;
  if(keys3['shift'])sThrottle=Math.min(1,sThrottle+0.03);else if(keys3['control'])sThrottle=Math.max(-0.3,sThrottle-0.03);else if(stickId3===null)sThrottle*=0.92;
  if(keys3['q'])yaw3+=0.03;if(keys3['e'])yaw3-=0.03;

  thr3+=(sThrottle-thr3)*Math.min(dt*3,1);
  if(onGround)thr3=Math.max(0,thr3);

  vy3+=(thr3*14-9.8)*dt;vy3*=0.98;
  hy+=vy3*dt;
  if(hy<2.0){hy=2.0;vy3=0;onGround=true}else onGround=false;

  pitch3+=(sForward*0.5-pitch3)*Math.min(dt*2.5,1);
  roll3+=(sSide2*0.3-roll3)*Math.min(dt*2.5,1);
  hs3+=(pitch3*9-hs3*0.6)*dt;hs3*=0.97;
  const cy=Math.cos(yaw3),sy=Math.sin(yaw3);
  hx+=cy*hs3*dt+cy*roll3*4*dt;hz+=sy*hs3*dt+sy*roll3*4*dt;
  hx=Math.max(-280,Math.min(280,hx));hz=Math.max(-280,Math.min(280,hz));hy=Math.max(2.0,Math.min(180,hy));

  for(let mi=missiles3.length-1;mi>=0;mi--){
    const ms=missiles3[mi];
    const tdx=ms.target.mesh.position.x-ms.mesh.position.x;
    const tdz=ms.target.mesh.position.z-ms.mesh.position.z;
    const td=Math.sqrt(tdx*tdx+tdz*tdz);
    if(td<2){ms.target.alive=false;ms.target.mesh.visible=false;scene.remove(ms.mesh);missiles3.splice(mi,1);continue}
    ms.mesh.position.x+=tdx/td*35*dt;ms.mesh.position.z+=tdz/td*35*dt;ms.mesh.position.y+=0.3*dt;
    ms.mesh.lookAt(ms.target.mesh.position);
    if(now-ms.born>6000){scene.remove(ms.mesh);missiles3.splice(mi,1)}
  }

  if(locked3){const el=document.getElementById('lockUI'),e2=(now-lkStart3)/1000,r=el.querySelector('div');if(r)r.style.transform=`scale(${1+Math.sin(e2*10)*0.2})`}

  if(view3===0){camera.position.lerp(new THREE.Vector3(hx-Math.cos(yaw3)*12,hy+9,hz-Math.sin(yaw3)*12),3*dt);camera.lookAt(hx,hy,hz)}
  else if(view3===1){camera.position.set(hx+Math.cos(yaw3)*1.3,hy+0.7,hz+Math.sin(yaw3)*1.3);camera.quaternion.setFromEuler(new THREE.Euler(-0.05-pitch3*0.2,yaw3+Math.PI,0,'YXZ'))}
  else{camera.position.lerp(new THREE.Vector3(hx,hy+55,hz+2),2*dt);camera.lookAt(hx,hy,hz)}

  heliModel.position.set(hx,hy,hz);
  heliModel.rotation.y=yaw3;
  heliModel.rotation.z=roll3;
  heliModel.rotation.x=-pitch3*0.3;

  document.getElementById('altV').textContent=Math.floor(hy*3);
  document.getElementById('spdV').textContent=Math.abs(Math.floor(hs3*3.2));

  renderer.render(scene,camera);
}

window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
