<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">

<title>游戏中心 · MIUI工作室</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 28%,#15193a,#05070d);color:#eaf0ff;font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;text-align:center}
.box{max-width:440px;padding:40px}
.ic{font-size:74px;animation:fl 2.4s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
h1{font-size:24px;margin:18px 0 8px;background:linear-gradient(135deg,#7b5cff,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
p{color:#9aa7c7;font-size:14px;line-height:1.8}
.tag{display:inline-block;margin:16px 0;padding:6px 14px;border:1px solid rgba(123,92,255,.4);border-radius:20px;font-size:12px;color:#9aa7c7}
a{display:inline-block;margin-top:6px;padding:11px 22px;border-radius:24px;background:linear-gradient(135deg,#7b5cff,#00d4ff);color:#fff;text-decoration:none;font-weight:700;font-size:14px}
</style>
</head>
<body>
<div class="box">
 <div class="ic">🎮</div>
 <h1>游戏中心</h1>
 <p>该轻应用正在加紧开发中<br>敬请期待，马上就能即点即玩 🚀</p>
